  87:
    decision: not_followed
    reason: >-
      Adds a fourth exception to Art. 50(2), whose exceptions are listed in the Article: standard
      editing, no substantial alteration, authorisation by law. The Commission's reading cannot add
      one, so AIA-RULE-TR-A50-2 applies to strictly technical industrial output as the Act does.
  88:
    decision: not_followed
    reason: >-
      Lets ephemeral real-time content skip marking where marking is not feasible. Art. 50(2)'s "as
      far as this is technically feasible" qualifies how effective, interoperable, robust and
      reliable the marking solution must be, not whether outputs are marked; the Article's listed
      exceptions do not include this one, so AIA-RULE-TR-A50-2 applies as the Act does.
