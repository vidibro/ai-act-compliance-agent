# Decision for every numbered paragraph of paragraphs.yaml, checked by aiact.guidance_coverage.
# used: quoted in a snippet a question or rule is handed. not_followed: quoted, handed to nothing,
# with the reason. no_effect: changes no answer this product gives, with the reason. A paragraph
# not yet read is listed under awaiting_review — declared debt, never silence.
