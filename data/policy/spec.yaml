  # ART. 55 IS FOUR DUTIES ON TOP OF ARTS. 53 AND 54, and the paragraph says so in terms — "in
  # addition to", not instead of. They are split for the reason Art. 53(1) is: a model that
  # documents its evaluations thoroughly and says nothing about the physical security of its
  # training cluster has met (a) and breached (d), and one verdict would hide that.
  #
  # EVERY ONE OF THEM TURNS ON THE ART. 51 LINE, which nothing answers. That is why each carries
  # the same condition rather than a route or an area gate: the ruleset can say what a
  # systemic-risk provider owes without being able to say whether this provider is one.
  - rule_id: AIA-RULE-GP-A55-1A
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 55
      paragraph: 1
      point: "a" # model evaluation and adversarial testing
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      OWED ONLY BY A MODEL WITH SYSTEMIC RISK under Art. 51(1) — either high impact capabilities,
      which Art. 51(2) presumes above 10^25 cumulative training FLOP, or a Commission designation
      under Art. 51(1)(b) on the Annex XIII criteria. The systemic_risk node reads what the
      document states and this tool estimates nothing; a stated figure below the threshold defeats
      the Art. 51(2) presumption and settles neither limb, so the answer never withholds this
      duty. The Art. 52(6) list the Commission maintains is the authoritative answer.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Model evaluation carried out in accordance with STANDARDISED PROTOCOLS AND TOOLS REFLECTING
      THE STATE OF THE ART, and adversarial testing that is both CONDUCTED AND DOCUMENTED. The
      documented half is what makes the duty checkable: an internal red-team exercise nobody wrote
      up does not satisfy the point. The stated purpose is identifying and mitigating systemic
      risks, so an evaluation measuring capability on benchmarks and never asking what could go
      wrong at Union level is the wrong instrument however rigorous. A provider that also owes
      Art. 53(1)(a) files both halves in Annex XI Section 2: the evaluation strategies and results
      under Section 2(1), and the adversarial-testing measures — with any model adaptations,
      alignment and fine-tuning — under Section 2(2).
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

  - rule_id: AIA-RULE-GP-A55-1B
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 55
      paragraph: 1
      point: "b" # assess and mitigate systemic risks at Union level
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      Owed only by a model with systemic risk under Art. 51(1). See AIA-RULE-GP-A55-1A.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Assessment AND mitigation of possible systemic risks AT UNION LEVEL, including their SOURCES,
      covering risks that may stem from the model's development, from its placing on the market and
      from its use. Three things narrow it: the level is Union-wide rather than product-level, so a
      per-deployment risk register does not answer it; sources are named separately from risks, so
      an assessment listing harms without tracing where they come from is incomplete; and the
      development phase is inside scope, so risks are owed an answer before the model ships. The
      mitigation half is a duty of its own — an assessment that identifies a risk and stops there
      has met half the point. NO ANNEX XI ITEM CORRESPONDS TO THIS DUTY: Section 2 enacts three
      items and they are the evaluation strategies, the adversarial-testing and model-adaptation
      measures, and the system architecture — all of them Art. 55(1)(a)'s subject or the model's
      description, none of them the Union-level risk assessment and mitigation this point
      requires. So a provider that files its Annex XI documentation and stops has not answered
      this, and where the assessment is recorded is the provider's own choice.
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

