  - rule_id: AIA-PO-A72
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 72
      paragraph: 1 # establish and document a post-market monitoring system
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # 72(2) is what the system established under 72(1) must DO: actively and systematically collect,
    # document and analyse performance data over the lifetime, so the provider can evaluate
    # continuing compliance with Chapter III Section 2. Supplied rather than cited, because a
    # provider that has established nothing breaches 72(1) and the finding belongs there.
    # 72(3) is the other half of the same duty: the system must be BASED ON a post-market
    # monitoring plan, and that plan must sit inside the Annex IV technical documentation. The
    # second sentence is separately shown to a judge — Annex IV point 9 names the plan and
    # AIA-HR-A11 carries Annex IV verbatim — but the first is a requirement on the monitoring
    # SYSTEM, which is this rule's subject and nobody else's.
    qualified_by:
      - article: 72
        paragraph: 2
      - article: 72
        paragraph: 3
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      An operating post-market monitoring system at the provider, and evidence that it ACTIVELY AND
      SYSTEMATICALLY collects, documents and analyses performance data over the system's lifetime —
      from deployers and from other sources — so that continuing compliance with Chapter III
      Section 2 can be evaluated. A system that exists on paper and gathers nothing satisfies
      Art. 72(1) and not Art. 72(2). Art. 72(3) adds that the system must be BASED ON a written
      post-market monitoring plan — monitoring carried on ad hoc, however diligently, is not this —
      and that the plan belongs inside the Annex IV technical documentation, where AIA-HR-A11 does
      reach it. The duty is to run it; that is an operational process, not a property of the
      documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # THE WHOLE ARTICLE, because a reporting duty without its deadline is not the duty. Art. 73(1)
  # says a serious incident must be reported; (2) to (5) say WHEN — immediately on establishing a
  # causal link and within 15 days, two days for a widespread infringement or a critical
  # infrastructure incident, immediately on death — and (6) says what happens after: investigate,
  # risk-assess, cooperate with the authority and the notified body, and do not alter the system
  # before informing them. Citing (1) alone puts a procedure in front of the judge and none of the
  # timing that makes one adequate.
  - rule_id: AIA-PO-A73
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 73 # whole article: report serious incidents, by when, and what follows
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A serious-incident reporting procedure toward market surveillance authorities, carrying the
      Article's DEADLINES: immediately on establishing a causal link and in any event within 15 days
      of becoming aware; two days for a widespread infringement or an incident to critical
      infrastructure; immediately, and no later than 10 days, where a person has died. An initial
      incomplete report followed by a complete one is expressly allowed, so a procedure that waits
      for certainty before reporting at all is wrong. Also the post-report duties: investigate the
      incident and the system, risk-assess it, cooperate with the authority, and take no action that
      alters the system before informing them. A relational post-market obligation, not visible in
      the technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A75-1a
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 75
      paragraph: 1a # serious incidents go to the AI Office, not the national authority
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # A DIFFERENT ADDRESSEE, not a second report. Art. 75(1a) opens "by way of derogation from
    # Article 73", so where it applies it REPLACES that Article's addressee and leaves everything
    # else standing — 73(2) to (9) apply mutatis mutandis, so the deadlines above are unchanged.
    # Reported beside AIA-PO-A73 rather than folded into it because the condition is a fact about
    # the provider, not about the system: whether the high-risk system is built on a general-purpose
    # model the same provider supplies, or is a component of a VLOP or VLOSE under Art. 75(1). That
    # is not derivable from a description of the system, so it is stated for the reader.
    activation_condition: >-
      Art. 75(1a) binds only the providers Art. 75(1) puts under the AI Office's exclusive
      competence, and that paragraph has a limb and four exceptions that are easy to read past.
      IN: (a) a system based on a general-purpose AI model where the model and the system are
      developed by the same provider OR BY PROVIDERS FORMING PART OF THE SAME UNDERTAKING as that
      provider — so a group where one company trains the model and a sister company ships the system
      is inside, not outside; and (b) a system that constitutes or is integrated into a very large
      online platform or search engine designated under Regulation (EU) 2022/2065.
      OUT, even where (a) holds: (i) systems related to products covered by the Annex I
      harmonisation legislation; (ii) systems in Annex III point 2, critical infrastructure;
      (iii) systems provided by law enforcement authorities, border management authorities and
      financial institutions so far as they fall under Art. 74(6); and (iv) Annex III point 8
      systems as regards the administration of justice — note that this ruleset's `justice_democracy`
      area covers both limbs of point 8, so it cannot tell an administration-of-justice system from
      a democratic-processes one and the exception must be applied by the reader.
      A deployer is reached only where it is also the provider or part of the same undertaking.
      None of this is derivable from a description of the system, so the obligation is listed with
      the condition attached rather than asserted of every provider or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A serious-incident reporting procedure addressed to the AI OFFICE rather than to a national
      market surveillance authority. The deadlines and the post-report duties of Art. 73 are
      unchanged; only the recipient moves, and the AI Office then passes the information on to the
      national authority itself. A procedure naming only the national authority is the wrong
      addressee for a provider this Article reaches. Not visible in the technical documentation —
      confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # NOT THE OFFICE'S POWER, THOUGH IT SITS INSIDE ONE. Art. 75c(3) opens with what the AI Office
  # may order and then turns: "The operator concerned shall provide the AI Office with a
  # description of the measures it has taken". Art. 75a(6) is ruled out on the ground that an order
  # sets its own content and leaves nothing to check a file against — this is not that. The Act
  # fixes the artefact (a description of measures taken) and its timing (upon implementation); the
  # decision settles only which measures. Same shape as Art. 82(2): an authority's act creates the
  # trigger, the Regulation writes the duty.
  - rule_id: AIA-ALL-A75c-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 75c
      paragraph: 3 # the operator's description of the measures it has taken
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider, deployer]
    # EVERY GOVERNED TIER, because Art. 75c(1) reaches non-compliance with "the relevant provisions
    # of this Regulation" without naming one — an Art. 50 transparency breach by a minimal-risk
    # generator built on its own provider's model is inside it.
    #
    # TWO ROLES, and the second is narrow: Art. 75(1) closes by applying the AI Office's exclusive
    # competence to the providers of those systems, and to deployers ONLY where the deployer is
    # also the provider or forms part of the same undertaking.
    qualified_by:
      - article: 75c
        paragraph: 1
    activation_condition: >-
      The duty attaches only once the AI Office has adopted an Art. 75c(1) decision establishing
      non-compliance against this operator, and only where that decision orders measures under
      75c(3). The Office reaches an operator at all only through Art. 75(1): a system based on a
      general-purpose AI model where the model and the system come from the same provider or from
      providers in the same undertaking — excluding Annex I products, Annex III point 2 critical
      infrastructure, systems provided by law enforcement, border management authorities and
      financial institutions so far as Art. 74(6) catches them, and Annex III point 8 as regards
      the administration of justice — or a system that constitutes or is integrated into a very
      large online platform or search engine designated under Regulation (EU) 2022/2065. None of
      that is derivable from a description of the system, so the obligation is listed with the
      condition attached rather than asserted of every operator or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A description of the measures actually taken, provided to the AI Office UPON THEIR
      IMPLEMENTATION. Distinct from the information the decision itself requires under the first
      sentence, which is what the operator INTENDS to do: that one is forward-looking and ordered,
      this one is a report back and is owed by the Regulation. An operator that carries out the
      ordered measures and says nothing has complied with the decision and breached this paragraph.
      A relational enforcement obligation, not visible in the technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # NOT ART. 21 IN ANOTHER PLACE. Art. 21(1) is information and documentation demonstrating
  # conformity; 21(2) is the Art. 12(1) logs. Neither reaches the TRAINING, VALIDATION AND TESTING
  # DATA SETS, and neither says anything about the API or remote-access modality this paragraph
  # names. Annex VII point 4.3 imposes the same data-set access, but only on the notified-body route
  # and only for a provider that takes it.
  - rule_id: AIA-PO-A74-12
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 74
      paragraph: 12 # full access to documentation and to the data sets
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The ability to grant a market surveillance authority FULL ACCESS to the documentation and to
      the training, validation and testing data sets used to develop the system — including, where
      appropriate and subject to security safeguards, through an API or other technical means
      enabling REMOTE access. Retention of those data sets, and a route by which an authority can
      reach them, are the practical requirements; a provider that discarded its training data after
      release cannot satisfy this. The paragraph is bounded — "where relevant and limited to what is
      necessary to fulfil their tasks" — so it is a capability to hold ready rather than a standing
      disclosure. Distinct from Art. 21, which covers documentation and the automatically generated
      logs and reaches no data set. A relational obligation toward an authority, not visible in the
      technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # Art. 82 IS NOT ART. 79 AGAIN, and it is not Art. 20 either. Its whole premise is a system that
  # COMPLIES: 82(1) opens "finds that although a high-risk AI system complies with this Regulation,
  # it nevertheless presents a risk". Art. 20(1) fires where a provider "consider[s] or ha[s] reason
  # to consider" its system NOT in conformity, so the two triggers are disjoint and Art. 20 can
  # never reach an Art. 82 case. Like Art. 79(4) it binds "the provider or other relevant operator",
  # which is Art. 3(8) — five roles here, product manufacturer left off on the ground the ledger
  # records for that role.
  #
  # HIGH-RISK ONLY, unlike AIA-ALL-A79: 82(1) names a high-risk AI system, where Art. 79 reaches any
  # system presenting a risk.
  - rule_id: AIA-ALL-A82
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 82
      paragraph: 2 # corrective action across every unit, on the authority's timeline
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role:
      [provider, deployer, importer, distributor, authorised_representative]
    # 82(1) is the authority's finding and carries the trigger this duty hangs from — supplied
    # rather than cited, because the finding is the authority's act and the duty is the operator's.
    qualified_by:
      - article: 82
        paragraph: 1
    activation_condition: >-
      Art. 82 attaches only after a market surveillance authority has performed an Art. 79
      evaluation, consulted the relevant Art. 77(1) body, and found that the system COMPLIES with
      this Regulation yet still presents a risk to health, safety, fundamental rights or another
      aspect of public interest protection. Until that finding there is no duty. Nothing in a
      description of the system says whether it has been made, so the obligation is listed with the
      condition attached rather than asserted of every operator or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A procedure for acting on an Art. 82(1) finding: ensuring corrective action is taken across
      ALL the systems concerned that this party has made available on the Union market — not only
      the unit the authority examined — within the timeline the authority prescribes. The measures
      82(1) can require reach withdrawal and recall. Distinct from Art. 20, which a provider starts
      itself on its own suspicion that the system is NOT in conformity: this one begins with an
      authority's finding that it IS, and binds every operator in the chain rather than the provider
      alone. A relational enforcement obligation, not visible in the technical documentation —
      confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # Art. 79 binds the OPERATOR — Art. 3(8): provider, product manufacturer, deployer, authorised
  # representative, importer or distributor — which is why this is filed AIA-ALL- and carries five
  # roles where every other rule carries one or two. The sixth, product manufacturer, is left off on
  # the ground the ledger already gives for the role as a whole: Art. 25(3) makes a manufacturer who
  # places a high-risk system on the market with their product THE PROVIDER, so they are reached
  # through the gap graph's reallocation question and owe the provider set, this rule included.
  # Giving them a column of their own here would assert a separate obligation set for a party the
  # Act folds into another.
  #
  # EVERY GOVERNED TIER, because Art. 79 reaches any "AI system presenting a risk" rather than a
  # tier, and 79(6)(d) names non-compliance with Art. 50 as a ground — so a minimal-risk generator
  # in breach of Art. 50(2) owes it. Narrowing to high_risk would drop exactly the case the Article
  # names.
  - rule_id: AIA-ALL-A79
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 79
      paragraph: 4 # ensure corrective action across every unit made available
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role:
      [provider, deployer, importer, distributor, authorised_representative]
    # CONTINGENT, and the condition is an event rather than a fact about the system: neither duty
    # exists until a market surveillance authority opens an Art. 79 evaluation. Stated here rather
    # than used to withhold the rule, for the reason the Art. 27 condition is: no document settles
    # whether an authority has acted, and a party that has been contacted needs to know what it owes
    # before it goes looking.
    activation_condition: >-
      Art. 79(2) and (4) attach once a market surveillance authority has sufficient reason to
      consider the system to present a risk and opens an evaluation. Until then neither duty is
      live. Nothing in a description of the system says whether that has happened, so the obligation
      is listed with the condition attached rather than asserted of every operator or dropped.
    # 79(2)'s final sentence is the cooperation duty, and the paragraph around it is the
    # authority's procedure — so it is supplied here rather than cited, which would make the finding
    # point at a procedure this party does not carry out.
    qualified_by:
      - article: 79
        paragraph: 2
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A procedure for responding to a market surveillance authority's evaluation under Art. 79: the
      duty in 79(2) to COOPERATE as necessary with that authority and with the Art. 77(1)
      fundamental-rights bodies, and the duty in 79(4) to ensure appropriate corrective action is
      taken in respect of ALL the systems concerned that this party has made available on the Union
      market — not only the unit the authority examined. Distinct from Art. 20, which a provider
      starts itself on its own suspicion; this one begins with the authority's requirement and binds
      every operator in the chain. A relational enforcement obligation, not visible in the technical
      documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 6(4) — obligation attaching to NOT-HIGH-RISK (derogated) Annex III systems.
  # Shows that risk-class filtering is real: this rule never applies to a high_risk use case.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-NHR-A06-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 6
      paragraph: 4 # document the not-high-risk assessment + register under Art. 49(2)
      act_version_date: 2026-07-27
    applies_to_risk_class: [not_high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      A documented not-high-risk assessment: which Art. 6(3) derogation condition is relied upon and
      why the system does not pose a significant risk. The reasoning IS expected in the
      documentation, hence document-verifiable.
    document_verifiable: true
    effective_date: 2027-12-02
    effective_date_note: >-
      THIS DATE IS CONTESTED, and the Regulation does not settle it. Art. 113 moves Chapter III
      Section 1 — which contains Art. 6 — but its two limbs reach "AI systems classified as
      high-risk pursuant to Article 6(2)" and "pursuant to Article 6(1)". Art. 6(4) binds a provider
      who concluded their system is NOT high-risk, so neither limb reaches it in terms. Two readings
      are open. On the one taken here the duty applies from 2 December 2027, tracking Art. 6(3) —
      the paragraph whose conclusion it documents, which derogates from Art. 6(2) alone and can
      never reach an Annex I system. On the other it falls back to the general date of 2 August
      2026, which has passed, and the duty is owed NOW. Neither reading is tidy: Art. 6(4) also
      makes the provider subject to the Art. 49(2) registration, and Art. 49 sits in Section 5,
      which was not moved — so on the text that registration is already due, sixteen months before
      the assessment it registers. A provider relying on an Art. 6(3) derogation should take advice
      on which date binds them rather than the later one by default.
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 4 — AI LITERACY. The only obligation here that binds BOTH roles and EVERY tier the
  # Regulation governs. Its absence was a real hole: `RiskClass.MINIMAL` says a minimal system is
  # inside the Act and still owes Art. 4, but with no rule carrying it `select_rules` returned an
  # empty set for minimal — indistinguishable from out_of_scope, which is the exact collapse the
  # OUT_OF_SCOPE docstring calls the whole point of the class.
  #
  # Not listed for `prohibited`: the review gate stops there, and a report telling a provider to
  # train staff on a system that may not be operated at all would be absurd.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-ALL-A04
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 4
      # PARAGRAPH 1, not the article. Until the 2026-07-27 consolidation Art. 4 was a single
      # unnumbered block and citing it whole was citing the duty. Reg (EU) 2026/1744 replaced it
      # with three paragraphs, and only the first binds providers and deployers: (2) is a support
      # duty of the Commission and the Member States, (3) a task of the Board. Citing the article
      # whole would now quote two other bodies' duties as the reader's own.
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider, deployer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Measures taken to support the development of AI literacy among staff and others operating the
      system on the organisation's behalf — training, briefing or competence requirements, pitched
      to their technical knowledge and to the context the system is used in, and to the persons it
      is used on. An organisational measure, not a property of the system. The duty is to take the
      MEASURES: the paragraph says in terms that it does not require guaranteeing any particular
      level of literacy in any individual, so evidence of a programme satisfies it and an
      attainment record is not what is being asked for.
    document_verifiable: false
    # Chapter I, so Art. 113(a): in application since 2 February 2025 — earlier than every other
    # rule here, and already owed today.
    effective_date: 2025-02-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 50 — TRANSPARENCY. The only rules here that do not gate on a risk class, because Art. 50
  # does not: it cuts ACROSS the Art. 6 tiers, and it is ADDITIVE to them. Art. 50(6) says so in
  # terms — paragraphs 1 to 4 "shall not affect the requirements and obligations set out in
  # Chapter III" — so a high-risk system that generates content owes 50(2) AND all of Art. 9-21.
  # What varies is the DUTY, not the tier: a minimal-risk text generator owes 50(2), and a
  # high-risk candidate scorer owes no Art. 50 duty at all — because it generates nothing and
  # holds no conversation, NOT because of its tier. No set of risk classes expresses "whenever
  # this duty attached"; `applies_to_transparency_duty` does, and naming it forbids naming
  # `applies_to_risk_class`. The duties come from the classification cascade's own `transparency`
  # answer, which every path reaches.
  #
  # The role split is the Article's, not ours: (1) and (2) bind the PROVIDER and are built into the
  # system, so a technical file can evidence them; (3) and (4) bind the DEPLOYER and are discharged
  # in front of the affected person, which no provider document shows. A validator checks each rule
  # is filed under the role TransparencyDuty.owed_by names.
  #
  # Every paragraph is disapplied for law-enforcement use authorised by law, and (1), (2) and (4)
  # carry carve-outs of their own. Those are conditions on the DUTY, resolved when the cascade
  # decided the duty attached — not re-litigated here.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-TR-A50-1
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 50
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_transparency_duty: [direct_interaction]
    applies_to_role: [provider]
    # Art. 50(5) is not a fifth duty — it says HOW the information owed under (1) to (4) must be
    # given: clearly, distinguishably, at the latest at first interaction or exposure, and meeting
    # applicable accessibility requirements. Attached to each of the four rather than modelled once,
    # because a disclosure buried in a footer breaches the paragraph that required the disclosure.
    qualified_by:
      - article: 50
        paragraph: 5
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A description of how the system tells the people it interacts with that they are dealing with
      an AI system — an opening disclosure, a persistent label, a spoken statement. The duty is on
      the DESIGN, so the technical documentation is where it shows. A provider relying on the
      "obvious to a reasonably well-informed, observant and circumspect person" exception should say
      so and say why; it is a judgement about the context of use, not a default.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-TR-A50-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 50
      paragraph: 2
      act_version_date: 2026-07-27
    applies_to_transparency_duty: [synthetic_content_marking]
    applies_to_role: [provider]
    # TWO ELEMENTS, AND THE EVIDENCE ASKS FOR BOTH. Art. 50(2) requires outputs "marked in a
    # machine-readable format AND detectable as artificially generated or manipulated"; the
    # conjunction is in the enacted words, and para (70) says fulfilling one "will not suffice".
    # Marking is the half a provider documents readily — a watermarking scheme is a design
    # decision worth writing down — and detection is the half that goes unsaid, so evidence
    # written around marking alone would PASS a system whose marks only its own provider can read.
    #
    # Para (71) settles what the MARK has to be, and what a human-visible label does and does not
    # do about it; (75) and (76) settle what DETECTION has to be — available to the persons
    # exposed, human-readable, and resting on publicly-available industry standards where they
    # exist. All three are the Commission's non-binding reading, cited rather than asserted.
    guidance_refs:
      - C-2026-5054/machine-readable-marking-defined
      - C-2026-5054/both-elements-required
      - C-2026-5054/detection-must-be-available
    # Art. 50(5) is not a fifth duty — it says HOW the information owed under (1) to (4) must be
    # given: clearly, distinguishably, at the latest at first interaction or exposure, and meeting
    # applicable accessibility requirements. Attached to each of the four rather than modelled once,
    # because a disclosure buried in a footer breaches the paragraph that required the disclosure.
    qualified_by:
      - article: 50
        paragraph: 5
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      TWO things, and BOTH are required — the paragraph is a conjunction, and documentation
      answering only the first does not reach the obligation.
      (1) MARKING. The technical solution that marks generated output as artificially generated or
      manipulated, in a MACHINE-READABLE format — a named watermarking, provenance or metadata
      scheme, and what it survives. Machine-readable means a mark software can identify and extract
      WITHOUT human intervention, so a statement that outputs are "labelled as AI", with nothing
      about how a machine detects it, does not reach the obligation. A visible label is not a mark
      against the provider either: it is expressly allowed as a COMPLEMENT, and it helps a deployer
      meet the separate Art. 50(4) duty — so its presence is neither the answer nor a fault.
      (2) DETECTION. That the marked output is DETECTABLE — a detection tool or method, and how the
      persons potentially exposed to the content can reach it. Embedding a mark that only the
      provider can read is the failure this half exists to catch. Look for a named detection
      mechanism, whether it is a publicly-available industry standard or the provider's own, and
      whether its result is human-readable. Silence on detection is a GAP even where the marking
      scheme is described in full.
      The paragraph also asks that the solutions be effective, interoperable, robust and reliable as
      far as technically feasible, and a single technique or a combination may be used.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-TR-A50-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 50
      paragraph: 3
      act_version_date: 2026-07-27
    applies_to_transparency_duty: [emotion_or_biometric_categorisation]
    applies_to_role: [deployer]
    # Art. 50(5) is not a fifth duty — it says HOW the information owed under (1) to (4) must be
    # given: clearly, distinguishably, at the latest at first interaction or exposure, and meeting
    # applicable accessibility requirements. Attached to each of the four rather than modelled once,
    # because a disclosure buried in a footer breaches the paragraph that required the disclosure.
    qualified_by:
      - article: 50
        paragraph: 5
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      How the deployer informs the people exposed to the emotion recognition or biometric
      categorisation system that it is operating, and the data-protection basis under Regulation
      (EU) 2016/679, Regulation (EU) 2018/1725 or Directive (EU) 2016/680. Discharged in front of
      those people, by the operating organisation — a provider's technical file cannot show it, so
      confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-TR-A50-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 50
      paragraph: 4
      act_version_date: 2026-07-27
    # BOTH duties of paragraph 4, on one rule. Its two subparagraphs are one provision reached by
    # either — deep fakes in the first, published public-interest text in the second — and
    # LegalSource cites no finer than the paragraph, so splitting would mean two rules quoting the
    # same law and citing it identically.
    applies_to_transparency_duty: [deep_fake_disclosure, public_interest_text_disclosure]
    applies_to_role: [deployer]
    # Art. 50(5) is not a fifth duty — it says HOW the information owed under (1) to (4) must be
    # given: clearly, distinguishably, at the latest at first interaction or exposure, and meeting
    # applicable accessibility requirements. Attached to each of the four rather than modelled once,
    # because a disclosure buried in a footer breaches the paragraph that required the disclosure.
    qualified_by:
      - article: 50
        paragraph: 5
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The deployer's disclosure that the content is artificially generated or manipulated. For an
      evidently artistic, creative, satirical or fictional work the duty is reduced to disclosing
      that such content exists, in a way that does not hamper enjoyment of the work. For published
      text informing the public on matters of public interest, the duty falls away where the content
      had human review or editorial control and a named person holds editorial responsibility — so
      whether such a process exists is what settles it. A publication practice, not a property of
      the system — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 26-27 — DEPLOYER obligations for high-risk systems. A distinct duty-holder: the party
  # that operates the system, not the one that built it. Reported so a provider's report names
  # what its customers will owe, and so a deployer reading it is not told only the provider's half.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-DP-A26
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 26
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The deployer's own operating measures: using the system per the instructions for use,
      assigning human oversight to competent and adequately supported people, controlling input
      data relevance where the deployer supplies it, monitoring operation and reporting risks and
      serious incidents to the provider, retaining logs for at least six months, and — where the
      deployer is an employer — informing workers and their representatives before use at the
      workplace. Held by the operating organisation, so a provider's technical file cannot evidence
      it.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-DP-A27
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 27
      paragraph: 1 # the assessment duty and its (a)-(f) required contents
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    # Art. 27(1) opens on "a high-risk AI system referred to in Article 6(2)" — the Annex III route
    # only, so an Annex I safety component is never reached — "with the exception of" point 2.
    applies_to_annex_iii_area:
      [
        biometrics,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    # The rest of the paragraph is not about the system at all, and no document settles it. It is
    # stated for the reader to answer rather than guessed at — the discipline Art. 6(1)(b) and
    # Art. 2(4) already follow in the cascade.
    activation_condition: >-
      Art. 27(1) does not bind every deployer of an Annex III system. It binds deployers that are
      bodies governed by public law or private entities providing public services; and, whoever the
      deployer is, deployers of the systems in Annex III point 5(b) — evaluating creditworthiness or
      establishing a credit score, other than for detecting financial fraud — and 5(c), risk
      assessment and pricing for life and health insurance. The first limb turns on what the
      deploying organisation IS; the second on a sub-point of Annex III finer than this ruleset
      classifies to. Neither is derivable from a description of the system, so the obligation is
      listed with this condition attached rather than asserted of every deployer or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A fundamental rights impact assessment carried out BEFORE first use, covering the deployer's
      processes, the period and frequency of use, the categories of persons affected, the specific
      risks of harm to them, the human oversight measures, and what happens if those risks
      materialise. Art. 27(2) lets a deployer rely on an earlier assessment, or on the provider's,
      in similar cases; Art. 27(3) then requires the result to be notified to the market
      surveillance authority. Where a data protection impact assessment under Art. 35 GDPR already
      meets part of this, Art. 27(4) makes the fundamental rights assessment COMPLEMENT it rather
      than replace it — an existing DPIA is not on its own an answer here.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 25(2) — the duty that survives losing the provider role, and the only rule in this spec
  # whose activation is answered by a QUESTION rather than by the classification.
  #
  # Art. 25 does three different things and only one of them is a rule. Paragraphs (1) and (3)
  # ASSIGN the provider role — the party they catch owes Art. 16, which is modelled rule by rule
  # already, so a rule here would double-count. Paragraph (2) is different: it says the initial
  # provider "shall no longer be considered to be a provider of that specific AI system", and then
  # imposes a duty on it anyway. That duty has no holder until the role has moved, which is why the
  # rule carries `requires_provider_reallocation` and the gap graph's `roles` node feeds
  # `select_rules`.
  #
  # Paragraph (4)'s written-agreement duty between a high-risk provider and its component suppliers
  # is NOT modelled: it is discharged in a contract with a third party, not in the technical
  # documentation this tool reads, so a document check could only ever report "not found".
  # ------------------------------------------------------------------------------------------
  # Art. 27 is THREE duties on one assessment: carry it out, keep it current, file it. AIA-DP-A27
  # carries the first and its required contents. The other two are separate obligations with
  # separate failure modes — an assessment that was right at first use and never revisited, and a
  # complete assessment that was never sent — so each is its own rule and its own finding.
  - rule_id: AIA-DP-A27-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 27
      paragraph: 2 # keep the assessment up to date
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    applies_to_annex_iii_area:
      [
        biometrics,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    activation_condition: >-
      Art. 27(1) does not bind every deployer of an Annex III system, and this paragraph follows it:
      it binds deployers that are bodies governed by public law or private entities providing public
      services; and, whoever the deployer is, deployers of the systems in Annex III point 5(b) —
      evaluating creditworthiness or establishing a credit score, other than for detecting financial
      fraud — and 5(c), risk assessment and pricing for life and health insurance. Neither limb is
      derivable from a description of the system, so the obligation is listed with this condition
      attached rather than asserted of every deployer or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A trigger for UPDATING the fundamental rights impact assessment: where the deployer considers,
      during use, that any element listed in Art. 27(1) has changed or is no longer up to date, it
      must take the necessary steps to update the information. The paragraph also settles two things
      in the deployer's favour — the Art. 27(1) duty attaches to FIRST use, and in similar cases the
      deployer may rely on an assessment already carried out, its own or the provider's — so a
      deployer reusing an earlier assessment is doing what the Article allows, provided it is still
      current. A process obligation, not visible in the technical documentation — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-DP-A27-3
