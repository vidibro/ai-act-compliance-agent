  # THE CHAPTER V TWIN OF ART. 21 AND ART. 74(12), and it is a provider duty on its face —
  # "Providers of general-purpose AI models shall cooperate". Not documentable and modelled anyway,
  # for the reason AIA-RULE-PO-A21 and AIA-RULE-PO-A74-12 are: conduct owed to an authority is still owed,
  # and a rule is how the reader is told about it. Art. 21(3) is the one Art. 21 paragraph with no
  # rule, and only because it binds the RECEIVING AUTHORITY rather than the provider.
  # THE TWO COMMISSION-REQUEST DUTIES OF CHAPTER V. Arts. 91 and 92 are mostly the AI Office's and
  # the Commission's powers, and one paragraph of each turns and binds the provider: supply what is
  # requested. Art. 101 attaches fines to failing. Modelled for the reason AIA-RULE-GP-A53-3 and
  # AIA-RULE-PO-A74-12 are — a duty owed to an authority is owed whether or not a file evidences it.
  - rule_id: AIA-RULE-GP-A91-5
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 91
      paragraph: 5 # supply the information the Commission requests
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider, authorised_representative]
    activation_condition: >-
      Owed once the Commission makes a request under Art. 91(1) or (3) — the second of which follows
      a substantiated request from the scientific panel. Art. 91(2) lets the AI Office open a
      structured dialogue first, so a request is not always the opening move. The representative is
      named in the paragraph itself and owes it alongside the provider.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      SUPPLY OF THE INFORMATION REQUESTED, in the form and by the deadline the request sets under
      Art. 91(4) — which must also state the Art. 101 fines for supplying information that is
      incorrect, incomplete or misleading. Who may answer is settled by the paragraph: for legal
      persons, companies or firms, and where the provider has no legal personality, the persons
      authorised to represent them by law or by statute; duly authorised lawyers may supply
      information for their clients, AND THE CLIENT REMAINS FULLY RESPONSIBLE if what is supplied is
      incomplete, incorrect or misleading. So delegating the answer does not delegate the exposure,
      which is the part worth knowing before a request arrives. A duty to answer a request whose
      content the request sets — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

  - rule_id: AIA-RULE-GP-A92-5
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 92
      paragraph: 5 # grant the access the Commission requests
