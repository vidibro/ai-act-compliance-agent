    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      IN FORCE ALREADY, AND EARLIER THAN WHAT IT ATTESTS TO — which reads like an error and is
      not one. Regulation (EU) 2026/1744 moved Chapter III Sections 1 to 3 to 2 December 2027 for
      an Annex III system and 2 August 2028 for an Annex I one, and did NOT move Section 5, where
      this obligation sits. So the CE marking applies from the general date of 2 August 2026,
      while the Section 2 requirements it is marking conformity with wait another sixteen months or more. The
