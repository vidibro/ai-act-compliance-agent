  # THE POST-REMOTE BIOMETRIC IDENTIFICATION REGIME, which is one paragraph and six subparagraphs
  # and the densest passage in the Article. Its own rule because it reaches one kind of system used
  # by one kind of deployer, and because a reader who is not that deployer should not be reading it.
  - rule_id: AIA-RULE-DP-A26-10
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 26
      paragraph: 10 # post-remote biometric identification in a criminal investigation
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    applies_to_annex_iii_area: [biometrics, law_enforcement]
    activation_condition: >-
      A deployer of a high-risk AI system for POST-REMOTE BIOMETRIC IDENTIFICATION, using it in the
      framework of an investigation for the targeted search of a person suspected or convicted of a
      criminal offence. Both halves are conditions: another biometric system is not reached, and the
      same system used outside a criminal investigation is not reached by the authorisation duty —
      though the documentation and annual-reporting duties below bind REGARDLESS OF THE PURPOSE OR
      DEPLOYER. Gated to the biometrics and law-enforcement areas because those are where such a
      system is classified; whether a given deployment is a targeted search is a fact about the
      investigation, which no system description settles.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      JUDICIAL AUTHORISATION FIRST, and the rest follows from it. Request an authorisation from a
      judicial authority, or an administrative authority whose decision is binding and subject to
      judicial review, EX ANTE or without undue delay and no later than 48 HOURS — except where the
      system is used for the initial identification of a potential suspect on objective and
      verifiable facts directly linked to the offence. Each use is limited to what is strictly
      necessary for the investigation of a SPECIFIC criminal offence.
      IF THE AUTHORISATION IS REFUSED, use stops with immediate effect AND the personal data linked
      to that use is DELETED. Deletion is a separate duty from stopping.
      REGARDLESS OF PURPOSE OR DEPLOYER, each use is documented in the relevant police file and made
      available to the market surveillance authority and the national data protection authority on
      request, excluding sensitive operational law-enforcement data. And ANNUAL REPORTS go to both
      of those authorities on the use of post-remote biometric identification systems, which may be
      aggregated across deployments.
      All of it without prejudice to Art. 9 of Regulation (EU) 2016/679 and Art. 10 of Directive
      (EU) 2016/680, and Member States may impose more restrictive national law. Authorisations,
      police files and annual reports are acts of the deploying authority — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active
    criteria:
      - norm_id: AIA-NORM-A026-P10-REQUEST-AUTHORISATION
      - norm_id: AIA-NORM-A026-P10-STRICT-NECESSITY
      - norm_id: AIA-NORM-A026-P10-STOP-ON-REJECTION
      - norm_id: AIA-NORM-A026-P10-DELETE-ON-REJECTION
      - norm_id: AIA-NORM-A026-P10-DOCUMENT-EACH-USE
      - norm_id: AIA-NORM-A026-P10-ANNUAL-REPORTS

