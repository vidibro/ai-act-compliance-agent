      approved system in place and to bring intended changes to the notified body before making
      them; point 4.3, full access for the notified body to the training, validation and testing
      data sets, where relevant and limited to what is necessary, through an API or other remote
      means where appropriate; point 4.4, further evidence or further tests where the body requires
      them, and tests the body carries out itself where it is not satisfied with the provider's;
