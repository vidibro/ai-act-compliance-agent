  # ------------------------------------------------------------------------------------------
  # ART. 5(2)-(4) — THE LAWFUL BRANCH OF THE REAL-TIME BIOMETRIC PROHIBITION.
  #
  # Every other point of Art. 5(1) bans outright, and a banned practice owes withdrawal and nothing
  # else. Point (h) is drafted differently: it prohibits real-time remote biometric identification
  # in publicly accessible spaces for law enforcement "unless and in so far as such use is strictly
  # necessary" for the three objectives it lists, and Art. 5(5) lets a Member State authorise that
  # use within those limits. A deployer operating under such a national authorisation is not
  # outside Art. 5 — it is inside the exception, and paragraphs 2, 3 and 4 are the conditions the
  # Article attaches to being there.
  #
  # REPORTED ALONGSIDE THE PROHIBITION, not instead of it. The classification still answers
  # `prohibited` and the report's scope note still says withdraw; these rules add what Art. 5 costs
  # a deployer that has the authorisation. `applies_to_prohibited_practice` is what keeps them off
  # a system banned for social scoring, which has no lawful branch.
  #
  # THE DEPLOYER, because Art. 5(2) to (4) address the law enforcement authority USING the system.
  # The provider of such a system owes Chapter III on the ordinary route where the use is lawful;
  # nothing here is a provider duty.
  - rule_id: AIA-RULE-DP-A05-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 5
      paragraph: 2 # the conditions on a use permitted under 5(1)(h)
      act_version_date: 2026-07-27
    applies_to_risk_class: [prohibited]
    applies_to_role: [deployer]
    applies_to_prohibited_practice: [realtime_remote_biometric_identification]
    activation_condition: >-
      Owed only where a MEMBER STATE HAS AUTHORISED the use under Art. 5(5) and the use is strictly
      necessary for one of the objectives in Art. 5(1), first subparagraph, point (h). Without that
      national authorisation the practice is prohibited outright and the answer is withdrawal, not
      compliance with these conditions.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Four things, all of which bind before the system is used. A completed FUNDAMENTAL RIGHTS
      IMPACT ASSESSMENT under Art. 27, and a REGISTRATION of the system in the EU database under
      Art. 49 — the paragraph makes the authorisation conditional on both, with one narrow
      exception: in duly justified cases of urgency use may begin before the registration, provided
      the registration is then completed without undue delay. The use CONFINED to confirming the
      identity of the specifically targeted individual, and not open-ended surveillance. And a
      recorded weighing of the two elements the paragraph names — the nature of the situation,
      including the seriousness, probability and scale of the harm if the system were not used, and
      the consequences of the use for the rights and freedoms of all persons concerned. The use
      must also comply with the temporal, geographic and personal limitations set by the national
      law authorising it. Acts of a law enforcement authority before a deployment rather than
      properties of a technical file — confirm separately.
    document_verifiable: false
    report_as_public_authority_notice: true
    effective_date: 2025-02-02
    effective_date_note: >-
      Art. 113(a) applies Chapters I and II from 2 February 2025. The Omnibus deferred only Art.
      5(1), first subparagraph, points (ba) and (bb) and Art. 5(1a) and (1b); paragraphs 2 to 4
      were not moved, so these conditions have bound since the Article began to apply.
    status: active

  - rule_id: AIA-RULE-DP-A05-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 5
      paragraph: 3 # prior authorisation, the 24-hour urgency route, and what a refusal costs
      act_version_date: 2026-07-27
    applies_to_risk_class: [prohibited]
    applies_to_role: [deployer]
    applies_to_prohibited_practice: [realtime_remote_biometric_identification]
    activation_condition: >-
      Owed on the same branch as AIA-RULE-DP-A05-2: a use permitted under Art. 5(1), first subparagraph,
      point (h) and authorised by a Member State under Art. 5(5).
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A PRIOR AUTHORISATION for EACH USE, granted by a judicial authority or by an independent
      administrative authority whose decision is binding, in the Member State where the use takes
      place, issued on a reasoned request. Per use, not a standing permission for the deployment.
      THE URGENCY ROUTE IS NARROW AND CARRIES A CLOCK: in a duly justified situation of urgency the
      use may begin without the authorisation, but the authorisation must then be requested without
      undue delay and AT THE LATEST WITHIN 24 HOURS. AND A REFUSAL ENDS IT: if the authorisation is
      rejected, the use shall be stopped WITH IMMEDIATE EFFECT and all the data, as well as the
      results and outputs of that use, shall be immediately discarded and deleted. A deployer that
      has an urgency procedure but no deletion procedure has answered half of this. One further
      limit binds the decision the system feeds: no decision producing an adverse legal effect on a
      person may be taken based solely on the output of the identification system. Authorisations
      obtained from a court and an operational deletion procedure rather than a property of the
      technical file — confirm separately.
    document_verifiable: false
    report_as_public_authority_notice: true
    effective_date: 2025-02-02
    effective_date_note: >-
      Art. 113(a), same as AIA-RULE-DP-A05-2 — Chapter II from 2 February 2025, and this paragraph was
      not among the points the Omnibus deferred.
    status: active

  - rule_id: AIA-RULE-DP-A05-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 5
      paragraph: 4 # the per-use notification, its minimum content and its one exclusion
      act_version_date: 2026-07-27
    applies_to_risk_class: [prohibited]
    applies_to_role: [deployer]
    applies_to_prohibited_practice: [realtime_remote_biometric_identification]
    activation_condition: >-
      Owed on the same branch as AIA-RULE-DP-A05-2, and owed WITHOUT PREJUDICE TO Art. 5(3): the
      notification is due whether or not the prior authorisation was obtained in advance or on the
      urgency route.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A NOTIFICATION OF EACH USE to TWO authorities — the relevant market surveillance authority
      AND the national data protection authority — made in accordance with the national rules
      adopted under Art. 5(5). Per use, like the authorisation, and to both bodies: notifying one
      of them is not this. WHAT IT MUST CONTAIN is a minimum and not a maximum: at least the
