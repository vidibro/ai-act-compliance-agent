  - rule_id: AIA-RULE-PO-A17
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 17
      paragraph: 1 # the QMS obligation + its (a)-(m) required aspects
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Art. 17(1). A quality management system that ensures compliance with this Regulation,
      DOCUMENTED in a systematic and orderly manner in the form of written policies, procedures and
      instructions. It shall include AT LEAST thirteen aspects: (a) a strategy for regulatory
      compliance, covering conformity assessment and the management of MODIFICATIONS to the system;
      (b) design, design control and design verification; (c) development, quality control and
      quality assurance; (d) examination, test and validation procedures before, during and after
      development, AND THE FREQUENCY with which they are carried out; (e) technical specifications
      and standards, and where harmonised standards are not applied in full OR DO NOT COVER ALL of
      the relevant requirements, the means used to meet those Section 2 requirements instead; (f)
      data management across acquisition, collection, analysis, labelling, storage, filtration,
      mining, aggregation, retention AND ANY OTHER OPERATION on the data performed before and for
      the purpose of placing the system on the market; (g) the Art. 9 risk management system; (h)
      the Art. 72 post-market monitoring system; (i) serious-incident reporting under Art. 73; (j)
      handling of communication with national competent authorities, OTHER RELEVANT AUTHORITIES
      INCLUDING THOSE PROVIDING OR SUPPORTING ACCESS TO DATA, notified bodies, other operators,
      customers and OTHER INTERESTED PARTIES; (k) record-keeping of all relevant documentation; (l)
      resource management including security of supply; (m) an accountability framework naming what
      management and staff are responsible for. An organisational system rather than a property of
      the system's technical documentation — confirm separately. Art. 17(2) scales the effort to
      the size of the organisation, an SME or SMC included, while expressly holding the degree of
      rigour and the level of protection constant: a smaller provider does less work, not less well.
      Article 17(3) allows a provider already subject to sectoral Union quality-management
      obligations to include these aspects in that existing system; it does not remove the aspects
      themselves. Article 63(1) lets an SME, including a start-up, with no partner or linked
      enterprises under Recommendation 2003/361/EC comply with certain elements in a simplified
      manner, following Commission guidelines; Article 63(2) keeps every other requirement in place.
    document_verifiable: false
