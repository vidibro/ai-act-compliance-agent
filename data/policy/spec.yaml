    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Evidence that the representative is actually ABLE to perform the mandate's tasks — access to
      the Annex XI technical documentation it must verify and keep for ten years, and to the
      information it must supply to the AI Office on reasoned request. A mandate signed and then
      starved of access satisfies Art. 54(1) and breaches this paragraph, which is why the two are
      separate rules. An arrangement between two organisations — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

