# AI Act policy specification — v0.8, high-risk scope.
#
# THIS FILE CONTAINS NO LEGAL TEXT. The enacted wording lives in exactly one place —
# data/policy/articles/*.md — written verbatim from EUR-Lex Formex XML by
# scripts/fetch_articles.py. A rule here only CITES a provision; src/aiact/policy_loader.py
# resolves source.article (+ source.paragraph) to the literal text and fills `requirement` at load
# time. Hand-writing `requirement` is rejected by the loader. This is deliberate: a paraphrased
# requirement is unverifiable, and a compliance tool must not rest on one.
#
# So each rule carries only:
#   source            — WHICH provision (the pointer; resolves to the literal text)
#   applies_to_*      — WHEN the rule activates (risk class, actor role, and where the law is
#                       area-specific, which Art. 6 route and which Annex III areas)
#   check_type        — HOW it must be verified
#   evidence_expected — NON-LEGAL, plain-language description of what would satisfy it. This is
#                       our own interpretive text and the query used for vector retrieval over the
#                       document under review. Interpretation belongs here, never in requirement.
#   document_verifiable — whether it can be seen in a system's technical documentation at all
#   activation_condition — OPTIONAL. WHICH members of the role owe this, where the Act binds only
#                       some of them on a fact about the ORGANISATION rather than the system
#                       (Art. 27 binds deployers that are bodies governed by public law, not
#                       deployers at large). It NARROWS THE DUTY-HOLDER, NOT THE REPORT: the rule
#                       is still selected and still listed under its role, with the condition
#                       carried beside it. This report covers every obligation the Act creates for
#                       every role it binds, whoever is reading it.
#
# Two families:
#   AIA-HR-*  Chapter III Section 2 (Art. 9-15) — requirements the system must meet.
#             Visible in technical documentation -> document_verifiable: true.
#   AIA-PO-*  Chapter III Section 3 (Art. 16+) + conformity/registration — provider PROCESS
#             obligations. NOT visible in a system's technical documentation
#             -> document_verifiable: false -> reported as "confirm separately", never as gaps.
#   AIA-DP-*  DEPLOYER obligations (Art. 26-27). A different duty-holder, not a different topic:
#             the party operating the system owes these, and no provider file can evidence them.
#   AIA-IP-*  INITIAL PROVIDER (Art. 25(2)) — the party that placed the system on the market and
#             then stopped being its provider when Art. 25 moved the role. One rule, owed only
#             where a reallocation actually occurred.
#   AIA-AR-*  AUTHORISED REPRESENTATIVE (Art. 22), AIA-IM-* IMPORTER (Art. 23), AIA-DI-*
#             DISTRIBUTOR (Art. 24) — the supply-chain roles, each with duties of its own.
#   AIA-ALL-* Obligations binding BOTH provider and deployer at every governed tier — Art. 4 today.
#
# High-risk obligations for Annex III systems apply from 2026-08-02 (Art. 113). That applicability
# date is carried in each rule's effective_date; status stays "active" (adopted, in force).

spec_version: "0.8.0"
act_version_date: 2024-07-12
source_note: >-
  Rule structure and scope selection derived from the EC AI Act Compliance Checker, Chapter III
  (requirements for high-risk AI systems and obligations of providers). Legal wording is NOT stored
  here: it is resolved at load time from data/policy/articles/, which is generated verbatim from
  the EUR-Lex Formex v4 XML of Regulation (EU) 2024/1689 (CELEX 32024R1689) by
  scripts/fetch_articles.py. Re-run that script to refresh against a new Act version.

rules:
  # ------------------------------------------------------------------------------------------
  # Art. 9-15 — requirements for high-risk AI systems (document-verifiable).
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-HR-A09
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 9 # whole article: the risk management system, all 10 paragraphs
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      A described risk management process covering identification and analysis of known and
      reasonably foreseeable risks to health, safety and fundamental rights, estimation under
      reasonably foreseeable misuse, evaluation against post-market monitoring data, and adoption
      of targeted mitigation measures — not a one-line assertion that "risks are managed".
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-HR-A10
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 10 # whole article: data and data governance
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Described data governance practices: design choices, provenance and collection of data,
      examination for possible biases and mitigation, identification of relevant data gaps, and
      relevance to the intended purpose. A generic "responsible AI" statement with no
      data-governance substance is INADEQUATE, not a pass.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-HR-A11
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 11
      paragraph: 1 # the drawing-up obligation + the Annex IV minimum element list
      annex: "IV"
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      Coverage of the Annex IV element list: general description of the system, its development
      process, monitoring/functioning/control, performance metrics, risk-management, and changes
      over the lifecycle. Missing elements are gaps in an otherwise-present documentation set.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-HR-A12
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 12
      paragraph: 1 # the logging capability itself
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A description that the system records events/logs automatically over its lifetime. Existence
      of the logging capability, described, is sufficient for this rule.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-HR-A13
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 13 # whole article: transparency + the Art. 13(3) instructions-for-use contents
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Instructions for use accompanying the system, covering the provider's identity, the system's
      characteristics, capabilities and limitations of performance, and the human-oversight
      measures. Substance, not a claim that "the system is transparent".
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-HR-A14
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 14 # whole article: oversight measures, incl. the (a)-(e) capabilities in para 4
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Described oversight measures: the human-machine interface tools provided, the ability of an
      operator to intervene in or stop the system, and the competencies expected of the overseer.
      "We ensure human oversight" with nothing further is INADEQUATE.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-HR-A15
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 15 # whole article: accuracy, robustness and cybersecurity
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: metrics
    evidence_expected: >-
      Declared accuracy levels and relevant accuracy metrics, robustness measures (e.g. against
      errors, faults or adversarial conditions), and cybersecurity measures. A claim of "high
      accuracy" with no numbers is INADEQUATE, not a pass.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 16+ — provider PROCESS obligations (NOT document-verifiable -> confirm separately).
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-PO-A17
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 17
      paragraph: 1 # the QMS obligation + its (a)-(m) required aspects
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Evidence of an organisational quality management system. This is a process obligation about
      the provider organisation, not a property of the system's technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A18
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 18
      paragraph: 1 # the 10-year retention duty + the (a)-(e) documents it covers
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A document-retention process at the provider. Not observable from the system's technical
      documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A19
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 19
      paragraph: 1
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A log-retention process at the provider. Distinct from Art. 12 (the system's capability to
      generate logs, which IS document-verifiable) — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A20
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 20
      paragraph: 1
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A corrective-action and notification procedure. A post-market process obligation, not visible
      in the technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A21
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 21
      paragraph: 1
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A duty to cooperate with authorities on request. A relational process obligation, not a
      property of the documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # Art. 43 splits THREE WAYS and the split is by route and area, not by anything a single rule
  # could express. Until `applies_to_annex_iii_area` existed, the spec carried 43(2) alone with a
  # comment saying "employment is Annex III point 4", and fired it at biometrics and at Annex I
  # systems too — citing the wrong paragraph and the wrong Annex, confidently, to two systems out
  # of three. The comment was the condition; now the condition is the condition.
  - rule_id: AIA-PO-A43-1
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 43
      paragraph: 1
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    applies_to_annex_iii_area: [biometrics]
    obligation_status: mandatory
    check_type: presence
    # No `annex` on the source: paragraph 1 offers a CHOICE between Annex VI and Annex VII where
    # harmonised standards were applied, and compels Annex VII where they were not. Naming one
    # would assert the branch the paragraph leaves open.
    evidence_expected: >-
      Evidence of the conformity assessment route taken for an Annex III point 1 (biometrics)
      system. Unlike every other Annex III area this one can require a NOTIFIED BODY: internal
      control (Annex VI) is available only where harmonised standards or common specifications were
      applied, and Annex VII is compulsory otherwise. Which applies turns on the standards the
      provider used, so the route and the standards relied on both have to be stated. A procedural
      act preceding market placement — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A43-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 43
      paragraph: 2
      annex: "VI"
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # Annex III points 2 to 8 — every listed area except biometrics.
    applies_to_annex_iii_area:
      [
        critical_infrastructure,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Evidence that the internal-control conformity assessment (Annex VI) was carried out. No
      notified body is involved for these areas — the paragraph says so in terms. A procedural act
      preceding market placement, not observable from the technical documentation alone — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A43-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 43
      paragraph: 3
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    applies_to_route: annex_i
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Evidence that the conformity assessment required by the product's OWN Union harmonisation
      legislation was carried out, with the Chapter III Section 2 requirements assessed as part of
      it. This Regulation does not supply the procedure here — the sectoral act does — so what is
      expected is that act's assessment, plus confirmation that the Section 2 requirements were
      inside its scope. Only Annex I Section A systems reach this rule; a Section B one owes no
      Chapter III at all under Art. 2(2) and is withheld earlier. A procedural act preceding market
      placement — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A47
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 47
      paragraph: 1
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      An EU declaration of conformity as an administrative artefact. Not part of the system's
      technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A48
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 48
      paragraph: 3 # the operative "affixed visibly, legibly and indelibly" duty
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Affixing of the CE marking. A physical/administrative act, not a property of the technical
      documentation content — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A49
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 49
      paragraph: 1
      annex: "III"
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # 49(1) reaches systems "listed in Annex III, with the EXCEPTION of point 2" — so critical
    # infrastructure owes no registration, and an Annex I system is not reached at all. Both used to
    # be raised anyway, on a rule written for employment and gated only on the tier.
    applies_to_annex_iii_area:
      [
        biometrics,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Registration in the EU database. An external act against a registry, not observable from the
      technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A49-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 49
      paragraph: 4
      annex: "VIII"
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # NOT a second registration — the same one, lodged somewhere else and carrying less. It stands
    # beside AIA-PO-A49 rather than replacing it.
    #
    # UNDER-INCLUSIVE, deliberately. Art. 49(4) reaches Annex III points 1, 6 and 7 "in the areas of
    # law enforcement, migration, asylum and border control management". Points 6 and 7 ARE those
    # areas, so they are named here. Point 1 is biometrics, which qualifies only when used FOR law
    # enforcement — and `AnnexIIIArea` records the listed area, not the sector a system is deployed
    # in, so nothing in this ruleset can tell a police face-matching system from a workplace
    # sign-in one. Naming `biometrics` here would send every biometric provider to the non-public
    # section, which is a wrong instruction rather than a cautious one. The gap is recorded in
    # `evidence_expected` so a biometrics provider is told to check it themselves.
    applies_to_annex_iii_area: [law_enforcement, migration]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Confirmation that the Art. 49 registration was made in the SECURE NON-PUBLIC section of the EU
      database, carrying only the reduced set of Annex VIII fields this paragraph lists. An external
      act against a registry — confirm separately. Note also that this paragraph reaches Annex III
      point 1 (biometrics) systems used for law enforcement, migration, asylum or border control;
      this ruleset classifies by listed AREA and not by sector of use, so a biometric system
      deployed in those sectors must check this obligation for itself.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A72
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 72
      paragraph: 1 # establish and document a post-market monitoring system
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      An operating post-market monitoring system at the provider. The duty is to run the system;
      that is an operational process, not a property of the documentation — confirm separately.
      (The presence of the post-market monitoring PLAN inside the technical documentation is a
      different question, already covered by Annex IV via AIA-HR-A11.)
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-PO-A73
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 73
      paragraph: 1 # report serious incidents to market surveillance authorities
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A serious-incident reporting procedure toward market surveillance authorities. A relational
      post-market obligation, not visible in the technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 6(4) — obligation attaching to NOT-HIGH-RISK (derogated) Annex III systems.
  # Shows that risk-class filtering is real: this rule never applies to a high_risk use case.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-NHR-A06-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 6
      paragraph: 4 # document the not-high-risk assessment + register under Art. 49(2)
      act_version_date: 2024-07-12
    applies_to_risk_class: [not_high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      A documented not-high-risk assessment: which Art. 6(3) derogation condition is relied upon and
      why the system does not pose a significant risk. The reasoning IS expected in the
      documentation, hence document-verifiable.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 4 — AI LITERACY. The only obligation here that binds BOTH roles and EVERY tier the
  # Regulation governs. Its absence was a real hole: `RiskClass.MINIMAL` says a minimal system is
  # inside the Act and still owes Art. 4, but with no rule carrying it `select_rules` returned an
  # empty set for minimal — indistinguishable from out_of_scope, which is the exact collapse the
  # OUT_OF_SCOPE docstring calls the whole point of the class.
  #
  # Not listed for `prohibited`: the review gate stops there, and a report telling a provider to
  # train staff on a system that may not be operated at all would be absurd.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-ALL-A04
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 4
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider, deployer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Measures taken to ensure a sufficient level of AI literacy among staff and others operating
      the system on the organisation's behalf — training, briefing or competence requirements,
      pitched to their technical knowledge and to the context the system is used in, and to the
      persons it is used on. An organisational measure, not a property of the system.
    document_verifiable: false
    # Chapter I, so Art. 113(a): in application since 2 February 2025 — earlier than every other
    # rule here, and already owed today.
    effective_date: 2025-02-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 26-27 — DEPLOYER obligations for high-risk systems. A distinct duty-holder: the party
  # that operates the system, not the one that built it. Reported so a provider's report names
  # what its customers will owe, and so a deployer reading it is not told only the provider's half.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-DP-A26
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 26
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The deployer's own operating measures: using the system per the instructions for use,
      assigning human oversight to competent and adequately supported people, controlling input
      data relevance where the deployer supplies it, monitoring operation and reporting risks and
      serious incidents to the provider, retaining logs for at least six months, and — where the
      deployer is an employer — informing workers and their representatives before use at the
      workplace. Held by the operating organisation, so a provider's technical file cannot evidence
      it.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-DP-A27
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 27
      paragraph: 1 # the assessment duty and its (a)-(f) required contents
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    # Art. 27(1) opens on "a high-risk AI system referred to in Article 6(2)" — the Annex III route
    # only, so an Annex I safety component is never reached — "with the exception of" point 2.
    applies_to_annex_iii_area:
      [
        biometrics,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    # The rest of the paragraph is not about the system at all, and no document settles it. It is
    # stated for the reader to answer rather than guessed at — the discipline Art. 6(1)(b) and
    # Art. 2(4) already follow in the cascade.
    activation_condition: >-
      Art. 27(1) does not bind every deployer of an Annex III system. It binds deployers that are
      bodies governed by public law or private entities providing public services; and, whoever the
      deployer is, deployers of the systems in Annex III point 5(b) — evaluating creditworthiness or
      establishing a credit score, other than for detecting financial fraud — and 5(c), risk
      assessment and pricing for life and health insurance. The first limb turns on what the
      deploying organisation IS; the second on a sub-point of Annex III finer than this ruleset
      classifies to. Neither is derivable from a description of the system, so the obligation is
      listed with this condition attached rather than asserted of every deployer or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A fundamental rights impact assessment carried out BEFORE first use, covering the deployer's
      processes, the period and frequency of use, the categories of persons affected, the specific
      risks of harm to them, the human oversight measures, and what happens if those risks
      materialise. Art. 27(2) lets a deployer rely on an earlier assessment, or on the provider's,
      in similar cases; Art. 27(3) then requires the result to be notified to the market
      surveillance authority. Where a data protection impact assessment under Art. 35 GDPR already
      meets part of this, Art. 27(4) makes the fundamental rights assessment COMPLEMENT it rather
      than replace it — an existing DPIA is not on its own an answer here.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 25(2) — the duty that survives losing the provider role, and the only rule in this spec
  # whose activation is answered by a QUESTION rather than by the classification.
  #
  # Art. 25 does three different things and only one of them is a rule. Paragraphs (1) and (3)
  # ASSIGN the provider role — the party they catch owes Art. 16, which is modelled rule by rule
  # already, so a rule here would double-count. Paragraph (2) is different: it says the initial
  # provider "shall no longer be considered to be a provider of that specific AI system", and then
  # imposes a duty on it anyway. That duty has no holder until the role has moved, which is why the
  # rule carries `requires_provider_reallocation` and the gap graph's `roles` node feeds
  # `select_rules`.
  #
  # Paragraph (4)'s written-agreement duty between a high-risk provider and its component suppliers
  # is NOT modelled: it is discharged in a contract with a third party, not in the technical
  # documentation this tool reads, so a document check could only ever report "not found".
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-IP-A25-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 25
      paragraph: 2
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [initial_provider]
    requires_provider_reallocation: true
    obligation_status: mandatory
    check_type: presence
    activation_condition: >-
      Owed only where Art. 25(1) or 25(3) has actually moved the provider role — there is no initial
      provider distinct from the provider until it does. It also falls away entirely where the
      initial provider CLEARLY SPECIFIED that its AI system was not to be changed into a high-risk
      one: the paragraph's own last sentence disapplies it, and that is a fact about the supply
      terms rather than about the system, so no technical documentation settles it.
    evidence_expected: >-
      Evidence that the party which originally placed this system on the market is cooperating with
      the new provider: the information, the reasonably expected technical access, and the other
      assistance needed to fulfil the obligations of this Regulation — in particular for the
      conformity assessment of the high-risk system. A relational duty between two organisations,
      discharged in correspondence and supply terms rather than in a technical file — confirm
      separately. Note the direction: this binds the party that has STOPPED being the provider, and
      the provider obligations elsewhere in this report are the new provider's.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Arts. 22-24 — the SUPPLY-CHAIN roles. Not a lesser tier of duty: an importer that places a
  # non-conforming system on the market breaches Art. 23 in its own right, whatever the provider
  # did. Carried here so no role the Act binds is missing from a report — an omitted role reads as
  # a clearance, and for these three that reading is simply false.
  #
  # All three are verification and record-keeping duties discharged by the party itself, so no
  # provider's technical file can evidence them: document_verifiable is false throughout, and they
  # are reported as confirmations to make rather than as gaps.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-AR-A22
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 22
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [authorised_representative]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A written mandate from a third-country provider, and evidence the representative performs it:
      verifying that the EU declaration of conformity (Art. 47) and the technical documentation
      (Art. 11) exist and that a conformity assessment was carried out; keeping the provider's
      contact details and that documentation available to authorities for 10 years after placing on
      the market; supplying it on reasoned request; cooperating on risk-mitigation action; and
      meeting the Art. 49(1) registration duty where it falls to the representative. Also the duty
      to TERMINATE the mandate, and tell the market surveillance authority, where the representative
      has reason to consider the provider in breach.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-IM-A23
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 23
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [importer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Pre-market verification by the importer that the provider carried out the Art. 43 conformity
      assessment, drew up Art. 11 / Annex IV technical documentation, affixed the CE marking with
      the EU declaration of conformity and instructions for use, and appointed an authorised
      representative under Art. 22(1). Plus the importer's own name and contact address on the
      system, its packaging or accompanying documentation; storage and transport conditions that do
      not jeopardise conformity; a 10-year copy of the notified body certificate, instructions for
      use and declaration of conformity; and cooperation with authorities on reasoned request. A
      system it has reason to consider non-conforming or falsified must NOT be placed on the market.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-DI-A24
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 24
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [distributor]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Verification, before making the system available, that it bears the CE marking and carries the
      EU declaration of conformity and instructions for use, and that the provider and importer met
      their own obligations. Plus storage and transport conditions that do not jeopardise
      conformity; corrective action where the distributor has reason to consider a system it has
      already supplied non-conforming; and information and cooperation on reasoned request. A
      system it has reason to consider non-conforming must NOT be made available.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 86 — the DEPLOYER's duty to explain a decision to the person it was taken about. Held
  # out while this tool modelled providers only, on the reasoning that it runs toward the affected
  # person rather than toward an authority. That reasoning stopped applying the moment deployer
  # obligations came in scope: it is a duty of a role this report now covers.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-DP-A86
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 86
      paragraph: 1 # the right, and the deployer duty that answers it
      act_version_date: 2024-07-12
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A route by which a person subject to a decision taken on the basis of the system's output can
      obtain clear and meaningful explanations of the system's role in that decision-making and of
      the main elements of the decision — who they ask, what they get, and in what form. Owed where
      the decision produces legal effects or similarly significantly affects the person adversely
      in their health, safety or fundamental rights. Two limits this tool cannot gate on: it does
      not reach Annex III point 2 (critical infrastructure), and it yields where Union or national
      law provides an exception. Discharged in operation by the deployer, so no provider file can
      evidence it.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active
