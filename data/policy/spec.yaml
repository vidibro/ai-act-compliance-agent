  # ART. 41 IS A COMMISSION POWER, WITH ONE PARAGRAPH THAT IS NOT. Paragraphs 1 to 4 and 6 are all
  # about adopting, assessing and repealing common specifications; 41(5) turns and binds the
  # provider that does not follow one.
  - rule_id: AIA-PO-A41-5
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 41
      paragraph: 5 # justify the equivalent technical solution
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    activation_condition: >-
      The duty exists only where the Commission has actually ADOPTED a common specification under
      Art. 41(1) covering the Section 2 requirement in question, and the provider has chosen not to
      comply with it. Art. 41(1) allows a common specification only after a standardisation request
      has failed or gone unanswered and no harmonised standard reference has been published, so
      which requirements are covered at any moment is a fact about the Official Journal rather than
      about this system. Nothing in a description of the system settles it, so the obligation is
      listed with the condition attached rather than asserted of every provider or dropped. A
      provider that DOES follow the applicable common specification owes nothing here and gains the
      Art. 41(3) presumption of conformity instead.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A written justification that the technical solutions actually adopted meet the Section 2
      requirements TO A LEVEL AT LEAST EQUIVALENT to the common specification not followed. The
      standard is equivalence, not reasonableness: an argument that the chosen approach is sound
      does not answer the paragraph unless it is measured against what the specification requires.
      "Duly justify" means the argument is recorded, so a provider that departed from a common
      specification and wrote nothing down cannot satisfy this after the fact. Which specifications
      are in force is not visible in the documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      IN FORCE ALREADY, AND EARLIER THAN WHAT IT ATTESTS TO — which reads like an error and is
      not one. Regulation (EU) 2026/1744 moved Chapter III Sections 1 to 3 to 2 December 2027 for
      an Annex III system and 2 August 2028 for an Annex I one, and did NOT move Section 5, where
      this obligation sits. So it applies from the general date of 2 August 2026, while the
      Section 2 requirements it rests on wait another sixteen months or more. The
      sequence is what Art. 113(c) says, not a transcription of it: that paragraph names Sections
      1, 2 and 3 only. Whether the legislator intended Section 5 to run ahead of them, or simply
      did not carry it across, is a question for advice rather than for this tool — which reports
      the date the Article gives and says plainly that it looks inverted.
    status: active

  # THE ONLY PROVIDER DUTY IN CHAPTER III SECTION 4. Arts. 28 to 39 govern notifying authorities
  # and notified bodies, and every other paragraph of them binds one of those two. Art. 36(8)(b) is
  # the exception: inside a paragraph about when certificates stay valid, its second half turns and
  # binds the provider holding the certificate, in writing and on a three-month clock.
  - rule_id: AIA-PO-A36-8
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 36
      paragraph: 8 # the provider's written confirmation of a replacement notified body
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # NO ROUTE GATE. An Annex III provider reaches a notified body through Art. 43(1); an Annex I
    # Section A provider reaches one through the sectoral act Art. 43(3) sends it to, and whether
    # that body is designated under Arts. 29 to 39 or under the sectoral act is a question about
    # the body, not about the system. Gating on route would drop the second case whenever the
    # answer is this Regulation. The certificate condition is stated below instead.
    activation_condition: >-
      Three things must all hold before this duty exists, and none of them is a fact about the
      system. The provider must hold a notified body certificate at all — so it took a third-party
      assessment route rather than internal control under Annex VI. That body's designation must
      then have been SUSPENDED OR RESTRICTED, which is the notifying authority's act under
      Art. 36(4); a full withdrawal is Art. 36(9) instead, and puts nothing on the provider. And
      the notifying authority must have determined, under point (b), that the body cannot go on
      monitoring and remaining responsible for existing certificates. Only then does the clock
      start. Nothing in a description of the system says whether any of it has happened, so the
      obligation is listed with the condition attached rather than asserted of every provider or
      dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A written confirmation, sent to the national competent authorities of the Member State where
      the provider has its registered place of business, WITHIN THREE MONTHS of the suspension or
      restriction, that another qualified notified body is temporarily assuming the suspended
      body's functions — monitoring and remaining responsible for the certificates for the period
      of the suspension or restriction. The provider must therefore have found that replacement
      body itself; the Article gives it no one. Missing the deadline is not a paperwork failure,
      because the certificate's continued validity under 36(8) is what rests on it. A relational
      obligation triggered by someone else's act, not visible in the technical documentation —
      confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    effective_date_note: >-
      Art. 113(b) applies Chapter III Section 4 from 2 August 2025, without any of the route splits
      Art. 113(c) writes for Sections 1 to 3. So this duty has been live since before the
      requirements the certificate attests to bind at all. That is what the dates say; it is the
      same inversion recorded on AIA-PO-A43-4, and for the same reason — the amending Regulation
      moved Sections 1 to 3 and left the rest where it was.
    status: active

  # Art. 43 splits THREE WAYS and the split is by route and area, not by anything a single rule
  # could express. Until `applies_to_annex_iii_area` existed, the spec carried 43(2) alone with a
  # comment saying "employment is Annex III point 4", and fired it at biometrics and at Annex I
  # systems too — citing the wrong paragraph and the wrong Annex, confidently, to two systems out
  # of three. The comment was the condition; now the condition is the condition.
  - rule_id: AIA-PO-A43-1
