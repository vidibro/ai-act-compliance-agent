      Art. 113(a), same as AIA-RULE-DP-A05-2.
    status: active

  # ------------------------------------------------------------------------------------------
  # ARTS. 46, 47(3), 49(2) AND 75(1e) — DUTIES ON ROUTES AND LIMBS THE ORDINARY RULES MISS.
  #
  # Each of these binds a party this report covers, and each sat outside the ruleset because the
  # thing that triggers it is a route the tool does not classify to (the Art. 46 derogation), an
  # instrument it does not carry (Art. 47(3)), a limb of a cross-reference (Art. 49(2)) or a cost
  # rather than a document (Art. 75(1e)). None of those is a reason the duty is not owed.
  - rule_id: AIA-RULE-PO-A46-1
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 46
      paragraph: 1 # the derogation, and the duty that runs while it lasts
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    activation_condition: >-
      Owed only where a market surveillance authority has AUTHORISED the placing on the market or
      putting into service under Art. 46(1), by way of derogation from Art. 43. Requesting the
      derogation is the provider's choice and granting it is the authority's; this is what the
      provider owes once it has been granted.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The Art. 43 CONFORMITY ASSESSMENT PROCEDURES CARRIED THROUGH TO COMPLETION, WITHOUT UNDUE
      DELAY, while the derogation runs. The authorisation is for a limited period and is granted
      "while the necessary conformity assessment procedures are being carried out" — it postpones
      the procedure, it does not replace it, and a provider that placed the system on the market
      under Art. 46(1) and then let the assessment lapse is in breach of this paragraph rather than
      of Art. 43. The exceptional reasons that justified the derogation — public security, the
      protection of life and health, environmental protection, or the protection of key industrial
      and infrastructural assets — bound the period, so a longer one is not covered by the grant.
      An ongoing procedure at the provider — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Art. 46 sits in Chapter III Section 5, which Art. 113(c) does not name, so it runs from the
      general date of 2 August 2026 while the Section 2 requirements the derogation postpones
      assessing wait until 2 December 2027. The same inversion as Arts. 43 and 47 to 49: the
      procedure applies before the requirements it verifies.
    status: active

  - rule_id: AIA-RULE-DP-A46-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 46
      paragraph: 2 # putting into service in urgency, and what a refusal costs
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    activation_condition: >-
      Owed only by a LAW-ENFORCEMENT OR CIVIL PROTECTION AUTHORITY that has put a high-risk system
      into service WITHOUT the Art. 46(1) authorisation, in a duly justified situation of urgency
      for exceptional reasons of public security or a specific, substantial and imminent threat to
      the life or physical safety of natural persons. No other deployer can reach this paragraph.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Two duties, and the second is the one a procedure usually lacks. The Art. 46(1) AUTHORISATION
      REQUESTED during or after the use WITHOUT UNDUE DELAY — the urgency excuses the sequence, not
      the request. And if that authorisation is REFUSED, the use of the system STOPPED WITH
      IMMEDIATE EFFECT and all the results and outputs of the use IMMEDIATELY DISCARDED. An
      authority with an emergency deployment procedure and no procedure for a refusal has answered
      the first half: the discarding is not discretionary and not deferred to a review. Acts around
      a deployment rather than properties of a technical file — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Art. 46 sits in Chapter III Section 5, so 2 August 2026, ahead of the 2 December 2027 start
      of the Section 2 requirements — as AIA-RULE-PO-A46-1.
    status: active

  - rule_id: AIA-RULE-PO-A47-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 47
      paragraph: 3 # one declaration where several instruments require one
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    activation_condition: >-
      Owed only where the system is ALSO subject to other Union harmonisation legislation that
      requires an EU declaration of conformity — in practice an Annex I product. The other
      instrument's content is not carried by this tool; what this rule states is the duty Art. 47(3)
      itself imposes about the form the declarations take.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A SINGLE EU declaration of conformity drawn up in respect of ALL Union law applicable to the
      system, not one under this Regulation alongside a separate one under the sectoral instrument.
      The duty is imposed here and is breached by the separate pair even where each is individually
      correct. And that single declaration must CONTAIN ALL THE INFORMATION REQUIRED TO IDENTIFY
      THE UNION HARMONISATION LEGISLATION it relates to — a reader has to be able to tell from the
      document which instruments it discharges. A declaration document rather than the technical
      file — confirm separately, and with a specialist in the sectoral instrument for what that
      instrument adds.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Art. 47 sits in Chapter III Section 5, which Art. 113(c) does not name, so 2 August 2026 —
      ahead of the 2 December 2027 start of the Section 2 requirements the declaration attests to.
      As AIA-RULE-PO-A47.
    criteria:
      - norm_id: AIA-NORM-A047-P3-SINGLE-DECLARATION
      - norm_id: AIA-NORM-A047-P3-IDENTIFY-LEGISLATION
    status: active

  # THE LIMB A CROSS-REFERENCE DROPS. Art. 6(4) sends a provider that self-assessed out of Annex III
  # to "the registration obligation set out in Article 49(2)", and AIA-RULE-NHR-A06-4 carries that. But
  # Art. 49(2) binds "that provider or, where applicable, the authorised representative", and
  # Art. 6(4) names only the provider — so the representative's limb arrives through neither. It is
  # not covered by Art. 22(3)(e) either, which sends the representative to Art. 49(1).
  - rule_id: AIA-RULE-AR-A49-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 49
      paragraph: 2 # registration of a system self-assessed out of Annex III
      act_version_date: 2026-07-27
    applies_to_risk_class: [not_high_risk]
    applies_to_role: [authorised_representative]
    activation_condition: >-
      Owed WHERE APPLICABLE — that is, where the provider has appointed an authorised
      representative under Art. 22 and the registration falls to it rather than to the provider.
      A provider established in the Union that registers itself leaves nothing here.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      REGISTRATION OF BOTH the representative ITSELF and the system, in the EU database referred to
      in Art. 71, BEFORE the system is placed on the market or put into service. The trigger is the
      provider's Art. 6(3) conclusion that an Annex III system is not high-risk: the system escapes
      Chapter III and does not escape the register, which is what makes the self-assessment
      reviewable. Registering the system and not the representative, or registering after placing,
      does not satisfy it. An entry in an external registry — confirm separately.
    document_verifiable: false
    effective_date: 2027-12-02
    effective_date_note: >-
      THIS DATE IS CONTESTED, on exactly the reading AIA-RULE-NHR-A06-4 sets out and for the same
      reason. Art. 49 sits in Chapter III Section 5, which Art. 113 did NOT move, so on the text
      this registration is already due from the general date of 2 August 2026. But what triggers it
      is an Art. 6(3) conclusion, and Art. 6 is in Section 1, which Art. 113(c) defers to 2 December
      2027 — so on that reading the registration cannot be owed before there is a conclusion to
      register. The later date is taken here, tracking the provider limb rather than splitting the
      paragraph between two dates for two parties. An authorised representative of a provider
      relying on an Art. 6(3) derogation should take advice on which date binds them rather than
      the later one by default. Annex III is the only door a self-assessment out of Annex III can
      come through, so the Annex I date cannot arise.
    status: active

  - rule_id: AIA-RULE-PO-A75-1E
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 75
      paragraph: 1e # AI Office competence for the assessment, and who pays for it
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    activation_condition: >-
      Owed only by the provider of a system the AI OFFICE IS EXCLUSIVELY COMPETENT FOR under
      Art. 75(1) — broadly, a system built on a general-purpose AI model by the model's own
      provider or an undertaking of the same group — that is high-risk AND subject to a third-party
      conformity assessment under Art. 43. Art. 75(1)(a) excludes Annex I products and Annex III
      point 2 systems from that competence.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      PAYMENT OF THE ASSESSMENT COSTS, BY THE PROVIDER, DIRECTLY TO THE NOTIFIED BODY. Where the AI
      Office is competent it entrusts the tests and assessments to a notified body acting on the
      Commission's behalf, and the fees are levied on the provider that applied for the assessment
      — but the paragraph routes the money past the Commission: the provider pays the body direct.
      A provider that has budgeted a fee to the Commission has the payee wrong. A commercial
      arrangement rather than a property of the technical file — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Art. 75 sits in Chapter IX, which Art. 113 does not carve out — general date, as the other
      Art. 75 rules.
    criteria:
      - norm_id: AIA-NORM-A075-P1E-FEES
      - norm_id: AIA-NORM-A075-P1E-PAY
    status: active

  # THE OTHER END OF ART. 53(1)(b). AIA-RULE-GP-A53-1B binds the MODEL provider to hand the Annex XII
  # information over; this binds the party that receives it. Art. 53(7) says "any information or
  # documentation obtained pursuant to this Article, including trade secrets, shall be treated in
  # accordance with the confidentiality obligations set out in Article 78" — and a downstream
  # provider is a party that obtains documentation pursuant to Art. 53.
  #
  # NOT A CHAPTER V RULE, despite citing Art. 53. Every other AIA-RULE-GP-* rule names `gpai_model`
  # because it binds the provider OF the model; this one binds the provider of an AI SYSTEM that
  # integrates one, whose own tier is whatever Art. 6 made it. So it names the three governed
  # system tiers instead — a prohibited or out-of-scope system reaches no obligation here for the
  # reasons those tiers reach none anywhere.
  - rule_id: AIA-RULE-PO-A53-7
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 53
      paragraph: 7 # confidentiality of what was obtained under this Article
      annex: "XII"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider]
    activation_condition: >-
      Owed only by a DOWNSTREAM PROVIDER that has actually obtained information or documentation
      under Art. 53 — in practice the Annex XII material a general-purpose AI model provider gives
      under Art. 53(1)(b) to providers intending to integrate the model. A provider that builds on
      no third-party model, or that received nothing under that Article, owes nothing here.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      CONFIDENTIAL TREATMENT of everything obtained from the model provider under Art. 53, TRADE
      SECRETS EXPRESSLY INCLUDED, on the terms Art. 78 sets: protecting in particular the
      intellectual property rights and confidential business information or trade secrets of a
      natural or legal person, INCLUDING SOURCE CODE, and the effective implementation of this
      Regulation. The duty runs the opposite way to every other obligation in this ruleset — it is
      about material the reader RECEIVED rather than material they must produce — and it is the
      price of the Art. 53(1)(b) disclosure: a model provider is compelled to hand over the Annex
      XII documentation, and this is what stops that from being a route into its model. A
      downstream provider that has folded the Annex XII material into a public integration guide,
      or passed it on unrestricted to its own customers, has breached this whatever its own
      documentation says. A confidentiality regime at the receiving organisation rather than a
      property of the technical file — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    effective_date_note: >-
      Art. 113(b) applies Chapter V from 2 August 2025. The duty arrives with the disclosure that
      triggers it, so it binds a downstream provider from the day the model provider owed the
      Annex XII material — well before the Chapter III requirements of the system built on it.
    status: active
