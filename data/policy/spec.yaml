    # 49(1) reaches systems "listed in Annex III, with the EXCEPTION of point 2" — so critical
    # infrastructure owes no registration, and an Annex I system is not reached at all. Gating on
    # the tier alone raises this obligation against both.
    applies_to_annex_iii_area:
      [
        biometrics,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Art. 49(1). BEFORE placing on the market or putting into service an Annex III high-risk AI
      system, the provider or, where applicable, the authorised representative shall register BOTH
      THEMSELVES AND THE SYSTEM in the EU database referred to in Art. 71 — two registrations, and a
      registered organisation with an unregistered system does not satisfy the paragraph. Systems
      under Annex III point 2, critical infrastructure, are excepted here and are registered at
      national level under Art. 49(5). Where the system is in the law enforcement, migration, asylum
      or border control areas, Art. 49(4) puts the entry in a secure non-public section — see
      AIA-RULE-ALL-A49-4. An act against an external registry, not observable from the technical
      documentation — confirm separately.
