  # ------------------------------------------------------------------------------------------
  # Arts. 22-24 — the SUPPLY-CHAIN roles. Not a lesser tier of duty: an importer that places a
  # non-conforming system on the market breaches Art. 23 in its own right, whatever the provider
  # did. Carried here so no role the Act binds is missing from a report — an omitted role reads as
  # a clearance, and for these three that reading is simply false.
  #
  # All three are verification and record-keeping duties discharged by the party itself, so no
  # provider's technical file can evidence them: document_verifiable is false throughout, and they
  # are reported as confirmations to make rather than as gaps.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-PO-A25-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 25
      paragraph: 4 # the written agreement with a third-party supplier
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A WRITTEN AGREEMENT between this provider and each third party supplying an AI system, model,
      tools, services, components or processes used or integrated in the high-risk system,
      specifying the information, capabilities, technical access and other assistance — on the
      generally acknowledged state of the art — that the provider needs in order to comply with this
      Regulation. A provider that cannot obtain a component's documentation still owes Arts. 9-15 on
      the finished system, which is what this agreement exists to make possible. It does NOT apply
      to a third party making tools, services, processes or components available to the public under
      a free and open-source licence, unless what is supplied is a general-purpose AI model. The AI
      Office may recommend voluntary model contract terms. Discharged in a contract with a supplier
      rather than in the technical file — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  # ART. 22 BINDS TWO PARTIES, and only one of them is the representative. Paragraphs (1) and (2)
  # are duties of the PROVIDER — appoint a representative, then enable it to do the job — while
  # (3) to (5) are the representative's own, which AIA-AR-A22 carries. One rule for both would file
  # the appointment under the party being appointed, and a third-country provider reading its own
  # column would never see the duty that applies before it may sell at all.
  - rule_id: AIA-PO-A22
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 22
      paragraph: 1 # appoint an authorised representative, by written mandate
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # Whether the provider is established in a third country is a fact about the organisation, not
    # about the system, and no description settles it — the same treatment Art. 27's public-body
    # limb gets, and for the same reason.
    activation_condition: >-
      Art. 22(1) binds providers ESTABLISHED IN THIRD COUNTRIES. A provider established in the Union
      appoints no representative and owes nothing here. Where the provider is established is not
      stated in a description of the system, so the obligation is listed with this condition
      attached rather than asserted of every provider or dropped.
    # 22(2) is the other half of the same duty and is supplied rather than cited: the finding
    # belongs to the appointment, and a representative left without documents fails both.
    qualified_by:
      - article: 22
        paragraph: 2
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A WRITTEN MANDATE appointing an authorised representative established in the Union, executed
      BEFORE the system is made available on the Union market — the appointment is a precondition of
      placing it, not a formality to follow. And evidence under Art. 22(2) that the provider ENABLES
      that representative to perform the tasks in the mandate: giving it the technical documentation
      and the declaration of conformity to hold, answering its requests, and keeping it able to
      cooperate with authorities. A representative appointed on paper and left without the documents
      it must produce does not satisfy the second half. An organisational arrangement, not visible
      in the technical documentation — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-AR-A22
