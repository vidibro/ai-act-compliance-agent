  # ==============================================================================================
  # CHAPTER V — GENERAL-PURPOSE AI MODELS. A separate track, not a lesser one.
  #
  # Every rule above answers the Art. 6 question "what tier is this system?"; these answer a
  # different one, and the two never meet. Art. 3(66) makes a SYSTEM built on a general-purpose
  # model an ordinary AI system that classifies through the cascade, so nothing here fires for the
  # products the tier logic exists for. `applies_to_risk_class: [gpai_model]` is the whole of the
  # separation — the cascade's `gpai_model` node decides which side a document is on.
  #
  # IN FORCE SINCE 2 AUGUST 2025 (Art. 113(b)), earlier than every high-risk rule in this file.
  #
  # NOTHING HERE IS document_verifiable, AND THAT IS NOT A STATEMENT ABOUT THE ARTEFACTS. Annex XI
  # technical documentation and the Art. 53(1)(d) training-content summary are documents, and a
  # judge could read a model card for them. They are withheld from the judge because the two gates
  # that decide who owes what in this chapter are answered by nobody:
  #
  #   ART. 51 SYSTEMIC RISK turns the whole of Art. 55 on. No cascade node asks it, and the two
  #     ways to answer it are both bad — training FLOP is rarely in a model card, and estimating it
  #     from a parameter count would derive a regulatory finding from a guess. The Art. 52(6) list
  #     the Commission must publish is the authoritative answer and does not appear to exist yet.
  #   THE OPEN-SOURCE CARVE-OUT of Arts. 53(2) and 54(6) turns Art. 53(1)(a) and (b) and the whole
  #     of Art. 54 off — unless the model carries systemic risk, so it depends on the first gate.
  #
  # A judge run against either gate unanswered returns a GAP for a provider that owes nothing, and
  # a false gap in a chapter with no golden set is a number nobody can check. So each rule states
  # its gate in `activation_condition` and is listed for confirmation. The two that owe nothing to
  # either gate — Art. 53(1)(c) and (d), owed by every provider open-source or not — are the ones
  # to judge first, on the day a general-purpose model reference document exists.
  # ==============================================================================================

  - rule_id: AIA-RULE-GP-A52-1
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 52
      paragraph: 1 # notify the Commission within two weeks
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      Owed only where the model meets the Art. 51(1)(a) condition — high impact capabilities, which
      Art. 51(2) PRESUMES above 10^25 cumulative training FLOP. That is the one limb a model card
      can answer, and only where it states the training compute at all. The systemic_risk node
      reads what the document says and cannot settle the condition in the negative — a figure
      below the threshold defeats the PRESUMPTION and leaves Art. 51(1)(a) standing as a
      substantive test — so this obligation is listed with the threshold attached rather than
      asserted of every provider or dropped. The presumption is rebuttable: Art. 52(2) lets the provider argue with its
      notification that the model presents no systemic risk despite meeting the condition.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A notification to the Commission, sent WITHOUT DELAY and in any event WITHIN TWO WEEKS of the
      condition being met or of it becoming known that it will be met — so the clock can start
      before the model exists, on the day the training run is planned to cross the threshold. The
      notification must carry the information demonstrating the condition is met. The only hard
      deadline in Chapter V, and missing it does not avoid the designation: Art. 52(1) lets the
      Commission designate an un-notified model itself. A filing with an authority, not a property
      of any document under review — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    criteria:
      - norm_id: AIA-NORM-A052-P1-NOTIFY-COMMISSION
      - norm_id: AIA-NORM-A052-P1-NOTIFICATION-CONTENT
    status: active

  # ART. 53(1) IS FOUR DUTIES, NOT ONE, and they do not share a fate: (a) and (b) are lifted for a
  # free and open-source model by Art. 53(2), while (c) and (d) are owed by every provider. One
  # rule for the paragraph would let a pass on the copyright policy hide a missing Annex XI file,
  # and would have to state a carve-out that applies to half of what it covers.
  - rule_id: AIA-RULE-GP-A53-1A
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 53
      paragraph: 1
      point: "a" # technical documentation containing at least Annex XI
      annex: "XI"
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      LIFTED BY ART. 53(2) for a model released under a free and open-source licence that allows
      access, usage, modification and distribution AND whose parameters — the weights included —
      model architecture and model usage information are made publicly available. All of that must
      hold; a permissive licence over closed weights is not the carve-out. And the carve-out is
      itself disapplied for a general-purpose AI model WITH SYSTEMIC RISK, which owes this duty
      whatever its licence. The open_source_release and systemic_risk nodes read what the document
      says about each, and neither can settle the carve-out: the licence limbs are the provider's
      own description, and no document puts a model outside Art. 51(1). So the obligation is
      listed with both conditions attached and withheld on neither.
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      Technical documentation of the model, drawn up and KEPT UP TO DATE, covering the training and
      testing process and the results of the evaluation, and containing at least the Annex XI
      elements: Section 1(1)'s general description — tasks, acceptable use policies, release date
      and distribution methods, architecture and parameter count, modality and format, licence —
      and Section 1(2)'s account of the model's elements and development, including the technical
      means required for the model to be integrated into AI systems, the design specifications,
      the training methodology, the provenance and curation of the training data, the COMPUTATIONAL
      RESOURCES used expressed in floating point operations, and the known or estimated energy
      consumption. A MODEL WITH SYSTEMIC RISK OWES SECTION 2 ON TOP OF SECTION 1, three items more:
      (1) a detailed description of the evaluation strategies and their results, with the criteria,
      the metrics and the methodology for identifying limitations; (2) where applicable, the
      measures put in place for internal and/or external adversarial testing such as red teaming,
      and for model adaptations including alignment and fine-tuning; and (3) where applicable, a
      detailed description of the system architecture, explaining how the software components build
      or feed into each other. Held for the AI Office and the national competent authorities
      and produced on request, so it need not be published — its absence is not visible from what a
      provider chooses to release. Note that Section 1(2)(d) is where the Art. 51(2) 10^25 FLOP
      figure would be recorded, which is the same number Art. 52(1) turns on.
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

