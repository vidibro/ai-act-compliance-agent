# AI Act policy specification — v0.8, high-risk scope.
#
# THIS FILE CONTAINS NO LEGAL TEXT. The enacted wording lives in exactly one place —
# data/policy/articles/*.md — written verbatim from EUR-Lex Formex XML by
# scripts/fetch_articles.py. A rule here only CITES a provision; src/aiact/policy_loader.py
# resolves source.article (+ source.paragraph) to the literal text and fills `requirement` at load
# time. Hand-writing `requirement` is rejected by the loader. This is deliberate: a paraphrased
# requirement is unverifiable, and a compliance tool must not rest on one.
#
# So each rule carries only:
#   source            — WHICH provision (the pointer; resolves to the literal text)
#   applies_to_*      — WHEN the rule activates (risk class OR — for Art. 50 alone — the
#                       transparency duty that attached; actor role; and where the law is
#                       area-specific, which Art. 6 route and which Annex III areas)
#   check_type        — HOW it must be verified
#   evidence_expected — NON-LEGAL, plain-language description of what would satisfy it. This is
#                       our own interpretive text and the query used for vector retrieval over the
#                       document under review. Interpretation belongs here, never in requirement.
#   document_verifiable — whether it can be seen in a system's technical documentation at all
#   activation_condition — OPTIONAL. WHICH members of the role owe this, where the Act binds only
#                       some of them on a fact about the ORGANISATION rather than the system
#                       (Art. 27 binds deployers that are bodies governed by public law, not
#                       deployers at large). It NARROWS THE DUTY-HOLDER, NOT THE REPORT: the rule
#                       is still selected and still listed under its role, with the condition
#                       carried beside it. This report covers every obligation the Act creates for
#                       every role it binds, whoever is reading it.
#
# Two families:
#   AIA-HR-*  Chapter III Section 2 (Art. 9-15) — requirements the system must meet.
#             Visible in technical documentation -> document_verifiable: true.
#   AIA-PO-*  Chapter III Section 3 (Art. 16+) + conformity/registration — provider PROCESS
#             obligations. NOT visible in a system's technical documentation
#             -> document_verifiable: false -> reported as "confirm separately", never as gaps.
#   AIA-DP-*  DEPLOYER obligations (Art. 26-27). A different duty-holder, not a different topic:
#             the party operating the system owes these, and no provider file can evidence them.
#   AIA-IP-*  INITIAL PROVIDER (Art. 25(2)) — the party that placed the system on the market and
#             then stopped being its provider when Art. 25 moved the role. One rule, owed only
#             where a reallocation actually occurred.
#   AIA-AR-*  AUTHORISED REPRESENTATIVE (Art. 22), AIA-IM-* IMPORTER (Art. 23), AIA-DI-*
#             DISTRIBUTOR (Art. 24) — the supply-chain roles, each with duties of its own.
#   AIA-TR-* TRANSPARENCY (Art. 50). The one family that does not gate on a risk class: it gates
#             on the DUTY the classification found, because Art. 50 cuts across the tiers. Split by
#             role like the Article — (1)(2) provider, (3)(4) deployer.
#   AIA-ALL-* Obligations binding BOTH provider and deployer — Art. 4 at every governed tier, and
#             Art. 49(4), which sends the registrations of BOTH parties to the database's secure
#             non-public section.
#
# PINNED TO 2026-07-27 — the consolidated text as amended by Regulation (EU) 2026/1744 (Digital
# Omnibus on AI). Requirement text below resolves from data/policy/articles/2026-07-27/.
#
# WHEN each obligation applies, per the amended Art. 113. Not one date any more:
#   Chapter III Sections 1-3 (Arts. 6-27) -> `effective_date_by_route`, because the Omnibus gave the
#       two Art. 6 doors different days: 2 DECEMBER 2027 for a system high-risk under 6(2)/Annex III,
#       2 AUGUST 2028 for one high-risk under 6(1)/Annex I. The same rule, two start dates.
#   Chapter III Section 5 (Arts. 43, 47-49) -> NOT moved. General date, 2 August 2026, already
#       passed — so conformity assessment and registration apply while the requirements they attest
#       to do not. That is what the Article says; it is not a transcription error.
#   Chapter IV (Art. 50) and Chapter IX (Arts. 72, 73, 86) -> general date, 2 August 2026.
#   Chapter I (Art. 4) -> 2 February 2025, the earliest here and owed today.
#
# These dates are RECORDED, not yet enforced: nothing gates a rule out of a report for being
# inapplicable today, so a high-risk report still raises all of Chapter III. Making the date live is
# M4d-5 and a larger change than this one — see docs/ROADMAP.md.

spec_version: "0.8.0"
act_version_date: 2026-07-27
source_note: >-
  Rule structure and scope selection derived from the EC AI Act Compliance Checker, Chapter III
  (requirements for high-risk AI systems and obligations of providers). Legal wording is NOT stored
  here: it is resolved at load time from data/policy/articles/, which is generated verbatim from
  the EUR-Lex Formex v4 XML of Regulation (EU) 2024/1689 (CELEX 32024R1689) by
  scripts/fetch_articles.py. Re-run that script to refresh against a new Act version.

rules:
  # ------------------------------------------------------------------------------------------
  # Art. 9-15 — requirements for high-risk AI systems (document-verifiable).
  # ------------------------------------------------------------------------------------------
  # Art. 8(1) is the chapeau to Arts. 9-15 and is modelled rule by rule below. Paragraph 2 is not a
  # chapeau: it is a duty of its own, and it points OUTSIDE this Regulation.
  - rule_id: AIA-PO-A08-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 8
      paragraph: 2 # compliance with the Section A sectoral instrument as well
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # NOT GATED ON THE ART. 6 ROUTE, though it reads as if it could be. The paragraph opens "where a
    # product contains an AI system, to which the requirements of this Regulation as well as
    # requirements of the Union harmonisation legislation listed in Section A of Annex I apply" —
    # two conditions about the PRODUCT and about this Regulation applying, and neither asks which
    # paragraph of Art. 6 made the system high-risk. A Section A product whose manufacturer
    # self-assesses fails Art. 6(1)(b), and the cascade carries it on to Annex III where Art. 6(2)
    # can make it high-risk; both regimes then apply and Art. 8(2) reaches it, but `_route_of`
    # answers ANNEX_III and a route gate would drop the rule. So the condition is stated instead.
    activation_condition: >-
      Art. 8(2) applies where the AI system is contained in a product that is itself covered by the
      Union harmonisation legislation listed in SECTION A of Annex I — medical devices, machinery,
      lifts, radio equipment and the rest. A system that is not part of such a product owes nothing
      here, whichever door of Art. 6 made it high-risk. Which instrument covers a given product is
      settled by that instrument rather than by this Regulation, so it is listed with the condition
      attached rather than asserted of every provider or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Evidence that the PRODUCT is compliant with the Section A Annex I instrument that governs it —
      the Medical Devices, Machinery, Lifts or other Regulation named for that product — and not
      only with this Regulation. The paragraph also gives the provider a CHOICE: the testing,
      reporting, information and documentation owed here may be integrated into the documentation
      and procedures that instrument already requires, rather than duplicated. Settled by law this
      tool does not carry, so what a competent conformity route looks like is a question for a
      specialist in that sector — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-HR-A09
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 9 # whole article: the risk management system, all 10 paragraphs
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      A described risk management process covering identification and analysis of known and
      reasonably foreseeable risks to health, safety and fundamental rights, estimation under
      reasonably foreseeable misuse, evaluation against post-market monitoring data, and adoption
      of targeted mitigation measures — not a one-line assertion that "risks are managed".
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-HR-A10
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 10 # whole article: data and data governance
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # ART. 10(1) MAKES ART. 4a(1) A QUALITY CRITERION, and the cross-reference is easy to read past.
    # 10(1) requires data sets "that meet the quality criteria referred to in paragraphs 2, 3 and 4
    # of this Article AND IN ARTICLE 4a(1) whenever such data sets are used"; 10(6) repeats it for
    # testing data. So Art. 4a(1) is not merely a permission to process special categories of
    # personal data for bias detection — its conditions (a) to (f) are conditions of complying with
    # Art. 10(1), and a provider that processes such data without the records point (f) requires
    # breaches this Article. The judge reads the pointer in Art. 10(1) either way; this supplies
    # what it points at.
    qualified_by:
      - article: 4a
        paragraph: 1
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Described data governance practices: design choices, provenance and collection of data,
      examination for possible biases and mitigation, identification of relevant data gaps, and
      relevance to the intended purpose. A generic "responsible AI" statement with no
      data-governance substance is INADEQUATE, not a pass.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-HR-A11
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 11
      paragraph: 1 # the drawing-up obligation + the Annex IV minimum element list
      annex: "IV"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      Coverage of ALL NINE Annex IV elements, which are supplied verbatim beside the Article — judge
      against that list, not against this summary of it: (1) general description of the system;
      (2) detailed description of its elements and development process, including the design
      specifications, the data requirements, the Art. 14 human-oversight assessment, the validation
      and testing procedures with their metrics, and the cybersecurity measures; (3) monitoring,
      functioning and control, including accuracy and foreseeable risks; (4) appropriateness of the
      performance metrics; (5) the Art. 9 risk management system; (6) changes over the lifecycle;
      (7) THE HARMONISED STANDARDS APPLIED, or where none were, the solutions adopted to meet
      Section 2; (8) A COPY OF THE ART. 47 EU DECLARATION OF CONFORMITY; (9) THE ART. 72 POST-MARKET
      MONITORING SYSTEM AND PLAN. Missing elements are gaps in an otherwise-present documentation
      set, and (7) to (9) are the ones a technical file most often stops short of.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-HR-A12
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 12
      paragraph: 1 # the logging capability itself
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # 12(2) is WHAT the capability must be able to record, and it is the whole substance of the
    # duty: a system that logs anything at all satisfies 12(1) while recording none of the three.
    # Supplied rather than cited, because a system with no logging at all breaches 12(1) and the
    # finding belongs there — the same relation 72(2) has to 72(1).
    qualified_by:
      - article: 12
        paragraph: 2
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Automatic recording of events over the system's lifetime, and a description of WHICH events
      the logs capture. Art. 12(2) fixes three purposes the capability must serve, and a log that
      serves none of them is not the capability the Article requires: events that would identify
      the system presenting a risk under Art. 79(1) or undergoing a substantial modification;
      events that feed the Art. 72 post-market monitoring; and events that let the deployer carry
      out its Art. 26(5) monitoring of the system in operation. "The system writes logs", with
      nothing about what is in them, does not answer this.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  # ONE FILE, NOT TWO. AIA-HR-A11 carries 11(1) — draw the documentation up, keep it current, cover
  # Annex IV — and an Annex I Section A provider satisfying it with a separate AI annex bolted to a
  # sectoral file has done what that rule asks and not what 11(2) requires.
  - rule_id: AIA-HR-A11-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 11
      paragraph: 2 # a single set of technical documentation
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # ANNEX I ONLY, and Section A at that. The paragraph opens "Where a high-risk AI system related
    # to a product covered by the Union harmonisation legislation listed in Section A of Annex I" —
    # an Annex III system has no second instrument to merge with, and Section B is withheld
    # Chapter III entirely by Art. 2(2).
    applies_to_route: annex_i
    activation_condition: >-
      Section A of Annex I, specifically. Art. 2(2) withholds Chapter III from a system high-risk
      under Art. 6(1) because of a SECTION B product — vehicles, aviation, rail, marine — so such a
      provider owes no technical documentation under this Regulation at all and nothing to merge.
      Which Section the product's instrument sits in is a fact about that instrument, and this rule
      is selected on the Annex I route alone.
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      A SINGLE document set covering both regimes: everything Art. 11(1) and Annex IV require, and
      everything the product's own harmonisation instrument requires, in one place. Two files that
      each cross-reference the other do not satisfy this — the paragraph asks for one set, so that
      an authority or notified body reading the product's documentation finds the AI system's there
      too rather than being sent elsewhere. A file that opens by scoping itself to "the AI
      component" is evidence of the split rather than of the merge.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  # THE BIOMETRIC MINIMUM. AIA-HR-A12 asks what the logs must be able to record for any high-risk
  # system; for a remote biometric identification system Art. 12(3) names four specific records, and
  # they are the ones that make an identification auditable after the fact.
  - rule_id: AIA-HR-A12-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 12
      paragraph: 3 # the minimum logging for Annex III point 1(a) systems
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # NO `annex: III`. The paragraph points at Annex III point 1(a) and the rule is already gated
    # to that area, so the judge is not being asked which area this is — it is being asked whether
    # four named records are in the logs. Supplying the whole Annex would add some 7 600 characters
    # of areas the question does not turn on to every biometric judgement.
    #
    # ANNEX III POINT 1(a) ONLY — remote biometric identification. `biometrics` is this ruleset's
    # name for the whole of point 1, so the rule is selected for categorisation and emotion
    # recognition systems too, which point 1(a) does not reach. Over-inclusive within one area, and
    # said so in the condition rather than dropped: the alternative is an area vocabulary that
    # splits point 1 three ways for this one paragraph.
    applies_to_annex_iii_area: [biometrics]
    activation_condition: >-
      Art. 12(3) binds systems referred to in point 1(a) of Annex III — REMOTE BIOMETRIC
      IDENTIFICATION. A biometric categorisation system under point 1(b) or an emotion recognition
      system under point 1(c) is in the same area and is not reached by this paragraph; both still
      owe Art. 12(1) and (2) through AIA-HR-A12. Point 1(a) also excludes verification whose sole
      purpose is confirming a person is who they claim to be, which is outside the area altogether.
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      Four specific records, described as things the logs actually hold: the PERIOD of each use,
      with a start date and time and an end date and time; the REFERENCE DATABASE the input data
      was checked against; the INPUT DATA for which the search produced a match; and the IDENTITY
      of the natural persons who verified the result under Art. 14(5). The fourth is the one most
      often missing, and it is the one that ties the Art. 14(5) two-person verification to a named
      individual after the fact — a log that records the match but not who confirmed it leaves the
      oversight requirement unevidenced. "Comprehensive audit logging" without these four is not
      this paragraph.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-HR-A13
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 13 # whole article: transparency + the Art. 13(3) instructions-for-use contents
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Instructions for use accompanying the system, covering the provider's identity, the system's
      characteristics, capabilities and limitations of performance, and the human-oversight
      measures. Substance, not a claim that "the system is transparent".
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-HR-A14
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 14 # whole article: oversight measures, incl. the (a)-(e) capabilities in para 4
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Described oversight measures: the human-machine interface tools provided, the ability of an
      operator to intervene in or stop the system, and the competencies expected of the overseer.
      "We ensure human oversight" with nothing further is INADEQUATE.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-HR-A15
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 15 # whole article: accuracy, robustness and cybersecurity
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: metrics
    evidence_expected: >-
      Declared accuracy levels and relevant accuracy metrics, robustness measures (e.g. against
      errors, faults or adversarial conditions), and cybersecurity measures. A claim of "high
      accuracy" with no numbers is INADEQUATE, not a pass.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 16+ — provider obligations. Mostly PROCESS (NOT document-verifiable -> confirm
  # separately); Art. 16(b) is the exception, and the Act itself says why.
  # ------------------------------------------------------------------------------------------
  # Art. 16 is a list of twelve points, and nine of them ((a), (c) to (j)) do nothing but
  # cross-reference Art. 17-21, 43, 47-49 — each modelled below as a rule of its own, so modelling
  # those points too would report every finding twice. THREE POINTS CROSS-REFERENCE NOTHING. They
  # are the whole of their own obligation, and until they were written here no rule asked for them.
  # Cited by point, not by article: a rule citing Art. 16 whole would resolve to the entire list.
  - rule_id: AIA-PO-A16-B
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 16
      point: b
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    # The one document-verifiable rule in this family, because the Act names the accompanying
    # documentation as a place the duty may be discharged. Not a process at the provider: an
    # identification that is either in the file or is not.
    evidence_expected: >-
      The provider's name, registered trade name or registered trade mark, and an address at which
      they can be contacted. The Act's first choice is a marking on the system itself, with the
      packaging or the accompanying documentation as fallbacks — so a file that states the marking
      is affixed to the device satisfies this as fully as one that carries the details itself. What
      does not satisfy it is documentation that identifies no provider at all and says nothing
      about where the identification sits.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-PO-A16-K
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 16
      point: k
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      An ability to demonstrate conformity with Art. 8-15 to a national competent authority on
      reasoned request. Distinct from Art. 18's retention duty and Art. 21's duty to cooperate:
      this one is about being able to SHOW the requirements are met, which is a readiness of the
      provider organisation rather than a property of the technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-PO-A16-L
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 16
      point: l
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    # Not document-verifiable, and the reason is a scope limit rather than a process: whether the
    # accessibility requirements are met is settled by two other instruments this tool does not
    # read. Judging it from an AI Act technical file would be a verdict on law we have not loaded.
    evidence_expected: >-
      Conformity with the accessibility requirements of Directive (EU) 2016/2102 (public sector
      websites and mobile applications) and Directive (EU) 2019/882 (the European Accessibility
      Act). Those instruments set the requirements; this Regulation only makes meeting them a
      provider duty. This tool reads Regulation (EU) 2024/1689 alone, so the assessment belongs
      with whoever holds the accessibility conformity evidence — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-PO-A17
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 17
      paragraph: 1 # the QMS obligation + its (a)-(m) required aspects
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Evidence of an organisational quality management system. This is a process obligation about
      the provider organisation, not a property of the system's technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-PO-A18
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 18
      paragraph: 1 # the 10-year retention duty + the (a)-(e) documents it covers
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A document-retention process at the provider. Not observable from the system's technical
      documentation — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-PO-A19
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 19
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A log-retention process at the provider. Distinct from Art. 12 (the system's capability to
      generate logs, which IS document-verifiable) — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-PO-A20
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 20
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A corrective-action and notification procedure. A post-market process obligation, not visible
      in the technical documentation — confirm separately.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-PO-A20-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 20
      paragraph: 2 # investigate the causes and inform the authorities
      act_version_date: 2026-07-27
