  - rule_id: AIA-RULE-HR-A13
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 13
      paragraph: 1 # the transparency of the system's operation itself
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # 13(2) is the QUALITY of the instructions, and it is the whole substance of 13(1)'s duty as a
    # deployer meets it: a system shipped with instructions that are neither concise, complete,
    # correct and clear nor accessible and comprehensible to deployers is not transparent enough
    # for them to interpret its output, whatever the design section says. Supplied rather than
    # cited, for the same reason 12(2) is supplied to AIA-RULE-HR-A12: a system with no instructions at
    # all breaches 13(2) and the finding belongs to the paragraph that lists their contents.
    qualified_by:
      - article: 13
        paragraph: 2
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Evidence that the system's OPERATION is sufficiently transparent for a deployer to interpret
      its output and use it appropriately — the design and development choices that make it so, not
      a claim that "the system is transparent". The type and degree of transparency is to be
      appropriate to the Section 3 obligations the provider and the DEPLOYER have to meet, so
      documentation that establishes transparency for the provider's own engineers and leaves the
      deployer unable to read an output has answered the wrong question. The instructions for use
      are the vehicle: they accompany the system in an appropriate digital format or otherwise, and
      Art. 13(2) makes their quality part of this duty — concise, complete, correct and clear, and
      relevant, accessible and comprehensible TO DEPLOYERS. WHAT they must contain is the separate
      list in Art. 13(3), which AIA-RULE-HR-A13-3 judges.
      TWO ROUTES PRESUME THIS SATISFIED, to the extent they cover it: conformity with a HARMONISED
      STANDARD whose reference is published in the Official Journal (Art. 40(1)), or with a COMMON
      SPECIFICATION the Commission has adopted (Art. 41(3)). Documentation that names the standard
      applied, and the parts of it applied, is answering this requirement through that route rather
      than avoiding it.
    document_verifiable: true
    status: active
    criteria:
      - norm_id: AIA-NORM-A013-P1-TRANSPARENT-OPERATION
      - norm_id: AIA-NORM-A013-P1-APPROPRIATE-TRANSPARENCY
      - norm_id: AIA-NORM-A013-P2-PROVIDE-INSTRUCTIONS

  # THE CONTENTS OF THE INSTRUCTIONS. AIA-RULE-HR-A13 asks whether the system is transparent and its
  # instructions fit to be read; Art. 13(3) is a list of six items the instructions "shall contain
  # at least", and (b) alone runs to seven sub-points. The same relation Art. 12(3) has to
  # Art. 12(1), and judged the same way: against the list, not against the presence of a section
  # titled "Instructions for Use".
  - rule_id: AIA-RULE-HR-A13-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 13
      paragraph: 3 # the six items the instructions for use must contain
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      Six items in the instructions for use, judged as a list and not as a section heading. (a) The
      IDENTITY AND CONTACT DETAILS of the provider and, where applicable, of its authorised
      representative. (b) The CHARACTERISTICS, CAPABILITIES AND LIMITATIONS OF PERFORMANCE, itself
      seven sub-points: the intended purpose; the level of ACCURACY INCLUDING ITS METRICS,
      robustness and cybersecurity under Art. 15 that the system was tested and validated against
      and that can be expected, together with any known or foreseeable circumstances affecting that
      expected level; known or foreseeable circumstances of use in accordance with the intended
      purpose or under reasonably foreseeable misuse that may lead to risks to health, safety or
      fundamental rights; where applicable, the technical capabilities to provide information
      RELEVANT TO EXPLAIN ITS OUTPUT; when appropriate, performance regarding the specific persons
      or GROUPS OF PERSONS the system is intended to be used on; when appropriate, specifications
      for the INPUT DATA or other information about the training, validation and testing data sets
      used; and where applicable, information enabling deployers to INTERPRET THE OUTPUT and use it
      appropriately. (c) The PRE-DETERMINED CHANGES to the system and its performance fixed by the
      provider at the initial conformity assessment, if any. (d) The Art. 14 HUMAN OVERSIGHT
      MEASURES, including the technical measures facilitating the deployer's interpretation of
      outputs. (e) The COMPUTATIONAL AND HARDWARE RESOURCES needed, the EXPECTED LIFETIME of the
      system, and any necessary maintenance and care measures INCLUDING THEIR FREQUENCY and
      including as regards SOFTWARE UPDATES. (f) Where relevant, the mechanisms in the system that
      let deployers collect, store and interpret the Art. 12 LOGS. Instructions that cover (a), (b)
      and (d) in depth and are silent on (c), (e) and (f) are short by three items, and an item
      whose content is held back from the deployer — an accuracy figure kept in an internal
      validation report — is not in the instructions at all.
      TWO ROUTES PRESUME THIS SATISFIED, to the extent they cover it: conformity with a HARMONISED
      STANDARD whose reference is published in the Official Journal (Art. 40(1)), or with a COMMON
      SPECIFICATION the Commission has adopted (Art. 41(3)). Documentation that names the standard
      applied, and the parts of it applied, is answering this requirement through that route rather
      than avoiding it.
    document_verifiable: true
    status: active
    criteria:
      - norm_id: AIA-NORM-A013-P3-A-CONTACT-DETAILS
      - norm_id: AIA-NORM-A013-P3-B-PERFORMANCE-CHARACTERISTICS
      - norm_id: AIA-NORM-A013-P3-B-I-INTENDED-PURPOSE
      - norm_id: AIA-NORM-A013-P3-B-II-PERFORMANCE-AND-AFFECTING-CIRCUMSTANCES
      - norm_id: AIA-NORM-A013-P3-B-III-RISK-CIRCUMSTANCES
      - norm_id: AIA-NORM-A013-P3-B-IV-EXPLAIN-OUTPUT
      - norm_id: AIA-NORM-A013-P3-B-V-GROUP-PERFORMANCE
      - norm_id: AIA-NORM-A013-P3-B-VI-INPUT-DATA
      - norm_id: AIA-NORM-A013-P3-B-VII-INTERPRET-OUTPUT
      - norm_id: AIA-NORM-A013-P3-C-PREDETERMINED-CHANGES
      - norm_id: AIA-NORM-A013-P3-D-HUMAN-OVERSIGHT
      - norm_id: AIA-NORM-A013-P3-E-RESOURCES-LIFETIME-AND-MAINTENANCE
      - norm_id: AIA-NORM-A013-P3-F-LOG-MECHANISMS

  - rule_id: AIA-RULE-HR-A14
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 14 # whole article: oversight measures, incl. the (a)-(e) capabilities in para 4
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      Described oversight measures: the human-machine interface tools built in, whether the measures
      are ones the provider built into the system or ones the provider identified for the DEPLOYER
      to implement, and how they are commensurate with the risks, the level of autonomy and the
      context of use. "We ensure human oversight" with nothing further is INADEQUATE. Art. 14(4)
      names five things the assigned person must be ENABLED to do, and each is a separate test of
      the interface actually shipped: to understand the system's capacities and limitations well
      enough to MONITOR it and detect anomalies, dysfunctions and unexpected performance; to remain
      aware of the tendency to rely or over-rely on the output (AUTOMATION BIAS), particularly where
      the system informs a decision a natural person takes; to CORRECTLY INTERPRET the output, given
      the interpretation tools and methods available; to DECIDE NOT TO USE the system, or to
      disregard, override or REVERSE its output; and to intervene or INTERRUPT the system through a
      'stop' button or similar procedure bringing it to a halt IN A SAFE STATE. An oversight section
      describing training and escalation but no interface capability has not answered this
      paragraph. FOR REMOTE BIOMETRIC IDENTIFICATION under Annex III point 1(a) there is one more,
      and it is the one most often understated: no action or decision may be taken on the basis of
      an identification unless that identification has been SEPARATELY VERIFIED AND CONFIRMED BY AT
      LEAST TWO NATURAL PERSONS with the necessary competence, training and authority. One reviewer,
      however well qualified, is not two, and documentation describing a single-confirmer workflow
      fails this Article whatever else it provides. The two-person requirement is disapplied only
      for law enforcement, migration, border control or asylum use where Union or national law
      considers it disproportionate — a legal fact about the use, not a design choice the
      documentation can make for itself.
      TWO ROUTES PRESUME THIS SATISFIED, to the extent they cover it: conformity with a HARMONISED
      STANDARD whose reference is published in the Official Journal (Art. 40(1)), or with a COMMON
      SPECIFICATION the Commission has adopted (Art. 41(3)). Documentation that names the standard
      applied, and the parts of it applied, is answering this requirement through that route rather
      than avoiding it.
    document_verifiable: true
    status: active
    # Each mandatory oversight capability is judged separately. The disproportionate-use exception
    # is a report-only conditional scope limit, not a pass/fail criterion.
    criteria:
      - norm_id: AIA-NORM-A014-P1-EFFECTIVE-OVERSIGHT
      - norm_id: AIA-NORM-A014-P2-RISK-PREVENTION
      - norm_id: AIA-NORM-A014-P3-COMMENSURATE-MEASURES
      - norm_id: AIA-NORM-A014-P4-A-UNDERSTAND-AND-MONITOR
      - norm_id: AIA-NORM-A014-P4-B-AUTOMATION-BIAS
      - norm_id: AIA-NORM-A014-P4-C-INTERPRET-OUTPUT
      - norm_id: AIA-NORM-A014-P4-D-DECLINE-USE-OR-CONTROL-OUTPUT
      - norm_id: AIA-NORM-A014-P4-E-INTERVENE-OR-SAFE-STOP
      - norm_id: AIA-NORM-A014-P5-TWO-PERSON-VERIFICATION

  - rule_id: AIA-RULE-HR-A15
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 15 # whole article: accuracy, robustness and cybersecurity
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: metrics
    evidence_expected: >-
      Declared accuracy LEVELS and the relevant accuracy METRICS, stated in the accompanying
      instructions for use; robustness measures; and cybersecurity measures. A claim of "high
      accuracy" with no numbers is INADEQUATE, not a pass. ROBUSTNESS is resilience to errors,
      faults or inconsistencies arising in the system or its environment, in particular from
      interaction with natural persons or other systems, addressed by technical AND organisational
      measures. A system that CONTINUES TO LEARN after being placed on the market owes one thing
      more, and it is a duty a document can breach while satisfying everything above: it must be
      developed so as to eliminate or reduce as far as possible the risk of biased outputs
      influencing input for future operations (FEEDBACK LOOPS), and to ensure any such feedback
      loops are duly addressed with mitigation measures. Documentation that describes continuous
      retraining on data the previous model selected, and treats that as acceptable, fails Art.
      15(4) however strong its accuracy figures are. CYBERSECURITY here is not general IT security:
      the Article requires resilience against unauthorised third parties altering the system's use,
      outputs or performance by exploiting vulnerabilities, and the technical solutions must address
      AI-SPECIFIC vulnerabilities where appropriate — measures to prevent, detect, respond to,
      resolve and control for attacks manipulating the training data set (DATA POISONING), attacks
      on pre-trained components used in training (MODEL POISONING), inputs designed to make the
      model err (ADVERSARIAL EXAMPLES OR MODEL EVASION), CONFIDENTIALITY ATTACKS, and MODEL FLAWS.
      An ISO 27001 certification and a list of conventional network controls name none of these and
      do not answer Art. 15(5).
      TWO ROUTES PRESUME THIS SATISFIED, to the extent they cover it: conformity with a HARMONISED
      STANDARD whose reference is published in the Official Journal (Art. 40(1)), or with a COMMON
      SPECIFICATION the Commission has adopted (Art. 41(3)). Documentation that names the standard
      applied, and the parts of it applied, is answering this requirement through that route rather
      than avoiding it. TWO FURTHER PRESUMPTIONS REACH THE CYBERSECURITY LIMB and neither reaches
      the rest of the Article. A certificate or statement of conformity under a Regulation (EU)
      2019/881 scheme whose reference is published in the Official Journal presumes compliance with
      the Art. 15 cybersecurity requirements so far as it covers them (Art. 42(2)); a system within
      the scope of Regulation (EU) 2024/2847 meeting the conditions of its Art. 12(1) is DEEMED to
      comply with them (Art. 42(3)). Accuracy and robustness are untouched by both.
    document_verifiable: true
    status: active
    # Each Article 15 provider norm is judged and reported on its own; the rule passes only when
    # every mandatory one does. Meaning is resolved from the norm inventory at load, and
    # `build_normative_coverage.py --check` fails if this list and the norms' implementation_refs
    # disagree in either direction.
    criteria:
      - norm_id: AIA-NORM-A015-P1-PERFORMANCE-AND-LIFECYCLE-CONSISTENCY
      - norm_id: AIA-NORM-A015-P3-DECLARE-ACCURACY-AND-METRICS
      - norm_id: AIA-NORM-A015-P4-RESILIENCE
      - norm_id: AIA-NORM-A015-P4-TECHNICAL-AND-ORGANISATIONAL-MEASURES
      - norm_id: AIA-NORM-A015-P4-FEEDBACK-LOOP-RISK-AND-MITIGATION
      - norm_id: AIA-NORM-A015-P5-UNAUTHORISED-ALTERATION
      - norm_id: AIA-NORM-A015-P5-APPROPRIATE-SOLUTIONS
      - norm_id: AIA-NORM-A015-P5-DATA-POISONING
      - norm_id: AIA-NORM-A015-P5-MODEL-POISONING
      - norm_id: AIA-NORM-A015-P5-ADVERSARIAL-ATTACKS
      - norm_id: AIA-NORM-A015-P5-CONFIDENTIALITY-ATTACKS
      - norm_id: AIA-NORM-A015-P5-MODEL-FLAWS

  # ------------------------------------------------------------------------------------------
  # Art. 16+ — provider obligations. Mostly PROCESS (NOT document-verifiable -> confirm
  # separately); Art. 16(b) is the exception, and the Act itself says why.
  # ------------------------------------------------------------------------------------------
  # Art. 16 is a list of twelve points, and nine of them ((a), (c) to (j)) do nothing but
  # cross-reference Art. 17-21, 43, 47-49 — each modelled below as a rule of its own, so modelling
  # those points too would report every finding twice. THREE POINTS CROSS-REFERENCE NOTHING. They
  # are the whole of their own obligation, and until they were written here no rule asked for them.
  # Cited by point, not by article: a rule citing Art. 16 whole would resolve to the entire list.
  - rule_id: AIA-RULE-PO-A16-B
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 16
      point: b
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    # The one document-verifiable rule in this family, because the Act names the accompanying
    # documentation as a place the duty may be discharged. Not a process at the provider: an
    # identification that is either in the file or is not.
    evidence_expected: >-
      The provider's name, registered trade name or registered trade mark, and an address at which
      they can be contacted. The Act's first choice is a marking on the system itself, with the
      packaging or the accompanying documentation as fallbacks — so a file that states the marking
      is affixed to the device satisfies this as fully as one that carries the details itself. What
      does not satisfy it is documentation that identifies no provider at all and says nothing
      about where the identification sits.
    document_verifiable: true
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active

  - rule_id: AIA-RULE-PO-A16-K
