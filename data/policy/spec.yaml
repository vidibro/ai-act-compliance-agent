  - rule_id: AIA-RULE-PO-A61
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 61
      paragraph: 1 # informed consent from the subjects of testing
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # 61(2) is HOW the consent must be recorded and is the whole substance of proving 61(1) was
    # obtained: a consent nobody dated, documented or gave a copy of is unevidenced. Supplied
    # rather than cited, the same relation 12(2) has to 12(1).
    #
    # Art. 60(5) is the other half of point (c). The subject may withdraw at any time and demand
    # deletion, and 61(1)(c) requires them to be TOLD SO before consenting — so a consent form
    # drafted without 60(5) in front of it discloses a right it does not describe.
    qualified_by:
      - article: 61
        paragraph: 2
      - article: 60
        paragraph: 5
    requires_real_world_testing: true
    activation_condition: >-
      Owed only where the Art. 60 route is taken, and DISAPPLIED IN ONE CASE by Art. 60(4)(i):
      testing for law enforcement purposes where seeking consent would prevent the system from
      being tested at all. That exception carries its own price — the testing and its outcome must
      have no negative effect on the subjects, and their personal data must be deleted once the
      test is done — so it relieves the consent duty and not the protection behind it.
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      FREELY-GIVEN INFORMED CONSENT obtained from each subject BEFORE they take part, after being
      told five things in concise, clear, relevant and understandable terms. (a) The NATURE AND
      OBJECTIVES of the testing, and the possible inconvenience of taking part. (b) The CONDITIONS
      under which it is conducted, including how long their own participation is expected to last.
      (c) Their RIGHTS AND GUARANTEES — in particular the right to refuse and the right to withdraw
      at any time, without any resulting detriment and without giving a reason. (d) The
      ARRANGEMENTS FOR REQUESTING THE REVERSAL OR DISREGARDING of the system's predictions,
      recommendations or decisions, which is the point at which the trial touches the subject's own
      affairs. (e) The Union-wide UNIQUE SINGLE IDENTIFICATION NUMBER of the testing under
      Art. 60(4)(c), and the contact details of the provider or its legal representative for
      further information. Art. 61(2) then fixes how it is recorded, and a consent that fails this
      is not evidenced however freely it was given: DATED, DOCUMENTED, and A COPY GIVEN to the
      subject or their legal representative. Art. 60(5) is the other side of point (c) — a subject
      may withdraw at any time by revoking consent and may demand immediate and permanent deletion
      of their personal data, and only the activities already carried out survive that. Consent
      obtained from people rather than a property of the technical file — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Arts. 60 and 61 sit in Chapter VI. Art. 113(c) defers Chapter III Sections 1, 2 and 3 only,
      and none of the other carve-outs in 113(a) to (d) reaches Chapter VI, so the testing regime
      runs from the general date of 2 August 2026 — ahead of the Chapter III Section 2
      requirements a trial is run to establish. A provider testing on live inputs today owes these
      conditions today, whichever Art. 6 door its system came through.
    criteria:
      - norm_id: AIA-NORM-A061-P1-OBTAIN-INFORMED-CONSENT
      - norm_id: AIA-NORM-A061-P2-DOCUMENT-AND-COPY-CONSENT
      - norm_id: AIA-NORM-A061-P2-GIVE-CONSENT-COPY
    status: active

  - rule_id: AIA-RULE-PO-A72
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 72
      paragraph: 1 # establish and document a post-market monitoring system
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # 72(2) is what the system established under 72(1) must DO: actively and systematically collect,
    # document and analyse performance data over the lifetime, so the provider can evaluate
    # continuing compliance with Chapter III Section 2. Supplied rather than cited, because a
    # provider that has established nothing breaches 72(1) and the finding belongs there.
    # 72(3) is the other half of the same duty: the system must be BASED ON a post-market
    # monitoring plan, and that plan must sit inside the Annex IV technical documentation. The
    # second sentence is separately shown to a judge — Annex IV point 9 names the plan and
    # AIA-RULE-HR-A11 carries Annex IV verbatim — but the first is a requirement on the monitoring
    # SYSTEM, which is this rule's subject and nobody else's.
    qualified_by:
      - article: 72
        paragraph: 2
      - article: 72
        paragraph: 3
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      An operating post-market monitoring system at the provider, and evidence that it ACTIVELY AND
      SYSTEMATICALLY collects, documents and analyses performance data over the system's lifetime —
      from deployers and from other sources — so that continuing compliance with Chapter III Section
      2 can be evaluated. A system that exists on paper and gathers nothing satisfies Art. 72(1) and
      not Art. 72(2). ONE CLASS OF DATA IS CARVED OUT: the last sentence of Art. 72(2) puts the
      SENSITIVE OPERATIONAL DATA of deployers that are LAW-ENFORCEMENT AUTHORITIES outside the
      collection duty entirely, so a provider serving those deployers is not short of anything by
      not holding it. Art. 72(3) adds that the system must be BASED ON a written post-market
      monitoring plan — monitoring carried on ad hoc, however diligently, is not this — and that the
      plan belongs inside the Annex IV technical documentation, where AIA-RULE-HR-A11 does reach it. The
      duty is to run it; that is an operational process, not a property of the documentation —
      confirm separately. Art. 72(4) offers a CHOICE rather than a second system: where a post-
      market monitoring system and plan already exist under the Annex I Section A legislation
      covering the product, the provider may integrate the elements of Art. 72(1), (2) and (3) into
      them, using the Art. 72(3) template and provided the result achieves AN EQUIVALENT LEVEL OF
      PROTECTION. The same choice is open to a FINANCIAL INSTITUTION placing an Annex III point 5
      system on the market under Union financial services law. Integration is not exemption — the
      elements must still be there and the equivalence is the provider's to show.
    document_verifiable: false
    effective_date: 2026-08-02
    criteria:
      - norm_id: AIA-NORM-A072-P1-ESTABLISH-AND-DOCUMENT-MONITORING
      - norm_id: AIA-NORM-A072-P2-OPERATE-LIFETIME-MONITORING
      - norm_id: AIA-NORM-A072-P3-PLAN-AND-TECHNICAL-DOCUMENTATION
      - norm_id: AIA-NORM-A072-P3-PLAN-IN-TECHNICAL-DOCUMENTATION
    status: active

  # ART. 73(10) MOVES THE ADDRESSEE, which is why it is a rule and not a narrowing. Read as a limit
  # it only cuts the reportable set down to Art. 3(49)(c) incidents; read whole it also sends the
  # notification somewhere else — to the national competent authority the Member State chose for
  # medical devices, which is neither the market surveillance authority AIA-RULE-ALL-A73 names nor the
  # AI Office AIA-RULE-PO-A75-1a names. A provider of a medical-device AI system that follows either of
  # those rules notifies the wrong body.
  - rule_id: AIA-RULE-ALL-A73-10
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 73
      paragraph: 10 # medical devices: fewer reportable incidents, and a different recipient
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider, deployer]
    activation_condition: >-
      High-risk AI systems that are safety components of devices covered by Regulation (EU)
      2017/745 or Regulation (EU) 2017/746, or that are themselves such devices. Whether a product
      is a device under those Regulations is a question under them and not under this one, so it is
      stated rather than decided here.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A serious-incident procedure that differs from Art. 73's default IN BOTH DIRECTIONS. The
      reportable set NARROWS to serious incidents within Art. 3(49)(c) — a breach of an obligation
      under Union law intended to protect fundamental rights. And the recipient MOVES: the
      notification shall be made to the NATIONAL COMPETENT AUTHORITY CHOSEN FOR THAT PURPOSE by the
      Member States where the incident occurred, not to the market surveillance authority under
      AIA-RULE-ALL-A73 and not to the AI Office under AIA-RULE-PO-A75-1a. Which body that is comes from the
      Member State's own designation, so knowing it in advance is part of having the procedure. The
      Art. 73 deadlines and post-report duties are otherwise unchanged. Not visible in the
      technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # THE WHOLE ARTICLE, because a reporting duty without its deadline is not the duty. Art. 73(1)
  # says a serious incident must be reported; (2) to (5) say WHEN — immediately on establishing a
  # causal link and within 15 days, two days for a widespread infringement or a critical
  # infrastructure incident, immediately on death — and (6) says what happens after: investigate,
  # risk-assess, cooperate with the authority and the notified body, and do not alter the system
  # before informing them. Citing (1) alone puts a procedure in front of the judge and none of the
  # timing that makes one adequate.
  # BOTH ROLES, and the deployer's half arrives from another Article. Art. 73(1) puts the report on
  # the provider, and Art. 26(5) closes with "If the deployer is not able to reach the provider,
  # Article 73 shall apply mutatis mutandis" — so a deployer that cannot reach its provider owes
  # this Article directly, on these deadlines. Paragraphs 2 to 5 already write "the provider or,
  # where applicable, the deployer" into every clock. Hence AIA-RULE-ALL-, not AIA-RULE-PO-.
  - rule_id: AIA-RULE-ALL-A73
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 73 # whole article: report serious incidents, by when, and what follows
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider, deployer]
    activation_condition: >-
      The provider owes this outright under Art. 73(1). A DEPLOYER owes it where Art. 26(5)'s last
      condition is met — it has identified a serious incident and IS NOT ABLE TO REACH THE PROVIDER
      — and then Art. 73 applies mutatis mutandis, with the same deadlines running from the
      deployer's own awareness. A deployer that can reach its provider owes Art. 26(5) instead:
      inform first the provider, then the importer or distributor and the market surveillance
      authorities. Which of the two applies turns on an event, so both are listed.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A serious-incident reporting procedure toward market surveillance authorities, carrying the
      Article's DEADLINES: immediately on establishing a causal link and in any event within 15 days
      of becoming aware; two days for a widespread infringement or an incident to critical
      infrastructure; immediately, and no later than 10 days, where a person has died. An initial
      incomplete report followed by a complete one is expressly allowed, so a procedure that waits
      for certainty before reporting at all is wrong. Then Art. 73(6): WITHOUT DELAY, the necessary
      investigations in relation to the incident and the system, and those shall include a risk
      assessment of the incident AND CORRECTIVE ACTION — investigating is not the end of it. Also
      cooperate with the authorities and, where relevant, the notified body; the bar on altering the
      system before informing them is judged under AIA-RULE-PO-A73-6-ALTERATION-PROHIBITION. Art.
      73(9) NARROWS the reportable set to Art. 3(49)(c) incidents for Annex III systems whose
      providers are subject to Union instruments laying down equivalent reporting obligations.
      A relational post-market obligation, not visible in the technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    criteria:
      - norm_id: AIA-NORM-A073-P1-REPORT-SERIOUS-INCIDENT
      - norm_id: AIA-NORM-A073-P2-REPORT-IMMEDIATELY
      - norm_id: AIA-NORM-A073-P2-REPORT-NO-LATER-THAN-FIFTEEN-DAYS
      - norm_id: AIA-NORM-A073-P3-REPORT-IMMEDIATELY
      - norm_id: AIA-NORM-A073-P3-REPORT-NO-LATER-THAN-TWO-DAYS
      - norm_id: AIA-NORM-A073-P4-REPORT-IMMEDIATELY
      - norm_id: AIA-NORM-A073-P4-REPORT-NO-LATER-THAN-TEN-DAYS
      - norm_id: AIA-NORM-A073-P6-INVESTIGATE
      - norm_id: AIA-NORM-A073-P6-RISK-ASSESSMENT-AND-CORRECTIVE-ACTION
      - norm_id: AIA-NORM-A073-P6-COOPERATE-AND-PRESERVE-SYSTEM
    status: active

  # THE ONE PROHIBITION IN ART. 73, judged apart because a rule implements one legal kind. During
  # the Art. 73(6) investigations the provider "shall not perform any investigation which involves
  # altering the AI system concerned" in a way that may affect evaluating the incident's causes,
  # until it has informed the competent authorities.
  - rule_id: AIA-RULE-PO-A73-6-ALTERATION-PROHIBITION
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 73
      paragraph: 6
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    activation_condition: >-
      The provider is investigating a serious incident it reported under Art. 73(1).
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      No investigation step that alters the AI system in a way which may affect a later evaluation
      of the incident's causes is taken before the competent authorities are informed of it. This
      is distinct from the duty to investigate under AIA-RULE-ALL-A73 and is assessed separately
      because it is a prohibition. An operational process, not visible in the technical
      documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active
    criteria:
      - norm_id: AIA-NORM-A073-P6-NO-EVIDENCE-AFFECTING-ALTERATION

  - rule_id: AIA-RULE-PO-A75-1a
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 75
      paragraph: 1a # serious incidents go to the AI Office, not the national authority
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # A DIFFERENT ADDRESSEE, not a second report. Art. 75(1a) opens "by way of derogation from
    # Article 73", so where it applies it REPLACES that Article's addressee and leaves everything
    # else standing — 73(2) to (9) apply mutatis mutandis, so the deadlines above are unchanged.
    # Reported beside AIA-RULE-ALL-A73 rather than folded into it because the condition is a fact about
    # the provider, not about the system: whether the high-risk system is built on a general-purpose
    # model the same provider supplies, or is a component of a VLOP or VLOSE under Art. 75(1). That
    # is not derivable from a description of the system, so it is stated for the reader.
    activation_condition: >-
      Art. 75(1a) binds only the providers Art. 75(1) puts under the AI Office's exclusive
      competence, and that paragraph has a limb and four exceptions that are easy to read past.
      IN: (a) a system based on a general-purpose AI model where the model and the system are
      developed by the same provider OR BY PROVIDERS FORMING PART OF THE SAME UNDERTAKING as that
      provider — so a group where one company trains the model and a sister company ships the system
      is inside, not outside; and (b) a system that constitutes or is integrated into a very large
      online platform or search engine designated under Regulation (EU) 2022/2065.
      OUT, even where (a) holds: (i) systems related to products covered by the Annex I
      harmonisation legislation; (ii) systems in Annex III point 2, critical infrastructure;
      (iii) systems provided by law enforcement authorities, border management authorities and
      financial institutions so far as they fall under Art. 74(6); and (iv) Annex III point 8
      systems as regards the administration of justice — note that this ruleset's `justice_democracy`
      area covers both limbs of point 8, so it cannot tell an administration-of-justice system from
      a democratic-processes one and the exception must be applied by the reader.
      A deployer is reached only where it is also the provider or part of the same undertaking.
      None of this is derivable from a description of the system, so the obligation is listed with
      the condition attached rather than asserted of every provider or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A serious-incident reporting procedure addressed to the AI OFFICE rather than to a national
      market surveillance authority. The deadlines and the post-report duties of Art. 73 are
      unchanged; only the recipient moves, and the AI Office then passes the information on to the
      national authority itself. A procedure naming only the national authority is the wrong
      addressee for a provider this Article reaches. Not visible in the technical documentation —
      confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # NOT THE OFFICE'S POWER, THOUGH IT SITS INSIDE ONE. Art. 75c(3) opens with what the AI Office
  # may order and then turns: "The operator concerned shall provide the AI Office with a
  # description of the measures it has taken". Art. 75a(6) is ruled out on the ground that an order
  # sets its own content and leaves nothing to check a file against — this is not that. The Act
  # fixes the artefact (a description of measures taken) and its timing (upon implementation); the
  # decision settles only which measures. Same shape as Art. 82(2): an authority's act creates the
  # trigger, the Regulation writes the duty.
  - rule_id: AIA-RULE-ALL-A75c-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 75c
      paragraph: 3 # the operator's description of the measures it has taken
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider, deployer]
    # EVERY GOVERNED TIER, because Art. 75c(1) reaches non-compliance with "the relevant provisions
    # of this Regulation" without naming one — an Art. 50 transparency breach by a minimal-risk
    # generator built on its own provider's model is inside it.
    #
    # TWO ROLES, and the second is narrow: Art. 75(1) closes by applying the AI Office's exclusive
    # competence to the providers of those systems, and to deployers ONLY where the deployer is
    # also the provider or forms part of the same undertaking.
    qualified_by:
      - article: 75c
        paragraph: 1
    activation_condition: >-
      The duty attaches only once the AI Office has adopted an Art. 75c(1) decision establishing
      non-compliance against this operator, and only where that decision orders measures under
      75c(3). The Office reaches an operator at all only through Art. 75(1): a system based on a
      general-purpose AI model where the model and the system come from the same provider or from
      providers in the same undertaking — excluding Annex I products, Annex III point 2 critical
      infrastructure, systems provided by law enforcement, border management authorities and
      financial institutions so far as Art. 74(6) catches them, and Annex III point 8 as regards
      the administration of justice — or a system that constitutes or is integrated into a very
      large online platform or search engine designated under Regulation (EU) 2022/2065. None of
      that is derivable from a description of the system, so the obligation is listed with the
      condition attached rather than asserted of every operator or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A description of the measures actually taken, provided to the AI Office UPON THEIR
      IMPLEMENTATION. Distinct from the information the decision itself requires under the first
      sentence, which is what the operator INTENDS to do: that one is forward-looking and ordered,
      this one is a report back and is owed by the Regulation. An operator that carries out the
      ordered measures and says nothing has complied with the decision and breached this paragraph.
      A relational enforcement obligation, not visible in the technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # THE ONE OPERATOR DUTY IN ART. 75a. Paragraph 3 makes the AI Office tell the recipient of a
  # simple request that there is no obligation to reply but that a voluntary reply "must be correct
  # and not misleading". Answering is optional; answering wrongly is not, and Art. 75c(4) attaches
  # the Art. 99(5) fines to it. Same roles and tiers as AIA-RULE-ALL-A75c-3, for the same reason.
  - rule_id: AIA-RULE-ALL-A75a-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 75a
      paragraph: 3 # a voluntary reply to a simple request must be correct
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider, deployer]
    activation_condition: >-
      The AI Office has sent this operator a SIMPLE REQUEST for information under Art. 75a(3), and
      the operator chooses to reply. A request made by decision is a different thing: the reply is
      then owed. The Office reaches an operator at all only through Art. 75(1), which is not
      derivable from a description of the system, so the duty is listed with the condition
      attached.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A reply to an AI Office simple request that is CORRECT AND NOT MISLEADING. The operator may
      decline to answer, but once it answers, supplying incorrect or misleading information is
      fined under Art. 99(5) through Art. 75c(4). A duty about a reply whose content the request
      sets — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # NOT ART. 21 IN ANOTHER PLACE. Art. 21(1) is information and documentation demonstrating
  # conformity; 21(2) is the Art. 12(1) logs. Neither reaches the TRAINING, VALIDATION AND TESTING
  # DATA SETS, and neither says anything about the API or remote-access modality this paragraph
  # names. Annex VII point 4.3 imposes the same data-set access, but only on the notified-body route
  # and only for a provider that takes it.
  # ONE PARAGRAPH ON FROM AIA-RULE-PO-A74-12 AND THE SAME SHAPE. "Shall be granted access" names no
  # grantor and means the provider, exactly as 74(12) does; not documentable is what
  # `document_verifiable: false` records, not a reason to leave a duty unmodelled.
  - rule_id: AIA-RULE-PO-A74-13
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 74
      paragraph: 13 # source code access on a reasoned request
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    activation_condition: >-
      Owed on a REASONED REQUEST and only where BOTH cumulative conditions are met: (a) access to
      the source code is necessary to assess conformity with the Chapter III Section 2
      requirements, and (b) testing, auditing and verification based on the data and documentation
      the provider already supplied have been EXHAUSTED OR PROVED INSUFFICIENT. So it is the last
      step rather than a standing entitlement, and satisfying Art. 74(12) well is what keeps it
      from being reached.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The ability to grant a market surveillance authority access to the SOURCE CODE of the
      high-risk system. Materially more than Art. 74(12), which reaches documentation and the
      training, validation and testing data sets: source code is the thing a provider is least
      likely to have arranged to release, and arranging it is the work — retention of the exact
      build corresponding to the system placed on the market, and whatever escrow, licensing or
      trade-secret terms let it be shown to an authority without being lost. Art. 78 governs what
      the authority may then do with it, which is the protection a provider relies on rather than a
      ground to refuse. A relational obligation toward an authority, not visible in the technical
      documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-RULE-PO-A74-12
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 74
      paragraph: 12 # full access to documentation and to the data sets
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The ability to grant a market surveillance authority FULL ACCESS to the documentation and to
      the training, validation and testing data sets used to develop the system — including, where
      appropriate and subject to security safeguards, through an API or other technical means
      enabling REMOTE access. Retention of those data sets, and a route by which an authority can
      reach them, are the practical requirements; a provider that discarded its training data after
      release cannot satisfy this. The paragraph is bounded — "where relevant and limited to what is
      necessary to fulfil their tasks" — so it is a capability to hold ready rather than a standing
      disclosure. Distinct from Art. 21, which covers documentation and the automatically generated
      logs and reaches no data set. A relational obligation toward an authority, not visible in the
      technical documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # Art. 82 IS NOT ART. 79 AGAIN, and it is not Art. 20 either. Its whole premise is a system that
  # COMPLIES: 82(1) opens "finds that although a high-risk AI system complies with this Regulation,
  # it nevertheless presents a risk". Art. 20(1) fires where a provider "consider[s] or ha[s] reason
  # to consider" its system NOT in conformity, so the two triggers are disjoint and Art. 20 can
  # never reach an Art. 82 case. Like Art. 79(4) it binds "the provider or other relevant operator",
  # which is Art. 3(8) — five roles here, product manufacturer left off on the ground the ledger
  # records for that role.
  #
  # HIGH-RISK ONLY, unlike AIA-RULE-ALL-A79: 82(1) names a high-risk AI system, where Art. 79 reaches any
  # system presenting a risk.
  - rule_id: AIA-RULE-ALL-A82
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 82
      paragraph: 2 # corrective action across every unit, on the authority's timeline
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role:
      [provider, deployer, importer, distributor, authorised_representative]
    # 82(1) is the authority's finding and carries the trigger this duty hangs from — supplied
    # rather than cited, because the finding is the authority's act and the duty is the operator's.
    qualified_by:
      - article: 82
        paragraph: 1
    activation_condition: >-
      Art. 82 attaches only after a market surveillance authority has performed an Art. 79
      evaluation, consulted the relevant Art. 77(1) body, and found that the system COMPLIES with
      this Regulation yet still presents a risk to health, safety, fundamental rights or another
      aspect of public interest protection. Until that finding there is no duty. Nothing in a
      description of the system says whether it has been made, so the obligation is listed with the
      condition attached rather than asserted of every operator or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A procedure for acting on an Art. 82(1) finding: ensuring corrective action is taken across
      ALL the systems concerned that this party has made available on the Union market — not only
      the unit the authority examined — within the timeline the authority prescribes. The measures
      82(1) can require reach withdrawal and recall. Distinct from Art. 20, which a provider starts
      itself on its own suspicion that the system is NOT in conformity: this one begins with an
      authority's finding that it IS, and binds every operator in the chain rather than the provider
      alone. A relational enforcement obligation, not visible in the technical documentation —
      confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # Art. 78 is otherwise a confidentiality duty on the AUTHORITIES, and its third paragraph turns
  # halfway through. The first subparagraph restricts what they may disclose; the second puts two
  # duties on a PROVIDER — one that happens to be a public authority — and it is the only place in
  # the Act that says where a technical file physically lives.
  - rule_id: AIA-RULE-PO-A78-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 78
      paragraph: 3 # second subparagraph: where the file is kept, and access to it
      annex: "IV"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # THE SAME POPULATION AS AIA-RULE-ALL-A49-4, and gated the same way. The paragraph names Annex III
    # points 1, 6 and 7 held by law enforcement, immigration or asylum authorities: points 6 and 7
    # ARE those areas, and point 1 is biometrics, which qualifies only by who holds the system.
    # `biometrics` is named and the limit stated in the condition, because gating it out would
    # withhold the duty from a police face-matching provider — the case the paragraph is written
    # for.
    applies_to_annex_iii_area: [biometrics, law_enforcement, migration]
    activation_condition: >-
      Owed only where THE PROVIDER IS ITSELF A LAW ENFORCEMENT, IMMIGRATION OR ASYLUM AUTHORITY.
      That is a fact about who drew up the documentation, not about the system, so no
      classification here settles it: a commercial provider selling into those authorities keeps
      its technical documentation under Art. 11 and Art. 18 on the ordinary terms and owes nothing
      under this paragraph. Points 6 and 7 of Annex III are the law enforcement and migration
      areas; a point 1 (biometrics) system is reached only when held by such an authority.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Confirmation of two things about the Annex IV technical documentation, both owed by the
      authority that is the provider. First, that it REMAINS WITHIN THE PREMISES of that authority
      — this paragraph is the one place the Act says where a technical file is kept, and it
      displaces any arrangement holding it with a contractor, a parent department or a cloud
      provider. Second, that the authority has ENSURED the market surveillance authority referred
      to in Art. 74(8) or (9) can, UPON REQUEST, IMMEDIATELY ACCESS the documentation or obtain a
      copy of it — an arrangement standing in advance, not a willingness to respond, since a
      process that takes days to clear does not meet "immediately". Access is confined to staff of
      that authority holding the appropriate level of SECURITY CLEARANCE, so the arrangement has to
      survive that limit rather than be satisfied by a general disclosure route. A custody and
      access arrangement between two public bodies, settled outside the technical file — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Art. 113(c) moved Chapter III Sections 1 to 3 and nothing else, and Art. 78 is in Chapter IX.
      So the custody duty binds from the general date while the Annex IV documentation it governs
      is not owed until 2 December 2027 for an Annex III system. In force ahead of its own subject,
      as with AIA-RULE-ALL-A49-4.
    status: active


  # Art. 79 binds the OPERATOR — Art. 3(8): provider, product manufacturer, deployer, authorised
  # representative, importer or distributor — which is why this is filed AIA-RULE-ALL- and carries five
  # roles where every other rule carries one or two. The sixth, product manufacturer, is left off on
  # the ground the ledger already gives for the role as a whole: Art. 25(3) makes a manufacturer who
  # places a high-risk system on the market with their product THE PROVIDER, so they are reached
  # through the gap graph's reallocation question and owe the provider set, this rule included.
  # Giving them a column of their own here would assert a separate obligation set for a party the
  # Act folds into another.
  #
  # EVERY GOVERNED TIER, because Art. 79 reaches any "AI system presenting a risk" rather than a
  # tier, and 79(6)(d) names non-compliance with Art. 50 as a ground — so a minimal-risk generator
  # in breach of Art. 50(2) owes it. Narrowing to high_risk would drop exactly the case the Article
  # names.
  - rule_id: AIA-RULE-ALL-A79
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 79
      paragraph: 4 # ensure corrective action across every unit made available
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role:
      [provider, deployer, importer, distributor, authorised_representative]
    # CONTINGENT, and the condition is an event rather than a fact about the system: neither duty
    # exists until a market surveillance authority opens an Art. 79 evaluation. Stated here rather
    # than used to withhold the rule, for the reason the Art. 27 condition is: no document settles
    # whether an authority has acted, and a party that has been contacted needs to know what it owes
    # before it goes looking.
    activation_condition: >-
      Art. 79(2) and (4) attach once a market surveillance authority has sufficient reason to
      consider the system to present a risk and opens an evaluation. Until then neither duty is
      live. Nothing in a description of the system says whether that has happened, so the obligation
      is listed with the condition attached rather than asserted of every operator or dropped.
    # 79(2)'s final sentence is the cooperation duty, and the paragraph around it is the
    # authority's procedure — so it is supplied here rather than cited, which would make the finding
    # point at a procedure this party does not carry out.
    qualified_by:
      - article: 79
        paragraph: 2
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A procedure for responding to a market surveillance authority's evaluation under Art. 79: the
      duty in 79(2) to COOPERATE as necessary with that authority and with the Art. 77(1)
      fundamental-rights bodies, and the duty in 79(4) to ensure appropriate corrective action is
      taken in respect of ALL the systems concerned that this party has made available on the Union
      market — not only the unit the authority examined. WHAT THE AUTHORITY MAY REQUIRE, and the
      deadline it runs against, are in 79(2): to bring the system into compliance, to WITHDRAW it
      from the market, or to RECALL it, within a period the authority may prescribe and IN ANY
      EVENT WITHIN THE SHORTER OF 15 WORKING DAYS or the period in the relevant Union harmonisation
      legislation. A procedure that cannot move inside 15 working days does not answer this
      paragraph, and Art. 79(5) makes a missed period the trigger for provisional measures against
      the system. Distinct from Art. 20, which a provider starts itself on its own suspicion; this
      one begins with the authority's requirement and binds every operator in the chain. A
      relational enforcement obligation, not visible in the technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 6(4) — duty to document a NOT-HIGH-RISK (derogated) Annex III assessment.
  # The registration and disclosure-on-request limbs are distinct process rules below: they have
  # different evidence and cannot be hidden in this document check.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-RULE-NHR-A06-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 6
      paragraph: 4 # document the not-high-risk assessment
      act_version_date: 2026-07-27
    applies_to_risk_class: [not_high_risk]
    applies_to_role: [provider]
    # Art. 6(4)'s last limb IS Art. 49(2): "Such provider shall be subject to the registration
    # obligation set out in Article 49(2)". The cross-reference carries the PROVIDER limb only —
    # the authorised representative's is AIA-RULE-AR-A49-2.
    qualified_by:
      - article: 49
        paragraph: 2
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      A documented not-high-risk assessment: which Art. 6(3) derogation condition is relied upon and
      why the system does not pose a significant risk. The reasoning IS expected in the
      documentation, hence document-verifiable. Registration and production to an authority on
      request are separate process duties, reported under AIA-RULE-NHR-A06-4-REGISTER and
      AIA-RULE-NHR-A06-4-PROVIDE-ASSESSMENT.
    document_verifiable: true
    effective_date: 2027-12-02
    effective_date_note: >-
      THIS DATE IS CONTESTED, and the Regulation does not settle it. Art. 113 moves Chapter III
      Section 1 — which contains Art. 6 — but its two limbs reach "AI systems classified as
      high-risk pursuant to Article 6(2)" and "pursuant to Article 6(1)". Art. 6(4) binds a provider
      who concluded their system is NOT high-risk, so neither limb reaches it in terms. Two readings
      are open. On the one taken here the duty applies from 2 December 2027, tracking Art. 6(3) —
      the paragraph whose conclusion it documents, which derogates from Art. 6(2) alone and can
      never reach an Annex I system. On the other it falls back to the general date of 2 August
      2026, which has passed, and the duty is owed NOW. Neither reading is tidy: Art. 6(4) also
      makes the provider subject to the Art. 49(2) registration, and Art. 49 sits in Section 5,
      which was not moved — so on the text that registration is already due, sixteen months before
      the assessment it registers. A provider relying on an Art. 6(3) derogation should take advice
      on which date binds them rather than the later one by default.
    status: active

  # The remaining Art. 6(4) limbs have the same risk and duty-holder gate as the assessment, but
  # their evidence is an external act or a later response, not the assessment document itself.
  - rule_id: AIA-RULE-NHR-A06-4-REGISTER
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 6
      paragraph: 4
      act_version_date: 2026-07-27
    applies_to_risk_class: [not_high_risk]
    applies_to_role: [provider]
    qualified_by:
      - article: 49
        paragraph: 2
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Registration of the provider and the Annex III system in the EU database under Article 49(2),
      after the provider concludes under Article 6(3) that the system is not high-risk. This is an
      external registry action, not evidence that can be verified from the supplied documentation;
      confirm it separately.
    document_verifiable: false
    effective_date: 2027-12-02
    effective_date_note: >-
      This follows the same contested Article 6(4) reading as AIA-RULE-NHR-A06-4. Article 49(2) is in
      Section 5 and otherwise applies from 2 August 2026, but the registration is triggered by the
      Article 6(3) conclusion. A provider relying on the derogation should take advice rather than
      treat the later date as certain.
    criteria:
      - norm_id: AIA-NORM-A006-P4-REGISTER-SYSTEM
      - norm_id: AIA-NORM-A049-P2-PROVIDER-REGISTER-NON-HIGH-RISK
    status: active

  - rule_id: AIA-RULE-NHR-A06-4-PROVIDE-ASSESSMENT
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 6
      paragraph: 4
      act_version_date: 2026-07-27
    applies_to_risk_class: [not_high_risk]
    applies_to_role: [provider]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A process for providing the documented Article 6(3) non-high-risk assessment when a national
      competent authority requests it. Whether a request was received and answered is not
      verifiable from the supplied system documentation; confirm separately.
    document_verifiable: false
    effective_date: 2027-12-02
    effective_date_note: >-
      This follows the same contested Article 6(4) reading as AIA-RULE-NHR-A06-4: the duty attaches to
      a provider's Article 6(3) conclusion, although the alternative reading is that it applies
      from the general date of 2 August 2026.
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 4 — AI LITERACY. The only obligation here that binds BOTH roles and EVERY tier the
  # Regulation governs. Its absence was a real hole: `RiskClass.MINIMAL` says a minimal system is
  # inside the Act and still owes Art. 4, but with no rule carrying it `select_rules` returned an
  # empty set for minimal — indistinguishable from out_of_scope, which is the exact collapse the
  # OUT_OF_SCOPE docstring calls the whole point of the class.
  #
  # Not listed for `prohibited`: the review gate stops there, and a report telling a provider to
  # train staff on a system that may not be operated at all would be absurd.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-RULE-ALL-A04
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 4
      # PARAGRAPH 1, not the article. Until the 2026-07-27 consolidation Art. 4 was a single
      # unnumbered block and citing it whole was citing the duty. Reg (EU) 2026/1744 replaced it
      # with three paragraphs, and only the first binds providers and deployers: (2) is a support
      # duty of the Commission and the Member States, (3) a task of the Board. Citing the article
      # whole would now quote two other bodies' duties as the reader's own.
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider, deployer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Measures taken to support the development of AI literacy among staff and others operating the
      system on the organisation's behalf — training, briefing or competence requirements, pitched
      to their technical knowledge and to the context the system is used in, and to the persons it
      is used on. An organisational measure, not a property of the system. The duty is to take the
      MEASURES: the paragraph says in terms that it does not require guaranteeing any particular
      level of literacy in any individual, so evidence of a programme satisfies it and an
      attainment record is not what is being asked for.
    document_verifiable: false
    # Chapter I, so Art. 113(a): in application since 2 February 2025 — earlier than every other
    # rule here, and already owed today.
    effective_date: 2025-02-02
    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 4a — SPECIAL-CATEGORY DATA FOR BIAS DETECTION AND CORRECTION.
  #
  # This is a conditional processing route, not a requirement to perform bias detection.  The
  # safeguards apply only where a provider or deployer actually uses that route; the present
  # classification has no factual question that could establish that.  Report the route and its
  # safeguards for separate confirmation instead of calling a missing statement in a technical
  # file a compliance gap.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-RULE-ALL-A04A
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 4a
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk, not_high_risk, minimal]
    applies_to_role: [provider, deployer]
    activation_condition: >-
      Applies only where the operator exceptionally processes special categories of personal data
      for bias detection and correction under Article 4a(1) or 4a(2). Article 4a does not require
      an operator to conduct that processing. Where the route is used, the applicable Union
      data-protection regime continues to apply in addition to these safeguards.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Confirm separately, if special-category personal data is processed for bias detection and
      correction: technical limits on reuse; state-of-the-art security and privacy-preserving
      measures including pseudonymisation; safeguards, documented access controls and
      confidentiality; no third-party access; deletion when the bias is corrected or retention
      ends; and records explaining strict necessity and why other data would not work. This report
      does not determine whether the exceptional processing is taking place or whether it complies
      with the applicable GDPR, Union-institution, or law-enforcement data-protection regime.
    document_verifiable: false
    effective_date: 2025-02-02
    status: active
    # One legal kind, one subject set and one non-judged treatment. The canonical norms supply the
    # exact safeguard text, conditions and source spans; the policy spec owns no duplicate list.
    criteria:
      - norm_id: AIA-NORM-A004A-P1-B-REUSE-SECURITY
      - norm_id: AIA-NORM-A004A-P1-C-ACCESS-SAFEGUARDS
      - norm_id: AIA-NORM-A004A-P1-D-NO-THIRD-PARTY-ACCESS
      - norm_id: AIA-NORM-A004A-P1-E-DELETE-DATA
      - norm_id: AIA-NORM-A004A-P1-F-RECORD-NECESSITY

  # ------------------------------------------------------------------------------------------
  # Art. 50 — TRANSPARENCY. The only rules here that do not gate on a risk class, because Art. 50
  # does not: it cuts ACROSS the Art. 6 tiers, and it is ADDITIVE to them. Art. 50(6) says so in
  # terms — paragraphs 1 to 4 "shall not affect the requirements and obligations set out in
  # Chapter III" — so a high-risk system that generates content owes 50(2) AND all of Art. 9-21.
  # What varies is the DUTY, not the tier: a minimal-risk text generator owes 50(2), and a
  # high-risk candidate scorer owes no Art. 50 duty at all — because it generates nothing and
  # holds no conversation, NOT because of its tier. No set of risk classes expresses "whenever
  # this duty attached"; `applies_to_transparency_duty` does, and naming it forbids naming
  # `applies_to_risk_class`. The duties come from the classification cascade's own `transparency`
  # answer, which every path reaches.
  #
  # The role split is the Article's, not ours: (1) and (2) bind the PROVIDER and are built into the
  # system, so a technical file can evidence them; (3) and (4) bind the DEPLOYER and are discharged
  # in front of the affected person, which no provider document shows. A validator checks each rule
  # is filed under the role TransparencyDuty.owed_by names.
  #
  # Every paragraph is disapplied for law-enforcement use authorised by law, and (1), (2) and (4)
  # carry carve-outs of their own. Those are conditions on the DUTY, resolved when the cascade
  # decided the duty attached — not re-litigated here.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-RULE-TR-A50-1
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 50
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_transparency_duty: [direct_interaction]
    applies_to_role: [provider]
    # Art. 50(5) is not a fifth duty — it says HOW the information owed under (1) to (4) must be
    # given: clearly, distinguishably, at the latest at first interaction or exposure, and meeting
    # applicable accessibility requirements. Attached to each of the four rather than modelled once,
    # because a disclosure buried in a footer breaches the paragraph that required the disclosure.
    qualified_by:
      - article: 50
        paragraph: 5
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A description of how the system tells the people it interacts with that they are dealing with
      an AI system — an opening disclosure, a persistent label, a spoken statement. The duty is on
      the DESIGN, so the technical documentation is where it shows. A provider relying on the
      "obvious to a reasonably well-informed, observant and circumspect person" exception should say
      so and say why; it is a judgement about the context of use, not a default.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

  - rule_id: AIA-RULE-TR-A50-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 50
      paragraph: 2
      act_version_date: 2026-07-27
    applies_to_transparency_duty: [synthetic_content_marking]
    applies_to_role: [provider]
    # TWO ELEMENTS, AND THE EVIDENCE ASKS FOR BOTH. Art. 50(2) requires outputs "marked in a
    # machine-readable format AND detectable as artificially generated or manipulated"; the
    # conjunction is in the enacted words, and para (70) says fulfilling one "will not suffice".
    # Marking is the half a provider documents readily — a watermarking scheme is a design
    # decision worth writing down — and detection is the half that goes unsaid, so evidence
    # written around marking alone would PASS a system whose marks only its own provider can read.
    #
    # Para (71) settles what the MARK has to be, and what a human-visible label does and does not
    # do about it; (75) and (76) settle what DETECTION has to be — available to the persons
    # exposed, human-readable, and resting on publicly-available industry standards where they
    # exist. All three are the Commission's non-binding reading, cited rather than asserted.
    guidance_refs:
      - C-2026-5054/machine-readable-marking-defined
      - C-2026-5054/both-elements-required
      - C-2026-5054/detection-must-be-available
    # Art. 50(5) is not a fifth duty — it says HOW the information owed under (1) to (4) must be
    # given: clearly, distinguishably, at the latest at first interaction or exposure, and meeting
    # applicable accessibility requirements. Attached to each of the four rather than modelled once,
    # because a disclosure buried in a footer breaches the paragraph that required the disclosure.
    qualified_by:
      - article: 50
        paragraph: 5
    obligation_status: mandatory
    check_type: substance
    evidence_expected: >-
      TWO things, and BOTH are required — the paragraph is a conjunction, and documentation
      answering only the first does not reach the obligation.
      (1) MARKING. The technical solution that marks generated output as artificially generated or
      manipulated, in a MACHINE-READABLE format — a named watermarking, provenance or metadata
      scheme, and what it survives. Machine-readable means a mark software can identify and extract
      WITHOUT human intervention, so a statement that outputs are "labelled as AI", with nothing
      about how a machine detects it, does not reach the obligation. A visible label is not a mark
      against the provider either: it is expressly allowed as a COMPLEMENT, and it helps a deployer
      meet the separate Art. 50(4) duty — so its presence is neither the answer nor a fault.
      (2) DETECTION. That the marked output is DETECTABLE — a detection tool or method, and how the
      persons potentially exposed to the content can reach it. Embedding a mark that only the
      provider can read is the failure this half exists to catch. Look for a named detection
      mechanism, whether it is a publicly-available industry standard or the provider's own, and
      whether its result is human-readable. Silence on detection is a GAP even where the marking
      scheme is described in full.
      The paragraph also asks that the solutions be effective, interoperable, robust and reliable as
      far as technically feasible, and a single technique or a combination may be used.
    document_verifiable: true
    effective_date: 2026-08-02
    status: active

