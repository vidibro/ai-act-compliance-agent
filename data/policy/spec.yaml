    status: active

  # ------------------------------------------------------------------------------------------
  # Art. 26-27 — DEPLOYER obligations for high-risk systems. A distinct duty-holder: the party
  # that operates the system, not the one that built it. Reported so a provider's report names
  # what its customers will owe, and so a deployer reading it is not told only the provider's half.
  # ------------------------------------------------------------------------------------------
  - rule_id: AIA-RULE-DP-A26
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 26
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      THE DEPLOYER'S CORE OPERATING MEASURES, which are six of this Article's twelve paragraphs.
      Five more are carried by AIA-RULE-DP-A26-8 through -12: 26(8) to (11) are narrowed to particular
      deployers or particular systems, and 26(12) is conduct toward an authority rather than an
      operating measure. Art. 26(3) imposes nothing — it is a saving clause preserving the
      deployer's freedom to organise its own resources for the oversight measures in 26(1) and (2).
      Art. 26(1) and (2): technical and organisational measures to use the system in accordance with
      its instructions for use, and human oversight assigned to natural persons who have the
      necessary competence, training AND AUTHORITY, as well as the necessary support — a named
      person without the authority to stop the system does not satisfy the paragraph.
      Art. 26(4): where the deployer exercises control over the input data, that data must be
      relevant and sufficiently representative in view of the intended purpose.
      Art. 26(5) IS THREE DUTIES WITH THREE DIFFERENT ADDRESSEES, and reporting to the provider is
      only the first. Monitor operation on the basis of the instructions for use, and inform the
      provider under Art. 72 where relevant. Where the deployer has reason to consider that use in
      accordance with the instructions may result in the system presenting an Art. 79(1) risk, it
      shall WITHOUT UNDUE DELAY inform the provider or distributor AND THE RELEVANT MARKET
      SURVEILLANCE AUTHORITY, and SUSPEND THE USE of the system — the suspension is a duty of its
      own, not a consequence of the report. Where it has identified a SERIOUS INCIDENT it shall
      immediately inform FIRST the provider, and THEN the importer or distributor and the relevant
      market surveillance authorities, in that order. And if it cannot reach the provider, Art. 73
      applies mutatis mutandis and the deployer owes the report itself — see AIA-RULE-ALL-A73 for the
      deadlines that then bind it. Sensitive operational data of law-enforcement deployers is
      outside this obligation, and a financial institution meets the monitoring half by complying
      with its internal-governance rules under Union financial services law.
      Art. 26(6): keep the automatically generated logs, to the extent they are under the deployer's
      control, for a period appropriate to the intended purpose and AT LEAST SIX MONTHS.
      Art. 26(7): where the deployer is an employer, inform workers' representatives and the
      affected workers BEFORE putting the system into service or using it at the workplace.
      Held by the operating organisation, so a provider's technical file cannot evidence it.
    document_verifiable: false
    effective_date_by_route:
      annex_iii: 2027-12-02
      annex_i: 2028-08-02
    status: active
    criteria:
      - norm_id: AIA-NORM-A026-P1-INSTRUCTION-COMPLIANT-USE
      - norm_id: AIA-NORM-A026-P2-HUMAN-OVERSIGHT-ASSIGNMENT
      - norm_id: AIA-NORM-A026-P4-INPUT-DATA-QUALITY
      - norm_id: AIA-NORM-A026-P5-MONITOR
      - norm_id: AIA-NORM-A026-P5-RISK-NOTIFY
      - norm_id: AIA-NORM-A026-P5-INCIDENT
      - norm_id: AIA-NORM-A026-P6-KEEP-CONTROLLED-LOGS

