  - rule_id: AIA-PO-A43-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 43
      paragraph: 3
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    applies_to_route: annex_i
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Evidence that the conformity assessment required by the product's OWN Union harmonisation
      legislation was carried out, with the Chapter III Section 2 requirements assessed as part of
      it. This Regulation does not supply the procedure here — the sectoral act does — so what is
      expected is that act's assessment, plus confirmation that the Section 2 requirements were
      inside its scope. Where the sectoral act offers a route that does not involve a third party,
      state which HARMONISED STANDARDS were applied: that option is available only where standards
      or common specifications cover all of the Section 2 requirements. Containing a high-risk AI
      system does not by itself force a third-party assessment where the sectoral act does not
      require one. Only Annex I Section A systems reach this rule; a Section B one owes no
      Chapter III at all under Art. 2(2) and is withheld earlier.
      THE SECTORAL PROCEDURE IS NOT THE WHOLE OF WHAT THIS PARAGRAPH REQUIRES. It also has the
      Art. 17 QUALITY MANAGEMENT SYSTEM assessed, and it applies six pieces of ANNEX VII to this
      route by name: point 3, the quality management system application and the duties to keep the
      approved system in place and to bring intended changes to the notified body before making
      them; point 4.3, full access for the notified body to the training, validation and testing
      data sets, where relevant and limited to what is necessary, through an API or other remote
      means where appropriate; point 4.4, further evidence or further tests where the body requires
      them, and tests the body carries out itself where it is not satisfied with the provider's;
      point 4.5, access to the training and trained models INCLUDING THEIR PARAMETERS, on a
      reasoned request and only after other means of verifying conformity are exhausted, subject
      to intellectual property and trade secret law; the FIFTH PARAGRAPH OF POINT 4.6, under which
      a system failing the training-data requirement must be RE-TRAINED before a new conformity
      assessment is applied for; and point 5, surveillance — for as long as the approval stands the
      provider allows the body onto the premises where design, development and testing take place,
      shares all necessary information, and is audited periodically. So an Annex I Section A
      provider owes a standing notified-body relationship under this Regulation on top of whatever
      its own instrument requires. A procedural act preceding market placement, and a relationship
      running after it — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      IN FORCE ALREADY, AND EARLIER THAN WHAT IT ATTESTS TO — which reads like an error and is
