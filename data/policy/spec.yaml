  - rule_id: AIA-RULE-ALL-A49-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 49
      paragraph: 4
      annex: "VIII"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider, deployer]
    # NOT a second registration — the same one, lodged somewhere else and carrying less. It stands
    # beside AIA-RULE-PO-A49 and AIA-RULE-DP-A49-3 rather than replacing either.
    #
    # BINDS BOTH ROLES, because paragraph 4 governs "the registration referred to in paragraphs 1,
    # 2 and 3" — the deployer's own entry under 49(3) goes to the secure section on the same terms
    # as the provider's. Hence AIA-RULE-ALL-, not AIA-RULE-PO-.
    #
    # OVER-INCLUSIVE WITHIN ONE AREA, and said so in the condition. Art. 49(4) reaches Annex III
    # points 1, 6 and 7 "in the areas of law enforcement, migration, asylum and border control
    # management". Points 6 and 7 ARE those areas and need no qualification. Point 1 is biometrics,
    # which qualifies only when used FOR those purposes — and `AnnexIIIArea` records the listed
    # area, not the sector a system is deployed in, so nothing in this ruleset tells a police
    # face-matching system from a workplace sign-in one. `biometrics` is named anyway, on the same
    # terms as AIA-RULE-HR-A12-3A to -3D: the rule is selected for every biometric system and the sector
    # limit
    # is stated in `activation_condition`, where the reader can apply it. The alternative gates the
    # rule out of the only area where the reader has to decide anything, and a duty withheld from
    # the party who owes it is not the safe direction.
    applies_to_annex_iii_area: [biometrics, law_enforcement, migration]
    activation_condition: >-
      Points 6 and 7 owe this unconditionally — they ARE the law enforcement and migration areas.
      For an Annex III POINT 1 (biometrics) system it is owed only where the system is used for
      LAW ENFORCEMENT, MIGRATION, ASYLUM OR BORDER CONTROL MANAGEMENT. That is a fact about the
      sector of deployment rather than about the listed area, so no classification in this report
      settles it: a biometric system used anywhere else registers in the public section under
      Art. 49(1) or 49(3) and owes nothing here.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      Confirmation that the Art. 49 registration was made in the SECURE NON-PUBLIC section of the EU
      database, carrying only the reduced set of Annex VIII fields this paragraph lists. An external
      act against a registry — confirm separately. The reduced set is Annex VIII Section A points 1
      to 10 except 6, 8 and 9; Section B points 1 to 5 and points 8 and 9; Section C points 1 to 3;
      and Annex IX points 1, 2, 3 and 5. Only the Commission and the Art. 74(8) national
      authorities have access to those restricted sections, so registering these systems in the
      ordinary public section is a breach of this paragraph and not a harmless surplus.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      IN FORCE ALREADY, AND EARLIER THAN WHAT IT ATTESTS TO — which reads like an error and is
      not one. Regulation (EU) 2026/1744 moved Chapter III Sections 1 to 3 to 2 December 2027 for
      an Annex III system and 2 August 2028 for an Annex I one, and did NOT move Section 5, where
      this obligation sits. So the secure-section registration applies from the general date of 2 August 2026,
      while the Section 2 requirements it is registered under wait another sixteen months or more. The
      sequence is what Art. 113(c) says, not a transcription of it: that paragraph names Sections
      1, 2 and 3 only. Whether the legislator intended Section 5 to run ahead of them, or simply
      did not carry it across, is a question for advice rather than for this tool — which reports
      the date the Article gives and says plainly that it looks inverted.
    status: active

  # Art. 49(3) — the DEPLOYER's own registration. Not the provider's duty seen from another angle:
  # a separate entry, made by a different party, in the same database. Art. 49(1) registers the
  # provider and the system before it is placed on the market; 49(3) registers the deploying
  # authority, the system it selected, and the fact of its use — so a system can be fully
  # registered by its provider and still leave its deployer in breach.
  - rule_id: AIA-RULE-DP-A49-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 49
      paragraph: 3
      annex: "III"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [deployer]
    # The same Annex III exception as 49(1): "with the exception of ... point 2 of Annex III", so
    # critical infrastructure is out, and an Annex I system is never reached.
    applies_to_annex_iii_area:
      [
        biometrics,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    # NARROWER than Art. 27's condition, on the same fact about the organisation. Art. 27 reaches
    # private entities providing public services; this paragraph does not — they are private. See
    # DeployerType.caught_by_article_49_3.
    activation_condition: >-
      Art. 49(3) binds deployers that are public authorities, Union institutions, bodies, offices or
      agencies, or persons acting on their behalf. It does not reach private deployers, and — unlike
      Art. 27(1) — a private entity providing public services is not caught by being one, though it
      may still be caught as a person acting on a public authority's behalf. Which is a fact about
      the deploying organisation and its arrangements, not about the system.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      The deployer's own registration in the EU database under Art. 71: registering itself,
      selecting the system, and registering its use. Distinct from the provider's registration
      under Art. 49(1) — a system its provider registered correctly is still unregistered as to its
      use. Owed before the system is put into service or used, and an external act against a
      registry rather than a property of the documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      IN FORCE ALREADY, AND EARLIER THAN WHAT IT ATTESTS TO — which reads like an error and is
      not one. Regulation (EU) 2026/1744 moved Chapter III Sections 1 to 3 to 2 December 2027 for
      an Annex III system and 2 August 2028 for an Annex I one, and did NOT move Section 5, where
      this obligation sits. So the deployer registration applies from the general date of 2 August 2026,
      while the Section 2 requirements it is registered under wait another sixteen months or more. The
      sequence is what Art. 113(c) says, not a transcription of it: that paragraph names Sections
      1, 2 and 3 only. Whether the legislator intended Section 5 to run ahead of them, or simply
      did not carry it across, is a question for advice rather than for this tool — which reports
      the date the Article gives and says plainly that it looks inverted.
    status: active

  # WHAT THE REGISTRATION CONSISTS OF. AIA-RULE-PO-A49, AIA-RULE-DP-A49-3 and AIA-RULE-NHR-A06-4-REGISTER carry the duty to
  # register; Art. 71(2) and (3) say what has to be entered. The split between them is by party,
  # and it is not the split Art. 49 uses: 71(2) is the provider's Sections A and B, 71(3) is the
  # public-authority deployer's Section C.
  - rule_id: AIA-RULE-PO-A71-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 71
      paragraph: 2 # the Annex VIII Section A and B data the provider enters
      annex: "VIII"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider, authorised_representative]
    # ANNEX III POINTS 1 AND 3 TO 8. Point 2, critical infrastructure, is missing because Art. 49(1)
    # excepts it — "with the exception of high-risk AI systems referred to in point 2 of Annex III"
    # — and Art. 49(5) sends those systems to registration at NATIONAL level instead. Nothing goes
    # into the EU database for them, so there is no Annex VIII entry to make.
    applies_to_annex_iii_area:
      [
        biometrics,
        education,
        employment,
        essential_services,
        law_enforcement,
        migration,
        justice_democracy,
      ]
    # THE HIGH-RISK TIER ONLY, and AIA-RULE-NHR-A71-2 carries the other. Art. 71(1) has the database hold
    # Art. 6(2) high-risk systems registered under Art. 49, AND systems a provider concluded are
    # NOT high-risk under Art. 6(3) — Annex VIII Section A is the first, Section B the second. Two
    # rules rather than one because the two tiers do not share an area gate: Art. 49(1) excepts
    # Annex III point 2 and Art. 49(2) excepts nothing, so a single list would either withhold the
    # entry from a derogating critical-infrastructure provider or demand a database entry from a
    # high-risk one the Act registers nationally.
    #
    # THE AUTHORISED REPRESENTATIVE is named in the paragraph itself, "where applicable", so it is
    # a duty-holder here and not merely the provider's agent.
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      The Annex VIII data actually entered in the EU database, not merely an account created. For a
      high-risk system that is Section A, thirteen items: the provider's and any representative's
      identity, the trade name and traceability references, the intended purpose with the
      components and functions it uses, a concise description of the data and operating logic, the
      market status, the notified body certificate and a scanned copy where one exists, the Member
      States of placing, a copy of the Art. 47 EU declaration of conformity, and electronic
      instructions for use — withheld for law enforcement, migration, asylum and border control
      systems. Item A/13, a URL for further information, is expressly OPTIONAL. A system registered
      as NOT high-risk under Art. 6(3) enters Section B instead, which AIA-RULE-NHR-A71-2 carries.
      An external act against a registry, not observable from the technical documentation — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Art. 71 sits in Chapter VIII, which Art. 113 does not carve out, so the entry duty runs from
      the general date of 2 August 2026 — ahead of the Chapter III Section 2 requirements the
      entered data describes. Same inversion as the Art. 49 registrations it fills in, and for the
      same reason: Regulation (EU) 2026/1744 moved Sections 1 to 3 and left everything else where
      it was.
    criteria:
      - norm_id: AIA-NORM-A071-P2-PROVIDER-ENTER-ANNEX-VIII-DATA
      - norm_id: AIA-NORM-A071-P2-REPRESENTATIVE-ENTER-ANNEX-VIII-DATA
    status: active

  # NO AREA GATE, AND THAT IS THE DIFFERENCE FROM AIA-RULE-PO-A71-2. Art. 49(1) and 49(3) each except
  # "high-risk AI systems referred to in point 2 of Annex III" and Art. 49(5) registers those
  # nationally; Art. 49(2) enacts NO SUCH EXCEPTION. A provider that derogates an Annex III point 2
  # system under Art. 6(3) registers it in the EU database like any other, so gating this rule on
  # the seven areas would tell a critical-infrastructure provider to register under AIA-RULE-NHR-A06-4
  # and never tell it what to enter — including the two items its whole derogation rests on.
  - rule_id: AIA-RULE-NHR-A71-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 71
      paragraph: 2 # the Annex VIII Section B data a derogating provider enters
      annex: "VIII"
      act_version_date: 2026-07-27
    applies_to_risk_class: [not_high_risk]
    applies_to_role: [provider, authorised_representative]
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      The Annex VIII SECTION B data actually entered in the EU database, not merely an account
      created — nine items for a system the provider concluded is not high-risk under Art. 6(3):
      the provider's and any representative's identity and contact details, the person submitting
      on their behalf, the trade name and the references allowing identification and traceability,
      a description of the intended purpose, the market status and the Member States of placing.
      Then the two that carry the whole claim: B/6, WHICH of the Art. 6(3) conditions is relied on,
      and B/7, a SHORT SUMMARY OF THE GROUNDS for concluding the system is not high-risk. Those are
      what Art. 80 puts an authority onto, and misstating them attracts the Art. 80(7) fine — so a
      registration that names the condition without the grounds has entered half of what the
      paragraph asks. An external act against a registry, not observable from the technical
      documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Art. 71 sits in Chapter VIII, which Art. 113 does not carve out, so the entry duty runs from
      the general date of 2 August 2026 — ahead of the Chapter III Section 2 requirements the
      entered data describes. Same inversion as the Art. 49 registrations it fills in, and for the
      same reason: Regulation (EU) 2026/1744 moved Sections 1 to 3 and left everything else where
      it was.
    status: active

  - rule_id: AIA-RULE-DP-A71-3
    source:
