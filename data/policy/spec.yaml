  # ART. 41 IS A COMMISSION POWER, WITH ONE PARAGRAPH THAT IS NOT. Paragraphs 1 to 4 and 6 are all
  # about adopting, assessing and repealing common specifications; 41(5) turns and binds the
  # provider that does not follow one.
  - rule_id: AIA-RULE-PO-A41-5
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 41
      paragraph: 5 # justify the equivalent technical solution
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    activation_condition: >-
      The duty exists only where the Commission has actually ADOPTED a common specification under
      Art. 41(1) covering the Section 2 requirement in question, and the provider has chosen not to
      comply with it. Art. 41(1) allows a common specification only after a standardisation request
      has failed or gone unanswered and no harmonised standard reference has been published, so
      which requirements are covered at any moment is a fact about the Official Journal rather than
      about this system. Nothing in a description of the system settles it, so the obligation is
      listed with the condition attached rather than asserted of every provider or dropped. A
      provider that DOES follow the applicable common specification owes nothing here and gains the
      Art. 41(3) presumption of conformity instead.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A written justification that the technical solutions actually adopted meet the Section 2
      requirements TO A LEVEL AT LEAST EQUIVALENT to the common specification not followed. The
      standard is equivalence, not reasonableness: an argument that the chosen approach is sound
      does not answer the paragraph unless it is measured against what the specification requires.
      "Duly justify" means the argument is recorded, so a provider that departed from a common
      specification and wrote nothing down cannot satisfy this after the fact. Which specifications
      are in force is not visible in the documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      IN FORCE ALREADY, AND EARLIER THAN WHAT IT ATTESTS TO — which reads like an error and is
      not one. Regulation (EU) 2026/1744 moved Chapter III Sections 1 to 3 to 2 December 2027 for
      an Annex III system and 2 August 2028 for an Annex I one, and did NOT move Section 5, where
      this obligation sits. So it applies from the general date of 2 August 2026, while the
      Section 2 requirements it rests on wait another sixteen months or more. The
      sequence is what Art. 113(c) says, not a transcription of it: that paragraph names Sections
      1, 2 and 3 only. Whether the legislator intended Section 5 to run ahead of them, or simply
      did not carry it across, is a question for advice rather than for this tool — which reports
      the date the Article gives and says plainly that it looks inverted.
    status: active

  # THE ONLY PROVIDER DUTY IN CHAPTER III SECTION 4. Arts. 28 to 39 govern notifying authorities
  # and notified bodies, and every other paragraph of them binds one of those two. Art. 36(8)(b) is
  # the exception: inside a paragraph about when certificates stay valid, its second half turns and
  # binds the provider holding the certificate, in writing and on a three-month clock.
  # Art. 41(5) IS A DISJUNCTION — "providers of high-risk AI systems OR general-purpose AI models"
  # — and the two limbs reach different readers under different classes. One rule cannot express
  # it: `applies_to_risk_class` is what selects, so a single rule naming both roles would raise the
  # duty against a model provider on a HIGH-RISK SYSTEM run and still never reach a model, which is
  # the half that was missing. Split by duty-holder, as Art. 22 and Art. 54 are.
  - rule_id: AIA-RULE-GP-A41-5
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 41
      paragraph: 5 # the general-purpose AI model limb of the same paragraph
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      The duty exists only where the Commission has actually ADOPTED a common specification under
      Art. 41(1) that covers the Chapter V obligation in question, and the provider has chosen not
      to comply with it. Which obligations are covered at any moment is a fact about the Official
      Journal rather than about this model, so the obligation is listed with the condition attached
      rather than asserted of every model provider or dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A written justification that the technical solutions actually adopted comply with the
      obligations set out in SECTIONS 2 AND 3 OF CHAPTER V — Arts. 53 to 55 — TO A LEVEL AT LEAST
      EQUIVALENT to the common specification not followed. The standard is equivalence, not
      reasonableness. "Duly justify" means the argument is recorded, so a provider that departed
      from a common specification and wrote nothing down cannot satisfy this after the fact. Which
      specifications are in force is not visible in the documentation — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      SECTION 5 WAS NOT MOVED. Regulation (EU) 2026/1744 deferred Chapter III Sections 1, 2 and 3 —
      Art. 113(c) names those three — to 2 December 2027 for an Annex III system and 2 August 2028
      for an Annex I one, and left Section 5 on the general date of 2 August 2026. This rule
      therefore applies from 2 August 2026, as its high-risk twin AIA-RULE-PO-A41-5 does. What does
      NOT carry over is that twin's inversion: the obligations this limb measures equivalence
      against are Arts. 53 to 55, which have applied since 2 August 2025, so here the duty follows
      the obligations it rests on instead of preceding them.
    status: active

  - rule_id: AIA-RULE-PO-A36-8
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 36
      paragraph: 8 # the provider's written confirmation of a replacement notified body
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    # NO ROUTE GATE. An Annex III provider reaches a notified body through Art. 43(1); an Annex I
    # Section A provider reaches one through the sectoral act Art. 43(3) sends it to, and whether
    # that body is designated under Arts. 29 to 39 or under the sectoral act is a question about
    # the body, not about the system. Gating on route would drop the second case whenever the
    # answer is this Regulation. The certificate condition is stated below instead.
    activation_condition: >-
      Three things must all hold before this duty exists, and none of them is a fact about the
      system. The provider must hold a notified body certificate at all — so it took a third-party
      assessment route rather than internal control under Annex VI. That body's designation must
      then have been SUSPENDED OR RESTRICTED, which is the notifying authority's act under
      Art. 36(4); a full withdrawal is Art. 36(9) instead, and puts nothing on the provider. And
      the notifying authority must have determined, under point (b), that the body cannot go on
      monitoring and remaining responsible for existing certificates. Only then does the clock
      start. Nothing in a description of the system says whether any of it has happened, so the
      obligation is listed with the condition attached rather than asserted of every provider or
      dropped.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A written confirmation, sent to the national competent authorities of the Member State where
      the provider has its registered place of business, WITHIN THREE MONTHS of the suspension or
      restriction, that another qualified notified body is temporarily assuming the suspended
      body's functions — monitoring and remaining responsible for the certificates for the period
      of the suspension or restriction. The provider must therefore have found that replacement
      body itself; the Article gives it no one. Missing the deadline is not a paperwork failure,
      because the certificate's continued validity under 36(8) is what rests on it. A relational
      obligation triggered by someone else's act, not visible in the technical documentation —
      confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    effective_date_note: >-
      Art. 113(b) applies Chapter III Section 4 from 2 August 2025, without any of the route splits
      Art. 113(c) writes for Sections 1 to 3. So this duty has been live since before the
      requirements the certificate attests to bind at all. That is what the dates say; it is the
      same inversion recorded on AIA-RULE-PO-A43-4, and for the same reason — the amending Regulation
      moved Sections 1 to 3 and left the rest where it was.
    status: active

  # Art. 43 splits THREE WAYS and the split is by route and area, not by anything a single rule
  # could express. Until `applies_to_annex_iii_area` existed, the spec carried 43(2) alone with a
  # comment saying "employment is Annex III point 4", and fired it at biometrics and at Annex I
  # systems too — citing the wrong paragraph and the wrong Annex, confidently, to two systems out
  # of three. The comment was the condition; now the condition is the condition.
  - rule_id: AIA-RULE-PO-A43-1
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 43
      paragraph: 1
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    applies_to_annex_iii_area: [biometrics]
    obligation_status: mandatory
    check_type: presence
    # No `annex` on the source: paragraph 1 offers a CHOICE between Annex VI and Annex VII where
    # harmonised standards were applied, and compels Annex VII where they were not. Naming one
    # would assert the branch the paragraph leaves open.
    evidence_expected: >-
      Evidence of the conformity assessment route taken for an Annex III point 1 (biometrics)
      system. Unlike every other Annex III area this one can require a NOTIFIED BODY: internal
      control (Annex VI) is available only where harmonised standards or common specifications were
      applied, and Annex VII is compulsory otherwise. Which applies turns on the standards the
      provider used, so the route and the standards relied on both have to be stated. Annex VII is
      compulsory in four cases the paragraph names: no harmonised standard exists and no common
      specification is available; the provider did not apply the harmonised standard, or applied
      only part of it; common specifications exist and the provider did not apply them; or a
      harmonised standard was published WITH A RESTRICTION, and then only on the restricted part.
      EACH BRANCH CARRIES ITS OWN WORK, and both are selected alongside this rule: AIA-RULE-PO-A43-1A
      sets out what internal control under Annex VI requires, AIA-RULE-PO-A43-1B what the Annex VII
      notified-body route requires. WHICH NOTIFIED BODY IS NOT ALWAYS THE PROVIDER'S CHOICE. On the
      Annex VII route the provider may choose any of the notified bodies — except where the system
      is intended to be put into service by LAW ENFORCEMENT, IMMIGRATION OR ASYLUM AUTHORITIES, or
      by Union institutions, bodies, offices or agencies, in which case the market surveillance
      authority referred to in Art. 74(8) or (9) shall act as the notified body. A provider selling
      into those authorities does not appoint a body; one is fixed for it by the intended customer.
      A procedural act preceding market placement — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      IN FORCE ALREADY, AND EARLIER THAN WHAT IT ATTESTS TO — which reads like an error and is
      not one. Regulation (EU) 2026/1744 moved Chapter III Sections 1 to 3 to 2 December 2027 for
      an Annex III system and 2 August 2028 for an Annex I one, and did NOT move Section 5, where
      this obligation sits. So the conformity assessment applies from the general date of 2 August 2026,
      while the Section 2 requirements it is assessed against wait another sixteen months or more. The
      sequence is what Art. 113(c) says, not a transcription of it: that paragraph names Sections
      1, 2 and 3 only. Whether the legislator intended Section 5 to run ahead of them, or simply
      did not carry it across, is a question for advice rather than for this tool — which reports
      the date the Article gives and says plainly that it looks inverted.
    status: active

  # WHAT THE INTERNAL-CONTROL ROUTE CONSISTS OF, and the mirror of AIA-RULE-PO-A43-1B. Art. 43(1)(a)
  # lets an Annex III point 1 provider that applied harmonised standards ELECT Annex VI, and
  # electing it is not a lighter filing — it is three verifications nobody outside the provider's
  # organisation witnesses. AIA-RULE-PO-A43-2 carries the same Annex for points 2 to 8, where Art. 43(2)
  # makes it compulsory rather than elected.
  - rule_id: AIA-RULE-PO-A43-1A
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 43
      paragraph: 1 # the Annex VI branch of the choice
      annex: "VI"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    applies_to_role: [provider]
    applies_to_annex_iii_area: [biometrics]
    activation_condition: >-
      Owed only where the provider ELECTED internal control, which Art. 43(1)(a) offers only where
      harmonised standards under Art. 40 or common specifications under Art. 41 were applied in
      demonstrating conformity with the Section 2 requirements. Where none were applied, or only
      part of one was, Annex VII is compulsory and AIA-RULE-PO-A43-1B is the rule instead. Which
      standards exist is a fact about the Official Journal and which were applied is a fact about
      the provider, so neither is settled by a description of the system.
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      THREE VERIFICATIONS THE PROVIDER PERFORMS ITSELF, which together are the whole of the Annex VI
      procedure. That the established QUALITY MANAGEMENT SYSTEM complies with Art. 17 — the same
      system AIA-RULE-PO-A17 checks. That the information contained in the TECHNICAL DOCUMENTATION
      supports conformity of the system with the relevant essential requirements of Chapter III
      Section 2. And that the DESIGN AND DEVELOPMENT PROCESS and the Art. 72 post-market monitoring
      are CONSISTENT WITH that technical documentation — a cross-check between what the file says
      was built and what the organisation actually does, which is the one of the three that a
