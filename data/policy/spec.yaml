  # ELEVEN RULES FOR ONE ARTICLE, and the split is the Act's rather than a preference. Art. 26 runs to
  # twelve paragraphs and several duties narrow by deployer type, workplace use, public authority,
  # Annex III systems, or post-remote biometric identification. A narrowing is stated on the rule,
  # in `activation_condition` or a gate, and the report renders it beside the obligation; folded
  # into one rule's evidence text it becomes a sentence a reader has to notice and apply to
  # themselves. Art. 26(12) carries no narrowing and is separate for the other reason a rule earns
  # its own entry: it is answered by whoever handles an authority, not by whoever operates the
  # system. AIA-RULE-DP-A26 keeps the core duties that bind every deployer alike.
