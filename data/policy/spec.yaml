      production duties elsewhere in Chapter V: Art. 53(1)(a) and (b) say what documentation is
      held and for whom, and Art. 55(1)(c) says what is reported to the AI Office, while this
      paragraph reaches whatever an authority's exercise of its powers requires — access, answers,
      a named contact who can give them. What makes it actionable in advance is having decided who
      answers and on what timescale before the request arrives. Conduct during an authority's
      exercise of its powers rather than a property of any file — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

  - rule_id: AIA-RULE-GP-A53-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 53
      paragraph: 4 # demonstrate alternative adequate means of compliance
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      Owed by a provider that adheres to NEITHER an approved code of practice under Art. 56 NOR a
      European harmonised standard covering the Art. 53(1) obligations. A provider that does either
      owes nothing here: a code of practice may be relied on to demonstrate compliance until a
      harmonised standard is published, and compliance with a harmonised standard grants the
      presumption of conformity so far as it covers those obligations. Which codes are approved and
      which standards published is a fact about the Official Journal rather than about this model.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      A demonstration of ALTERNATIVE ADEQUATE MEANS of complying with the four Art. 53(1) duties,
      prepared FOR ASSESSMENT BY THE COMMISSION. The first two sentences of the paragraph are a
      permission and a presumption; this is the duty, and it bites on the provider that took
      neither route. "Adequate" is measured against what the code or standard would have required,
      so an account of the provider's own practices that never engages with them does not answer
      it. The Chapter V twin of Art. 41(5). Addressed to the Commission rather than recorded in a
      file — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

  # ART. 54 IS THE CHAPTER V TWIN OF ART. 22, and it splits by PARTY the same way: the provider
  # appoints and enables, the representative performs and terminates. Filed under two roles for
  # that reason, and Art. 3(5) makes the same `authorised_representative` the duty-holder — it
  # covers a mandate from a provider of an AI system OR of a general-purpose AI model.
  - rule_id: AIA-RULE-GP-A54-1
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 54
      paragraph: 1 # appoint an authorised representative before placing on the market
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      Binds providers ESTABLISHED IN THIRD COUNTRIES, and nobody else — a provider established in
      the Union needs no representative and owes nothing here. Art. 54(6) then lifts the whole
      Article for a model released under a free and open-source licence with publicly available
      parameters, architecture and usage information, unless the model presents systemic risk.
      Neither fact is answered by any node.
    obligation_status: mandatory
    check_type: presence
    evidence_expected: >-
      An authorised representative established in the Union, appointed BY WRITTEN MANDATE and
      appointed PRIOR TO placing the model on the Union market — an appointment made afterwards
      does not cure the breach. The Chapter V twin of Art. 22(1), and mis-attributable the same
      way: the duty is the PROVIDER'S, not the representative's. The mandate must also empower the
      representative to carry out the four Art. 54(3)(a) to (d) tasks. An appointment recorded in a
      contract, not in a model card — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    criteria:
      - norm_id: AIA-NORM-A054-P1-APPOINT-REPRESENTATIVE
      - norm_id: AIA-NORM-A054-P3-MANDATE-EMPOWER-TASKS
    status: active

  - rule_id: AIA-RULE-GP-A54-2
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 54
      paragraph: 2 # enable the representative to perform the mandate
      act_version_date: 2026-07-27
    applies_to_risk_class: [gpai_model]
    applies_to_role: [gpai_provider]
    activation_condition: >-
      Owed by the same third-country provider that owes Art. 54(1), and lifted by the same
