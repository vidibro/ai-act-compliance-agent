      ACCESS TO THE MODEL, granted as the Art. 92(3) request specifies — through APIs or further
      appropriate technical means and tools, SOURCE CODE INCLUDED. The Chapter V counterpart of
      Art. 74(13) and the same practical problem: an evaluation the Commission may conduct itself
      or through independent experts appointed under Art. 92(2), so the access has to work for
      someone outside the provider. Art. 92(4) requires the request to state the Art. 101 fines.
      Who grants it is settled as in Art. 91(5): for legal persons, companies or firms, and where
      the provider has no legal personality, the persons authorised to represent them by law or by
      statute. A relational obligation toward the Commission — confirm separately.
    document_verifiable: false
    effective_date: 2025-08-02
    status: active

  - rule_id: AIA-RULE-GP-A53-3
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 53
      paragraph: 3 # cooperate with the Commission and national competent authorities
