  # ------------------------------------------------------------------------------------------
  # Arts. 60-61 — TESTING IN REAL WORLD CONDITIONS. An elective route, and the only block of
  # duties in this ruleset that binds before the technical file is finished: the plan is submitted
  # and approved and the testing registered BEFORE the first live input. A provider that has not
  # taken the route owes none of it, which is why every rule here carries
  # `requires_real_world_testing` and the gap layer asks. Silence selects them — see the flag's own
  # docstring for why the default runs the opposite way to Art. 25's.
  #
  # THE SECTION B ROUTE IS NOT HERE, and the reason is not the chapter. Arts. 60, 60a and 61 sit in
  # Chapter VI, so Art. 2(2)'s withholding of Chapter III does not touch them. What puts Art. 60a
  # outside these rules is that it is addressed to MEMBER STATES: it permits a Member State to
  # allow real-world testing of an Annex I Section B product, and Art. 60a(5)(b) then requires the
  # national framework to ensure compliance with Art. 60(2), (3), (4)(d) to (j) and (5) to (9). A
  # Section B provider running a trial therefore owes most of what AIA-RULE-PO-A60-4 states, but owes it
  # under the national measure rather than under a provision of this Regulation a rule could cite.
  # The ledger's Art. 60a entries carry that reading.
  - rule_id: AIA-RULE-PO-A60-4
    source:
      instrument: "Regulation (EU) 2024/1689"
      article: 60
      paragraph: 4 # the eleven conditions that must ALL be met before testing
      annex: "IX"
      act_version_date: 2026-07-27
    applies_to_risk_class: [high_risk]
    # BOTH PARTIES. Points (h) and (j) bind a deployer taking part in the testing beside the
    # provider: the roles-and-responsibilities agreement and qualified oversight. The deployer's
    # report shows those two criteria only.
    applies_to_role: [provider, deployer]
    # ANNEX IX IS SUPPLIED, because point (c) registers the testing "with the information specified
    # in Annex IX" and the Annex is that information. Without it the registration limb is a
    # pointer to a list nobody reads.
    requires_real_world_testing: true
    activation_condition: >-
      Owed only where the provider conducts, or intends to conduct, TESTING IN REAL WORLD
      CONDITIONS OUTSIDE AN AI REGULATORY SANDBOX under Art. 60. Testing inside a sandbox is
      supervised by the competent authority instead, which verifies Art. 60 compliance under
      Art. 76(2) and may waive conditions (f) and (g). Every condition below binds BEFORE the
      testing starts, so a provider reading this after a trial has begun is already late.
    obligation_status: mandatory
    check_type: completeness
    evidence_expected: >-
      Eleven conditions, ALL of which must be met before testing begins. (a) A REAL-WORLD TESTING
      PLAN drawn up and submitted to the market surveillance authority of the Member State where
      the testing takes place. (b) That authority's APPROVAL of both the testing and the plan —
      with no answer within 30 days counting as approval, except where national law provides no
      tacit approval, in which case an authorisation is still required. (c) REGISTRATION, by one of
      THREE ROUTES that differ in where the entry goes and what it holds: for most systems, under
      Art. 71(4) with a Union-wide unique single identification number and the whole of Annex IX;
      for Annex III points 1, 6 and 7 used for law enforcement, migration, asylum or border
      control, in the SECURE NON-PUBLIC section under Art. 49(4)(d), again with a Union-wide
      number but with ANNEX IX POINTS 1, 2, 3 AND 5 ONLY — point 4, the summary of the testing
      plan, is not entered; and for an Annex III point 2 system, AT NATIONAL LEVEL under
      Art. 49(5), which specifies neither a Union-wide number nor the Annex IX contents. (d) The provider ESTABLISHED IN THE
      UNION, or a legal representative established here. (e) Data transferred to third countries
      only under appropriate and applicable Union-law safeguards. (f) A duration no longer than
      necessary and IN ANY CASE NOT LONGER THAN SIX MONTHS, extendable once by six months on prior
      notification to the authority with an explanation of why. (g) Appropriate protection for
      subjects belonging to VULNERABLE GROUPS by reason of age or disability. (h) Where a deployer
      takes part, that deployer informed of all aspects relevant to its decision to participate,
      given the Art. 13 instructions for use, and bound by a WRITTEN AGREEMENT specifying the roles
      and responsibilities of each party. (i) INFORMED CONSENT from the subjects under Art. 61 —
      except in law enforcement, where seeking it would prevent the testing, and then only if the
      testing has no negative effect on the subjects and their personal data is deleted afterwards.
      (j) Effective oversight of the testing by the provider AND by any participating deployer,
      through persons suitably qualified with the capacity, training and authority to do it.
      (k) Predictions, recommendations and decisions that can be EFFECTIVELY REVERSED AND
      DISREGARDED. A deployer or prospective deployer taking part owes points (h) and (j) with the
      provider: the written agreement on roles and responsibilities, and qualified oversight of the
      testing. A programme of acts before and around a trial rather than a property of the
      technical file — confirm separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
      Arts. 60 and 61 sit in Chapter VI. Art. 113(c) defers Chapter III Sections 1, 2 and 3 only,
      and none of the other carve-outs in 113(a) to (d) reaches Chapter VI, so the testing regime
      runs from the general date of 2 August 2026 — ahead of the Chapter III Section 2
      requirements a trial is run to establish. A provider testing on live inputs today owes these
      conditions today, whichever Art. 6 door its system came through.
    criteria:
