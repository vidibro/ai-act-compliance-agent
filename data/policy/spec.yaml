      filing but three verifications the provider performs itself and no notified body checks:
      that the established quality management system complies with Art. 17; that the information in
      the technical documentation supports conformity with the Chapter III Section 2 requirements;
      and that the design and development process and the Art. 72 post-market monitoring are
      CONSISTENT WITH that technical documentation. Nothing outside the provider's own organisation
      records that they were done, which is what makes the route the easier one to leave undone.
      The Annex VII branch is set out at AIA-PO-A43-1B, which is selected alongside this rule and
      states what that route requires. A procedural act preceding market placement — confirm
      separately.
    document_verifiable: false
    effective_date: 2026-08-02
    effective_date_note: >-
