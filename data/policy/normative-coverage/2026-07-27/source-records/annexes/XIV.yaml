records:
- norm_id: AIA-NORM-ANNEX-XIV-DESIGNATED-BODIES-ONLY
  source: ANNEX-XIV-P003
  quote: Only conformity assessment bodies that have been designated in accordance with this Regulation may carry out conformity assessments and only for the activities related to the types of AI systems concerned.
  action: prohibit a conformity-assessment body from carrying out assessments unless it is designated under the Regulation and acting within its designated AI-system scope
  actors:
  - actor_ref: conformity_assessment_body
  targets: []
  kind: prohibition
  product_scope: &outside_scope outside_supported_actor
  product_scope_reason: &outside_reason The present product does not report compliance for this addressee.
  implementation_mode: &none_required none_required
  implementation_reason: &outside_implementation Outside the supported operator reporting surface.
  verification_mode: &not_reported not_reported
- norm_id: AIA-NORM-ANNEX-XIV-CODES-SET-DESIGNATION-SCOPE
  source: ANNEX-XIV-P003
  quote: The list of codes, categories, and corresponding types of AI systems sets the scope of the designation of conformity assessment bodies notified under Article 30.
  action: use the Annex XIV code mappings as the legal scope of an Article 30 notified conformity-assessment body's designation
  actors:
  - actor_ref: conformity_assessment_body
  targets: []
  kind: legal_consequence
  product_scope: *outside_scope
  product_scope_reason: *outside_reason
  implementation_mode: *none_required
  implementation_reason: *outside_implementation
  verification_mode: *not_reported
