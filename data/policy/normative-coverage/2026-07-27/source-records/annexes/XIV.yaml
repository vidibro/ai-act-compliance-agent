- norm_id: AIA-NORM-ANNEX-XIV-USE-CODES-IN-APPLICATION
  source: ANNEX-XIV-P009
  quote: Conformity assessment bodies shall use the lists of codes, categories and corresponding types of AI systems set out in this Annex when specifying the types of AI systems in the application for designation referred to in Article 29.
  action: use the Annex XIV lists when specifying AI-system types in an Article 29 designation application
  subject_ref: conformity_assessment_body
  subject_category: *body_category
  product_scope: *outside_scope
  product_scope_reason: *outside_reason
  implementation_mode: *none_required
  implementation_reason: *outside_implementation
  verification_mode: *not_reported
  dependencies:
  - dependency_ref: AIA-NORM-A029-P1-SUBMIT-APPLICATION
    resolution: internal_resolved
    detail: Article 29(1) requires the conformity-assessment body to submit its designation application.
