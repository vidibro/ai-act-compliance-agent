- norm_id: AIA-NORM-ANNEX-VII-CERTIFICATE-CONTENT
  source: ANNEX-VII-P025
  quote: The certificate shall indicate the name and address of the provider, the conclusions of the examination,
    the conditions (if any) for its validity and the data necessary for the identification of the AI system.
    The certificate and its annexes shall contain all relevant information to allow the conformity of
    the AI system to be evaluated, and to allow for control of the AI system while in use, where applicable.
  action: include the required provider, examination, validity, identification, evaluation, and in-use
    control information in the Union technical-documentation assessment certificate and its annexes
  actors:
  - actor_ref: notified_body
    basis_segment_ids: [AIA-TEXT-ANNEX-VII-P025]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - provider name and address
  - conclusions of the examination
  - any conditions for certificate validity
  - data necessary to identify the AI system
  - all relevant information needed to evaluate the AI system's conformity
  - all relevant information needed to control the AI system while in use, where applicable
