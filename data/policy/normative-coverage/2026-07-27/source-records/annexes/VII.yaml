- norm_id: AIA-NORM-ANNEX-VII-MODEL-ACCESS
  source: ANNEX-VII-P024
  quote: Where necessary to assess the conformity of the high-risk AI system with the requirements set
    out in Chapter III, Section 2, after all other reasonable means to verify conformity have been exhausted
    and have proven to be insufficient, and upon a reasoned request, the notified body shall also be granted
    access to the training and trained models of the AI system, including its relevant parameters. Such
    access shall be subject to existing Union law on the protection of intellectual property and trade
    secrets.
  action: grant reasoned and necessary model access after other means are exhausted
  actors:
  - actor_ref: provider
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: carried_by_other_norm
  implementation_reason: Carried by the Article 43(1) and 43(3) Annex VII route norms.
  verification_mode: reported_not_judged
  conditions:
