  source: ANNEX-VII-P025
  quote: Where the AI system is in conformity with the requirements set out in Chapter III, Section 2,
    the notified body shall issue a Union technical documentation assessment certificate.
  action: issue the certificate where the system conforms
  actors:
  - actor_ref: notified_body
    basis_segment_ids: [AIA-TEXT-ANNEX-VII-P025]
  targets: []
