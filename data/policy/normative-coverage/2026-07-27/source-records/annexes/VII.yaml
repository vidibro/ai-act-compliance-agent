      basis_segment_ids: [AIA-TEXT-ANNEX-VII-P024]
    - text: after all other reasonable means to verify conformity have been exhausted and have proven to be insufficient
      basis_segment_ids: [AIA-TEXT-ANNEX-VII-P024]
    - text: upon a reasoned request
      basis_segment_ids: [AIA-TEXT-ANNEX-VII-P024]
  verified_by: vidibro
- norm_id: AIA-NORM-ANNEX-VII-RETRAIN
  source: ANNEX-VII-P025
  quote: Where the AI system does not meet the requirement relating to the data used to train it, re-training
    of the AI system will be needed prior to the application for a new conformity assessment.
  action: retrain before reapplying where training data fail the requirement
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-ANNEX-VII-P025]
  targets: []
  kind: legal_consequence
  conditions:
