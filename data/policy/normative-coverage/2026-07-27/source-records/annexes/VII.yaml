- norm_id: AIA-NORM-ANNEX-VII-DOC-APPLICATION
  source: ANNEX-VII-P017
  quote: In addition to the application referred to in point 3, an application with a notified body of
    their choice shall be lodged by the provider for the assessment of the technical documentation relating
    to the AI system which the provider intends to place on the market or put into service and which is
    covered by the quality management system referred to under point 3.
  action: lodge an application with a notified body of the provider's choice for assessment of the technical
    documentation of the covered AI system
