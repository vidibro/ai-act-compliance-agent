      basis_segment_ids: [AIA-TEXT-ANNEX-VII-P022]
    - text: limited to what is necessary to fulfil its tasks
      basis_segment_ids: [AIA-TEXT-ANNEX-VII-P022]
  verified_by: vidibro
- norm_id: AIA-NORM-ANNEX-VII-EVIDENCE
  source: ANNEX-VII-P023
  quote: In examining the technical documentation, the notified body may require that the provider supply
    further evidence or carry out further tests so as to enable a proper assessment of the conformity
    of the AI system with the requirements set out in Chapter III, Section 2.
  action: supply further evidence or tests required for the conformity assessment
