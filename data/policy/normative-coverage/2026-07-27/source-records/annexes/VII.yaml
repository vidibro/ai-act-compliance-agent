  source: ANNEX-VII-P025
  quote: In this case, the reasoned assessment decision of the notified body refusing to issue the Union
    technical documentation assessment certificate shall contain specific considerations on the quality
    data used to train the AI system, in particular on the reasons for non-compliance.
  action: state specific training-data non-compliance considerations in the refusal decision
