- norm_id: AIA-NORM-ANNEX-VII-DATA-ACCESS
  source: ANNEX-VII-P022
  quote: Where relevant, and limited to what is necessary to fulfil its tasks, the notified body shall
    be granted full access to the training, validation, and testing data sets used, including, where appropriate
    and subject to security safeguards, through API or other relevant technical means and tools enabling
    remote access.
  action: grant the notified body full access to the training, validation and testing data sets, including
    remote access through an API or other technical means where appropriate and subject to security safeguards
  actors:
  - actor_ref: provider
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
