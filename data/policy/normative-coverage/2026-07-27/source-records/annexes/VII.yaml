- norm_id: AIA-NORM-ANNEX-VII-QMS-APPLICATION
  source: ANNEX-VII-P006
  quote: The application of the provider shall include
  action: complete the Annex VII quality-management application
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-ANNEX-VII-P006]
  targets: []
  qualifier_spans:
  - ANNEX-VII-P007
  - ANNEX-VII-P008
  - ANNEX-VII-P009
  - ANNEX-VII-P010
  - ANNEX-VII-P011
  - ANNEX-VII-P012
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: carried_by_other_norm
  implementation_reason: Carried by the Article 43(1) and 43(3) Annex VII route norms.
  verification_mode: reported_not_judged
  mandatory_content:
  - the name and address of the provider
  - if the application is lodged by an authorised representative, also their name and address
  - the list of AI systems covered under the same quality management system
  - the technical documentation for each AI system covered under the same quality management system
  - the documentation concerning the quality management system, covering all the aspects listed under
    Article 17
  - a description of the procedures in place to ensure that the quality management system remains adequate
    and effective
  - a written declaration that the same application has not been lodged with any other notified body
  verified_by: vidibro
