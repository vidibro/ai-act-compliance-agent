- norm_id: AIA-NORM-ANNEX-VII-TESTS
  source: ANNEX-VII-P023
  quote: Where the notified body is not satisfied with the tests carried out by the provider, the notified
    body shall itself directly carry out adequate tests, as appropriate.
  action: carry out adequate tests when provider testing is unsatisfactory
