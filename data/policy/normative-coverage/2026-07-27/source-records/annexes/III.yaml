records:
- norm_id: AIA-NORM-ANNEX-III-1A-REMOTE-BIOMETRIC-IDENTIFICATION
  source: ANNEX-III-P003
  quote: remote biometric identification systems. This shall not include AI systems intended to be used
    for biometric verification the sole purpose of which is to confirm that a specific natural person
    is the person he or she claims to be;
  action: classify remote biometric identification systems as an Annex III high-risk use case
  actors: []
  targets:
  - target_ref: remote_biometric_identification_system
  kind: applicability
  verification_mode: answered_by_classification
  qualifier_spans:
  - ANNEX-III-P001
  - ANNEX-III-P002
  conditions:
  - the use is permitted under relevant Union or national law
  exceptions:
  - biometric verification used solely to confirm that a specific person is who they claim to be
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-ANNEX-III
  verified_by: vidibro
