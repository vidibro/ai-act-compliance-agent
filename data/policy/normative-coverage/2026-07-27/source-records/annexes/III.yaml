- norm_id: AIA-NORM-ANNEX-III-7C-ASYLUM-VISA-RESIDENCE
  source: ANNEX-III-P029
  quote: AI systems intended to be used by or on behalf of competent public authorities or by Union institutions,
    bodies, offices or agencies to assist competent public authorities for the examination of applications
    for asylum, visa or residence permits and for associated complaints with regard to the eligibility
    of the natural persons applying for a status, including related assessments of the reliability of
    evidence;
  action: classify assistance with asylum, visa, or residence applications, associated complaints, eligibility,
    or evidence reliability as an Annex III high-risk use case
  actors: []
  targets:
  - target_ref: asylum_visa_residence_ai_system
