- norm_id: AIA-NORM-ANNEX-III-6D-OFFENDING-RISK
  source: ANNEX-III-P024
  quote: AI systems intended to be used by law enforcement authorities or on their behalf or by Union
    institutions, bodies, offices or agencies in support of law enforcement authorities for assessing
    the risk of a natural person offending or re-offending not solely on the basis of the profiling of
    natural persons as referred to in Article 3(4) of Directive (EU) 2016/680, or to assess personality
    traits and characteristics or past criminal behaviour of natural persons or groups;
  action: classify listed law-enforcement offending-risk, personality, characteristic, or criminal-behaviour
    assessment as an Annex III high-risk use case
  actors: []
  targets:
  - target_ref: offending_risk_ai_system
  kind: applicability
  verification_mode: answered_by_classification
  qualifier_spans:
  - ANNEX-III-P001
  - ANNEX-III-P020
  conditions:
  - the use is permitted under relevant Union or national law
  - offending or reoffending risk is not assessed solely from profiling under Directive (EU) 2016/680
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-ANNEX-III
  verified_by: vidibro
