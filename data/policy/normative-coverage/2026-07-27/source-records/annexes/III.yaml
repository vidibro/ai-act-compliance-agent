  source: ANNEX-III-P025
  quote: AI systems intended to be used by or on behalf of law enforcement authorities or by Union institutions,
    bodies, offices or agencies in support of law enforcement authorities for the profiling of natural
    persons as referred to in Article 3(4) of Directive (EU) 2016/680 in the course of the detection,
    investigation or prosecution of criminal offences.
  action: classify profiling during criminal detection, investigation, or prosecution as an Annex III
    high-risk use case
