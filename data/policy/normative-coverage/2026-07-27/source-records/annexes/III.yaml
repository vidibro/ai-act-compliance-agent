- norm_id: AIA-NORM-ANNEX-III-7B-BORDER-RISK
  source: ANNEX-III-P028
  quote: AI systems intended to be used by or on behalf of competent public authorities or by Union institutions,
    bodies, offices or agencies to assess a risk, including a security risk, a risk of irregular migration,
    or a health risk, posed by a natural person who intends to enter or who has entered into the territory
    of a Member State;
  action: classify assessment of security, irregular-migration, or health risks posed by a person entering
    a Member State as an Annex III high-risk use case
