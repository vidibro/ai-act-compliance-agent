- norm_id: AIA-NORM-ANNEX-III-7D-BORDER-IDENTIFICATION
  source: ANNEX-III-P030
  quote: AI systems intended to be used by or on behalf of competent public authorities, or by Union institutions,
    bodies, offices or agencies, in the context of migration, asylum or border control management, for
    the purpose of detecting, recognising or identifying natural persons, with the exception of the verification
    of travel documents.
  action: classify detecting, recognising, or identifying people in migration, asylum, or border-control
    management as an Annex III high-risk use case
  actors: []
  targets:
  - target_ref: border_identification_ai_system
  kind: applicability
  verification_mode: answered_by_classification
  qualifier_spans:
  - ANNEX-III-P001
  - ANNEX-III-P026
  conditions:
  - the use is permitted under relevant Union or national law
  exceptions:
  - verification of travel documents
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-ANNEX-III
  verified_by: vidibro
- norm_id: AIA-NORM-ANNEX-III-8A-JUSTICE
  source: ANNEX-III-P032
  quote: AI systems intended to be used by a judicial authority or on their behalf to assist a judicial
    authority in researching and interpreting facts and the law and in applying the law to a concrete
    set of facts, or to be used in a similar way in alternative dispute resolution;
  action: classify AI assistance with judicial or alternative-dispute-resolution fact finding, legal interpretation,
    or application of law as an Annex III high-risk use case
  actors: []
  targets:
  - target_ref: justice_ai_system
  kind: applicability
  verification_mode: answered_by_classification
  qualifier_spans:
  - ANNEX-III-P001
  - ANNEX-III-P031
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-ANNEX-III
  verified_by: vidibro
- norm_id: AIA-NORM-ANNEX-III-8B-ELECTION-INFLUENCE
  source: ANNEX-III-P033
  quote: AI systems intended to be used for influencing the outcome of an election or referendum or the
    voting behaviour of natural persons in the exercise of their vote in elections or referenda. This
    does not include AI systems to the output of which natural persons are not directly exposed, such
    as tools used to organise, optimise or structure political campaigns from an administrative or logistical
    point of view.
  action: classify AI systems used to influence election or referendum outcomes or voting behaviour as
    an Annex III high-risk use case
  actors: []
  targets:
  - target_ref: election_influence_ai_system
  kind: applicability
  verification_mode: answered_by_classification
  qualifier_spans:
  - ANNEX-III-P001
  - ANNEX-III-P031
  exceptions:
  - administrative or logistical campaign tools whose outputs do not directly expose natural persons
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-ANNEX-III
  verified_by: vidibro
