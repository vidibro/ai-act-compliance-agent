- norm_id: AIA-NORM-ANNEX-I-20-UNMANNED-AIRCRAFT
  source: ANNEX-I-P002
  quote: Regulation (EU) 2018/1139
  action: include the specified unmanned-aircraft products covered by Regulation (EU) 2018/1139 in the Annex I Section B harmonisation-legislation scope
  subject_ref: annex_i_product_or_safety_component
  subject_category: other
  kind: applicability
  conditions:
  - the product concerns the design, production, or placing on the market of unmanned aircraft referred to in Article 2(1)(a) or (b) of Regulation (EU) 2018/1139, or their engines, propellers, parts, or remote-control equipment
  dependencies: *article6_dependency
