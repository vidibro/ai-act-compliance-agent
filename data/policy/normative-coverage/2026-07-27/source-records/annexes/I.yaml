records:
- norm_id: AIA-NORM-ANNEX-I-01-MACHINERY-DIRECTIVE
  source: ANNEX-I-P001
  quote: Directive 2006/42/EC
  action: include products covered by Directive 2006/42/EC on machinery in the Annex I Section A harmonisation-legislation scope
  subject_ref: annex_i_product_or_safety_component
  subject_category: other
  kind: applicability
  dependencies: &article6_dependency
  - dependency_ref: AIA-NORM-A006-P1-ANNEX-I-HIGH-RISK
    resolution: internal_resolved
    detail: Article 6(1) gives high-risk legal effect to the Annex I product listing when its cumulative conditions are met.
