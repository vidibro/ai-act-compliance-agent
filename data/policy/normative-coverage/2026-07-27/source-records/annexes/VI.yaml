records:
- norm_id: AIA-NORM-ANNEX-VI-P1-PROCEDURE-CONTENT
  source: ANNEX-VI-P001
  quote: The conformity assessment procedure based on internal control is the conformity assessment procedure based on points 2, 3 and 4.
  action: define the Annex VI internal-control conformity assessment as comprising the checks in points 2, 3, and 4
  actors: none
  targets:
  - target_ref: conformity assessment procedure based on internal control
    basis_segment_ids: [AIA-TEXT-ANNEX-VI-P001]
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: carried_by_other_norm
  implementation_reason: Carried by the Article 43(1) and 43(2) internal-control route norms.
  kind: applicability
  qualifier_spans:
