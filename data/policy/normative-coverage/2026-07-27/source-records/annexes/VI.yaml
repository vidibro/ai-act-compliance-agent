  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-ANNEX-VI-P3-EXAMINE-TECHNICAL-DOCUMENTATION
  source: ANNEX-VI-P003
  quote: The provider examines the information contained in the technical documentation in order to assess the compliance of the AI system with the relevant essential requirements set out in Chapter III, Section 2.
  action: examine the technical documentation to assess the AI system's compliance with the relevant Chapter III Section 2 requirements
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-ANNEX-VI-P003]
  targets: []
