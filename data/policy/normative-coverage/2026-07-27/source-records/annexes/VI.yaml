  - ANNEX-VI-P003
  - ANNEX-VI-P004
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-ANNEX-VI-P2-VERIFY-QMS
  source: ANNEX-VI-P002
  quote: The provider verifies that the established quality management system is in compliance with the requirements of Article 17.
  action: verify that the established quality management system complies with Article 17
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-ANNEX-VI-P002]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
