  implementation_reason: Carried by the Article 43(1) and 43(2) internal-control route norms.
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-ANNEX-VI-P4-VERIFY-CONSISTENCY
  source: ANNEX-VI-P004
  quote: The provider also verifies that the design and development process of the AI system and its post-market monitoring as referred to in Article 72 is consistent with the technical documentation.
  action: verify that the AI system's design and development process and Article 72 post-market monitoring are consistent with its technical documentation
