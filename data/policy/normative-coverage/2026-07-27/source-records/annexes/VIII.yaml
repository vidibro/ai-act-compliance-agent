  quote: The following information shall be provided and thereafter kept up to date
  action: submit and maintain the Section A provider registration information; entries 2, 3, 8 and 9
    apply only where their enacted condition is met, entry 12 is withheld for the enacted
    law-enforcement, migration, asylum and border-control systems, and entry 13 is optional
  subject_ref: provider
  subject_category: supported_operator
