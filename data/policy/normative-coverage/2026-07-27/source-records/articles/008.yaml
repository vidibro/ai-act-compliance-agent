records:
- norm_id: AIA-NORM-A008-P1-COMPLY-SECTION-REQUIREMENTS
  source: A008-P001
  quote: High-risk AI systems shall comply with the requirements laid down in this Section, taking into
    account their intended purpose as well as the generally acknowledged state of the art on AI and AI-related
    technologies.
  action: ensure high-risk AI systems comply with the Section 2 requirements while considering intended
    purpose and the generally acknowledged state of the art
  actors:
  - actor_ref: provider
  targets: []
  kind: obligation
  implementation_mode: carried_by_other_norm
  implementation_reason: The Article 16(a) provider duty states the same Section 2 compliance requirement
    and carries the substantive checks, so reporting both would duplicate every Section 2 finding.
  verification_mode: not_reported
  verified_by: vidibro
- norm_id: AIA-NORM-A008-P1-CONSIDER-RISK-MANAGEMENT
  source: A008-P001
  quote: The risk management system referred to in Article 9 shall be taken into account when ensuring
    compliance with those requirements.
  action: take the Article 9 risk-management system into account when ensuring compliance with the Section
    2 requirements
  actors:
  - actor_ref: provider
  targets: []
  kind: obligation
  implementation_refs:
  - AIA-HR-A09
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A008-P2-ENSURE-PRODUCT-COMPLIANCE
  source: A008-P002
  quote: Where a product contains an AI system, to which the requirements of this Regulation as well as
    requirements of the Union harmonisation legislation listed in Section A of Annex I apply, providers
    shall be responsible for ensuring that their product is fully compliant with all applicable requirements
    under applicable Union harmonisation legislation.
  action: ensure a product containing an AI system fully complies with every applicable requirement under
    the relevant Union harmonisation legislation
  actors:
  - actor_ref: provider
  targets: []
  kind: obligation
  conditions:
  - the product contains an AI system to which both this Regulation and Union harmonisation legislation
    listed in Annex I Section A apply
  implementation_mode: compliance_rule
  implementation_refs:
  - AIA-PO-A08-2
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A008-P2-INTEGRATE-COMPLIANCE-PROCESSES
  source: A008-P002
  quote: In ensuring the compliance of high-risk AI systems referred to in paragraph 1 with the requirements
    set out in this Section, and in order to ensure consistency, avoid duplication and minimise additional
    burdens, providers shall have a choice of integrating, as appropriate, the necessary testing and reporting
    processes, information and documentation they provide with regard to their product into documentation
    and procedures that already exist and are required under the Union harmonisation legislation listed
    in Section A of Annex I.
  action: integrate AI testing, reporting, information, and documentation into existing product documentation
    and procedures required by Annex I Section A legislation
  actors:
  - actor_ref: provider
  targets: []
  kind: permission
  conditions:
  - the product contains an AI system to which both this Regulation and Union harmonisation legislation
    listed in Annex I Section A apply
  - integration is appropriate for ensuring consistency, avoiding duplication, and minimising additional
    burdens
  implementation_mode: report_only
  implementation_refs:
  - AIA-PO-A08-2
  verification_mode: reported_conditionally
  verified_by: vidibro
