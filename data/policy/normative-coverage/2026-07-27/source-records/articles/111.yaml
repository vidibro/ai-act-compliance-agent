records:
- norm_id: AIA-NORM-A111-P1-BRING-LARGE-SCALE-IT-INTO-COMPLIANCE
  source: A111-P001
  quote: Without prejudice to the application of Article 5 as referred to in Article 113(3), point (a),
    AI systems which are components of the large-scale IT systems established by the legal acts listed
    in Annex X that have been placed on the market or put into service before 2 August 2027 shall be brought
    into compliance with this Regulation by 31 December 2030.
  action: bring pre-2-August-2027 Annex X large-scale IT system AI components into AI Act compliance by
    31 December 2030
  actors:
  - actor_ref: operator
    basis_segment_ids: [AIA-TEXT-A111-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: AI systems which are components of the large-scale IT systems established by the legal acts listed in Annex X
      basis_segment_ids: [AIA-TEXT-A111-P001]
    - text: that have been placed on the market or put into service before 2 August 2027
      basis_segment_ids: [AIA-TEXT-A111-P001]
  temporal_regime_id: AIA-TEMP-A111-P1-LARGE-SCALE-IT-BY
  product_scope: in_scope
  product_scope_reason: This is a transitional compliance duty for operators of AI components in covered
    systems.
  implementation_mode: compliance_rule
  implementation_refs:
  - AIA-RULE-ALL-A111-1
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A111-P1-ACCOUNT-FOR-REQUIREMENTS-IN-EVALUATION
  source: A111-P002
  quote: The requirements laid down in this Regulation shall be taken into account in the evaluation
  action: account for AI Act requirements when evaluating or replacing each Annex X large-scale IT system
  actors:
