      basis_segment_ids: [AIA-TEXT-A111-P004]
  verified_by: vidibro
- norm_id: AIA-NORM-A111-P4-LEGACY-SYNTHETIC-CONTENT-COMPLIANCE
  source: A111-P005
  quote: Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image,
    video or text content, that have been placed on the market before 2 August 2026 shall take the necessary
    steps in order to comply with Article 50(2) by 2 December 2026.
  action: bring pre-2-August-2026 synthetic-content-generating AI systems into Article 50(2) compliance
    by 2 December 2026
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A111-P005]
