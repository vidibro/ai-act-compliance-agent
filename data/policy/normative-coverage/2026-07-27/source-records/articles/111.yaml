      basis_segment_ids: [AIA-TEXT-A111-P003]
  temporal_regime_id: AIA-TEMP-A111-P2-PUBLIC-AUTHORITY-BY
  product_scope: in_scope
  product_scope_reason: This is a transitional compliance duty for supported providers and deployers.
  implementation_mode: compliance_rule
  implementation_refs:
