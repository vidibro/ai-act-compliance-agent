records:
- norm_id: AIA-NORM-A075B-MAKE-COMMITMENTS-BINDING
  source: A075B-P001
  quote: If, during proceedings under Article 75a(2), the operator concerned offers commitments to ensure
    compliance with the relevant provisions of this Regulation, the AI Office may, by decision, make those
    commitments binding on the operator concerned and declare that there are no further grounds for action.
  action: make offered compliance commitments binding and declare no further grounds for action
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075B-P001]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: all_of
    operands:
    - text: If, during proceedings under Article 75a(2), the operator concerned offers commitments to ensure compliance with the relevant provisions of this Regulation
      basis_segment_ids: [AIA-TEXT-A075B-P001]
- norm_id: AIA-NORM-A075B-REOPEN-PROCEEDINGS
  source: A075B-P001
  quote: 'The AI Office may, upon request or on its own initiative, reopen the proceedings where:'
  action: reopen proceedings on request or initiative for a listed change breach or information defect
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075B-P001]
  targets: []
  kind: power
  mandatory_content:
  - material factual change
  - operator acts contrary to commitments
  - decision based on incomplete incorrect or misleading operator information
  qualifier_spans:
  - A075B-P002
  - A075B-P003
  - A075B-P004
  conditions:
    operator: any_of
    operands:
    - text: there has been a material change in any of the facts on which the decision was based
      basis_segment_ids: [AIA-TEXT-A075B-P002]
    - text: the operator acts contrary to its commitments
      basis_segment_ids: [AIA-TEXT-A075B-P003]
    - text: the decision was based on incomplete, incorrect or misleading information provided by the operator concerned
      basis_segment_ids: [AIA-TEXT-A075B-P004]
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075B-REJECT-INEFFECTIVE-COMMITMENTS
  source: A075B-P005
  quote: Where the AI Office considers that the commitments offered by the operator concerned are unable
    to ensure effective compliance with the relevant provisions of this Regulation, it shall reject those
    commitments in a reasoned decision when concluding the proceedings.
  action: reject commitments unable to ensure effective compliance through a reasoned concluding decision
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075B-P005]
  targets: []
