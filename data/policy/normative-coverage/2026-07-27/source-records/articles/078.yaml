records:
- norm_id: AIA-NORM-A078-P1-PROTECT-CONFIDENTIALITY
  source: A078-P001
  quote: shall, in accordance with Union or national law, respect the confidentiality of information and
    data obtained in carrying out their tasks and activities in such a manner as to protect, in particular
  action: protect confidentiality of task-related information and data under Union or national law
  actors:
  - actor_ref: natural_or_legal_person
  targets: []
  mandatory_content:
  - the intellectual property rights and confidential business information or trade secrets of a natural
    or legal person, including source code
  - effective inspections, investigations and audits
  - public and national security
  - criminal and administrative proceedings
  - classified information
  exceptions:
  - point (a) only, the cases referred to in Article 5 of Directive (EU) 2016/943
  qualifier_spans:
  - A078-P002
  - A078-P003
  - A078-P004
  - A078-P005
  - A078-P006
  product_scope: outside_supported_actor
  product_scope_reason: The cross-actor confidentiality rule is represented at specific supported-operator
    receipt points rather than reported here generically.
  implementation_mode: none_required
  implementation_reason: No independent generic operator action is reported from this mixed-addressee
    provision.
  verification_mode: not_reported
- norm_id: AIA-NORM-A078-P2-REQUEST-ONLY-NECESSARY-DATA
  source: A078-P007
  quote: The authorities involved in the application of this Regulation pursuant to paragraph 1 shall
    request only data that is strictly necessary for the assessment of the risk posed by AI systems and
    for the exercise of their powers in accordance with this Regulation and with Regulation (EU) 2019/1020.
  action: request only data strictly necessary for risk assessment and exercise of enacted powers
  actors:
  - actor_ref: public_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A078-P2-PROTECT-OBTAINED-DATA
  source: A078-P007
  quote: They shall put in place adequate and effective cybersecurity measures to protect the security
    and confidentiality of the information and data obtained, and shall delete the data collected as soon
    as it is no longer needed for the purpose for which it was obtained
  action: protect obtained information and data through adequate effective cybersecurity and delete collected
    data as soon as its acquisition purpose no longer requires it
  actors:
  - actor_ref: public_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  mandatory_content:
  - adequate and effective cybersecurity protecting obtained information and data
  - deletion of collected data as soon as its acquisition purpose no longer requires it
  verification_mode: not_reported
- norm_id: AIA-NORM-A078-P3-RESTRICT-CONFIDENTIAL-DISCLOSURE
  source: A078-P008
  quote: Without prejudice to paragraphs 1 and 2, information exchanged on a confidential basis between
    the national competent authorities or between national competent authorities and the Commission shall
    not be disclosed without prior consultation of the originating national competent authority and the
    deployer when high-risk AI systems referred to in point 1, 6 or 7 of Annex III are used by law enforcement,
    border control, immigration or asylum authorities and when such disclosure would jeopardise public
    and national security interests.
  action: disclose confidentially exchanged information only after prior consultation of the originating
    national competent authority and the deployer
  actors:
  - actor_ref: national_competent_authority
  - actor_ref: commission
  targets: []
  conditions:
  - the high-risk AI systems referred to in point 1, 6 or 7 of Annex III are used by law enforcement,
    border control, immigration or asylum authorities
  - the disclosure would jeopardise public and national security interests
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A078-P3-EXCLUDE-SENSITIVE-OPERATIONAL-DATA
  source: A078-P008
  quote: This exchange of information shall not cover sensitive operational data in relation to the activities
    of law enforcement, border control, immigration or asylum authorities.
  action: exclude sensitive operational data on the activities of law enforcement, border control, immigration
    or asylum authorities from the exchange of information
  actors:
  - actor_ref: national_competent_authority
  - actor_ref: commission
  targets: []
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A078-P3-KEEP-DOCUMENTATION-AND-ENABLE-ACCESS
  source: A078-P009
  quote: When the law enforcement, immigration or asylum authorities are providers of high-risk AI systems
    referred to in point 1, 6 or 7 of Annex III, the technical documentation referred to in Annex IV shall
    remain within the premises of those authorities.
  action: keep the Annex IV technical documentation within the premises of the authority
  actors:
  - actor_ref: provider
  targets: []
  conditions:
  - the law enforcement, immigration or asylum authority is the provider of a high-risk AI system referred
    to in point 1, 6 or 7 of Annex III
  implementation_refs:
  - AIA-RULE-PO-A78-3
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A078-P3-ENABLE-IMMEDIATE-ACCESS
  source: A078-P009
  quote: Those authorities shall ensure that the market surveillance authorities referred to in Article
    74(8) and (9), as applicable, can, upon request, immediately access the documentation or obtain a
    copy thereof.
  action: ensure the applicable Article 74(8) and (9) market surveillance authorities can, upon request,
    immediately access the documentation or obtain a copy of it
  actors:
  - actor_ref: provider
  targets: []
  conditions:
  - the law enforcement, immigration or asylum authority is the provider of a high-risk AI system referred
    to in point 1, 6 or 7 of Annex III
  - the market surveillance authority requests access or a copy
  implementation_refs:
  - AIA-RULE-PO-A78-3
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A078-P3-SECURITY-CLEARED-ACCESS-ONLY
  source: A078-P009
  quote: Only staff of the market surveillance authority holding the appropriate level of security clearance
    shall be allowed to access that documentation or any copy thereof.
  action: allow only market surveillance authority staff holding the appropriate level of security clearance
    to access the documentation or any copy of it
  actors:
  - actor_ref: market_surveillance_authority
  targets: []
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A078-P4-PRESERVE-EXCHANGE-AND-CRIMINAL-LAW-DUTIES
  source: A078-P010
  quote: Paragraphs 1, 2 and 3 shall not affect the rights or obligations of the Commission, Member States
    and their relevant authorities, as well as those of notified bodies, with regard to the exchange of
    information and the dissemination of warnings, including in the context of cross-border cooperation,
    nor shall they affect the obligations of the parties concerned to provide information under criminal
    law of the Member States.
  action: preserve information-exchange warning and Member State criminal-law disclosure rights and duties
    despite paragraphs 1 to 3
  actors: none
  targets:
  - target_ref: persons_applying_article_78
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: This saving clause qualifies other duties without creating an independent product
    action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A078-P5-EXCHANGE-WITH-THIRD-COUNTRY-REGULATORS
  source: A078-P011
  quote: The Commission and Member States may exchange, where necessary and in accordance with relevant
    provisions of international and trade agreements, confidential information with regulatory authorities
    of third countries with which they have concluded bilateral or multilateral confidentiality arrangements
    guaranteeing an adequate level of confidentiality.
  action: exchange necessary confidential information with third-country regulators under applicable agreements
    and adequate confidentiality arrangements
  actors:
  - actor_ref: commission
  - actor_ref: member_state
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
