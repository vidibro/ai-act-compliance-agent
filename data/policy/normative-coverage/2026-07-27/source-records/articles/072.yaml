- norm_id: AIA-NORM-A072-P1-ESTABLISH-AND-DOCUMENT-MONITORING
  source: A072-P001
  quote: Providers shall establish and document a post-market monitoring system in a manner that is proportionate
    to the nature of the AI technologies and the risks of the high-risk AI system.
  action: establish and document a risk-proportionate post-market monitoring system
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A072-P001]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_refs:
