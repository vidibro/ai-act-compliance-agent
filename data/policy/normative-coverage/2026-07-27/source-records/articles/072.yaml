- norm_id: AIA-NORM-A072-P4-INTEGRATE-EXISTING-MONITORING
  source: A072-P004
  quote: For high-risk AI systems covered by the Union harmonisation legislation listed in Section A of
    Annex I, where a post-market monitoring system and plan are already established under that legislation,
    in order to ensure consistency, avoid duplications and minimise additional burdens, providers shall
    have a choice of integrating, as appropriate, the necessary elements described in paragraphs 1, 2
    and 3 using the template referred in paragraph 3 into systems and plans already existing under that
    legislation, provided that it achieves an equivalent level of protection.
  action: integrate Article 72 elements into an existing sectoral monitoring system and plan where equivalent
    protection is achieved
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A072-P004]
  targets: []
  kind: permission
  conditions:
    operator: all_of
    operands:
    - operator: any_of
      operands:
      - operator: all_of
        operands:
        - text: For high-risk AI systems covered by the Union harmonisation legislation listed in Section A of Annex I
          basis_segment_ids: [AIA-TEXT-A072-P004]
        - text: where a post-market monitoring system and plan are already established under that legislation
          basis_segment_ids: [AIA-TEXT-A072-P004]
      - text: high-risk AI systems referred to in point 5 of Annex III placed on the market or put into service by financial institutions that are subject to requirements under Union financial services law regarding their internal governance, arrangements or processes
