  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A072-P2-OPERATE-LIFETIME-MONITORING
  source: A072-P002
  quote: The post-market monitoring system shall actively and systematically collect, document and analyse
    relevant data which may be provided by deployers or which may be collected through other sources on
    the performance of high-risk AI systems throughout their lifetime, and which allow the provider to
    evaluate the continuous compliance of AI systems with the requirements set out in Chapter III, Section
    2. Where relevant, post-market monitoring shall include an analysis of the interaction with other
    AI systems. This obligation shall not cover sensitive operational data of deployers which are law-enforcement
    authorities.
  action: actively collect document and analyse lifetime performance and interaction data to evaluate
    continuous compliance while excluding protected law-enforcement data
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A072-P001]
  targets: []
  mandatory_content:
  - active systematic lifetime data collection documentation and analysis
  - continuous Chapter III Section 2 compliance evaluation
  - relevant interaction analysis with other AI systems
  exceptions:
    operator: any_of
    operands:
    - text: This obligation shall not cover sensitive operational data of deployers which are law-enforcement authorities
      basis_segment_ids: [AIA-TEXT-A072-P002]
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_refs:
  - AIA-RULE-PO-A72
  verification_mode: reported_not_judged
  verified_by: vidibro
