      basis_segment_ids: [AIA-TEXT-A022-P003]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A022-P3-MANDATE-EMPOWER-TASKS
  source: A022-P003
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: >-
    For the purposes of this Regulation, the mandate shall empower the authorised representative to
    carry out the following tasks: The mandate shall empower the authorised representative to be addressed,
    in addition to or instead of the provider, by the competent authorities, on all issues related to ensuring
    compliance with this Regulation.
  action: ensure the written mandate empowers the authorised representative to perform every Article 22(3)(a)
    to (e) task and to be addressed by competent authorities on all compliance issues alongside or instead
    of the provider
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A022-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: For the purposes of this Regulation
      basis_segment_ids: [AIA-TEXT-A022-P003]
  implementation_refs: *id001
  verification_mode: reported_not_judged
  mandatory_content:
  - authority to verify the declaration, technical documentation, and conformity assessment
  - authority to keep the enacted records available for the enacted period
  - authority to provide enacted conformity information and log access on request
  - authority to cooperate with competent authorities on request
  - authority to comply with or ensure applicable registration obligations
  - authority to be addressed by competent authorities on all compliance issues alongside or instead of the provider
  verified_by: vidibro
- norm_id: AIA-NORM-A022-P3-A-VERIFY
  source: A022-P004
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: verify that the EU declaration of conformity referred to in Article 47 and the technical documentation
    referred to in Article 11 have been drawn up and that an appropriate conformity assessment procedure
    has been carried out by the provider
  action: verify that the EU declaration and technical documentation exist and that the provider completed
    an appropriate conformity assessment
  actors:
  - actor_ref: authorised_representative
    basis_segment_ids: [AIA-TEXT-A022-P001]
  targets: []
  implementation_refs: *id002
  verification_mode: reported_not_judged
  qualifier_spans: &id004
  - A022-P003
  verified_by: vidibro
- norm_id: AIA-NORM-A022-P3-B-KEEP-RECORDS
  source: A022-P005
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: keep at the disposal of the competent authorities and national authorities or bodies referred
    to in Article 74(10), for a period of 10 years after the high-risk AI system has been placed on the
    market or put into service, the contact details of the provider that appointed the authorised representative,
    a copy of the EU declaration of conformity referred to in Article 47, the technical documentation
    and, if applicable, the certificate issued by the notified body
  action: keep the listed provider, conformity, technical, and applicable certification records available
    to the specified authorities for 10 years after the high-risk AI system is placed on the market or put
    into service
  actors:
  - actor_ref: authorised_representative
    basis_segment_ids: [AIA-TEXT-A022-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: for a period of 10 years after the high-risk AI system has been placed on the market or put into service
      basis_segment_ids: [AIA-TEXT-A022-P005]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  mandatory_content:
  - appointing provider contact details
  - EU declaration of conformity
  - technical documentation
  - notified-body certificate where applicable
  qualifier_spans: *id004
  verified_by: vidibro
- norm_id: AIA-NORM-A022-P3-C-PROVIDE-CONFORMITY-INFORMATION
  source: A022-P006
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: provide a competent authority, upon a reasoned request, with all the information and documentation,
    including that referred to in point (b) of this subparagraph, necessary to demonstrate the conformity
    of a high-risk AI system with the requirements set out in Section 2
  action: provide a requesting competent authority with all information and documentation necessary to
    demonstrate Section 2 conformity
  actors:
