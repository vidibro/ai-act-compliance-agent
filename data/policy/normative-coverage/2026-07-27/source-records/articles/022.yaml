- norm_id: AIA-NORM-A022-P3-PROVIDE-MANDATE
  source: A022-P003
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: It shall provide a copy of the mandate to the market surveillance authorities upon request, in
    one of the official languages of the institutions of the Union, as indicated by the competent authority.
  action: provide a copy of the mandate to market-surveillance authorities on request
    in an official EU-institution language indicated by the competent authority
  actors:
  - actor_ref: authorised_representative
    basis_segment_ids: [AIA-TEXT-A022-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
