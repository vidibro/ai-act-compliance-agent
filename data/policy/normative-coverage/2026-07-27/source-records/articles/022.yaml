- norm_id: AIA-NORM-A022-P4-TERMINATE-MANDATE
  source: A022-P009
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: The authorised representative shall terminate the mandate if it considers or has reason to consider
    the provider to be acting contrary to its obligations pursuant to this Regulation.
  action: terminate the mandate when the provider is considered to be acting contrary to its obligations
    under the Regulation
  actors:
  - actor_ref: authorised_representative
    basis_segment_ids: [AIA-TEXT-A022-P001]
  targets: []
  conditions: &id006
    operator: all_of
    operands:
    - text: if it considers or has reason to consider the provider to be acting contrary to its obligations pursuant to this Regulation
      basis_segment_ids: [AIA-TEXT-A022-P009]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A022-P4-NOTIFY-TERMINATION
  source: A022-P009
  temporal_regime_id: AIA-TEMP-A022-P4-IMMEDIATE-TERMINATION-NOTICE
  quote: In such a case, it shall immediately inform the relevant market surveillance authority, as well
    as, where applicable, the relevant notified body, about the termination of the mandate and the reasons
    therefor.
  action: immediately inform the relevant market-surveillance authority and applicable notified body of
    the mandate termination and its reasons
  actors:
  - actor_ref: authorised_representative
    basis_segment_ids: [AIA-TEXT-A022-P001]
  targets: []
