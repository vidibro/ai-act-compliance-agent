records:
- norm_id: AIA-NORM-A013-P1-TRANSPARENT-OPERATION
  source: A013-P001
  quote: "High-risk AI systems shall be designed and developed in such a way as to ensure that their operation\
    \ is sufficiently transparent to enable deployers to interpret a system\u2019s output and use it appropriately."
  action: design and develop the high-risk AI system so its operation is sufficiently transparent for
    deployers to interpret its output and use it appropriately
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: &id001
  - AIA-HR-A13
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P1-APPROPRIATE-TRANSPARENCY
  source: A013-P001
  quote: An appropriate type and degree of transparency shall be ensured with a view to achieving compliance
    with the relevant obligations of the provider and deployer set out in Section 3.
  action: ensure a type and degree of transparency appropriate for provider and deployer compliance with
    Section 3
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P2-PROVIDE-INSTRUCTIONS
  source: A013-P002
  quote: High-risk AI systems shall be accompanied by instructions for use in an appropriate digital format
    or otherwise that include concise, complete, correct and clear information that is relevant, accessible
    and comprehensible to deployers.
  action: accompany the high-risk AI system with instructions for use in an appropriate digital or other
    format containing concise, complete, correct, clear, relevant, accessible, and comprehensible information
  subject_ref: provider
  subject_category: supported_operator
  mandatory_content:
  - concise information
  - complete information
  - correct information
  - clear information
  - information relevant to deployers
  - information accessible to deployers
  - information comprehensible to deployers
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-A-CONTACT-DETAILS
  source: A013-P004
  quote: the identity and the contact details of the provider and, where applicable, of its authorised
    representative
  action: "include the provider\u2019s identity and contact details and, where applicable, those of its\
    \ authorised representative in the instructions"
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: &id002
  - A013-P003
  implementation_refs: &id003
  - AIA-HR-A13-3
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-PERFORMANCE-CHARACTERISTICS
  source: A013-P005
  quote: the characteristics, capabilities and limitations of performance of the high-risk AI system
  action: "include the system\u2019s characteristics, capabilities, and performance limitations in the\
    \ instructions"
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id002
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-I-INTENDED-PURPOSE
  source: A013-P006
  quote: its intended purpose
  action: "include the system\u2019s intended purpose in the instructions"
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: &id004
  - A013-P003
  - A013-P005
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-II-PERFORMANCE-AND-AFFECTING-CIRCUMSTANCES
  source: A013-P007
  quote: the level of accuracy, including its metrics, robustness and cybersecurity referred to in Article
    15 against which the high-risk AI system has been tested and validated and which can be expected,
    and any known and foreseeable circumstances that may have an impact on that expected level of accuracy,
    robustness and cybersecurity
  action: include tested, validated, and expected accuracy levels and metrics, robustness and cybersecurity,
    plus known and foreseeable circumstances that may affect that expected performance
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id004
  mandatory_content:
  - tested, validated, and expected accuracy levels and metrics, robustness, and cybersecurity
  - known and foreseeable circumstances that may affect that expected performance
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: Article 15 of this Regulation
    resolution: unresolved
    detail: Article 15 supplies the referenced accuracy, robustness, and cybersecurity requirements and
      has not yet been semantically reviewed.
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-III-RISK-CIRCUMSTANCES
  source: A013-P008
  quote: any known or foreseeable circumstance, related to the use of the high-risk AI system in accordance
    with its intended purpose or under conditions of reasonably foreseeable misuse, which may lead to
    risks to the health and safety or fundamental rights referred to in Article 9(2)
  action: include known or foreseeable intended-use or misuse circumstances that may create health, safety,
    or fundamental-rights risks
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id004
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-IV-EXPLAIN-OUTPUT
  source: A013-P009
  quote: where applicable, the technical capabilities and characteristics of the high-risk AI system to
    provide information that is relevant to explain its output
  action: include technical capabilities and characteristics relevant to explaining system outputs
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id004
  conditions:
  - the system has technical capabilities or characteristics relevant to explaining its output
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-V-GROUP-PERFORMANCE
  source: A013-P010
  quote: when appropriate, its performance regarding specific persons or groups of persons on which the
    system is intended to be used
  action: include performance concerning specific persons or groups on which the system is intended to
    be used
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id004
  conditions:
  - information about performance for intended persons or groups is appropriate
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-VI-INPUT-DATA
  source: A013-P011
  quote: when appropriate, specifications for the input data, or any other relevant information in terms
    of the training, validation and testing data sets used, taking into account the intended purpose of
    the high-risk AI system
  action: include input-data specifications or other relevant information about the training, validation,
    and testing datasets used
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id004
  conditions:
  - input-data specifications or dataset information is appropriate for the intended purpose
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-B-VII-INTERPRET-OUTPUT
  source: A013-P012
  quote: where applicable, information to enable deployers to interpret the output of the high-risk AI
    system and use it appropriately
  action: include information enabling deployers to interpret system outputs and use them appropriately
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id004
  conditions:
  - information is applicable to deployer interpretation and appropriate use of system outputs
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-C-PREDETERMINED-CHANGES
  source: A013-P013
  quote: the changes to the high-risk AI system and its performance which have been pre-determined by
    the provider at the moment of the initial conformity assessment, if any
  action: include system and performance changes predetermined at the initial conformity assessment
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id002
  conditions:
  - the provider predetermined changes to the system or its performance at the initial conformity assessment
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-D-HUMAN-OVERSIGHT
  source: A013-P014
  quote: the human oversight measures referred to in Article 14, including the technical measures put
    in place to facilitate the interpretation of the outputs of the high-risk AI systems by the deployers
  action: include the Article 14 human-oversight measures, including technical measures facilitating deployer
    interpretation of high-risk AI-system outputs, in the instructions
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id002
  mandatory_content:
  - Article 14 human-oversight measures
  - technical measures facilitating deployer interpretation of high-risk AI-system outputs
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: Article 14 of this Regulation
    resolution: unresolved
    detail: Article 14 supplies the referenced human-oversight requirements and has not yet been semantically
      reviewed.
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-E-RESOURCES-LIFETIME-AND-MAINTENANCE
  source: A013-P015
  quote: the computational and hardware resources needed, the expected lifetime of the high-risk AI system
    and any necessary maintenance and care measures, including their frequency, to ensure the proper functioning
    of that AI system, including as regards software updates
  action: include the needed computational and hardware resources, expected system lifetime, and necessary
    maintenance and care measures, their frequency, and software-update needs for proper functioning
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id002
  mandatory_content:
  - needed computational and hardware resources
  - expected lifetime of the high-risk AI system
  - necessary maintenance and care measures, including their frequency and software-update needs
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A013-P3-F-LOG-MECHANISMS
  source: A013-P016
  quote: where relevant, a description of the mechanisms included within the high-risk AI system that
    allows deployers to properly collect, store and interpret the logs in accordance with Article 12
  action: describe relevant system mechanisms that let deployers properly collect, store, and interpret
    Article 12 logs
  subject_ref: provider
  subject_category: supported_operator
  qualifier_spans: *id002
  conditions:
  - the system includes mechanisms relevant to deployer collection, storage, or interpretation of logs
  implementation_refs: *id003
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: AIA-NORM-A012-P1-AUTOMATIC-LOGGING
    resolution: internal_resolved
    detail: Article 12 supplies the automatic-logging requirement whose mechanisms are described here.
  verified_by: vidibro
