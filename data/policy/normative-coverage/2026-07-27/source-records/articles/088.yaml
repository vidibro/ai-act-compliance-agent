records:
- norm_id: AIA-NORM-A088-P1-EXCLUSIVE-ENFORCEMENT-POWERS
  source: A088-P001
  quote: The Commission shall have exclusive powers to supervise and enforce Chapter V, taking into account the procedural guarantees under Article 94.
  action: exercise exclusive Chapter V supervision and enforcement powers subject to Article 94 guarantees
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
