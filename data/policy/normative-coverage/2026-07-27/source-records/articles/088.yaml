  verification_mode: not_assessed
- norm_id: AIA-NORM-A088-P2-REQUEST-COMMISSION-ASSISTANCE
  source: A088-P002
  quote: market surveillance authorities may request the Commission to exercise the powers laid down in this Section, where that is necessary and proportionate to assist with the fulfilment of their tasks under this Regulation.
  action: request necessary proportionate Commission exercise of Section powers to assist surveillance tasks
