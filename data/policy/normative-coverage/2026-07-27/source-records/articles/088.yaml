- norm_id: AIA-NORM-A088-P1-ENTRUST-AI-OFFICE
  source: A088-P001
  quote: The Commission shall entrust the implementation of these tasks to the AI Office, without prejudice to the powers of organisation of the Commission and the division of competences between Member States and the Union based on the Treaties.
  action: entrust Chapter V supervision and enforcement implementation to the AI Office within enacted competence boundaries
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
