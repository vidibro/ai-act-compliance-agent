records:
- norm_id: AIA-NORM-A088-P1-EXCLUSIVE-ENFORCEMENT-POWERS
  source: A088-P001
  quote: The Commission shall have exclusive powers to supervise and enforce Chapter V, taking into account
    the procedural guarantees under Article 94.
  action: exercise exclusive Chapter V supervision and enforcement powers subject to Article 94 guarantees
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A088-P1-ENTRUST-AI-OFFICE
  source: A088-P001
  quote: The Commission shall entrust the implementation of these tasks to the AI Office, without prejudice
    to the powers of organisation of the Commission and the division of competences between Member States
    and the Union based on the Treaties.
  action: entrust Chapter V supervision and enforcement implementation to the AI Office within enacted
    competence boundaries
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  exceptions:
  - the Commission's powers of organisation are unaffected
  - the Treaty-based division of competences between Member States and the Union is unaffected
- norm_id: AIA-NORM-A088-P2-REQUEST-COMMISSION-ASSISTANCE
  source: A088-P002
  quote: Without prejudice to Article 75(3), market surveillance authorities may request the Commission
    to exercise the powers laid down in this Section, where that is necessary and proportionate to assist
    with the fulfilment of their tasks under this Regulation.
  action: request necessary proportionate Commission exercise of Section powers to assist surveillance
    tasks
  actors:
  - actor_ref: market_surveillance_authority
    category: public_authority
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - exercising the Section powers is necessary and proportionate to assist fulfilment of the authority's
    tasks under this Regulation
