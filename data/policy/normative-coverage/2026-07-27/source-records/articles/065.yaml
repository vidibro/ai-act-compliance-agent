- norm_id: AIA-NORM-A065-P2-INVITE-RELEVANT-PARTICIPANTS
  source: A065-P002
  quote: Other national and Union authorities, bodies or experts may be invited to the meetings by the Board on a case by case basis, where the issues discussed are of relevance for them.
  action: invite relevant national or Union authorities bodies or experts to Board meetings case by case
  subject_ref: board
  subject_category: union_institution_or_body
  kind: power
  conditions: [the issues discussed are relevant to the invited participant]
