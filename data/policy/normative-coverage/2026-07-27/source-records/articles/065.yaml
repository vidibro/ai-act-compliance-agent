- norm_id: AIA-NORM-A065-P3-DESIGNATE-REPRESENTATIVE
  source: A065-P003
  quote: Each representative shall be designated by their Member State for a period of three years, renewable once.
  action: designate the Board representative for a three-year term renewable once
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A065-P4-REPRESENTATIVE-CAPABILITIES
  source: A065-P004
  quote: 'Member States shall ensure that their representatives on the Board:'
  action: ensure Board representatives possess every enacted competence contact-point and coordination capability
  subject_ref: member_state
  subject_category: member_state
  mandatory_content: [competences and powers to contribute actively to Article 66 tasks, single Board contact point and where appropriate stakeholder contact point, power to facilitate national consistency and coordination including data collection]
  qualifier_spans: [A065-P005, A065-P006, A065-P007]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A065-P5-ADOPT-RULES-OF-PROCEDURE
  source: A065-P008
  quote: The designated representatives of the Member States shall adopt the Board’s rules of procedure by a two-thirds majority. The rules of procedure shall, in particular, lay down procedures for the selection process, the duration of the mandate of, and specifications of the tasks of, the Chair, detailed arrangements for voting, and the organisation of the Board’s activities and those of its sub-groups.
  action: adopt by two-thirds majority rules covering Chair selection mandate and tasks voting and Board and subgroup organisation
  subject_ref: board_member_state_representatives
  subject_category: union_institution_or_body
  mandatory_content: [Chair selection process, Chair mandate duration, Chair task specifications, detailed voting arrangements, organisation of Board and subgroup activities]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A065-P6-ESTABLISH-STANDING-SUBGROUPS
  source: A065-P009
  quote: The Board shall establish two standing sub-groups to provide a platform for cooperation and exchange among market surveillance authorities and notifying authorities about issues related to market surveillance and notified bodies respectively.
  action: establish standing market-surveillance and notifying-authority cooperation subgroups
  subject_ref: board
  subject_category: union_institution_or_body
  mandatory_content: [market-surveillance cooperation and exchange, notifying-authority cooperation and exchange on notified bodies]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A065-P6-ADCO-ROLE
  source: A065-P010
  quote: The standing sub-group for market surveillance should act as the administrative cooperation group (ADCO) for this Regulation within the meaning of Article 30 of Regulation (EU) 2019/1020.
  action: act as the Regulation's Article 30 administrative cooperation group
  subject_ref: market_surveillance_standing_subgroup
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
