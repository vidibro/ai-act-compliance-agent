  verification_mode: not_assessed
- norm_id: AIA-NORM-A065-P2-BOARD-COMPOSITION
  source: A065-P002
  quote: The Board shall be composed of one representative per Member State.
  action: compose the Board of one representative per Member State
  subject_ref: board
  subject_category: union_institution_or_body
