  verification_mode: not_assessed
- norm_id: AIA-NORM-A065-P6-OTHER-SUBGROUPS-AND-OBSERVERS
  source: A065-P011
  quote: The Board may establish other standing or temporary sub-groups as appropriate for the purpose of examining specific issues. Where appropriate, representatives of the advisory forum referred to in Article 67 may be invited to such sub-groups or to specific meetings of those subgroups as observers.
  action: establish other issue-specific subgroups and invite appropriate advisory-forum observers
  subject_ref: board
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
