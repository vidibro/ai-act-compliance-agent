records:
- norm_id: AIA-NORM-A065-P1-ESTABLISH-BOARD
  source: A065-P001
  quote: A European Artificial Intelligence Board (the ‘ Board ’) is hereby established.
  action: establish the European Artificial Intelligence Board
  subject_ref: union_legislature
  subject_category: union_institution_or_body
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
