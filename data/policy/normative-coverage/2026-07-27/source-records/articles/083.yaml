  source: A083-P001
  quote: Where the market surveillance authority of a Member State makes one of the following findings,
    it shall require the relevant provider to put an end to the non-compliance concerned, within a period
    it may prescribe
  action: require the provider to end identified formal non-compliance within a prescribed period
