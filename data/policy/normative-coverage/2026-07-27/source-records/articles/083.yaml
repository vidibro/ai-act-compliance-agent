- norm_id: AIA-NORM-A083-P2-RESTRICT-PERSISTENT-NONCOMPLIANCE
  source: A083-P009
  quote: Where the non-compliance referred to in paragraph 1 persists, the market surveillance authority
    of the Member State concerned shall take appropriate and proportionate measures to restrict or prohibit
    the high-risk AI system being made available on the market or to ensure that it is recalled or withdrawn
    from the market without delay.
  action: take proportionate restriction prohibition recall or withdrawal measures without delay when
    formal non-compliance persists
