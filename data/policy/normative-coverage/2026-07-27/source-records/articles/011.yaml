records:
- norm_id: AIA-NORM-A011-P1-DRAW
  source: A011-P1
  quote: shall be drawn up before that system is placed on the market or put into service
  action: draw up technical documentation before placing the system on the market or putting it into service
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-UPDATE
  source: A011-P1
  quote: shall be kept up-to date
  action: keep technical documentation up to date
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-DEMONSTRATE
  source: A011-P1
  quote: shall be drawn up in such a way as to demonstrate that the high-risk AI system complies
  action: draw up documentation that demonstrates compliance with the requirements in Chapter III, Section
    2
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-ASSESSMENT-INFORMATION
  source: A011-P1
  quote: to provide national competent authorities and notified bodies with the necessary information
    in a clear and comprehensive form to assess the compliance of the AI system with those requirements
  action: provide national competent authorities and notified bodies with the clear and comprehensive
    information necessary to assess compliance
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-ANNEX-IV
  source: A011-P1
  quote: It shall contain, at a minimum, the elements set out in Annex IV.
  action: include every applicable Annex IV element
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: AIA-NORM-ANNEX-IV-CONTENT
    resolution: internal_resolved
    detail: Annex IV supplies the mandatory content.
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-SIMPLIFY
  source: A011-P1
  quote: may provide the elements of the technical documentation specified in Annex IV in a simplified
    manner
  action: use the simplified-documentation option
  subject_ref: provider
  subject_category: supported_operator
  kind: permission
  conditions:
  - provider is an SME, start-up, or SMC
  verification_mode: reported_conditionally
- norm_id: AIA-NORM-A011-P1-FORM
  source: A011-P1
  quote: the Commission shall establish a simplified technical documentation form
  action: establish a simplified technical-documentation form
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A011-P1-USE-FORM
  source: A011-P1
  quote: it shall use the form referred to in this paragraph
  action: use the Commission form when taking the simplified-documentation option
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  conditions:
  - provider is an SME, start-up, or SMC and opts for simplified documentation
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-ACCEPT-FORM
  source: A011-P1
  quote: Notified bodies shall accept the form
  action: accept the simplified form for conformity assessment
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A011-P2-SINGLE-DOCUMENTATION-SET
  source: A011-P2
  quote: a single set of technical documentation shall be drawn up containing all the information set
    out in paragraph 1, as well as the information required under those legal acts
  action: draw up one technical-documentation set containing both the Article 11(1) information and the
    information required by the applicable Annex I Section A legislation
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - the high-risk AI system relates to a product covered by Union harmonisation legislation listed in
    Annex I, Section A
  implementation_refs:
  - AIA-HR-A11-2
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: AIA-NORM-A011-P1-ANNEX-IV
    resolution: internal_resolved
    detail: Article 11(1) supplies the AI Act information that must be included in the single documentation
      set.
  - dependency_ref: Annex I, Section A Union harmonisation legislation
    resolution: external_recorded
    detail: The applicable sectoral legal act supplies the additional information that must be included.
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P3-AMEND
  source: A011-P3
  quote: The Commission is empowered to adopt delegated acts
  action: adopt delegated acts amending Annex IV
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported