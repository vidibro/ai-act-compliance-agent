records:
- norm_id: AIA-NORM-A011-P1-DRAW
  source: A011-P1
  quote: The technical documentation of a high-risk AI system shall be drawn up before that system is
    placed on the market or put into service and shall be kept up-to date.
  action: draw up technical documentation before placing the system on the market or putting it into service
    and keep it up to date
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  mandatory_content:
  - draw up the documentation before market placement or putting into service
  - keep the documentation up to date
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-DEMONSTRATE
  source: A011-P1
  quote: That technical documentation shall be drawn up in such a way as to demonstrate that the high-risk
    AI system complies with the requirements set out in this Section and to provide national competent
    authorities and notified bodies with the necessary information in a clear and comprehensive form to
    assess the compliance of the AI system with those requirements.
  action: draw up documentation that demonstrates compliance with Chapter III Section 2 and gives national
    competent authorities and notified bodies the clear, comprehensive information needed to assess compliance
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  mandatory_content:
  - demonstrate compliance with Chapter III Section 2
  - provide clear and comprehensive information needed to assess compliance
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-ANNEX-IV
  source: A011-P1
  quote: It shall contain, at a minimum, the elements set out in Annex IV.
  action: include every applicable Annex IV element
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: AIA-NORM-ANNEX-IV-CONTENT
    resolution: internal_resolved
    detail: Annex IV supplies the mandatory content.
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-SIMPLIFY
  source: A011-P1
  quote: SMEs, including start-ups, and SMCs, may provide the elements of the technical documentation
    specified in Annex IV in a simplified manner.
  action: use the simplified-documentation option
  subject_ref: provider
  subject_category: supported_operator
  kind: permission
  conditions:
  - provider is an SME, start-up, or SMC
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-FORM
  source: A011-P1
  quote: To that end, the Commission shall establish a simplified technical documentation form targeted
    at the needs of SMEs, including start-ups, and SMCs.
  action: establish a simplified technical-documentation form targeted at the needs of SMEs, start-ups,
    and SMCs
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-USE-FORM
  source: A011-P1
  quote: Where an SME, including a start-up, or an SMC, opts to provide the information required in Annex
    IV in a simplified manner, it shall use the form referred to in this paragraph.
  action: use the Commission form when taking the simplified-documentation option
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-HR-A11
  verification_mode: judged_by_gap_analysis
  conditions:
  - provider is an SME, start-up, or SMC and opts for simplified documentation
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P1-ACCEPT-FORM
  source: A011-P1
  quote: Notified bodies shall accept the form for the purposes of the conformity assessment.
  action: accept the simplified form for conformity assessment
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P2-SINGLE-DOCUMENTATION-SET
  source: A011-P2
  quote: Where a high-risk AI system related to a product covered by the Union harmonisation legislation
    listed in Section A of Annex I is placed on the market or put into service, a single set of technical
    documentation shall be drawn up containing all the information set out in paragraph 1, as well as
    the information required under those legal acts
  action: draw up one technical-documentation set containing both the Article 11(1) information and the
    information required by the applicable Annex I Section A legislation
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - the high-risk AI system relates to a product covered by Union harmonisation legislation listed in
    Annex I, Section A
  implementation_refs:
  - AIA-HR-A11-2
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: AIA-NORM-A011-P1-ANNEX-IV
    resolution: internal_resolved
    detail: Article 11(1) supplies the AI Act information that must be included in the single documentation
      set.
  - dependency_ref: Annex I, Section A Union harmonisation legislation
    resolution: external_recorded
    detail: The applicable sectoral legal act supplies the additional information that must be included.
  verified_by: vidibro
- norm_id: AIA-NORM-A011-P3-AMEND
  source: A011-P3
  quote: The Commission is empowered to adopt delegated acts in accordance with Article 97 in order to
    amend Annex IV, where necessary, to ensure that, in light of technical progress, the technical documentation
    provides all the information necessary to assess the compliance of the system with the requirements
    set out in this Section.
  action: adopt Article 97 delegated acts amending Annex IV where necessary in light of technical progress
    to preserve all information needed to assess Section 2 compliance
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  conditions:
  - an Annex IV amendment is necessary in light of technical progress to ensure the technical documentation
    provides all information needed to assess Section 2 compliance
  dependencies:
  - dependency_ref: Article 97 of this Regulation
    resolution: unresolved
    detail: Article 97 supplies a multi-norm delegated-act procedure that is recorded elsewhere in this
      inventory.
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  verified_by: vidibro
