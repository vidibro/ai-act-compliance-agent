- norm_id: AIA-NORM-A082-P3-INFORM-ABOUT-RISK-FINDING
  source: A082-P003
  quote: The Member States shall immediately inform the Commission and the other Member States of a finding
    under paragraph 1. That information shall include all available details, in particular the data necessary
    for the identification of the AI system concerned, the origin and the supply chain of the AI system,
    the nature of the risk involved and the nature and duration of the national measures taken.
  action: immediately report the finding with system supply-chain risk and national-measure details
  actors:
  - actor_ref: member_state
    basis_segment_ids: [AIA-TEXT-A082-P003]
  targets: []
  mandatory_content:
