records:
- norm_id: AIA-NORM-A082-P1-REQUIRE-RISK-REMOVAL
  source: A082-P001
  quote: it shall require the relevant operator to take all appropriate measures to ensure that the AI system concerned, when placed on the market or put into service, no longer presents that risk without undue delay, within a period it may prescribe.
  action: require appropriate timely measures eliminating a compliant high-risk system's public-interest risk
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A082-P2-CORRECT-ALL-UNION-SYSTEMS
  source: A082-P002
  quote: The provider or other relevant operator shall ensure that corrective action is taken in respect of all the AI systems concerned that it has made available on the Union market within the timeline prescribed by the market surveillance authority
  action: ensure corrective action across all concerned systems made available on the Union market within the authority's timeline
  subject_ref: provider_or_other_relevant_operator
  subject_category: supported_operator
  implementation_refs: [AIA-ALL-A82]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A082-P3-INFORM-ABOUT-RISK-FINDING
  source: A082-P003
  quote: The Member States shall immediately inform the Commission and the other Member States of a finding under paragraph 1.
  action: immediately report the finding with system supply-chain risk and national-measure details
  subject_ref: member_state
  subject_category: member_state
  mandatory_content: [system identification data, system origin and supply chain, nature of the risk, nature and duration of national measures]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A082-P4-CONSULT-AND-EVALUATE
  source: A082-P004
  quote: The Commission shall without undue delay enter into consultation with the Member States concerned and the relevant operators, and shall evaluate the national measures taken.
  action: promptly consult concerned Member States and operators and evaluate national measures
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A082-P4-DECIDE-AND-PROPOSE
  source: A082-P004
  quote: the Commission shall decide whether the measure is justified and, where necessary, propose other appropriate measures.
  action: decide whether the measure is justified and propose other appropriate measures where necessary
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A082-P5-COMMUNICATE-DECISION
  source: A082-P005
  quote: The Commission shall immediately communicate its decision to the Member States concerned and to the relevant operators. It shall also inform the other Member States.
  action: immediately communicate the decision to concerned Member States and operators and inform other Member States
  subject_ref: commission
  subject_category: union_institution_or_body
