records:
- norm_id: AIA-NORM-A082-P1-REQUIRE-RISK-REMOVAL
  source: A082-P001
  quote: Where, having performed an evaluation under Article 79, after consulting the relevant national
    public authority referred to in Article 77(1), the market surveillance authority of a Member State
    finds that although a high-risk AI system complies with this Regulation, it nevertheless presents
    a risk to the health or safety of persons, to fundamental rights, or to other aspects of public interest
    protection, it shall require the relevant operator to take all appropriate measures to ensure that
    the AI system concerned, when placed on the market or put into service, no longer presents that risk
    without undue delay, within a period it may prescribe.
  action: require appropriate timely measures eliminating a compliant high-risk system's public-interest
    risk
  actors:
  - actor_ref: market_surveillance_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - operator: all_of
    operands:
    - the market-surveillance authority has performed an Article 79 evaluation
    - the market-surveillance authority has consulted the relevant Article 77(1) national public authority
    - the authority finds that a compliant high-risk AI system nevertheless presents a risk to health
      or safety, fundamental rights, or another aspect of public-interest protection
- norm_id: AIA-NORM-A082-P2-CORRECT-ALL-UNION-SYSTEMS
  source: A082-P002
  quote: The provider or other relevant operator shall ensure that corrective action is taken in respect
    of all the AI systems concerned that it has made available on the Union market within the timeline
    prescribed by the market surveillance authority of the Member State referred to in paragraph 1.
  action: ensure corrective action across all concerned systems made available on the Union market within
    the authority's timeline
  actors:
  - actor_ref: provider
  - actor_ref: operator
  targets: []
  implementation_refs:
  - AIA-ALL-A82
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A082-P3-INFORM-ABOUT-RISK-FINDING
  source: A082-P003
  quote: The Member States shall immediately inform the Commission and the other Member States of a finding
    under paragraph 1. That information shall include all available details, in particular the data necessary
    for the identification of the AI system concerned, the origin and the supply chain of the AI system,
    the nature of the risk involved and the nature and duration of the national measures taken.
  action: immediately report the finding with system supply-chain risk and national-measure details
  actors:
  - actor_ref: member_state
  targets: []
  mandatory_content:
  - system identification data
  - system origin and supply chain
  - nature of the risk
  - nature and duration of national measures
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A082-P4-CONSULT-AND-EVALUATE
  source: A082-P004
  quote: The Commission shall without undue delay enter into consultation with the Member States concerned
    and the relevant operators, and shall evaluate the national measures taken.
  action: promptly consult concerned Member States and operators and evaluate national measures
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A082-P4-DECIDE-AND-PROPOSE
  source: A082-P004
  quote: On the basis of the results of that evaluation, the Commission shall decide whether the measure
    is justified and, where necessary, propose other appropriate measures.
  action: decide whether the measure is justified and propose other appropriate measures where necessary
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the decision is based on the results of the evaluation
- norm_id: AIA-NORM-A082-P5-COMMUNICATE-DECISION
  source: A082-P005
  quote: The Commission shall immediately communicate its decision to the Member States concerned and
    to the relevant operators.
  action: immediately communicate the decision to the Member States concerned and to the relevant operators
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A082-P5-INFORM-OTHER-MEMBER-STATES
  source: A082-P005
  quote: It shall also inform the other Member States.
  action: inform the other Member States of the decision
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
