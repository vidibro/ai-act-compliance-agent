- norm_id: AIA-NORM-A082-P2-CORRECT-ALL-UNION-SYSTEMS
  source: A082-P002
  quote: The provider or other relevant operator shall ensure that corrective action is taken in respect
    of all the AI systems concerned that it has made available on the Union market within the timeline
    prescribed by the market surveillance authority of the Member State referred to in paragraph 1.
  action: ensure corrective action across all concerned systems made available on the Union market within
    the authority's timeline
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A082-P002]
  - actor_ref: operator
