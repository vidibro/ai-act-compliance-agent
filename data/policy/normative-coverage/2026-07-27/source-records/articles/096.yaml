records:
- norm_id: AIA-NORM-A096-P1-DEVELOP-IMPLEMENTATION-GUIDELINES
  source: A096-P001
  quote: The Commission shall develop guidelines on the practical implementation of this Regulation
  action: develop practical implementation guidelines covering the specified subjects
  subject_ref: commission
  subject_category: union_institution_or_body
  mandatory_content: [Articles 8 to 15 and 25 and 26 requirements and obligations, Article 5 prohibited practices, substantial modification, Article 50 transparency obligations, relationship with Annex I harmonisation legislation and other Union law, Article 3 point 1 AI-system definition, complementary and proportionate implementation of Articles 8(2) 9(10) and 17(3)]
  qualifier_spans: [A096-P002, A096-P003, A096-P004, A096-P005, A096-P006, A096-P007, A096-P008]
  effective_date_spans: [A096-P008]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
