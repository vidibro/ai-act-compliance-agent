- norm_id: AIA-NORM-A096-P2-UPDATE-GUIDELINES
  source: A096-P011
  quote: At the request of the Member States or the AI Office, or on its own initiative, the Commission
    shall update guidelines previously adopted when deemed necessary.
  action: update adopted guidelines when necessary on request or on the Commission's initiative
  actors:
  - actor_ref: commission
  targets: []
