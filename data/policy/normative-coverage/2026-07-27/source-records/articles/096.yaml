records:
- norm_id: AIA-NORM-A096-P1-DEVELOP-IMPLEMENTATION-GUIDELINES
  source: A096-P001
  quote: 'The Commission shall develop guidelines on the practical implementation of this Regulation, and in particular on:'
  action: develop guidelines on the practical implementation of this Regulation, in particular on the
    enacted subjects
  subject_ref: commission
  subject_category: union_institution_or_body
  mandatory_content:
  - the application of the requirements and obligations referred to in Articles 8 to 15 and in
    Articles 25 and 26
  - the prohibited practices referred to in Article 5
  - the practical implementation of the provisions related to substantial modification
  - the practical implementation of transparency obligations laid down in Article 50
  - detailed information on the relationship of this Regulation with the Union harmonisation
    legislation listed in Annex I, as well as with other relevant Union law, including as regards
    consistency in their enforcement
  - the application of the definition of an AI system as set out in Article 3, point (1)
  - the practical implementation of Article 8(2), Article 9(10) and Article 17(3) in accordance with
    the principle of complementarity and proportionality
  qualifier_spans: [A096-P002, A096-P003, A096-P004, A096-P005, A096-P006, A096-P007, A096-P008]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
