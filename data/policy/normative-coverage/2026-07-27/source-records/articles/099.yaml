records:
- norm_id: AIA-NORM-A099-P1-ESTABLISH-PENALTIES
  source: A099-P001
  quote: In accordance with the terms and conditions laid down in this Regulation, Member States shall
    lay down the rules on penalties and other enforcement measures, which may also include administrative
    fines, warnings and non-monetary measures, applicable to any infringement of this Regulation by operators,
    and shall take all measures necessary to ensure that they are properly and effectively implemented,
    thereby taking into account the guidelines issued by the Commission pursuant to Article 96. The penalties
    provided for shall be effective, proportionate and dissuasive.
  action: establish and effectively implement effective proportionate and dissuasive infringement penalties
    and enforcement measures
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A099-P1-ACCOUNT-FOR-SMALL-BUSINESSES
  source: A099-P001
  quote: The Member States shall take into account the interests of SMEs, including start-ups, and SMCs,
    and their economic viability when imposing penalties.
  action: account for SME start-up and SMC interests and economic viability when imposing penalties
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A099-P2-NOTIFY-PENALTY-RULES
  source: A099-P002
  quote: Member States shall, without delay and at the latest by the date of entry into application, notify
    the Commission of the rules on penalties and of other enforcement measures referred to in paragraph
    1, and shall notify it, without delay, of any subsequent amendment to them.
  action: notify the Commission of the paragraph 1 rules on penalties and other enforcement measures,
    without delay and at the latest by the date of entry into application, and notify it without delay
    of subsequent amendments
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - notify the initial rules and measures without delay and by the date of entry into application at the
    latest
  - notify subsequent amendments without delay
- norm_id: AIA-NORM-A099-P3-ARTICLE5-FINE
  source: A099-P003
  quote: Non-compliance with the prohibition of the AI practices referred to in Article 5 shall be subject
    to administrative fines of up to EUR 35000000 or, if the offender is an undertaking, up to 7 % of
    its total worldwide annual turnover for the preceding financial year, whichever is higher.
  action: expose Article 5 prohibited-practice non-compliance to a fine up to EUR 35 000 000 or, for an
    undertaking, 7 % of preceding-year worldwide annual turnover, whichever is higher
  actors:
  - actor_ref: infringing_operator
    category: supported_operator
  targets: []
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: This is an enforcement consequence rather than an independent compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
  conditions:
  - the Article 5 prohibition of AI practices is not complied with
- norm_id: AIA-NORM-A099-P4-OPERATOR-FINE
  source: A099-P004
  quote: shall be subject to administrative fines of up to EUR 15000000 or, if the offender is an undertaking,
    up to 3 % of its total worldwide annual turnover for the preceding financial year, whichever is higher
  action: expose non-compliance with the enacted operator and notified-body provisions, other than those
    laid down in Article 5, to administrative fines of up to EUR 15 000 000 or, for an undertaking, up
    to 3 % of its total worldwide annual turnover for the preceding financial year, whichever is higher
  actors: []
  targets:
  - target_ref: infringing_operator_or_notified_body
  kind: legal_consequence
  exceptions:
  - the provisions laid down in Article 5, which carry the paragraph 3 fine instead
  mandatory_content: []
  qualifier_spans:
  - A099-P005
  - A099-P006
  - A099-P007
  - A099-P008
  - A099-P009
  - A099-P010
  - A099-P011
  - A099-P012
  product_scope: no_product_action
  product_scope_reason: This is an enforcement consequence rather than an independent compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
  conditions:
  - operator: any_of
    operands:
    - Article 16 provider obligations are not complied with
    - Article 22 authorised-representative obligations are not complied with
    - Article 23 importer obligations are not complied with
    - Article 24 distributor obligations are not complied with
    - Article 25(2) or (4) provider or operator obligations are not complied with
    - Article 26 deployer obligations are not complied with
    - Article 31, Article 33(1), (3) or (4), or Article 34 notified-body requirements or obligations are
      not complied with
    - Article 50 provider or deployer transparency obligations are not complied with
- norm_id: AIA-NORM-A099-P5-INFORMATION-FINE
  source: A099-P013
  quote: The supply of incorrect, incomplete or misleading information to notified bodies or national
    competent authorities in reply to a request shall be subject to administrative fines of up to EUR
    7500000 or, if the offender is an undertaking, up to 1 % of its total worldwide annual turnover for
    the preceding financial year, whichever is higher.
  action: expose an incorrect incomplete or misleading requested reply to a fine up to EUR 7 500 000 or,
    for an undertaking, 1 % of preceding-year worldwide annual turnover, whichever is higher
  actors: []
  targets:
  - target_ref: information_supplier
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: This is an enforcement consequence rather than an independent compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
  conditions:
  - incorrect, incomplete, or misleading information is supplied to a notified body or national competent
    authority in reply to a request
- norm_id: AIA-NORM-A099-P6-SME-FINE-CAP
  source: A099-P014
  quote: In the case of SMEs, including start-ups, each fine referred to in this Article shall be up to
    the percentages or amount referred to in paragraphs 3, 4 and 5, whichever thereof is lower.
  action: cap SME and start-up fines at the lower applicable percentage or amount
  actors:
  - actor_ref: enforcing_authority
    category: public_authority
  targets: []
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the offender is an SME, including a start-up
- norm_id: AIA-NORM-A099-P6A-SMC-FINE-CAP
  source: A099-P015
  quote: In the case of SMCs, each fine referred to in paragraphs 4 and 5 shall be up to the percentages
    or amount referred therein, whichever is lower.
  action: cap SMC fines under paragraphs 4 and 5 at the lower applicable percentage or amount
  actors:
  - actor_ref: enforcing_authority
    category: public_authority
  targets: []
