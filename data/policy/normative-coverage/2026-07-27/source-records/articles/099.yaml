- norm_id: AIA-NORM-A099-P2-NOTIFY-PENALTY-RULES
  source: A099-P002
  quote: Member States shall, without delay and at the latest by the date of entry into application, notify the Commission of the rules on penalties and of other enforcement measures referred to in paragraph 1
  action: notify the Commission of the paragraph 1 rules on penalties and other enforcement measures,
    without delay and at the latest by the date of entry into application
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A099-P2-NOTIFY-PENALTY-AMENDMENTS
  source: A099-P002
  quote: and shall notify it, without delay, of any subsequent amendment to them.
  action: notify the Commission without delay of any subsequent amendment to those rules and measures
  subject_ref: member_state
  subject_category: member_state
  conditions:
  - the rules on penalties or other enforcement measures are subsequently amended
  product_scope: outside_supported_actor
