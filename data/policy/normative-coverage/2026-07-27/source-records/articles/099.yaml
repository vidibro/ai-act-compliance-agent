records:
- norm_id: AIA-NORM-A099-P1-ESTABLISH-PENALTIES
  source: A099-P001
  quote: Member States shall lay down the rules on penalties and other enforcement measures
  action: establish and effectively implement effective proportionate and dissuasive infringement penalties and enforcement measures
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
