- norm_id: AIA-NORM-A099-P3-ARTICLE5-FINE
  source: A099-P003
  quote: shall be subject to administrative fines of up to EUR 35000000
  action: expose Article 5 prohibited-practice non-compliance to the specified maximum fine
  subject_ref: infringing_operator
  subject_category: supported_operator
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: This is an enforcement consequence rather than an independent compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A099-P4-OPERATOR-FINE
  source: A099-P004
  quote: shall be subject to administrative fines of up to EUR 15000000 or, if the offender is an undertaking, up to 3 % of its total worldwide annual turnover for the preceding financial year, whichever is higher
  action: expose non-compliance with the enacted operator and notified-body provisions, other than
    those laid down in Article 5, to administrative fines of up to EUR 15 000 000 or, for an
    undertaking, up to 3 % of its total worldwide annual turnover for the preceding financial year,
    whichever is higher
  subject_ref: infringing_operator_or_notified_body
  subject_category: other
  kind: legal_consequence
  exceptions:
  - the provisions laid down in Article 5, which carry the paragraph 3 fine instead
  mandatory_content:
  - obligations of providers pursuant to Article 16
  - obligations of authorised representatives pursuant to Article 22
  - obligations of importers pursuant to Article 23
  - obligations of distributors pursuant to Article 24
  - obligations of providers and operators pursuant to Article 25(2) and (4)
  - obligations of deployers pursuant to Article 26
  - requirements and obligations of notified bodies pursuant to Article 31, Article 33(1), (3) and
    (4) or Article 34
  - transparency obligations for providers and deployers pursuant to Article 50
  qualifier_spans: [A099-P005, A099-P006, A099-P007, A099-P008, A099-P009, A099-P010, A099-P011, A099-P012]
  product_scope: no_product_action
  product_scope_reason: This is an enforcement consequence rather than an independent compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A099-P5-INFORMATION-FINE
  source: A099-P013
  quote: shall be subject to administrative fines of up to EUR 7500000
  action: expose incorrect incomplete or misleading replies to the specified maximum fine
  subject_ref: information_supplier
  subject_category: other
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: This is an enforcement consequence rather than an independent compliance action.
  implementation_mode: none_required
