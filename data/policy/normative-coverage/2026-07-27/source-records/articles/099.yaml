  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A099-P8-PUBLIC-BODY-FINE-RULES
  source: A099-P027
  quote: Each Member State shall lay down rules on to what extent administrative fines may be imposed
    on public authorities and bodies
  action: establish the extent to which administrative fines apply to domestic public authorities and
    bodies
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  product_scope: outside_supported_actor
