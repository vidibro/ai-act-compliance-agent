- norm_id: AIA-NORM-A099-P11-ANNUAL-FINE-REPORT
  source: A099-P030
  quote: Member States shall, on an annual basis, report to the Commission about the administrative fines
    they have issued during that year, in accordance with this Article, and about any related litigation
    or judicial proceedings.
  action: report annually to the Commission on Article 99 fines and related proceedings
