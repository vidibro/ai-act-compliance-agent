- norm_id: AIA-NORM-A099-P9-EQUIVALENT-FINE-EFFECT
  source: A099-P028
  quote: Depending on the legal system of the Member States, the rules on administrative fines may be
    applied in such a manner that the fines are imposed by competent national courts or by other bodies,
    as applicable in those Member States. The application of such rules in those Member States shall have
    an equivalent effect.
  action: ensure court-imposed or other-body-imposed fine rules have equivalent effect
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - under the Member State's legal system, fines are imposed by competent national courts or other bodies
- norm_id: AIA-NORM-A099-P10-PROCEDURAL-SAFEGUARDS
  source: A099-P029
  quote: The exercise of powers under this Article shall be subject to appropriate procedural safeguards
    in accordance with Union and national law, including effective judicial remedies and due process.
  action: exercise Article 99 powers subject to effective remedies due process and other appropriate safeguards
  actors:
