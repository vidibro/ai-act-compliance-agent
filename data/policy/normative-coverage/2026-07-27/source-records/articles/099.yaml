  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the offender is an SMC
- norm_id: AIA-NORM-A099-P7-CONSIDER-FINE-CIRCUMSTANCES
  source: A099-P016
  quote: all relevant circumstances of the specific situation shall be taken into account
  action: consider all relevant circumstances and the specified factors when deciding whether and how
    much to fine
  actors:
  - actor_ref: enforcing_authority
    category: public_authority
  targets: []
  mandatory_content:
  - infringement nature gravity duration consequences affected persons and damage
  - same-infringement fines by market-surveillance authorities
  - related-law fines arising from the same activity or omission
  - operator size turnover and market share
  - aggravating and mitigating factors including financial benefit or avoided loss
  - cooperation with competent authorities
  - operator responsibility and technical organisational measures
  - how the infringement became known including self-notification
  - intentional or negligent character
  - harm mitigation
  qualifier_spans:
  - A099-P017
  - A099-P018
  - A099-P019
  - A099-P020
