- norm_id: AIA-NORM-A099-P6A-SMC-FINE-CAP
  source: A099-P015
  quote: each fine referred to in paragraphs 4 and 5 shall be up to the percentages or amount referred therein, whichever is lower
  action: cap SMC fines under paragraphs 4 and 5 at the lower applicable percentage or amount
  subject_ref: enforcing_authority
  subject_category: public_authority
  kind: legal_consequence
