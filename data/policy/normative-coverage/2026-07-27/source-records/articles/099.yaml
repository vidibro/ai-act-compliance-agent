- norm_id: AIA-NORM-A099-P7-CONSIDER-FINE-CIRCUMSTANCES
  source: A099-P016
  quote: all relevant circumstances of the specific situation shall be taken into account
  action: consider all relevant circumstances and the specified factors when deciding whether and how much to fine
  subject_ref: enforcing_authority
  subject_category: public_authority
  mandatory_content: [infringement nature gravity duration consequences affected persons and damage, same-infringement fines by market-surveillance authorities, related-law fines arising from the same activity or omission, operator size turnover and market share, aggravating and mitigating factors including financial benefit or avoided loss, cooperation with competent authorities, operator responsibility and technical organisational measures, how the infringement became known including self-notification, intentional or negligent character, harm mitigation]
