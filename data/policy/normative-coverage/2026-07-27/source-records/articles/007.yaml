records:
- norm_id: AIA-NORM-A007-P1-AMEND-ANNEX-III
  source: A007-P001
  quote: The Commission is empowered to adopt delegated acts in accordance with Article 97 to amend Annex
    III by adding or modifying use-cases of high-risk AI systems where both of the following conditions
    are fulfilled
  action: adopt Article 97 delegated acts adding or modifying Annex III high-risk use cases when both
    statutory conditions are fulfilled
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A007-P001]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  qualifier_spans:
  - A007-P002
  - A007-P003
  conditions:
  - operator: all_of
    operands:
    - text: the AI systems are intended to be used in any of the areas listed in Annex III
      basis_segment_ids: [AIA-TEXT-A007-P002]
    - text: the AI systems pose a risk of harm to health and safety, or an adverse impact on fundamental rights, and that risk is equivalent to, or greater than
      basis_segment_ids: [AIA-TEXT-A007-P003]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A007-P2-CONSIDER-RISK-CRITERIA
  source: A007-P004
  quote: the Commission shall take into account the following criteria
  action: take every Article 7(2) criterion into account when assessing whether an Annex III amendment
    meets Article 7(1)(b)
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A007-P004]
  targets: []
  kind: obligation
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  qualifier_spans:
  - A007-P005
  - A007-P006
  - A007-P007
  - A007-P008
  - A007-P009
  - A007-P010
  - A007-P011
  - A007-P012
  - A007-P013
  - A007-P014
  - A007-P015
  - A007-P016
  - A007-P017
  conditions:
  - operator: all_of
    operands:
    - text: the intended purpose of the AI system
      basis_segment_ids: [AIA-TEXT-A007-P005]
    - text: the extent to which an AI system has been used or is likely to be used
      basis_segment_ids: [AIA-TEXT-A007-P006]
    - text: the nature and amount of the data processed and used by the AI system
      basis_segment_ids: [AIA-TEXT-A007-P007]
    - text: the extent to which the AI system acts autonomously and the possibility for a human to override a decision or recommendations
      basis_segment_ids: [AIA-TEXT-A007-P008]
    - text: the extent to which the use of an AI system has already caused harm to health and safety, has had an adverse impact on fundamental rights or has given rise to significant concerns
      basis_segment_ids: [AIA-TEXT-A007-P009]
    - text: the potential extent of such harm or such adverse impact
      basis_segment_ids: [AIA-TEXT-A007-P010]
    - text: the extent to which persons who are potentially harmed or suffer an adverse impact are dependent on the outcome produced with an AI system
      basis_segment_ids: [AIA-TEXT-A007-P011]
    - text: the extent to which there is an imbalance of power
      basis_segment_ids: [AIA-TEXT-A007-P012]
    - text: the extent to which the outcome produced involving an AI system is easily corrigible or reversible
      basis_segment_ids: [AIA-TEXT-A007-P013]
    - text: the magnitude and likelihood of benefit of the deployment of the AI system
      basis_segment_ids: [AIA-TEXT-A007-P014]
    - operator: all_of
      operands:
      - text: effective measures of redress in relation to the risks posed by an AI system
        basis_segment_ids: [AIA-TEXT-A007-P016]
      - text: effective measures to prevent or substantially minimise those risks
        basis_segment_ids: [AIA-TEXT-A007-P017]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A007-P2-ADVERSE-OUTCOME-NOT-REVERSIBLE
  source: A007-P013
  quote: outcomes having an adverse impact on health, safety or fundamental rights, shall not be considered
    to be easily corrigible or reversible
  action: treat outcomes adversely affecting health, safety, or fundamental rights as not easily corrigible
    or reversible in the Article 7 assessment
  actors: none
  targets:
  - target_ref: outcomes having an adverse impact on health, safety or fundamental rights
    target_kind: legal_status
    basis_segment_ids: [AIA-TEXT-A007-P013]
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  product_scope: dependency_only
  product_scope_reason: This assessment rule constrains the Commission's Annex III amendment analysis
    without creating an independent product-facing action.
  implementation_mode: none_required
  implementation_reason: The legal consequence is represented as a dependency rather than a standalone
    product rule.
  verification_mode: not_reported
- norm_id: AIA-NORM-A007-P3-REMOVE-ANNEX-III-USE-CASE
  source: A007-P018
  quote: The Commission is empowered to adopt delegated acts in accordance with Article 97 to amend the
    list in Annex III by removing high-risk AI systems where both of the following conditions are fulfilled
  action: adopt Article 97 delegated acts removing Annex III high-risk use cases when both statutory conditions
    are fulfilled
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A007-P018]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  qualifier_spans:
  - A007-P019
  - A007-P020
  conditions:
  - operator: all_of
    operands:
    - text: the high-risk AI system concerned no longer poses any significant risks to fundamental rights, health or safety
      basis_segment_ids: [AIA-TEXT-A007-P019]
    - text: the deletion does not decrease the overall level of protection of health, safety and fundamental rights under Union law
      basis_segment_ids: [AIA-TEXT-A007-P020]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
