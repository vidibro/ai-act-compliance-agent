records:
- norm_id: AIA-NORM-A009-P1-ESTABLISH
  source: A009-P001
  quote: A risk management system shall be established, implemented, documented and maintained in relation
    to high-risk AI systems.
  action: establish a risk-management system for each high-risk AI system
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
