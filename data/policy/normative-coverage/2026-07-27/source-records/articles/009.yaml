- norm_id: AIA-NORM-A009-P2-LIFECYCLE-PROCESS
  source: A009-P002
  quote: The risk management system shall be understood as a continuous iterative process planned and
    run throughout the entire lifecycle of a high-risk AI system
  action: plan and operate risk management as a continuous iterative process throughout the entire high-risk
    AI-system lifecycle
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P2-REVIEW
  source: A009-P002
  quote: requiring regular systematic review and updating.
  action: conduct regular systematic reviews of the risk-management system
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
