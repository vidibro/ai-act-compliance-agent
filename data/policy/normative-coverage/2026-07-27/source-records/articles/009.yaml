- norm_id: AIA-NORM-A009-P2-A-IDENTIFY-ANALYSE
  source: A009-P003
  quote: the identification and analysis of the known and the reasonably foreseeable risks that the high-risk
    AI system can pose to health, safety or fundamental rights when the high-risk AI system is used in
    accordance with its intended purpose
  action: identify and analyse known and reasonably foreseeable intended-use risks to health, safety,
    and fundamental rights
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P2-B-ESTIMATE-EVALUATE
  source: A009-P004
  quote: the estimation and evaluation of the risks that may emerge when the high-risk AI system is used
    in accordance with its intended purpose, and under conditions of reasonably foreseeable misuse
  action: estimate and evaluate risks emerging from intended use and reasonably foreseeable misuse
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P2-C-POST-MARKET-RISKS
  source: A009-P005
  quote: the evaluation of other risks possibly arising, based on the analysis of data gathered from the
    post-market monitoring system referred to in Article 72
  action: evaluate other risks using data from the Article 72 post-market monitoring system
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: Article 72 of this Regulation
    resolution: unresolved
    detail: Article 72 supplies the post-market monitoring requirements and has not yet been semantically
      reviewed.
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P2-D-ADOPT-MEASURES
  source: A009-P006
  quote: the adoption of appropriate and targeted risk management measures designed to address the risks
    identified pursuant to point (a).
  action: adopt appropriate and targeted measures addressing the risks identified under Article 9(2)(a)
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P3-MITIGABLE-RISK-SCOPE
  source: A009-P007
  quote: The risks referred to in this Article shall concern only those which may be reasonably mitigated
    or eliminated through the development or design of the high-risk AI system, or the provision of adequate
    technical information.
  action: limit Article 9 risk treatment to risks reasonably mitigable or eliminable through development,
    design, or adequate technical information
  subject_ref: article_9_risk
  subject_category: other
  kind: applicability
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P4-CONSIDER-INTERACTIONS
  source: A009-P008
  quote: shall give due consideration to the effects and possible interaction resulting from the combined
    application of the requirements set out in this Section
  action: consider the effects and possible interactions of the combined Section 2 requirements when selecting
    risk-management measures
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  conditions:
  - minimise risks effectively while appropriately balancing implementation of the combined requirements
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P5-HAZARD-RESIDUAL-RISK
  source: A009-P009
  quote: the relevant residual risk associated with each hazard, as well as the overall residual risk
    of the high-risk AI systems is judged to be acceptable.
  action: judge the residual risk associated with each individual hazard to be acceptable
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P5-OVERALL-RESIDUAL-RISK
  source: A009-P009
  quote: the relevant residual risk associated with each hazard, as well as the overall residual risk
    of the high-risk AI systems is judged to be acceptable.
  action: judge the high-risk AI system's overall residual risk to be acceptable
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P5-A-DESIGN-RISK-REDUCTION
  source: A009-P011
  quote: elimination or reduction of risks identified and evaluated pursuant to paragraph 2 in as far
    as technically feasible through adequate design and development of the high-risk AI system
  action: eliminate or reduce identified and evaluated risks through design and development as far as
    technically feasible
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P010
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P5-B-MITIGATION-CONTROLS
  source: A009-P012
  quote: where appropriate, implementation of adequate mitigation and control measures addressing risks
    that cannot be eliminated
  action: implement adequate mitigation and control measures for risks that cannot be eliminated where
    appropriate
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P010
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P5-C-PROVIDE-INFORMATION
  source: A009-P013
  quote: provision of information required pursuant to Article 13 and, where appropriate, training to
    deployers.
  action: provide the information required by Article 13 as part of risk management
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P010
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  dependencies:
  - dependency_ref: Article 13 of this Regulation
    resolution: unresolved
    detail: Article 13 supplies the required transparency information and has not yet been semantically
      reviewed.
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P5-C-TRAIN-DEPLOYERS
  source: A009-P013
  quote: provision of information required pursuant to Article 13 and, where appropriate, training to
    deployers.
  action: provide deployer training where appropriate as part of risk management
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A009-P010
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P5-CONSIDER-DEPLOYER-CONTEXT
  source: A009-P014
  quote: due consideration shall be given to the technical knowledge, experience, education, the training
    to be expected by the deployer, and the presumable context in which the system is intended to be used.
  action: consider expected deployer knowledge, experience, education, training, and the presumable use
    context when reducing use-related risks
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P6-TEST-FOR-MEASURES
  source: A009-P015
  quote: High-risk AI systems shall be tested for the purpose of identifying the most appropriate and
    targeted risk management measures.
  action: test high-risk AI systems to identify the most appropriate targeted risk-management measures
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P6-TEST-PERFORMANCE
  source: A009-P015
  quote: Testing shall ensure that high-risk AI systems perform consistently for their intended purpose
    and that they are in compliance with the requirements set out in this Section.
  action: use testing to ensure consistent performance for the intended purpose
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P6-TEST-COMPLIANCE
  source: A009-P015
  quote: Testing shall ensure that high-risk AI systems perform consistently for their intended purpose
    and that they are in compliance with the requirements set out in this Section.
  action: use testing to ensure compliance with the Section 2 requirements
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P7-REAL-WORLD-TESTING
  source: A009-P016
  quote: Testing procedures may include testing in real-world conditions in accordance with Article 60.
  action: include testing in real-world conditions in the testing procedures
  subject_ref: provider
  subject_category: supported_operator
  kind: permission
  conditions:
  - real-world testing complies with Article 60
  implementation_refs: *id001
  verification_mode: reported_conditionally
  dependencies:
  - dependency_ref: Article 60 of this Regulation
    resolution: unresolved
    detail: Article 60 supplies the requirements for testing in real-world conditions but has only been
      partially semantically reviewed.
- norm_id: AIA-NORM-A009-P8-DEVELOPMENT-TESTING
  source: A009-P017
  quote: The testing of high-risk AI systems shall be performed, as appropriate, at any time throughout
    the development process, and, in any event, prior to their being placed on the market or put into
    service.
  action: test high-risk AI systems throughout development whenever appropriate
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P8-PRE-MARKET-TESTING
  source: A009-P017
  quote: The testing of high-risk AI systems shall be performed, as appropriate, at any time throughout
    the development process, and, in any event, prior to their being placed on the market or put into
    service.
  action: test high-risk AI systems before placing them on the market or putting them into service
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P8-METRICS-THRESHOLDS
  source: A009-P017
  quote: Testing shall be carried out against prior defined metrics and probabilistic thresholds that
    are appropriate to the intended purpose of the high-risk AI system.
  action: test against predefined metrics and probabilistic thresholds appropriate to the intended purpose
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P9-UNDER-18-IMPACT
  source: A009-P018
  quote: providers shall give consideration to whether in view of its intended purpose the high-risk AI
    system is likely to have an adverse impact on persons under the age of 18 and, as appropriate, other
    vulnerable groups.
  action: consider whether the high-risk AI system is likely to adversely affect persons under the age
    of 18 in view of its intended purpose
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P9-VULNERABLE-GROUPS
  source: A009-P018
  quote: providers shall give consideration to whether in view of its intended purpose the high-risk AI
    system is likely to have an adverse impact on persons under the age of 18 and, as appropriate, other
    vulnerable groups.
  action: consider likely adverse impacts on other vulnerable groups where appropriate
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A009-P10-INTEGRATE-RISK-PROCESSES
  source: A009-P019
  quote: the aspects provided in paragraphs 1 to 9 may be part of, or combined with, the risk management
    procedures established pursuant to that law.
  action: incorporate or combine Article 9 aspects with internal risk-management procedures required by
    other Union law
  subject_ref: provider
  subject_category: supported_operator
  kind: permission
  conditions:
  - the provider is already subject to internal risk-management-process requirements under other relevant
    Union law
  implementation_refs: *id001
  verification_mode: reported_conditionally
