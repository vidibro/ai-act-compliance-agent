  conditions:
  - the information concerns issues relating to positive conformity assessment results
  - the recipient is another notified body carrying out similar conformity assessment activities
    covering the same types of AI systems
  - that recipient requests the information
- norm_id: AIA-NORM-A045-P4-CONFIDENTIALITY
