- norm_id: AIA-NORM-A045-P3-SHARE-ASSESSMENT-RESULTS
  source: A045-P010
  quote: Each notified body shall provide the other notified bodies carrying out similar conformity assessment
    activities covering the same types of AI systems with relevant information on issues relating to negative
    and, on request, positive conformity assessment results.
  action: provide relevant information on issues relating to negative conformity assessment results
    to other notified bodies carrying out similar conformity assessment activities covering the same
    types of AI systems, without requiring a prior request
  conditions:
    operator: all_of
    operands:
    - text: relevant information on issues relating to negative
      basis_segment_ids: [AIA-TEXT-A045-P010]
    - text: the other notified bodies carrying out similar conformity assessment activities covering the same types of AI systems
      basis_segment_ids: [AIA-TEXT-A045-P010]
  actors:
  - actor_ref: notified_body
    basis_segment_ids: [AIA-TEXT-A045-P010]
  targets: []
