records:
- norm_id: AIA-NORM-A045-P1-INFORM-NOTIFYING-AUTHORITY
  source: A045-P001
  quote: Notified bodies shall inform the notifying authority of the following
  action: inform the notifying authority of each listed issuance, adverse decision, notification-related
    circumstance or information-request event without requiring a prior request for disclosure
  actors:
  - actor_ref: notified_body
    basis_segment_ids: [AIA-TEXT-A045-P001]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A045-P002
  - A045-P003
  - A045-P004
  - A045-P005
  conditions:
    operator: any_of
    operands:
    - text: any Union technical documentation assessment certificates, any supplements to those certificates, and any quality management system approvals issued in accordance with the requirements of Annex VII
      basis_segment_ids: [AIA-TEXT-A045-P002]
    - text: any refusal, restriction, suspension or withdrawal of a Union technical documentation assessment certificate or a quality management system approval issued in accordance with the requirements of Annex VII
      basis_segment_ids: [AIA-TEXT-A045-P003]
    - text: any circumstances affecting the scope of or conditions for notification
      basis_segment_ids: [AIA-TEXT-A045-P004]
    - text: any request for information which they have received from market surveillance authorities regarding conformity assessment activities
      basis_segment_ids: [AIA-TEXT-A045-P005]
- norm_id: AIA-NORM-A045-P1-DISCLOSE-ACTIVITIES-ON-REQUEST
  source: A045-P001
  quote: Notified bodies shall inform the notifying authority of the following
  action: inform the notifying authority on request about conformity assessment activities within the
    notification scope and other activities performed, including cross-border activities and subcontracting
  actors:
  - actor_ref: notified_body
    basis_segment_ids: [AIA-TEXT-A045-P001]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A045-P006
  conditions:
    operator: all_of
    operands:
    - text: on request, conformity assessment activities performed within the scope of their notification and any other activity performed, including cross-border activities and subcontracting
      basis_segment_ids: [AIA-TEXT-A045-P006]
  mandatory_content:
  - conformity assessment activities performed within the scope of the notification
  - other activities performed, including cross-border activities and subcontracting
