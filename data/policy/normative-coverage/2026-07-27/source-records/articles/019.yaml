records:
- norm_id: AIA-NORM-A019-P1-KEEP-CONTROLLED-LOGS
  source: A019-P001
  quote: Providers of high-risk AI systems shall keep the logs referred to in Article 12(1), automatically
    generated by their high-risk AI systems, to the extent such logs are under their control.
  action: "keep automatically generated Article 12(1) logs to the extent they are under the provider\u2019\
    s control"
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - "the automatically generated logs are under the provider\u2019s control"
  implementation_refs: &id001
  - AIA-PO-A19
  verification_mode: reported_not_judged
  dependencies:
  - dependency_ref: AIA-NORM-A012-P1-AUTOMATIC-LOGGING
    resolution: internal_resolved
    detail: Article 12(1) supplies the referenced automatic-logging requirement.
  verified_by: vidibro
- norm_id: AIA-NORM-A019-P1-RETENTION-PERIOD
  source: A019-P001
  quote: the logs shall be kept for a period appropriate to the intended purpose of the high-risk AI system,
    of at least six months, unless provided otherwise in the applicable Union or national law, in particular
    in Union law on the protection of personal data
  action: "retain controlled logs for a period appropriate to the system\u2019s intended purpose and for at
    least six months"
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - "the automatically generated logs are under the provider\u2019s control"
  exceptions:
  - applicable Union or national law, particularly personal-data law, provides a different retention
    period
  implementation_refs: *id001
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A019-P2-FINANCIAL-DOCUMENTATION
  source: A019-P002
  quote: Providers that are financial institutions subject to requirements regarding their internal governance,
    arrangements or processes under Union financial services law shall maintain the logs automatically
    generated by their high-risk AI systems as part of the documentation kept under the relevant financial
    services law.
  action: maintain automatically generated high-risk-system logs within documentation kept under applicable
    Union financial-services law
  subject_ref: financial_institution_provider
  subject_category: supported_operator
  conditions:
  - the provider is a financial institution subject to internal-governance requirements under Union financial-services
    law
  implementation_refs: *id001
  verification_mode: reported_not_judged
  verified_by: vidibro
