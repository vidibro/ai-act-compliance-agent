- norm_id: AIA-NORM-A019-P1-RETENTION-PERIOD
  source: A019-P001
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: the logs shall be kept for a period appropriate to the intended purpose of the high-risk AI system,
    of at least six months, unless provided otherwise in the applicable Union or national law, in particular
    in Union law on the protection of personal data
  action: "retain controlled logs for a period appropriate to the system\u2019s intended purpose and for at
    least six months"
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A019-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: to the extent such logs are under their control
      basis_segment_ids: [AIA-TEXT-A019-P001]
  exceptions:
    operator: all_of
    operands:
    - text: unless provided otherwise in the applicable Union or national law, in particular in Union law on the protection of personal data
      basis_segment_ids: [AIA-TEXT-A019-P001]
