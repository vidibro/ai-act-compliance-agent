records:
- norm_id: AIA-NORM-A017-P1-QMS
  source: A017-P001
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: Providers of high-risk AI systems shall put a quality management system in place that ensures
    compliance with this Regulation.
  action: establish a quality-management system that ensures compliance with the Regulation
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A017-P001]
  targets: []
  implementation_refs: &id001
