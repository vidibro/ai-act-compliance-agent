- norm_id: AIA-NORM-A017-P1-E-SPECIFICATIONS
  source: A017-P006
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: technical specifications, including standards, to be applied and, where the relevant harmonised
    standards are not applied in full or do not cover all of the relevant requirements set out in Section
    2, the means to be used to ensure that the high-risk AI system complies with those requirements
  action: include applicable technical specifications and standards and the alternative means used for
    Section 2 compliance where harmonised standards are incomplete or insufficient
