  verified_by: vidibro
- norm_id: AIA-NORM-A017-P1-SYSTEMATIC-WRITTEN-DOCUMENTATION
  source: A017-P001
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: That system shall be documented in a systematic and orderly manner in the form of written policies,
