records:
- norm_id: AIA-NORM-A030-P1-ARTICLE-31-GATE
  source: A030-P001
  quote: Notifying authorities may notify only conformity assessment bodies which have satisfied the requirements
    laid down in Article 31.
  action: notify only conformity-assessment bodies satisfying Article 31
  subject_ref: notifying_authority
  subject_category: public_authority
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A030-P2-ELECTRONIC-NOTIFICATION
  source: A030-P002
  quote: Notifying authorities shall notify the Commission and the other Member States, based on the list
    of codes, categories, and corresponding types of AI systems referred to in Annex XIV, and using the
    electronic notification tool developed and managed by the Commission, of each conformity assessment
    body referred to in paragraph 1.
  action: notify the Commission and other Member States of qualifying bodies using Annex XIV classifications
    and the Commission tool
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A030-P2-AMEND-ANNEX-XIV
  source: A030-P003
  quote: The Commission is empowered to adopt delegated acts in accordance with Article 97 in order to
    amend Annex XIV, in light of technical progress, advances in knowledge or new scientific evidence
    by adding to the list of codes, categories, and corresponding types of AI systems a new code, a category
    or a type of AI system, withdrawing an existing code, category or a type of AI system from that list
    or moving a code or type of AI system from one category to another.
  action: amend Annex XIV classifications by delegated act in response to technical, knowledge, or scientific
    developments
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A030-P3-NOTIFICATION-CONTENT
  source: A030-P004
  quote: The notification referred to in paragraph 2 of this Article shall include full details of the
    conformity assessment activities, the conformity assessment module or modules, the types of AI systems
    concerned, and the relevant attestation of competence.
  action: include complete assessment scope and competence information in the body notification
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
  mandatory_content:
  - conformity assessment activities
  - conformity assessment modules
  - AI-system types
  - relevant competence attestation
- norm_id: AIA-NORM-A030-P3-NONACCREDITED-EVIDENCE
  source: A030-P004
  quote: Where a notification is not based on an accreditation certificate as referred to in Article 29(2),
    the notifying authority shall provide the Commission and the other Member States with documentary
    evidence which attests to the competence of the conformity assessment body and to the arrangements
    in place to ensure that that body will be monitored regularly and will continue to satisfy the requirements
    laid down in Article 31.
  action: provide competence and continuing-monitoring evidence for a notification not based on accreditation
  subject_ref: notifying_authority
  subject_category: public_authority
  conditions:
  - the notification is not based on an Article 29(2) accreditation certificate
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A030-P4-NO-OBJECTION-AUTHORISATION
  source: A030-P005
  quote: The conformity assessment body concerned may perform the activities of a notified body only where
    no objections are raised by the Commission or the other Member States within two weeks of a notification
    by a notifying authority where it includes an accreditation certificate referred to in Article 29(2),
    or within two months of a notification by the notifying authority where it includes documentary evidence
    referred to in Article 29(3).
  action: permit notified-body activities only after the applicable no-objection period expires
  subject_ref: conformity_assessment_body
  subject_category: notified_or_conformity_body
  kind: permission
  conditions:
  - no Commission or Member-State objection within two weeks for an accredited notification or two months
    for an evidence-based notification
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A030-P5-CONSULT-ON-OBJECTIONS
  source: A030-P006
  quote: Where objections are raised, the Commission shall, without delay, enter into consultations with
    the relevant Member States and the conformity assessment body.
  action: promptly consult the relevant Member States and conformity body when objections arise
  subject_ref: commission
  subject_category: union_institution_or_body
  conditions: &id001
  - objections are raised to the notification
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A030-P5-DECIDE-AUTHORISATION
  source: A030-P006
  quote: In view thereof, the Commission shall decide whether the authorisation is justified.
  action: decide whether the disputed authorisation is justified
  subject_ref: commission
  subject_category: union_institution_or_body
  conditions: *id001
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A030-P5-ADDRESS-DECISION
  source: A030-P006
  quote: The Commission shall address its decision to the Member State concerned and to the relevant conformity
    assessment body.
  action: address the authorisation decision to the concerned Member State and conformity body
  subject_ref: commission
  subject_category: union_institution_or_body
  conditions: *id001
