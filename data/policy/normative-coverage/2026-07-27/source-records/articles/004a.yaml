records:
- norm_id: AIA-NORM-A004A-P1-HIGH-RISK-BIAS-DATA-PROCESSING
  source: A004A-P001
  quote: To the extent strictly necessary to ensure bias detection and correction in relation to high-risk
    AI systems in accordance with Article 10(2), points (f) and (g), of this Regulation, providers of
    such systems may exceptionally process special categories of personal data, subject to appropriate
    safeguards for the fundamental rights and freedoms of natural persons.
  action: exceptionally process special categories of personal data where strictly necessary for bias
    detection and correction in high-risk AI systems
  subject_ref: high_risk_ai_system_provider
  subject_category: supported_operator
  kind: permission
  qualifier_spans:
  - A004A-P002
  - A004A-P003
  - A004A-P004
  - A004A-P005
  - A004A-P006
  - A004A-P007
  conditions:
  - the processing is strictly necessary for bias detection and correction under Article 10(2), points
    (f) and (g)
  - the processing is subject to appropriate safeguards for natural persons' fundamental rights and freedoms
  - processing other data, including synthetic or anonymised data, cannot effectively achieve the bias
    detection and correction
  - every safeguard and condition in Article 4a(1), points (b) to (f), is satisfied
  dependencies:
  - dependency_ref: Article 10(2), points (f) and (g), of this Regulation
    resolution: unresolved
    detail: The bias-detection and correction purpose depends on Article 10, which has not yet been semantically
      reviewed.
  - dependency_ref: AIA-NORM-A003-D037-SPECIAL-CATEGORIES-OF-PERSONAL-DATA
    resolution: internal_resolved
    detail: Article 3(37) defines the special categories of personal data covered by the permission.
  - dependency_ref: Regulation (EU) 2016/679; Regulation (EU) 2018/1725; Directive (EU) 2016/680
    resolution: external_recorded
    detail: The exceptional processing remains additional to the applicable external data-protection instruments.
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A004A-P1-B-REUSE-SECURITY
  source: A004A-P003
  quote: the special categories of personal data are subject to technical limitations on the re-use of
    personal data, and state-of-the-art security and privacy-preserving measures, including pseudonymisation
  action: apply technical reuse limitations and state-of-the-art security and privacy-preserving measures,
    including pseudonymisation, to special-category personal data
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A004A-P1-C-ACCESS-SAFEGUARDS
  source: A004A-P004
  quote: the special categories of personal data are subject to measures to ensure that the personal data
    processed are secured and protected, subject to suitable safeguards, including strict controls and
    documentation of the access, to avoid misuse and to ensure that only authorised persons have access
    to those personal data with appropriate confidentiality obligations
  action: secure and protect special-category personal data with suitable safeguards, documented strict
    access controls, authorised access, and appropriate confidentiality obligations
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A004A-P1-D-NO-THIRD-PARTY-ACCESS
  source: A004A-P005
  quote: the special categories of personal data are not transmitted, transferred or otherwise accessed
    by other parties
  action: prevent special-category personal data from being transmitted, transferred, or otherwise accessed
    by other parties
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A004A-P1-E-DELETE-DATA
  source: A004A-P006
  quote: the special categories of personal data are deleted once the bias has been corrected or the personal
    data has reached the end of its retention period, whichever comes first
  action: delete special-category personal data when the bias is corrected or the retention period ends,
    whichever occurs first
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A004A-P1-F-RECORD-NECESSITY
  source: A004A-P007
  quote: the records of processing activities pursuant to Regulations (EU) 2016/679 and (EU) 2018/1725
    and Directive (EU) 2016/680 include the reasons why the processing of special categories of personal
    data was strictly necessary to detect and correct biases, and why that objective could not be achieved
    by processing other data.
  action: record why special-category processing was strictly necessary for bias detection and correction
    and why other data could not achieve that objective
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
  dependencies:
  - dependency_ref: Regulation (EU) 2016/679; Regulation (EU) 2018/1725; Directive (EU) 2016/680
    resolution: external_recorded
    detail: The reasons must be included in processing records maintained under the applicable external
      instruments.
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A004A-P2-OTHER-SYSTEM-BIAS-DATA-PROCESSING
  source: A004A-P008
  quote: Providers and deployers of other AI systems and models and deployers of high-risk AI systems
    may exceptionally process special categories of personal data to the extent that
  action: exceptionally process special categories of personal data for qualifying bias detection and
    correction involving other AI systems and models or deployment of high-risk AI systems
  subject_ref: other_ai_provider_or_deployer_or_high_risk_deployer
  subject_category: supported_operator
  kind: permission
  qualifier_spans:
  - A004A-P009
  - A004A-P010
  conditions:
  - the processing is strictly necessary for bias detection and correction concerning biases likely to
    affect health or safety, negatively affect fundamental rights, or cause discrimination prohibited
    by Union law
  - all Article 4a(1) conditions and safeguards are applied
  dependencies:
  - dependency_ref: AIA-NORM-A003-D037-SPECIAL-CATEGORIES-OF-PERSONAL-DATA
    resolution: internal_resolved
    detail: Article 3(37) defines the special categories of personal data covered by the permission.
  - dependency_ref: AIA-NORM-A004A-P1-B-REUSE-SECURITY
    resolution: internal_resolved
    detail: Article 4a(2)(b) imports this paragraph 1 safeguard.
  - dependency_ref: AIA-NORM-A004A-P1-C-ACCESS-SAFEGUARDS
    resolution: internal_resolved
    detail: Article 4a(2)(b) imports this paragraph 1 safeguard.
  - dependency_ref: AIA-NORM-A004A-P1-D-NO-THIRD-PARTY-ACCESS
    resolution: internal_resolved
    detail: Article 4a(2)(b) imports this paragraph 1 safeguard.
  - dependency_ref: AIA-NORM-A004A-P1-E-DELETE-DATA
    resolution: internal_resolved
    detail: Article 4a(2)(b) imports this paragraph 1 safeguard.
  - dependency_ref: AIA-NORM-A004A-P1-F-RECORD-NECESSITY
    resolution: internal_resolved
    detail: Article 4a(2)(b) imports this paragraph 1 safeguard.
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A004A-P2-NO-BIAS-DETECTION-DUTY
  source: A004A-P011
  quote: This paragraph does not create any obligation to conduct such bias detection and correction.
  action: prevent Article 4a(2) from being construed as requiring bias detection and correction
  subject_ref: article_4a_paragraph_2_actor
  subject_category: supported_operator
  kind: legal_consequence
  dependencies:
  - dependency_ref: AIA-NORM-A004A-P2-OTHER-SYSTEM-BIAS-DATA-PROCESSING
    resolution: internal_resolved
    detail: The clause limits the legal effect of the Article 4a(2) permission.
  product_scope: dependency_only
  product_scope_reason: This clause constrains downstream rule interpretation but creates no independent
    compliance action.
  implementation_mode: none_required
  implementation_reason: The no-obligation consequence is represented as a dependency rather than a standalone
    product rule.
  verification_mode: not_reported
