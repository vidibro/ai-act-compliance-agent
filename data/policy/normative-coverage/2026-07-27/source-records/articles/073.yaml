records:
- norm_id: AIA-NORM-A073-P1-REPORT-SERIOUS-INCIDENT
  source: A073-P001
  quote: Providers of high-risk AI systems placed on the Union market shall report any serious incident to the market surveillance authorities of the Member States where that incident occurred.
  action: report every serious incident to the market surveillance authority where it occurred
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P2-DEFAULT-REPORTING-DEADLINE
  source: A073-P002
  quote: The report referred to in paragraph 1 shall be made immediately after the provider has established a causal link between the AI system and the serious incident or the reasonable likelihood of such a link, and, in any event, not later than 15 days after the provider or, where applicable, the deployer, becomes aware of the serious incident.
  action: report immediately after establishing a causal link or reasonable likelihood and no later than 15 days after awareness
  subject_ref: provider_or_applicable_deployer
  subject_category: supported_operator
  qualifier_spans: [A073-P003]
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P3-TWO-DAY-DEADLINE
  source: A073-P004
  quote: Notwithstanding paragraph 2 of this Article, in the event of a widespread infringement or a serious incident as defined in Article 3, point (49)(b), the report referred to in paragraph 1 of this Article shall be provided immediately, and not later than two days after the provider or, where applicable, the deployer becomes aware of that incident.
  action: report a widespread infringement or Article 3(49)(b) incident immediately and within two days of awareness
  subject_ref: provider_or_applicable_deployer
  subject_category: supported_operator
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P4-DEATH-DEADLINE
  source: A073-P005
  quote: Notwithstanding paragraph 2, in the event of the death of a person, the report shall be provided immediately after the provider or the deployer has established, or as soon as it suspects, a causal relationship between the high-risk AI system and the serious incident, but not later than 10 days after the date on which the provider or, where applicable, the deployer becomes aware of the serious incident.
  action: report a death immediately on established or suspected causality and within ten days of awareness
  subject_ref: provider_or_applicable_deployer
  subject_category: supported_operator
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P5-INITIAL-INCOMPLETE-REPORT
  source: A073-P006
  quote: Where necessary to ensure timely reporting, the provider or, where applicable, the deployer, may submit an initial report that is incomplete, followed by a complete report.
  action: submit an initial incomplete report followed by a complete report where needed for timeliness
  subject_ref: provider_or_applicable_deployer
  subject_category: supported_operator
  kind: permission
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P6-INVESTIGATE-ASSESS-AND-CORRECT
  source: A073-P007
  quote: Following the reporting of a serious incident pursuant to paragraph 1, the provider shall, without delay, perform the necessary investigations in relation to the serious incident and the AI system concerned. This shall include a risk assessment of the incident
  action: perform, without delay, the necessary investigations into the serious incident and the AI
    system concerned, including a risk assessment of the incident
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - a serious incident has been reported pursuant to paragraph 1
  mandatory_content: [necessary investigation of the serious incident and the AI system concerned,
    risk assessment of the incident]
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P6-CORRECTIVE-ACTION
  source: A073-P007
  quote: and corrective action.
  action: take corrective action following the investigation of the reported serious incident
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - a serious incident has been reported pursuant to paragraph 1
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P6-COOPERATE-AND-PRESERVE-SYSTEM
  source: A073-P008
  quote: The provider shall cooperate with the competent authorities, and where relevant with the notified body concerned, during the investigations referred to in the first subparagraph
  action: cooperate with the competent authorities, and where relevant with the notified body
    concerned, during the first-subparagraph investigations
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P6-NO-EVIDENCE-AFFECTING-ALTERATION
  source: A073-P008
  quote: shall not perform any investigation which involves altering the AI system concerned in a way which may affect any subsequent evaluation of the causes of the incident, prior to informing the competent authorities of such action.
  action: perform no investigation that alters the AI system concerned in a way which may affect any
    subsequent evaluation of the causes of the incident before informing the competent authorities of
    such action
  subject_ref: provider
  subject_category: supported_operator
  kind: prohibition
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P7-INFORM-FUNDAMENTAL-RIGHTS-AUTHORITIES
  source: A073-P009
  quote: Upon receiving a notification related to a serious incident referred to in Article 3, point (49)(c), the relevant market surveillance authority shall inform the national public authorities or bodies referred to in Article 77(1).
  action: inform Article 77(1) authorities of Article 3(49)(c) incident notifications
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A073-P7-COMMISSION-REPORTING-GUIDANCE
  source: A073-P009
  quote: The Commission shall develop dedicated guidance to facilitate compliance with the obligations set out in paragraph 1 of this Article. That guidance shall be issued by 2 August 2025, and shall be assessed regularly.
  action: issue incident-reporting guidance by 2 August 2025 and assess it regularly
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A073-P8-SEVEN-DAY-AUTHORITY-ACTION
  source: A073-P010
  quote: The market surveillance authority shall take appropriate measures, as provided for in Article 19 of Regulation (EU) 2019/1020, within seven days from the date it received the notification referred to in paragraph 1 of this Article
  action: take the appropriate measures provided for in Article 19 of Regulation (EU) 2019/1020
    within seven days of receiving the paragraph 1 notification
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A073-P8-FOLLOW-NOTIFICATION-PROCEDURES
  source: A073-P010
  quote: and shall follow the notification procedures as provided in that Regulation.
  action: follow the notification procedures provided in Regulation (EU) 2019/1020
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A073-P9-EQUIVALENT-REPORTING-LIMIT
  source: A073-P011
  quote: For high-risk AI systems referred to in Annex III that are placed on the market or put into service by providers that are subject to Union legislative instruments laying down reporting obligations equivalent to those set out in this Regulation, the notification of serious incidents shall be limited to those referred to in Article 3, point (49)(c).
  action: limit reporting to Article 3(49)(c) incidents where equivalent Union reporting legislation applies
  subject_ref: provider
  subject_category: supported_operator
  kind: legal_consequence
  implementation_refs: [AIA-ALL-A73]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P10-MEDICAL-DEVICE-REPORTING
  source: A073-P012
  quote: For high-risk AI systems which are safety components of devices, or are themselves devices, covered by Regulations (EU) 2017/745 and (EU) 2017/746, the notification of serious incidents shall be limited to those referred to in Article 3, point (49)(c) of this Regulation, and shall be made to the national competent authority chosen for that purpose by the Member States where the incident occurred.
  action: limit covered medical-device reports to Article 3(49)(c) incidents and send them to the designated national competent authority
  subject_ref: provider_or_applicable_deployer
  subject_category: supported_operator
  implementation_refs: [AIA-ALL-A73-10]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A073-P11-NOTIFY-COMMISSION
  source: A073-P013
  quote: National competent authorities shall immediately notify the Commission of any serious incident, whether or not they have taken action on it, in accordance with Article 20 of Regulation (EU) 2019/1020.
  action: immediately notify the Commission of every serious incident under Article 20 regardless of action taken
  subject_ref: national_competent_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
