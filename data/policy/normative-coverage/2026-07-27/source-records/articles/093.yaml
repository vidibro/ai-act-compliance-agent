- norm_id: AIA-NORM-A093-P1-REQUEST-GPAI-MEASURES
  source: A093-P001
  quote: Where necessary and appropriate, the Commission may request providers to
  action: request necessary appropriate compliance mitigation or market-restriction measures from GPAI providers
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  mandatory_content: [comply with Articles 53 and 54, mitigate a serious substantiated Union-level systemic-risk concern arising from Article 92 evaluation, restrict market availability withdraw or recall the model]
  qualifier_spans: [A093-P002, A093-P003, A093-P004]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
