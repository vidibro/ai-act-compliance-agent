records:
- norm_id: AIA-NORM-A093-P1-REQUEST-GPAI-MEASURES
  source: A093-P001
  quote: Where necessary and appropriate, the Commission may request providers to
  action: request necessary appropriate compliance mitigation or market-restriction measures from GPAI
    providers
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A093-P001]
  targets: []
  kind: power
  mandatory_content: []
  qualifier_spans:
  - A093-P002
  - A093-P003
  - A093-P004
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: all_of
    operands:
    - text: Where necessary and appropriate
      basis_segment_ids: [AIA-TEXT-A093-P001]
    - operator: any_of
      operands:
      - text: take appropriate measures to comply with the obligations set out in Articles 53 and 54
        basis_segment_ids: [AIA-TEXT-A093-P002]
      - operator: all_of
        operands:
        - text: implement mitigation measures
          basis_segment_ids: [AIA-TEXT-A093-P003]
        - text: where the evaluation carried out in accordance with Article 92 has given rise to serious and substantiated concern of a systemic risk at Union level
          basis_segment_ids: [AIA-TEXT-A093-P003]
      - text: restrict the making available on the market, withdraw or recall the model
        basis_segment_ids: [AIA-TEXT-A093-P004]
- norm_id: AIA-NORM-A093-P2-INITIATE-STRUCTURED-DIALOGUE
  source: A093-P005
  quote: Before a measure is requested, the AI Office may initiate a structured dialogue with the provider
    of the general-purpose AI model.
  action: initiate structured dialogue with the GPAI provider before requesting a measure
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A093-P005]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A093-P3-MAKE-COMMITMENTS-BINDING
  source: A093-P006
  quote: If, during the structured dialogue referred to in paragraph 2, the provider of the general-purpose
    AI model with systemic risk offers commitments to implement mitigation measures to address a systemic
    risk at Union level, the Commission may, by decision, make those commitments binding and declare that
    there are no further grounds for action.
  action: make offered systemic-risk mitigation commitments binding and declare no further grounds for
    action
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A093-P006]
  targets: []
  kind: power
