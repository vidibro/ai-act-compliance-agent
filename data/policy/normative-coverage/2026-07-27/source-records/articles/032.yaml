records:
- norm_id: AIA-NORM-A032-P1-HARMONISED-STANDARDS-PRESUMPTION
  source: A032-P001
  quote: Where a conformity assessment body demonstrates its conformity with the criteria laid down in
    the relevant harmonised standards or parts thereof, the references of which have been published in
    the Official Journal of the European Union, it shall be presumed to comply with the requirements set
    out in Article 31 in so far as the applicable harmonised standards cover those requirements.
  action: presume Article 31 compliance where demonstrated conformity with published harmonised standards
    covers the applicable requirements
  actors:
  - actor_ref: conformity_assessment_body
    category: notified_or_conformity_body
  targets: []
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the conformity-assessment body demonstrates conformity with the relevant harmonised standards or parts
    thereof
  - references to those standards or parts have been published in the Official Journal of the European
    Union
  - the standards cover the relevant Article 31 requirements
