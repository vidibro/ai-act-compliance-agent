records:
- norm_id: AIA-NORM-A057-P1-ESTABLISH-NATIONAL-SANDBOX
  source: A057-P001
  quote: Member States shall ensure that their competent authorities establish at least one AI regulatory
    sandbox at national level, which shall be operational by 2 August 2027. That sandbox may also be established
    jointly with the competent authorities of other Member States.
  action: ensure at least one national AI regulatory sandbox is operational by 2 August 2027, individually
    or jointly
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P1-COMMISSION-SUPPORT
  source: A057-P001
  quote: The Commission may provide technical support, advice and tools for the establishment and operation
    of AI regulatory sandboxes.
  action: provide technical support, advice, and tools for sandbox establishment and operation
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
