- norm_id: AIA-NORM-A057-P2-ADDITIONAL-SANDBOXES
  source: A057-P003
  quote: Additional AI regulatory sandboxes at regional or local level, or established jointly with the
    competent authorities of other Member States may also be established.
  action: establish additional regional, local, or jointly operated sandboxes
  subject_ref: member_state_or_competent_authority
