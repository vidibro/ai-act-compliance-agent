- norm_id: AIA-NORM-A057-P3-EDPS-SANDBOX
  source: A057-P004
  quote: The European Data Protection Supervisor may establish an AI regulatory sandbox for Union institutions,
    bodies, offices and agencies. For this purpose, references to national competent authorities in this
    Chapter shall be construed as references to the European Data Protection Supervisor.
  action: establish and act as competent authority for a Union-institution AI regulatory sandbox
  subject_ref: european_data_protection_supervisor
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P3A-AI-OFFICE-SANDBOX
  source: A057-P005
  quote: The AI Office may establish an AI regulatory sandbox at Union level for AI systems covered by
    Article 75(1). For this purpose, references to national competent authorities in this Chapter shall
    be construed, where relevant, as references to the AI Office. That AI regulatory sandbox shall be
    implemented in close cooperation with relevant competent authorities, in particular where compliance
    with Union legislation other than this Regulation is supervised in the AI regulatory sandbox, and
    shall provide priority access to SMEs, including start-ups, and SMCs.
  action: establish and implement an Article 75(1) Union sandbox with relevant-authority cooperation and
    priority SME, start-up, and SMC access
  subject_ref: ai_office
  subject_category: union_institution_or_body
  kind: power
  mandatory_content:
  - close cooperation with relevant competent authorities
  - priority access for SMEs including start-ups and SMCs
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P4-RESOURCE-AND-AUTHORITY-COORDINATION
  source: A057-P007
  quote: Member States shall ensure that the competent authorities referred to in paragraphs 1 and 2 allocate
    sufficient resources to comply with this Article effectively and in a timely manner. Where appropriate,
    national competent authorities shall cooperate with other relevant authorities, and may allow for
    the involvement of other actors within the AI ecosystem. This Article shall not affect other regulatory
    sandboxes established under Union or national law. Member States shall ensure an appropriate level
    of cooperation between the authorities supervising those other sandboxes and the national competent
    authorities.
  action: ensure sufficient sandbox resources and appropriate cooperation among national, specialist,
    and other-sandbox authorities
  subject_ref: member_state
  subject_category: member_state
  mandatory_content:
  - sufficient resources for effective timely compliance
  - appropriate cooperation with relevant and other-sandbox authorities
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P5-CONTROLLED-SANDBOX-LIFECYCLE
  source: A057-P008
  quote: AI regulatory sandboxes established under this Article shall provide for a controlled environment
    that fosters innovation and facilitates the development, training, testing and validation of innovative
    AI systems for a limited time before their being placed on the market or put into service pursuant
    to a specific sandbox plan agreed between the providers or prospective providers and the competent
    authorities, ensuring that appropriate safeguards are in place. Such sandboxes may include testing
    in real world conditions supervised therein. Where applicable, the sandbox plan shall incorporate
    the real-world testing plan referred to in Articles 60 and 60a.
  action: operate a time-limited safeguarded controlled environment under an agreed plan, incorporating
    applicable real-world testing plans
  subject_ref: sandbox_competent_authority
  subject_category: public_authority
  mandatory_content:
  - controlled environment
  - limited pre-market period
  - agreed sandbox plan
  - appropriate safeguards
  - applicable Articles 60 and 60a testing plan
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P6-GUIDANCE-SUPERVISION-SUPPORT
  source: A057-P009
  quote: Competent authorities shall provide, as appropriate, guidance, supervision and support within
    the AI regulatory sandbox with a view to identifying risks, in particular to fundamental rights, health
    and safety, testing, mitigation measures, and their effectiveness in relation to the obligations and
    requirements of this Regulation and, where relevant, other Union and national law supervised within
    the sandbox.
  action: provide sandbox guidance, supervision, and support addressing risks, testing, mitigation, effectiveness,
    and applicable law
  subject_ref: sandbox_competent_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P7-REGULATORY-EXPECTATIONS-GUIDANCE
  source: A057-P010
  quote: Competent authorities shall provide providers and prospective providers participating in the
    AI regulatory sandbox with guidance on regulatory expectations and how to fulfil the requirements
    and obligations set out in this Regulation.
  action: guide sandbox participants on regulatory expectations and fulfilment of Regulation obligations
  subject_ref: sandbox_competent_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P7-SANDBOX-EVIDENCE-PACKAGE
  source: A057-P011
  quote: Upon request of the provider or prospective provider of the AI system, the competent authority
    shall provide a written proof of the activities successfully carried out in the sandbox. The competent
    authority shall also provide an exit report detailing the activities carried out in the sandbox and
    the related results and learning outcomes.
  action: provide requested written proof and an exit report covering activities, results, and learning
    outcomes
  subject_ref: sandbox_competent_authority
  subject_category: public_authority
  mandatory_content:
  - activities carried out
  - related results
  - learning outcomes
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P7-EVIDENTIARY-USE
  source: A057-P011
  quote: Providers may use such documentation to demonstrate their compliance with this Regulation through
    the conformity assessment process or relevant market surveillance activities. In this regard, the
    exit reports and the written proof provided by the national competent authority shall be taken positively
    into account by market surveillance authorities and notified bodies, with a view to accelerating conformity
    assessment procedures to a reasonable extent.
  action: use sandbox documentation as compliance evidence receiving positive consideration in conformity
    assessment and surveillance
  subject_ref: provider
  subject_category: supported_operator
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: Establishes an evidentiary route and consequence rather than a new product action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P8-EXIT-REPORT-ACCESS
  source: A057-P012
  quote: Subject to the confidentiality provisions in Article 78, and with the agreement of the provider
    or prospective provider, the Commission and the Board shall be authorised to access the exit reports
    and shall take them into account, as appropriate, when exercising their tasks under this Regulation.
    If both the provider or prospective provider and the national competent authority explicitly agree,
    the exit report may be made publicly available through the single information platform referred to
    in this Article.
  action: access and appropriately use agreed exit reports, with public release only on explicit provider
    and authority agreement
  subject_ref: commission_and_board
  subject_category: union_institution_or_body
  conditions:
  - Article 78 confidentiality is observed
  - the provider or prospective provider agrees
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P9-SANDBOX-OBJECTIVES
  source: A057-P013
  quote: The establishment of AI regulatory sandboxes shall aim to contribute to the following objectives
  action: design sandbox establishment to contribute to every enacted objective
  subject_ref: sandbox_competent_authority
  subject_category: public_authority
  mandatory_content:
  - legal certainty and compliance
  - best-practice sharing
  - innovation competitiveness and ecosystem development
  - evidence-based regulatory learning
  - accelerated Union-market access especially for SMEs start-ups and SMCs
  qualifier_spans:
  - A057-P014
  - A057-P015
  - A057-P016
  - A057-P017
  - A057-P018
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P10-ASSOCIATE-SPECIALIST-AUTHORITIES
  source: A057-P019
  quote: National competent authorities shall ensure that, to the extent the innovative AI systems involve
    the processing of personal data or otherwise fall under the supervisory remit of other national authorities
    or competent authorities providing or supporting access to data, the competent data protection authorities
    and those other national or competent authorities are associated with the operation of the AI regulatory
    sandbox and involved in the supervision of those aspects to the extent of their respective tasks and
    powers.
  action: associate and involve data-protection and other competent authorities in sandbox operation and
    supervision within their remit
  subject_ref: national_competent_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P11-SUPERVISORY-MITIGATION-WORKFLOW
  source: A057-P020
  quote: Any significant risks to health and safety and fundamental rights identified during the development
    and testing of such AI systems shall result in an adequate mitigation. National competent authorities
    shall have the power to temporarily or permanently suspend the testing process, or the participation
    in the sandbox if no effective mitigation is possible, and shall inform the AI Office of such decision.
    National competent authorities shall exercise their supervisory powers within the limits of the relevant
    law, using their discretionary powers when implementing legal provisions in respect of a specific
    AI regulatory sandbox project, with the objective of supporting innovation in AI in the Union.
  action: require adequate mitigation, suspend unmitigable testing or participation, notify the AI Office,
    and exercise lawful discretion supporting innovation
  subject_ref: national_competent_authority
  subject_category: public_authority
  conditions:
  - significant health safety or fundamental-rights risks arise during development or testing
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P12-LIABILITY-AND-FINE-SAFE-HARBOUR
  source: A057-P021
  quote: Providers and prospective providers participating in the AI regulatory sandbox shall remain liable
    under applicable Union and national liability law for any damage inflicted on third parties as a result
    of the experimentation taking place in the sandbox. However, provided that the prospective providers
    observe the specific plan and the terms and conditions for their participation and follow in good
    faith the guidance given by the national competent authority, no administrative fines shall be imposed
    by the authorities for infringements of this Regulation. Where other competent authorities responsible
    for other Union and national law were actively involved in the supervision of the AI system in the
    sandbox and provided guidance for compliance, no administrative fines shall be imposed regarding that
    law.
  action: preserve third-party damage liability while applying the enacted good-faith sandbox no-fine
    safe harbours
  subject_ref: provider_or_prospective_provider
  subject_category: supported_operator
  kind: legal_consequence
  conditions:
  - the provider participates in sandbox experimentation
  - applicable safe-harbour conditions are assessed separately for Regulation and other-law infringements
  product_scope: no_product_action
  product_scope_reason: Defines liability and enforcement consequences rather than an independent product
    action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P13-CROSS-BORDER-DESIGN
  source: A057-P022
  quote: The AI regulatory sandboxes shall be designed and implemented in such a way that, where relevant,
    they facilitate cross-border cooperation between national competent authorities.
  action: design and implement sandboxes to facilitate relevant cross-border authority cooperation
  subject_ref: sandbox_competent_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P14-COORDINATE-SANDBOX-ACTIVITIES
  source: A057-P023
  quote: National competent authorities, the European Data Protection Supervisor and the AI Office, shall,
    as appropriate and within their respective competences, coordinate their activities and cooperate
    within the framework of the Board. They may support the joint establishment and operation of AI regulatory
    sandboxes, including in different sectors, and exchange best practices on related matters.
  action: coordinate and cooperate through the Board and support joint sandboxes and best-practice exchange
  subject_ref: sandbox_public_authorities
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P15-NOTIFY-AND-LIST-SANDBOXES
  source: A057-P024
  quote: National competent authorities shall inform the AI Office and the Board of the establishment
    of a sandbox, and may ask them for support and guidance. The AI Office shall make publicly available
    a list of planned and existing sandboxes and keep it up to date in order to encourage more interaction
    in the AI regulatory sandboxes and cross-border cooperation.
  action: notify Union bodies of established sandboxes and maintain a public current list supporting interaction
    and cross-border cooperation
  subject_ref: national_competent_authority_and_ai_office
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P16-SANDBOX-REPORTING
  source: A057-P025
  quote: National competent authorities shall submit annual reports to the AI Office and to the Board,
    from one year after the establishment of the AI regulatory sandbox and every year thereafter until
    its termination, and a final report. Those reports shall provide information on the progress and results
    of the implementation of those sandboxes, including best practices, incidents, lessons learnt and
    recommendations on their setup and, where relevant, on the application and possible revision of this
    Regulation, including its delegated and implementing acts, and on the application of other Union law
    supervised by the competent authorities within the sandbox. The national competent authorities shall
    make those annual reports or abstracts thereof available to the public, online. The Commission shall,
    where appropriate, take the annual reports into account when exercising its tasks under this Regulation.
  action: submit, publish, and institutionally use annual and final sandbox reports with all enacted content
  subject_ref: national_competent_authority
  subject_category: public_authority
  mandatory_content:
  - implementation progress and results
  - best practices
  - incidents
  - lessons learned
  - setup recommendations
  - relevant Regulation revision and other supervised Union-law information
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A057-P17-SINGLE-INFORMATION-INTERFACE
  source: A057-P026
  quote: The Commission shall develop a single and dedicated interface containing all relevant information
    related to AI regulatory sandboxes to allow stakeholders to interact with AI regulatory sandboxes
    and to raise enquiries with competent authorities, and to seek non-binding guidance on the conformity
    of innovative products, services, business models embedding AI technologies, in accordance with Article
    62(1), point (c). The Commission shall proactively coordinate with national competent authorities,
    where relevant.
  action: develop a dedicated sandbox information and enquiry interface and proactively coordinate it
    with national authorities
  subject_ref: commission
  subject_category: union_institution_or_body
  mandatory_content:
  - sandbox information
  - stakeholder interaction
  - authority enquiries
  - non-binding conformity guidance
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
