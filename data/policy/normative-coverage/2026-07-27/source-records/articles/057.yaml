- norm_id: AIA-NORM-A057-P16-SANDBOX-REPORTING
  source: A057-P025
  quote: National competent authorities shall submit annual reports to the AI Office and to the Board,
    from one year after the establishment of the AI regulatory sandbox and every year thereafter until
    its termination, and a final report. Those reports shall provide information on the progress and results
    of the implementation of those sandboxes, including best practices, incidents, lessons learnt and
    recommendations on their setup and, where relevant, on the application and possible revision of this
    Regulation, including its delegated and implementing acts, and on the application of other Union law
    supervised by the competent authorities within the sandbox.
  action: submit annual reports to the AI Office and the Board from one year after sandbox establishment
    and every year thereafter until termination, followed by a final report
  actors:
  - actor_ref: national_competent_authority
    basis_segment_ids: [AIA-TEXT-A057-P025]
  targets: []
  kind: obligation
  mandatory_content:
  - implementation progress and results
  - best practices
  - incidents
  - lessons learnt
  - recommendations on sandbox setup
  - where relevant, recommendations on application and possible revision of this Regulation, including
    its delegated and implementing acts
  - where relevant, recommendations on application of other Union law supervised by competent authorities
    within the sandbox
  - submit a final report when the sandbox terminates
  temporal_regime_id: AIA-TEMP-A057-P16-ANNUAL-REPORTING
  conditions:
    operator: all_of
    operands:
    - text: where relevant
      basis_segment_ids: [AIA-TEXT-A057-P025]
