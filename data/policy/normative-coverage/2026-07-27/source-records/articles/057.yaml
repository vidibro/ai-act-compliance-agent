- norm_id: AIA-NORM-A057-P1-ESTABLISH-NATIONAL-SANDBOX
  source: A057-P001
  quote: Member States shall ensure that their competent authorities establish at least one AI regulatory
    sandbox at national level, which shall be operational by 2 August 2027. That sandbox may also be established
    jointly with the competent authorities of other Member States.
  action: ensure at least one national AI regulatory sandbox is operational by 2 August 2027, individually
    or jointly
  actors:
