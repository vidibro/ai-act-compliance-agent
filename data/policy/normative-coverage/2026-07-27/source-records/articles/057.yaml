- norm_id: AIA-NORM-A057-P1-EQUIVALENT-PARTICIPATION
  source: A057-P002
  quote: The obligation under the first subparagraph may also be fulfilled by participating in an existing
    sandbox in so far as that participation provides an equivalent level of national coverage for the
    participating Member States.
  action: fulfil the national-sandbox obligation through participation providing equivalent national coverage
  subject_ref: member_state
  subject_category: member_state
  kind: permission
  conditions:
  - participation in the existing sandbox provides equivalent national coverage
