- norm_id: AIA-NORM-A057-P6-GUIDANCE-SUPERVISION-SUPPORT
  source: A057-P009
  quote: Competent authorities shall provide, as appropriate, guidance, supervision and support within
    the AI regulatory sandbox with a view to identifying risks, in particular to fundamental rights, health
    and safety, testing, mitigation measures, and their effectiveness in relation to the obligations and
    requirements of this Regulation and, where relevant, other Union and national law supervised within
    the sandbox.
  action: provide sandbox guidance, supervision, and support addressing risks, testing, mitigation, effectiveness,
    and applicable law
  actors:
  - actor_ref: national_competent_authority
    basis_segment_ids: [AIA-TEXT-A057-P009]
