- norm_id: AIA-NORM-A057-P5-CONTROLLED-SANDBOX-LIFECYCLE
  source: A057-P008
  quote: AI regulatory sandboxes established under this Article shall provide for a controlled environment
    that fosters innovation and facilitates the development, training, testing and validation of innovative
    AI systems for a limited time before their being placed on the market or put into service pursuant
    to a specific sandbox plan agreed between the providers or prospective providers and the competent
    authorities, ensuring that appropriate safeguards are in place.
  action: operate an innovation-fostering controlled environment for development, training, testing and
    validation under a specific agreed sandbox plan
  actors:
  - actor_ref: national_competent_authority
    basis_segment_ids: [AIA-TEXT-A057-P008]
  targets: []
  kind: obligation
  mandatory_content:
  - a controlled environment fostering innovation and facilitating development, training, testing and
    validation of innovative AI systems
  - a limited period before placing on the market or putting into service
  - a specific sandbox plan agreed between providers or prospective providers and competent authorities
  - appropriate safeguards
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
