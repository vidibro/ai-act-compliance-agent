- norm_id: AIA-NORM-A066-E-RECOMMENDATION-AND-OPINION-TOPICS
  source: A066-P006
  quote: 'at the request of the Commission or on its own initiative, issue recommendations and written
    opinions on any relevant matters related to the implementation of this Regulation and to its consistent
    and effective application, including:'
  action: issue recommendations and written opinions, at the Commission's request or on its own initiative,
    on any relevant matter related to the implementation and the consistent and effective application
    of this Regulation
  actors:
  - actor_ref: board
    basis_segment_ids: [AIA-TEXT-A066-P001]
  targets: []
  kind: power
  mandatory_content:
  - any relevant matters related to the implementation of this Regulation and to its consistent and effective
    application, including codes of conduct, codes of practice and Commission guidelines; the Article
    112 evaluation and review, Article 73 serious incident reports, the Article 71 EU database, preparation
    of delegated or implementing acts and possible alignments with the Annex I Union harmonisation legislation;
    technical specifications or existing standards for the Chapter III, Section 2 requirements; the use
    of Articles 40 and 41 harmonised standards or common specifications; trends such as European global
    competitiveness in AI, AI uptake in the Union and the development of digital skills; trends on the
    evolving typology of AI value chains and their accountability implications; and the potential need
    to amend Annex III under Article 7 or revise Article 5 under Article 112
  qualifier_spans:
  - A066-P001
  - A066-P007
  - A066-P008
  - A066-P009
  - A066-P010
  - A066-P011
  - A066-P012
  - A066-P013
