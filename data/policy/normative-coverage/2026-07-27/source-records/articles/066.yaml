records:
- norm_id: AIA-NORM-A066-BOARD-ADVICE-AND-ASSISTANCE-TASKS
  source: A066-P001
  quote: 'The Board shall advise and assist the Commission and the Member States in order to facilitate the consistent and effective application of this Regulation. To that end, the Board may in particular:'
  action: advise and assist the Commission and Member States through every enacted coordination expertise guidance cooperation and support task
  subject_ref: board
  subject_category: union_institution_or_body
  mandatory_content: [coordinate national authorities and agreed joint surveillance activity, collect and share expertise and best practices, advise on Regulation implementation and GPAI enforcement, harmonise national administrative practices, issue recommendations and written opinions, promote AI literacy and public understanding, develop common criteria shared concepts and benchmarks, cooperate with Union institutions bodies groups and networks, support third-country and international cooperation, develop implementation expertise and assess staff training needs, support sandbox establishment cooperation and information-sharing, advise on guidance documents, advise on international AI matters, opine on qualified GPAI alerts, receive Member State opinions and enforcement experience]
  qualifier_spans: [A066-P002, A066-P003, A066-P004, A066-P005, A066-P006, A066-P014, A066-P015, A066-P016, A066-P017, A066-P018, A066-P019, A066-P020, A066-P021, A066-P022, A066-P023]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A066-E-RECOMMENDATION-AND-OPINION-TOPICS
  source: A066-P006
  quote: 'at the request of the Commission or on its own initiative, issue recommendations and written opinions on any relevant matters related to the implementation of this Regulation and to its consistent and effective application, including:'
  action: issue requested or own-initiative recommendations and written opinions covering every enacted implementation topic
  subject_ref: board
  subject_category: union_institution_or_body
  kind: power
  mandatory_content: [codes of conduct codes of practice and Commission guidelines, Regulation evaluation review incidents database acts and Annex I alignment, Chapter III Section 2 technical specifications and standards, harmonised standards and common specifications, AI competitiveness uptake and skills trends, AI value-chain and accountability trends, possible Annex III and Article 5 amendment]
  qualifier_spans: [A066-P007, A066-P008, A066-P009, A066-P010, A066-P011, A066-P012, A066-P013]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
