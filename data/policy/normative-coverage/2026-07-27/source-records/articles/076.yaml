records:
- norm_id: AIA-NORM-A076-P1-SUPERVISION-POWERS
  source: A076-P001
  quote: Market surveillance authorities shall have competences and powers to ensure that testing in real
    world conditions is in accordance with this Regulation.
  action: exercise competences and powers to ensure real-world testing complies with this Regulation
  actors:
  - actor_ref: market_surveillance_authority
    category: public_authority
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P1A-ARTICLE-60A-SUBSTITUTIONS
  source: A076-P002
  quote: Where testing in real world conditions is based on Article 60a, any reference to a market surveillance
    authority in this Article shall be construed as a reference to the national competent authority or
    appropriate authority under the Union harmonisation legislation listed in Section B of Annex I, and
    references to Article 60 shall be construed as references to Article 60a, as appropriate.
  action: substitute the competent sectoral authority and Article 60a for Article 76 references in Article
    60a testing
  actors:
  - actor_ref: authority_applying_article_76
    category: public_authority
  targets: []
  kind: applicability
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P2-VERIFY-SANDBOX-TESTING
  source: A076-P003
  quote: Where testing in real world conditions is conducted for AI systems that are supervised within
    an AI regulatory sandbox under Article 58, the market surveillance authorities shall verify the compliance
    with Article 60 as part of their supervisory role for the AI regulatory sandbox.
  action: verify Article 60 compliance when supervising sandbox real-world testing
  actors:
  - actor_ref: market_surveillance_authority
    category: public_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - real-world testing is supervised by the market-surveillance authority within an Article 58 AI regulatory
    sandbox
- norm_id: AIA-NORM-A076-P2-ALLOW-DEROGATION
  source: A076-P003
  quote: Those authorities may, as appropriate, allow the testing in real world conditions to be conducted
    by the provider or prospective provider, in derogation from the conditions set out in Article 60(4),
    points (f) and (g).
  action: allow provider-conducted sandbox testing under an appropriate Article 60(4)(f) and (g) derogation
  actors:
  - actor_ref: market_surveillance_authority
    category: public_authority
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P3-INTERVENE-IN-TESTING
  source: A076-P004
  quote: it may take either of the following decisions on its territory, as appropriate
  action: suspend terminate or require modification of real-world testing after a serious incident or
    suspected Articles 60 or 61 breach
  actors:
  - actor_ref: market_surveillance_authority
    category: public_authority
  targets: []
  kind: power
  mandatory_content:
  - suspend or terminate testing
  - require providers and deployers including prospective ones to modify any aspect of testing
  qualifier_spans:
  - A076-P005
  - A076-P006
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P4-GIVE-GROUNDS-AND-CHALLENGE-ROUTE
  source: A076-P007
  quote: Where a market surveillance authority has taken a decision referred to in paragraph 3 of this
    Article, or has issued an objection within the meaning of Article 60(4), point (b), the decision or
    the objection shall indicate the grounds therefor and how the provider or prospective provider can
    challenge the decision or objection.
  action: state grounds and the provider's challenge route in a paragraph 3 decision or Article 60(4)(b)
    objection
  actors:
  - actor_ref: market_surveillance_authority
    category: public_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the authority has taken an Article 76(3) decision or issued an Article 60(4)(b) objection
- norm_id: AIA-NORM-A076-P5-COMMUNICATE-GROUNDS
  source: A076-P008
  quote: Where applicable, where a market surveillance authority has taken a decision referred to in paragraph
    3, it shall communicate the grounds therefor to the market surveillance authorities of other Member
    States in which the AI system has been tested in accordance with the testing plan.
  action: communicate intervention grounds to authorities in other Member States where planned testing
    occurred
  actors:
  - actor_ref: market_surveillance_authority
    category: public_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - where applicable, the authority has taken an Article 76(3) decision
