records:
- norm_id: AIA-NORM-A076-P1-SUPERVISION-POWERS
  source: A076-P001
  quote: Market surveillance authorities shall have competences and powers to ensure that testing in real world conditions is in accordance with this Regulation.
  action: exercise competences and powers to ensure real-world testing complies with this Regulation
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P1A-ARTICLE-60A-SUBSTITUTIONS
  source: A076-P002
  quote: Where testing in real world conditions is based on Article 60a, any reference to a market surveillance authority in this Article shall be construed as a reference to the national competent authority or appropriate authority under the Union harmonisation legislation listed in Section B of Annex I, and references to Article 60 shall be construed as references to Article 60a, as appropriate.
  action: substitute the competent sectoral authority and Article 60a for Article 76 references in Article 60a testing
  subject_ref: authority_applying_article_76
  subject_category: public_authority
  kind: applicability
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P2-VERIFY-SANDBOX-TESTING
  source: A076-P003
  quote: the market surveillance authorities shall verify the compliance with Article 60 as part of their supervisory role for the AI regulatory sandbox
  action: verify Article 60 compliance when supervising sandbox real-world testing
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P2-ALLOW-DEROGATION
  source: A076-P003
  quote: Those authorities may, as appropriate, allow the testing in real world conditions to be conducted by the provider or prospective provider, in derogation from the conditions set out in Article 60(4), points (f) and (g).
  action: allow provider-conducted sandbox testing under an appropriate Article 60(4)(f) and (g) derogation
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P3-INTERVENE-IN-TESTING
  source: A076-P004
  quote: it may take either of the following decisions on its territory, as appropriate
  action: suspend terminate or require modification of real-world testing after a serious incident or suspected Articles 60 or 61 breach
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  kind: power
  mandatory_content: [suspend or terminate testing, require providers and deployers including prospective ones to modify any aspect of testing]
  qualifier_spans: [A076-P005, A076-P006]
