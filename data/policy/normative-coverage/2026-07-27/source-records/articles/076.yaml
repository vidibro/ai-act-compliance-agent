  verification_mode: not_reported
- norm_id: AIA-NORM-A076-P4-GIVE-GROUNDS-AND-CHALLENGE-ROUTE
  source: A076-P007
  quote: the decision or the objection shall indicate the grounds therefor and how the provider or prospective provider can challenge the decision or objection.
  action: state grounds and the provider's challenge route in a paragraph 3 decision or Article 60(4)(b) objection
  subject_ref: market_surveillance_authority
  subject_category: public_authority
