- norm_id: AIA-NORM-A076-P5-COMMUNICATE-GROUNDS
  source: A076-P008
  quote: it shall communicate the grounds therefor to the market surveillance authorities of other Member States in which the AI system has been tested in accordance with the testing plan.
  action: communicate intervention grounds to authorities in other Member States where planned testing occurred
