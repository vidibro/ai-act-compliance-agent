- norm_id: AIA-NORM-A036-P7-C-CORRECT-UNDUE-CERTIFICATES
  source: A036-P011
  quote: require the notified body to suspend or withdraw, within a reasonable period of time determined
    by the authority, any certificates which were unduly issued, in order to ensure the continuing conformity
    of high-risk AI systems on the market
  action: require suspension or withdrawal of unduly issued certificates within a reasonable authority-set
    period
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A036-P008
  conditions:
  - the notified body's designation has been restricted, suspended or withdrawn
- norm_id: AIA-NORM-A036-P7-D-INFORM-CERTIFICATE-MEASURES
  source: A036-P012
  quote: inform the Commission and the Member States about certificates the suspension or withdrawal of
    which it has required
  action: inform the Commission and Member States which certificates were required to be suspended or
    withdrawn
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A036-P008
  conditions:
  - the notified body's designation has been restricted, suspended or withdrawn
- norm_id: AIA-NORM-A036-P7-E-PROVIDE-CERTIFICATE-INFORMATION
  source: A036-P013
  quote: provide the national competent authorities of the Member State in which the provider has its
    registered place of business with all relevant information about the certificates of which it has
    required the suspension or withdrawal
  action: provide the provider's establishment-state authorities all relevant information on certificates
    required to be suspended or withdrawn
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A036-P008
  conditions:
  - the notified body's designation has been restricted, suspended or withdrawn
- norm_id: AIA-NORM-A036-P7-E-MITIGATE-RISK
  source: A036-P013
  quote: that authority shall take the appropriate measures, where necessary, to avoid a potential risk
    to health, safety or fundamental rights.
  action: take necessary appropriate measures to avoid potential health, safety, or fundamental-rights
    risk
  subject_ref: national_competent_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A036-P008
  conditions:
  - the notified body's designation has been restricted, suspended or withdrawn
  - appropriate measures are necessary to avoid a potential risk to health, safety or fundamental rights
- norm_id: AIA-NORM-A036-P8-SUSPENSION-CERTIFICATE-VALIDITY
  source: A036-P014
  quote: With the exception of certificates unduly issued, and where a designation has been suspended
    or restricted, the certificates shall remain valid in one of the following circumstances
  action: preserve non-unduly-issued certificate validity during suspension or restriction when either
    enacted condition set is satisfied
  subject_ref: affected_certificates
  subject_category: other
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: Defines certificate validity rather than an operator compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_reported
  qualifier_spans:
  - A036-P015
  - A036-P016
  conditions:
  - the notified body's designation has been suspended or restricted
  - operator: any_of
    operands:
    - operator: all_of
      operands:
      - the notifying authority confirms within one month that affected certificates pose no health, safety
        or fundamental-rights risk
      - the notifying authority provides a timeline for actions to remedy the suspension or restriction
    - operator: all_of
      operands:
      - the notifying authority confirms no certificates relevant to the suspension will be issued, amended
        or reissued during the suspension or restriction
      - the notifying authority states whether the notified body can continue to monitor and remain responsible
        for existing certificates during the suspension or restriction
  exceptions:
  - certificates that were unduly issued
- norm_id: AIA-NORM-A036-P8-B-PROVIDER-REPLACEMENT-CONFIRMATION
  source: A036-P016
  quote: in the event that the notifying authority determines that the notified body does not have the
    capability to support existing certificates issued, the provider of the system covered by the certificate
    shall confirm in writing to the national competent authorities of the Member State in which it has
    its registered place of business, within three months of the suspension or restriction, that another
    qualified notified body is temporarily assuming the functions of the notified body to monitor and
    remain responsible for the certificates during the period of suspension or restriction.
  action: confirm in writing within three months that a qualified replacement body temporarily assumes
    certificate monitoring and responsibility
  subject_ref: provider
  subject_category: supported_operator
  implementation_mode: missing
  verification_mode: reported_conditionally
  conditions:
  - the notifying authority determines the original notified body cannot support existing certificates
  verified_by: vidibro
- norm_id: AIA-NORM-A036-P9-WITHDRAWAL-CERTIFICATE-VALIDITY
  source: A036-P017
  quote: With the exception of certificates unduly issued, and where a designation has been withdrawn,
    the certificates shall remain valid for a period of nine months under the following circumstances
  action: preserve non-unduly-issued certificate validity for nine months after withdrawal when both enacted
    conditions are satisfied
  subject_ref: affected_certificates
  subject_category: other
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: Defines certificate validity rather than an operator compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_reported
  qualifier_spans:
  - A036-P018
  - A036-P019
  conditions:
  - the provider's establishment-state authority confirms no associated health, safety, or fundamental-rights
    risk
  - another notified body accepts immediate responsibility in writing and completes assessment within
    12 months of withdrawal
- norm_id: AIA-NORM-A036-P9-EXTEND-PROVISIONAL-VALIDITY
  source: A036-P020
  quote: In the circumstances referred to in the first subparagraph, the national competent authority
    of the Member State in which the provider of the system covered by the certificate has its place of
    business may extend the provisional validity of the certificates for additional periods of three months,
    which shall not exceed 12 months in total.
  action: extend provisional certificate validity in three-month periods up to a total of 12 months
  subject_ref: national_competent_authority
  subject_category: public_authority
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A036-P9-INFORM-STAKEHOLDERS
  source: A036-P021
  quote: The national competent authority or the notified body assuming the functions of the notified
    body affected by the change of designation shall immediately inform the Commission, the other Member
    States and the other notified bodies thereof.
  action: immediately inform the Commission, other Member States, and other notified bodies of the replacement
    arrangement
  subject_ref: competent_authority_or_assuming_notified_body
  subject_category: other
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for these addressees.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
