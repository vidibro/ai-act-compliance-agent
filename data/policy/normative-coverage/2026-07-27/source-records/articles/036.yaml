records:
- norm_id: AIA-NORM-A036-P1-NOTIFY-CHANGES
  source: A036-P001
  quote: The notifying authority shall notify the Commission and the other Member States of any relevant
    changes to the notification of a notified body via the electronic notification tool referred to in
    Article 30(2).
  action: notify the Commission and other Member States of relevant notification changes through the Article
    30(2) tool
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A036-P2-EXTENSION-PROCEDURES
  source: A036-P002
  quote: The procedures laid down in Articles 29 and 30 shall apply to extensions of the scope of the
    notification.
  action: apply the Articles 29 and 30 procedures to notification-scope extensions
  subject_ref: notifying_authority
  subject_category: public_authority
  kind: applicability
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A036-P2-OTHER-CHANGE-PROCEDURES
  source: A036-P003
  quote: For changes to the notification other than extensions of its scope, the procedures laid down
    in paragraphs (3) to (9) shall apply.
  action: apply paragraphs 3 to 9 to notification changes other than scope extensions
  subject_ref: notifying_authority
  subject_category: public_authority
  kind: applicability
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A036-P3-CEASING-BODY-NOTICE
  source: A036-P004
  quote: Where a notified body decides to cease its conformity assessment activities, it shall inform
    the notifying authority and the providers concerned as soon as possible and, in the case of a planned
    cessation, at least one year before ceasing its activities.
  action: inform the notifying authority and affected providers of cessation as soon as possible and at
    least one year ahead when planned
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the notified body decides to cease conformity-assessment activities
- norm_id: AIA-NORM-A036-P3-NINE-MONTH-CERTIFICATE-VALIDITY
  source: A036-P004
  quote: "The certificates of the notified body may remain valid for a period of nine months after cessation\
    \ of the notified body\u2019s activities, on condition that another notified body has confirmed in\
    \ writing that it will assume responsibilities for the high-risk AI systems covered by those certificates."
  action: preserve certificate validity for up to nine months after cessation when a replacement notified
    body accepts responsibility in writing
  subject_ref: affected_certificates
  subject_category: other
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: Defines certificate validity rather than an operator compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_reported
  conditions:
  - another notified body confirms in writing that it assumes responsibility for the covered systems
- norm_id: AIA-NORM-A036-P3-REPLACEMENT-ASSESSMENT
  source: A036-P004
  quote: The latter notified body shall complete a full assessment of the high-risk AI systems affected
    by the end of that nine-month-period before issuing new certificates for those systems.
  action: complete a full assessment within nine months before issuing replacement certificates
  subject_ref: assuming_notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A036-P3-WITHDRAW-DESIGNATION
  source: A036-P004
  quote: Where the notified body has ceased its activity, the notifying authority shall withdraw the designation.
  action: withdraw the designation when the notified body has ceased activity
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the notified body has ceased its activity
- norm_id: AIA-NORM-A036-P4-INVESTIGATE-FAILURE
  source: A036-P005
  quote: Where a notifying authority has sufficient reason to consider that a notified body no longer
    meets the requirements laid down in Article 31, or that it is failing to fulfil its obligations, the
    notifying authority shall without delay investigate the matter with the utmost diligence.
  action: investigate suspected Article 31 noncompliance or failure of obligations without delay and with
    utmost diligence
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the notifying authority has sufficient reason to consider that the notified body no longer meets Article
    31 requirements or is failing to fulfil its obligations
- norm_id: AIA-NORM-A036-P4-INFORM-OBJECTIONS
  source: A036-P005
  quote: In that context, it shall inform the notified body concerned about the objections raised and
    give it the possibility to make its views known.
  action: inform the notified body of the objections raised
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the objections arise in the notifying authority's investigation of the notified body
- norm_id: AIA-NORM-A036-P4-OPPORTUNITY-TO-RESPOND
  source: A036-P005
  quote: In that context, it shall inform the notified body concerned about the objections raised and
    give it the possibility to make its views known.
  action: receive an opportunity to make its views on the objections known
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  kind: entitlement
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the objections arise in the notifying authority's investigation of the notified body
- norm_id: AIA-NORM-A036-P4-CORRECT-DESIGNATION
  source: A036-P005
  quote: If the notifying authority comes to the conclusion that the notified body no longer meets the
    requirements laid down in Article 31 or that it is failing to fulfil its obligations, it shall restrict,
    suspend or withdraw the designation as appropriate, depending on the seriousness of the failure to
    meet those requirements or fulfil those obligations.
  action: restrict, suspend, or withdraw the designation proportionately to the seriousness of confirmed
    failure
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the notifying authority concludes that the notified body no longer meets Article 31 requirements or
    is failing to fulfil its obligations
- norm_id: AIA-NORM-A036-P4-INFORM-COMMISSION-AND-STATES
  source: A036-P005
  quote: It shall immediately inform the Commission and the other Member States accordingly.
  action: immediately inform the Commission and other Member States of the designation measure
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the notifying authority has restricted, suspended or withdrawn the notified body's designation
- norm_id: AIA-NORM-A036-P5-INFORM-PROVIDERS
  source: A036-P006
  quote: Where its designation has been suspended, restricted, or fully or partially withdrawn, the notified
    body shall inform the providers concerned within 10 days.
  action: inform affected providers within 10 days of restriction, suspension, or withdrawal of designation
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the notified body's designation has been suspended, restricted, or fully or partially withdrawn
- norm_id: AIA-NORM-A036-P6-PRESERVE-FILES
  source: A036-P007
  quote: the notifying authority shall take appropriate steps to ensure that the files of the notified
    body concerned are kept, and to make them available to notifying authorities in other Member States
    and to market surveillance authorities at their request.
  action: take appropriate steps to preserve the affected notified body's files and make them available
    on request to other Member States' notifying authorities and market-surveillance authorities
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the notified body's designation has been restricted, suspended or withdrawn
  mandatory_content:
  - ensure that the affected notified body's files are kept
  - make the files available when requested by another Member State's notifying authority or a market-surveillance
    authority
- norm_id: AIA-NORM-A036-P7-A-ASSESS-CERTIFICATE-IMPACT
  source: A036-P009
  quote: assess the impact on the certificates issued by the notified body
  action: assess the impact of the designation change on certificates issued by the notified body
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A036-P008
  conditions:
  - the notified body's designation has been restricted, suspended or withdrawn
- norm_id: AIA-NORM-A036-P7-B-REPORT-FINDINGS
  source: A036-P010
  quote: submit a report on its findings to the Commission and the other Member States within three months
    of having notified the changes to the designation
  action: report findings to the Commission and other Member States within three months of notifying the
    designation change
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
