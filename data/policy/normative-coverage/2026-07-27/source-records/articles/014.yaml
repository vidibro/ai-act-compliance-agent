records:
- norm_id: AIA-NORM-A014-P1-EFFECTIVE-OVERSIGHT
  source: A014-P001
  quote: High-risk AI systems shall be designed and developed in such a way, including with appropriate
    human-machine interface tools, that they can be effectively overseen by natural persons during the
    period in which they are in use.
  action: design and develop the high-risk AI system, including appropriate human-machine interfaces,
    for effective natural-person oversight throughout use
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs: &id001
  - AIA-RULE-HR-A14
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P2-RISK-PREVENTION
  source: A014-P002
  quote: Human oversight shall aim to prevent or minimise the risks to health, safety or fundamental rights
    that may emerge when a high-risk AI system is used in accordance with its intended purpose or under
    conditions of reasonably foreseeable misuse, in particular where such risks persist despite the application
    of other requirements set out in this Section.
  action: design human oversight to prevent or minimise health, safety, and fundamental-rights risks that
    emerge when the system is used for its intended purpose or under reasonably foreseeable misuse, including risks that persist despite other Section 2 requirements
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P3-COMMENSURATE-MEASURES
  source: A014-P003
  quote: The oversight measures shall be commensurate with the risks, level of autonomy and context of
    use of the high-risk AI system, and shall be ensured through either one or both of the following types
    of measures
  action: make human-oversight measures commensurate with the system's risks, autonomy and context of
    use and ensure them through either or both Article 14(3) measure routes
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  qualifier_spans:
  - A014-P004
  - A014-P005
  mandatory_content:
  - make the oversight measures commensurate with the system's risks, autonomy and context of use
  - ensure oversight through either or both types of measures specified in Article 14(3)
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P4-A-UNDERSTAND-AND-MONITOR
  source: A014-P007
  quote: to properly understand the relevant capacities and limitations of the high-risk AI system and
    be able to duly monitor its operation, including in view of detecting and addressing anomalies, dysfunctions
    and unexpected performance
  action: "enable assigned overseers to understand the system\u2019s relevant capabilities and limitations,
    monitor its operation, and detect and address anomalies, dysfunctions, and unexpected performance"
  actors:
  - actor_ref: provider
  targets: []
  qualifier_spans: &id002
  - A014-P006
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P4-B-AUTOMATION-BIAS
  source: A014-P008
  quote: to remain aware of the possible tendency of automatically relying or over-relying on the output
    produced by a high-risk AI system (automation bias), in particular for high-risk AI systems used to
    provide information or recommendations for decisions to be taken by natural persons
  action: enable assigned overseers to remain aware of possible automation bias, especially where system
    information or recommendations inform human decisions
  actors:
  - actor_ref: provider
  targets: []
  qualifier_spans: *id002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P4-C-INTERPRET-OUTPUT
  source: A014-P009
  quote: "to correctly interpret the high-risk AI system\u2019s output, taking into account, for example,\
    \ the interpretation tools and methods available"
  action: enable assigned overseers to correctly interpret system outputs using available interpretation
    tools and methods
  actors:
  - actor_ref: provider
  targets: []
  qualifier_spans: *id002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P4-D-DECLINE-USE-OR-CONTROL-OUTPUT
  source: A014-P010
  quote: to decide, in any particular situation, not to use the high-risk AI system or to otherwise disregard,
    override or reverse the output of the high-risk AI system
  action: enable assigned overseers to decide not to use the system in a particular situation or otherwise
    disregard, override, or reverse its output
  actors:
  - actor_ref: provider
  targets: []
  qualifier_spans: *id002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P4-E-INTERVENE-OR-SAFE-STOP
  source: A014-P011
  quote: "to intervene in the operation of the high-risk AI system or interrupt the system through a \u2018\
    stop\u2019 button or a similar procedure that allows the system to come to a halt in a safe state"
  action: enable assigned overseers to intervene in system operation or interrupt it through a stop control
    or similar procedure that brings it to a safe halt
  actors:
  - actor_ref: provider
  targets: []
  qualifier_spans: *id002
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P5-TWO-PERSON-VERIFICATION
  source: A014-P012
  quote: For high-risk AI systems referred to in point 1(a) of Annex III, the measures referred to in
    paragraph 3 of this Article shall be such as to ensure that, in addition, no action or decision is
    taken by the deployer on the basis of the identification resulting from the system unless that identification
    has been separately verified and confirmed by at least two natural persons with the necessary competence,
    training and authority.
  action: ensure no deployer action or decision relies on a system identification unless at least two
    competent, trained, and authorised natural persons separately verify and confirm it
  actors:
  - actor_ref: provider
  targets: []
  conditions:
  - the high-risk AI system is a remote biometric identification system referred to in Annex III, point
    1(a)
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A014-P5-DISPROPORTIONATE-EXCEPTION
  source: A014-P013
  quote: The requirement for a separate verification by at least two natural persons shall not apply to
    high-risk AI systems used for the purposes of law enforcement, migration, border control or asylum,
    where Union or national law considers the application of this requirement to be disproportionate.
  action: disapply the two-person verification requirement for specified public-authority uses where Union
    or national law considers it disproportionate
  actors:
  - actor_ref: provider
  targets: []
  kind: applicability
  conditions:
  - the high-risk AI system is used for law enforcement, migration, border control, or asylum
  - Union or national law considers two-person verification disproportionate for that use
  implementation_mode: report_only
  implementation_refs: *id001
  verification_mode: reported_conditionally
  verified_by: vidibro
