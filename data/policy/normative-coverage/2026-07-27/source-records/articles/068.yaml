records:
- norm_id: AIA-NORM-A068-P1-ESTABLISH-SCIENTIFIC-PANEL
  source: A068-P001
  quote: The Commission shall, by means of an implementing act, make provisions on the establishment of
    a scientific panel of independent experts (the ‘ scientific panel ’) intended to support the enforcement
    activities under this Regulation. That implementing act shall be adopted in accordance with the examination
    procedure referred to in Article 98(2).
  action: provide for an independent scientific panel by implementing act under the Article 98(2) examination
    procedure
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A068-P001]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-VII
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A068-P2-SELECT-QUALIFIED-INDEPENDENT-EXPERTS
  source: A068-P002
  quote: 'The scientific panel shall consist of experts selected by the Commission on the basis of up-to-date
    scientific or technical expertise in the field of AI necessary for the tasks set out in paragraph
    3, and shall be able to demonstrate meeting all of the following conditions:'
  action: select panel experts with current task-relevant AI expertise who satisfy every enacted competence
    independence and performance condition
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A068-P002]
  targets: []
  mandatory_content:
  - particular AI expertise and competence
  - independence from AI-system and GPAI-model providers
  - diligent accurate and objective performance ability
  qualifier_spans:
