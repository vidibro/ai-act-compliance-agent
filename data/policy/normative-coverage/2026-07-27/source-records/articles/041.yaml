records:
- norm_id: AIA-NORM-A041-P1-ADOPT-COMMON-SPECIFICATIONS
  source: A041-P001
  quote: The Commission may adopt, implementing acts establishing common specifications for the requirements
    set out in Section 2 of this Chapter or, as applicable, for the obligations set out in Sections 2
    and 3 of Chapter V where the following conditions have been fulfilled
  action: adopt implementing acts establishing common specifications when the enacted standardisation
    conditions are fulfilled
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
  qualifier_spans:
  - A041-P002
  - A041-P003
  - A041-P004
  - A041-P005
  - A041-P006
  - A041-P007
  conditions:
  - the Commission requested a relevant harmonised standard and the request was unaccepted, late, insufficient
    on fundamental-rights concerns, or not complied with
  - no covering harmonised-standard reference has been published or is expected within a reasonable period
- norm_id: AIA-NORM-A041-P1-CONSULT-ADVISORY-FORUM
  source: A041-P008
  quote: When drafting the common specifications, the Commission shall consult the advisory forum referred
    to in Article 67.
  action: consult the Article 67 advisory forum when drafting common specifications
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A041-P1-EXAMINATION-PROCEDURE
  source: A041-P009
  quote: The implementing acts referred to in the first subparagraph of this paragraph shall be adopted
    in accordance with the examination procedure referred to in Article 98(2).
  action: adopt common-specification implementing acts under the Article 98(2) examination procedure
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
