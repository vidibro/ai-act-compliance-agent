records:
- norm_id: AIA-NORM-A041-P1-ADOPT-COMMON-SPECIFICATIONS
  source: A041-P001
  quote: The Commission may adopt, implementing acts establishing common specifications for the requirements
    set out in Section 2 of this Chapter or, as applicable, for the obligations set out in Sections 2
    and 3 of Chapter V where the following conditions have been fulfilled
  action: adopt implementing acts establishing common specifications when the enacted standardisation
    conditions are fulfilled
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A041-P001]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A041-P002
  - A041-P003
  - A041-P004
  - A041-P005
  - A041-P006
  - A041-P007
  conditions:
    operator: all_of
    operands:
    - text: the Commission has requested, pursuant to Article 10(1) of Regulation (EU) No 1025/2012, one or more European standardisation organisations to draft a harmonised standard for the requirements set out in Section 2 of this Chapter, or, as applicable, for the obligations set out in Sections 2 and 3 of Chapter V
      basis_segment_ids: [AIA-TEXT-A041-P002]
    - operator: any_of
      operands:
      - text: the request has not been accepted by any of the European standardisation organisations
        basis_segment_ids: [AIA-TEXT-A041-P003]
      - text: the harmonised standards addressing that request are not delivered within the deadline set in accordance with Article 10(1) of Regulation (EU) No 1025/2012
        basis_segment_ids: [AIA-TEXT-A041-P004]
      - text: the relevant harmonised standards insufficiently address fundamental rights concerns
        basis_segment_ids: [AIA-TEXT-A041-P005]
      - text: the harmonised standards do not comply with the request
        basis_segment_ids: [AIA-TEXT-A041-P006]
    - text: no reference to harmonised standards covering the requirements referred to in Section 2 of this Chapter or, as applicable, the obligations referred to in Sections 2 and 3 of Chapter V has been published in the Official Journal of the European Union in accordance with Regulation (EU) No 1025/2012
      basis_segment_ids: [AIA-TEXT-A041-P007]
    - text: no such reference is expected to be published within a reasonable period
      basis_segment_ids: [AIA-TEXT-A041-P007]
