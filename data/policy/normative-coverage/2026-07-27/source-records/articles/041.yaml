  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A041-P2-INFORM-STANDARDISATION-COMMITTEE
  source: A041-P010
  quote: Before preparing a draft implementing act, the Commission shall inform the committee referred
    to in Article 22 of Regulation (EU) No 1025/2012 that it considers the conditions laid down in paragraph
    1 of this Article to be fulfilled.
  action: inform the Article 22 standardisation committee that paragraph 1 conditions are fulfilled before
    drafting the act
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A041-P3-COMMON-SPECIFICATION-PRESUMPTION
  source: A041-P011
  quote: High-risk AI systems or general-purpose AI models which are in conformity with the common specifications
    referred to in paragraph 1, or parts of those specifications, shall be presumed to be in conformity
    with the requirements set out in Section 2 of this Chapter or, as applicable, to comply with the obligations
    referred to in Sections 2 and 3 of Chapter V, to the extent those common specifications cover those
    requirements or those obligations.
  action: presume covered Chapter III Section 2 or Chapter V Sections 2 and 3 conformity from compliance
    with common specifications
  subject_ref: high_risk_ai_system_or_general_purpose_ai_model
  subject_category: other
  kind: legal_consequence
  implementation_mode: missing
  verification_mode: unresolved
  conditions:
  - the system or model conforms to the relevant common specification or part
  - the common specification covers the relevant requirement or obligation
- norm_id: AIA-NORM-A041-P4-ASSESS-HARMONISED-STANDARD
  source: A041-P012
  quote: Where a harmonised standard is adopted by a European standardisation organisation and proposed
    to the Commission for the publication of its reference in the Official Journal of the European Union,
    the Commission shall assess the harmonised standard in accordance with Regulation (EU) No 1025/2012.
  action: assess a proposed harmonised standard under Regulation 1025/2012 before reference publication
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A041-P4-REPEAL-OVERLAPPING-SPECIFICATION
  source: A041-P012
  quote: When reference to a harmonised standard is published in the Official Journal of the European
    Union, the Commission shall repeal the implementing acts referred to in paragraph 1, or parts thereof
    which cover the same requirements set out in Section 2 of this Chapter or, as applicable, the same
    obligations set out in Sections 2 and 3 of Chapter V.
  action: repeal common-specification acts or parts overlapping a published harmonised standard
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A041-P5-JUSTIFY-EQUIVALENT-SOLUTIONS
  source: A041-P013
  quote: Where providers of high-risk AI systems or general-purpose AI models do not comply with the common
    specifications referred to in paragraph 1, they shall duly justify that they have adopted technical
    solutions that meet the requirements referred to in Section 2 of this Chapter or, as applicable, comply
    with the obligations set out in Sections 2 and 3 of Chapter V to a level at least equivalent thereto.
  action: duly justify technical solutions providing at least equivalent compliance when common specifications
    are not followed
  subject_ref: provider
  subject_category: supported_operator
  implementation_mode: missing
  verification_mode: unresolved
  conditions:
  - the provider does not comply with the paragraph 1 common specifications
- norm_id: AIA-NORM-A041-P6-MEMBER-STATE-NOTICE
  source: A041-P014
  quote: Where a Member State considers that a common specification does not entirely meet the requirements
    set out in Section 2 or, as applicable, comply with obligations set out in Sections 2 and 3 of Chapter
    V, it shall inform the Commission thereof with a detailed explanation.
  action: inform the Commission with a detailed explanation of deficiencies in a common specification
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A041-P6-ASSESS-DEFICIENCY-INFORMATION
  source: A041-P014
  quote: The Commission shall assess that information and, if appropriate, amend the implementing act
    establishing the common specification concerned.
  action: assess Member-State information about a deficient common specification
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A041-P6-AMEND-COMMON-SPECIFICATION
  source: A041-P014
  quote: The Commission shall assess that information and, if appropriate, amend the implementing act
    establishing the common specification concerned.
  action: amend the common-specification implementing act where appropriate after assessment
