- norm_id: AIA-NORM-A041-P2-INFORM-STANDARDISATION-COMMITTEE
  source: A041-P010
  quote: Before preparing a draft implementing act, the Commission shall inform the committee referred
    to in Article 22 of Regulation (EU) No 1025/2012 that it considers the conditions laid down in paragraph
    1 of this Article to be fulfilled.
  action: inform the Article 22 standardisation committee that paragraph 1 conditions are fulfilled before
    drafting the act
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
