records:
- norm_id: AIA-NORM-A041-P1-ADOPT-COMMON-SPECIFICATIONS
  source: A041-P001
  quote: The Commission may adopt, implementing acts establishing common specifications for the requirements
    set out in Section 2 of this Chapter or, as applicable, for the obligations set out in Sections 2
    and 3 of Chapter V where the following conditions have been fulfilled
  action: adopt implementing acts establishing common specifications when the enacted standardisation
    conditions are fulfilled
  actors:
  - actor_ref: commission
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  qualifier_spans:
  - A041-P002
  - A041-P003
  - A041-P004
  - A041-P005
  - A041-P006
  - A041-P007
  conditions:
  - operator: all_of
    operands:
    - the Commission has requested one or more European standardisation organisations, pursuant to Article
      10(1) of Regulation (EU) No 1025/2012, to draft a harmonised standard for Chapter III Section 2
      requirements or, as applicable, Chapter V Sections 2 and 3 obligations
    - operator: any_of
      operands:
      - the request has not been accepted by any of the European standardisation organisations
      - the harmonised standards addressing the request are not delivered within the deadline set in accordance
        with Article 10(1) of Regulation (EU) No 1025/2012
      - the relevant harmonised standards insufficiently address fundamental rights concerns
      - the harmonised standards do not comply with the request
    - no reference to harmonised standards covering those requirements or obligations has been published
      in the Official Journal of the European Union in accordance with Regulation (EU) No 1025/2012
    - no such reference is expected to be published within a reasonable period
- norm_id: AIA-NORM-A041-P1-CONSULT-ADVISORY-FORUM
  source: A041-P008
  quote: When drafting the common specifications, the Commission shall consult the advisory forum referred
