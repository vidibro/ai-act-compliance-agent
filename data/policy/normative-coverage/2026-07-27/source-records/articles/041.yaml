- norm_id: AIA-NORM-A041-P3-COMMON-SPECIFICATION-PRESUMPTION
  source: A041-P011
  quote: High-risk AI systems or general-purpose AI models which are in conformity with the common specifications
    referred to in paragraph 1, or parts of those specifications, shall be presumed to be in conformity
    with the requirements set out in Section 2 of this Chapter or, as applicable, to comply with the obligations
    referred to in Sections 2 and 3 of Chapter V, to the extent those common specifications cover those
    requirements or those obligations.
  action: presume covered Chapter III Section 2 or Chapter V Sections 2 and 3 conformity from compliance
    with common specifications
  actors: none
  targets:
  - target_ref: High-risk AI systems or general-purpose AI models
    basis_segment_ids: [AIA-TEXT-A041-P011]
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-HR-A09
  - AIA-RULE-HR-A10
  - AIA-RULE-HR-A11
  - AIA-RULE-HR-A11-2
  - AIA-RULE-HR-A12
  - AIA-RULE-HR-A12-3A
  - AIA-RULE-HR-A12-3B
  - AIA-RULE-HR-A12-3C
  - AIA-RULE-HR-A12-3D
  - AIA-RULE-HR-A13
  - AIA-RULE-HR-A13-3
  - AIA-RULE-HR-A14
  - AIA-RULE-HR-A15
  implementation_reason: Reported alongside the Chapter III Section 2 requirement rules, which are the
    rules that record this route. Article 41(3) also presumes conformity with the Chapter V Sections 2
    and 3 obligations, and no rule carries that limb yet.
  verification_mode: reported_conditionally
  conditions:
    operator: all_of
    operands:
