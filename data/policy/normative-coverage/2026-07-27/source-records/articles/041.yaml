      basis_segment_ids: [AIA-TEXT-A041-P011]
    - text: to the extent those common specifications cover those requirements or those obligations
      basis_segment_ids: [AIA-TEXT-A041-P011]
  verified_by: vidibro
- norm_id: AIA-NORM-A041-P4-ASSESS-HARMONISED-STANDARD
