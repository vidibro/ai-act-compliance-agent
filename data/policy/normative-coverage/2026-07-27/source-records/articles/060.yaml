    and without having to provide any justification, and request immediate and permanent deletion of the
    subject's personal data
  actors:
  - actor_ref: testing_subject
    basis_segment_ids: [AIA-TEXT-A060-P018]
  - actor_ref: legal_representative
    basis_segment_ids: [AIA-TEXT-A060-P018]
