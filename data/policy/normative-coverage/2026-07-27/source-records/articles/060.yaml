        basis_segment_ids: [AIA-TEXT-A060-P009]
      - text: has registered the testing in real world conditions in accordance with Article 71(4) with a Union-wide unique single identification number and with the information specified in Annex IX
        basis_segment_ids: [AIA-TEXT-A060-P009]
    - operator: all_of
      operands:
      - text: the provider or prospective provider of high-risk AI systems referred to in points 1, 6 and 7 of Annex III in the areas of law enforcement, migration, asylum and border control management
        basis_segment_ids: [AIA-TEXT-A060-P009]
      - text: has registered the testing in real-world conditions in the secure non-public section of the EU database according to Article 49(4), point (d), with a Union-wide unique single identification number and with the information specified therein
        basis_segment_ids: [AIA-TEXT-A060-P009]
    - operator: all_of
