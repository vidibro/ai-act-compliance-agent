      basis_segment_ids: [AIA-TEXT-A060-P008]
    - text: where the market surveillance authority has not provided an answer within 30 days
      basis_segment_ids: [AIA-TEXT-A060-P008]
  temporal_regime_id: AIA-TEMP-A060-P4-B-TACIT-APPROVAL
