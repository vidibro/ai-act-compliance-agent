  verified_by: vidibro
- norm_id: AIA-NORM-A060-P2-PREMARKET-TESTING-PERMISSION
  source: A060-P004
  quote: Providers or prospective providers may conduct testing of high-risk AI systems referred to in
    Annex III or covered by Union harmonisation legislation listed in Section A of Annex I in real world
    conditions at any time before the placing on the market or the putting into service of the high-risk
    AI system on their own or in partnership with one or more deployers or prospective deployers.
  action: conduct eligible high-risk system testing before market placement or service alone or with deployers
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A060-P004]
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A060-P004]
