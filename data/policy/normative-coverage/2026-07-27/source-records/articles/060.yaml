records:
- norm_id: AIA-NORM-A060-P1-REAL-WORLD-TESTING-PERMISSION
  source: A060-P001
  quote: Testing of high-risk AI systems in real world conditions outside AI regulatory sandboxes may
    be conducted by providers or prospective providers of high-risk AI systems listed in Annex III or
    covered by Union harmonisation legislation listed in Section A of Annex I, in accordance with this
    Article and the real-world testing plan referred to in this Article, without prejudice to the prohibitions
    under Article 5.
  action: conduct eligible high-risk AI testing outside a sandbox under Article 60 and its testing plan
    without infringing Article 5
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A060-P001]
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A060-P001]
  targets: []
  kind: permission
  conditions:
    operator: all_of
    operands:
    - operator: any_of
      operands:
      - text: high-risk AI systems listed in Annex III
        basis_segment_ids: [AIA-TEXT-A060-P001]
      - text: covered by Union harmonisation legislation listed in Section A of Annex I
        basis_segment_ids: [AIA-TEXT-A060-P001]
    - text: in accordance with this Article and the real-world testing plan referred to in this Article
      basis_segment_ids: [AIA-TEXT-A060-P001]
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  verification_mode: reported_conditionally
  exceptions:
    operator: any_of
    operands:
    - text: without prejudice to the prohibitions under Article 5
      basis_segment_ids: [AIA-TEXT-A060-P001]
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-PO-A60-4
  implementation_reason: The rule's activation condition recognises the Article 60 testing route.
  verified_by: vidibro
- norm_id: AIA-NORM-A060-P1-COMMISSION-PLAN-ACTS
  source: A060-P002
  quote: The Commission shall, by means of implementing acts, specify the detailed elements of the real-world
    testing plan. Those implementing acts shall be adopted in accordance with the examination procedure
    referred to in Article 98(2).
  action: specify detailed testing-plan elements by implementing acts adopted under the Article 98(2)
    examination procedure
  actors:
