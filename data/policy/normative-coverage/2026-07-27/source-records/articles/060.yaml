- norm_id: AIA-NORM-A060-P4-C-REGISTER-TESTING
  source: A060-P009
  quote: the provider or prospective provider, with the exception of providers or prospective providers
    of high-risk AI systems referred to in points 1, 6 and 7 of Annex III in the areas of law enforcement,
    migration, asylum and border control management, and high-risk AI systems referred to in point 2 of
    Annex III has registered the testing in real world conditions in accordance with Article 71(4) with
    a Union-wide unique single identification number and with the information specified in Annex IX; the
    provider or prospective provider of high-risk AI systems referred to in points 1, 6 and 7 of Annex
    III in the areas of law enforcement, migration, asylum and border control management, has registered
    the testing in real-world conditions in the secure non-public section of the EU database according
    to Article 49(4), point (d), with a Union-wide unique single identification number and with the information
    specified therein; the provider or prospective provider of high-risk AI systems referred to in point
    2 of Annex III has registered the testing in real-world conditions in accordance with Article 49(5);
  action: register real-world testing through the single registration route that the enacted system classes
    assign, with the identifier and information that route requires
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A060-P009]
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A060-P009]
  targets: []
