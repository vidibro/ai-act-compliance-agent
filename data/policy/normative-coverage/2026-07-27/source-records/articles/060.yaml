- norm_id: AIA-NORM-A060-P1-PRESERVE-PRODUCT-TESTING-LAW
  source: A060-P003
  quote: This paragraph shall be without prejudice to Union or national law on the testing in real world
    conditions of high-risk AI systems related to products covered by Union harmonisation legislation
    listed in Annex I.
  action: preserve applicable Union and national product testing law
  actors:
