- norm_id: AIA-NORM-A060-P4-B-APPROVAL-AND-TACIT-EFFECT
  source: A060-P008
  quote: the market surveillance authority in the Member State where the testing in real world conditions
    is to be conducted has approved the testing in real world conditions and the real-world testing plan;
    where the market surveillance authority has not provided an answer within 30 days, the testing in
    real world conditions and the real-world testing plan shall be understood to have been approved; where
    national law does not provide for a tacit approval, the testing in real world conditions shall remain
    subject to an authorisation;
  action: obtain authority approval or rely on 30-day tacit approval only where national law permits it
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A060-P006]
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A060-P006]
