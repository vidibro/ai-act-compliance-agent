records:
- norm_id: AIA-NORM-A038-P1-OPERATE-COORDINATION-GROUP
  source: A038-P001
  quote: The Commission shall ensure that, with regard to high-risk AI systems, appropriate coordination
    and cooperation between notified bodies active in the conformity assessment procedures pursuant to
    this Regulation are put in place and properly operated in the form of a sectoral group of notified
    bodies.
  action: establish and properly operate a sectoral group coordinating notified bodies for high-risk AI-system
    conformity assessment
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A038-P2-ENSURE-GROUP-PARTICIPATION
  source: A038-P002
  quote: Each notifying authority shall ensure that the bodies notified by it participate in the work
    of a group referred to in paragraph 1, directly or through designated representatives.
  action: ensure its notified bodies participate directly or through representatives in the sectoral coordination
    group
  actors:
  - actor_ref: notifying_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A038-P3-KNOWLEDGE-EXCHANGE
  source: A038-P003
  quote: The Commission shall provide for the exchange of knowledge and best practices between notifying
    authorities.
  action: provide for exchange of knowledge and best practices among notifying authorities
  actors:
