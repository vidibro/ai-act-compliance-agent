records:
- norm_id: AIA-NORM-A055-P1-A-EVALUATE-MODEL
  source: A055-P002
  quote: perform model evaluation in accordance with standardised protocols and tools reflecting the state
    of the art, including conducting and documenting adversarial testing of the model with a view to identifying
    and mitigating systemic risks
  action: evaluate the model using standardised state-of-the-art protocols and tools, including conducting
    and documenting adversarial testing to identify and mitigate systemic risks
  actors:
  - actor_ref: gpai_provider
  targets: []
  qualifier_spans:
  - A055-P001
  mandatory_content:
  - conduct adversarial testing of the model with a view to identifying and mitigating systemic risks
  - document adversarial testing of the model with a view to identifying and mitigating systemic risks
  implementation_refs:
  - AIA-RULE-GP-A55-1A
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A055-P1-B-ASSESS-AND-MITIGATE-SYSTEMIC-RISKS
  source: A055-P003
  quote: assess and mitigate possible systemic risks at Union level, including their sources, that may
    stem from the development, the placing on the market, or the use of general-purpose AI models with
    systemic risk
  action: assess and mitigate possible Union-level systemic risks and their sources across development,
    market placement, and use
  actors:
  - actor_ref: gpai_provider
  targets: []
  qualifier_spans:
  - A055-P001
  implementation_refs:
  - AIA-RULE-GP-A55-1B
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A055-P1-C-TRACK-DOCUMENT-AND-REPORT-INCIDENTS
  source: A055-P004
  quote: keep track of, document, and report, without undue delay, to the AI Office and, as appropriate,
    to national competent authorities, relevant information about serious incidents and possible corrective
    measures to address them
  action: keep track of and document relevant serious-incident information and possible corrective measures,
    and report them without undue delay to the AI Office and, as appropriate, national competent authorities
  actors:
  - actor_ref: gpai_provider
  targets: []
  qualifier_spans:
  - A055-P001
  mandatory_content:
  - relevant serious-incident information
  - possible corrective measures
  implementation_refs:
  - AIA-RULE-GP-A55-1C
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A055-P1-D-MODEL-AND-INFRASTRUCTURE-CYBERSECURITY
  source: A055-P005
  quote: ensure an adequate level of cybersecurity protection for the general-purpose AI model with systemic
    risk and the physical infrastructure of the model.
  action: ensure adequate cybersecurity protection for the systemic-risk general-purpose AI model and
    its physical infrastructure
  actors:
  - actor_ref: gpai_provider
  targets: []
  qualifier_spans:
  - A055-P001
  implementation_refs:
  - AIA-RULE-GP-A55-1D
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A055-P2-RELY-ON-CODES
  source: A055-P006
  quote: Providers of general-purpose AI models with systemic risk may rely on codes of practice within
    the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph 1 of
    this Article, until a harmonised standard is published.
  action: rely on Article 56 codes to demonstrate Article 55(1) compliance until a harmonised standard
    is published
  actors:
  - actor_ref: gpai_provider
  targets: []
  kind: permission
  product_scope: no_product_action
  product_scope_reason: Provides an optional compliance route rather than an additional product action.
  implementation_refs:
  - AIA-RULE-GP-A55-2
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A055-P2-HARMONISED-STANDARD-PRESUMPTION
  source: A055-P006
  quote: Compliance with European harmonised standards grants providers the presumption of conformity
    to the extent that those standards cover those obligations.
  action: presume conformity to the extent European harmonised standards cover Article 55 obligations
  actors:
  - actor_ref: gpai_provider
  targets: []
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: Establishes an evidentiary consequence rather than an independent action.
  implementation_refs:
  - AIA-RULE-GP-A55-2
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A055-P2-ALTERNATIVE-COMPLIANCE
  source: A055-P006
  quote: Providers of general-purpose AI models with systemic risks who do not adhere to an approved code
    of practice or do not comply with a European harmonised standard shall demonstrate alternative adequate
    means of compliance for assessment by the Commission.
  action: demonstrate alternative adequate means of compliance for Commission assessment
  actors:
  - actor_ref: gpai_provider
  targets: []
  conditions:
  - the provider neither adheres to an approved code nor complies with a covering harmonised standard
  implementation_refs:
  - AIA-RULE-GP-A55-2
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A055-P3-CONFIDENTIAL-TREATMENT
  source: A055-P007
  quote: Any information or documentation obtained pursuant to this Article, including trade secrets,
    shall be treated in accordance with the confidentiality obligations set out in Article 78.
  action: treat Article 55 information and documentation, including trade secrets, under Article 78 confidentiality
    duties
  actors:
  - actor_ref: public_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
