- norm_id: AIA-NORM-A055-P2-RELY-ON-CODES
  source: A055-P006
  quote: Providers of general-purpose AI models with systemic risk may rely on codes of practice within
    the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph 1 of
    this Article, until a harmonised standard is published.
  action: rely on Article 56 codes to demonstrate Article 55(1) compliance until a harmonised standard
    is published
  subject_ref: provider
  subject_category: supported_operator
  kind: permission
  product_scope: no_product_action
  product_scope_reason: Provides an optional compliance route rather than an additional product action.
  implementation_refs:
  - AIA-GP-A55-2
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A055-P2-HARMONISED-STANDARD-PRESUMPTION
  source: A055-P006
  quote: Compliance with European harmonised standards grants providers the presumption of conformity
    to the extent that those standards cover those obligations.
  action: presume conformity to the extent European harmonised standards cover Article 55 obligations
  subject_ref: provider
  subject_category: supported_operator
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: Establishes an evidentiary consequence rather than an independent action.
  implementation_refs:
  - AIA-GP-A55-2
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A055-P2-ALTERNATIVE-COMPLIANCE
  source: A055-P006
  quote: Providers of general-purpose AI models with systemic risks who do not adhere to an approved code
    of practice or do not comply with a European harmonised standard shall demonstrate alternative adequate
    means of compliance for assessment by the Commission.
  action: demonstrate alternative adequate means of compliance for Commission assessment
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - the provider neither adheres to an approved code nor complies with a covering harmonised standard
  implementation_refs:
  - AIA-GP-A55-2
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A055-P3-CONFIDENTIAL-TREATMENT
  source: A055-P007
  quote: Any information or documentation obtained pursuant to this Article, including trade secrets,
    shall be treated in accordance with the confidentiality obligations set out in Article 78.
  action: treat Article 55 information and documentation, including trade secrets, under Article 78 confidentiality
    duties
  subject_ref: article_55_information_recipient
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
