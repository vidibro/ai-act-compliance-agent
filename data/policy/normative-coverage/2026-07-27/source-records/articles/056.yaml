- norm_id: AIA-NORM-A056-P4-OBJECTIVES-AND-COMMITMENTS
  source: A056-P008
  quote: The AI Office and the Board shall aim to ensure that the codes of practice clearly set out their
    specific objectives and contain commitments or measures, including key performance indicators as appropriate,
    to ensure the achievement of those objectives, and that they take due account of the needs and interests
    of all interested parties, including affected persons, at Union level.
  action: aim to ensure codes state objectives, contain commitments, measures, and appropriate indicators
    to achieve them, and account for the needs and interests of all interested parties, including affected
    persons
  actors:
  - actor_ref: ai_office_and_board
    category: union_institution_or_body
  targets: []
  mandatory_content:
  - specific objectives
  - commitments or measures to achieve those objectives
  - key performance indicators as appropriate
  - due account of the needs and interests of all interested parties, including affected persons, at Union
    level
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  verified_by: vidibro
