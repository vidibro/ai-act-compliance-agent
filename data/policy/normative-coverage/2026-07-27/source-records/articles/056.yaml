  source: A056-P009
  quote: The AI Office shall aim to ensure that participants to the codes of practice report regularly
    to the AI Office on the implementation of the commitments and the measures taken and their outcomes,
    including as measured against the key performance indicators as appropriate.
  action: aim to ensure regular participant reporting on commitments, measures, outcomes, and appropriate
    indicators
