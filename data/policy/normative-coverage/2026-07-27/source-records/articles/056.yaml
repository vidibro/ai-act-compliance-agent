- norm_id: AIA-NORM-A056-P7-LIMITED-ADHERENCE
  source: A056-P011
  quote: For providers of general-purpose AI models not presenting systemic risks this adherence may be
    limited to the obligations provided for in Article 53, unless they declare explicitly their interest
    to join the full code.
  action: limit adherence to Article 53 for non-systemic-risk models unless the provider opts into the
    full code
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  kind: permission
  product_scope: no_product_action
  product_scope_reason: Defines the optional extent of code adherence rather than a required product action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_reported
