records:
- norm_id: AIA-NORM-A056-P1-FACILITATE-CODES
  source: A056-P001
  quote: The AI Office shall encourage and facilitate the drawing up of codes of practice at Union level
    in order to contribute to the proper application of this Regulation, taking into account international
    approaches.
  action: encourage and facilitate Union-level codes of practice supporting proper application while considering
    international approaches
  actors:
  - actor_ref: ai_office
    category: union_institution_or_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A056-P2-CODE-COVERAGE
  source: A056-P002
  quote: The AI Office and the Board shall aim to ensure that the codes of practice cover at least the
    obligations provided for in Articles 53 and 55, including the following issues
  action: aim to ensure codes cover Articles 53 and 55 and every listed implementation issue
  actors:
  - actor_ref: ai_office_and_board
    category: union_institution_or_body
  targets: []
  mandatory_content:
  - keeping Article 53(1)(a) and (b) information current
  - adequate detail for the training-content summary
  - identification of Union-level systemic-risk types, nature, and sources
  - proportionate assessment and management of Union-level systemic risks
  qualifier_spans:
  - A056-P003
  - A056-P004
  - A056-P005
  - A056-P006
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A056-P2-D-PROPORTIONATE-MEASURES
  source: A056-P006
  quote: which shall be proportionate to the risks, take into consideration their severity and probability
    and take into account the specific challenges of tackling those risks in light of the possible ways
    in which such risks may emerge and materialise along the AI value chain.
  action: make code measures proportionate and responsive to severity, probability, and AI-value-chain
    emergence challenges
  actors:
  - actor_ref: ai_office_and_board
    category: union_institution_or_body
  targets: []
  mandatory_content:
  - risk proportionality
  - severity and probability
  - AI-value-chain emergence and materialisation challenges
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
