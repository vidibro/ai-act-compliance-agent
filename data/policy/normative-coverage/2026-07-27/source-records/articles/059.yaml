- norm_id: AIA-NORM-A059-P1-CONDITIONAL-FURTHER-PROCESSING
  source: A059-P001
  quote: 'In the AI regulatory sandbox, personal data lawfully collected for other purposes may be processed
    solely for the purpose of developing, training and testing certain AI systems in the sandbox when
    all of the following conditions are met:'
  action: process lawfully collected personal data for sandbox development, training, and testing only
    for that purpose and only when every enacted condition is met
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  kind: permission
  conditions:
    operator: all_of
    operands:
    - text: In the AI regulatory sandbox
      basis_segment_ids: [AIA-TEXT-A059-P001]
    - text: personal data lawfully collected for other purposes
      basis_segment_ids: [AIA-TEXT-A059-P001]
    - text: when all of the following conditions are met
      basis_segment_ids: [AIA-TEXT-A059-P001]
  qualifier_spans:
