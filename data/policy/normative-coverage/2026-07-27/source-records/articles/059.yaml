  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
  exceptions:
    operator: any_of
    operands:
    - text: unless provided otherwise by Union or national law
      basis_segment_ids: [AIA-TEXT-A059-P014]
- norm_id: AIA-NORM-A059-P1-I-DOCUMENT-TRAINING-TESTING-VALIDATION
  source: A059-P015
  quote: a complete and detailed description of the process and rationale behind the training, testing
    and validation of the AI system is kept together with the testing results as part of the technical
    documentation referred to in Annex IV;
  action: include a complete detailed description and rationale for training testing and validation together
    with testing results in the Annex IV technical documentation
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  mandatory_content:
  - process and rationale for training testing and validation
  - testing results
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-PP-A59-P1
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P1-J-PUBLISH-PROJECT-SUMMARY
  source: A059-P016
  quote: a short summary of the AI project developed in the sandbox, its objectives and expected results
    is published on the website of the competent authorities; this obligation shall not cover sensitive
    operational data in relation to the activities of law enforcement, border control, immigration or
    asylum authorities.
  action: publish a short project summary with objectives and expected results on the competent-authority
    website while excluding protected sensitive operational data
  actors:
  - actor_ref: sandbox_participant
    basis_segment_ids: [AIA-TEXT-A059-P016]
  targets: []
  mandatory_content:
  - AI project summary
  - project objectives
  - expected results
  exceptions:
    operator: any_of
    operands:
    - text: this obligation shall not cover sensitive operational data in relation to the activities of law enforcement, border control, immigration or asylum authorities
      basis_segment_ids: [AIA-TEXT-A059-P016]
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-SP-A59-P1-J
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P2-LAW-ENFORCEMENT-LEGAL-BASIS
  source: A059-P017
  quote: For the purposes of the prevention, investigation, detection or prosecution of criminal offences
    or the execution of criminal penalties, including safeguarding against and preventing threats to public
    security, under the control and responsibility of law enforcement authorities, the processing of personal
    data in AI regulatory sandboxes shall be based on a specific Union or national law and subject to
    the same cumulative conditions as referred to in paragraph 1.
  action: base law-enforcement sandbox personal-data processing on specific Union or national law and
    satisfy every Article 59(1) condition
  actors:
  - actor_ref: law_enforcement_authority
    basis_segment_ids: [AIA-TEXT-A059-P017]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: For the purposes of the prevention, investigation, detection or prosecution of criminal offences or the execution of criminal penalties, including safeguarding against and preventing threats to public security
      basis_segment_ids: [AIA-TEXT-A059-P017]
    - text: under the control and responsibility of law enforcement authorities
      basis_segment_ids: [AIA-TEXT-A059-P017]
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A059-P3-PRESERVE-OTHER-DATA-LAW
  source: A059-P018
  quote: Paragraph 1 is without prejudice to Union or national law which excludes processing of personal
    data for other purposes than those explicitly mentioned in that law, as well as to Union or national
    law laying down the basis for the processing of personal data which is necessary for the purpose of
    developing, testing or training of innovative AI systems or any other legal basis, in compliance with
    Union law on the protection of personal data.
  action: preserve applicable Union and national restrictions and alternative lawful bases for innovative-AI
    personal-data processing
  actors:
  - actor_ref: sandbox_participant
    basis_segment_ids: [AIA-TEXT-A059-P018]
  targets: []
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  product_scope: no_product_action
  product_scope_reason: Preserves the effect of other applicable data-protection law rather than creating
    an independent product action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_reported
