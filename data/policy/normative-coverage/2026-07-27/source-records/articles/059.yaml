- norm_id: AIA-NORM-A059-P1-A-SUBSTANTIAL-PUBLIC-INTEREST
  source: A059-P002
  quote: 'AI systems shall be developed for safeguarding substantial public interest by a public authority
    or another natural or legal person and in one or more of the following areas:'
  action: develop the sandbox AI system to safeguard substantial public interest in at least one enacted
    field
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: AI systems shall be developed for safeguarding substantial public interest by a public authority or another natural or legal person
      basis_segment_ids: [AIA-TEXT-A059-P002]
    - operator: any_of
      operands:
      - text: public safety and public health, including disease detection, diagnosis prevention, control and treatment and improvement of health care systems
        basis_segment_ids: [AIA-TEXT-A059-P003]
      - text: a high level of protection and improvement of the quality of the environment, protection of biodiversity, protection against pollution, green transition measures, climate change mitigation and adaptation measures
        basis_segment_ids: [AIA-TEXT-A059-P004]
      - text: energy sustainability
        basis_segment_ids: [AIA-TEXT-A059-P005]
      - text: safety and resilience of transport systems and mobility, critical infrastructure and networks
        basis_segment_ids: [AIA-TEXT-A059-P006]
      - text: efficiency and quality of public administration and public services
        basis_segment_ids: [AIA-TEXT-A059-P007]
  qualifier_spans:
  - A059-P003
  - A059-P004
  - A059-P005
  - A059-P006
  - A059-P007
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
