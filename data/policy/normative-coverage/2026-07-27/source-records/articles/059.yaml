  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A059-P1-B-DATA-NECESSITY
  source: A059-P008
  quote: the data processed are necessary for complying with one or more of the requirements referred
    to in Chapter III, Section 2 where those requirements cannot effectively be fulfilled by processing
    anonymised, synthetic or other non-personal data;
  action: process personal data only where necessary for a Chapter III Section 2 requirement that non-personal
    alternatives cannot effectively fulfil
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: where those requirements cannot effectively be fulfilled by processing anonymised, synthetic or other non-personal data
      basis_segment_ids: [AIA-TEXT-A059-P008]
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-PP-A59-P1
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P1-C-MONITOR-AND-MITIGATE-RISKS
  source: A059-P009
  quote: there are effective monitoring mechanisms to identify if any high risks to the rights and freedoms
    of the data subjects, as referred to in Article 35 of Regulation (EU) 2016/679 and in Article 39 of
    Regulation (EU) 2018/1725, may arise during the sandbox experimentation, as well as response mechanisms
    to promptly mitigate those risks and, where necessary, stop the processing;
  action: maintain effective mechanisms to identify high data-subject risks, promptly mitigate them, and
    stop processing where necessary
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  mandatory_content:
  - effective high-risk monitoring
  - prompt risk response and mitigation
  - processing stoppage where necessary
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-PP-A59-P1
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P1-D-ISOLATED-PROTECTED-ENVIRONMENT
  source: A059-P010
  quote: any personal data to be processed in the context of the sandbox are in a functionally separate,
    isolated and protected data processing environment under the control of the prospective provider and
    only authorised persons have access to those data;
  action: keep sandbox personal data in a functionally separate isolated protected environment under provider
    control with access limited to authorised persons
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-PP-A59-P1
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P1-E-SHARING-RESTRICTIONS
  source: A059-P011
  quote: providers can further share the originally collected data only in accordance with Union data
    protection law; any personal data created in the sandbox cannot be shared outside the sandbox;
  action: share originally collected data only under Union data-protection law and never share sandbox-created
    personal data outside the sandbox
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A059-P011]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-PO-A59-P1-E
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P1-F-NO-DATA-SUBJECT-EFFECT
  source: A059-P012
  quote: any processing of personal data in the context of the sandbox neither leads to measures or decisions
    affecting the data subjects nor does it affect the application of their rights laid down in Union
    law on the protection of personal data;
  action: prevent sandbox personal-data processing from producing measures or decisions affecting data
    subjects or impairing their Union-law rights
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-PP-A59-P1
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P1-G-PROTECT-AND-DELETE-DATA
  source: A059-P013
  quote: any personal data processed in the context of the sandbox are protected by means of appropriate
    technical and organisational measures and deleted once the participation in the sandbox has terminated
    or the personal data has reached the end of its retention period;
  action: protect sandbox personal data with appropriate technical and organisational measures and delete
    it at sandbox exit or retention-period expiry
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  implementation_refs:
  - AIA-RULE-PP-A59-P1
  verification_mode: reported_conditionally
  verified_by: vidibro
  qualifier_spans:
  - A059-P001
- norm_id: AIA-NORM-A059-P1-H-KEEP-PROCESSING-LOGS
  source: A059-P014
  quote: the logs of the processing of personal data in the context of the sandbox are kept for the duration
    of the participation in the sandbox, unless provided otherwise by Union or national law;
  action: keep sandbox personal-data processing logs throughout participation unless Union or national
    law provides otherwise
  actors:
  - actor_ref: prospective_provider
    basis_segment_ids: [AIA-TEXT-A059-P010]
  targets: []
  temporal_regime_id: AIA-TEMP-A059-P1-H-LOG-RETENTION
