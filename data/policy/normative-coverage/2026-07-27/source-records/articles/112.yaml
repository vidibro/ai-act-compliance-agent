- norm_id: AIA-NORM-A112-P12-ACCOUNT-FOR-SECTOR-SPECIFICITIES
  source: A112-P022
  quote: Any amendment to this Regulation pursuant to paragraph 10, or relevant delegated or implementing
    acts, which concerns sectoral Union harmonisation legislation listed in Section B of Annex I shall
    take into account the regulatory specificities of each sector, and the existing governance, conformity
    assessment and enforcement mechanisms and authorities established therein.
  action: account for sector regulatory specificities and existing governance conformity-assessment and
    enforcement structures in relevant amendments and acts
  actors:
  - actor_ref: union_rulemaker
