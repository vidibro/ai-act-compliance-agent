- norm_id: AIA-NORM-A112-P9-ACCOUNT-FOR-INSTITUTIONAL-POSITIONS
  source: A112-P016
  quote: In carrying out the evaluations and reviews referred to in paragraphs 1 to 7, the Commission
    shall take into account the positions and findings of the Board, of the European Parliament, of the
    Council, and of other relevant bodies or sources.
  action: account for positions and findings of the Board Parliament Council and other relevant bodies
    or sources in Article 112 reviews
