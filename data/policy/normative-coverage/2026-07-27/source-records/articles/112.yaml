- norm_id: AIA-NORM-A112-P3-REGULATION-REVIEW-REPORT
  source: A112-P006
  quote: By 2 August 2029 and every four years thereafter, the Commission shall submit a report on the
    evaluation and review of this Regulation to the European Parliament and to the Council. The report
    shall include an assessment with regard to the structure of enforcement and the possible need for
    a Union agency to resolve any identified shortcomings.
  action: submit a public four-year Regulation review report assessing enforcement structure and possible
    need for a Union agency
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
