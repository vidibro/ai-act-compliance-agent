- norm_id: AIA-NORM-A112-P5-EVALUATE-AI-OFFICE
  source: A112-P012
  quote: By 2 August 2028, the Commission shall evaluate the functioning of the AI Office, whether the
    AI Office has been given sufficient powers and competences to fulfil its tasks, and whether it would
    be relevant and needed for the proper implementation and enforcement of this Regulation to upgrade
    the AI Office and its enforcement competences and to increase its resources.
  action: evaluate by 2 August 2028 the AI Office's functioning powers competences status and resource
    needs
