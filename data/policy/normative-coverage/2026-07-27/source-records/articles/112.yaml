- norm_id: AIA-NORM-A112-P2-FOUR-YEAR-EVALUATION
  source: A112-P002
  quote: By 2 August 2028 and every four years thereafter, the Commission shall evaluate and report to
    the European Parliament and to the Council on the following
  action: evaluate and report by 2 August 2028 and every four years on specified Annex III transparency
    and governance amendments
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  mandatory_content:
  - extending or adding Annex III area headings
  - amending Article 50 additional-transparency systems
  - improving supervision and governance effectiveness
  qualifier_spans:
