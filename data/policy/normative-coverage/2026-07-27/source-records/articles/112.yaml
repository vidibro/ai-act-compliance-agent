  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A112-P3-ACCOMPANY-AMENDMENT-PROPOSAL
  source: A112-P006
  quote: On the basis of the findings, that report shall, where appropriate, be accompanied by a proposal
    for amendment of this Regulation.
  action: accompany the review report with an AI Act amendment proposal when its findings make that appropriate
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  product_scope: outside_supported_actor
