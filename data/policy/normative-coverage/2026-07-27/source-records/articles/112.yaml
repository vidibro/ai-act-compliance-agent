    legislation listed in Section B of Annex I
- norm_id: AIA-NORM-A112-P13-ASSESS-ENFORCEMENT
  source: A112-P023
  quote: By 2 August 2031, the Commission shall carry out an assessment of the enforcement of this Regulation
    and shall report on it to the European Parliament, the Council and the European Economic and Social
    Committee, taking into account the first years of application of this Regulation.
  action: assess AI Act enforcement by 2 August 2031 and report to Parliament Council and the European
    Economic and Social Committee
