- norm_id: AIA-NORM-A112-P7-EVALUATE-VOLUNTARY-CODES
  source: A112-P014
  quote: By 2 August 2028 and every three years thereafter, the Commission shall evaluate the impact and
    effectiveness of voluntary codes of conduct to foster the application of the requirements set out
    in Chapter III, Section 2 for AI systems other than high-risk AI systems and possibly other additional
    requirements for AI systems other than high-risk AI systems, including as regards environmental sustainability.
  action: evaluate every three years from 2 August 2028 the impact and effectiveness of voluntary non-high-risk
    AI codes
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
