records:
- norm_id: AIA-NORM-A112-P1-ANNUAL-AMENDMENT-ASSESSMENT
  source: A112-P001
  quote: The Commission shall assess the need for amendment of the list set out in Annex III and of the
    list of prohibited AI practices laid down in Article 5, once a year following the entry into force
    of this Regulation, and until the end of the period of the delegation of power laid down in Article
    97.
  action: assess annually the need to amend Annex III and Article 5 lists through the Article 97 delegation
    period
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A112-P1-SUBMIT-ASSESSMENT-FINDINGS
  source: A112-P001
  quote: The Commission shall submit the findings of that assessment to the European Parliament and the
    Council.
  action: submit the annual Annex III and Article 5 amendment assessment findings to Parliament and Council
  actors:
