  verification_mode: not_reported
- norm_id: AIA-NORM-A112-P8-PROVIDE-REVIEW-INFORMATION
  source: A112-P015
  quote: For the purposes of paragraphs 1 to 7, the Board, the Member States and national competent authorities
    shall provide the Commission with information upon its request and without undue delay.
  action: provide requested information without undue delay for Article 112 evaluations and reviews
  actors:
