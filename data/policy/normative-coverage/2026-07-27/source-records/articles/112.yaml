- norm_id: AIA-NORM-A112-P6-REVIEW-ENERGY-STANDARDISATION
  source: A112-P013
  quote: By 2 August 2028 and every four years thereafter, the Commission shall submit a report on the
    review of the progress on the development of standardisation deliverables on the energy-efficient
    development of general-purpose AI models, and asses the need for further measures or actions, including
    binding measures or actions.
  action: review and report every four years from 2 August 2028 on energy-efficient GPAI standardisation
    and the need for further measures
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
