- norm_id: AIA-NORM-A112-P11-DEVELOP-RISK-EVALUATION-METHODOLOGY
  source: A112-P018
  quote: To guide the evaluations and reviews referred to in paragraphs 1 to 7 of this Article, the AI
    Office shall undertake to develop an objective and participative methodology for the evaluation of
    risk levels based on the criteria outlined in the relevant Articles and the inclusion of new systems
    in
  action: develop an objective participative methodology for risk-level evaluation and list inclusion
