- norm_id: AIA-NORM-A112-P4-REPORT-ATTENTION-AREAS
  source: A112-P007
  quote: The reports referred to in paragraph 2 shall pay specific attention to the following
  action: address the specified authority-resource penalty standardisation and market-entry matters in
    paragraph 2 reports
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  mandatory_content:
  - national competent authority financial technical and human resources
