records:
- norm_id: AIA-NORM-A047-P1-DRAW-UP-DECLARATION
  source: A047-P001
  quote: The provider shall draw up a written machine readable, physical or electronically signed EU declaration
    of conformity for each high-risk AI system, and keep it at the disposal of the national competent authorities
    for 10 years after the high-risk AI system has been placed on the market or put into service.
  action: draw up a written machine-readable, physical, or electronically signed declaration for each
    high-risk system and keep it available to national competent authorities for 10 years after market
    placement or service
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47
  verification_mode: reported_not_judged
  mandatory_content:
  - draw up the declaration in the prescribed written, machine-readable, physical or electronically signed
    form
  - keep it at the disposal of national competent authorities for 10 years after market placement or service
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P1-IDENTIFY-SYSTEM
  source: A047-P001
  quote: The EU declaration of conformity shall identify the high-risk AI system for which it has been
    drawn up.
  action: identify the specific high-risk system covered by the declaration
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P1-SUBMIT-ON-REQUEST
  source: A047-P001
  quote: A copy of the EU declaration of conformity shall be submitted to the relevant national competent
    authorities upon request.
  action: submit a declaration copy to relevant national competent authorities on request
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P2-STATE-SECTION-2-COMPLIANCE
  source: A047-P002
  quote: The EU declaration of conformity shall state that the high-risk AI system concerned meets the
    requirements set out in Section 2.
  action: state that the covered high-risk system meets Chapter III Section 2 requirements
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47-2
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P2-ANNEX-V-CONTENT
  source: A047-P002
  quote: The EU declaration of conformity shall contain the information set out in Annex V, and shall
    be translated into a language that can be easily understood by the national competent authorities
    of the Member States in which the high-risk AI system is placed on the market or made available.
  action: include every Annex V information item in the declaration and translate it into an easily understood
    language for authorities in every Member State where the system is placed on the market or made available
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47-2
  verification_mode: reported_not_judged
  mandatory_content:
  - contain the information set out in Annex V
  - use a language easily understood by competent authorities in every Member State where the system is
    marketed or made available
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P3-SINGLE-DECLARATION
  source: A047-P003
  quote: Where high-risk AI systems are subject to other Union harmonisation legislation which also requires
    an EU declaration of conformity, a single EU declaration of conformity shall be drawn up in respect
    of all Union law applicable to the high-risk AI system.
  action: draw up one declaration covering all applicable Union law when other harmonisation legislation
    also requires one
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47-3
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P3-IDENTIFY-LEGISLATION
  source: A047-P003
  quote: The declaration shall contain all the information required to identify the Union harmonisation
    legislation to which the declaration relates.
  action: include all information needed to identify every Union harmonisation law covered
  actors:
  - actor_ref: provider
  targets: []
  conditions:
  - the high-risk AI system is subject to other Union harmonisation legislation which also requires an
    EU declaration of conformity
  implementation_refs:
  - AIA-PO-A47-3
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P4-ASSUME-RESPONSIBILITY
  source: A047-P004
  quote: By drawing up the EU declaration of conformity, the provider shall assume responsibility for
    compliance with the requirements set out in Section 2.
  action: assume responsibility for Section 2 compliance by drawing up the declaration
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47-4
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P4-KEEP-CURRENT
  source: A047-P004
  quote: The provider shall keep the EU declaration of conformity up-to-date as appropriate.
  action: keep the declaration of conformity current as appropriate
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-PO-A47-4
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A047-P5-AMEND-ANNEX-V
  source: A047-P005
  quote: The Commission is empowered to adopt delegated acts in accordance with Article 97 in order to
    amend Annex V by updating the content of the EU declaration of conformity set out in that Annex, in
    order to introduce elements that become necessary in light of technical progress.
  action: amend Annex V declaration content to introduce elements required by technical progress
  actors:
  - actor_ref: commission
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
