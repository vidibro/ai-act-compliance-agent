  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: all_of
    operands:
    - text: Upon a duly substantiated request from the scientific panel
      basis_segment_ids: [AIA-TEXT-A091-P003]
    - text: where the access to information is necessary and proportionate for the fulfilment of the tasks of the scientific panel under Article 68(2)
      basis_segment_ids: [AIA-TEXT-A091-P003]
- norm_id: AIA-NORM-A091-P4-INFORMATION-REQUEST-CONTENT
  source: A091-P004
  quote: The request for information shall state the legal basis and the purpose of the request, specify
    what information is required, set a period within which the information is to be provided, and indicate
    the fines provided for in Article 101 for supplying incorrect, incomplete or misleading information.
  action: include the legal basis purpose required information response period and applicable Article
    101 fines in an information request
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A091-P001]
  targets: []
  mandatory_content:
  - legal basis and purpose
  - required information
  - response period
  - Article 101 fines for incorrect incomplete or misleading information
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
