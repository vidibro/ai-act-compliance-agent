- norm_id: AIA-NORM-A091-P3-SCIENTIFIC-PANEL-INFORMATION-REQUEST
  source: A091-P003
  quote: Upon a duly substantiated request from the scientific panel, the Commission may issue a request
    for information to a provider of a general-purpose AI model, where the access to information is necessary
    and proportionate for the fulfilment of the tasks of the scientific panel under Article 68(2).
  action: issue a necessary proportionate information request on a duly substantiated scientific-panel
    request
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A091-P003]
  targets: []
  kind: power
