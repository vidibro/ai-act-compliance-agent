  verification_mode: not_reported
- norm_id: AIA-NORM-A091-P5-SUPPLY-REQUESTED-INFORMATION
  source: A091-P005
  quote: The provider of the general-purpose AI model concerned, or its representative shall supply the
    information requested.
  action: supply information requested by the Commission
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A091-P005]
  - actor_ref: authorised_representative
    basis_segment_ids: [AIA-TEXT-A091-P005]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_refs:
  - AIA-RULE-GP-A91-5
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A091-P5-AUTHORISED-PERSON-SUPPLY
  source: A091-P005
  quote: In the case of legal persons, companies or firms, or where the provider has no legal personality,
    the persons authorised to represent them by law or by their statutes, shall supply the information
    requested on behalf of the provider of the general-purpose AI model concerned.
  action: supply requested information on behalf of a legal-person or non-legal-personality GPAI provider
  actors:
  - actor_ref: legal_representative
    basis_segment_ids: [AIA-TEXT-A091-P005]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
