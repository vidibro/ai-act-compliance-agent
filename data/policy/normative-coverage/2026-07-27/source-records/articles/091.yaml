- norm_id: AIA-NORM-A091-P5-CLIENT-REMAINS-RESPONSIBLE
  source: A091-P005
  quote: The clients shall nevertheless remain fully responsible if the information supplied is incomplete,
    incorrect or misleading.
  action: remain fully responsible for information a lawyer supplied on the client's behalf
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A091-P005]
  targets: []
  kind: legal_consequence
  conditions:
    operator: all_of
    operands:
