      basis_segment_ids: [AIA-TEXT-A091-P005]
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-GP-A91-5
  verification_mode: reported_conditionally
  verified_by: vidibro
  implementation_reason: The rule's evidence names the client's full responsibility for what a lawyer
    supplies.
