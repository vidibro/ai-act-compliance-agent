      basis_segment_ids: [AIA-TEXT-A091-P005]
    - text: where the provider has no legal personality
      basis_segment_ids: [AIA-TEXT-A091-P005]
- norm_id: AIA-NORM-A091-P5-LAWYER-SUPPLY
  source: A091-P005
  quote: Lawyers duly authorised to act may supply information on behalf of their clients.
  action: supply the requested information on behalf of a client
  actors:
