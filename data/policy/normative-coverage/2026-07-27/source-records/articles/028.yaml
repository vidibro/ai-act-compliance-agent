- norm_id: AIA-NORM-A028-P6-CONFIDENTIALITY
  source: A028-P006
  quote: Notifying authorities shall safeguard the confidentiality of the information that they obtain,
    in accordance with Article 78.
  action: safeguard obtained information according to Article 78 confidentiality requirements
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
