- norm_id: AIA-NORM-A028-P7-ADEQUATE-PERSONNEL
  source: A028-P007
  quote: Notifying authorities shall have an adequate number of competent personnel at their disposal
    for the proper performance of their tasks.
  action: maintain enough competent personnel to perform notifying-authority tasks properly
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
