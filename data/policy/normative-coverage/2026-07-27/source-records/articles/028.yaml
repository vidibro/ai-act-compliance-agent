records:
- norm_id: AIA-NORM-A028-P1-DESIGNATE-AUTHORITY
  source: A028-P001
  quote: Each Member State shall designate or establish at least one notifying authority responsible for
    setting up and carrying out the necessary procedures for the assessment, designation and notification
    of conformity assessment bodies and for their monitoring.
  action: designate or establish at least one notifying authority responsible for conformity-assessment-body
    procedures and monitoring
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P1-COOPERATIVE-PROCEDURES
  source: A028-P001
  quote: Those procedures shall be developed in cooperation between the notifying authorities of all Member
    States.
  action: develop conformity-assessment-body procedures cooperatively across Member-State notifying authorities
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P2-ACCREDITATION-BODY-OPTION
  source: A028-P002
  quote: Member States may decide that the assessment and monitoring referred to in paragraph 1 is to
    be carried out by a national accreditation body within the meaning of, and in accordance with, Regulation
    (EC) No 765/2008.
  action: assign paragraph 1 assessment and monitoring to a qualifying national accreditation body
  subject_ref: member_state
  subject_category: member_state
  kind: permission
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P3-INDEPENDENCE-SAFEGUARDS
  source: A028-P003
  quote: Notifying authorities shall be established, organised and operated in such a way that no conflict
    of interest arises with conformity assessment bodies, and that the objectivity and impartiality of
    their activities are safeguarded.
  action: organise and operate without conformity-body conflicts while safeguarding objectivity and impartiality
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - no conflict of interest with conformity assessment bodies
  - objective activities
  - impartial activities
- norm_id: AIA-NORM-A028-P4-SEPARATE-DECISION-MAKERS
  source: A028-P004
  quote: Notifying authorities shall be organised in such a way that decisions relating to the notification
    of conformity assessment bodies are taken by competent persons different from those who carried out
    the assessment of those bodies.
  action: assign notification decisions to competent persons other than the body assessors
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P5-NO-CONFORMITY-ACTIVITIES
  source: A028-P005
  quote: Notifying authorities shall offer or provide neither any activities that conformity assessment
    bodies perform
  action: refrain from offering or providing conformity-assessment-body activities
  subject_ref: notifying_authority
  subject_category: public_authority
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P5-NO-CONSULTANCY
  source: A028-P005
  quote: nor any consultancy services on a commercial or competitive basis
  action: refrain from commercial or competitive consultancy services
  subject_ref: notifying_authority
  subject_category: public_authority
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
