  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P7-PERSONNEL-EXPERTISE
  source: A028-P007
  quote: Competent personnel shall have the necessary expertise, where applicable, for their function,
    in fields such as information technologies, AI and law, including the supervision of fundamental rights.
  action: ensure personnel possess function-appropriate expertise, including relevant technology, AI,
    law, and fundamental-rights supervision
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
