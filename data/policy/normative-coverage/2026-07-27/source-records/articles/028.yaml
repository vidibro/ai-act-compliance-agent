  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P8-SINGLE-APPLICATION
  source: A028-P008
  quote: shall ensure that the conformity assessment body that applies for designation both pursuant to
    this Regulation and the Union harmonisation legislation listed in Section A of Annex I is provided
    with the possibility to submit a single application and undergoes a unified assessment procedure
  action: provide eligible conformity bodies a single application and unified assessment procedure
  subject_ref: notifying_authority
  subject_category: public_authority
  conditions: &id001
  - the relevant Section A Annex I legislation provides for the single application and unified assessment
    procedure
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P8-COOPERATE-IN-ASSESSMENTS
  source: A028-P008
  quote: notifying authorities designated pursuant to this Regulation and those designated pursuant to
    the Union harmonisation legislation listed in Section A of Annex I shall cooperate in their assessments
  action: cooperate across AI Act and Section A Annex I notifying authorities in unified assessments
  subject_ref: notifying_authority
  subject_category: public_authority
  conditions: *id001
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P8-EXISTING-BODY-ACCESS
  source: A028-P009
  quote: The single application and the unified assessment procedure referred to in this paragraph shall
    also be made available to notified bodies already designated pursuant to the Union harmonisation legislation
    listed in Section A of Annex I, when those notified bodies apply for designation pursuant to this
    Regulation
  action: make the unified procedure available to already designated Section A Annex I bodies seeking
    AI Act designation
  subject_ref: notifying_authority
  subject_category: public_authority
  conditions: *id001
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P8-APPLY-ONCE
  source: A028-P010
  quote: A conformity assessment body that is designated pursuant to more than one piece of Union harmonisation
    legislation listed in Section A of Annex I shall have to apply only once to be designated pursuant
    to this Regulation.
  action: require a multi-designated conformity body to apply only once for AI Act designation
  subject_ref: conformity_assessment_body
  subject_category: notified_or_conformity_body
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P8-DESIGNATION-ACROSS-LEGISLATION
  source: A028-P010
  quote: A designation pursuant to this Regulation shall be applicable for all Union harmonisation legislation
    listed in Section A of Annex I for which the conformity assessment body is designated.
  action: apply the AI Act designation across all relevant Section A Annex I legislation for which the
    body is designated
  subject_ref: conformity_assessment_body
  subject_category: notified_or_conformity_body
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A028-P8-UNIFIED-PROCEDURE-CHARACTERISTICS
  source: A028-P011
  quote: The single application and the unified assessment procedure shall avoid any unnecessary duplications,
    build on the existing procedures for designation in accordance with the Union harmonisation legislation
    listed in Section A of Annex I and ensure compliance with the requirements relating to notified bodies
    both in accordance with this Regulation and the relevant Union harmonisation legislation.
  action: operate the unified procedure without unnecessary duplication, using existing procedures while
    ensuring both sets of notified-body requirements
  subject_ref: notifying_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - avoid unnecessary duplication
  - build on existing designation procedures
  - ensure AI Act notified-body compliance
  - ensure relevant harmonisation-legislation compliance
- norm_id: AIA-NORM-A028-P9-DEFAULT-NOTIFYING-AUTHORITY
  source: A028-P012
  quote: A notifying authority that has been designated pursuant to the Union harmonisation legislation
    listed in Section A of Annex I is also the notifying authority for the application of the single application
    and unified assessment procedure referred to in paragraph 8, unless the Member State designates another
    notifying authority for this Regulation.
  action: treat the Section A Annex I notifying authority as the unified-procedure authority unless the
    Member State designates another
  subject_ref: notifying_authority
  subject_category: public_authority
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
