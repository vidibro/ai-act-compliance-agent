    target_kind: documentation
    basis_segment_ids: [AIA-TEXT-A053-P003]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  implementation_refs:
  - AIA-RULE-GP-A53-1B
  verification_mode: reported_not_judged
  verified_by: vidibro
  qualifier_spans:
  - A053-P001
