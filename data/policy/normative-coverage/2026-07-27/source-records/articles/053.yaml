- norm_id: AIA-NORM-A053-P7-CONFIDENTIAL-TREATMENT
  source: A053-P013
  quote: Any information or documentation obtained pursuant to this Article, including trade secrets,
    shall be treated in accordance with the confidentiality obligations set out in Article 78.
  action: treat Article 53 information and documentation, including trade secrets, under Article 78 confidentiality
    obligations
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A053-P003]
  targets:
