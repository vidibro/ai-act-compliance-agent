records:
- norm_id: AIA-NORM-A053-P1-A-DRAW-KEEP-DOCUMENTATION
  source: A053-P002
  quote: draw up and keep up-to-date the technical documentation of the model, including its training
    and testing process and the results of its evaluation, which shall contain, at a minimum, the information
    set out in Annex XI for the purpose of providing it, upon request, to the AI Office and the national
    competent authorities
  action: draw up and keep current model technical documentation covering training, testing and evaluation,
    containing at least the Annex XI information, for provision on request to the AI Office and national
    competent authorities
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P001]
  targets:
  - target_ref: technical documentation of the model
    target_kind: documentation
    basis_segment_ids: [AIA-TEXT-A053-P002]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  qualifier_spans:
  - A053-P001
  implementation_refs:
  - AIA-RULE-GP-A53-1A
  verification_mode: reported_not_judged
  verified_by: vidibro
  mandatory_content:
  - draw up and keep the technical documentation up to date
  - cover model training, testing and evaluation results
  - the information set out in Annex XI
  - provide it upon request to the AI Office and national competent authorities
- norm_id: AIA-NORM-A053-P1-B-DRAW-KEEP-AND-MAKE-AVAILABLE-DOCUMENTATION
  source: A053-P003
  quote: draw up, keep up-to-date and make available information and documentation to providers of AI
    systems who intend to integrate the general-purpose AI model into their AI systems.
  action: draw up, keep current, and make available information and documentation to providers intending
    to integrate the model into their AI systems
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P001]
  targets:
