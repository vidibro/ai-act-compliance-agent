- norm_id: AIA-NORM-A053-P2-OPEN-SOURCE-EXCEPTION
  source: A053-P008
  quote: The obligations set out in paragraph 1, points (a) and (b), shall not apply to providers of AI
    models that are released under a free and open-source licence that allows for the access, usage, modification,
    and distribution of the model, and whose parameters, including the weights, the information on the
    model architecture, and the information on model usage, are made publicly available.
  action: disapply Article 53(1)(a) and (b) where every enacted free-and-open-source condition is met
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P008]
  targets:
  - target_ref: free and open-source licence
    target_kind: legal_status
    basis_segment_ids: [AIA-TEXT-A053-P008]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  kind: applicability
  conditions:
    operator: all_of
    operands:
    - text: released under a free and open-source licence that allows for the access, usage, modification, and distribution of the model
      basis_segment_ids: [AIA-TEXT-A053-P008]
    - text: whose parameters, including the weights, the information on the model architecture, and the information on model usage, are made publicly available
      basis_segment_ids: [AIA-TEXT-A053-P008]
  implementation_refs:
  - AIA-RULE-GP-A53-1A
  - AIA-RULE-GP-A53-1B
  - AIA-CQ-OPEN-SOURCE-RELEASE
  implementation_reason: Both rules encode this exception in their activation conditions.
  implementation_mode: report_only
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A053-P2-SYSTEMIC-RISK-OVERRIDE
  source: A053-P008
  quote: This exception shall not apply to general-purpose AI models with systemic risks.
  action: restore Article 53(1)(a) and (b) obligations for general-purpose AI models with systemic risk
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P008]
  targets:
  - target_ref: general-purpose AI models with systemic risks
    target_kind: ai_model
    basis_segment_ids: [AIA-TEXT-A053-P008]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  kind: applicability
  conditions:
    operator: all_of
    operands:
    - text: general-purpose AI models with systemic risks
      basis_segment_ids: [AIA-TEXT-A053-P008]
  implementation_refs:
  - AIA-RULE-GP-A53-1A
  - AIA-RULE-GP-A53-1B
  implementation_reason: Both rules disapply the open-source exception for systemic-risk models.
  implementation_mode: report_only
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A053-P3-COOPERATE
  source: A053-P009
  quote: Providers of general-purpose AI models shall cooperate as necessary with the Commission and the
    national competent authorities in the exercise of their competences and powers pursuant to this Regulation.
  action: cooperate as necessary with the Commission and national competent authorities exercising regulatory
    powers
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P009]
  targets:
  - target_ref: national competent authorities
    target_kind: organisation
    basis_segment_ids: [AIA-TEXT-A053-P009]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  implementation_refs:
  - AIA-RULE-GP-A53-3
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A053-P4-RELY-ON-CODES
  source: A053-P010
  quote: Providers of general-purpose AI models may rely on codes of practice within the meaning of Article
    56 to demonstrate compliance with the obligations set out in paragraph 1 of this Article, until a
    harmonised standard is published.
  action: rely on Article 56 codes of practice to demonstrate Article 53(1) compliance until a harmonised
    standard is published
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P010]
  targets:
  - target_ref: codes of practice
    target_kind: documentation
    basis_segment_ids: [AIA-TEXT-A053-P010]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  kind: permission
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-GP-A53-4
  implementation_reason: The rule's activation condition recognises this code-of-practice route.
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A053-P4-HARMONISED-STANDARD-PRESUMPTION
  source: A053-P010
  quote: Compliance with European harmonised standards grants providers the presumption of conformity
    to the extent that those standards cover those obligations.
  action: presume conformity to the extent a European harmonised standard covers the Article 53 obligations
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P010]
  targets:
  - target_ref: European harmonised standards
    target_kind: external_requirement
    basis_segment_ids: [AIA-TEXT-A053-P010]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  kind: legal_consequence
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-GP-A53-4
  implementation_reason: The rule's activation condition recognises the harmonised-standard route.
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A053-P4-ALTERNATIVE-COMPLIANCE
  source: A053-P010
  quote: Providers of general-purpose AI models who do not adhere to an approved code of practice or do
    not comply with a European harmonised standard shall demonstrate alternative adequate means of compliance
    for assessment by the Commission.
  action: demonstrate alternative adequate means of compliance for Commission assessment
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A053-P010]
  targets:
  - target_ref: alternative adequate means of compliance
    target_kind: documentation
    basis_segment_ids: [AIA-TEXT-A053-P010]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  conditions:
    operator: all_of
    operands:
    - text: who do not adhere to an approved code of practice or do not comply with a European harmonised standard
      basis_segment_ids: [AIA-TEXT-A053-P010]
  implementation_refs:
  - AIA-RULE-GP-A53-4
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A053-P5-DETAIL-METHODOLOGIES
  source: A053-P011
  quote: For the purpose of facilitating compliance with Annex XI, in particular points 2 (d) and (e)
    thereof, the Commission is empowered to adopt delegated acts in accordance with Article 97 to detail
    measurement and calculation methodologies with a view to allowing for comparable and verifiable documentation.
  action: adopt Article 97 delegated acts detailing measurement and calculation methodologies for comparable,
    verifiable Annex XI documentation
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A053-P011]
  targets:
  - target_ref: measurement and calculation methodologies
    target_kind: documentation
    basis_segment_ids: [AIA-TEXT-A053-P011]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A053-P6-AMEND-ANNEXES
  source: A053-P012
