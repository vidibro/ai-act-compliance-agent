records:
- norm_id: AIA-NORM-A077-P1-REQUEST-AND-ACCESS-INFORMATION
  source: A077-P001
  quote: shall have the power to request and access any information or documentation created or maintained from the relevant market surveillance authority pursuant to this Regulation in accessible language and machine-readable format by electronic means
  action: request and electronically access necessary authority-held information in accessible machine-readable form within the body's mandate
  subject_ref: fundamental_rights_authority
  subject_category: public_authority
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A077-P1A-GRANT-INFORMATION-ACCESS
  source: A077-P002
  quote: the market surveillance authority shall grant the relevant public authority or body referred to in paragraph 1 access to such information or documentation, including by requesting such information or documentation from the provider or the deployer, where necessary and without undue delay.
  action: grant necessary information access without undue delay including by obtaining it from a provider or deployer
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A077-P1B-COOPERATE-AND-ASSIST
  source: A077-P003
  quote: Market surveillance authorities and public authorities or bodies referred to in paragraph 1 shall cooperate closely and provide each other with the mutual assistance necessary to fulfil their respective mandates
  action: cooperate closely exchange necessary information and provide mutual assistance while respecting respective mandates and independence
  subject_ref: market_surveillance_and_fundamental_rights_authorities
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A077-P2-IDENTIFY-PUBLISH-NOTIFY-AND-UPDATE
  source: A077-P004
  quote: By 2 November 2024, each Member State shall identify the public authorities or bodies referred to in paragraph 1 and make a list of them publicly available.
  action: identify and publish the authority list by 2 November 2024 notify the Commission and Member States and keep it current
  subject_ref: member_state
  subject_category: member_state
  mandatory_content: [identify eligible authorities by the deadline, publish their list, notify the Commission and other Member States, keep the list up to date]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A077-P3-REQUEST-TECHNICAL-TESTING
  source: A077-P005
  quote: the public authority or body referred to in paragraph 1 may make a reasoned request to the market surveillance authority, to organise testing of the high-risk AI system through technical means.
  action: make a reasoned technical-testing request when documentation cannot establish a fundamental-rights infringement
  subject_ref: fundamental_rights_authority
  subject_category: public_authority
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A077-P3-ORGANISE-TESTING
  source: A077-P005
  quote: The market surveillance authority shall organise the testing with the close involvement of the requesting public authority or body within a reasonable time following the request.
  action: organise requested technical testing within a reasonable time with close requesting-body involvement
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A077-P4-TREAT-INFORMATION-CONFIDENTIALLY
  source: A077-P006
  quote: Any information or documentation obtained by the national public authorities or bodies referred to in paragraph 1 of this Article pursuant to this Article shall be treated in accordance with the confidentiality obligations set out in Article 78.
  action: treat information and documentation obtained under Article 77 according to Article 78 confidentiality
  subject_ref: fundamental_rights_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
