      basis_segment_ids: [AIA-TEXT-A077-P001]
- norm_id: AIA-NORM-A077-P1-PRESERVE-AUTHORITY-MANDATES
  source: A077-P001
  quote: This Article is without prejudice to the competences, tasks, powers and independence of the relevant
    national public authorities or bodies under their mandates.
  action: leave the fundamental-rights bodies' own competences, tasks, powers and independence untouched
