- norm_id: AIA-NORM-A081-P2-TAKE-JUSTIFIED-RESTRICTIONS
  source: A081-P002
  quote: all Member States shall ensure that they take appropriate restrictive measures in respect of the AI system concerned, such as requiring the withdrawal of the AI system from their market without undue delay, and shall inform the Commission accordingly.
  action: take appropriate restrictions without undue delay and inform the Commission when the national measure is justified
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A081-P2-WITHDRAW-UNJUSTIFIED-MEASURE
  source: A081-P002
  quote: the Member State concerned shall withdraw the measure and shall inform the Commission accordingly.
  action: withdraw an unjustified national measure and inform the Commission
  subject_ref: member_state
  subject_category: member_state
