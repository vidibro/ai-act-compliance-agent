records:
- norm_id: AIA-NORM-A081-P1-CONSULT-AND-EVALUATE
  source: A081-P001
  quote: the Commission shall without undue delay enter into consultation with the market surveillance authority of the relevant Member State and the operator or operators, and shall evaluate the national measure.
  action: promptly consult the relevant authority and operators and evaluate an objected-to or Union-law-inconsistent national measure
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A081-P1-DECIDE-JUSTIFICATION
  source: A081-P001
  quote: the Commission shall, within six months, or within 60 days in the case of non-compliance with the prohibition of the AI practices referred to in Article 5, starting from the notification referred to in Article 79(5), decide whether the national measure is justified
  action: decide whether the national measure is justified within six months or 60 days for Article 5 non-compliance
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A081-P1-NOTIFY-DECISION
  source: A081-P001
  quote: shall notify its decision to the market surveillance authority of the Member State concerned.
  action: notify the decision to the market surveillance authority of the Member State concerned
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A081-P1-INFORM-OTHER-AUTHORITIES
  source: A081-P001
  quote: The Commission shall also inform all other market surveillance authorities of its decision.
  action: inform all other market surveillance authorities of the decision
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
