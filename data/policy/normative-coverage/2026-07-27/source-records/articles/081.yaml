- norm_id: AIA-NORM-A081-P3-APPLY-STANDARDS-PROCEDURE
  source: A081-P003
  quote: the Commission shall apply the procedure provided for in Article 11 of Regulation (EU) No 1025/2012.
  action: apply the Regulation 1025/2012 Article 11 procedure when justified non-compliance arises from standards or common specifications
