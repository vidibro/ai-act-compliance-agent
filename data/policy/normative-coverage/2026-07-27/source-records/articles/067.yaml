  verification_mode: not_reported
- norm_id: AIA-NORM-A067-P4-MEMBER-TERM
  source: A067-P004
  quote: The term of office of the members of the advisory forum shall be two years, which may be extended
    by up to no more than four years.
  action: set forum member terms at two years with extension limited to four additional years
  actors:
