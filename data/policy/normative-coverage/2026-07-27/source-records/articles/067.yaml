records:
- norm_id: AIA-NORM-A067-P1-ESTABLISH-ADVISORY-FORUM
  source: A067-P001
  quote: An advisory forum shall be established to provide technical expertise and advise the Board and
    the Commission, and to contribute to their tasks under this Regulation.
  action: establish an advisory forum supporting the Board and Commission with expertise advice and task
    contributions
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A067-P003]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-VII
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A067-P2-BALANCED-MEMBERSHIP
  source: A067-P002
  quote: The membership of the advisory forum shall represent a balanced selection of stakeholders, including
    industry, start-ups, SMEs, civil society and academia. The membership of the advisory forum shall
    be balanced with regard to commercial and non-commercial interests and, within the category of commercial
    interests, with regard to SMEs and other undertakings.
  action: maintain balanced stakeholder commercial and undertaking representation in forum membership
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A067-P003]
  targets: []
  mandatory_content:
  - industry start-ups SMEs civil society and academia
  - commercial and non-commercial interests
  - SMEs and other undertakings within commercial interests
  temporal_regime_id: AIA-TEMP-CHAPTER-VII
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A067-P3-APPOINT-MEMBERS
  source: A067-P003
  quote: The Commission shall appoint the members of the advisory forum, in accordance with the criteria
    set out in paragraph 2, from amongst stakeholders with recognised expertise in the field of AI.
  action: appoint AI-expert forum members under the paragraph 2 balance criteria
  actors:
  - actor_ref: commission
