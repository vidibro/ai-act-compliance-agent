- norm_id: AIA-NORM-A067-P5-PERMANENT-MEMBERS
  source: A067-P005
  quote: The Fundamental Rights Agency, ENISA, the European Committee for Standardization (CEN), the European
    Committee for Electrotechnical Standardization (CENELEC), and the European Telecommunications Standards
    Institute (ETSI) shall be permanent members of the advisory forum.
  action: include every enacted Union and standardisation body as a permanent forum member
  actors:
  - actor_ref: advisory_forum
    basis_segment_ids: [AIA-TEXT-A067-P005]
