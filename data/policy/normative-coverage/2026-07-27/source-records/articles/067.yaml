records:
- norm_id: AIA-NORM-A067-P1-ESTABLISH-ADVISORY-FORUM
  source: A067-P001
  quote: An advisory forum shall be established to provide technical expertise and advise the Board and the Commission, and to contribute to their tasks under this Regulation.
  action: establish an advisory forum supporting the Board and Commission with expertise advice and task contributions
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P2-BALANCED-MEMBERSHIP
  source: A067-P002
  quote: The membership of the advisory forum shall represent a balanced selection of stakeholders, including industry, start-ups, SMEs, civil society and academia. The membership of the advisory forum shall be balanced with regard to commercial and non-commercial interests and, within the category of commercial interests, with regard to SMEs and other undertakings.
  action: maintain balanced stakeholder commercial and undertaking representation in forum membership
  subject_ref: commission
  subject_category: union_institution_or_body
  mandatory_content: [industry start-ups SMEs civil society and academia, commercial and non-commercial interests, SMEs and other undertakings within commercial interests]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P3-APPOINT-MEMBERS
  source: A067-P003
  quote: The Commission shall appoint the members of the advisory forum, in accordance with the criteria set out in paragraph 2, from amongst stakeholders with recognised expertise in the field of AI.
  action: appoint AI-expert forum members under the paragraph 2 balance criteria
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P4-MEMBER-TERM
  source: A067-P004
  quote: The term of office of the members of the advisory forum shall be two years, which may be extended by up to no more than four years.
  action: set forum member terms at two years with extension limited to four additional years
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P5-PERMANENT-MEMBERS
  source: A067-P005
  quote: The Fundamental Rights Agency, ENISA, the European Committee for Standardization (CEN), the European Committee for Electrotechnical Standardization (CENELEC), and the European Telecommunications Standards Institute (ETSI) shall be permanent members of the advisory forum.
  action: include every enacted Union and standardisation body as a permanent forum member
  subject_ref: advisory_forum
  subject_category: union_institution_or_body
  mandatory_content: [Fundamental Rights Agency, ENISA, CEN, CENELEC, ETSI]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P6-RULES-AND-COCHAIRS
  source: A067-P006
  quote: The advisory forum shall draw up its rules of procedure. It shall elect two co-chairs from among its members, in accordance with criteria set out in paragraph 2. The term of office of the co-chairs shall be two years, renewable once.
  action: adopt rules elect two balanced co-chairs and apply the enacted co-chair term
  subject_ref: advisory_forum
  subject_category: union_institution_or_body
  mandatory_content: [rules of procedure, two co-chairs elected under paragraph 2 criteria, two-year co-chair term renewable once]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P7-MEETINGS-AND-INVITATIONS
  source: A067-P007
  quote: The advisory forum shall hold meetings at least twice a year. The advisory forum may invite experts and other stakeholders to its meetings.
  action: meet at least twice yearly and invite experts and stakeholders as appropriate
  subject_ref: advisory_forum
  subject_category: union_institution_or_body
  mandatory_content: [at least two meetings per year]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P8-PREPARE-REQUESTED-CONTRIBUTIONS
  source: A067-P008
  quote: The advisory forum may prepare opinions, recommendations and written contributions at the request of the Board or the Commission.
  action: prepare requested opinions recommendations and written contributions
  subject_ref: advisory_forum
  subject_category: union_institution_or_body
  kind: power
  conditions: [the Board or Commission requests the contribution]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P9-ESTABLISH-SUBGROUPS
  source: A067-P009
  quote: The advisory forum may establish standing or temporary sub-groups as appropriate for the purpose of examining specific questions related to the objectives of this Regulation.
  action: establish standing or temporary subgroups to examine Regulation-objective questions
  subject_ref: advisory_forum
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A067-P10-ANNUAL-PUBLIC-REPORT
  source: A067-P010
  quote: The advisory forum shall prepare an annual report on its activities. That report shall be made publicly available.
  action: prepare and publicly release an annual activity report
  subject_ref: advisory_forum
  subject_category: union_institution_or_body
  mandatory_content: [annual activity report, public availability]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
