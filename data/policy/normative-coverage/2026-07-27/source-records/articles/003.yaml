  conditions:
  - operator: all_of
    operands:
    - an act or omission is contrary to Union law protecting the interest of individuals
    - operator: any_of
      operands:
      - operator: any_of
        operands:
        - the act or omission has harmed or is likely to harm the collective interests of individuals
          residing in at least two Member States other than the Member State in which the act or omission
          originated or took place
        - the act or omission has harmed or is likely to harm the collective interests of individuals
          residing in at least two Member States other than the Member State in which the provider concerned
          or, where applicable, its authorised representative is located or established
        - the act or omission has harmed or is likely to harm the collective interests of individuals
