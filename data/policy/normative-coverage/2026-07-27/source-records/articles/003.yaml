records:
- norm_id: AIA-NORM-A003-D001-AI-SYSTEM
  source: A003-P002
  quote: "\u2018AI system\u2019 means a machine-based system that is designed to operate with varying\
    \ levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or\
    \ implicit objectives, infers, from the input it receives, how to generate outputs such as predictions,\
    \ content, recommendations, or decisions that can influence physical or virtual environments"
  action: define AI system for the purposes of the Regulation
  subject_ref: ai_system
  subject_category: other
  kind: definition
  qualifier_spans:
  - A003-P001
  product_scope: dependency_only
  product_scope_reason: This definition constrains downstream classification and norm interpretation but
    creates no independent product-facing action.
  implementation_mode: none_required
  implementation_reason: Definitions are represented as legal dependencies rather than standalone product
    rules.
  verification_mode: not_reported
- norm_id: AIA-NORM-A003-D002-RISK
  source: A003-P003
  quote: "\u2018risk\u2019 means the combination of the probability of an occurrence of harm and the severity\
