- norm_id: AIA-NORM-A003-D003-PROVIDER
  source: A003-P004
  quote: "\u2018provider\u2019 means a natural or legal person, public authority, agency or other body\
    \ that develops an AI system or a general-purpose AI model or that has an AI system or a general-purpose\
    \ AI model developed and places it on the market or puts the AI system into service under its own\
    \ name or trademark, whether for payment or free of charge"
  action: define provider for the purposes of the Regulation
  subject_ref: provider
  subject_category: other
  kind: definition
