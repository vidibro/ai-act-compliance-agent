- norm_id: AIA-NORM-A003-D004-DEPLOYER
  source: A003-P005
  quote: "\u2018deployer\u2019 means a natural or legal person, public authority, agency or other body\
    \ using an AI system under its authority except where the AI system is used in the course of a personal\
    \ non-professional activity"
