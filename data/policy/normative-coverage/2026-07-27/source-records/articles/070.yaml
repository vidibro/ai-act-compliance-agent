- norm_id: AIA-NORM-A070-P8-GUIDANCE-AND-CONSULTATION
  source: A070-P008
  quote: National competent authorities may provide guidance and advice on the implementation of this Regulation, in particular to SMEs, including start-ups, and SMCs, taking into account the guidance and advice of the Board and the Commission, as appropriate. Whenever national competent authorities intend to provide guidance and advice with regard to an AI system in areas covered by other Union law, the national competent authorities under that Union law shall be consulted, as appropriate.
  action: provide Board-and-Commission-informed implementation guidance and consult authorities responsible for other applicable Union law
  subject_ref: national_competent_authority
  subject_category: public_authority
  kind: power
  conditions: [other-law authorities are consulted where guidance concerns their Union-law area]
