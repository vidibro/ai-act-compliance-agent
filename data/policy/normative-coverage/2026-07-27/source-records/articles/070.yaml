- norm_id: AIA-NORM-A070-P1-ORGANISATIONAL-FLEXIBILITY
  source: A070-P001
  quote: Provided that those principles are observed, such activities and tasks may be performed by one
    or more designated authorities, in accordance with the organisational needs of the Member State.
  action: have the activities and tasks performed by one or more designated authorities according to the
    Member State's organisational needs
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  kind: permission
  conditions:
  - the independence, impartiality, objectivity and member-conduct principles are observed
