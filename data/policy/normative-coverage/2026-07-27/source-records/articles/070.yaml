records:
- norm_id: AIA-NORM-A070-P1-DESIGNATE-AND-SAFEGUARD-AUTHORITIES
  source: A070-P001
  quote: Each Member State shall establish or designate as national competent authorities at least one notifying authority and at least one market surveillance authority for the purposes of this Regulation. Those national competent authorities shall exercise their powers independently, impartially and without bias so as to safeguard the objectivity of their activities and tasks, and to ensure the application and implementation of this Regulation. The members of those authorities shall refrain from any action incompatible with their duties. Provided that those principles are observed, such activities and tasks may be performed by one or more designated authorities, in accordance with the organisational needs of the Member State.
  action: designate notifying and surveillance authorities and safeguard their independent impartial objective operation and member conduct
  subject_ref: member_state_and_national_competent_authority
  subject_category: public_authority
  mandatory_content: [at least one notifying authority, at least one market surveillance authority, independent impartial unbiased exercise of powers, no member action incompatible with duties, consolidation only while governance principles remain observed]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A070-P2-AUTHORITY-AND-CONTACT-DISCLOSURES
  source: A070-P002
  quote: Member States shall communicate to the Commission the identity of the notifying authorities and the market surveillance authorities and the tasks of those authorities, as well as any subsequent changes thereto. Member States shall make publicly available information on how competent authorities and single points of contact can be contacted, through electronic communication means by 2 August 2025. Member States shall designate a market surveillance authority to act as the single point of contact for this Regulation, and shall notify the Commission of the identity of the single point of contact.
  action: disclose authority identities tasks changes and contacts and designate and notify the single point of contact
  subject_ref: member_state
  subject_category: member_state
  mandatory_content: [authority identities tasks and changes communicated to the Commission, electronic public contact information by 2 August 2025, market surveillance authority designated as single point of contact, single-point identity notified to the Commission]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A070-P2-PUBLISH-CONTACT-LIST
