- norm_id: AIA-NORM-A070-P3-PERMANENT-EXPERT-PERSONNEL
  source: A070-P003
  quote: the national competent authorities shall have a sufficient number of personnel permanently available
    whose competences and expertise shall include an in-depth understanding of AI technologies, data and
    data computing, personal data protection, cybersecurity, fundamental rights, health and safety risks
    and knowledge of existing standards and legal requirements.
  action: keep a sufficient number of personnel permanently available whose competences and expertise
    cover every enacted field
  actors:
  - actor_ref: national_competent_authority
    category: public_authority
  targets: []
  mandatory_content:
  - in-depth understanding of AI technologies
  - data and data computing
  - personal data protection
  - cybersecurity
  - fundamental rights
  - health and safety risks
  - knowledge of existing standards and legal requirements
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
