  verification_mode: not_reported
- norm_id: AIA-NORM-A070-P2-AUTHORITY-AND-CONTACT-DISCLOSURES
  source: A070-P002
  quote: Member States shall communicate to the Commission the identity of the notifying authorities and
    the market surveillance authorities and the tasks of those authorities, as well as any subsequent
    changes thereto.
  action: communicate to the Commission the identity and tasks of the notifying and market surveillance
    authorities, and any subsequent changes to them
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  mandatory_content:
  - identity of the notifying authorities and the market surveillance authorities
  - tasks of those authorities
  - any subsequent changes to that identity or those tasks
