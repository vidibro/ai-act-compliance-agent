records:
- norm_id: AIA-NORM-A070-P1-DESIGNATE-AND-SAFEGUARD-AUTHORITIES
  source: A070-P001
  quote: Each Member State shall establish or designate as national competent authorities at least one
    notifying authority and at least one market surveillance authority for the purposes of this Regulation.
  action: establish or designate at least one notifying authority and at least one market surveillance
    authority as national competent authorities for the purposes of this Regulation
  actors:
  - actor_ref: member_state
    category: member_state
  targets: []
  mandatory_content:
  - at least one notifying authority
  - at least one market surveillance authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A070-P1-INDEPENDENT-EXERCISE-OF-POWERS
  source: A070-P001
  quote: Those national competent authorities shall exercise their powers independently, impartially and
    without bias so as to safeguard the objectivity of their activities and tasks, and to ensure the application
    and implementation of this Regulation.
  action: exercise the authority's powers independently, impartially and without bias so as to safeguard
    the objectivity of its activities and tasks and to ensure the application and implementation of this
    Regulation
  actors:
  - actor_ref: national_competent_authority
    category: public_authority
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A070-P1-MEMBER-CONDUCT
  source: A070-P001
  quote: The members of those authorities shall refrain from any action incompatible with their duties.
  action: refrain from any action incompatible with the member's duties
  actors:
  - actor_ref: national_competent_authority_member
