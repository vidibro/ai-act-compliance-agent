- norm_id: AIA-NORM-A070-P3-ADEQUATE-RESOURCES-AND-COMPETENCE
  source: A070-P003
  quote: Member States shall ensure that their national competent authorities are provided with adequate technical, financial and human resources, and with infrastructure to fulfil their tasks effectively under this Regulation. In particular, the national competent authorities shall have a sufficient number of personnel permanently available whose competences and expertise shall include an in-depth understanding of AI technologies, data and data computing, personal data protection, cybersecurity, fundamental rights, health and safety risks and knowledge of existing standards and legal requirements. Member States shall assess and, if necessary, update competence and resource requirements referred to in this paragraph on an annual basis.
  action: provide and annually assess adequate authority resources infrastructure staffing and multidisciplinary expertise
  subject_ref: member_state
  subject_category: member_state
  mandatory_content: [technical financial and human resources, effective-task infrastructure, sufficient permanent personnel, enacted AI data privacy cybersecurity rights safety standards and legal expertise, annual assessment and necessary update]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
