- norm_id: AIA-NORM-A097-P3-REVOCATION-ENDS-DELEGATION
  source: A097-P003
  quote: A decision of revocation shall put an end to the delegation of power specified in that decision. It shall take effect the day following that of its publication in the Official Journal of the European Union or at a later date specified therein.
  action: end the delegation of power specified in the revocation decision, with effect the day
    following publication in the Official Journal of the European Union or on a later date specified
    in the decision
  subject_ref: european_parliament_or_council
  subject_category: union_institution_or_body
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
