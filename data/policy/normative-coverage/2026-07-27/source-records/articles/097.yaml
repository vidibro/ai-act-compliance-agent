- norm_id: AIA-NORM-A097-P6-DELEGATED-ACT-ENTRY-CONDITION
  source: A097-P006
  quote: shall enter into force only if no objection has been expressed by either the European Parliament or the Council within a period of three months of notification of that act to the European Parliament and the Council or if, before the expiry of that period, the European Parliament and the Council have both informed the Commission that they will not object.
  action: enter into force only where neither the European Parliament nor the Council objects within
    three months of notification, or where both inform the Commission before that period expires that
    they will not object
  subject_ref: delegated_act
  subject_category: other
  kind: legal_consequence
  conditions:
  - operator: any_of
    operands:
    - no objection has been expressed by either the European Parliament or the Council within a
      period of three months of notification of that act to them
    - before the expiry of that period, the European Parliament and the Council have both informed
      the Commission that they will not object
  product_scope: outside_supported_actor
  product_scope_reason: This institutional consequence is outside the supported operator surface.
  implementation_mode: none_required
  implementation_reason: No product implementation is required.
  verification_mode: not_reported
- norm_id: AIA-NORM-A097-P6-EXTEND-OBJECTION-PERIOD
  source: A097-P006
  quote: That period shall be extended by three months at the initiative of the European Parliament or of the Council.
  action: extend the objection period by three months
  subject_ref: european_parliament_or_council
  subject_category: union_institution_or_body
  kind: power
  conditions:
  - the European Parliament or the Council takes the initiative
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
