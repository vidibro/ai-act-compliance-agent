- norm_id: AIA-NORM-A097-P2-TACIT-EXTENSION
  source: A097-P002
  quote: The delegation of power shall be tacitly extended for periods of an identical duration
  action: extend delegated power automatically unless Parliament or Council timely opposes
  subject_ref: delegation_of_power
  subject_category: other
