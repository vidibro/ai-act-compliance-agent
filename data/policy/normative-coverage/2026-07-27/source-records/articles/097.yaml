- norm_id: AIA-NORM-A097-P5-NOTIFY-DELEGATED-ACT
  source: A097-P005
  quote: the Commission shall notify it simultaneously to the European Parliament and to the Council
  action: notify Parliament and Council simultaneously upon adopting a delegated act
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
