- norm_id: AIA-NORM-A097-P5-NOTIFY-DELEGATED-ACT
  source: A097-P005
  quote: As soon as it adopts a delegated act, the Commission shall notify it simultaneously to the European
    Parliament and to the Council.
  action: notify Parliament and Council simultaneously upon adopting a delegated act
  actors:
  - actor_ref: commission
  targets: []
