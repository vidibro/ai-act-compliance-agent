records:
- norm_id: AIA-NORM-A097-P1-CONFER-DELEGATED-POWER
  source: A097-P001
  quote: The power to adopt delegated acts is conferred on the Commission
  action: confer delegated-act power on the Commission subject to Article 97 conditions
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
