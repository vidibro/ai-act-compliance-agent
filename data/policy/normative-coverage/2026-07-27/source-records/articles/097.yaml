- norm_id: AIA-NORM-A097-P3-REVOKE-DELEGATION
  source: A097-P003
  quote: may be revoked at any time by the European Parliament or by the Council
  action: revoke at any time the delegation of power referred to in the enacted provisions
  subject_ref: european_parliament_or_council
