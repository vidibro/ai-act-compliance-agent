records:
- norm_id: AIA-NORM-A097-P1-CONFER-DELEGATED-POWER
  source: A097-P001
  quote: The power to adopt delegated acts is conferred on the Commission subject to the conditions laid
    down in this Article.
  action: confer delegated-act power on the Commission subject to Article 97 conditions
  actors:
  - actor_ref: commission
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A097-P2-DELEGATION-PERIODS
  source: A097-P002
  quote: The power to adopt delegated acts referred to in Article 6(6) and (7), Article 7(1) and (3),
    Article 11(3), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4) and Article 53(5)
    and (6) shall be conferred on the Commission for a period of five years from 1 August 2024. The power
    to adopt delegated acts referred to in Article 2(13) and Article 30(2) shall be conferred on the Commission
    for a period of five years from 27 July 2026.
  action: confer the listed Article 6, 7, 11, 43, 47, 51, 52 and 53 delegated powers for five years from
    1 August 2024 and the Article 2(13) and 30(2) powers for five years from 27 July 2026
  actors:
  - actor_ref: commission
  targets: []
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A097-P2-DELEGATION-REPORT
  source: A097-P002
  quote: The Commission shall draw up a report in respect of the delegation of power not later than nine
    months before the end of the five-year period.
  action: prepare a delegation-of-power report at least nine months before the five-year period ends
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A097-P2-TACIT-EXTENSION
  source: A097-P002
  quote: The delegation of power shall be tacitly extended for periods of an identical duration, unless
    the European Parliament or the Council opposes such extension no later than three months before the
    end of each period.
  action: extend delegated power automatically unless Parliament or Council timely opposes
  actors: none
  targets:
  - target_ref: delegation_of_power
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: This institutional consequence is outside the supported operator surface.
  implementation_mode: none_required
  implementation_reason: No product implementation is required.
  verification_mode: not_reported
  exceptions:
  - the European Parliament or the Council opposes the extension no later than three months before the
    end of the period
- norm_id: AIA-NORM-A097-P3-REVOKE-DELEGATION
  source: A097-P003
  quote: The delegation of power referred to in Article 2(13), Article 6(6) and (7), Article 7(1) and
    (3), Article 11(3), Article 30(2), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4)
    and Article 53(5) and (6) may be revoked at any time by the European Parliament or by the Council.
  action: revoke at any time the delegation of power referred to in the enacted provisions
  actors:
  - actor_ref: european_parliament
  - actor_ref: council
  targets: []
  kind: power
  product_scope: outside_supported_actor
