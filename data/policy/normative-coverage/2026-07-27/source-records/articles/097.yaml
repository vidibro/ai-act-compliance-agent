- norm_id: AIA-NORM-A097-P4-CONSULT-MEMBER-STATE-EXPERTS
  source: A097-P004
  quote: Before adopting a delegated act, the Commission shall consult experts designated by each Member
    State in accordance with the principles laid down in the Interinstitutional Agreement of 13 April
    2016 on Better Law-Making.
  action: consult Member-State experts before adopting a delegated act under the Better-Law-Making principles
