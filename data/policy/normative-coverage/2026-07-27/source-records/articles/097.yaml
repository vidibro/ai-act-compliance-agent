- norm_id: AIA-NORM-A097-P6-DELEGATED-ACT-ENTRY-CONDITION
  source: A097-P006
  quote: Any delegated act adopted pursuant to Article 2(13), Article 6(6) or (7), Article 7(1) or (3),
    Article 11(3), Article 30(2), Article 43(5) or (6), Article 47(5), Article 51(3), Article 52(4) or
    Article 53(5) or (6) shall enter into force only if no objection has been expressed by either the
    European Parliament or the Council within a period of three months of notification of that act to
    the European Parliament and the Council or if, before the expiry of that period, the European Parliament
    and the Council have both informed the Commission that they will not object.
  action: enter into force only where neither the European Parliament nor the Council objects within three
    months of notification, or where both inform the Commission before that period expires that they will
    not object
  actors: none
  targets:
  - target_ref: delegated_act
  kind: legal_consequence
  conditions:
  - operator: any_of
    operands:
    - no objection has been expressed by either the European Parliament or the Council within a period
      of three months of notification of that act to them
    - before the expiry of that period, the European Parliament and the Council have both informed the
      Commission that they will not object
  product_scope: outside_supported_actor
  product_scope_reason: This institutional consequence is outside the supported operator surface.
  implementation_mode: none_required
  implementation_reason: No product implementation is required.
  verification_mode: not_reported
- norm_id: AIA-NORM-A097-P6-EXTEND-OBJECTION-PERIOD
  source: A097-P006
  quote: That period shall be extended by three months at the initiative of the European Parliament or
    of the Council.
  action: extend the objection period by three months
  actors:
  - actor_ref: european_parliament
  - actor_ref: council
  targets: []
  kind: power
  conditions:
