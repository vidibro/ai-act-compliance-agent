- norm_id: AIA-NORM-A097-P2-DELEGATION-PERIODS
  source: A097-P002
  quote: shall be conferred on the Commission for a period of five years
  action: apply the specified five-year periods to the listed delegated powers
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: legal_consequence
  product_scope: outside_supported_actor
