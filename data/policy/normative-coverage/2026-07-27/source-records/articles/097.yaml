- norm_id: AIA-NORM-A097-P2-DELEGATION-REPORT
  source: A097-P002
  quote: The Commission shall draw up a report in respect of the delegation of power
  action: prepare a delegation-of-power report at least nine months before the five-year period ends
  subject_ref: commission
  subject_category: union_institution_or_body
