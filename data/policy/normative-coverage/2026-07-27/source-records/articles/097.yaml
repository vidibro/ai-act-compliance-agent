- norm_id: AIA-NORM-A097-P4-CONSULT-MEMBER-STATE-EXPERTS
  source: A097-P004
  quote: the Commission shall consult experts designated by each Member State
  action: consult Member-State experts before adopting a delegated act under the Better-Law-Making principles
  subject_ref: commission
