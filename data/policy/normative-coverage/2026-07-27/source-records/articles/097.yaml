  verification_mode: not_reported
- norm_id: AIA-NORM-A097-P3-PRESERVE-ACTS-IN-FORCE
  source: A097-P003
  quote: It shall not affect the validity of any delegated acts already in force.
  action: preserve the validity of any delegated acts already in force
  subject_ref: european_parliament_or_council
  subject_category: union_institution_or_body
