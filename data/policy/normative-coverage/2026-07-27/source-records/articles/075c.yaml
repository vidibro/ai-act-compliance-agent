- norm_id: AIA-NORM-A075C-P4-IMPOSE-PENALTIES
  source: A075C-P004
  quote: A decision adopted pursuant to paragraph 1 of this Article may be accompanied by the imposition
    of penalties in accordance with Article 99(3) to (7), which provisions shall apply mutatis mutandis
    to the AI Office in the execution of its supervision and enforcement tasks referred to in Article
    75(1).
  action: accompany a non-compliance decision with Article 99 penalties adapted to AI Office enforcement
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075C-P004]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
