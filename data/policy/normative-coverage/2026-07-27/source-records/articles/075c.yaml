- norm_id: AIA-NORM-A075C-P8-FIVE-YEAR-INFRINGEMENT-LIMIT
  source: A075C-P021
  quote: The powers conferred on the AI Office by this Article shall be subject to a limitation period
    of five years. The limitation period shall begin to run on the day on which the infringement is committed.
    However, in the case of continuing or repeated infringements, the limitation period shall begin to
    run on the day on which the infringement ceases.
  action: apply a five-year infringement limitation period from commission or cessation for continuing
    or repeated infringements
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075C-P021]
  targets: []
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: This institutional consequence is outside the supported operator surface.
  implementation_mode: none_required
  implementation_reason: No product implementation is required.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075C-P8-FIVE-YEAR-DECISION-LIMIT
  source: A075C-P022
  quote: The power of the AI Office to enforce decisions taken pursuant to this Article shall be subject
    to a limitation period of five years. The limitation period shall begin to run on the day on which
    the decision becomes final.
  action: apply a five-year final-decision enforcement limitation period
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075C-P022]
  targets: []
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: This institutional consequence is outside the supported operator surface.
  implementation_mode: none_required
  implementation_reason: No product implementation is required.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075C-P8-SPECIFY-LIMITATION-PERIODS
  source: A075C-P023
  quote: The implementing act referred to in Article 75d(3) shall specify the first and second subparagraphs
    of this paragraph, including the circumstances in which the limitation periods shall be interrupted.
  action: specify infringement and decision-enforcement limitation rules including interruption circumstances
    in the Article 75d(3) implementing act
