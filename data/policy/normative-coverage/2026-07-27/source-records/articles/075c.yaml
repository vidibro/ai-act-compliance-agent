- norm_id: AIA-NORM-A075C-P2-EXPLAIN-CONTEMPLATED-MEASURES
  source: A075C-P002
  quote: In the preliminary findings, the AI Office shall explain the measures that it is considering
    taking, or that it considers that the operator concerned should take, in order to effectively address
    the preliminary findings.
  action: explain contemplated AI Office measures and measures the operator should take in the preliminary
    findings
