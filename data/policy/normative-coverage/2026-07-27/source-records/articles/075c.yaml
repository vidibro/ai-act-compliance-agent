- norm_id: AIA-NORM-A075C-P3-ORDER-COMPLIANCE-MEASURES
  source: A075C-P003
  quote: In the decision pursuant to paragraph 1 of this Article, the AI Office shall, where relevant,
    order the operator concerned to take the necessary measures to ensure compliance with the relevant
    provisions of this Regulation within a reasonable period specified therein and to provide information
    on the measures that that operator intends to take to comply with the decision.
  action: order necessary compliance measures within a reasonable specified period and information about
    intended measures
  mandatory_content:
  - the necessary measures to ensure compliance within a reasonable period specified in the decision
  - information on the measures the operator intends to take to comply with the decision
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075C-P003]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: all_of
    operands:
    - text: where relevant
      basis_segment_ids: [AIA-TEXT-A075C-P003]
- norm_id: AIA-NORM-A075C-P3-DESCRIBE-IMPLEMENTED-MEASURES
  source: A075C-P003
  quote: The operator concerned shall provide the AI Office with a description of the measures it has
    taken to ensure compliance with the decision upon their implementation.
  action: describe implemented measures ensuring compliance with the AI Office decision, once they are
    implemented
  actors:
  - actor_ref: operator
    basis_segment_ids: [AIA-TEXT-A075C-P003]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: order the operator concerned to take the necessary measures to ensure compliance with the relevant provisions of this Regulation
      basis_segment_ids: [AIA-TEXT-A075C-P003]
    - text: upon their implementation
      basis_segment_ids: [AIA-TEXT-A075C-P003]
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: in_scope
  product_scope_reason: This is an enforcement-response duty for a supported operator.
  implementation_mode: compliance_rule
  implementation_refs:
