records:
- norm_id: AIA-NORM-A075C-P1-ESTABLISH-NONCOMPLIANCE
  source: A075C-P001
  quote: Where the AI Office finds that an operator falling within the scope of Article 75(1) does not
    comply with the relevant provisions of this Regulation or with commitments made binding pursuant to
    Article 75b, it shall adopt a decision establishing such non-compliance.
  action: adopt a decision establishing detected AI Act or binding-commitment non-compliance
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075C-P001]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: any_of
    operands:
    - text: Where the AI Office finds that an operator falling within the scope of Article 75(1) does not comply with the relevant provisions of this Regulation
      basis_segment_ids: [AIA-TEXT-A075C-P001]
    - text: with commitments made binding pursuant to Article 75b
      basis_segment_ids: [AIA-TEXT-A075C-P001]
- norm_id: AIA-NORM-A075C-P2-COMMUNICATE-PRELIMINARY-FINDINGS
