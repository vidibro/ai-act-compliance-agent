  verification_mode: not_reported
- norm_id: AIA-NORM-A075C-P9-CLOSE-PROCEEDING
  source: A075C-P024
  quote: Where the AI Office determines that there are no grounds to adopt a decision of non-compliance,
    it shall close the proceeding by a decision. That decision shall apply with immediate effect.
  action: close proceedings immediately by decision when no grounds for non-compliance exist
