  verification_mode: not_reported
- norm_id: AIA-NORM-A075C-P4-ARTICLE99-4-FINES
  source: A075C-P005
  quote: 'In particular, the following shall be subject to administrative fines as referred to in Article
    99(4):'
  action: expose listed infringements decision breaches and binding-commitment breaches to Article 99(4)
    fines
  actors:
  - actor_ref: operator
    basis_segment_ids: [AIA-TEXT-A075C-P001]
  targets: []
  kind: legal_consequence
  mandatory_content:
  - infringement of any applicable AI Act provision
  - failure to comply with specified decisions or measures
  - failure to comply with a binding Article 75b commitment
  qualifier_spans:
  - A075C-P006
  - A075C-P007
  - A075C-P008
  conditions:
    operator: any_of
    operands:
    - text: infringement of any applicable provision of this Regulation, including those not listed in Article 99(4)
      basis_segment_ids: [AIA-TEXT-A075C-P006]
    - text: failure to comply with decisions or measures adopted pursuant to the powers listed in Article 14(4) or Article 16(3) of Regulation (EU) 2019/1020, as well as those specified in Article 75a of this Regulation
      basis_segment_ids: [AIA-TEXT-A075C-P007]
    - text: failure to comply with a commitment made binding by a decision pursuant to Article 75b
      basis_segment_ids: [AIA-TEXT-A075C-P008]
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: no_product_action
  product_scope_reason: This is an enforcement consequence rather than an independent product action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075C-P4-INFORMATION-FINE
  source: A075C-P009
  quote: The supply of incorrect, incomplete or misleading information to the AI Office in reply to a
    request shall be subject to administrative fines as referred to in Article 99(5).
  action: expose incorrect incomplete or misleading requested information supplied to the AI Office to
    Article 99(5) fines
