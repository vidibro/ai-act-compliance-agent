- norm_id: AIA-NORM-A075C-P5-IMPOSE-PERIODIC-PENALTIES
  source: A075C-P010
  quote: 'The AI Office may adopt a decision imposing periodic penalty payments to compel the operators
    subject to its competence pursuant to Article 75(1) to the following:'
  action: impose periodic penalty payments compelling specified investigation information inspection correction
    and compliance conduct
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075C-P010]
  targets: []
  kind: power
  mandatory_content:
  - submit to investigation
  - comply with a decided information request
  - submit to a decided inspection
  - provide correct or complete inspection answers
  - comply with ordered corrective actions
  - comply with binding commitments
  - comply with an Article 75c(1) decision
  qualifier_spans:
  - A075C-P011
  - A075C-P012
  - A075C-P013
  - A075C-P014
  - A075C-P015
  - A075C-P016
  - A075C-P017
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075C-P5-PENALTY-PAYMENT-LIMITS
  source: A075C-P018
  quote: Those penalty payments shall be effective and proportionate, and, where applicable, shall not
    exceed 5 % of the average daily income or worldwide annual turnover in the preceding financial year
    per day, calculated from the date appointed by the decision.
  action: make periodic penalty payments effective and proportionate and, where applicable, keep them
    within 5 % of average daily income or worldwide annual turnover in the preceding financial year per
    day from the date appointed by the decision
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075C-P010]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - make the penalty payments effective and proportionate
  - the basis is the average daily income or worldwide annual turnover
  - the reference period is the preceding financial year
  - the ceiling of 5 % applies per day
  - the days are counted from the date appointed by the decision
- norm_id: AIA-NORM-A075C-P6-JUDICIAL-REVIEW
  source: A075C-P019
  quote: The Court of Justice of the European Union shall have unlimited jurisdiction to review decisions
    of the AI Office fixing a fine or periodic penalty payment pursuant to this Article. It may cancel,
    reduce or increase the fine or periodic penalty payment imposed.
  action: review and cancel reduce or increase AI Office fines and periodic penalty payments with unlimited
    jurisdiction
  actors:
  - actor_ref: court_of_justice_of_the_european_union
    basis_segment_ids: [AIA-TEXT-A075C-P019]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
