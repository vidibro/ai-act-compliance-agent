records:
- norm_id: AIA-NORM-A044-P1-CERTIFICATE-LANGUAGE
  source: A044-P001
  quote: Certificates issued by notified bodies in accordance with Annex VII shall be drawn-up in a language
    which can be easily understood by the relevant authorities in the Member State in which the notified
    body is established.
  action: issue Annex VII certificates in a language easily understood by the relevant establishment-state
    authorities
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A044-P2-CERTIFICATE-VALIDITY-PERIOD
  source: A044-P002
  quote: Certificates shall be valid for the period they indicate, which shall not exceed five years for
    AI systems covered by Annex I, and four years for AI systems covered by Annex III.
  action: limit indicated certificate validity to five years for Annex I systems and four years for Annex
    III systems
  subject_ref: certificate_holder
  subject_category: supported_operator
  kind: legal_consequence
  implementation_mode: missing
  verification_mode: unresolved
- norm_id: AIA-NORM-A044-P2-EXTEND-CERTIFICATE
  source: A044-P002
  quote: At the request of the provider, the validity of a certificate may be extended for further periods,
    each not exceeding five years for AI systems covered by Annex I, and four years for AI systems covered
    by Annex III, based on a re-assessment in accordance with the applicable conformity assessment procedures.
  action: extend certificate validity after provider request and applicable reassessment within the enacted
    duration caps
  subject_ref: provider
  subject_category: supported_operator
  kind: entitlement
  implementation_mode: missing
  verification_mode: unresolved
  conditions:
  - the provider requests the extension
  - applicable conformity-assessment procedures are used for reassessment
- norm_id: AIA-NORM-A044-P2-SUPPLEMENT-VALIDITY
  source: A044-P002
  quote: Any supplement to a certificate shall remain valid, provided that the certificate which it supplements
    is valid.
  action: preserve a certificate supplement's validity while its underlying certificate remains valid
  subject_ref: certificate_holder
  subject_category: supported_operator
  kind: legal_consequence
  implementation_mode: missing
  verification_mode: unresolved
  conditions:
  - the underlying certificate remains valid
- norm_id: AIA-NORM-A044-P3-CERTIFICATE-MEASURE
  source: A044-P003
  quote: Where a notified body finds that an AI system no longer meets the requirements set out in Section
    2, it shall, taking account of the principle of proportionality, suspend or withdraw the certificate
    issued or impose restrictions on it, unless compliance with those requirements is ensured by appropriate
    corrective action taken by the provider of the system within an appropriate deadline set by the notified
    body.
  action: proportionately suspend, withdraw, or restrict a certificate after Section 2 noncompliance unless
    timely corrective action restores compliance
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A044-P3-CORRECTIVE-ACTION-EXCEPTION
  source: A044-P003
  quote: unless compliance with those requirements is ensured by appropriate corrective action taken by
    the provider of the system within an appropriate deadline set by the notified body
  action: avoid certificate suspension, withdrawal, or restriction by restoring compliance through appropriate
    corrective action within the notified-body deadline
  subject_ref: provider
  subject_category: supported_operator
  kind: legal_consequence
  implementation_mode: missing
  verification_mode: unresolved
- norm_id: AIA-NORM-A044-P3-GIVE-REASONS
  source: A044-P003
  quote: The notified body shall give reasons for its decision.
  action: give reasons for the certificate decision
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A044-P3-APPEAL-PROCEDURE
  source: A044-P004
  quote: An appeal procedure against decisions of the notified bodies, including on conformity certificates
    issued, shall be available.
  action: make an appeal procedure available against notified-body decisions, including certificate decisions
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
