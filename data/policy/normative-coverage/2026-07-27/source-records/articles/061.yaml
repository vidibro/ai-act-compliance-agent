records:
- norm_id: AIA-NORM-A061-P1-OBTAIN-INFORMED-CONSENT
  source: A061-P001
  quote: 'For the purpose of testing in real world conditions under Article 60, freely-given informed consent shall be obtained from the subjects of testing prior to their participation in such testing and after their having been duly informed with concise, clear, relevant, and understandable information regarding:'
  action: obtain freely given informed consent from the testing subjects before their participation
    in Article 60 testing, after duly informing them with concise, clear, relevant and understandable
    information on every enacted matter
  actors:
  - actor_ref: provider_or_prospective_provider
    category: supported_operator
  targets: []
  mandatory_content:
  - the nature and objectives of the testing in real world conditions and the possible
    inconvenience that may be linked to their participation
  - the conditions under which the testing in real world conditions is to be conducted,
    including the expected duration of the subject or subjects’ participation
  - their rights, and the guarantees regarding their participation, in particular their right
    to refuse to participate in, and the right to withdraw from, testing in real world
    conditions at any time without any resulting detriment and without having to provide any
    justification
  - the arrangements for requesting the reversal or the disregarding of the predictions,
    recommendations or decisions of the AI system
  - the Union-wide unique single identification number of the testing in real world conditions
    in accordance with Article 60(4) point (c), and the contact details of the provider or its
    legal representative from whom further information can be obtained
  qualifier_spans: [A061-P002, A061-P003, A061-P004, A061-P005, A061-P006]
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A061-P2-DOCUMENT-AND-COPY-CONSENT
  source: A061-P007
  quote: The informed consent shall be dated and documented
  action: date and document the informed consent
  actors:
  - actor_ref: provider_or_prospective_provider
    category: supported_operator
  targets: []
  mandatory_content: [dated consent, documented consent]
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A061-P2-GIVE-CONSENT-COPY
  source: A061-P007
  quote: a copy shall be given to the subjects of testing or their legal representative.
  action: give a copy of the informed consent to the subjects of testing or their legal
    representative
  actors:
  - actor_ref: provider_or_prospective_provider
    category: supported_operator
  targets: []
  verification_mode: reported_conditionally
  verified_by: vidibro
