  mandatory_content:
  - provider identification under Article 16(b)
  - provider quality-management system under Article 16(c)
  - importer identification under Article 23(3)
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P2-WITHHOLD-NONCONFORMING-SYSTEM
  source: A024-P002
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: Where a distributor considers or has reason to consider, on the basis of the information in its
    possession, that a high-risk AI system is not in conformity with the requirements set out in Section
    2, it shall not make the high-risk AI system available on the market until the system has been brought
    into conformity with those requirements.
  action: withhold a suspected Section 2 non-conforming system from the market until it has been brought
    into conformity
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Where a distributor considers or has reason to consider, on the basis of the information in its possession, that a high-risk AI system is not in conformity with the requirements set out in Section 2
      basis_segment_ids: [AIA-TEXT-A024-P002]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P2-INFORM-RISK
  source: A024-P002
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor
    shall inform the provider or the importer of the system, as applicable, to that effect
  action: inform the provider or importer, as applicable, that the system presents an Article 79(1) risk
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  conditions: &id003
    operator: all_of
    operands:
    - text: where the high-risk AI system presents a risk within the meaning of Article 79(1)
      basis_segment_ids: [AIA-TEXT-A024-P002]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P3-PRESERVE-COMPLIANCE
  source: A024-P003
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: Distributors shall ensure that, while a high-risk AI system is under their responsibility, storage
    or transport conditions, where applicable, do not jeopardise the compliance of the system with the
    requirements set out in Section 2.
  action: ensure applicable storage and transport conditions do not jeopardise Section 2 compliance while
    the system is under the distributor's responsibility
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: while a high-risk AI system is under their responsibility
      basis_segment_ids: [AIA-TEXT-A024-P003]
    - text: where applicable
      basis_segment_ids: [AIA-TEXT-A024-P003]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P4-CORRECTIVE-RESPONSE
  source: A024-P004
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: shall take the corrective actions necessary to bring that system into conformity with those requirements,
    to withdraw it or recall it, or shall ensure that the provider, the importer or any relevant operator,
    as appropriate, takes those corrective actions
  action: take the necessary conformity, withdrawal, or recall action, or ensure an appropriate relevant
    operator takes it
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: A distributor that considers or has reason to consider, on the basis of the information in its possession, a high-risk AI system which it has made available on the market not to be in conformity with the requirements set out in Section 2
      basis_segment_ids: [AIA-TEXT-A024-P004]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P4-NOTIFY-RISK
  source: A024-P004
  temporal_regime_id: AIA-TEMP-A024-P4-IMMEDIATE-RISK-NOTICE
  quote: Where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor
    shall immediately inform the provider or importer of the system and the authorities competent for
    the high-risk AI system concerned, giving details, in particular, of the non-compliance and of any
    corrective actions taken.
  action: immediately notify the provider or importer and competent authorities of the risk, non-compliance,
    and corrective actions
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Where the high-risk AI system presents a risk within the meaning of Article 79(1)
      basis_segment_ids: [AIA-TEXT-A024-P004]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  mandatory_content:
  - notification to the provider or importer
  - notification to the authorities competent for the system
  - details of the non-compliance
  - details of corrective actions taken
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P5-PROVIDE-ACTION-INFORMATION
  source: A024-P005
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: Upon a reasoned request from a relevant competent authority, distributors of a high-risk AI system
    shall provide that authority with all the information and documentation regarding their actions pursuant
    to paragraphs 1 to 4 necessary to demonstrate the conformity of that system with the requirements
    set out in Section 2.
  action: provide a requesting authority with information and documentation about paragraph 1 to 4 actions
    necessary to demonstrate Section 2 conformity
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Upon a reasoned request from a relevant competent authority
      basis_segment_ids: [AIA-TEXT-A024-P005]
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P6-COOPERATE
  source: A024-P006
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: Distributors shall cooperate with the relevant competent authorities in any action those authorities
    take in relation to a high-risk AI system made available on the market by the distributors, in particular
    to reduce or mitigate the risk posed by it.
  action: cooperate in competent-authority actions concerning systems the distributor made available,
    particularly risk reduction or mitigation
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
