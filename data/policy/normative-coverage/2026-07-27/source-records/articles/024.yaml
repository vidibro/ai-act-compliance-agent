  - AIA-RULE-DI-A24
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A024-P1-VERIFY-ACCOMPANYING-DOCUMENTS
  source: A024-P001
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: that it is accompanied by a copy of the EU declaration of conformity referred to in Article 47
