- norm_id: AIA-NORM-A024-P1-VERIFY-OPERATOR-COMPLIANCE
  source: A024-P001
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: that the provider and the importer of that system, as applicable, have complied with their respective
    obligations as laid down in Article 16, points (b) and (c) and Article 23(3)
  action: verify applicable provider and importer compliance with the three specified identification and
    quality-management duties
  actors:
  - actor_ref: distributor
    basis_segment_ids: [AIA-TEXT-A024-P001]
  targets: []
  conditions: *id001
