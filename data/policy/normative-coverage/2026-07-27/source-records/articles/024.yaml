  source: A024-P001
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  quote: Before making a high-risk AI system available on the market, distributors shall verify that it
    bears the required CE marking
  action: verify the required CE marking before making a high-risk AI system available on the market
