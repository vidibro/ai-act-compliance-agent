records:
- norm_id: AIA-NORM-A092-P1-CONDUCT-GPAI-EVALUATION
  source: A092-P001
  quote: The AI Office, after consulting the Board, may conduct evaluations of the general-purpose AI
    model concerned
  action: conduct evaluations of the general-purpose AI model concerned, after consulting the Board, for
    either enacted purpose
  actors:
  - actor_ref: ai_office
  targets: []
  kind: power
  conditions:
  - the AI Office has consulted the Board
  - operator: any_of
    operands:
    - to assess compliance of the provider with obligations under this Regulation, where the information
      gathered pursuant to Article 91 is insufficient
    - to investigate systemic risks at Union level of general-purpose AI models with systemic risk, in
      particular following a qualified alert from the scientific panel in accordance with Article 90(1),
      point (a)
  qualifier_spans:
  - A092-P002
  - A092-P003
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A092-P2-APPOINT-INDEPENDENT-EXPERTS
  source: A092-P004
  quote: The Commission may decide to appoint independent experts to carry out evaluations on its behalf,
    including from the scientific panel established pursuant to Article 68. Independent experts appointed
    for this task shall meet the criteria outlined in Article 68(2).
  action: appoint Article 68(2)-qualified independent experts to carry out evaluations for the Commission
  actors:
  - actor_ref: commission
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A092-P3-REQUEST-MODEL-ACCESS
  source: A092-P005
  quote: For the purposes of paragraph 1, the Commission may request access to the general-purpose AI
    model concerned through APIs or further appropriate technical means and tools, including source code.
  action: request access to the GPAI model through APIs source code or other appropriate technical means
  actors:
  - actor_ref: commission
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - access is requested for an evaluation purpose specified in paragraph 1
- norm_id: AIA-NORM-A092-P4-ACCESS-REQUEST-CONTENT
  source: A092-P006
  quote: The request for access shall state the legal basis, the purpose and reasons of the request and
    set the period within which the access is to be provided, and the fines provided for in Article 101
    for failure to provide access.
  action: include legal basis purpose reasons access period and applicable Article 101 fines in a model-access
    request
  actors:
  - actor_ref: commission
  targets: []
  mandatory_content:
  - legal basis
  - purpose and reasons
  - access period
  - Article 101 fines for failure to provide access
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A092-P5-SUPPLY-REQUESTED-INFORMATION
  source: A092-P007
  quote: The providers of the general-purpose AI model concerned or its representative shall supply the
    information requested.
  action: supply the information requested following a Commission request for model access
  actors:
  - actor_ref: gpai_provider
  - actor_ref: authorised_representative
  targets: []
  conditions:
  - the Commission requested access to the model under Article 92(3)
  implementation_refs:
  - AIA-GP-A92-5
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A092-P5-AUTHORISED-PERSON-PROVIDE-ACCESS
  source: A092-P007
  quote: In the case of legal persons, companies or firms, or where the provider has no legal personality,
    the persons authorised to represent them by law or by their statutes, shall provide the access requested
    on behalf of the provider of the general-purpose AI model concerned.
  action: provide requested model access on behalf of a legal-person or non-legal-personality GPAI provider
  actors:
  - actor_ref: legal_representative
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - operator: any_of
    operands:
    - the provider is a legal person, company, or firm
    - the provider has no legal personality
- norm_id: AIA-NORM-A092-P6-ADOPT-EVALUATION-ARRANGEMENTS
  source: A092-P008
  quote: The Commission shall adopt implementing acts setting out the detailed arrangements and the conditions
    for the evaluations, including the detailed arrangements for involving independent experts, and the
    procedure for the selection thereof. Those implementing acts shall be adopted in accordance with the
    examination procedure referred to in Article 98(2).
  action: adopt evaluation arrangements conditions and independent-expert selection procedures through
    the Article 98(2) examination procedure
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A092-P7-INITIATE-STRUCTURED-DIALOGUE
  source: A092-P009
  quote: Prior to requesting access to the general-purpose AI model concerned, the AI Office may initiate
    a structured dialogue with the provider of the general-purpose AI model to gather more information
    on the internal testing of the model, internal safeguards for preventing systemic risks, and other
    internal procedures and measures the provider has taken to mitigate such risks.
  action: initiate pre-access dialogue about internal testing safeguards procedures and systemic-risk
    mitigations
  actors:
  - actor_ref: ai_office
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
