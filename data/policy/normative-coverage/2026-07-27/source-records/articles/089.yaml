records:
- norm_id: AIA-NORM-A089-P1-MONITOR-GPAI-COMPLIANCE
  source: A089-P001
  quote: For the purpose of carrying out the tasks assigned to it under this Section, the AI Office may
    take the necessary actions to monitor the effective implementation and compliance with this Regulation
    by providers of general-purpose AI models, including their adherence to approved codes of practice.
  action: take necessary actions monitoring GPAI-provider compliance and adherence to approved codes of
    practice
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A089-P001]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: all_of
    operands:
    - text: For the purpose of carrying out the tasks assigned to it under this Section
      basis_segment_ids: [AIA-TEXT-A089-P001]
- norm_id: AIA-NORM-A089-P2-LODGE-DOWNSTREAM-COMPLAINT
  source: A089-P002
  quote: Downstream providers shall have the right to lodge a complaint alleging an infringement of this
    Regulation.
  action: lodge a complaint alleging a GPAI provider's infringement of this Regulation, duly reasoned and
    indicating at least the provider's point of contact, the relevant facts, provisions and reasons, and
    any other relevant information
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A089-P002]
  targets: []
  kind: entitlement
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_mode: report_only
  implementation_refs: [AIA-RULE-PO-A53-7]
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A089-P2-COMPLAINT-CONTENT
  source: A089-P002
  quote: A complaint shall be duly reasoned and indicate at least
  action: duly reason and include the minimum required information in a downstream-provider complaint
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A089-P002]
  targets: []
  mandatory_content:
  - GPAI provider point of contact
  - relevant facts provisions and reasons supporting alleged infringement
  - any other information considered relevant including information gathered on the complainant's initiative
  qualifier_spans:
  - A089-P003
  - A089-P004
  - A089-P005
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_mode: carried_by_other_norm
  implementation_reason: Carried by the Article 89(2) complaint right, whose action states the content.
  verification_mode: reported_not_judged
  verified_by: vidibro
