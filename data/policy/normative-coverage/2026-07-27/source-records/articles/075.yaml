- norm_id: AIA-NORM-A075-P1-COMPETENCE
  source: A075-P001
  quote: 'The AI Office shall be exclusively competent for the supervision and enforcement of the obligations
    under this Regulation in relation to the following AI systems:'
  action: hold exclusive supervision and enforcement competence for AI systems based on general-purpose
    AI models developed by the same provider or undertaking, except the four excluded classes
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075-P001]
  targets: []
  kind: legal_consequence
  exceptions:
    operator: any_of
    operands:
    - text: AI systems related to products covered by the Union harmonisation legislation listed in Annex I
      basis_segment_ids: [AIA-TEXT-A075-P003]
    - text: AI systems referred to in point 2 of Annex III
      basis_segment_ids: [AIA-TEXT-A075-P004]
    - text: AI systems provided by law enforcement authorities, border management authorities and financial institutions, insofar as those AI systems fall under Article 74(6)
      basis_segment_ids: [AIA-TEXT-A075-P005]
    - text: AI systems referred to in point 8 of Annex III as regards the administration of justice
      basis_segment_ids: [AIA-TEXT-A075-P006]
  qualifier_spans:
  - A075-P002
  - A075-P003
  - A075-P004
  - A075-P005
  - A075-P006
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: all_of
    operands:
    - text: AI systems based on general-purpose AI models where the model and the system are developed by the same provider, or by providers forming part of the same undertaking as that provider
      basis_segment_ids: [AIA-TEXT-A075-P002]
