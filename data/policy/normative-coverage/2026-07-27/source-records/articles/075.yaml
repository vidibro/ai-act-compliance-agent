- norm_id: AIA-NORM-A075-P2A-REQUEST-ASSESSMENT
  source: A075-P016
  quote: Where a market surveillance authority has well-founded and sufficient reasons to suspect that
    a provider or a deployer of an AI system referred to in paragraph 1 of this Article has infringed
    this Regulation, it may request, through the relevant single point of contact designated in accordance
    with Article 70(2), the AI Office to assess the matter in order to take the necessary supervisory
    and enforcement measures to ensure prompt compliance with this Regulation. Such a request shall be
    duly reasoned and shall include at least
  action: request, through the relevant Article 70(2) single point of contact, a duly reasoned AI Office
    assessment of the matter so that the necessary supervisory and enforcement measures ensure prompt
    compliance
  actors:
  - actor_ref: market_surveillance_authority
    basis_segment_ids: [AIA-TEXT-A075-P016]
  targets: []
  kind: power
  mandatory_content:
