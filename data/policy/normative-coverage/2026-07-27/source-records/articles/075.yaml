records:
- norm_id: AIA-NORM-A075-P1-COMPETENCE
  source: A075-P001
  quote: 'The AI Office shall be exclusively competent for the supervision and enforcement of the obligations under this Regulation in relation to the following AI systems:'
  action: hold exclusive supervision and enforcement competence for the listed systems
  subject_ref: ai_office
  subject_category: union_institution_or_body
  kind: legal_consequence
  mandatory_content: [same-provider or same-undertaking general-purpose-model systems subject to the enacted exclusions, very large online platform or search-engine systems]
  qualifier_spans: [A075-P002, A075-P003, A075-P004, A075-P005, A075-P006, A075-P007]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A075-P1-COMPETENCE-ADDRESSEES
  source: A075-P008
  quote: The exclusive competence referred to in the first subparagraph shall apply to the providers of those systems. It shall apply to the deployers of those systems only when they are also the provider or form part of the same undertaking as the provider.
  action: apply the AI Office's exclusive competence to providers and only to deployers that are the provider or in its undertaking
  subject_ref: ai_office
  subject_category: union_institution_or_body
  kind: applicability
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A075-P1A-REPORT-SERIOUS-INCIDENTS
  source: A075-P009
  quote: providers of high-risk AI systems subject to the competence of the AI Office pursuant to paragraph 1 of this Article shall report any serious incidents to the AI Office
  action: report serious incidents for high-risk systems under AI Office competence to the AI Office using the Article 73(2) to (9) procedure
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A75-1a]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A075-P1A-TRANSMIT-INCIDENT-INFORMATION
  source: A075-P009
  quote: The AI Office shall promptly transmit the relevant information to the market surveillance authority of the Member State in the territory of which the provider or its legal representative is situated.
  action: promptly transmit relevant incident information to the territorially competent market surveillance authority
  subject_ref: ai_office
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
