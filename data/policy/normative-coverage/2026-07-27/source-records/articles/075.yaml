- norm_id: AIA-NORM-A075-P2A-RESPOND-AND-UPDATE
  source: A075-P021
  quote: The AI Office shall, without undue delay and in any event no later than four months following receipt of the request, inform the single point of contact of its intention to exercise its powers in accordance with Article 75a or of its reasons for not exercising its powers.
  action: respond within four months and periodically report major developments and outcome when exercising Article 75a powers
  subject_ref: ai_office
  subject_category: union_institution_or_body
  mandatory_content: [intention to exercise Article 75a powers or reasons not to do so, periodic major-development updates when powers are exercised, proceeding outcome without confidential information]
