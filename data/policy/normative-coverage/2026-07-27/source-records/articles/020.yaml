records:
- norm_id: AIA-NORM-A020-P1-CORRECTIVE-RESPONSE
  source: A020-P001
  quote: Providers of high-risk AI systems which consider or have reason to consider that a high-risk
    AI system that they have placed on the market or put into service is not in conformity with this Regulation
    shall immediately take the necessary corrective actions to bring that system into conformity, to withdraw
    it, to disable it, or to recall it, as appropriate.
  action: immediately take the appropriate corrective response by bringing a non-conforming system into
    conformity, withdrawing it, disabling it, or recalling it
  subject_ref: provider
  subject_category: supported_operator
  conditions: &id001
  - the provider considers or has reason to consider that a high-risk system it placed on the market or
    put into service is non-conforming
  implementation_refs: &id002
  - AIA-PO-A20
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A020-P1-INFORM-SUPPLY-CHAIN
  source: A020-P001
  quote: They shall inform the distributors of the high-risk AI system concerned and, where applicable,
    the deployers, the authorised representative and importers accordingly.
  action: inform the distributor and, where applicable, deployers, the authorised representative, and
    importers about the non-conforming system and corrective response
  subject_ref: provider
  subject_category: supported_operator
  conditions: *id001
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A020-P2-INVESTIGATE-RISK
  source: A020-P002
  quote: Where the high-risk AI system presents a risk within the meaning of Article 79(1) and the provider
    becomes aware of that risk, it shall immediately investigate the causes, in collaboration with the
    reporting deployer, where applicable
  action: immediately investigate the causes of an Article 79(1) risk, collaborating with the reporting
    deployer where applicable
  subject_ref: provider
  subject_category: supported_operator
  conditions: &id003
  - the high-risk AI system presents an Article 79(1) risk and the provider becomes aware of it
  implementation_refs: &id004
  - AIA-PO-A20-2
  verification_mode: reported_not_judged
  dependencies:
  - dependency_ref: Article 79(1) of this Regulation
    resolution: unresolved
    detail: Article 79(1) defines the referenced risk situation and has not yet been semantically reviewed.
  verified_by: vidibro
- norm_id: AIA-NORM-A020-P2-INFORM-AUTHORITIES
  source: A020-P002
  quote: inform the market surveillance authorities competent for the high-risk AI system concerned and,
    where applicable, the notified body that issued a certificate for that high-risk AI system in accordance
    with Article 44, in particular, of the nature of the non-compliance and of any relevant corrective
    action taken
  action: "inform the competent market-surveillance authorities and, where applicable, the certifying\
    \ notified body of the non-compliance\u2019s nature and relevant corrective actions"
  subject_ref: provider
  subject_category: supported_operator
  conditions: *id003
  implementation_refs: *id004
  verification_mode: reported_not_judged
  dependencies:
  - dependency_ref: Article 44 of this Regulation
    resolution: unresolved
    detail: Article 44 supplies the referenced certification framework and has not yet been semantically
      reviewed.
  verified_by: vidibro
