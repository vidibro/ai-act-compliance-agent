temporal_regimes:
- regime_id: AIA-TEMP-A020-P1-IMMEDIATE-CORRECTIVE-ACTION
  qualitative_deadline:
    kind: immediately
    trigger: Providers of high-risk AI systems which consider or have reason to consider that a
      high-risk AI system that they have placed on the market or put into service is not in
      conformity with this Regulation
  legal_basis_spans:
  - AIA-TEXT-A020-P001
- regime_id: AIA-TEMP-A020-P2-IMMEDIATE-INVESTIGATION
  qualitative_deadline:
    kind: immediately
    trigger: the high-risk AI system presents a risk within the meaning of Article 79(1) and the
      provider becomes aware of that risk
  legal_basis_spans:
  - AIA-TEXT-A020-P002
records:
- norm_id: AIA-NORM-A020-P1-CORRECTIVE-RESPONSE
  source: A020-P001
  quote: Providers of high-risk AI systems which consider or have reason to consider that a high-risk
    AI system that they have placed on the market or put into service is not in conformity with this Regulation
    shall immediately take the necessary corrective actions to bring that system into conformity, to withdraw
    it, to disable it, or to recall it, as appropriate.
  action: immediately take the appropriate corrective response by bringing a non-conforming system into
    conformity, withdrawing it, disabling it, or recalling it
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A020-P001]
  targets: []
  temporal_regime_id: AIA-TEMP-A020-P1-IMMEDIATE-CORRECTIVE-ACTION
  conditions: &id001
  - operator: all_of
    operands:
    - text: Providers of high-risk AI systems which consider or have reason to consider that a high-risk AI system that they have placed on the market or put into service is not in conformity with this Regulation
      basis_segment_ids: [AIA-TEXT-A020-P001]
  implementation_refs: &id002
  - AIA-RULE-PO-A20
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A020-P1-INFORM-SUPPLY-CHAIN
  source: A020-P001
  quote: They shall inform the distributors of the high-risk AI system concerned and, where applicable,
    the deployers, the authorised representative and importers accordingly.
  action: inform the distributor and, where applicable, deployers, the authorised representative, and
    importers about the non-conforming system and corrective response
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A020-P001]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTIONS-1-3
  conditions: *id001
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A020-P2-INVESTIGATE-RISK
  source: A020-P002
  quote: Where the high-risk AI system presents a risk within the meaning of Article 79(1) and the provider
    becomes aware of that risk, it shall immediately investigate the causes, in collaboration with the
    reporting deployer, where applicable, and inform the market surveillance authorities competent for
    the high-risk AI system concerned and, where applicable, the notified body that issued a certificate
    for that high-risk AI system in accordance with Article 44, in particular, of the nature of the non-compliance
    and of any relevant corrective action taken.
  action: immediately investigate the causes of an Article 79(1) risk, collaborating with the reporting
    deployer where applicable, and inform the competent market-surveillance authorities and, where applicable,
    the certifying notified body of the non-compliance and relevant corrective action
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A020-P002]
  targets: []
  temporal_regime_id: AIA-TEMP-A020-P2-IMMEDIATE-INVESTIGATION
  conditions: &id003
  - operator: all_of
    operands:
    - text: Where the high-risk AI system presents a risk within the meaning of Article 79(1) and the provider becomes aware of that risk
      basis_segment_ids: [AIA-TEXT-A020-P002]
  implementation_refs: &id004
  - AIA-RULE-PO-A20-2
  verification_mode: reported_not_judged
  mandatory_content:
  - investigate the causes, collaborating with the reporting deployer where applicable
  - inform the competent market-surveillance authorities of the nature of the non-compliance and relevant
    corrective action
  - where applicable, also inform the notified body that issued the Article 44 certificate
  verified_by: vidibro
