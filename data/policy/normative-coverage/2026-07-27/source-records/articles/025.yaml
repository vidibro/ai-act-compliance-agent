records:
- norm_id: AIA-NORM-A025-P1-A-NAME-ROLE-TRANSFER
  source: A025-P002
  quote: they put their name or trademark on a high-risk AI system already placed on the market or put
    into service
  action: treat a distributor, importer, deployer, or other third party as the provider subject to Article
    16 after it puts its name or trademark on the high-risk system
  actors:
  - actor_ref: distributor_importer_deployer_or_third_party
    category: supported_operator
  targets: []
  kind: legal_consequence
  conditions:
  - the party puts its name or trademark on a high-risk AI system already placed on the market or put
    into service
  qualifier_spans: &id001
  - A025-P001
  product_scope: dependency_only
  product_scope_reason: This proposition reallocates the provider role and thereby determines which operator
    owes the Article 16 duties.
  implementation_mode: none_required
  implementation_reason: The existing Article 25 role-selection mechanism applies the provider duty set
    rather than producing a duplicate compliance finding.
  verification_mode: answered_by_classification
- norm_id: AIA-NORM-A025-P1-B-MODIFICATION-ROLE-TRANSFER
  source: A025-P003
  quote: they make a substantial modification to a high-risk AI system that has already been placed on
    the market or has already been put into service in such a way that it remains a high-risk AI system
    pursuant to Article 6
  action: treat the substantially modifying distributor, importer, deployer, or third party as the provider
    subject to Article 16 when the modified system remains high-risk
  actors:
  - actor_ref: distributor_importer_deployer_or_third_party
    category: supported_operator
  targets: []
  kind: legal_consequence
  conditions:
  - the party substantially modifies an already marketed or operational high-risk system and it remains
    high-risk under Article 6
  qualifier_spans: *id001
  product_scope: dependency_only
  product_scope_reason: This proposition reallocates the provider role and thereby determines which operator
    owes the Article 16 duties.
  implementation_mode: none_required
  implementation_reason: The existing Article 25 role-selection mechanism applies the provider duty set
    rather than producing a duplicate compliance finding.
  verification_mode: answered_by_classification
- norm_id: AIA-NORM-A025-P1-C-PURPOSE-ROLE-TRANSFER
  source: A025-P004
  quote: they modify the intended purpose of an AI system, including a general-purpose AI system, which
    has not been classified as high-risk and has already been placed on the market or put into service
    in such a way that the AI system concerned becomes a high-risk AI system in accordance with Article
    6
  action: treat the purpose-modifying distributor, importer, deployer, or third party as the provider
    subject to Article 16 when its change makes an existing system high-risk
  actors:
  - actor_ref: distributor_importer_deployer_or_third_party
    category: supported_operator
  targets: []
  kind: legal_consequence
  conditions:
  - the party changes the intended purpose of an already marketed or operational non-high-risk system
    so that it becomes high-risk under Article 6
  qualifier_spans: *id001
  product_scope: dependency_only
  product_scope_reason: This proposition reallocates the provider role and thereby determines which operator
    owes the Article 16 duties.
  implementation_mode: none_required
  implementation_reason: The existing Article 25 role-selection mechanism applies the provider duty set
    rather than producing a duplicate compliance finding.
  verification_mode: answered_by_classification
- norm_id: AIA-NORM-A025-P2-INITIAL-PROVIDER-STATUS-ENDS
  source: A025-P005
  quote: Where the circumstances referred to in paragraph 1 occur, the provider that initially placed
    the AI system on the market or put it into service shall no longer be considered to be a provider
    of that specific AI system for the purposes of this Regulation.
  action: cease treating the initial provider as provider of the specific system after a paragraph 1 role
    transfer
  actors:
  - actor_ref: initial_provider
    category: supported_operator
  targets: []
  kind: legal_consequence
  conditions: &id002
  - an Article 25(1) provider-role transfer occurs
  product_scope: dependency_only
  product_scope_reason: This consequence determines the parties' respective roles and the resulting allocation
    of operator duties.
  implementation_mode: none_required
  implementation_reason: The role-selection mechanism removes the initial provider's provider role and
    separately activates its surviving cooperation duties.
  verification_mode: answered_by_classification
- norm_id: AIA-NORM-A025-P2-COOPERATE
  source: A025-P006
  quote: That initial provider shall closely cooperate with new providers
  action: closely cooperate with the new provider after the provider role has transferred
  actors:
  - actor_ref: initial_provider
    category: supported_operator
  targets: []
  conditions: *id002
  exceptions: &id003
  - the initial provider clearly specified that its system must not be changed into a high-risk system
  implementation_refs: &id004
  - AIA-IP-A25-2
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A025-P2-PROVIDE-ASSISTANCE
  source: A025-P006
  quote: shall make available the necessary information and provide the reasonably expected technical
    access and other assistance that are required for the fulfilment of the obligations set out in this
    Regulation, in particular with regard to compliance with the conformity assessment of high-risk AI
    systems
  action: provide the new provider with necessary information, reasonably expected technical access, and
    other assistance required for regulatory compliance
  actors:
  - actor_ref: initial_provider
    category: supported_operator
  targets: []
  conditions: *id002
  exceptions: *id003
  implementation_refs: *id004
  verification_mode: reported_not_judged
  mandatory_content:
  - technical documentation sufficient to assess Article 16 compliance
  - information about known limitations and failure modes
  - targeted technical access, including for testing and validation
  qualifier_spans:
  - A025-P007
  - A025-P008
  - A025-P009
  - A025-P010
  verified_by: vidibro
- norm_id: AIA-NORM-A025-P2-NO-COOPERATION-DUTY
  source: A025-P011
  quote: This paragraph shall not apply in cases where the initial provider has clearly specified that
    its AI system is not to be changed into a high-risk AI system and therefore does not fall under the
    obligation to cooperate with the new providers and hand over the documentation.
  action: disapply the initial-provider cooperation and documentation duties where high-risk conversion
    was clearly prohibited
  actors:
  - actor_ref: initial_provider
    category: supported_operator
  targets: []
  kind: applicability
  conditions:
  - the initial provider clearly specified that its AI system must not be changed into a high-risk system
  implementation_mode: report_only
  implementation_refs: *id004
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A025-P3-A-PRODUCT-MANUFACTURER-ROLE
  source: A025-P013
  quote: the high-risk AI system is placed on the market together with the product under the name or trademark
    of the product manufacturer
  action: treat the product manufacturer as provider subject to Article 16 when its high-risk safety-component
    system is marketed with the product under its name or trademark
  actors:
  - actor_ref: product_manufacturer
    category: supported_operator
  targets: []
  kind: legal_consequence
  conditions:
  - the high-risk AI system is a safety component of a product covered by Section A of Annex I legislation
  - the system is marketed with the product under the product manufacturer's name or trademark
  qualifier_spans: &id005
  - A025-P012
  product_scope: dependency_only
  product_scope_reason: This proposition assigns the provider role and thereby determines which operator
    owes the Article 16 duties.
  implementation_mode: none_required
  implementation_reason: The existing Article 25 role-selection mechanism applies the provider duty set
    rather than producing a duplicate compliance finding.
  verification_mode: answered_by_classification
- norm_id: AIA-NORM-A025-P3-B-PRODUCT-MANUFACTURER-ROLE
  source: A025-P014
  quote: the high-risk AI system is put into service under the name or trademark of the product manufacturer
    after the product has been placed on the market
  action: treat the product manufacturer as provider subject to Article 16 when its high-risk safety-component
    system is later put into service under its name or trademark
  actors:
  - actor_ref: product_manufacturer
    category: supported_operator
  targets: []
  kind: legal_consequence
  conditions:
  - the high-risk AI system is a safety component of a product covered by Section A of Annex I legislation
  - the system is put into service under the product manufacturer's name or trademark after product market
    placement
  qualifier_spans: *id005
  product_scope: dependency_only
  product_scope_reason: This proposition assigns the provider role and thereby determines which operator
    owes the Article 16 duties.
  implementation_mode: none_required
  implementation_reason: The existing Article 25 role-selection mechanism applies the provider duty set
    rather than producing a duplicate compliance finding.
  verification_mode: answered_by_classification
- norm_id: AIA-NORM-A025-P4-WRITTEN-AGREEMENT
  source: A025-P015
  quote: The provider of a high-risk AI system and the third party that supplies an AI system, AI model,
    tools, services, components, or processes that are used or integrated in a high-risk AI system shall,
    by written agreement, specify the necessary information, capabilities, technical access and other
    assistance based on the generally acknowledged state of the art, in order to enable the provider of
    the high-risk AI system to fully comply with the obligations set out in this Regulation.
  action: use a written agreement to specify the state-of-the-art information, capabilities, technical
    access, and assistance necessary for the provider's full compliance
  actors:
  - actor_ref: high_risk_provider_and_third_party_supplier
    category: supported_operator
  targets: []
  implementation_refs: &id006
  - AIA-PO-A25-4
  verification_mode: reported_not_judged
  mandatory_content:
  - necessary information
  - necessary capabilities
  - necessary technical access
  - other necessary assistance
  - generally acknowledged state-of-the-art basis
  verified_by: vidibro
- norm_id: AIA-NORM-A025-P4-OPEN-SOURCE-EXCEPTION
  source: A025-P015
  quote: This paragraph shall not apply to third parties making accessible to the public tools, services,
    processes, or components, other than general-purpose AI models, under a free and open-source licence.
  action: disapply the written-agreement duty to publicly accessible free and open-source supplies other
    than general-purpose AI models
  actors:
  - actor_ref: third_party_supplier
    category: external_private_party
  targets: []
  kind: applicability
  exceptions:
  - general-purpose AI models remain subject to the written-agreement duty
  implementation_mode: report_only
  implementation_refs: *id006
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A025-P4-AI-OFFICE-MODEL-TERMS
  source: A025-P016
  quote: The AI Office may develop and recommend voluntary model terms for contracts between providers
    of high-risk AI systems and third parties that supply tools, services, components or processes that
    are used for or integrated into high-risk AI systems.
  action: develop and recommend voluntary model terms for high-risk-system supply contracts
  actors:
  - actor_ref: ai_office
    category: union_institution_or_body
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A025-P4-AI-OFFICE-SECTOR-REQUIREMENTS
  source: A025-P016
  quote: When developing those voluntary model terms, the AI Office shall take into account possible contractual
    requirements applicable in specific sectors or business cases.
  action: consider sector-specific and business-case contractual requirements when developing model terms
  actors:
  - actor_ref: ai_office
    category: union_institution_or_body
  targets: []
  conditions:
  - the AI Office develops voluntary model terms
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A025-P4-AI-OFFICE-PUBLISH
  source: A025-P016
  quote: The voluntary model terms shall be published and be available free of charge in an easily usable
    electronic format.
  action: publish voluntary model terms free of charge in an easily usable electronic format
  actors:
  - actor_ref: ai_office
    category: union_institution_or_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A025-P5-PROTECT-RIGHTS-AND-SECRETS
  source: A025-P017
  quote: Paragraphs 2 and 3 are without prejudice to the need to observe and protect intellectual property
    rights, confidential business information and trade secrets in accordance with Union and national
    law.
  action: observe and protect intellectual-property rights, confidential business information, and trade
    secrets when applying paragraphs 2 and 3
  actors:
  - actor_ref: parties_under_article_25_paragraphs_2_and_3
    category: supported_operator
  targets: []
  implementation_mode: report_only
  implementation_refs:
  - AIA-IP-A25-2
  implementation_reason: Article 25(2)'s role-transfer rule is active whenever paragraphs 2 or 3 make this external-law protection constraint relevant.
  verification_mode: reported_conditionally
  verified_by: vidibro
