    documentation, as applicable, their name, registered trade name or registered trade mark, the address
    at which they can be contacted
  action: "display the provider\u2019s name, registered trade name or registered trade mark, and contact\
    \ address on the system or, when that is not possible, on its packaging or accompanying documentation"
