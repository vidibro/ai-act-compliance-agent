records:
- norm_id: AIA-NORM-A080-P1-EVALUATE-CLASSIFICATION
  source: A080-P001
  quote: the market surveillance authority shall carry out an evaluation of the AI system concerned in respect of its classification as a high-risk AI system based on the conditions set out in Article 6(3) and the Commission guidelines.
  action: evaluate a reasonably suspected non-high-risk classification under Article 6(3) and Commission guidelines
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A080-P2-REQUIRE-COMPLIANCE-AND-CORRECTION
  source: A080-P002
  quote: it shall without undue delay require the relevant provider to take all necessary actions to bring the AI system into compliance with the requirements and obligations laid down in this Regulation, as well as take appropriate corrective action within a period the market surveillance authority may prescribe.
  action: require necessary compliance and corrective action without undue delay within a prescribed period
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A080-P3-INFORM-CROSS-BORDER-USE
  source: A080-P003
  quote: it shall inform the Commission and the other Member States without undue delay of the results of the evaluation and of the actions which it has required the provider to take.
  action: promptly inform the Commission and other Member States of cross-border evaluation results and required provider action
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A080-P4-BRING-SYSTEM-INTO-COMPLIANCE
  source: A080-P004
  quote: The provider shall ensure that all necessary action is taken to bring the AI system into compliance with the requirements and obligations laid down in this Regulation.
  action: bring an authority-reclassified high-risk system into compliance with all applicable requirements and obligations
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A20]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A080-P4-NONCOMPLIANCE-FINE
  source: A080-P004
  quote: the provider shall be subject to fines in accordance with Article 99.
  action: incur Article 99 fines for failure to comply within the prescribed period
  subject_ref: provider
  subject_category: supported_operator
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: The penalty enforces the compliance duty without adding an independent product action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A080-P5-CORRECT-ALL-UNION-SYSTEMS
  source: A080-P005
  quote: The provider shall ensure that all appropriate corrective action is taken in respect of all the AI systems concerned that it has made available on the Union market.
  action: ensure appropriate corrective action across all concerned systems made available on the Union market
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A20]
  verification_mode: reported_not_judged
- norm_id: AIA-NORM-A080-P6-APPLY-ARTICLE-79-ESCALATION
  source: A080-P006
  quote: Article 79(5) to (9) shall apply.
  action: apply Article 79(5) to (9) escalation after inadequate provider correction
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  kind: applicability
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A080-P7-CIRCUMVENTION-FINE
  source: A080-P007
  quote: the provider shall be subject to fines in accordance with Article 99.
  action: incur Article 99 fines for intentional non-high-risk misclassification used to circumvent Chapter III Section 2
  subject_ref: provider
  subject_category: supported_operator
  kind: legal_consequence
  product_scope: no_product_action
  product_scope_reason: The penalty enforces the Article 6 classification duty without adding an independent product action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A080-P8-PERFORM-MONITORING-CHECKS
  source: A080-P008
  quote: market surveillance authorities may perform appropriate checks, taking into account in particular information stored in the EU database referred to in Article 71 of this Regulation.
  action: perform appropriate classification checks with particular account taken of EU database information
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
