- norm_id: AIA-NORM-A002-P2-SECTION-B-LIMIT
  source: A002-P009
  quote: For AI systems classified as high-risk AI systems in accordance with Article 6(1) related to
    products covered by the Union harmonisation legislation listed in Section B of Annex I, only Article
    6(1), Article 60a and Articles 102 to 112 shall apply.
  action: limit the applicable AI Act provisions for Article 6(1) high-risk systems related to Annex I
    Section B products to Articles 6(1), 60a, and 102 to 112
  actors: []
  targets:
  - target_ref: annex_i_section_b_high_risk_system
  kind: applicability
  conditions:
    operator: all_of
    operands:
    - text: AI systems classified as high-risk AI systems in accordance with Article 6(1)
      basis_segment_ids:
      - AIA-TEXT-A002-P009
    - text: products covered by the Union harmonisation legislation listed in Section B of Annex I
      basis_segment_ids:
      - AIA-TEXT-A002-P009
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-ANNEX-I
  - AIA-CQ-THIRD-PARTY-ASSESSMENT
  verification_mode: answered_by_classification
  verified_by: vidibro
- norm_id: AIA-NORM-A002-P2-INTEGRATED-SANDBOX-PROVISIONS
  source: A002-P009
  quote: Articles 57, 58 and 59 shall apply only in so far as the requirements for high-risk AI systems
    under this Regulation have been integrated in that Union harmonisation legislation.
  action: apply Articles 57 to 59 to Annex I Section B systems only where the AI Act high-risk requirements
    have been integrated into the applicable sectoral legislation
  actors: []
  targets:
  - target_ref: annex_i_section_b_high_risk_system
  kind: applicability
  conditions:
    operator: all_of
    operands:
    - text: the requirements for high-risk AI systems under this Regulation have been integrated in that Union harmonisation legislation
      basis_segment_ids:
      - AIA-TEXT-A002-P009
  product_scope: no_product_action
  product_scope_reason: >-
    This boundary governs Articles 57 to 59 regulatory-sandbox provisions, which this product does
    not currently implement or report.
  implementation_mode: none_required
  implementation_reason: >-
    The product cannot determine whether another Union instrument has integrated the AI Act's
    high-risk requirements and has no Articles 57 to 59 reporting surface.
  verification_mode: not_reported
  verified_by: vidibro
