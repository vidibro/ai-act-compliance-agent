- norm_id: AIA-NORM-A002-P11-MORE-FAVOURABLE-WORKER-RULES
  source: A002-P020
  quote: This Regulation does not preclude the Union or Member States from maintaining or introducing
    laws, regulations or administrative provisions which are more favourable to workers in terms of protecting
    their rights in respect of the use of AI systems by employers, or from encouraging or allowing the
    application of collective agreements which are more favourable to workers.
  action: maintain or introduce laws, regulations, or administrative provisions that more favourably protect
    workers regarding employers' use of AI systems, or encourage or allow more favourable collective agreements
  actors:
  - actor_ref: union_institution_or_body
  - actor_ref: member_state
  targets: []
  kind: permission
  product_scope: no_product_action
  product_scope_reason: This permission concerns legislative and administrative powers rather than a product-facing
    action.
  implementation_mode: none_required
  implementation_reason: The product does not implement Union or Member State legislative choices.
  verification_mode: not_reported
  mandatory_content:
  - maintain or introduce more favourable worker-protection provisions
  - encourage or allow more favourable collective agreements
  verified_by: vidibro
