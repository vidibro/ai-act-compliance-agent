- norm_id: AIA-NORM-A002-P13-COMMISSION-DELEGATED-ACTS
  source: A002-P025
  quote: By 2 August 2027, the Commission shall adopt delegated acts in accordance with Article 97 in
    order to supplement this Regulation by specifying the high-risk AI systems concerned, the requirements
    or obligations that may be limited, the conditions under which such limitation applies, and the scope
    of the limitation.
  action: adopt delegated acts by 2 August 2027 specifying how the Article 2(13) limitation operates
  actors:
  - actor_ref: commission
  targets: []
  kind: obligation
  conditions:
    operator: all_of
    operands:
    - text: By 2 August 2027
      basis_segment_ids:
      - AIA-TEXT-A002-P025
    - text: in accordance with Article 97
      basis_segment_ids:
      - AIA-TEXT-A002-P025
  mandatory_content:
