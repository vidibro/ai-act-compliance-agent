    product-facing action.
  implementation_mode: none_required
  implementation_reason: Concrete system exclusions are represented separately by Article 2(3)'s following
    subparagraphs.
  verification_mode: not_reported
- norm_id: AIA-NORM-A002-P3-MILITARY-EXCLUSION
