- norm_id: AIA-NORM-A002-P4-INTERNATIONAL-COOPERATION-EXCLUSION
  source: A002-P013
  quote: This Regulation applies neither to public authorities in a third country nor to international
    organisations falling within the scope of this Regulation pursuant to paragraph 1, where those authorities
    or organisations use AI systems in the framework of international cooperation or agreements for law
    enforcement and judicial cooperation with the Union or with one or more Member States, provided that
    such a third country or international organisation provides adequate safeguards with respect to the
    protection of fundamental rights and freedoms of individuals.
  action: exclude qualifying third-country public authorities and international organisations using AI
    systems under law-enforcement or judicial-cooperation arrangements with adequate fundamental-rights
    safeguards
  actors: []
  targets:
  - target_ref: third_country_public_authority_or_international_organisation
  kind: applicability
  verification_mode: answered_by_classification
  conditions:
    operator: all_of
    operands:
    - operator: any_of
      operands:
      - text: public authorities in a third country
        basis_segment_ids:
        - AIA-TEXT-A002-P013
      - text: international organisations falling within the scope of this Regulation pursuant to paragraph 1
        basis_segment_ids:
        - AIA-TEXT-A002-P013
    - text: use AI systems in the framework of international cooperation or agreements for law enforcement and judicial cooperation with the Union or with one or more Member States
      basis_segment_ids:
      - AIA-TEXT-A002-P013
    - text: such a third country or international organisation provides adequate safeguards with respect to the protection of fundamental rights and freedoms of individuals
      basis_segment_ids:
      - AIA-TEXT-A002-P013
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-SCOPE
  verified_by: vidibro
