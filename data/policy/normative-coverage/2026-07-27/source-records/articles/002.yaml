    put into service, or used with or without modification exclusively for military, defence or national
    security purposes, regardless of the type of entity carrying out those activities.
  action: exclude AI systems placed on the market, put into service, or used exclusively for military,
    defence, or national-security purposes
  actors: []
  targets:
