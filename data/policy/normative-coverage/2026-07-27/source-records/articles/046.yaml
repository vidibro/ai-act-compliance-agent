  conditions:
    operator: all_of
    operands:
    - text: upon a duly justified request
      basis_segment_ids: [AIA-TEXT-A046-P001]
    - text: for exceptional reasons of public security or the protection of life and health of persons, environmental protection or the protection of key industrial and infrastructural assets
      basis_segment_ids: [AIA-TEXT-A046-P001]
