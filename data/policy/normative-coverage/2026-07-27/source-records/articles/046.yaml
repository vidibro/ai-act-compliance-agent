- norm_id: AIA-NORM-A046-P6-WITHDRAW-UNJUSTIFIED-AUTHORISATION
  source: A046-P006
  quote: Where the Commission considers the authorisation unjustified, it shall be withdrawn by the market
    surveillance authority of the Member State concerned.
  action: withdraw an authorisation that the Commission considers unjustified
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
