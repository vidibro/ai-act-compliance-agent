- norm_id: AIA-NORM-A046-P7-SECTORAL-DEROGATIONS-ONLY
  source: A046-P007
  quote: For high-risk AI systems related to products covered by Union harmonisation legislation listed
    in Section A of Annex I, only the derogations from the conformity assessment established in that Union
    harmonisation legislation shall apply.
  action: apply only the relevant sectoral-law conformity-assessment derogations to Section A Annex I
    products
  subject_ref: provider
  subject_category: supported_operator
  kind: applicability
  implementation_mode: missing
  verification_mode: reported_conditionally
  verified_by: vidibro
