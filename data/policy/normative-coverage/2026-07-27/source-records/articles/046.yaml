  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
    operator: all_of
    operands:
    - text: In a duly justified situation of urgency for exceptional reasons of public security or in the case of specific, substantial and imminent threat to the life or physical safety of natural persons
      basis_segment_ids: [AIA-TEXT-A046-P002]
    - text: provided that such authorisation is requested during or after the use without undue delay
      basis_segment_ids: [AIA-TEXT-A046-P002]
