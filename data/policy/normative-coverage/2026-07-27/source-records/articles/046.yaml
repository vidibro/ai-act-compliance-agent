- norm_id: AIA-NORM-A046-P1-DEROGATION-AUTHORISATION
  source: A046-P001
  quote: By way of derogation from Article 43 and upon a duly justified request, any market surveillance
    authority may authorise the placing on the market or the putting into service of specific high-risk
    AI systems within the territory of the Member State concerned, for exceptional reasons of public security
    or the protection of life and health of persons, environmental protection or the protection of key
    industrial and infrastructural assets.
  action: authorise temporary national placing or service of a specific high-risk system under the enacted
    exceptional derogation
  actors:
  - actor_ref: market_surveillance_authority
    basis_segment_ids: [AIA-TEXT-A046-P001]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
