- norm_id: AIA-NORM-A060A-P5-B-COMPLY-WITH-INCORPORATED-SAFEGUARDS
  source: A060A-P007
  quote: ensure compliance with the requirements laid down in Article 60(2), (3), (4)(d)-(j) and (5)-(9),
    where any reference to market surveillance authorities in those provisions shall be read as a reference
    to the national competent authority or relevant authority, as appropriate in accordance with the Union
    harmonisation legislation listed in Section B of Annex I;
  action: ensure the national framework secures compliance with Article 60(2), (3), (4)(d)-(j) and (5)-(9),
    reading market surveillance authorities as the national competent or relevant authority
