records:
- norm_id: AIA-NORM-A060A-P1-ALLOW-SECTION-B-TESTING
  source: A060A-P001
  quote: Member States may allow, in accordance with this Article, the testing of high-risk AI systems
    in real world conditions outside AI regulatory sandboxes by providers or prospective providers of
    AI enabled products covered by the Union harmonisation legislation listed in Section B of Annex I,
    with a view to assessing and verifying the conformity of those systems with the requirements laid
    down in Articles 8 to 15.
  action: allow Article 60a real-world testing of Section B AI-enabled products to assess Articles 8 to
    15 conformity
  actors:
  - actor_ref: member_state
    basis_segment_ids: [AIA-TEXT-A060A-P001]
  targets: []
  kind: power
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A060A-P2-ADOPT-TESTING-FRAMEWORK
  source: A060A-P002
  quote: Member States that choose to allow testing as referred to in paragraph 1 shall, individually
    or jointly, adopt frameworks for real-world testing.
  action: adopt an individual or joint real-world testing framework when allowing Article 60a testing
