- norm_id: AIA-NORM-A060A-P6-SECTORAL-REQUIREMENTS-DO-NOT-OBSTRUCT
  source: A060A-P010
  quote: Any requirements laid down in those provisions shall not affect the application of this Article
    to the extent necessary to enable the testing referred to in paragraph 1.
  action: keep the Section B requirements from affecting the application of Article 60a to the extent
    necessary to enable the paragraph 1 testing
  actors: none
  targets:
  - target_ref: Any requirements laid down in those provisions
    target_kind: external_requirement
    basis_segment_ids: [AIA-TEXT-A060A-P010]
