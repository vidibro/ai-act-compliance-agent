records:
- norm_id: AIA-NORM-A060A-P1-ALLOW-SECTION-B-TESTING
  source: A060A-P001
  quote: Member States may allow, in accordance with this Article, the testing of high-risk AI systems in real world conditions outside AI regulatory sandboxes by providers or prospective providers of AI enabled products covered by the Union harmonisation legislation listed in Section B of Annex I, with a view to assessing and verifying the conformity of those systems with the requirements laid down in Articles 8 to 15.
  action: allow Article 60a real-world testing of Section B AI-enabled products to assess Articles 8 to 15 conformity
  subject_ref: member_state
  subject_category: member_state
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P2-ADOPT-TESTING-FRAMEWORK
  source: A060A-P002
  quote: Member States that choose to allow testing as referred to in paragraph 1 shall, individually or jointly, adopt frameworks for real-world testing.
  action: adopt an individual or joint real-world testing framework when allowing Article 60a testing
  subject_ref: member_state
  subject_category: member_state
  conditions: [the Member State chooses to allow Article 60a testing]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P3-NOTIFY-FRAMEWORK
  source: A060A-P003
  quote: Each Member State shall notify the Commission of any real-world testing framework it adopts before implementing it.
  action: notify the Commission of an adopted testing framework before implementation
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P3-PRESERVE-COMMISSION-COMPETENCE
  source: A060A-P003
  quote: This shall not affect the competences of the Commission under the Union harmonisation legislation listed in Section B of Annex I.
  action: preserve Commission competences under Section B harmonisation legislation
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P4-COOPERATE-AND-REMOVE-OBSTACLES
  source: A060A-P004
  quote: Member States that have adopted real-world testing frameworks shall ensure that the relevant national competent authorities, relevant authorities and public authorities responsible for the management and operation of infrastructure and products covered by Union harmonisation legislation listed in Section B of Annex I cooperate closely with each other in good faith and remove any practical obstacles, including on procedural rules providing access to physical public infrastructure, where this is necessary, to successfully implement those real-world testing frameworks and test AI-enabled products covered by Union harmonisation legislation listed in Section B of Annex I.
  action: ensure good-faith authority cooperation and removal of practical obstacles needed to implement frameworks and test Section B products
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P5-FRAMEWORK-REQUIREMENTS
  source: A060A-P005
  quote: The frameworks for real-world testing shall lay down the requirements under which testing in real-world conditions shall occur. Those frameworks shall
  action: make every enacted plan compliance governance and protection element part of the real-world testing framework
  subject_ref: member_state
  subject_category: member_state
  mandatory_content: [mandatory agreed testing plan, incorporated Article 60 safeguards, effective governance and accountability, high protection of health safety and fundamental rights]
  qualifier_spans: [A060A-P006, A060A-P007, A060A-P008, A060A-P009]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P5-A-AGREE-TESTING-PLAN
  source: A060A-P006
  quote: include the provision of a mandatory real-world testing plan to be agreed between the provider or prospective provider and the national competent authority or relevant authority in accordance with the Union harmonisation legislation listed in Section B of Annex I;
  action: agree a mandatory real-world testing plan with the competent or relevant authority under applicable Section B legislation
  subject_ref: provider_or_prospective_provider
  subject_category: supported_operator
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P5-B-COMPLY-WITH-INCORPORATED-SAFEGUARDS
  source: A060A-P007
  quote: ensure compliance with the requirements laid down in Article 60(2), (3), (4)(d)-(j) and (5)-(9), where any reference to market surveillance authorities in those provisions shall be read as a reference to the national competent authority or relevant authority, as appropriate in accordance with the Union harmonisation legislation listed in Section B of Annex I;
  action: comply with the incorporated Article 60 testing safeguards using the competent-authority substitution required by Section B legislation
  subject_ref: provider_or_prospective_provider
  subject_category: supported_operator
  verification_mode: not_assessed
- norm_id: AIA-NORM-A060A-P6-COMPLY-WITH-SECTORAL-LAW
  source: A060A-P010
  quote: The real-world testing shall comply with the applicable provisions laid down in the Union harmonisation legislation listed in Section B of Annex I. Any requirements laid down in those provisions shall not affect the application of this Article to the extent necessary to enable the testing referred to in paragraph 1.
  action: comply with applicable Section B harmonisation provisions while applying Article 60a to the extent necessary to enable its testing
  subject_ref: provider_or_prospective_provider
  subject_category: supported_operator
  verification_mode: not_assessed
