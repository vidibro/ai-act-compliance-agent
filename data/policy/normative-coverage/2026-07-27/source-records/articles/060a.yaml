- norm_id: AIA-NORM-A060A-P6-COMPLY-WITH-SECTORAL-LAW
  source: A060A-P010
  quote: The real-world testing shall comply with the applicable provisions laid down in the Union harmonisation
    legislation listed in Section B of Annex I.
  action: comply with the applicable provisions of the Section B Union harmonisation legislation when
    conducting the real-world testing
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A060A-P001]
  - actor_ref: prospective_provider
