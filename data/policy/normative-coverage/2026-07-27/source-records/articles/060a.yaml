- norm_id: AIA-NORM-A060A-P4-COOPERATE-AND-REMOVE-OBSTACLES
  source: A060A-P004
  quote: Member States that have adopted real-world testing frameworks shall ensure that the relevant
    national competent authorities, relevant authorities and public authorities responsible for the management
    and operation of infrastructure and products covered by Union harmonisation legislation listed in
    Section B of Annex I cooperate closely with each other in good faith and remove any practical obstacles,
    including on procedural rules providing access to physical public infrastructure, where this is necessary,
    to successfully implement those real-world testing frameworks and test AI-enabled products covered
    by Union harmonisation legislation listed in Section B of Annex I.
  action: ensure that the relevant national competent, relevant and infrastructure or product authorities
    cooperate closely with each other in good faith and remove practical obstacles necessary to implement
    real-world testing frameworks and test Section B AI-enabled products
  actors:
  - actor_ref: member_state
    basis_segment_ids: [AIA-TEXT-A060A-P004]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Member States that have adopted real-world testing frameworks
      basis_segment_ids: [AIA-TEXT-A060A-P004]
  temporal_regime_id: AIA-TEMP-CHAPTER-VI
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - ensure close and good-faith cooperation between all specified authorities
  - where necessary, ensure removal of practical obstacles, including procedural barriers to accessing
    physical public infrastructure
  verified_by: vidibro
- norm_id: AIA-NORM-A060A-P5-FRAMEWORK-REQUIREMENTS
  source: A060A-P005
  quote: The frameworks for real-world testing shall lay down the requirements under which testing in
    real-world conditions shall occur. Those frameworks shall
  action: make every enacted plan compliance governance and protection element part of the real-world
    testing framework
  actors:
  - actor_ref: member_state
    basis_segment_ids: [AIA-TEXT-A060A-P002]
  targets: []
  mandatory_content:
