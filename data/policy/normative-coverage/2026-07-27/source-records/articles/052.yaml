  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A052-P5-REQUEST-CONTENT
  source: A052-P006
  quote: Such a request shall contain objective, detailed and new reasons that have arisen since the designation
    decision.
  action: include objective, detailed, and new post-designation reasons in a reassessment request
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A052-P002]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Upon a reasoned request of a provider whose model has been designated as a general-purpose AI model with systemic risk pursuant to paragraph 4
      basis_segment_ids: [AIA-TEXT-A052-P006]
  mandatory_content:
  - objective reasons
  - detailed reasons
  - new reasons arising since the designation decision
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  implementation_mode: carried_by_other_norm
  implementation_reason: Carried by the Article 52(5) reassessment permission, whose action states the content.
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A052-P5-REQUEST-AFTER-SIX-MONTHS
  source: A052-P006
  quote: Providers may request reassessment at the earliest six months after the designation decision.
    Where the Commission, following its reassessment, decides to maintain the designation as a general-purpose
    AI model with systemic risk, providers may request reassessment at the earliest six months after that
    decision.
  action: request reassessment no earlier than six months after the applicable designation or maintenance
    decision, giving objective, detailed and new reasons that have arisen since the designation decision
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A052-P002]
  targets: []
  kind: permission
  conditions:
    operator: any_of
    operands:
    - text: Providers may request reassessment at the earliest six months after the designation decision
      basis_segment_ids: [AIA-TEXT-A052-P006]
    - text: Where the Commission, following its reassessment, decides to maintain the designation as a general-purpose AI model with systemic risk, providers may request reassessment at the earliest six months after that decision
      basis_segment_ids: [AIA-TEXT-A052-P006]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  implementation_mode: report_only
  implementation_refs: [AIA-RULE-GP-A52-1]
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A052-P6-PUBLISH-LIST
  source: A052-P007
  quote: The Commission shall ensure that a list of general-purpose AI models with systemic risk is published
    and shall keep that list up to date, without prejudice to the need to observe and protect intellectual
    property rights and confidential business information or trade secrets in accordance with Union and
    national law.
  action: ensure publication of a current list of general-purpose AI models with systemic risk while observing
    and protecting intellectual-property rights, confidential business information, and trade secrets
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A052-P007]
  targets: []
  mandatory_content:
  - keep the published list up to date
  - observe and protect intellectual-property rights in accordance with Union and national law
  - observe and protect confidential business information and trade secrets in accordance with Union and
    national law
  temporal_regime_id: AIA-TEMP-CHAPTER-V
