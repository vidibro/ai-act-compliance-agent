temporal_regimes:
- regime_id: AIA-TEMP-A052-P1-NOTIFY-WITHOUT-DELAY
  application_start: 2025-08-02
  qualitative_deadline:
    kind: without_delay
    trigger: Where a general-purpose AI model meets the condition referred to in Article 51(1), point
      (a)
  timing_conditions:
  - in any event within two weeks after that requirement is met or it becomes known that it will be met
  legal_basis_spans:
  - AIA-TEXT-A113-B
  - AIA-TEXT-A052-P001
records:
- norm_id: AIA-NORM-A052-P1-NOTIFY-COMMISSION
  source: A052-P001
  quote: Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a),
    the relevant provider shall notify the Commission without delay and in any event within two weeks
    after that requirement is met or it becomes known that it will be met.
  action: notify the Commission without delay and within two weeks of meeting or anticipating the Article
    51(1)(a) condition
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A052-P002]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a)
      basis_segment_ids: [AIA-TEXT-A052-P001]
  temporal_regime_id: AIA-TEMP-A052-P1-NOTIFY-WITHOUT-DELAY
  implementation_refs:
  - AIA-RULE-GP-A52-1
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A052-P1-NOTIFICATION-CONTENT
  source: A052-P001
  quote: That notification shall include the information necessary to demonstrate that the relevant requirement
    has been met.
  action: include information demonstrating that the Article 51(1)(a) requirement is met in the notification
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A052-P002]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a)
      basis_segment_ids: [AIA-TEXT-A052-P001]
  mandatory_content:
  - information necessary to demonstrate that the Article 51(1)(a) requirement has been met
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  implementation_refs:
  - AIA-RULE-GP-A52-1
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A052-P1-DESIGNATE-UNNOTIFIED-MODEL
  source: A052-P001
  quote: If the Commission becomes aware of a general-purpose AI model presenting systemic risks of which
    it has not been notified, it may decide to designate it as a model with systemic risk.
  action: designate an unnotified general-purpose AI model presenting systemic risks as a model with systemic
    risk
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A052-P001]
  targets: []
  kind: power
  conditions:
    operator: all_of
    operands:
    - text: If the Commission becomes aware of a general-purpose AI model presenting systemic risks of which it has not been notified
      basis_segment_ids: [AIA-TEXT-A052-P001]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A052-P2-PRESENT-REBUTTAL
  source: A052-P002
  quote: The provider of a general-purpose AI model that meets the condition referred to in Article 51(1),
    point (a), may present, with its notification, sufficiently substantiated arguments to demonstrate
    that, exceptionally, although it meets that requirement, the general-purpose AI model does not present,
    due to its specific characteristics, systemic risks and therefore should not be classified as a general-purpose
    AI model with systemic risk.
  action: present substantiated model-specific arguments with the notification against systemic-risk classification
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A052-P002]
  targets: []
  kind: permission
  conditions:
    operator: all_of
    operands:
    - text: The provider of a general-purpose AI model that meets the condition referred to in Article 51(1), point (a)
      basis_segment_ids: [AIA-TEXT-A052-P002]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  product_scope: no_product_action
  product_scope_reason: Grants an optional rebuttal procedure rather than imposing a compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_reported
- norm_id: AIA-NORM-A052-P3-REJECT-UNSUBSTANTIATED-ARGUMENTS
  source: A052-P003
  quote: Where the Commission concludes that the arguments submitted pursuant to paragraph 2 are not sufficiently
    substantiated and the relevant provider was not able to demonstrate that the general-purpose AI model
    does not present, due to its specific characteristics, systemic risks, it shall reject those arguments
  action: reject insufficiently substantiated rebuttal arguments that fail to demonstrate absence of systemic
    risk
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A052-P003]
  targets: []
  conditions:
    operator: all_of
    operands:
    - text: Where the Commission concludes that the arguments submitted pursuant to paragraph 2 are not sufficiently substantiated
      basis_segment_ids: [AIA-TEXT-A052-P003]
    - text: the relevant provider was not able to demonstrate that the general-purpose AI model does not present, due to its specific characteristics, systemic risks
      basis_segment_ids: [AIA-TEXT-A052-P003]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A052-P3-SYSTEMIC-RISK-CONSEQUENCE
  source: A052-P003
  quote: Where the Commission concludes that the arguments submitted pursuant to paragraph 2 are not sufficiently
    substantiated and the relevant provider was not able to demonstrate that the general-purpose AI model
    does not present, due to its specific characteristics, systemic risks, it shall reject those arguments,
    and the general-purpose AI model shall be considered to be a general-purpose AI model with systemic
    risk.
  action: classify the model as a general-purpose AI model with systemic risk after unsuccessful rebuttal
  actors: none
  targets:
  - target_ref: general-purpose AI model
    basis_segment_ids: [AIA-TEXT-A052-P003]
  kind: legal_consequence
  conditions:
    operator: all_of
    operands:
    - text: Where the Commission concludes that the arguments submitted pursuant to paragraph 2 are not sufficiently substantiated
      basis_segment_ids: [AIA-TEXT-A052-P003]
    - text: the relevant provider was not able to demonstrate that the general-purpose AI model does not present, due to its specific characteristics, systemic risks
      basis_segment_ids: [AIA-TEXT-A052-P003]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  implementation_mode: applicability_question
  implementation_refs:
  - AIA-CQ-SYSTEMIC-RISK
  implementation_reason: The consequence is the Article 51 classification outcome, a general-purpose AI
    model with systemic risk, so the systemic-risk classification question answers it.
  verification_mode: answered_by_classification
  verified_by: vidibro
- norm_id: AIA-NORM-A052-P4-DESIGNATE-SYSTEMIC-RISK
  source: A052-P004
  quote: The Commission may designate a general-purpose AI model as presenting systemic risks, ex officio
    or following a qualified alert from the scientific panel pursuant to Article 90(1), point (a), on
    the basis of criteria set out in Annex XIII.
  action: designate a general-purpose AI model as presenting systemic risks using Annex XIII criteria
  actors:
