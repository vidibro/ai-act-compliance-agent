- norm_id: AIA-NORM-A074-P7-REPORT-PRUDENTIALLY-RELEVANT-INFORMATION
  source: A074-P011
  quote: National market surveillance authorities supervising regulated credit institutions regulated
    under Directive 2013/36/EU, which are participating in the Single Supervisory Mechanism established
    by Regulation (EU) No 1024/2013, should report, without delay, to the European Central Bank any information
    identified in the course of their market surveillance activities that may be of potential interest
    for the prudential supervisory tasks of the European Central Bank specified in that Regulation.
  action: should report without delay to the European Central Bank market-surveillance information potentially
    relevant to its prudential-supervision tasks
  actors:
  - actor_ref: market_surveillance_authority
    basis_segment_ids: [AIA-TEXT-A074-P011]
