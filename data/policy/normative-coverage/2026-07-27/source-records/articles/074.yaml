  verified_by: vidibro
- norm_id: AIA-NORM-A074-P8-SENSITIVE-SECTOR-AUTHORITIES
  source: A074-P012
  quote: For high-risk AI systems listed in point 1 of Annex III to this Regulation, in so far as the
    systems are used for law enforcement purposes, border management and justice and democracy, and for
    high-risk AI systems listed in points 6, 7 and 8 of Annex III to this Regulation, Member States shall
    designate as market surveillance authorities for the purposes of this Regulation either the competent
    data protection supervisory authorities under Regulation (EU) 2016/679 or Directive (EU) 2016/680,
    or any other authority designated pursuant to the same conditions laid down in Articles 41 to 44 of
    Directive (EU) 2016/680.
  action: designate, for the enacted Annex III systems, either the competent data protection supervisory
    authorities or another authority designated under the same Articles 41 to 44 conditions as market
    surveillance authorities
  actors:
  - actor_ref: member_state
    basis_segment_ids: [AIA-TEXT-A074-P012]
  targets: []
