- norm_id: AIA-NORM-A074-P2-ANNUAL-SURVEILLANCE-REPORTING
  source: A074-P004
  quote: As part of their reporting obligations under Article 34(4) of Regulation (EU) 2019/1020, the
    market surveillance authorities shall report annually to the Commission and relevant national competition
    authorities any information identified in the course of market surveillance activities that may be
    of potential interest for the application of Union law on competition rules.
  action: report annually to the Commission and the relevant national competition authorities any surveillance
    information of potential interest for applying Union competition law
