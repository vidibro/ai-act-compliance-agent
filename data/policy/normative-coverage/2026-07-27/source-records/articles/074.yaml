  verification_mode: not_reported
- norm_id: AIA-NORM-A074-P8-PRESERVE-JUDICIAL-INDEPENDENCE
  source: A074-P012
  quote: Market surveillance activities shall in no way affect the independence of judicial authorities,
    or otherwise interfere with their activities when acting in their judicial capacity.
  action: conduct no market surveillance activity that affects the independence of judicial authorities
    or otherwise interferes with their activities when acting in their judicial capacity
