- norm_id: AIA-NORM-A074-P10-FACILITATE-NATIONAL-COORDINATION
  source: A074-P014
  quote: Member States shall facilitate coordination between market surveillance authorities designated
    under this Regulation and other relevant national authorities or bodies which supervise the application
    of Union harmonisation legislation listed in Annex I, or in other Union law, that might be relevant
    for the high-risk AI systems referred to in Annex III.
  action: facilitate coordination between AI surveillance and other relevant national authorities
