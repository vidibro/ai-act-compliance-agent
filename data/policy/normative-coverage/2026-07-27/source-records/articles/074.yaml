- norm_id: AIA-NORM-A074-P4-USE-EQUIVALENT-SECTORAL-PROCEDURES
  source: A074-P007
  quote: The procedures referred to in Articles 79 to 83 of this Regulation shall not apply to AI systems
    related to products covered by the Union harmonisation legislation listed in section A of Annex I,
    where such legal acts already provide for procedures ensuring an equivalent level of protection and
    having the same objective. In such cases, the relevant sectoral procedures shall apply instead.
  action: substitute same-objective sectoral procedures providing equivalent protection for Articles 79
    to 83
  actors:
  - actor_ref: market_surveillance_authority
    basis_segment_ids: [AIA-TEXT-A074-P007]
  targets: []
