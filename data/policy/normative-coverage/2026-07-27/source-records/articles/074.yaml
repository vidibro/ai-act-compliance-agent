- norm_id: AIA-NORM-A074-P3-SECTORAL-SURVEILLANCE-AUTHORITY
  source: A074-P005
  quote: For high-risk AI systems related to products covered by the Union harmonisation legislation listed
    in Section A of Annex I, the market surveillance authority for the purposes of this Regulation shall
    be the authority responsible for market surveillance activities designated under those legal acts.
  action: assign Section A product surveillance to the sectoral authority unless a coordinated alternative
    is designated
  actors:
  - actor_ref: member_state
