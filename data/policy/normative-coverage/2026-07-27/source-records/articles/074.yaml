- norm_id: AIA-NORM-A074-P6-FINANCIAL-SUPERVISOR-AUTHORITY
  source: A074-P009
  quote: For high-risk AI systems placed on the market, put into service, or used by financial institutions
    regulated by Union financial services law, the market surveillance authority for the purposes of this
    Regulation shall be the relevant national authority responsible for the financial supervision of those
    institutions under that legislation in so far as the placing on the market, putting into service,
    or the use of the AI system is in direct connection with the provision of those financial services.
  action: assign directly connected financial-services AI surveillance to the relevant financial supervisor
  actors:
  - actor_ref: member_state
    basis_segment_ids: [AIA-TEXT-A074-P010]
