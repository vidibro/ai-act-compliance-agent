- norm_id: AIA-NORM-A074-P12-GRANT-DOCUMENTATION-AND-DATA-ACCESS
  source: A074-P016
  quote: Without prejudice to the powers provided for under Regulation (EU) 2019/1020, and where relevant
    and limited to what is necessary to fulfil their tasks, the market surveillance authorities shall
    be granted full access by providers to the documentation as well as the training, validation and testing
    data sets used for the development of high-risk AI systems, including, where appropriate and subject
    to security safeguards, through application programming interfaces (API) or other relevant technical
    means and tools enabling remote access.
  action: grant necessary full authority access to documentation and development data sets including safeguarded
    remote access where appropriate
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A074-P016]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_refs:
  - AIA-RULE-PO-A74-12
  verification_mode: reported_not_judged
  verified_by: vidibro
  conditions:
    operator: all_of
    operands:
    - text: where relevant and limited to what is necessary to fulfil their tasks
      basis_segment_ids: [AIA-TEXT-A074-P016]
