- norm_id: AIA-NORM-A074-P5-REMOTE-SURVEILLANCE-POWERS
  source: A074-P008
  quote: Without prejudice to the powers of market surveillance authorities under Article 14 of Regulation
    (EU) 2019/1020, for the purpose of ensuring the effective enforcement of this Regulation, market surveillance
    authorities may exercise the powers referred to in Article 14(4), points (d) and (j), of that Regulation
    remotely, as appropriate.
  action: exercise Article 14(4)(d) and (j) surveillance powers remotely as appropriate
  actors:
