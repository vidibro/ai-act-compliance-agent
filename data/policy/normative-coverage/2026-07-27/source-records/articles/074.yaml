- norm_id: AIA-NORM-A074-P11-JOINT-ACTIVITIES
  source: A074-P015
  quote: Market surveillance authorities and the Commission shall be able to propose joint activities,
    including joint investigations, to be conducted by either market surveillance authorities or market
    surveillance authorities jointly with the Commission, that have the aim of promoting compliance, identifying
    non-compliance, raising awareness or providing guidance in relation to this Regulation with respect
    to specific categories of high-risk AI systems that are found to present a serious risk across two
    or more Member States in accordance with Article 9 of Regulation (EU) 2019/1020.
  action: propose joint activities, including joint investigations, on categories of high-risk AI systems
    found to present a serious risk across two or more Member States
  actors:
  - actor_ref: market_surveillance_authority
    basis_segment_ids: [AIA-TEXT-A074-P015]
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A074-P015]
