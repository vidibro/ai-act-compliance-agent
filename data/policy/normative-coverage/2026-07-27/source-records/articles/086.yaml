records:
- norm_id: AIA-NORM-A086-P1-PROVIDE-EXPLANATION
  source: A086-P001
  quote: Any affected person subject to a decision which is taken by the deployer on the basis of the
    output from a high-risk AI system listed in Annex III, with the exception of systems listed under
    point 2 thereof, and which produces legal effects or similarly significantly affects that person in
    a way that they consider to have an adverse impact on their health, safety or fundamental rights shall
    have the right to obtain from the deployer clear and meaningful explanations of the role of the AI
    system in the decision-making procedure and the main elements of the decision taken.
  action: provide a clear meaningful explanation of the AI system's decision-making role and the decision's
    main elements to an eligible affected person
  actors:
  - actor_ref: deployer
  targets: []
  conditions:
  - the deployer took a decision on the basis of output from a high-risk AI system listed in Annex III
  - the decision produces legal effects on the affected person or similarly significantly affects them
  - the affected person considers the decision to have an adverse impact on their health, safety or fundamental
    rights
  exceptions:
  - the system is listed under point 2 of Annex III
  implementation_refs:
  - AIA-DP-A86
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A086-P1-RIGHT-TO-EXPLANATION
  source: A086-P001
  quote: shall have the right to obtain from the deployer clear and meaningful explanations
  action: obtain a clear meaningful explanation from the deployer when an eligible Annex III system-based
    decision adversely affects the person
  actors:
  - actor_ref: affected_person
  targets: []
  kind: entitlement
  product_scope: no_product_action
  product_scope_reason: This records the person's correlative entitlement; the deployer action is mapped
    separately.
  implementation_mode: none_required
  implementation_reason: No independent product action arises beyond the mapped deployer duty.
  verification_mode: not_reported
  conditions:
  - the deployer took a decision on the basis of output from a high-risk AI system listed in Annex III
  - the decision produces legal effects on the affected person or similarly significantly affects them
  - the affected person considers the decision to have an adverse impact on their health, safety or fundamental
    rights
  exceptions:
  - the system is listed under point 2 of Annex III
- norm_id: AIA-NORM-A086-P2-LEGAL-EXCEPTIONS
  source: A086-P002
  quote: Paragraph 1 shall not apply to the use of AI systems for which exceptions from, or restrictions
    to, the obligation under that paragraph follow from Union or national law in compliance with Union
    law.
  action: disapply paragraph 1 to the extent compliant Union or national law supplies an exception or
    restriction
  actors:
  - actor_ref: deployer
  targets: []
  kind: applicability
  product_scope: no_product_action
  product_scope_reason: This qualifies the mapped explanation duty rather than creating another action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A086-P3-SUBSIDIARY-RIGHT
  source: A086-P003
  quote: This Article shall apply only to the extent that the right referred to in paragraph 1 is not
    otherwise provided for under Union law.
  action: apply Article 86 only where Union law does not otherwise provide the explanation right
  actors:
  - actor_ref: public_authority
  targets: []
  kind: applicability
  product_scope: no_product_action
  product_scope_reason: This defines the right's legal boundary without creating another action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
