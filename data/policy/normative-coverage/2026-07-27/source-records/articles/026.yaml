records:
- norm_id: AIA-NORM-A026-P1-INSTRUCTION-COMPLIANT-USE
  source: A026-P1
  quote: Deployers of high-risk AI systems shall take appropriate technical and organisational measures
    to ensure they use such systems in accordance with the instructions for use accompanying the systems,
    pursuant to paragraphs 3 and 6.
  action: take appropriate technical and organisational measures to use the system according to its accompanying
    instructions
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs: &id001
  - AIA-DP-A26
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P2-HUMAN-OVERSIGHT-ASSIGNMENT
  source: A026-P2
  quote: Deployers shall assign human oversight to natural persons who have the necessary competence,
    training and authority, as well as the necessary support.
  action: assign human oversight to persons with all necessary competence, training, authority, and support
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs: *id001
  verification_mode: reported_not_judged
  mandatory_content:
  - necessary competence
  - necessary training
  - necessary authority
  - necessary support
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P3-PRESERVE-OTHER-OBLIGATIONS
  source: A026-P3
  quote: The obligations set out in paragraphs 1 and 2, are without prejudice to other deployer obligations
    under Union or national law and to the deployer’s freedom to organise its own resources and activities
    for the purpose of implementing the human oversight measures indicated by the provider.
  action: preserve other Union and national deployer obligations and the deployer's freedom to organise
    resources and activities used to implement provider-indicated human oversight alongside Article 26(1)
    and (2)
  subject_ref: deployer
  subject_category: supported_operator
  kind: applicability
  product_scope: dependency_only
  product_scope_reason: This saving clause preserves external duties without creating an independent product
    action.
  implementation_mode: none_required
  implementation_reason: The preserved obligations are represented as external legal dependencies.
  verification_mode: not_reported
  mandatory_content:
  - other deployer obligations under Union or national law remain unaffected
  - the deployer's freedom to organise resources and activities for implementing provider-indicated human
    oversight remains unaffected
  dependencies:
  - dependency_ref: other applicable deployer obligations under Union or national law
    resolution: external_recorded
    detail: The preserved obligations arise outside this Article.
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P4-INPUT-DATA-QUALITY
  source: A026-P4
  quote: to the extent the deployer exercises control over the input data, that deployer shall ensure
    that input data is relevant and sufficiently representative in view of the intended purpose of the
    high-risk AI system
  action: ensure controlled input data is relevant and sufficiently representative for the system's intended
    purpose
  subject_ref: deployer
  subject_category: supported_operator
  conditions:
  - the deployer exercises control over the input data
  implementation_refs: *id001
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P5-MONITOR
  source: A026-P5
  quote: Deployers shall monitor the operation of the high-risk AI system on the basis of the instructions
    for use and, where relevant, inform providers in accordance with Article 72.
  action: monitor system operation on the basis of the instructions for use and, where relevant, inform
    providers in accordance with Article 72
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-DP-A26
  verification_mode: reported_not_judged
  mandatory_content:
  - monitor operation on the basis of the instructions for use
  - where relevant, inform providers in accordance with Article 72
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P5-RISK-NOTIFY
  source: A026-P5
  quote: Where deployers have reason to consider that the use of the high-risk AI system in accordance
    with the instructions may result in that AI system presenting a risk within the meaning of Article
    79(1), they shall, without undue delay, inform the provider or distributor and the relevant market
    surveillance authority, and shall suspend the use of that system.
  action: without undue delay notify the provider or distributor and relevant market-surveillance authority
    of an Article 79(1) risk and suspend use of the system
  subject_ref: deployer
  subject_category: supported_operator
  conditions:
  - the deployer has reason to consider that use in accordance with the instructions may result in the
    AI system presenting a risk within the meaning of Article 79(1)
  implementation_refs:
  - AIA-DP-A26
  verification_mode: reported_not_judged
  mandatory_content:
  - without undue delay inform the provider or distributor and relevant market-surveillance authority
  - suspend use of the system
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P5-INCIDENT
  source: A026-P5
  quote: Where deployers have identified a serious incident, they shall also immediately inform first
    the provider, and then the importer or distributor and the relevant market surveillance authorities
    of that incident.
  action: report an identified serious incident in the enacted sequence
  subject_ref: deployer
  subject_category: supported_operator
  conditions:
  - the deployer has identified a serious incident
  implementation_refs:
  - AIA-DP-A26
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P5-FALLBACK
  source: A026-P5
  quote: If the deployer is not able to reach the provider, Article 73 shall apply mutatis mutandis.
  action: apply the Article 73 reporting route when the provider cannot be reached
  subject_ref: deployer
  subject_category: supported_operator
  kind: applicability
  conditions:
  - the deployer is not able to reach the provider
  implementation_refs:
  - AIA-DP-A26
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P5-SENSITIVE
  source: A026-P5
  quote: This obligation shall not cover sensitive operational data of deployers of AI systems which are
    law enforcement authorities.
  action: exclude sensitive operational data of law-enforcement deployers
  subject_ref: deployer
  subject_category: supported_operator
  kind: applicability
  conditions:
  - the deployer is a law enforcement authority
  implementation_refs:
  - AIA-DP-A26
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P5-FINANCIAL
  source: A026-P5
  quote: For deployers that are financial institutions subject to requirements regarding their internal
    governance, arrangements or processes under Union financial services law, the monitoring obligation
    set out in the first subparagraph shall be deemed to be fulfilled by complying with the rules on internal
    governance arrangements, processes and mechanisms pursuant to the relevant financial service law.
  action: deem financial institutions compliant through relevant financial-services governance rules
  subject_ref: financial_institution_deployer
  subject_category: supported_operator
  kind: legal_consequence
  conditions:
  - the deployer is a financial institution subject to requirements regarding its internal governance,
    arrangements or processes under Union financial services law
  implementation_refs:
  - AIA-DP-A26
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P6-KEEP-CONTROLLED-LOGS
  source: A026-P6
  quote: Deployers of high-risk AI systems shall keep the logs automatically generated by that high-risk
    AI system to the extent such logs are under their control, for a period appropriate to the intended
    purpose of the high-risk AI system, of at least six months, unless provided otherwise in applicable
    Union or national law, in particular in Union law on the protection of personal data.
  action: keep controlled automatically generated high-risk-system logs for a period appropriate to the
    system's intended purpose and for at least six months
  subject_ref: deployer
  subject_category: supported_operator
  conditions:
  - the automatically generated logs are under the deployer's control
  exceptions:
  - applicable Union or national law, particularly personal-data law, provides a different retention
    period
  implementation_refs: *id001
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P6-FINANCIAL-DOCUMENTATION
  source: A026-P6
  quote: Deployers that are financial institutions subject to requirements regarding their internal governance,
    arrangements or processes under Union financial services law shall maintain the logs as part of the
    documentation kept pursuant to the relevant Union financial service law.
  action: maintain automatically generated logs within documentation kept under applicable Union financial-services
    law
  subject_ref: financial_institution_deployer
  subject_category: supported_operator
  conditions:
  - the deployer is a financial institution subject to internal-governance requirements under Union financial-services
    law
  implementation_refs: *id001
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P7-INFORM-WORKERS
  source: A026-P7
  quote: "Before putting into service or using a high-risk AI system at the workplace, deployers who are\
    \ employers shall inform workers\u2019 representatives and the affected workers that they will be\
    \ subject to the use of the high-risk AI system."
  action: inform workers' representatives and affected workers before workplace deployment or use that
    they will be subject to the high-risk system
  subject_ref: employer_deployer
  subject_category: supported_operator
  conditions:
  - the deployer is an employer putting the high-risk system into service or using it at the workplace
  implementation_refs: *id001
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P7-FOLLOW-WORKER-INFORMATION-RULES
  source: A026-P7
  quote: This information shall be provided, where applicable, in accordance with the rules and procedures
    laid down in Union and national law and practice on information of workers and their representatives.
  action: provide the workplace-use notice according to applicable Union and national worker-information
    rules and practices
  subject_ref: employer_deployer
  subject_category: supported_operator
  conditions:
  - Union or national worker-information rules and practices apply
  implementation_refs: *id001
  verification_mode: reported_conditionally
  dependencies:
  - dependency_ref: applicable Union and national worker-information law and practice
    resolution: external_recorded
    detail: External law and practice determine the applicable notice procedure.
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P8-REGISTER
  source: A026-P8
  quote: Deployers of high-risk AI systems that are public authorities, or Union institutions, bodies,
    offices or agencies shall comply with the registration obligations referred to in Article 49.
  action: comply with the applicable Article 49 registration obligations
  subject_ref: public_authority_or_union_body_deployer
  subject_category: supported_operator
  conditions:
  - the deployer is a public authority or a Union institution, body, office, or agency
  implementation_refs: &id003
  - AIA-DP-A26-8
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P8-DO-NOT-USE-UNREGISTERED
  source: A026-P8
  quote: When such deployers find that the high-risk AI system that they envisage using has not been registered
    in the EU database referred to in Article 71, they shall not use that system
  action: do not use an envisaged high-risk system found absent from the EU database
  subject_ref: public_authority_or_union_body_deployer
  subject_category: supported_operator
  kind: prohibition
  conditions: &id004
  - the deployer satisfies the Article 26(8) public-authority or Union-body condition
  - the envisaged system is not registered in the Article 71 EU database
  implementation_refs: *id003
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P8-INFORM-UNREGISTERED
  source: A026-P8
  quote: shall inform the provider or the distributor
  action: inform the provider or distributor that the envisaged system is not registered in the EU database
  subject_ref: public_authority_or_union_body_deployer
  subject_category: supported_operator
  conditions: *id004
  implementation_refs: *id003
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P9-USE-ARTICLE-13-IN-DPIA
  source: A026-P9
  quote: Where applicable, deployers of high-risk AI systems shall use the information provided under
    Article 13 of this Regulation to comply with their obligation to carry out a data protection impact
    assessment under Article 35 of Regulation (EU) 2016/679 or Article 27 of Directive (EU) 2016/680.
  action: use Article 13 information when carrying out an applicable data-protection impact assessment
  subject_ref: deployer
  subject_category: supported_operator
  conditions:
  - the deployer owes a DPIA under Article 35 GDPR or Article 27 of Directive (EU) 2016/680
  implementation_refs:
  - AIA-DP-A26-9
  verification_mode: reported_not_judged
  dependencies:
  - dependency_ref: AIA-NORM-A013-P2-PROVIDE-INSTRUCTIONS
    resolution: internal_resolved
    detail: Article 13 supplies the provider information used by the deployer.
  - dependency_ref: Article 35 of Regulation (EU) 2016/679 or Article 27 of Directive (EU) 2016/680
    resolution: external_recorded
    detail: The external data-protection instruments determine whether and how the DPIA obligation applies.
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-PRESERVE-DIRECTIVE-2016-680
  source: A026-P10
  quote: Without prejudice to Directive (EU) 2016/680
  action: preserve the requirements of Directive (EU) 2016/680 when applying the post-remote biometric-identification
    regime
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  kind: applicability
  implementation_refs: &id005
  - AIA-DP-A26-10
  verification_mode: reported_conditionally
  dependencies:
  - dependency_ref: Directive (EU) 2016/680
    resolution: external_recorded
    detail: The Directive's requirements continue to apply alongside Article 26(10).
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-REQUEST-AUTHORISATION
  source: A026-P10
  quote: the deployer of a high-risk AI system for post-remote biometric identification shall request
    an authorisation, ex ante, or without undue delay and no later than 48 hours, by a judicial authority
    or an administrative authority whose decision is binding and subject to judicial review, for the use
    of that system
  action: request qualifying judicial or binding reviewable administrative authorisation before use or
    without undue delay and within 48 hours
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: &id006
  - the system is used for post-remote biometric identification in an investigation targeting a person
    suspected or convicted of a criminal offence
  exceptions:
  - initial identification of a potential suspect based on objective and verifiable facts directly linked
    to the offence
  dependencies:
  - dependency_ref: AIA-NORM-A026-P10-PRESERVE-DIRECTIVE-2016-680
    resolution: internal_resolved
    detail: The authorisation regime remains without prejudice to Directive (EU) 2016/680.
  implementation_refs: *id005
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-STRICT-NECESSITY
  source: A026-P10
  quote: Each use shall be limited to what is strictly necessary for the investigation of a specific criminal
    offence.
  action: limit each post-remote biometric-identification use to what is strictly necessary for investigating
    a specific offence
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: *id006
  implementation_refs: *id005
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-STOP-ON-REJECTION
  source: A026-P10
  quote: If the authorisation requested pursuant to the first subparagraph is rejected, the use of the
    post-remote biometric identification system linked to that requested authorisation shall be stopped
    with immediate effect
  action: stop the authorised use immediately when the authorisation request is rejected
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: &id007
  - the requested authorisation is rejected
  implementation_refs: *id005
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-DELETE-ON-REJECTION
  source: A026-P10
  quote: the personal data linked to the use of the high-risk AI system for which the authorisation was
    requested shall be deleted
  action: delete personal data linked to the use for which authorisation was rejected
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: *id007
  implementation_refs: *id005
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-PROHIBIT-UNTARGETED-USE
  source: A026-P10
  quote: In no case shall such high-risk AI system for post-remote biometric identification be used for
    law enforcement purposes in an untargeted way, without any link to a criminal offence, a criminal
    proceeding, a genuine and present or genuine and foreseeable threat of a criminal offence, or the
    search for a specific missing person.
  action: prohibit untargeted law-enforcement use lacking the specified offence, proceeding, threat, or
    missing-person link
  subject_ref: law_enforcement_deployer
  subject_category: supported_operator
  conditions:
  - the deployer uses a high-risk AI system for post-remote biometric identification for law
    enforcement purposes
  kind: prohibition
  implementation_refs: *id005
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-NO-SOLE-OUTPUT-ADVERSE-DECISION
  source: A026-P10
  quote: It shall be ensured that no decision that produces an adverse legal effect on a person may be
    taken by the law enforcement authorities based solely on the output of such post-remote biometric
    identification systems.
  action: ensure law-enforcement authorities do not take an adverse legal decision based solely on the
    system's output
  subject_ref: law_enforcement_deployer
  subject_category: supported_operator
  conditions:
  - the deployer uses a high-risk AI system for post-remote biometric identification for law
    enforcement purposes
  kind: prohibition
  implementation_refs: *id005
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-PRESERVE-BIOMETRIC-DATA-LAW
  source: A026-P10
  quote: This paragraph is without prejudice to Article 9 of Regulation (EU) 2016/679 and Article 10 of
    Directive (EU) 2016/680 for the processing of biometric data.
  action: preserve the referenced GDPR and law-enforcement Directive rules for biometric-data processing
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  kind: applicability
  implementation_refs: *id005
  verification_mode: reported_conditionally
  dependencies:
  - dependency_ref: Article 9 of Regulation (EU) 2016/679 and Article 10 of Directive (EU) 2016/680
    resolution: external_recorded
    detail: The external instruments continue to govern biometric-data processing.
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-DOCUMENT-EACH-USE
  source: A026-P10
  quote: Regardless of the purpose or deployer, each use of such high-risk AI systems shall be documented
    in the relevant police file and shall be made available to the relevant market surveillance authority
    and the national data protection authority upon request, excluding the disclosure of sensitive operational
    data related to law enforcement.
  action: document every post-remote biometric-identification use in the relevant police file regardless
    of purpose or deployer and make that record available on request to the market-surveillance and national
    data-protection authorities
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions:
  - the deployer uses a high-risk AI system for post-remote biometric identification for law
    enforcement purposes
  implementation_refs: *id005
  verification_mode: reported_not_judged
  mandatory_content:
  - document each use in the relevant police file regardless of purpose or deployer
  - make the record available to either specified authority upon request
  exceptions:
  - sensitive operational data related to law enforcement must not be disclosed
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-PRESERVE-SUPERVISORY-POWERS
  source: A026-P10
  quote: This subparagraph shall be without prejudice to the powers conferred by Directive (EU) 2016/680
    on supervisory authorities.
  action: preserve supervisory-authority powers under Directive (EU) 2016/680
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  kind: applicability
  implementation_refs: *id005
  verification_mode: reported_conditionally
  dependencies:
  - dependency_ref: supervisory-authority powers under Directive (EU) 2016/680
    resolution: external_recorded
    detail: The external Directive defines the preserved supervisory powers.
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-ANNUAL-REPORTS
  source: A026-P10
  quote: Deployers shall submit annual reports to the relevant market surveillance and national data protection
    authorities on their use of post-remote biometric identification systems, excluding the disclosure
    of sensitive operational data related to law enforcement.
  action: submit annual post-remote biometric-identification use reports to both specified authorities
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  implementation_refs: *id005
  verification_mode: reported_not_judged
  mandatory_content:
  - report to the relevant market-surveillance authority
  - report to the national data-protection authority
  exceptions:
  - sensitive operational data related to law enforcement must not be disclosed
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-AGGREGATE-REPORTS
  source: A026-P10
  quote: The reports may be aggregated to cover more than one deployment.
  action: aggregate annual reports across multiple deployments
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions:
  - the deployer uses a high-risk AI system for post-remote biometric identification for law
    enforcement purposes
  - annual reports are submitted under Article 26(10)
  kind: permission
  implementation_refs: *id005
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P10-MEMBER-STATE-STRICTER-LAW
  source: A026-P10
  quote: Member States may introduce, in accordance with Union law, more restrictive laws on the use of
    post-remote biometric identification systems.
  action: introduce stricter national post-remote biometric-identification laws consistent with Union
    law
  subject_ref: member_state
  subject_category: member_state
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A026-P11-INFORM-NATURAL-PERSONS
  source: A026-P11
  quote: Without prejudice to Article 50 of this Regulation, deployers of high-risk AI systems referred
    to in Annex III that make decisions or assist in making
    decisions related to natural persons shall inform the natural persons that they are subject to the
    use of the high-risk AI system
  action: inform natural persons that they are subject to Annex III high-risk-system use in decision-making
  subject_ref: annex_iii_deployer
  subject_category: supported_operator
  conditions:
  - the Annex III high-risk system makes or assists decisions related to natural persons
  exceptions:
  - law-enforcement use follows Article 13 of Directive (EU) 2016/680
  dependencies:
  - dependency_ref: Article 50 of this Regulation
    resolution: unresolved
    detail: The Article 26(11) notice duty operates without prejudice to Article 50.
  implementation_refs: &id008
  - AIA-DP-A26-11
  verification_mode: reported_not_judged
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P11-LAW-ENFORCEMENT-NOTICE
  source: A026-P11
  quote: For high-risk AI systems used for law enforcement purposes Article 13 of Directive (EU) 2016/680
    shall apply.
  action: apply the Directive (EU) 2016/680 Article 13 notice regime to law-enforcement use
  subject_ref: law_enforcement_deployer
  subject_category: supported_operator
  kind: applicability
  conditions:
  - the high-risk system is used for law-enforcement purposes
  implementation_refs: *id008
  verification_mode: reported_conditionally
  dependencies:
  - dependency_ref: Article 13 of Directive (EU) 2016/680
    resolution: external_recorded
    detail: The external Directive supplies the applicable law-enforcement notice regime.
  verified_by: vidibro
- norm_id: AIA-NORM-A026-P12-COOPERATE
  source: A026-P12
  quote: Deployers shall cooperate with the relevant competent authorities in any action those authorities
    take in relation to the high-risk AI system in order to implement this Regulation.
  action: cooperate with relevant competent-authority actions concerning the high-risk system
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-DP-A26-12
  verification_mode: reported_not_judged
  verified_by: vidibro
