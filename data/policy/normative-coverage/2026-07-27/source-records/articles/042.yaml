records:
- norm_id: AIA-NORM-A042-P1-REPRESENTATIVE-DATA-PRESUMPTION
  source: A042-P001
  quote: High-risk AI systems that have been trained and tested on data reflecting the specific geographical,
    behavioural, contextual or functional setting within which they are intended to be used shall be presumed
    to comply with the relevant requirements laid down in Article 10(4).
  action: presume Article 10(4) compliance from training and testing data reflecting the intended-use
    setting
  actors: none
  targets:
  - target_ref: High-risk AI systems
    basis_segment_ids: [AIA-TEXT-A042-P001]
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-HR-A10
  verification_mode: reported_conditionally
  conditions:
    operator: all_of
    operands:
    - text: that have been trained and tested on data reflecting the specific geographical, behavioural, contextual or functional setting within which they are intended to be used
      basis_segment_ids: [AIA-TEXT-A042-P001]
  verified_by: vidibro
- norm_id: AIA-NORM-A042-P2-CYBERSECURITY-CERTIFICATE-PRESUMPTION
  source: A042-P002
  quote: High-risk AI systems that have been certified or for which a statement of conformity has been
    issued under a cybersecurity scheme pursuant to Regulation (EU) 2019/881 and the references of which
    have been published in the Official Journal of the European Union shall be presumed to comply with
    the cybersecurity requirements set out in Article 15 of this Regulation in so far as the cybersecurity
    certificate or statement of conformity or parts thereof cover those requirements.
  action: presume covered Article 15 cybersecurity compliance from a published Regulation 2019/881 certificate
    or conformity statement
  actors: none
  targets:
  - target_ref: High-risk AI systems
    basis_segment_ids: [AIA-TEXT-A042-P002]
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-HR-A15
  verification_mode: reported_conditionally
  conditions:
    operator: all_of
    operands:
    - text: that have been certified or for which a statement of conformity has been issued under a cybersecurity scheme pursuant to Regulation (EU) 2019/881
      basis_segment_ids: [AIA-TEXT-A042-P002]
    - text: the references of which have been published in the Official Journal of the European Union
      basis_segment_ids: [AIA-TEXT-A042-P002]
    - text: in so far as the cybersecurity certificate or statement of conformity or parts thereof cover those requirements
      basis_segment_ids: [AIA-TEXT-A042-P002]
  verified_by: vidibro
- norm_id: AIA-NORM-A042-P3-CYBER-RESILIENCE-DEEMING
  source: A042-P003
  quote: Where high-risk AI systems fall within the scope of Regulation (EU) 2024/2847 and the conditions
    laid down in Article 12(1) of that Regulation are fulfilled, such systems shall be deemed to comply
    with the cybersecurity requirements set out in Article 15 of this Regulation.
  action: deem Article 15 cybersecurity requirements satisfied when Regulation 2024/2847 and its Article
    12(1) conditions apply
  actors: none
  targets:
  - target_ref: high-risk AI systems
    basis_segment_ids: [AIA-TEXT-A042-P003]
  kind: legal_consequence
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-HR-A15
  verification_mode: reported_conditionally
  conditions:
    operator: all_of
    operands:
    - text: Where high-risk AI systems fall within the scope of Regulation (EU) 2024/2847
      basis_segment_ids: [AIA-TEXT-A042-P003]
    - text: the conditions laid down in Article 12(1) of that Regulation are fulfilled
      basis_segment_ids: [AIA-TEXT-A042-P003]
  verified_by: vidibro
