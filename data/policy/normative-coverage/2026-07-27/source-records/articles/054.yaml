- norm_id: AIA-NORM-A054-P6-OPEN-SOURCE-EXCEPTION
  source: A054-P010
  quote: The obligation set out in this Article shall not apply to providers of general-purpose AI models
    that are released under a free and open-source licence that allows for the access, usage, modification,
    and distribution of the model, and whose parameters, including the weights, the information on the
    model architecture, and the information on model usage, are made publicly available, unless the general-purpose
    AI models present systemic risks.
  action: disapply Article 54 where every enacted free-and-open-source condition is met, except for general-purpose
    AI models presenting systemic risk
  actors:
  - actor_ref: gpai_provider
    basis_segment_ids: [AIA-TEXT-A054-P010]
  targets: []
  kind: applicability
  conditions:
    operator: all_of
    operands:
    - text: released under a free and open-source licence that allows for the access, usage, modification, and distribution of the model
      basis_segment_ids: [AIA-TEXT-A054-P010]
    - text: whose parameters, including the weights, the information on the model architecture, and the information on model usage, are made publicly available
      basis_segment_ids: [AIA-TEXT-A054-P010]
  exceptions:
    operator: any_of
    operands:
    - text: unless the general-purpose AI models present systemic risks
      basis_segment_ids: [AIA-TEXT-A054-P010]
  temporal_regime_id: AIA-TEMP-CHAPTER-V
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-GP-A54-1
  - AIA-RULE-GP-A54-2
  - AIA-RULE-GPAR-A54-3
  - AIA-RULE-GP-A54-4
  - AIA-RULE-GPAR-A54-5
  - AIA-CQ-OPEN-SOURCE-RELEASE
  implementation_reason: Each Article 54 rule encodes this exception in its activation condition.
  verification_mode: reported_conditionally
  verified_by: vidibro
