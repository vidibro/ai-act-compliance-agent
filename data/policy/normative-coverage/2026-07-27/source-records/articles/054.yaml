- norm_id: AIA-NORM-A054-P3-MANDATE-EMPOWER-TASKS
  source: A054-P003
  quote: 'For the purposes of this Regulation, the mandate shall empower the authorised representative
    to carry out the following tasks:'
  action: ensure the written mandate empowers the authorised representative to carry out every Article
    54(3)(a) to (d) task
