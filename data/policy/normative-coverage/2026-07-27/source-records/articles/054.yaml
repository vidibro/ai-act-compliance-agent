  source: A054-P001
  quote: Prior to placing a general-purpose AI model on the Union market, providers established in third
    countries shall, by written mandate, appoint an authorised representative which is established in
    the Union.
  action: appoint by written mandate a Union-established authorised representative before placing the
    model on the Union market
  actors:
