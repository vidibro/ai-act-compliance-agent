  verification_mode: reported_not_judged
  mandatory_content:
  - authority to verify the Annex XI documentation and the provider's fulfilment of Article 53 and, where
    applicable, Article 55
  - authority to keep the Annex XI documentation and the provider's contact details available for 10 years
  - authority to provide the AI Office with compliance information on reasoned request
  - authority to cooperate with the AI Office and competent authorities on reasoned request
  verified_by: vidibro
