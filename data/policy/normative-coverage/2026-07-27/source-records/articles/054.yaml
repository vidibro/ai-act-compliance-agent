- norm_id: AIA-NORM-A054-P4-AUTHORITY-ADDRESS-TERM
  source: A054-P008
  quote: The mandate shall empower the authorised representative to be addressed, in addition to or instead
    of the provider, by the AI Office or the competent authorities, on all issues related to ensuring
    compliance with this Regulation.
  action: empower the representative to be addressed in addition to or instead of the provider on all
    compliance issues
