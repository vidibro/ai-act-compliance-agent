records:
- norm_id: AIA-NORM-A031-P1-ESTABLISHMENT-AND-PERSONALITY
  source: A031-P001
  quote: A notified body shall be established under the national law of a Member State and shall have
    legal personality.
  action: be established under Member-State law and possess legal personality
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - Member-State-law establishment
  - legal personality
- norm_id: AIA-NORM-A031-P2-OPERATING-REQUIREMENTS
  source: A031-P002
  quote: Notified bodies shall satisfy the organisational, quality management, resources and process requirements
    that are necessary to fulfil their tasks, as well as suitable cybersecurity requirements.
  action: satisfy all organisational, quality-management, resource, process, and cybersecurity requirements
    necessary for notified-body tasks
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P3-PERFORMANCE-CONFIDENCE
  source: A031-P003
  quote: The organisational structure, allocation of responsibilities, reporting lines and operation of
    notified bodies shall ensure confidence in their performance, and in the results of the conformity
    assessment activities that the notified bodies conduct.
  action: structure responsibilities, reporting, and operations to ensure confidence in performance and
    assessment results
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P4-INDEPENDENCE
  source: A031-P004
  quote: Notified bodies shall be independent of the provider of a high-risk AI system in relation to
    which they perform conformity assessment activities. Notified bodies shall also be independent of
    any other operator having an economic interest in high-risk AI systems assessed, as well as of any
    competitors of the provider.
  action: remain independent from assessed-system providers, economically interested operators, and provider
    competitors
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P4-NECESSARY-USE-ALLOWED
  source: A031-P004
  quote: This shall not preclude the use of assessed high-risk AI systems that are necessary for the operations
    of the conformity assessment body, or the use of such high-risk AI systems for personal purposes.
  action: allow necessary operational or personal use of assessed high-risk systems despite the independence
    rule
  actors:
  - actor_ref: notified_body
  targets: []
  kind: permission
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P5-CONFLICTING-ACTIVITIES-PROHIBITED
  source: A031-P005
  quote: They shall not engage in any activity that might conflict with their independence of judgement or
    integrity in relation to conformity assessment activities for which they are notified. This shall,
    in particular, apply to consultancy services.
  action: prohibit the conformity assessment body, its top-level management and assessment personnel
    from activities conflicting with independence of judgement or assessment integrity, in particular consultancy
  actors:
  - actor_ref: conformity_assessment_body
  - actor_ref: conformity_assessment_body_personnel
  targets: []
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P6-IMPARTIALITY-SYSTEM
  source: A031-P006
  quote: Notified bodies shall document and implement a structure and
    procedures to safeguard impartiality and to promote and apply the principles of impartiality throughout
    their organisation, personnel and assessment activities.
  action: document and implement structures and procedures safeguarding impartiality and promoting
    and applying its principles throughout the organisation, personnel and assessment activities
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P7-CONFIDENTIALITY-AND-SECRECY
  source: A031-P007
  quote: Notified bodies shall have documented procedures in place ensuring that their personnel, committees,
    subsidiaries, subcontractors and any associated body or personnel of external bodies maintain, in
    accordance with Article 78, the confidentiality of the information which comes into their possession
    during the performance of conformity assessment activities, except when its disclosure is required
    by law.
  action: maintain documented procedures ensuring Article 78 confidentiality for personnel, committees,
    subsidiaries, subcontractors and associated external bodies or personnel during conformity assessment
  exceptions:
  - disclosure required by law
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P8-PROPORTIONATE-PROCEDURES
  source: A031-P008
  quote: Notified bodies shall have procedures for the performance of activities which take due account
    of the size of a provider, the sector in which it operates, its structure, and the degree of complexity
    of the AI system concerned.
  action: use assessment procedures proportionate to provider size, sector, structure, and system complexity
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P9-LIABILITY-INSURANCE
  source: A031-P009
  quote: Notified bodies shall take out appropriate liability insurance for their conformity assessment
    activities, unless liability is assumed by the Member State in which they are established in accordance
    with national law or that Member State is itself directly responsible for the conformity assessment.
  action: obtain appropriate assessment liability insurance unless the establishment Member State assumes
    liability or responsibility
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  exceptions:
  - liability is assumed by the Member State in which the notified body is established in accordance
    with national law
  - that Member State is itself directly responsible for the conformity assessment
  verified_by: vidibro
- norm_id: AIA-NORM-A031-P10-INTEGRITY-AND-COMPETENCE
  source: A031-P010
  quote: Notified bodies shall be capable of carrying out all their tasks under this Regulation with the
    highest degree of professional integrity and the requisite competence in the specific field, whether
    those tasks are carried out by notified bodies themselves or on their behalf and under their responsibility.
  action: ensure every task is performed with the highest professional integrity and requisite field competence
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P11-INTERNAL-COMPETENCE-AND-STAFF
  source: A031-P011
  quote: Notified bodies shall have sufficient internal competences to be able effectively to evaluate
    the tasks conducted by external parties on their behalf.
  action: maintain sufficient internal competence to evaluate effectively the tasks conducted by external
    parties on the notified body's behalf
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P12-COORDINATION-AND-STANDARDS
  source: A031-P012
  quote: Notified bodies shall participate in coordination activities as referred to in Article 38.
  action: participate in the coordination activities referred to in Article 38
  actors:
  - actor_ref: notified_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P5-DIRECT-INVOLVEMENT-PROHIBITED
  source: A031-P005
  quote: Neither a conformity assessment body, its top-level management nor the personnel
    responsible for carrying out its conformity assessment tasks shall be directly involved in the
    design, development, marketing or use of high-risk AI systems, nor shall they represent the parties
    engaged in those activities.
  action: prohibit the conformity assessment body, its top-level management and assessment personnel
    from direct involvement in high-risk AI-system design, development, marketing or use and from representing
    parties engaged in those activities
  actors:
  - actor_ref: conformity_assessment_body
  - actor_ref: conformity_assessment_body_personnel
  targets: []
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  mandatory_content:
  - no direct involvement in designing, developing, marketing or using high-risk AI systems
  - no representation of parties engaged in those activities
  verified_by: vidibro
- norm_id: AIA-NORM-A031-P6-INDEPENDENT-OPERATION
  source: A031-P006
  quote: Notified bodies shall be organised and operated so as to safeguard the independence,
    objectivity and impartiality of their activities.
  action: organise and operate the notified body to safeguard the independence, objectivity and
    impartiality of its activities
  actors:
  - actor_ref: notified_body
  targets: []
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P7-STAFF-PROFESSIONAL-SECRECY
  source: A031-P007
  quote: The staff of notified bodies shall be bound to observe professional secrecy with regard to
    all information obtained in carrying out their tasks under this Regulation, except in relation
    to the notifying authorities of the Member State in which their activities are carried out.
  action: observe professional secrecy for all information obtained in carrying out tasks under the
    Regulation
  actors:
  - actor_ref: conformity_assessment_body_personnel
  targets: []
  kind: obligation
  exceptions:
  - in relation to the notifying authorities of the Member State in which the staff's activities are carried out
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P11-PERMANENT-EXPERT-STAFF
  source: A031-P011
  quote: The notified body shall have permanent availability of sufficient administrative,
    technical, legal and scientific personnel who possess experience and knowledge relating to the
    relevant types of AI systems, data and data computing, and relating to the requirements set out
    in Section 2.
  action: maintain permanent availability of sufficient administrative, technical, legal and
    scientific staff with experience and knowledge of the relevant AI-system types, data and data
    computing, and Section 2 requirements
  actors:
  - actor_ref: notified_body
  targets: []
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A031-P12-STANDARDISATION-OR-STANDARDS-CURRENCY
  source: A031-P012
  quote: They shall also take part directly, or be represented in, European standardisation
    organisations, or ensure that they are aware and up to date in respect of relevant standards.
  action: take part directly in European standardisation organisations, be represented in them, or
    ensure awareness and current knowledge of relevant standards
  actors:
  - actor_ref: notified_body
  targets: []
  kind: obligation
  product_scope: outside_supported_actor
