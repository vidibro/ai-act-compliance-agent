- norm_id: AIA-NORM-A075A-P3-INFORMATION-REQUEST-CONTENT
  source: A075A-P005
  quote: the AI Office shall state the legal basis and the purpose of the request, specify what information is required, and set the period within which the information is to be provided.
  action: state the legal basis and purpose of the request, specify the information required and set
    the period for providing it
  subject_ref: ai_office
  subject_category: union_institution_or_body
  mandatory_content:
  - the legal basis and the purpose of the request
  - what information is required
  - the period within which the information is to be provided
