- norm_id: AIA-NORM-A100-P5-FILE-ACCESS-ENTITLEMENT
  source: A100-P012
  quote: "They shall be entitled to have access to the European Data Protection Supervisor\u2019s file,\
    \ subject to the legitimate interest of individuals or undertakings in the protection of their personal\
    \ data or business secrets."
  action: have access to the European Data Protection Supervisor's file
  actors:
  - actor_ref: concerned_party
  targets: []
  kind: entitlement
  exceptions:
