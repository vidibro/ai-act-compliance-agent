records:
- norm_id: AIA-NORM-A100-P1-IMPOSE-UNION-BODY-FINES
  source: A100-P001
  quote: The European Data Protection Supervisor may impose administrative fines
  action: impose administrative fines on in-scope Union institutions bodies offices and agencies after considering all relevant circumstances and specified factors
  subject_ref: european_data_protection_supervisor
  subject_category: union_institution_or_body
  kind: power
  mandatory_content: [infringement nature gravity duration consequences affected persons and damage, responsibility and technical organisational measures, harm mitigation, cooperation and compliance with prior measures, similar previous infringements, how the infringement became known including self-notification, annual budget]
  qualifier_spans: [A100-P002, A100-P003, A100-P004, A100-P005, A100-P006, A100-P007, A100-P008]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A100-P2-ARTICLE5-FINE
  source: A100-P009
  quote: shall be subject to administrative fines of up to EUR 1500000
  action: expose Union-body Article 5 non-compliance to a fine up to EUR 1500000
  subject_ref: infringing_union_institution_or_body
  subject_category: union_institution_or_body
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: This enforcement consequence is outside the supported operator surface.
  implementation_mode: none_required
