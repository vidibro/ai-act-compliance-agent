- norm_id: AIA-NORM-A100-P6-FINE-FUNDS-AND-OPERATION
  source: A100-P013
  quote: Funds collected by imposition of fines in this Article shall contribute to the general budget
    of the Union
  action: contribute the funds collected by imposing Article 100 fines to the general budget of the Union
