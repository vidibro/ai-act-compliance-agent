- norm_id: AIA-NORM-A100-P5-DEFENCE-AND-FILE-ACCESS
  source: A100-P012
  quote: The rights of defence of the parties concerned shall be fully respected
  action: fully respect defence rights and provide file access subject to personal-data and business-secret interests
  subject_ref: european_data_protection_supervisor
  subject_category: union_institution_or_body
