- norm_id: AIA-NORM-A100-P4-HEARING-RIGHTS
  source: A100-P011
  quote: shall give the Union institution, body, office or agency which is the subject of the proceedings
  action: give the investigated Union body an opportunity to be heard and base decisions only on matters open to party comment while closely associating complainants
  subject_ref: european_data_protection_supervisor
