- norm_id: AIA-NORM-A100-P7-ANNUAL-FINE-NOTIFICATION
  source: A100-P014
  quote: The European Data Protection Supervisor shall, on an annual basis, notify the Commission of the
    administrative fines it has imposed pursuant to this Article and of any litigation or judicial proceedings
    it has initiated.
  action: notify the Commission annually of Article 100 fines and initiated proceedings
