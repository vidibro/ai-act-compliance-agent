- norm_id: AIA-NORM-A100-P6-FINE-FUNDS-AND-OPERATION
  source: A100-P013
  quote: Funds collected by imposition of fines in this Article shall contribute to the general budget of the Union
  action: contribute collected fines to the Union budget without affecting the fined body's effective operation
  subject_ref: union_budget_and_enforcement_framework
