- norm_id: AIA-NORM-A100-P4-ASSOCIATE-COMPLAINANTS
  source: A100-P011
  quote: Complainants, if any, shall be associated closely with the proceedings.
  action: associate any complainants closely with the proceedings
  actors:
  - actor_ref: european_data_protection_supervisor
  targets: []
  conditions:
