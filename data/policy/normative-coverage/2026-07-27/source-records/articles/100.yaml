records:
- norm_id: AIA-NORM-A100-P1-IMPOSE-UNION-BODY-FINES
  source: A100-P001
  quote: The European Data Protection Supervisor may impose administrative fines on Union institutions,
    bodies, offices and agencies falling within the scope of this Regulation. When deciding whether to
    impose an administrative fine and when deciding on the amount of the administrative fine in each individual
    case, all relevant circumstances of the specific situation shall be taken into account and due regard
    shall be given to the following
  action: impose administrative fines on in-scope Union institutions bodies offices and agencies after
    considering all relevant circumstances and specified factors
  actors:
  - actor_ref: european_data_protection_supervisor
  targets: []
  kind: power
  mandatory_content:
  - infringement nature gravity duration consequences affected persons and damage
  - responsibility and technical organisational measures
  - harm mitigation
  - cooperation and compliance with prior measures
  - similar previous infringements
  - how the infringement became known including self-notification
  - annual budget
  qualifier_spans:
  - A100-P002
  - A100-P003
  - A100-P004
  - A100-P005
  - A100-P006
  - A100-P007
  - A100-P008
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A100-P2-ARTICLE5-FINE
  source: A100-P009
  quote: Non-compliance with the prohibition of the AI practices referred to in Article 5 shall be subject
    to administrative fines of up to EUR 1500000.
  action: expose Union-body Article 5 non-compliance to a fine up to EUR 1500000
  actors:
  - actor_ref: union_institution_or_body
  targets: []
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: This enforcement consequence is outside the supported operator surface.
  implementation_mode: none_required
  implementation_reason: No product implementation is required.
  verification_mode: not_reported
  conditions:
  - an in-scope Union institution, body, office, or agency does not comply with the Article 5 prohibition
    of AI practices
- norm_id: AIA-NORM-A100-P3-OTHER-REQUIREMENT-FINE
  source: A100-P010
  quote: The non-compliance of the AI system with any requirements or obligations under this Regulation,
    other than those laid down in Article 5, shall be subject to administrative fines of up to EUR 750000.
  action: expose other Union-body AI Act non-compliance to a fine up to EUR 750000
  actors:
  - actor_ref: union_institution_or_body
  targets: []
  kind: legal_consequence
  product_scope: outside_supported_actor
  product_scope_reason: This enforcement consequence is outside the supported operator surface.
  implementation_mode: none_required
  implementation_reason: No product implementation is required.
  verification_mode: not_reported
  conditions:
  - an AI system of an in-scope Union institution, body, office, or agency does not comply with a requirement
    or obligation under this Regulation other than Article 5
- norm_id: AIA-NORM-A100-P4-HEARING-RIGHTS
  source: A100-P011
  quote: Before taking decisions pursuant to this Article, the European Data Protection Supervisor shall
    give the Union institution, body, office or agency which is the subject of the proceedings conducted
    by the European Data Protection Supervisor the opportunity of being heard on the matter regarding
    the possible infringement.
  action: give the Union institution, body, office or agency subject to the proceedings the opportunity
    of being heard on the possible infringement before taking a decision
  actors:
  - actor_ref: european_data_protection_supervisor
  targets: []
  conditions:
  - the decision is taken pursuant to Article 100
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A100-P4-DECISION-GROUNDS
  source: A100-P011
  quote: The European Data Protection Supervisor shall base his or her decisions only on elements and
    circumstances on which the parties concerned have been able to comment.
  action: base the decision only on elements and circumstances on which the parties concerned have been
    able to comment
  actors:
