- norm_id: AIA-NORM-A018-P2-MEMBER-STATE-CONDITIONS
  source: A018-P007
  quote: Each Member State shall determine conditions under which the documentation referred to in paragraph
    1 remains at the disposal of the national competent authorities for the period indicated in that paragraph
    for the cases when a provider or its authorised representative established on its territory goes bankrupt
    or ceases its activity prior to the end of that period.
  action: determine conditions preserving authority access to Article 18(1) documentation after a locally
    established provider or authorised representative becomes bankrupt or ceases activity early
  subject_ref: member_state
  subject_category: member_state
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A018-P3-FINANCIAL-DOCUMENTATION
  source: A018-P008
  quote: Providers that are financial institutions subject to requirements regarding their internal governance,
    arrangements or processes under Union financial services law shall maintain the technical documentation
    as part of the documentation kept under the relevant Union financial services law.
  action: maintain Article 11 technical documentation within the documentation kept under applicable Union
    financial-services law
  subject_ref: financial_institution_provider
  subject_category: supported_operator
  conditions:
  - the provider is a financial institution subject to internal-governance requirements under Union financial-services
    law
  implementation_refs: *id002
  verification_mode: reported_not_judged
  verified_by: vidibro
