- norm_id: AIA-NORM-A071-P5-DATABASE-DATA-MINIMISATION
  source: A071-P005
  quote: The EU database shall contain personal data only in so far as necessary for collecting and processing
    information in accordance with this Regulation. That information shall include the names and contact
    details of natural persons who are responsible for registering the system and have the legal authority
    to represent the provider or the deployer, as applicable.
  action: limit database personal data to what Regulation processing requires while including authorised
    registrant names and contacts
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A071-P006]
  targets: []
  mandatory_content:
  - necessity-limited personal data
  - names and contact details of legally authorised natural-person registrants
  temporal_regime_id: AIA-TEMP-CHAPTER-VIII
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
