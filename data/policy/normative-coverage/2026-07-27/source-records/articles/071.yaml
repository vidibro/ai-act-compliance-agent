- norm_id: AIA-NORM-A071-P4-DATABASE-ACCESS-RULES
  source: A071-P004
  quote: With the exception of the section referred to in Article 49(4) and Article 60(4), point (c),
    the information contained in the EU database registered in accordance with Article 49 shall be accessible
    and publicly available in a user-friendly manner.
  action: keep the information registered under Article 49 accessible and publicly available in a user-friendly
    manner
