- norm_id: AIA-NORM-A071-P4-RESTRICTED-ARTICLE-60-ACCESS
  source: A071-P004
  quote: The information registered in accordance with Article 60 shall be accessible only to market surveillance authorities and the Commission, unless the prospective provider or provider has given consent for also making the information accessible the public.
  action: keep the information registered under Article 60 accessible only to market surveillance
    authorities and the Commission
  subject_ref: commission
  subject_category: union_institution_or_body
  exceptions:
