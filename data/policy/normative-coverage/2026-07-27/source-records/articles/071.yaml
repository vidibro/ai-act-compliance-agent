- norm_id: AIA-NORM-A071-P1-SET-UP-AND-MAINTAIN-DATABASE
  source: A071-P001
  quote: The Commission shall, in collaboration with the Member States, set up and maintain an EU database
    containing information referred to in paragraphs 2 and 3 of this Article concerning high-risk AI systems
    referred to in Article 6(2) which are registered in accordance with Articles 49 and 60 and AI systems
    that are not considered as high-risk pursuant to Article 6(3) and which are registered in accordance
    with Article 6(4) and Article 49.
  action: set up and maintain the EU database, in collaboration with the Member States, containing the
    paragraph 2 and 3 information on the enacted registered systems
  actors:
  - actor_ref: commission
    basis_segment_ids: [AIA-TEXT-A071-P001]
  targets: []
  mandatory_content:
  - Article 6(2) high-risk AI systems registered in accordance with Articles 49 and 60
  - Article 6(3) systems not considered high-risk, registered in accordance with Article 6(4) and Article
    49
  temporal_regime_id: AIA-TEMP-CHAPTER-VIII
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
