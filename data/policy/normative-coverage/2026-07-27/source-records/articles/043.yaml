      basis_segment_ids: [AIA-TEXT-A043-P3]
    - text: provided that that manufacturer has applied harmonised standards to ensure compliance with all the relevant requirements
      basis_segment_ids: [AIA-TEXT-A043-P3]
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
  implementation_mode: report_only
