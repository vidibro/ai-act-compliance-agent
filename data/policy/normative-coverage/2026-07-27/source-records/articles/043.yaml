- norm_id: AIA-NORM-A043-P6-DELEGATED-ACT-CRITERIA
  source: A043-P6
  quote: The Commission shall adopt such delegated acts taking into account the effectiveness of the conformity
    assessment procedure based on internal control referred to in Annex VI in preventing or minimising
    the risks to health and safety and protection of fundamental rights posed by such systems, as well
    as the availability of adequate capacities and resources among notified bodies.
  action: account for internal-control effectiveness and notified-body capacity when adopting the paragraph
    6 delegated acts
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
  mandatory_content:
  - Annex VI internal-control effectiveness in preventing or minimising health, safety, and fundamental-rights
    risks
  - availability of adequate notified-body capacities and resources
