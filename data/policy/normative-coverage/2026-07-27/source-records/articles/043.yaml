- norm_id: AIA-NORM-A043-P2-INTERNAL-CONTROL
  source: A043-P2
  quote: For high-risk AI systems referred to in points 2 to 8 of Annex III, providers shall follow the
    conformity assessment procedure based on internal control as referred to in Annex VI, which does not
    provide for the involvement of a notified body.
  action: use the Annex VI internal-control procedure without notified-body involvement for Annex III
    points 2 to 8
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-PO-A43-2
  verification_mode: listed_for_confirmation
