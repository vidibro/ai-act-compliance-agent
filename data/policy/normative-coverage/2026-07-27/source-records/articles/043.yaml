records:
- norm_id: AIA-NORM-A043-P1-CHOOSE-CONFORMITY-ROUTE
  source: A043-P1
  quote: the provider shall opt for one of the following conformity assessment procedures based on
  action: choose either Annex VI internal control or Annex VII notified-body assessment when the applicable
    standards or common specifications were applied
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-PO-A43-1
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A043-P1-REQUIRED-ANNEX-VII-ROUTE
  source: A043-P1
  quote: the provider shall follow the conformity assessment procedure set out in Annex VII where
  action: use Annex VII where standards or common specifications are unavailable, unapplied, partly applied,
    or restricted
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-PO-A43-1B
  verification_mode: listed_for_confirmation
  conditions:
  - harmonised standards do not exist and common specifications are unavailable
  - or the provider did not apply, or applied only part of, the harmonised standard
  - or available common specifications were not applied
  - or a harmonised standard was published with a restriction, for the restricted part
- norm_id: AIA-NORM-A043-P1-CHOOSE-NOTIFIED-BODY
  source: A043-P1
  quote: For the purposes of the conformity assessment procedure referred to in Annex VII, the provider
    may choose any of the notified bodies.
  action: choose any notified body for the Annex VII conformity-assessment procedure
  subject_ref: provider
  subject_category: supported_operator
  kind: permission
  implementation_refs:
  - AIA-PO-A43-1B
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A043-P1-AUTHORITY-AS-NOTIFIED-BODY
  source: A043-P1
  quote: where the high-risk AI system is intended to be put into service by law enforcement, immigration
    or asylum authorities or by Union institutions, bodies, offices or agencies, the market surveillance
    authority referred to in Article 74(8) or (9), as applicable, shall act as a notified body.
  action: act as the notified body for systems intended for the specified public-authority or Union-body
    use
  subject_ref: market_surveillance_authority
  subject_category: public_authority
  product_scope: outside_supported_actor
