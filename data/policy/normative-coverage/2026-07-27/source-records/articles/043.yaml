- norm_id: AIA-NORM-A043-P3-NO-EFFECT
  source: A043-P3
  quote: The classification of a product as a high-risk AI system in accordance with Article 6(1) does
    not affect the choice of the conformity assessment procedure provided to the manufacturers of products
    covered by Union harmonisation legislation listed in Section A of Annex I, including, where applicable,
    an option to rely on harmonised standards.
  action: preserve the sectoral conformity-route choice despite AI high-risk classification
  actors:
  - actor_ref: product_manufacturer
    basis_segment_ids: [AIA-TEXT-A043-P3]
  targets: []
  kind: applicability
  qualifier_spans:
  - A043-P3
  conditions:
