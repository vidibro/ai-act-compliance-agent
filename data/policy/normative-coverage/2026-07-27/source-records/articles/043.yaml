- norm_id: AIA-NORM-A043-P3-OPTION
  source: A043-P3
  quote: Where Union harmonisation legislation listed in Section A of Annex I provides the product manufacturer
    with an option to rely on a conformity assessment that does not involve a third-party, provided that
    that manufacturer has applied harmonised standards to ensure compliance with all the relevant requirements,
    that manufacturer may use that option only if it has also applied harmonised standards or, where applicable,
    common specifications referred to in Article 41, covering all requirements set out in Section 2 of
    this Chapter.
  action: use a no-third-party sectoral route only after applying standards covering all Section 2 requirements
  actors:
  - actor_ref: product_manufacturer
    basis_segment_ids: [AIA-TEXT-A043-P3]
  targets: []
  kind: permission
  qualifier_spans:
  - A043-P3
  conditions:
