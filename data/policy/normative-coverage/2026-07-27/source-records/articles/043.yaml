- norm_id: AIA-NORM-A043-P3-BODY-POWER
  source: A043-P3
  quote: For the purposes of that conformity assessment, notified bodies which have been notified under
    the Union harmonisation legislation listed in Section A of Annex I shall have the power to assess
    the conformity of high-risk AI systems with the requirements set out in Section 2 of this Chapter,
    provided that the compliance of those notified bodies with the requirements laid down in Article 31(4),
    (5), (10) and (11) has been assessed in the context of the notification procedure in accordance with
    the relevant Union harmonisation legislation, which is evidenced through the assessment as part of
    the existing notification.
  action: assess conformity with Chapter III Section 2
  actors:
  - actor_ref: notified_body
    basis_segment_ids: [AIA-TEXT-A043-P3]
  targets: []
  kind: power
  qualifier_spans:
