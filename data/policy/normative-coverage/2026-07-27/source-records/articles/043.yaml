    risks
  - availability of adequate notified-body capacities and resources
- norm_id: AIA-NORM-A043-P3-DUAL-COVERAGE-PROCEDURE
  source: A043-P3
  quote: Where a high-risk AI system is both covered by the Union harmonisation legislation listed in
    Section A of Annex I and it falls within one of the categories listed in Annex III, the provider of
    that system shall follow the relevant conformity assessment procedure as required pursuant to the
    relevant Union harmonisation legislation listed in Section A of Annex I.
  action: follow the Section A Annex I conformity-assessment procedure where the system is both covered
    by that legislation and listed in an Annex III category
  actors:
