- norm_id: AIA-NORM-A043-P4-NEW-ASSESSMENT
  source: A043-P4
  quote: High-risk AI systems that have already been subject to a conformity assessment procedure shall
    undergo a new conformity assessment procedure in the event of a substantial modification, regardless
    of whether the modified system is intended to be further distributed or continues to be used by the
    current deployer.
  action: perform a new conformity assessment after a substantial modification regardless of subsequent
    distribution or continued use
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-PO-A43-4
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A043-P4-PREDETERMINED-CHANGE-EXCLUSION
  source: A043-P4
  quote: For high-risk AI systems that continue to learn after being placed on the market or put into
    service, changes to the high-risk AI system and its performance that have been pre-determined by the
    provider at the moment of the initial conformity assessment and are part of the information contained
    in the technical documentation referred to in point 2(f) of Annex IV, shall not constitute a substantial
    modification.
  action: exclude predetermined and initially documented learning changes from substantial modification
  subject_ref: provider
  subject_category: supported_operator
  kind: applicability
  product_scope: dependency_only
  product_scope_reason: This proposition supplies applicability to the new-assessment obligation.
  implementation_mode: none_required
  implementation_reason: Represented as a dependency rather than an independent finding.
  verification_mode: not_assessed
  conditions:
  - the continuing-learning change and performance effect was predetermined at initial conformity assessment
  - the change is included in Annex IV point 2(f) technical documentation
