- norm_id: AIA-NORM-A043-P3-NO-THIRD-PARTY
  source: A043-P3
  quote: The manufacturers of such products are not required to choose a conformity assessment procedure
    involving third-party conformity assessment only because the product includes a high-risk AI system
    as a safety component, if this is not required by the Union harmonisation legislation listed in Section
    A of Annex I.
  action: avoid a third-party procedure where sectoral law does not otherwise require it
  actors:
