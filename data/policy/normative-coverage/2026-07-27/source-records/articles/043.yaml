      basis_segment_ids: [AIA-TEXT-A043-P3]
    - text: The classification of a product as a high-risk AI system in accordance with Article 6(1)
      basis_segment_ids: [AIA-TEXT-A043-P3]
  temporal_regime_id: AIA-TEMP-CHAPTER-III-SECTION-5
