records:
- norm_id: AIA-NORM-A015-P1-PERFORMANCE-AND-LIFECYCLE-CONSISTENCY
  source: A015-P001
  quote: High-risk AI systems shall be designed and developed in such a way that they achieve an appropriate
    level of accuracy, robustness, and cybersecurity, and that they perform consistently in those respects
    throughout their lifecycle.
  action: design and develop the high-risk AI system to achieve appropriate accuracy, robustness, and
    cybersecurity and perform consistently in those respects throughout its lifecycle
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  mandatory_content:
  - appropriate accuracy
  - appropriate robustness
  - appropriate cybersecurity
  - consistent performance in those respects throughout the lifecycle
  implementation_refs: &id001
  - AIA-HR-A15
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P2-ENCOURAGE-MEASUREMENT
  source: A015-P002
  quote: the Commission shall, in cooperation with relevant stakeholders and organisations such as metrology
    and benchmarking authorities, encourage, as appropriate, the development of benchmarks and measurement
    methodologies.
  action: encourage appropriate accuracy, robustness, and performance benchmarks and measurement methodologies
    in cooperation with relevant stakeholders and organisations
  actors:
  - actor_ref: commission
    category: union_institution_or_body
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A015-P3-DECLARE-ACCURACY-AND-METRICS
  source: A015-P003
  quote: The levels of accuracy and the relevant accuracy metrics of high-risk AI systems shall be declared
    in the accompanying instructions of use.
  action: declare the high-risk AI system's accuracy levels and relevant accuracy metrics in the accompanying
    instructions for use
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P4-RESILIENCE
  source: A015-P004
  quote: High-risk AI systems shall be as resilient as possible regarding errors, faults or inconsistencies
    that may occur within the system or the environment in which the system operates, in particular due
    to their interaction with natural persons or other systems.
  action: make the high-risk AI system as resilient as possible to errors, faults, and inconsistencies
    within the system or its operating environment
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P4-TECHNICAL-AND-ORGANISATIONAL-MEASURES
  source: A015-P004
  quote: Technical and organisational measures shall be taken in this regard.
  action: apply technical and organisational measures supporting resilience to errors, faults, and inconsistencies
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P4-REDUNDANCY
  source: A015-P005
  quote: The robustness of high-risk AI systems may be achieved through technical redundancy solutions,
    which may include backup or fail-safe plans.
  action: use technical redundancy solutions, including backup or fail-safe plans, to achieve system robustness
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  kind: permission
  implementation_mode: report_only
  implementation_refs:
  - AIA-HR-A15
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P4-FEEDBACK-LOOP-RISK-AND-MITIGATION
  source: A015-P006
  quote: High-risk AI systems that continue to learn after being placed on the market or put into service
    shall be developed in such a way as to eliminate or reduce as far as possible the risk of possibly
    biased outputs influencing input for future operations (feedback loops), and as to ensure that any
    such feedback loops are duly addressed with appropriate mitigation measures.
  action: eliminate or minimise the risk of biased-output feedback loops and address any such loops with
    appropriate mitigation measures
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  conditions:
  - the high-risk AI system continues to learn after market placement or being put into service
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P5-UNAUTHORISED-ALTERATION
  source: A015-P007
  quote: High-risk AI systems shall be resilient against attempts by unauthorised third parties to alter
    their use, outputs or performance by exploiting system vulnerabilities.
  action: make the system resilient against unauthorised attempts to alter its use, outputs, or performance
    through vulnerabilities
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P5-APPROPRIATE-SOLUTIONS
  source: A015-P008
  quote: The technical solutions aiming to ensure the cybersecurity of high-risk AI systems shall be appropriate
    to the relevant circumstances and the risks.
  action: make cybersecurity technical solutions appropriate to the relevant circumstances and risks
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P5-DATA-POISONING
  source: A015-P009
  quote: attacks trying to manipulate the training data set (data poisoning)
  action: implement measures to prevent, detect, respond to, resolve, and control training-data-poisoning
    attacks
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  conditions: &id003
  - measures addressing the AI-specific vulnerability are appropriate
  implementation_refs: *id001
  verification_mode: judged_by_gap_analysis
  verified_by: vidibro
- norm_id: AIA-NORM-A015-P5-MODEL-POISONING
