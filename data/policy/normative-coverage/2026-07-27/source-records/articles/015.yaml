records:
- norm_id: AIA-NORM-A015-P1-ACCURACY
  source: A015-P001
  quote: High-risk AI systems shall be designed and developed in such a way that they achieve an appropriate
    level of accuracy, robustness, and cybersecurity, and that they perform consistently in those respects
    throughout their lifecycle.
  action: design and develop the high-risk AI system to achieve an appropriate level of accuracy
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: &id001
  - AIA-HR-A15
  verification_mode: judged_from_document
