- norm_id: AIA-NORM-A069-P2-MEMBER-STATE-EXPERT-FEES
  source: A069-P002
  quote: The Member States may be required to pay fees for the advice and support provided by the experts
    at a rate equivalent to the remuneration fees applicable to the Commission pursuant to the implementing
    act referred to in Article 68(1).
  action: pay required expert advice and support fees at the Commission-equivalent remuneration rate
