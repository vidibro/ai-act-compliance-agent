- norm_id: AIA-NORM-A069-P3-FACILITATE-AND-COORDINATE-ACCESS
  source: A069-P003
  quote: The Commission shall facilitate timely access to the experts by the Member States, as needed,
    and ensure that the combination of support activities carried out by Union AI testing support pursuant
    to Article 84 and experts pursuant to this Article is efficiently organised and provides the best
    possible added value.
  action: facilitate timely Member State expert access and efficiently coordinate expert and Union AI
    testing support for maximum added value
