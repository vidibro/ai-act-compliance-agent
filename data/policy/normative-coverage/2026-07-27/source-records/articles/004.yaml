records:
- norm_id: AIA-NORM-A004-P1-AI-LITERACY-MEASURES
  source: A004-P001
  quote: Providers and deployers of AI systems shall take measures to support the development of AI literacy
    of their staff and other persons dealing with the operation and use of AI systems on their behalf,
    taking into account their technical knowledge, experience, education and training and the context
    the AI systems are to be used in, and considering the persons or groups of persons on whom the AI
    systems are to be used. This obligation does not require providers or deployers to guarantee any specific
    level of AI literacy of any individual.
  action: take context-sensitive measures supporting AI literacy among staff and other persons operating
    or using AI systems on the provider's or deployer's behalf
  actors:
  - actor_ref: provider
  - actor_ref: deployer
  targets: []
  kind: obligation
  conditions:
  - account for the covered persons' technical knowledge, experience, education, and training
  - account for the context in which the AI systems are to be used
  - consider the persons or groups on whom the AI systems are to be used
  exceptions:
  - the obligation does not require a guaranteed specific AI-literacy level for any particular individual
    among the covered staff or other persons
  verification_mode: reported_not_judged
  implementation_refs:
  - AIA-RULE-ALL-A04
  verified_by: vidibro
- norm_id: AIA-NORM-A004-P2-SUPPORT-PROVIDERS-DEPLOYERS
  source: A004-P002
  quote: The Commission and the Member States shall support and facilitate the efforts of providers and
    deployers of AI systems, in particular SMEs, in fulfilling their obligation under paragraph 1 of this
    Article.
  action: support and facilitate provider and deployer efforts, particularly those of SMEs, to fulfil
    the Article 4(1) AI-literacy obligation
  actors:
  - actor_ref: commission
  - actor_ref: member_state
  targets: []
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission or Member States.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A004-P2-PUBLISH-PRACTICAL-EXAMPLES
  source: A004-P002
  quote: the Commission shall publish practical examples of how to comply with that obligation on the
    single information platform referred to in Article 62(3), point (b)
  action: publish practical examples of compliance with the Article 4(1) obligation on the single information
    platform
  actors:
  - actor_ref: commission
  targets: []
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A004-P3-BOARD-RECOMMENDATIONS
  source: A004-P003
  quote: The Board shall adopt recommendations, taking into account European competence frameworks, to
    support the Commission and Member States in the promotion of AI literacy required under paragraph
    1, including by setting out common objectives.
  action: adopt recommendations supporting the Commission and Member States in promoting the AI literacy
    required by Article 4(1), including through common objectives
  actors:
  - actor_ref: board
  targets: []
  kind: obligation
  conditions:
  - take European competence frameworks into account
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Board.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
