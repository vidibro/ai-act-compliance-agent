- norm_id: AIA-NORM-A062-P2-PROPORTIONATE-SME-FEES
  source: A062-P006
  quote: The specific interests and needs of the SME providers, including start-ups, shall be taken into
    account when setting the fees for conformity assessment under Article 43, reducing those fees proportionately
    to their size, market size and other relevant indicators.
  action: account for SME provider interests and needs and proportionately reduce Article 43 conformity-assessment
    fees
  actors:
  - actor_ref: conformity_assessment_body
    basis_segment_ids: [AIA-TEXT-A062-P006]
  targets: []
