- norm_id: AIA-NORM-A062-P1-A-PRESERVE-OTHER-SME-ACCESS
  source: A062-P002
  quote: the priority access shall not preclude other SMEs, including start-ups, other than those referred
    to in this paragraph from access to the AI regulatory sandbox, provided that they also fulfil the
    eligibility conditions and selection criteria;
  action: keep the priority access from precluding other SMEs and start-ups from sandbox access
