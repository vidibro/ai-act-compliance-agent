- norm_id: AIA-NORM-A062-P1-A-PRIORITY-SANDBOX-ACCESS
  source: A062-P002
  quote: provide SMEs, including start-ups, having a registered office or a branch in the Union, with
    priority access to the AI regulatory sandboxes, to the extent that they fulfil the eligibility conditions
    and selection criteria;
  action: provide priority AI regulatory sandbox access to SMEs and start-ups with a registered office
    or branch in the Union
