- norm_id: AIA-NORM-A049-P2-PROVIDER-REGISTER-NON-HIGH-RISK
  source: A049-P002
  quote: Before placing on the market or putting into service an AI system for which the provider has
    concluded that it is not high-risk according to Article 6(3), that provider or, where applicable,
    the authorised representative shall register themselves and that system in the EU database referred
    to in Article 71.
  action: register itself and the system concluded not high-risk under Article 6(3) in the Article 71
    EU database
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A049-P002]
  targets: []
  conditions:
    operator: all_of
    operands:
