      basis_segment_ids: [AIA-TEXT-A050-P2]
    - text: do not substantially alter the input data provided by the deployer or the semantics thereof
      basis_segment_ids: [AIA-TEXT-A050-P2]
    - text: where authorised by law to detect, prevent, investigate or prosecute criminal offences
      basis_segment_ids: [AIA-TEXT-A050-P2]
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P3-INFORM
  source: A050-P3
  quote: Deployers of an emotion recognition system or a biometric categorisation system shall inform
    the natural persons exposed thereto of the operation of the system
  action: inform people exposed to emotion recognition or biometric categorisation
  actors:
  - actor_ref: deployer
    basis_segment_ids: [AIA-TEXT-A050-P3]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IV
  conditions:
    operator: all_of
    operands:
    - text: an emotion recognition system or a biometric categorisation system
      basis_segment_ids: [AIA-TEXT-A050-P3]
  implementation_refs:
  - AIA-RULE-TR-A50-3
  verification_mode: reported_not_judged
  exceptions:
    operator: any_of
    operands:
    - text: This obligation shall not apply to AI systems used for biometric categorisation and emotion recognition, which are permitted by law to detect, prevent or investigate criminal offences, subject to appropriate safeguards for the rights and freedoms of third parties, and in accordance with Union law
      basis_segment_ids: [AIA-TEXT-A050-P3]
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P3-DATA
  source: A050-P3
  quote: Deployers of an emotion recognition system or a biometric categorisation system shall inform
    the natural persons exposed thereto of the operation of the system, and shall process the personal
    data in accordance with Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680,
    as applicable. This obligation shall not apply to AI systems used for biometric categorisation and
    emotion recognition, which are permitted by law to detect, prevent or investigate criminal offences,
    subject to appropriate safeguards for the rights and freedoms of third parties, and in accordance
    with Union law.
  action: process personal data under the referenced data-protection instruments
  actors:
  - actor_ref: deployer
    basis_segment_ids: [AIA-TEXT-A050-P3]
  targets: []
  exceptions:
    operator: any_of
    operands:
    - text: This obligation shall not apply to AI systems used for biometric categorisation and emotion recognition, which are permitted by law to detect, prevent or investigate criminal offences, subject to appropriate safeguards for the rights and freedoms of third parties, and in accordance with Union law
      basis_segment_ids: [AIA-TEXT-A050-P3]
  temporal_regime_id: AIA-TEMP-CHAPTER-IV
  conditions:
    operator: all_of
    operands:
    - text: an emotion recognition system or a biometric categorisation system
      basis_segment_ids: [AIA-TEXT-A050-P3]
  implementation_mode: report_only
  implementation_refs:
  - AIA-RULE-TR-A50-3
  implementation_reason: What the processing requires is settled by the Regulations and the Directive
    the paragraph names, so this duty is reported alongside the Article 50(3) information rule rather
    than judged.
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P4-DEEPFAKE
  source: A050-P4
  quote: Deployers of an AI system that generates or manipulates image, audio or video content constituting
    a deep fake, shall disclose that the content has been artificially generated or manipulated. This
    obligation shall not apply where the use is authorised by law to detect, prevent, investigate or prosecute
    criminal offence.
  action: disclose artificial generation or manipulation of deep-fake image, audio, or video
  actors:
  - actor_ref: deployer
    basis_segment_ids: [AIA-TEXT-A050-P4]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IV
  implementation_refs:
  - AIA-RULE-TR-A50-4
  verification_mode: reported_not_judged
  conditions:
    operator: all_of
    operands:
