records:
- norm_id: AIA-NORM-A050-P1-DISCLOSE
  source: A050-P1
  quote: Providers shall ensure that AI systems intended to interact directly with natural persons are
    designed and developed in such a way that the natural persons concerned are informed that they are
    interacting with an AI system
  action: design direct-interaction systems to inform natural persons they are interacting with AI
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-1
  verification_mode: judged_by_gap_analysis
  exceptions:
  - interaction with an AI system is obvious from the point of view of a natural person who is reasonably
    well-informed, observant and circumspect, taking into account the circumstances and the context of use
  - AI system authorised by law to detect, prevent, investigate, or prosecute criminal offences,
    subject to safeguards for third-party rights and freedoms, unless the system is publicly
    available for reporting a criminal offence
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P2-MARK-DETECT
  source: A050-P2
  quote: Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image,
    video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable
    format and detectable as artificially generated or manipulated.
  action: make synthetic outputs both machine-readably marked and detectable
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-2
  verification_mode: judged_by_gap_analysis
  mandatory_content:
  - machine-readable marking
  - detectability as artificial or manipulated
  - effective, interoperable, robust and reliable solution as technically feasible
  - in ensuring those technical-solution qualities, take into account the specificities and limitations
    of various types of content
  - in ensuring those technical-solution qualities, take into account the costs of implementation
  - in ensuring those technical-solution qualities, take into account the generally acknowledged state
    of the art, as may be reflected in relevant technical standards
  exceptions:
  - assistive standard editing, or no substantial alteration of deployer input data or its semantics
  - use authorised by law to detect, prevent, investigate, or prosecute criminal offences
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P3-INFORM
  source: A050-P3
  quote: shall inform the natural persons exposed thereto of the operation of the system
  action: inform people exposed to emotion recognition or biometric categorisation
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-3
  verification_mode: reported_not_judged
  exceptions:
  - biometric categorisation or emotion recognition permitted by law to detect, prevent, or
    investigate criminal offences, subject to safeguards for third-party rights and freedoms and
    in accordance with Union law
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P3-DATA
  source: A050-P3
  quote: shall process the personal data in accordance with Regulations (EU) 2016/679 and (EU) 2018/1725
    and Directive (EU) 2016/680
  action: process personal data under the referenced data-protection instruments
  subject_ref: deployer
  subject_category: supported_operator
  dependencies:
  - dependency_ref: Regulation (EU) 2016/679; Regulation (EU) 2018/1725; Directive (EU) 2016/680
    resolution: external_recorded
    detail: Referenced instruments are outside the enacted corpus.
  exceptions:
  - biometric categorisation or emotion recognition permitted by law to detect, prevent, or
    investigate criminal offences, subject to safeguards for third-party rights and freedoms and
    in accordance with Union law
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P4-DEEPFAKE
  source: A050-P4
  quote: shall disclose that the content has been artificially generated or manipulated
  action: disclose artificial generation or manipulation of deep-fake image, audio, or video
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-4
  verification_mode: reported_not_judged
  conditions:
  - for evidently artistic, creative, satirical, fictional, or analogous works or programmes,
    disclosure is limited to an appropriate indication that does not hamper display or enjoyment
  exceptions:
  - use authorised by law to detect, prevent, investigate, or prosecute criminal offences
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P4-TEXT
  source: A050-P4
  quote: shall disclose that the text has been artificially generated or manipulated
  action: disclose artificial generation or manipulation of public-interest text
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-4
  verification_mode: reported_not_judged
  exceptions:
  - use authorised by law to detect, prevent, investigate, or prosecute criminal offences
  - AI-generated content underwent human review or editorial control and a natural or legal person
    holds editorial responsibility for publication
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P5-MANNER
  source: A050-P5
  quote: shall be provided to the natural persons concerned in a clear and distinguishable manner
  action: provide paragraphs 1 to 4 information clearly, distinguishably, on time, and accessibly
  subject_ref: provider_or_deployer
  subject_category: supported_operator
  implementation_mode: carried_by_other_norm
  implementation_reason: The four existing transparency rules carry this shared qualifier.
  verification_mode: reported_conditionally
  mandatory_content:
  - clear and distinguishable
  - no later than first interaction or exposure
  - applicable accessibility requirements
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P6-CUMULATIVE
  source: A050-P6
  quote: Paragraphs 1 to 4 shall not affect the requirements and obligations set out in Chapter III
  action: preserve Chapter III and other transparency duties alongside Article 50
  subject_ref: provider_or_deployer
  subject_category: supported_operator
  kind: applicability
  product_scope: dependency_only
  product_scope_reason: This proposition supplies applicability or content to operator norms.
  implementation_mode: none_required
  implementation_reason: Represented as a dependency rather than an independent finding.
  verification_mode: not_reported
- norm_id: AIA-NORM-A050-P7-CODES
  source: A050-P7
  quote: The Commission shall encourage and facilitate the drawing up of codes of practice
  action: encourage and facilitate Union-level codes of practice
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A050-P7-ASSESS
  source: A050-P7
  quote: The Commission, taking utmost account of the opinion of the Board, shall assess
  action: assess whether code adherence adequately ensures compliance
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A050-P7-ACT
  source: A050-P7
  quote: the Commission may adopt an implementing act
  action: adopt common implementation rules if a code is inadequate
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
