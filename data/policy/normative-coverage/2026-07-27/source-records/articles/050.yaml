      basis_segment_ids: [AIA-TEXT-A050-P4]
  exceptions:
    operator: any_of
    operands:
    - text: This obligation shall not apply where the use is authorised by law to detect, prevent, investigate or prosecute criminal offence
      basis_segment_ids: [AIA-TEXT-A050-P4]
    - text: Where the content forms part of an evidently artistic, creative, satirical, fictional or analogous work or programme
      basis_segment_ids: [AIA-TEXT-A050-P4]
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P4-ARTISTIC-DISCLOSURE
  source: A050-P4
  quote: Where the content forms part of an evidently artistic, creative, satirical, fictional or analogous
    work or programme, the transparency obligations set out in this paragraph are limited to disclosure
    of the existence of such generated or manipulated content in an appropriate manner that does not hamper
    the display or enjoyment of the work.
  action: disclose the existence of deep-fake content in an evidently artistic, creative, satirical, fictional
    or analogous work or programme in an appropriate manner that does not hamper its display or enjoyment
  actors:
  - actor_ref: deployer
    basis_segment_ids: [AIA-TEXT-A050-P4]
