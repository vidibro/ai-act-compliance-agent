- norm_id: AIA-NORM-A050-P1-DISCLOSE
  source: A050-P1
  quote: Providers shall ensure that AI systems intended to interact directly with natural persons are
    designed and developed in such a way that the natural persons concerned are informed that they are
    interacting with an AI system, unless this is obvious from the point of view of a natural person who
    is reasonably well-informed, observant and circumspect, taking into account the circumstances and
    the context of use. This obligation shall not apply to AI systems authorised by law to detect, prevent,
    investigate or prosecute criminal offences, subject to appropriate safeguards for the rights and freedoms
    of third parties, unless those systems are available for the public to report a criminal offence.
  action: design direct-interaction systems to inform natural persons they are interacting with AI
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A050-P1]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IV
  conditions:
    operator: all_of
