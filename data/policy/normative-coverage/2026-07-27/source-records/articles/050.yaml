records:
- norm_id: AIA-NORM-A050-P1-DISCLOSE
  source: A050-P1
  quote: Providers shall ensure that AI systems intended to interact directly with natural persons are
    designed and developed in such a way that the natural persons concerned are informed that they are
    interacting with an AI system, unless this is obvious from the point of view of a natural person who
    is reasonably well-informed, observant and circumspect, taking into account the circumstances and
    the context of use. This obligation shall not apply to AI systems authorised by law to detect, prevent,
    investigate or prosecute criminal offences, subject to appropriate safeguards for the rights and freedoms
    of third parties, unless those systems are available for the public to report a criminal offence.
  action: design direct-interaction systems to inform natural persons they are interacting with AI
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-TR-A50-1
  verification_mode: judged_by_gap_analysis
  exceptions:
  - interaction with an AI system is obvious from the point of view of a natural person who is reasonably
    well-informed, observant and circumspect, taking into account the circumstances and the context of
    use
  - AI system authorised by law to detect, prevent, investigate, or prosecute criminal offences, subject
    to safeguards for third-party rights and freedoms, unless the system is publicly available for reporting
    a criminal offence
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P2-MARK-DETECT
  source: A050-P2
  quote: Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image,
    video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable
    format and detectable as artificially generated or manipulated. Providers shall ensure their technical
    solutions are effective, interoperable, robust and reliable as far as this is technically feasible,
    taking into account the specificities and limitations of various types of content, the costs of implementation
    and the generally acknowledged state of the art, as may be reflected in relevant technical standards.
    This obligation shall not apply to the extent the AI systems perform an assistive function for standard
    editing or do not substantially alter the input data provided by the deployer or the semantics thereof,
    or where authorised by law to detect, prevent, investigate or prosecute criminal offences.
  action: make synthetic outputs both machine-readably marked and detectable
  actors:
  - actor_ref: provider
  targets: []
  implementation_refs:
  - AIA-TR-A50-2
  verification_mode: judged_by_gap_analysis
  mandatory_content:
  - machine-readable marking
  - detectability as artificial or manipulated
  - effective, interoperable, robust and reliable solution as technically feasible
  - in ensuring those technical-solution qualities, take into account the specificities and limitations
    of various types of content
  - in ensuring those technical-solution qualities, take into account the costs of implementation
  - in ensuring those technical-solution qualities, take into account the generally acknowledged state
    of the art, as may be reflected in relevant technical standards
  exceptions:
  - assistive standard editing, or no substantial alteration of deployer input data or its semantics
  - use authorised by law to detect, prevent, investigate, or prosecute criminal offences
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P3-INFORM
  source: A050-P3
  quote: shall inform the natural persons exposed thereto of the operation of the system
  action: inform people exposed to emotion recognition or biometric categorisation
  actors:
  - actor_ref: deployer
  targets: []
  implementation_refs:
  - AIA-TR-A50-3
  verification_mode: reported_not_judged
  exceptions:
  - biometric categorisation or emotion recognition permitted by law to detect, prevent, or investigate
    criminal offences, subject to safeguards for third-party rights and freedoms and in accordance with
    Union law
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P3-DATA
  source: A050-P3
  quote: shall process the personal data in accordance with Regulations (EU) 2016/679 and (EU) 2018/1725
    and Directive (EU) 2016/680
  action: process personal data under the referenced data-protection instruments
  actors:
  - actor_ref: deployer
  targets: []
  exceptions:
  - biometric categorisation or emotion recognition permitted by law to detect, prevent, or investigate
    criminal offences, subject to safeguards for third-party rights and freedoms and in accordance with
    Union law
  verification_mode: reported_conditionally
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P4-DEEPFAKE
  source: A050-P4
  quote: Deployers of an AI system that generates or manipulates image, audio or video content constituting
    a deep fake, shall disclose that the content has been artificially generated or manipulated. This
    obligation shall not apply where the use is authorised by law to detect, prevent, investigate or prosecute
    criminal offence. Where the content forms part of an evidently artistic, creative, satirical, fictional
    or analogous work or programme, the transparency obligations set out in this paragraph are limited
    to disclosure of the existence of such generated or manipulated content in an appropriate manner that
    does not hamper the display or enjoyment of the work.
  action: disclose artificial generation or manipulation of deep-fake image, audio, or video
  actors:
  - actor_ref: deployer
  targets: []
  implementation_refs:
  - AIA-TR-A50-4
  verification_mode: reported_not_judged
  conditions:
  - for evidently artistic, creative, satirical, fictional, or analogous works or programmes, disclosure
    is limited to an appropriate indication that does not hamper display or enjoyment
  exceptions:
  - use authorised by law to detect, prevent, investigate, or prosecute criminal offences
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P4-TEXT
  source: A050-P4
  quote: Deployers of an AI system that generates or manipulates text which is published with the purpose
    of informing the public on matters of public interest shall disclose that the text has been artificially
    generated or manipulated. This obligation shall not apply where the use is authorised by law to detect,
    prevent, investigate or prosecute criminal offences or where the AI-generated content has undergone
    a process of human review or editorial control and where a natural or legal person holds editorial
    responsibility for the publication of the content.
  action: disclose artificial generation or manipulation of public-interest text
  actors:
  - actor_ref: deployer
  targets: []
  implementation_refs:
  - AIA-TR-A50-4
  verification_mode: reported_not_judged
  exceptions:
  - use authorised by law to detect, prevent, investigate, or prosecute criminal offences
  - AI-generated content underwent human review or editorial control and a natural or legal person holds
    editorial responsibility for publication
  qualifier_spans:
  - A050-P5
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P5-MANNER
  source: A050-P5
  quote: The information referred to in paragraphs 1 to 4 shall be provided to the natural persons concerned
    in a clear and distinguishable manner at the latest at the time of the first interaction or exposure.
    The information shall conform to the applicable accessibility requirements.
  action: provide paragraphs 1 to 4 information clearly, distinguishably, on time, and accessibly
  actors:
  - actor_ref: provider
  - actor_ref: deployer
  targets: []
  implementation_mode: carried_by_other_norm
  implementation_reason: The four existing transparency rules carry this shared qualifier.
  verification_mode: reported_conditionally
  mandatory_content:
  - clear and distinguishable
  - no later than first interaction or exposure
  - applicable accessibility requirements
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P6-CUMULATIVE
  source: A050-P6
  quote: Paragraphs 1 to 4 shall not affect the requirements and obligations set out in Chapter III, and
    shall be without prejudice to other transparency obligations laid down in Union or national law for
    deployers of AI systems.
  action: preserve Chapter III and other transparency duties alongside Article 50
  actors:
  - actor_ref: provider
  - actor_ref: deployer
  targets: []
  kind: applicability
  product_scope: dependency_only
  product_scope_reason: This proposition supplies applicability or content to operator norms.
  implementation_mode: none_required
  implementation_reason: Represented as a dependency rather than an independent finding.
  verification_mode: not_reported
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P7-CODES
  source: A050-P7
  quote: The Commission shall encourage and facilitate the drawing up of codes of practice at Union level
    to facilitate the effective implementation of the obligations regarding the detection, marking and
    labelling of artificially generated or manipulated content.
  action: encourage and facilitate Union-level codes of practice
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P7-ASSESS
  source: A050-P7
  quote: The Commission, taking utmost account of the opinion of the Board, shall assess whether adherence
    to those codes of practice is adequate to ensure compliance with the obligations laid down in paragraphs
    2 and 4 of this Article, in accordance with the procedure laid down in Article 56(6).
  action: assess whether code adherence adequately ensures compliance
  actors:
  - actor_ref: commission
  targets: []
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  verified_by: vidibro
- norm_id: AIA-NORM-A050-P7-ACT
  source: A050-P7
  quote: If it deems the code of practice to be inadequate, the Commission may adopt an implementing act
    specifying common rules for the implementation of those obligations in accordance with the examination
    procedure laid down in Article 98(2).
  action: adopt common implementation rules if a code is inadequate
  actors:
  - actor_ref: commission
  targets: []
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
  conditions:
  - the Commission deems the code of practice inadequate
  verified_by: vidibro