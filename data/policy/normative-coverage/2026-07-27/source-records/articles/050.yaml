      basis_segment_ids: [AIA-TEXT-A050-P1]
    - text: This obligation shall not apply to AI systems authorised by law to detect, prevent, investigate or prosecute criminal offences, subject to appropriate safeguards for the rights and freedoms of third parties, unless those systems are available for the public to report a criminal offence
      basis_segment_ids: [AIA-TEXT-A050-P1]
