      basis_segment_ids: [AIA-TEXT-A050-P4]
  temporal_regime_id: AIA-TEMP-CHAPTER-IV
  implementation_refs:
  - AIA-RULE-TR-A50-4
  verification_mode: reported_not_judged
  mandatory_content:
  - disclosure of the existence of such generated or manipulated content
  - in an appropriate manner that does not hamper the display or enjoyment of the work
