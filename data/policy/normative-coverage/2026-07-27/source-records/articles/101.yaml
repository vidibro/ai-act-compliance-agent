records:
- norm_id: AIA-NORM-A101-P1-IMPOSE-GPAI-FINES
  source: A101-P001
  quote: The Commission may impose on providers of general-purpose AI models fines not exceeding 3 %
  action: fine a GPAI provider up to the specified ceiling for intentional or negligent listed conduct
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  mandatory_content: [infringing relevant AI Act provisions, failing an Article 91 request or supplying incorrect incomplete or misleading information, failing an Article 93 measure, failing to provide Article 92 evaluation access]
  qualifier_spans: [A101-P002, A101-P003, A101-P004, A101-P005]
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A101-P1-FIX-FINE-AMOUNT
  source: A101-P006
  quote: In fixing the amount of the fine or periodic penalty payment, regard shall be had to the nature, gravity and duration of the infringement, taking due account of the principles of proportionality and appropriateness. The Commission shall also into account commitments made in accordance with Article 93(3) or made in relevant codes of practice in accordance with Article 56.
  action: fix the amount of the fine or periodic penalty payment having regard to every enacted
    factor
  subject_ref: commission
  subject_category: union_institution_or_body
  mandatory_content:
  - the nature, gravity and duration of the infringement
  - due account of the principles of proportionality and appropriateness
  - commitments made in accordance with Article 93(3) or made in relevant codes of practice in
    accordance with Article 56
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A101-P2-PRELIMINARY-FINDINGS-AND-HEARING
  source: A101-P007
