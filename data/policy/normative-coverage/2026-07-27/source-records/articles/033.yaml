  verification_mode: not_assessed
- norm_id: AIA-NORM-A033-P4-RETAIN-SUBCONTRACTING-DOCUMENTS
  source: A033-P004
  quote: The relevant documents concerning the assessment of the qualifications of the subcontractor or
    the subsidiary and the work carried out by them under this Regulation shall be kept at the disposal
    of the notifying authority for a period of five years from the termination date of the subcontracting.
  action: keep subcontractor or subsidiary qualification and work documents available to the notifying
    authority for five years after subcontracting ends
  subject_ref: notified_body
  subject_category: notified_or_conformity_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
  mandatory_content:
  - documents assessing the qualifications of the subcontractor or subsidiary
  - documents concerning work performed by the subcontractor or subsidiary under the Regulation
  conditions:
  - retain the documents for five years from termination of the subcontracting
