  verification_mode: not_reported
- norm_id: AIA-NORM-A095-P2-FACILITATE-SPECIFIC-REQUIREMENT-CODES
  source: A095-P002
  quote: 'The AI Office and the Member States shall facilitate the drawing up of codes of conduct concerning
    the voluntary application, including by deployers, of specific requirements to all AI systems, on
    the basis of clear objectives and key performance indicators to measure the achievement of those objectives,
    including elements such as, but not limited to:'
  action: facilitate the drawing up of codes of conduct for the voluntary application of specific requirements
    to all AI systems, on the basis of clear objectives and key performance indicators; the elements listed
    are examples and are not exhaustive, and applying the requirements stays voluntary
