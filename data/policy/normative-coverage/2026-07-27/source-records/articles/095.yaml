- norm_id: AIA-NORM-A095-P4-ACCOUNT-FOR-SMALL-BUSINESS-NEEDS
  source: A095-P009
  quote: The AI Office and the Member States shall take into account the specific interests and needs
    of SMEs, including start-ups, and SMCs, when encouraging and facilitating the drawing up of codes
    of conduct.
  action: account for SME start-up and SMC interests and needs when encouraging and facilitating codes
