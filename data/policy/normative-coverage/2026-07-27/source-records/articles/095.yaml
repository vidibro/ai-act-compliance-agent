- norm_id: AIA-NORM-A095-P3-DRAW-UP-VOLUNTARY-CODES
  source: A095-P008
  quote: Codes of conduct may be drawn up by individual providers or deployers of AI systems or by organisations
    representing them or by both, including with the involvement of any interested stakeholders and their
    representative organisations, including civil society organisations and academia. Codes of conduct
    may cover one or more AI systems taking into account the similarity of the intended purpose of the
    relevant systems.
  action: draw up a voluntary code individually jointly or through representative organisations and cover
    one or more similarly purposed systems
  actors:
  - actor_ref: provider
    basis_segment_ids: [AIA-TEXT-A095-P008]
  - actor_ref: deployer
    basis_segment_ids: [AIA-TEXT-A095-P008]
  targets: []
  kind: permission
  temporal_regime_id: AIA-TEMP-CHAPTER-X
  implementation_mode: report_only
