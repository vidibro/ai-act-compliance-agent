- norm_id: AIA-NORM-A095-P1-ENCOURAGE-NON-HIGH-RISK-CODES
  source: A095-P001
  quote: The AI Office and the Member States shall encourage and facilitate the drawing up of codes of
    conduct, including related governance mechanisms, intended to foster the voluntary application to
    AI systems, other than high-risk AI systems, of some or all of the requirements set out in Chapter
    III, Section 2 taking into account the available technical solutions and industry best practices allowing
    for the application of such requirements.
  action: encourage and facilitate codes and governance mechanisms for voluntary Chapter III Section 2
    application to non-high-risk systems
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A095-P001]
  - actor_ref: member_state
    basis_segment_ids: [AIA-TEXT-A095-P001]
