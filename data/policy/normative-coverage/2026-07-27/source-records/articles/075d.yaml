records:
- norm_id: AIA-NORM-A075D-P1-APPLY-PROCEDURAL-RIGHTS
  source: A075D-P001
  quote: Article 18 of Regulation (EU) 2019/1020 shall apply mutatis mutandis to operators subject to
    the AI Office’s competence pursuant to Article 75(1) of this Regulation, without prejudice to more
    specific procedural rights provided for in this Regulation.
  action: apply Regulation 2019/1020 Article 18 procedural rights with necessary adaptations while preserving
    more specific rights
  actors:
  - actor_ref: operator
    basis_segment_ids: [AIA-TEXT-A075D-P001]
  targets: []
  kind: applicability
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: no_product_action
  product_scope_reason: This grants procedural protection rather than imposing a product action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075D-P2-RESPECT-DEFENCE-AND-FILE-RIGHTS
  source: A075D-P002
  quote: The rights of defence and of access to the file of operators falling within the scope of Article
    75(1) shall be fully respected in proceedings.
  action: fully respect Article 75(1) operators' defence and file-access rights in proceedings
  actors:
  - actor_ref: ai_office
    basis_segment_ids: [AIA-TEXT-A075D-P002]
  targets: []
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075D-P2-NEGOTIATED-FILE-ACCESS
  source: A075D-P002
  quote: In view of the possible adoption of decisions on the basis of Article 75c(1), those operators
    shall be entitled to have access to the AI Office file under the terms of a negotiated disclosure,
    subject to the legitimate interest of the operator or other person concerned in the protection of
    their business secrets.
  action: access the AI Office file through negotiated disclosure subject to legitimate business-secret
    interests and stated confidentiality exclusions
  actors:
  - actor_ref: operator
    basis_segment_ids: [AIA-TEXT-A075D-P002]
  targets: []
  kind: entitlement
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  implementation_mode: report_only
  implementation_refs: [AIA-RULE-ALL-A75c-3]
  verification_mode: reported_conditionally
  conditions:
    operator: all_of
    operands:
    - text: In view of the possible adoption of decisions on the basis of Article 75c(1)
      basis_segment_ids: [AIA-TEXT-A075D-P002]
    - text: subject to the legitimate interest of the operator or other person concerned in the protection of their business secrets
      basis_segment_ids: [AIA-TEXT-A075D-P002]
  exceptions:
    operator: any_of
    operands:
    - text: confidential information and internal documents of the AI Office, the Board, competent market surveillance authorities or other public authorities of the Member States
      basis_segment_ids: [AIA-TEXT-A075D-P002]
    - text: correspondence between the AI Office and those authorities
      basis_segment_ids: [AIA-TEXT-A075D-P002]
  verified_by: vidibro
- norm_id: AIA-NORM-A075D-P2-FILE-ACCESS-LIMITS
  source: A075D-P002
  quote: The right of access to the file shall not extend to confidential information and internal documents
    of the AI Office, the Board, competent market surveillance authorities or other public authorities
    of the Member States. In particular, the right of access shall not extend to correspondence between
    the AI Office and those authorities.
  action: exclude confidential information, internal documents and AI Office correspondence with the authorities
    from the operator's access to the file
  actors:
  - actor_ref: operator
    basis_segment_ids: [AIA-TEXT-A075D-P002]
  targets: []
  kind: applicability
  temporal_regime_id: AIA-TEMP-CHAPTER-IX
  product_scope: no_product_action
  product_scope_reason: This limits a procedural entitlement rather than requiring a product action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_reported
- norm_id: AIA-NORM-A075D-P2-SET-DISCLOSURE-TERMS
  source: A075D-P002
  quote: The AI Office shall have the power to adopt decisions setting out such terms of disclosure in
    the case of disagreement between the parties.
  action: set negotiated-disclosure terms by decision when parties disagree
  actors:
