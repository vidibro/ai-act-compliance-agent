- norm_id: AIA-NORM-A075D-P2-DISCLOSE-INFRINGEMENT-EVIDENCE
  source: A075D-P002
  quote: Nothing in this paragraph shall prevent the AI Office from disclosing and using information necessary
    to prove an infringement.
  action: disclose and use information necessary to prove an infringement despite file-access restrictions
