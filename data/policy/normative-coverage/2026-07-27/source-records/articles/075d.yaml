- norm_id: AIA-NORM-A075D-P4-PUBLISH-DECISIONS
  source: A075D-P004
  quote: The AI Office shall publish the decisions it adopts pursuant to Articles 75b and 75c. Such publication
    shall state the names of the parties and the main content of the decision, including any penalties
    imposed.
  action: publish Article 75b and 75c decisions with party names decision substance and imposed penalties
