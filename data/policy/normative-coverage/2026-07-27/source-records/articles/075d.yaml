records:
- norm_id: AIA-NORM-A075D-P1-APPLY-PROCEDURAL-RIGHTS
  source: A075D-P001
  quote: Article 18 of Regulation (EU) 2019/1020 shall apply mutatis mutandis
  action: apply Regulation 2019/1020 Article 18 procedural rights with necessary adaptations while preserving more specific rights
  subject_ref: article_75_operator
  subject_category: supported_operator
  kind: applicability
  product_scope: no_product_action
  product_scope_reason: This grants procedural protection rather than imposing a product action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A075D-P2-RESPECT-DEFENCE-AND-FILE-RIGHTS
  source: A075D-P002
  quote: The rights of defence and of access to the file of operators falling within the scope of Article 75(1) shall be fully respected
  action: fully respect Article 75(1) operators' defence and file-access rights in proceedings
  subject_ref: ai_office
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A075D-P2-NEGOTIATED-FILE-ACCESS
  source: A075D-P002
  quote: those operators shall be entitled to have access to the AI Office file under the terms of a negotiated disclosure
  action: access the AI Office file through negotiated disclosure subject to legitimate business-secret interests and stated confidentiality exclusions
  subject_ref: article_75_operator
  subject_category: supported_operator
  kind: entitlement
  product_scope: no_product_action
  product_scope_reason: This is a procedural entitlement rather than a product action.
  implementation_mode: none_required
  implementation_reason: No independent product action arises.
  verification_mode: not_assessed
