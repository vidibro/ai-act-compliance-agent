  decision: accepted_with_basis
  reason: 'Paragraph 3 is passive and names no party. It binds whoever obtains information or documentation
    pursuant to Article 55, and paragraph 1(c) names who that is: the AI Office and, as appropriate, national
    competent authorities. Those are public authorities, but the Act never calls them that here, so no
    span can name the actor by its label.'
