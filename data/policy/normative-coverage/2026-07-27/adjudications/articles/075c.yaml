- finding_id: AIA-VALID-826FC36F8BBCC5FF
  target: AIA-NORM-A075C-P5-PENALTY-PAYMENT-LIMITS
  rule: condition_expression_missing
  source_ref: AIA-TEXT-A075C-P018
  source_sha256: 5594f73eca0fb729a6dd6a165ad9ed049eb1f625107cd6d58523ac0d4ced1052
  target_sha256: 6f5e4687986aa468d5a61518056ebdc4cc4e75ca7429ab14d2799a401292224a
  decision: accepted_with_basis
  reason: '"Where applicable" qualifies the 5% ceiling only, which depends on the operator having a daily
    income or turnover to measure. The payments must always be effective and proportionate. A condition
    on the whole norm would make that optional too.'
  legal_basis:
  - span_id: AIA-TEXT-A075C-P018
    source_sha256: 5594f73eca0fb729a6dd6a165ad9ed049eb1f625107cd6d58523ac0d4ced1052
    quote: Those penalty payments shall be effective and proportionate, and, where applicable, shall not
      exceed 5 % of the average daily income or worldwide annual turnover in the preceding financial year
      per day
  reviewed_by: vidibro
- finding_id: AIA-VALID-147703086F00D852
  target: AIA-NORM-A075C-P8-FIVE-YEAR-INFRINGEMENT-LIMIT
