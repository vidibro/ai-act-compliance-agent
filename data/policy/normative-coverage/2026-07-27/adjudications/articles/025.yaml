  target_sha256: e7d8aff0b79f7261062fca13d12d4ec9922bd1c3643171e056fccb7548bac1ed
  decision: accepted_with_basis
  reason: >-
    Paragraph 5 names its subject by cross-reference — "Paragraphs 2 and 3" — and no party at all,
    so no span of it could evidence an actor. The parties are those the referenced paragraphs bind.
    Paragraph 2 binds the initial provider, in the words quoted below.
