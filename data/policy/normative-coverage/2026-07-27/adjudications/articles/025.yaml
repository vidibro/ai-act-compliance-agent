- finding_id: AIA-VALID-9CD6FD257F8D2228
  target: AIA-NORM-A025-P5-PROTECT-RIGHTS-AND-SECRETS
  rule: exception_expression_missing
  source_ref: AIA-TEXT-A025-P017
  source_sha256: e2ddad11e401df9774dd6fcc311a970ae7dbbeaf165558784d440d58149f2fdc
  target_sha256: 6bcbd532ab01c2604e64b626db6718da26f329c1afaa93c82d7bef5f4b7a1b42
  decision: false_positive
  reason: >-
    "Without prejudice" is a saving clause, not an exception branch. It takes nothing out of
    paragraphs 2 and 3; it preserves a concurrent external regime alongside them, and the external
    law is recorded as AIA-REL-A025-P5-PROTECT-RIGHTS-AND-SECRETS-EXTERNAL-REQUIREMENT-01 rather
    than as a condition of this norm. An exception expression here would state that the paragraph 2
    and 3 duties fall away where intellectual property is involved, which the sentence does not say.
  reviewed_by: vidibro
- finding_id: AIA-VALID-11D183A340FA3B5F
