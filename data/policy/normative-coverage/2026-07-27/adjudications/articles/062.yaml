  decision: accepted_with_basis
  reason: 'Paragraph 2 is passive: the SME interests "shall be taken into account when setting the fees
    for conformity assessment under Article 43". Those fees are set by the bodies that carry out the Article
    43 assessment, so the duty is theirs. The sentence never names them, so no span of it can name the
    actor.'
