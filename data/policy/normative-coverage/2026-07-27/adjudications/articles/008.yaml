  decision: accepted_with_basis
  reason: 'Article 8(1) addresses the SYSTEM, not a party: "High-risk AI systems shall
    comply with the requirements laid down in this Section." No segment of this Article
    names a duty-holder, so no basis span could evidence one. The party is supplied
    by Article 16(a), which puts the same Section 2 compliance duty on the provider
    in terms, and this norm is recorded as carried by that one rather than reported
    twice.'
