  reason: 'Same sentence, same silence: "The risk management system referred to in
    Article 9 shall be taken into account when ensuring compliance with those requirements"
    names no party either. The requirements it qualifies are the Section 2 requirements
    Article 16(a) puts on the provider, so the duty-holder is the provider and the
    norm is judged through the Article 9 rule.'
