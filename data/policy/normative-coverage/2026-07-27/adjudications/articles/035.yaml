- finding_id: AIA-VALID-555B875927CDAA91
  target: AIA-NORM-A035-P1-ASSIGN-SINGLE-IDENTIFICATION-NUMBER
  rule: condition_expression_missing
  source_ref: AIA-TEXT-A035-P001
  source_sha256: adbd10a4269157b9eb9ec3f7fde541e50d0858ed57f68eeed84aff80e67e574c
  target_sha256: 160d1639a088b5f914b6a0cc3ba7dd4cf66b137788f80faff2ad6f642befa5db
  decision: false_positive
  reason: >-
    The cue is "even where a body is notified under more than one Union act", and it is the opposite
    of a condition. The duty is to assign one number to each notified body; the clause says that
    duty holds anyway in the case that might have looked like an exception to it. Recording it as a
    condition would invert the paragraph, limiting the duty to bodies notified under more than one
    Union act, when the enacted words extend it to them.
  reviewed_by: vidibro
