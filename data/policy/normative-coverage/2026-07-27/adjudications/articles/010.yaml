  target_sha256: 42ac17d89f822166aff9a5d8e7a358464422220022d48559a98a69b8a693b220
  decision: false_positive
  reason: '"Shall be subject to" is the verb of the duty itself: the data sets are
    made subject to data governance and management practices. It states no gate on
    when the duty applies. The "appropriate for the intended purpose" qualifier is
    retained in the action, and paragraph 2 binds every training, validation and testing
    data set without condition.'
