  reason: The statistical-properties duty is unconditional. "Where applicable" sits
    inside the "including ..." limb and qualifies only the persons or groups the system
    is intended to be used on; it does not gate the duty to have appropriate statistical
    properties. The limb and its qualifier are retained in the action.
