- finding_id: AIA-VALID-1B18EF98AF4EA700
  target: AIA-NORM-A075-P1-COMPETENCE-ADDRESSEES
  rule: condition_expression_missing
  source_ref: AIA-TEXT-A075-P008
  source_sha256: e390dd1d8674fba33a69787fb82e5b8dcdcb231b0a3fd3fabb3b0da0302516c6
  target_sha256: 05a8cf26f5b6c2759dff57c3db9cdd6f9b94d3f5753c83b2f0b2b4c1ea998957
  decision: accepted_with_basis
  reason: '"Only when" limits the second sentence only, the deployers reached. The exclusive competence
    applies to the providers of the systems without condition. A condition on the whole norm would narrow
    the providers too. The action keeps the limit on deployers.'
  legal_basis:
  - span_id: AIA-TEXT-A075-P008
    source_sha256: e390dd1d8674fba33a69787fb82e5b8dcdcb231b0a3fd3fabb3b0da0302516c6
    quote: It shall apply to the deployers of those systems only when they are also the provider or form
      part of the same undertaking as the provider
  reviewed_by: vidibro
- finding_id: AIA-VALID-C3B00E6E8DDD251E
  target: AIA-NORM-A075-P1A-REPORT-SERIOUS-INCIDENTS
  rule: exception_expression_missing
  source_ref: AIA-TEXT-A075-P009
  source_sha256: e4ba417f10a1cafa81b6091b88575e045b3edf88d12a945390669dc5608497c4
  target_sha256: 0c9dac603c55456919c65c90168ccdc6f36a3a47cc2980521e5f477f751fba88
  decision: false_positive
  reason: '"By way of derogation from Article 73" names the default this duty replaces: the report goes
    to the AI Office instead of the national authority. It is the duty itself, not an exception to it.
    Who owes it is the condition.'
  legal_basis:
  - span_id: AIA-TEXT-A075-P009
    source_sha256: e4ba417f10a1cafa81b6091b88575e045b3edf88d12a945390669dc5608497c4
    quote: By way of derogation from Article 73, providers of high-risk AI systems subject to the competence
      of the AI Office pursuant to paragraph 1 of this Article shall report any serious incidents to the
      AI Office
  reviewed_by: vidibro
- finding_id: AIA-VALID-8D35301B58D12145
  target: AIA-NORM-A075-P1B-AUTHORITY-POWERS:actor:public_authority:AIA-TEXT-A075-P010
