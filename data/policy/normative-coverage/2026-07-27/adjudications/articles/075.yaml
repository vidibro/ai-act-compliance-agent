  target_sha256: c5ea6336735ceca5fff7c95b64f53551a85a1fae160a0f9ca26ba29963e641c2
  decision: accepted_with_basis
  reason: '"Those authorities" are the authorities involved in the application of this Regulation, a group
    no single role covers. The public-authority role records the group, and no span can name it.'
  legal_basis:
  - span_id: AIA-TEXT-A075-P010
    source_sha256: e106f8606d2c7abee66d08305dff3a62e6a803d5c271b0e67f436f6aacceb7ec
