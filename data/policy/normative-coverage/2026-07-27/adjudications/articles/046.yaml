- finding_id: AIA-VALID-895E75B4F1AC6BDF
  target: AIA-NORM-A046-P1-DEROGATION-AUTHORISATION
  rule: exception_expression_missing
  source_ref: AIA-TEXT-A046-P001
  source_sha256: dd8ac9c0491be89ca914aa0d908c48d647dd73f7dd9079d97f67e09043ac4708
  target_sha256: fa43e02921ec8cc0cc6ec27e331a07a6d29ad708bf21ca5a0dc8d5399e110bd4
  decision: false_positive
  reason: >-
    The cue is "By way of derogation from Article 43", which says what this power derogates FROM.
    It is not an exception to the power itself. An exception expression here would name a case in
    which the market surveillance authority may not authorise, and the opening words do the
    opposite: they are what lets the authority act at all, outside the Article 43 procedures.
  reviewed_by: vidibro
