  reason: '"Subject to the agreement of the market surveillance authorities concerned" governs only the
    second limb of point (a), supporting their joint activities. Recording it as a condition on the whole
    norm would also condition the coordination limb, which the text does not do. The action keeps the
    agreement on the joint-activities limb.'
