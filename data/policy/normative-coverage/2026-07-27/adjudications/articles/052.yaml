  target_sha256: 39923db6a3405dcb149b888b1054e561ab24f2fba662badb8a24b00bfebbe925
  decision: false_positive
  reason: 'The "without prejudice" clause never lifts the duty to publish the list
    and keep it up to date. It keeps a concurrent duty running while the list is published:
    to observe and protect intellectual property rights, confidential business information
    and trade secrets. The record carries that duty in its mandatory content. There
    is no case in which the list need not be published, so there is no exception branch
    to state.'
