- finding_id: AIA-VALID-5FA2F23889B88416
  target: AIA-NORM-A077-P1B-COOPERATE-AND-ASSIST
  rule: condition_expression_missing
  source_ref: AIA-TEXT-A077-P003
  source_sha256: 21083ffede86cdabd777bdeaa45d4d3c8093adcc0ed0fe9c6cd3be378c807caa
  target_sha256: f9505cecb8151eaf72d2e934047abd8978faa3004dd025f9007cd0644cf841dd
  decision: accepted_with_basis
  reason: '"Where necessary" qualifies one part of the cooperation, the exchange of information. Close
    cooperation and mutual assistance are always owed. A condition on the whole norm would make them optional
    too. The action keeps the qualifier on the exchange.'
  legal_basis:
  - span_id: AIA-TEXT-A077-P003
    source_sha256: 21083ffede86cdabd777bdeaa45d4d3c8093adcc0ed0fe9c6cd3be378c807caa
    quote: This shall include, in particular, exchange of information where necessary for the effective
      supervision or enforcement of this Regulation and the respective other Union legislation
