  decision: accepted_with_basis
  reason: 'Paragraph 3 is passive: prospective providers "shall be directed". Article 57(7) makes the
    competent authorities the ones who guide providers and prospective providers in the sandbox, so they
    are the ones who direct them to these services. The sentence never names them, so no span of it can
    name the actor.'
