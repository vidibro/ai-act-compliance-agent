- finding_id: AIA-VALID-B1CFA384AD4EBE86
  target: AIA-NORM-A059-P1-C-MONITOR-AND-MITIGATE-RISKS
  rule: condition_expression_missing
  source_ref: AIA-TEXT-A059-P009
  source_sha256: 3434e9cf08f16e490bbd9ac71e0adcf4a6f540f2b1dee1d676d4acb6593c30b3
  target_sha256: e1827700e0e0c5d7d8385388fd6970a8357e8c07084619d34a2b8e8c97b974df
  decision: false_positive
  reason: '"If" here introduces what the monitoring mechanisms must detect ("to identify if any high risks
    ... may arise"), and "where necessary" qualifies only the stopping of the processing, which is one
    of the responses the mechanisms must allow. Neither limits when point (c) applies: it binds every
    processing under paragraph 1, so there is no condition on the norm to state.'
  legal_basis:
  - span_id: AIA-TEXT-A059-P009
    source_sha256: 3434e9cf08f16e490bbd9ac71e0adcf4a6f540f2b1dee1d676d4acb6593c30b3
    quote: there are effective monitoring mechanisms to identify if any high risks to the rights and freedoms
      of the data subjects
  reviewed_by: vidibro
- finding_id: AIA-VALID-ECD76B0FED3A4E13
  target: AIA-NORM-A059-P1-J-PUBLISH-PROJECT-SUMMARY:actor:sandbox_participant:AIA-TEXT-A059-P016
  rule: actor_basis_does_not_name_actor
  source_ref: AIA-TEXT-A059-P016
  source_sha256: a8e8065ae7549c9e8690659dc6a4c507358e1df02666ec78b609b89dbcf29398
  target_sha256: df49c9840d235f7d465ea2505b126a6f723298a9cce60fe3f2e3582ac0d7e124
  decision: accepted_with_basis
  reason: 'Point (j) is passive: the summary "is published". Like every lettered point, it is a condition
    that must be met before personal data may be further processed in the sandbox, so it falls to the
    party that wants to process the data, which is the sandbox participant. The point never names that
    party, so no span of it can name the actor.'
  legal_basis:
  - span_id: AIA-TEXT-A059-P016
    source_sha256: a8e8065ae7549c9e8690659dc6a4c507358e1df02666ec78b609b89dbcf29398
    quote: a short summary of the AI project developed in the sandbox, its objectives and expected results
      is published on the website of the competent authorities
  - &id001
    span_id: AIA-TEXT-A059-P001
    source_sha256: e6e4ce518ac157a5b763a88d7ba56f3b566c59d6043ff59f4a314137e3a9a0a4
    quote: In the AI regulatory sandbox, personal data lawfully collected for other purposes may be processed
      solely for the purpose of developing, training and testing certain AI systems in the sandbox when
      all of the following conditions are met
  reviewed_by: vidibro
- finding_id: AIA-VALID-889CFC365A429C7B
  target: AIA-NORM-A059-P3-PRESERVE-OTHER-DATA-LAW
  rule: exception_expression_missing
  source_ref: AIA-TEXT-A059-P018
  source_sha256: 657a43881f57666b2ae76b5e3e1f6639e3a95764c0076beabacee1221bf46bb8
  target_sha256: cd1e6bf8c8c40e83bf339f78e7356c12539a23eaa5134542b7a98f67dc4ab021
  decision: false_positive
  reason: 'Paragraph 3 is a saving clause. "Without prejudice" keeps other Union and national data-protection
    law applying alongside paragraph 1: law that excludes further processing, and law that provides its
    own legal basis. It takes no case out of the Article 59 permission and adds none, so there is no exception
    branch to state.'
  legal_basis:
  - span_id: AIA-TEXT-A059-P018
    source_sha256: 657a43881f57666b2ae76b5e3e1f6639e3a95764c0076beabacee1221bf46bb8
    quote: Paragraph 1 is without prejudice to Union or national law which excludes processing of personal
      data for other purposes than those explicitly mentioned in that law
  reviewed_by: vidibro
- finding_id: AIA-VALID-41299D625F3EB4B7
  target: AIA-NORM-A059-P3-PRESERVE-OTHER-DATA-LAW:actor:sandbox_participant:AIA-TEXT-A059-P018
  rule: actor_basis_does_not_name_actor
  source_ref: AIA-TEXT-A059-P018
  source_sha256: 657a43881f57666b2ae76b5e3e1f6639e3a95764c0076beabacee1221bf46bb8
  target_sha256: a82af881bc4c65e53477e99e081385a7f26e67d2061374e70367b667593aef71
  decision: accepted_with_basis
  reason: 'Paragraph 3 qualifies the paragraph 1 permission rather than addressing anyone, so its party
    is whoever relies on that permission: the participant processing personal data in the sandbox. The
    paragraph names only paragraph 1, so no span of it can name the actor.'
  legal_basis:
  - span_id: AIA-TEXT-A059-P018
    source_sha256: 657a43881f57666b2ae76b5e3e1f6639e3a95764c0076beabacee1221bf46bb8
    quote: Paragraph 1 is without prejudice to Union or national law
  - *id001
  reviewed_by: vidibro
