  decision: accepted_with_basis
  reason: '"They" refers back to the three bodies named in the previous sentence: national competent authorities,
    the European Data Protection Supervisor and the AI Office. No single role covers all three, so the
    public-authority role records the group and no span can name it.'
  legal_basis:
