  source_sha256: f24c519ed49b7cea613d5a135917dde4c83478dc74382325da4ef05a5fad6006
  target_sha256: 5f6b154008bcedd536ec56cef7c7713d0423d23fd67ee7589d978e6fbe279da2
  decision: false_positive
  reason: The subparagraph is a saving clause. "Without prejudice" keeps Union and national law on real-world
    testing of Annex I products applying alongside Article 60(1). It takes no case out of the Article
    60 route and adds none, so there is no exception branch to state.
  legal_basis:
  - span_id: AIA-TEXT-A060-P003
