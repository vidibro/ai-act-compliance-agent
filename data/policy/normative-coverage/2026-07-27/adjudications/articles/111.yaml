  - span_id: AIA-TEXT-A111-P001
    source_sha256: 18be91e932b2cb3fb917ff7350f3fb008358797103cc2a2dbf6d3caa2256e491
    quote: AI systems which are components of the large-scale IT systems established by the legal acts
      listed in Annex X that have been placed on the market or put into service before 2 August 2027 shall
      be brought into compliance with this Regulation by 31 December 2030
  reviewed_by: vidibro
