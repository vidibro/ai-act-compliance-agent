  legal_basis:
  - span_id: AIA-TEXT-A017-P017
    source_sha256: d41d3cac84501cac7b0999fbed08417d53d7e5772289a62c91b9fb6500ee0a54
    quote: For providers that are financial institutions subject to requirements regarding
      their internal governance, arrangements or processes under Union financial services
      law, the obligation to put in place a quality management system, with the exception
      of paragraph 1, points (g), (h) and (i) of this Article, shall be deemed to
