  decision: accepted_with_basis
  reason: >-
    The quotation begins at "To that end", which points back to the single application and unified
    assessment procedure established by the first sentence of the same paragraph. That sentence is
    recorded below, and the norm carries its proviso as a structured condition, so the cooperation
    duty is complete: the two sets of notifying authorities cooperate in their assessments where
    the relevant Union harmonisation legislation provides for the unified procedure.
  legal_basis:
  - span_id: AIA-TEXT-A028-P008
    source_sha256: 53080787e7f9bcedd936173dcd6bd63c17cd5e7275f786fafa1740a5294e4107
    quote: To that end, notifying authorities designated pursuant to this Regulation and those
      designated pursuant to the Union harmonisation legislation listed in Section A of Annex I
      shall cooperate in their assessments.
