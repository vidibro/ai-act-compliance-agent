- finding_id: AIA-VALID-B7C082C11A137C24
  target: AIA-NORM-A053-P2-OPEN-SOURCE-EXCEPTION:actor:gpai_provider:AIA-TEXT-A053-P008
  rule: actor_basis_does_not_name_actor
  source_ref: AIA-TEXT-A053-P008
  source_sha256: 7df54b2de08d010e1f97488b6616e61fde33c32a3602d876fb672352d816bcb6
  target_sha256: e5180dc9b1d2809bd723d7f40df6db9a40a650c0eeae58a90e20e71c99369a30
  decision: accepted_with_basis
  reason: 'Paragraph 2 says "providers of AI models", dropping the "general-purpose" the rest of the Article
    carries. It can address no one else: it disapplies "the obligations set out in paragraph 1, points
    (a) and (b)", and paragraph 1 binds providers of general-purpose AI models. A party outside paragraph
    1 has nothing here to be relieved of.'
  legal_basis:
  - span_id: AIA-TEXT-A053-P001
    source_sha256: 1c1fc2cf912dc5c99713f7cbf99f12997a4cd19a9cfaa7ebc6e836111cbe7f79
    quote: 'Providers of general-purpose AI models shall:'
  - span_id: AIA-TEXT-A053-P008
    source_sha256: 7df54b2de08d010e1f97488b6616e61fde33c32a3602d876fb672352d816bcb6
    quote: The obligations set out in paragraph 1, points (a) and (b), shall not apply to providers of
      AI models that are released under a free and open-source licence
  reviewed_by: vidibro
- finding_id: AIA-VALID-88DEC1ED930FC4A4
  target: AIA-NORM-A053-P2-SYSTEMIC-RISK-OVERRIDE:actor:gpai_provider:AIA-TEXT-A053-P008
  rule: actor_basis_does_not_name_actor
  source_ref: AIA-TEXT-A053-P008
  source_sha256: 7df54b2de08d010e1f97488b6616e61fde33c32a3602d876fb672352d816bcb6
  target_sha256: 369443faa44828d9e3ce45ed2691cf445ebd277f8945a99835a3ffff60e9768c
  decision: accepted_with_basis
  reason: The override restores the paragraph 1 duties for models with systemic risk, so its duty-holder
    is the paragraph 1 duty-holder. The sentence names the MODEL rather than the provider because it is
    the model's systemic risk that withdraws the paragraph 2 relief.
  legal_basis:
  - span_id: AIA-TEXT-A053-P001
    source_sha256: 1c1fc2cf912dc5c99713f7cbf99f12997a4cd19a9cfaa7ebc6e836111cbe7f79
    quote: 'Providers of general-purpose AI models shall:'
  - span_id: AIA-TEXT-A053-P008
    source_sha256: 7df54b2de08d010e1f97488b6616e61fde33c32a3602d876fb672352d816bcb6
    quote: This exception shall not apply to general-purpose AI models with systemic risks.
  reviewed_by: vidibro
