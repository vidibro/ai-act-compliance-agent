  target_sha256: 59e09c50f6a293ee9f1bbdc5ec6fab38b52476555cea5674e97535924d89f865
  decision: false_positive
  reason: '"Without prejudice to the need to observe and protect" keeps the concurrent intellectual-property,
    confidential-business-information and trade-secret duty running; it does not excuse or narrow the
    Article 53(1)(b) documentation duty in any case. The norm states that affirmative duty as its action,
    so there is no exception branch to state.'
  legal_basis:
