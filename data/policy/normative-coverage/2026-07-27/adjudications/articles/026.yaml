  target_sha256: 47a1548c78164fc7a570af60390183500e4ad2c1c39ea9d3e0002beacea6b354
  decision: accepted_with_basis
  reason: The canonical action retains the qualifying authority and both timing routes;
    its structured condition limits it to the targeted criminal-investigation use
    and its exception retains the initial-identification case. The assembled norm
    is a complete conditional duty.
  legal_basis:
  - span_id: AIA-TEXT-A026-P10
    source_sha256: 02396e047cae8b9a492cf58b2642fc52114462a04f71b01c88b05403ee9874be
    quote: the deployer of a high-risk AI system for post-remote biometric identification
