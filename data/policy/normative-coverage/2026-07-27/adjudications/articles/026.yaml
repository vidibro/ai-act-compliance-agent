  target_sha256: 853b9575925311a198d205e9e8e47e3bd3dc4ff35459d91c4bcda75652e38082
  decision: accepted_with_basis
  reason: The deletion action is conditional on authorisation refusal through its
    shared structured condition with the preceding stop-use duty. Together with the
    recorded legal span, the norm reconstructs the complete duty; the fragment introduces
    no further qualifier.
  legal_basis:
  - span_id: AIA-TEXT-A026-P10
    source_sha256: 02396e047cae8b9a492cf58b2642fc52114462a04f71b01c88b05403ee9874be
    quote: If the authorisation requested pursuant to the first subparagraph is rejected,
      the use of the post-remote biometric identification system linked to that requested
      authorisation shall be stopped with immediate effect and the personal data linked
      to the use of the high-risk AI system for which the authorisation was requested
      shall be deleted.
  reviewed_by: vidibro
