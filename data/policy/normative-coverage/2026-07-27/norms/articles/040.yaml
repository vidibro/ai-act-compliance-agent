  targets: []
  action: pursue the enacted investment, innovation, cooperation, standards, and inclusive-governance
    objectives in the standardisation process
  norm_text: The participants in the standardisation process shall seek to promote investment and innovation
    in AI, including through increasing legal certainty, as well as the competitiveness and growth of
