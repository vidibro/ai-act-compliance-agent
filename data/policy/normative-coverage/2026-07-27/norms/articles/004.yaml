  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: provider_or_deployer
    category: supported_operator
  action: take context-sensitive measures supporting AI literacy among staff and other persons operating
    or using AI systems on the provider's or deployer's behalf
  norm_text: Providers and deployers of AI systems shall take measures to support the development of AI
    literacy of their staff and other persons dealing with the operation and use of AI systems on their
    behalf, taking into account their technical knowledge, experience, education and training and the
    context the AI systems are to be used in, and considering the persons or groups of persons on whom
    the AI systems are to be used. This obligation does not require providers or deployers to guarantee
    any specific level of AI literacy of any individual.
  detection_channels:
  - semantic_legal_effect
  - shall_token
  - existing_implementation
  primary_spans:
  - AIA-TEXT-A004-P001
  qualifier_spans: []
  effective_date_spans: []
  conditions:
  - account for the covered persons' technical knowledge, experience, education, and training
  - account for the context in which the AI systems are to be used
  - consider the persons or groups on whom the AI systems are to be used
  exceptions:
  - the obligation does not require a guaranteed specific AI-literacy level for any particular individual
    among the covered staff or other persons
