- norm_id: AIA-NORM-A050-P4-DEEPFAKE
  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: deployer
    category: supported_operator
  action: disclose artificial generation or manipulation of deep-fake image, audio, or video
  norm_text: Deployers of an AI system that generates or manipulates image, audio or video content constituting
    a deep fake, shall disclose that the content has been artificially generated or manipulated. This
    obligation shall not apply where the use is authorised by law to detect, prevent, investigate or prosecute
    criminal offence. Where the content forms part of an evidently artistic, creative, satirical, fictional
    or analogous work or programme, the transparency obligations set out in this paragraph are limited
    to disclosure of the existence of such generated or manipulated content in an appropriate manner that
    does not hamper the display or enjoyment of the work.
  detection_channels:
