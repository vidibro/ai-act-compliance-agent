  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: deployer
    category: supported_operator
  action: disclose artificial generation or manipulation of public-interest text
  norm_text: Deployers of an AI system that generates or manipulates text which is published with the
    purpose of informing the public on matters of public interest shall disclose that the text has been
    artificially generated or manipulated. This obligation shall not apply where the use is authorised
    by law to detect, prevent, investigate or prosecute criminal offences or where the AI-generated content
    has undergone a process of human review or editorial control and where a natural or legal person holds
