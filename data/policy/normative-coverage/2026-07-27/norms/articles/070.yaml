- norm_id: AIA-NORM-A070-P1-DESIGNATE-AND-SAFEGUARD-AUTHORITIES
  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: member_state_and_national_competent_authority
    category: public_authority
  action: designate notifying and surveillance authorities and safeguard their independent impartial objective
    operation and member conduct
  norm_text: Each Member State shall establish or designate as national competent authorities at least
    one notifying authority and at least one market surveillance authority for the purposes of this Regulation.
    Those national competent authorities shall exercise their powers independently, impartially and without
    bias so as to safeguard the objectivity of their activities and tasks, and to ensure the application
    and implementation of this Regulation. The members of those authorities shall refrain from any action
    incompatible with their duties. Provided that those principles are observed, such activities and tasks
    may be performed by one or more designated authorities, in accordance with the organisational needs
    of the Member State.
