  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: notified_body
    category: notified_or_conformity_body
  action: maintain documented confidentiality procedures and bind staff to professional secrecy subject
    to enacted exceptions
  norm_text: Notified bodies shall have documented procedures in place ensuring that their personnel,
    committees, subsidiaries, subcontractors and any associated body or personnel of external bodies maintain,
    in accordance with Article 78, the confidentiality of the information which comes into their possession
    during the performance of conformity assessment activities, except when its disclosure is required
    by law. The staff of notified bodies shall be bound to observe professional secrecy with regard to
    all information obtained in carrying out their tasks under this Regulation, except in relation to
