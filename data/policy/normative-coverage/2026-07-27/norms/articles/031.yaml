- norm_id: AIA-NORM-A031-P5-CONFLICTING-ACTIVITIES-PROHIBITED
  act_version_date: '2026-07-27'
  kind: prohibition
  subjects:
  - subject_ref: conformity_assessment_body_and_personnel
    category: notified_or_conformity_body
  action: prohibit body leadership and assessment personnel from system activities, party representation,
    consultancy, or other independence conflicts
  norm_text: Neither a conformity assessment body, its top-level management nor the personnel responsible
    for carrying out its conformity assessment tasks shall be directly involved in the design, development,
    marketing or use of high-risk AI systems, nor shall they represent the parties engaged in those activities.
    They shall not engage in any activity that might conflict with their independence of judgement or
    integrity in relation to conformity assessment activities for which they are notified. This shall,
