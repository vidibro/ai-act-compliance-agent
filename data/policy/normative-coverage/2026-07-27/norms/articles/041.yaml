  conditions:
  - operator: all_of
    operands:
    - the Commission has requested one or more European standardisation organisations, pursuant to Article
      10(1) of Regulation (EU) No 1025/2012, to draft a harmonised standard for Chapter III Section 2
      requirements or, as applicable, Chapter V Sections 2 and 3 obligations
    - operator: any_of
