    category: supported_operator
  action: present substantiated model-specific arguments with the notification against systemic-risk classification
  norm_text: The provider of a general-purpose AI model that meets the condition referred to in Article
    51(1), point (a), may present, with its notification, sufficiently substantiated arguments to demonstrate
