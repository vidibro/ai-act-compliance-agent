      - a Member State market-surveillance authority objects to a measure taken by another market-surveillance
        authority
      - operator: any_of
        operands:
        - the objection is raised within three months after receipt of the Article 79(5) notification
        - the objection concerns Article 5 prohibited-practice non-compliance and is raised within 30
          days after receipt of the Article 79(5) notification
    - the Commission considers the measure contrary to Union law
