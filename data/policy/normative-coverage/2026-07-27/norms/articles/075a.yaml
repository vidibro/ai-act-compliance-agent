- norm_id: AIA-NORM-A075A-P4-JUDICIAL-AUTHORISATION-REVIEW
  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: national_judicial_authority
    category: public_authority
  action: promptly review requested coercive measures for non-arbitrariness and proportionality without
    reviewing investigation necessity or demanding the AI Office file
  norm_text: Where such an authorisation is applied for, the national judicial authority shall promptly
    verify that the coercive measures envisaged are neither arbitrary nor excessive having regard to the
    subject matter of the investigation or inspection and the documents provided by the AI Office with
    the decision. In its verification of the proportionality of coercive measures, the national judicial
    authority may ask the AI Office for detailed explanations, in particular relating to the grounds the
    AI Office has for suspecting that an infringement of this Regulation has taken place and the seriousness
    of the suspected infringement and, where relevant, the nature of the involvement of the person subject
    to the coercive measures. The national judicial authority shall not review the necessity of the investigation
    or inspection nor demand information from the case file of the AI Office. In accordance with the Treaties,
    the legality of the decision of the AI Office is subject to review only by the Court of Justice of
    the European Union.
