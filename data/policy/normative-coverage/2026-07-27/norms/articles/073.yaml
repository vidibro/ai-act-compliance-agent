  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: provider
    category: supported_operator
  action: cooperate during investigations and inform authorities before any system alteration that could
    affect cause evaluation
  norm_text: The provider shall cooperate with the competent authorities, and where relevant with the
    notified body concerned, during the investigations referred to in the first subparagraph, and shall
