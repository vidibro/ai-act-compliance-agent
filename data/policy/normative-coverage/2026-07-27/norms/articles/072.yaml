- norm_id: AIA-NORM-A072-P2-OPERATE-LIFETIME-MONITORING
  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: provider
    category: supported_operator
  action: actively collect document and analyse lifetime performance and interaction data to evaluate
    continuous compliance while excluding protected law-enforcement data
  norm_text: The post-market monitoring system shall actively and systematically collect, document and
    analyse relevant data which may be provided by deployers or which may be collected through other sources
    on the performance of high-risk AI systems throughout their lifetime, and which allow the provider
    to evaluate the continuous compliance of AI systems with the requirements set out in Chapter III,
    Section 2. Where relevant, post-market monitoring shall include an analysis of the interaction with
    other AI systems. This obligation shall not cover sensitive operational data of deployers which are
    law-enforcement authorities.
