  - AIA-TEXT-A027-P007
  effective_date_spans: []
  conditions:
  - the system is high-risk under Article 6(2) and is not intended for Annex III point 2
  - the deployer is governed by public law or provides public services, or the system falls within Annex
    III point 5(b) or 5(c)
  exceptions: []
  mandatory_content:
