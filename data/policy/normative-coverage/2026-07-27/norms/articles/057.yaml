  act_version_date: '2026-07-27'
  kind: legal_consequence
  subjects:
  - subject_ref: provider_or_prospective_provider
    category: supported_operator
  action: preserve third-party damage liability while applying the enacted good-faith sandbox no-fine
    safe harbours
  norm_text: Providers and prospective providers participating in the AI regulatory sandbox shall remain
    liable under applicable Union and national liability law for any damage inflicted on third parties
    as a result of the experimentation taking place in the sandbox. However, provided that the prospective
    providers observe the specific plan and the terms and conditions for their participation and follow
    in good faith the guidance given by the national competent authority, no administrative fines shall
    be imposed by the authorities for infringements of this Regulation. Where other competent authorities
    responsible for other Union and national law were actively involved in the supervision of the AI system
    in the sandbox and provided guidance for compliance, no administrative fines shall be imposed regarding
    that law.
