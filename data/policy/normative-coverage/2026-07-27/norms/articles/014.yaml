- norm_id: AIA-NORM-A014-P5-TWO-PERSON-VERIFICATION
  act_version_date: '2026-07-27'
  kind: obligation
  actors:
  - actor_ref: provider
    category: supported_operator
  targets: []
  action: ensure no deployer action or decision relies on a system identification unless at least two
    competent, trained, and authorised natural persons separately verify and confirm it
  norm_text: For high-risk AI systems referred to in point 1(a) of Annex III, the measures referred to
    in paragraph 3 of this Article shall be such as to ensure that, in addition, no action or decision
    is taken by the deployer on the basis of the identification resulting from the system unless that
    identification has been separately verified and confirmed by at least two natural persons with the
    necessary competence, training and authority.
