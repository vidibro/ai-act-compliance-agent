- norm_id: AIA-NORM-A002-P3-MILITARY-EXCLUSION
  source: A002-P011
  quote: This Regulation does not apply to AI systems where and in so far they are placed on the market, put into service, or used with or without modification exclusively for military, defence or national security purposes, regardless of the type of entity carrying out those activities.
  action: exclude AI systems placed on the market, put into service, or used exclusively for military, defence, or national-security purposes
  subject_ref: military_defence_or_national_security_ai_system
  subject_category: other
  kind: applicability
  conditions:
  - the AI system is placed on the market, put into service, or used exclusively for military, defence, or national-security purposes
  - the exclusion applies regardless of the type of entity carrying out those activities
- norm_id: AIA-NORM-A002-P3-MILITARY-OUTPUT-EXCLUSION
  source: A002-P012
  quote: This Regulation does not apply to AI systems which are not placed on the market or put into service in the Union, where the output is used in the Union exclusively for military, defence or national security purposes, regardless of the type of entity carrying out those activities.
  action: exclude AI systems outside the Union whose output is used in the Union exclusively for military, defence, or national-security purposes
  subject_ref: third_country_military_defence_or_national_security_ai_system
  subject_category: other
  kind: applicability
  conditions:
  - the AI system is not placed on the market or put into service in the Union
  - the AI system output is used in the Union exclusively for military, defence, or national-security purposes
  - the exclusion applies regardless of the type of entity carrying out those activities
- norm_id: AIA-NORM-A002-P4-INTERNATIONAL-COOPERATION-EXCLUSION
  source: A002-P013
  quote: This Regulation applies neither to public authorities in a third country nor to international organisations falling within the scope of this Regulation pursuant to paragraph 1, where those authorities or organisations use AI systems in the framework of international cooperation or agreements for law enforcement and judicial cooperation with the Union or with one or more Member States, provided that such a third country or international organisation provides adequate safeguards with respect to the protection of fundamental rights and freedoms of individuals.
  action: exclude qualifying third-country public authorities and international organisations using AI systems under law-enforcement or judicial-cooperation arrangements with adequate fundamental-rights safeguards
  subject_ref: third_country_public_authority_or_international_organisation
  subject_category: other
  kind: applicability
  conditions:
  - the public authority is in a third country or the subject is an international organisation otherwise falling within Article 2(1)
  - the AI system is used under international cooperation or an agreement for law-enforcement and judicial cooperation
  - the cooperation or agreement is with the Union or one or more Member States
  - the third country or international organisation provides adequate safeguards for individual fundamental rights and freedoms
- norm_id: AIA-NORM-A002-P5-INTERMEDIARY-LIABILITY-SAVING
  source: A002-P014
  quote: This Regulation shall not affect the application of the provisions on the liability of providers of intermediary services as set out in Chapter II of Regulation (EU) 2022/2065.
  action: preserve the application of intermediary-service provider liability rules under Chapter II of Regulation (EU) 2022/2065
  subject_ref: intermediary_service_provider
  subject_category: external_private_party
  kind: applicability
  dependencies:
  - dependency_ref: Regulation (EU) 2022/2065, Chapter II
    resolution: external_recorded
    detail: The preserved intermediary-service liability rules are outside the enacted corpus.
  product_scope: no_product_action
  product_scope_reason: This saving clause preserves another legal regime without creating an independent product-facing classification or action.
  implementation_mode: none_required
  implementation_reason: The product does not adjudicate intermediary-service liability under Regulation (EU) 2022/2065.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A002-P6-SCIENTIFIC-RD-EXCLUSION
  source: A002-P015
  quote: This Regulation does not apply to AI systems or AI models, including their output, specifically developed and put into service for the sole purpose of scientific research and development.
  action: exclude AI systems and AI models, including their output, specifically developed and put into service solely for scientific research and development
  subject_ref: scientific_research_and_development_ai_system_or_model
  subject_category: other
  kind: applicability
  conditions:
  - the AI system or AI model, including its output, is specifically developed for scientific research and development
  - it is put into service solely for scientific research and development
- norm_id: AIA-NORM-A002-P7-DATA-PROTECTION-APPLICATION
  source: A002-P016
  quote: Union law on the protection of personal data, privacy and the confidentiality of communications applies to personal data processed in connection with the rights and obligations laid down in this Regulation.
  action: preserve the application of Union data-protection, privacy, and communications-confidentiality law to personal data processed under the Regulation
  subject_ref: personal_data_processing_under_the_regulation
  subject_category: other
  kind: applicability
  dependencies:
