  source: A024-P003
  quote: Distributors shall ensure that, while a high-risk AI system is under their responsibility, storage or transport conditions, where applicable, do not jeopardise the compliance of the system with the requirements set out in Section 2.
  action: ensure applicable storage and transport conditions do not jeopardise Section 2 compliance while the system is under the distributor's responsibility
  subject_ref: distributor
  subject_category: supported_operator
  implementation_refs: *article_24_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A024-P4-CORRECTIVE-RESPONSE
  source: A024-P004
  quote: shall take the corrective actions necessary to bring that system into conformity with those requirements, to withdraw it or recall it, or shall ensure that the provider, the importer or any relevant operator, as appropriate, takes those corrective actions
  action: take the necessary conformity, withdrawal, or recall action, or ensure an appropriate relevant operator takes it
  subject_ref: distributor
  subject_category: supported_operator
  conditions:
  - the distributor considers or has reason to consider from its information that a system it made available is not Section 2 compliant
  implementation_refs: *article_24_implementation
  verification_mode: listed_for_confirmation
