  quote: ‘provider’ means a natural or legal person, public authority, agency or other body that develops an AI system or
    a general-purpose AI model or that has an AI system or a general-purpose AI model developed and places it on the market
    or puts the AI system into service under its own name or trademark, whether for payment or free of charge
  action: define provider for the purposes of the Regulation
  subject_ref: provider
  subject_category: other
  kind: definition
  qualifier_spans:
  - A003-P001
  product_scope: dependency_only
  product_scope_reason: This definition constrains downstream classification and norm interpretation but creates no independent
    product-facing action.
