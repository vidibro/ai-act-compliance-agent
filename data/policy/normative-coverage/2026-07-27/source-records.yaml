  source: A026-P10
  quote: This subparagraph shall be without prejudice to the powers conferred by Directive (EU) 2016/680 on supervisory authorities.
  action: preserve supervisory-authority powers under Directive (EU) 2016/680
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  kind: applicability
