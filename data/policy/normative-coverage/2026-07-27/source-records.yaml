- norm_id: AIA-NORM-A005-P2-REGISTER-SYSTEM
  source: A005-P027
  quote: The use of the ‘ real-time ’ remote biometric identification system in publicly accessible spaces shall be authorised only if the law enforcement authority has completed a fundamental rights impact assessment as provided for in Article 27 and has registered the system in the EU database according to Article 49.
  action: register the real-time remote biometric identification system in the EU database before authorisation, or without undue delay after urgent use begins
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: obligation
  exceptions:
  - in a duly justified urgent case, use may begin before registration
  conditions:
  - when urgent use begins before registration, complete registration without undue delay
  dependencies:
  - dependency_ref: Article 49 of this Regulation
    resolution: unresolved
    detail: Article 49 defines the EU-database registration and has not yet been semantically reviewed.
- norm_id: AIA-NORM-A005-P3-PRIOR-AUTHORISATION
  source: A005-P028
  quote: each use for the purposes of law enforcement of a ‘ real-time ’ remote biometric identification system in publicly accessible spaces shall be subject to a prior authorisation granted by a judicial authority or an independent administrative authority whose decision is binding of the Member State in which the use is to take place, issued upon a reasoned request and in accordance with the detailed rules of national law referred to in paragraph 5.
  action: obtain prior judicial or binding independent-administrative authorisation, upon a reasoned request and under applicable national rules, for each covered use
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: obligation
  dependencies:
  - dependency_ref: national law referred to in Article 5(5) of this Regulation
    resolution: national_or_factual
    detail: National law supplies the detailed rules for requesting and granting authorisation.
- norm_id: AIA-NORM-A005-P3-URGENT-USE
  source: A005-P028
  quote: in a duly justified situation of urgency, the use of such system may be commenced without an authorisation provided that such authorisation is requested without undue delay, at the latest within 24 hours.
  action: commence urgent use without prior authorisation
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: permission
  conditions:
  - the situation of urgency is duly justified
  - request authorisation without undue delay and no later than 24 hours after use commences
- norm_id: AIA-NORM-A005-P3-STOP-ON-REJECTION
  source: A005-P028
  quote: If such authorisation is rejected, the use shall be stopped with immediate effect
  action: stop the use immediately if authorisation is rejected
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: obligation
  conditions:
  - the requested authorisation is rejected
- norm_id: AIA-NORM-A005-P3-DELETE-ON-REJECTION
  source: A005-P028
  quote: all the data, as well as the results and outputs of that use shall be immediately discarded and deleted.
  action: immediately discard and delete all data, results, and outputs from the use if authorisation is rejected
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: obligation
  conditions:
  - the requested authorisation is rejected
- norm_id: AIA-NORM-A005-P3-RESTRICT-AUTHORISATION
  source: A005-P029
  quote: The competent judicial authority or an independent administrative authority whose decision is binding shall grant the authorisation only where it is satisfied, on the basis of objective evidence or clear indications presented to it, that the use of the ‘ real-time ’ remote biometric identification system concerned is necessary for, and proportionate to, achieving one of the objectives specified in paragraph 1, first subparagraph, point (h), as identified in the request and, in particular, remains limited to what is strictly necessary concerning the period of time as well as the geographic and personal scope.
  action: grant authorisation only on objective evidence or clear indications that the requested use is necessary, proportionate, and strictly limited in time and geographic and personal scope
  subject_ref: authorising_authority
  subject_category: public_authority
  kind: power
  conditions:
  - the use pursues an Article 5(1)(h) objective identified in the request
  - objective evidence or clear indications establish necessity and proportionality
  - the time period and geographic and personal scope are limited to what is strictly necessary
  dependencies:
  - dependency_ref: AIA-NORM-A005-P1-H-REAL-TIME-RBI
    resolution: internal_resolved
    detail: Article 5(1)(h) supplies the permitted law-enforcement objectives.
- norm_id: AIA-NORM-A005-P3-CONSIDER-P2-ELEMENTS
  source: A005-P029
  quote: In deciding on the request, that authority shall take into account the elements referred to in paragraph 2.
  action: take the Article 5(2) elements into account when deciding an authorisation request
  subject_ref: authorising_authority
  subject_category: public_authority
  kind: obligation
  dependencies:
  - dependency_ref: AIA-NORM-A005-P2-CONSIDER-IMPACTS
    resolution: internal_resolved
    detail: The referenced norm records the non-use harm and rights-and-freedoms consequences that must be considered.
- norm_id: AIA-NORM-A005-P3-NO-SOLE-OUTPUT-ADVERSE-DECISION
  source: A005-P029
  quote: No decision that produces an adverse legal effect on a person may be taken based solely on the output of the ‘ real-time ’ remote biometric identification system.
  action: prohibit decisions producing an adverse legal effect on a person based solely on real-time remote biometric identification output
  subject_ref: decision_maker
  subject_category: public_authority
  kind: prohibition
- norm_id: AIA-NORM-A005-P4-NOTIFY-AUTHORITIES
  source: A005-P030
  quote: each use of a ‘ real-time ’ remote biometric identification system in publicly accessible spaces for law enforcement purposes shall be notified to the relevant market surveillance authority and the national data protection authority in accordance with the national rules referred to in paragraph 5.
  action: notify the relevant market-surveillance authority and national data-protection authority of each covered use in accordance with applicable national rules
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: obligation
  dependencies:
  - dependency_ref: national rules referred to in Article 5(5) of this Regulation
    resolution: national_or_factual
    detail: National law supplies the detailed notification rules.
- norm_id: AIA-NORM-A005-P4-NOTIFICATION-CONTENT
  source: A005-P030
  quote: The notification shall, as a minimum, contain the information specified under paragraph 6
  action: include at least the information specified in Article 5(6) in each use notification
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: obligation
  dependencies:
  - dependency_ref: Article 5(6) of this Regulation
    resolution: unresolved
    detail: Article 5(6) supplies the minimum notification information and has not yet been semantically reviewed.
- norm_id: AIA-NORM-A005-P4-EXCLUDE-SENSITIVE-DATA
  source: A005-P030
  quote: shall not include sensitive operational data.
  action: exclude sensitive operational data from each use notification
  subject_ref: law_enforcement_authority
  subject_category: public_authority
  kind: prohibition
- norm_id: AIA-NORM-A005-P5-AUTHORISE-USE
  source: A005-P031
  quote: A Member State may decide to provide for the possibility to fully or partially authorise the use of ‘ real-time ’ remote biometric identification systems in publicly accessible spaces for the purposes of law enforcement within the limits and under the conditions listed in paragraph 1, first subparagraph, point (h), and paragraphs 2 and 3.
  action: provide for full or partial authorisation of covered real-time remote biometric identification use within the limits and conditions of Article 5(1)(h), (2), and (3)
  subject_ref: member_state
  subject_category: member_state
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for Member States, although their national rules determine whether covered use is permitted.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P5-LAY-DOWN-RULES
  source: A005-P031
  quote: Member States concerned shall lay down in their national law the necessary detailed rules for the request, issuance and exercise of, as well as supervision and reporting relating to, the authorisations referred to in paragraph 3.
  action: lay down national rules for the request, issuance, exercise, supervision, and reporting of Article 5(3) authorisations
  subject_ref: member_state
  subject_category: member_state
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for Member States, although their national rules govern covered use.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P5-SPECIFY-OBJECTIVES
  source: A005-P031
  quote: Those rules shall also specify in respect of which of the objectives listed in paragraph 1, first subparagraph, point (h), including which of the criminal offences referred to in point (h)(iii) thereof, the competent authorities may be authorised to use those systems for the purposes of law enforcement.
  action: specify in national rules the objectives and qualifying criminal offences for which competent authorities may receive authorisation
  subject_ref: member_state
  subject_category: member_state
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for Member States, although the specified objectives constrain covered use.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P5-NOTIFY-COMMISSION
  source: A005-P031
  quote: Member States shall notify those rules to the Commission at the latest 30 days following the adoption thereof.
  action: notify the Commission of the national rules no later than 30 days after their adoption
  subject_ref: member_state
  subject_category: member_state
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for Member States.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P5-MORE-RESTRICTIVE-LAWS
  source: A005-P031
  quote: Member States may introduce, in accordance with Union law, more restrictive laws on the use of remote biometric identification systems.
  action: introduce more restrictive laws on remote biometric identification use in accordance with Union law
  subject_ref: member_state
  subject_category: member_state
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for Member States, although stricter national law can constrain covered use.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P6-SUBMIT-ANNUAL-REPORTS
  source: A005-P032
  quote: National market surveillance authorities and the national data protection authorities of Member States that have been notified of the use of ‘ real-time ’ remote biometric identification systems in publicly accessible spaces for law enforcement purposes pursuant to paragraph 4 shall submit to the Commission annual reports on such use.
  action: submit annual reports to the Commission on notified real-time remote biometric identification use
  subject_ref: national_market_surveillance_and_data_protection_authorities
  subject_category: public_authority
  kind: obligation
  conditions:
  - the authority has been notified of covered use pursuant to Article 5(4)
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for national supervisory authorities.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P6-PROVIDE-TEMPLATE
  source: A005-P032
  quote: the Commission shall provide Member States and national market surveillance and data protection authorities with a template
  action: provide Member States and national market-surveillance and data-protection authorities with an annual-reporting template
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P6-TEMPLATE-CONTENT
  source: A005-P032
  quote: including information on the number of the decisions taken by competent judicial authorities or an independent administrative authority whose decision is binding upon requests for authorisations in accordance with paragraph 3 and their result.
  action: include in the reporting template the number and outcomes of decisions on Article 5(3) authorisation requests
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P7-PUBLISH-ANNUAL-REPORTS
  source: A005-P033
  quote: The Commission shall publish annual reports on the use of real-time remote biometric identification systems in publicly accessible spaces for law enforcement purposes, based on aggregated data in Member States on the basis of the annual reports referred to in paragraph 6.
  action: publish annual reports on covered real-time remote biometric identification use using aggregated Member State data from Article 5(6) reports
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P7-EXCLUDE-SENSITIVE-DATA
  source: A005-P033
  quote: Those annual reports shall not include sensitive operational data of the related law enforcement activities.
  action: exclude sensitive operational data about related law-enforcement activities from the Commission's annual reports
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: prohibition
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P8-OTHER-UNION-LAW
  source: A005-P034
  quote: This Article shall not affect the prohibitions that apply where an AI practice infringes other Union law.
  action: preserve prohibitions under other Union law where an AI practice infringes that law
  subject_ref: ai_practice_subject_to_other_union_law
  subject_category: other
  kind: legal_consequence
  dependencies:
  - dependency_ref: applicable prohibitions under other Union law
    resolution: external_recorded
    detail: The saving clause preserves prohibitions arising under other Union law.
  product_scope: dependency_only
  product_scope_reason: This saving clause constrains legal interpretation without creating an independent AI Act product action.
  implementation_mode: none_required
  implementation_reason: The preserved external prohibitions are represented as legal dependencies rather than standalone product rules.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A006-P1-ANNEX-I-HIGH-RISK
  source: A006-P001
  quote: that AI system shall be considered to be high-risk where both of the following conditions are fulfilled
  action: classify an AI system as high-risk when both the Annex I product or safety-component condition and the third-party conformity-assessment condition are fulfilled
  subject_ref: ai_system
  subject_category: other
  kind: applicability
  qualifier_spans:
  - A006-P002
  - A006-P003
  conditions:
  - the AI system is intended as a safety component of a product, or is itself a product, covered by Union harmonisation legislation listed in Annex I
  - the relevant product is required to undergo third-party conformity assessment for market placement or putting into service under that Annex I legislation
  dependencies:
  - dependency_ref: AIA-NORM-A003-D014-SAFETY-COMPONENT
    resolution: internal_resolved
    detail: Article 3(14) defines safety component.
  - dependency_ref: Annex I of this Regulation and the Union harmonisation legislation listed there
    resolution: unresolved
    detail: Annex I and the referenced legislation determine the covered products and conformity-assessment requirements.
- norm_id: AIA-NORM-A006-P1A-NON-SAFETY-ASSISTANCE
  source: A006-P004
  quote: AI systems that are solely used for non-safety related aspects of user assistance, performance optimisation, service efficiency, automation or convenience or quality control shall not qualify as safety components.
  action: exclude AI systems used solely for the listed non-safety functions from qualification as safety components
  subject_ref: ai_system
  subject_category: other
  kind: applicability
  conditions:
  - the system is used solely for non-safety aspects of user assistance, performance optimisation, service efficiency, automation, convenience, or quality control
  dependencies:
  - dependency_ref: AIA-NORM-A003-D014-SAFETY-COMPONENT
    resolution: internal_resolved
    detail: Article 3(14) defines safety component.
- norm_id: AIA-NORM-A006-P1B-HEALTH-SAFETY-OVERRIDE
  source: A006-P005
  quote: AI systems the failure or malfunctioning of which would endanger health and safety shall qualify as safety components.
  action: classify an AI system as a safety component when its failure or malfunction would endanger health and safety
  subject_ref: ai_system
  subject_category: other
  kind: applicability
  conditions:
  - failure or malfunction of the AI system would endanger health and safety
  dependencies:
  - dependency_ref: AIA-NORM-A003-D014-SAFETY-COMPONENT
    resolution: internal_resolved
    detail: Article 3(14) defines safety component.
- norm_id: AIA-NORM-A006-P1C-NON-SAFETY-ASSESSMENT
  source: A006-P006
  quote: A product that is required to undergo a third-party conformity assessment solely due to risks other than risks to health and safety, in particular risks relating to the distribution of radio spectrum or electromagnetic interference that do not affect health and safety, shall not be considered as fulfilling the condition in paragraph 1, point (b).
  action: exclude a third-party conformity assessment required solely for non-health-and-safety risks from satisfying Article 6(1)(b)
  subject_ref: ai_system_or_product
  subject_category: other
  kind: applicability
  conditions:
  - third-party conformity assessment is required solely because of risks unrelated to health and safety
- norm_id: AIA-NORM-A006-P2-ANNEX-III-HIGH-RISK
  source: A006-P007
  quote: AI systems referred to in Annex III shall be considered to be high-risk.
  action: classify AI systems referred to in Annex III as high-risk
  subject_ref: annex_iii_ai_system
  subject_category: other
  kind: applicability
  dependencies:
  - dependency_ref: Annex III of this Regulation
    resolution: unresolved
    detail: Annex III supplies the high-risk use-case areas and has not yet been semantically reviewed.
- norm_id: AIA-NORM-A006-P3-INSIGNIFICANT-RISK-EXCEPTION
  source: A006-P008
  quote: an AI system referred to in Annex III shall not be considered to be high-risk where it does not pose a significant risk of harm to the health, safety or fundamental rights of natural persons, including by not materially influencing the outcome of decision making.
  action: exclude an Annex III AI system from high-risk classification when it poses no significant harm risk and satisfies at least one listed condition
  subject_ref: annex_iii_ai_system
  subject_category: other
  kind: applicability
  qualifier_spans:
  - A006-P009
  - A006-P010
  - A006-P011
  - A006-P012
  - A006-P013
  conditions:
  - the system does not pose a significant risk of harm to natural persons' health, safety, or fundamental rights, including by not materially influencing decision-making outcomes
  - the system performs a narrow procedural task, improves a completed human activity, detects decision patterns without improperly replacing or influencing the completed human assessment, or performs a preparatory task for an Annex III assessment
  dependencies:
  - dependency_ref: AIA-NORM-A006-P2-ANNEX-III-HIGH-RISK
    resolution: internal_resolved
    detail: This norm derogates from the Annex III high-risk classification.
- norm_id: AIA-NORM-A006-P3-PROFILING-OVERRIDE
  source: A006-P014
  quote: an AI system referred to in Annex III shall always be considered to be high-risk where the AI system performs profiling of natural persons.
  action: classify an Annex III AI system as high-risk whenever it profiles natural persons
  subject_ref: annex_iii_ai_system
  subject_category: other
  kind: applicability
  conditions:
  - the AI system performs profiling of natural persons
  dependencies:
  - dependency_ref: AIA-NORM-A003-D052-PROFILING
    resolution: internal_resolved
    detail: Article 3(52) defines profiling.
  - dependency_ref: AIA-NORM-A006-P3-INSIGNIFICANT-RISK-EXCEPTION
    resolution: internal_resolved
    detail: Profiling overrides the Article 6(3) insignificant-risk exception.
- norm_id: AIA-NORM-A006-P4-DOCUMENT-ASSESSMENT
  source: A006-P015
  quote: A provider who considers that an AI system referred to in Annex III is not high-risk shall document its assessment before that system is placed on the market or put into service.
  action: document the Article 6(3) non-high-risk assessment before placing the system on the market or putting it into service
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  conditions:
  - the provider considers an Annex III AI system not to be high-risk under Article 6(3)
  dependencies:
  - dependency_ref: AIA-NORM-A006-P3-INSIGNIFICANT-RISK-EXCEPTION
    resolution: internal_resolved
    detail: Article 6(3) supplies the substantive basis for the assessment.
- norm_id: AIA-NORM-A006-P4-REGISTER-SYSTEM
  source: A006-P015
  quote: Such provider shall be subject to the registration obligation set out in Article 49(2).
  action: register the provider and non-high-risk system as required by Article 49(2)
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  conditions:
  - the provider concludes that an Annex III AI system is not high-risk under Article 6(3)
  dependencies:
  - dependency_ref: Article 49(2) of this Regulation
    resolution: unresolved
    detail: Article 49(2) supplies the detailed registration obligation and has not yet been semantically reviewed.
- norm_id: AIA-NORM-A006-P4-PROVIDE-ASSESSMENT
  source: A006-P015
  quote: Upon request of national competent authorities, the provider shall provide the documentation of the assessment.
  action: provide the documented non-high-risk assessment to national competent authorities upon request
  subject_ref: provider
  subject_category: supported_operator
  kind: obligation
  conditions:
  - a national competent authority requests the documentation
- norm_id: AIA-NORM-A006-P5-PROVIDE-GUIDELINES
  source: A006-P016
  quote: The Commission shall, after consulting the European Artificial Intelligence Board (the ‘ Board ’), and no later than 2 February 2026, provide guidelines specifying the practical implementation of this Article in line with Article 96
  action: provide Article 96 guidelines on the practical implementation of Article 6 by 2 February 2026 after consulting the AI Board
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: obligation
  product_scope: outside_supported_actor
