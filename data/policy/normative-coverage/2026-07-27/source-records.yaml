- norm_id: AIA-NORM-A005-P1-E-UNTARGETED-FACIAL-SCRAPING
  source: A005-P010
  quote: the placing on the market, the putting into service for this specific purpose, or the use of AI systems that create or expand facial recognition databases through the untargeted scraping of facial images from the internet or CCTV footage
  action: prohibit placing on the market, putting into service for the purpose, or using AI systems that create or expand facial-recognition databases through untargeted scraping from the internet or CCTV
  subject_ref: operator
  subject_category: supported_operator
  kind: prohibition
  qualifier_spans:
  - A005-P001
- norm_id: AIA-NORM-A005-P1-F-WORKPLACE-EDUCATION-EMOTION-INFERENCE
  source: A005-P011
