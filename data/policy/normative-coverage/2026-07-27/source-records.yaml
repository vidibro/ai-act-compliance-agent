  source: A023-P005
  quote: the provider has appointed an authorised representative in accordance with Article 22(1)
  action: verify that the provider appointed an authorised representative under Article 22(1) before the system is placed on the market
  subject_ref: importer
  subject_category: supported_operator
  conditions: *article_23_pre_market_condition
