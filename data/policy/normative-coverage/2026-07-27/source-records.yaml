- norm_id: AIA-NORM-A002-P12-OPEN-SOURCE-AI-SYSTEM-EXCLUSION
  source: A002-P021
  quote: This Regulation does not apply to AI systems released under free and open-source licences, unless they are placed on the market or put into service as high-risk AI systems or as an AI system that falls under Article 5 or 50.
  action: exclude AI systems released under free and open-source licences unless a listed regulated-use exception applies
  subject_ref: free_and_open_source_ai_system
  subject_category: other
  kind: applicability
  conditions:
  - the AI system is released under a free and open-source licence
  exceptions:
  - the system is placed on the market or put into service as a high-risk AI system
  - the system falls under Article 5
  - the system falls under Article 50
  dependencies:
  - dependency_ref: Article 5 of this Regulation
    resolution: unresolved
    detail: Article 5 determines one exception to the exclusion and has not yet been semantically reviewed in this inventory.
  - dependency_ref: Article 50 of this Regulation
    resolution: unresolved
    detail: Article 50 determines one exception but has not yet been completely semantically reviewed.
- norm_id: AIA-NORM-A002-P13-LIMIT-HIGH-RISK-REQUIREMENTS
  source: A002-P022
  quote: For high-risk AI systems referred to in Article 6(1), the application of specific requirements or obligations laid down in Articles 9 to 15 and 17 to 25 may be limited, where and to the extent that
  action: limit specific Article 9 to 15 and 17 to 25 requirements for Article 6(1) high-risk AI systems when both protective conditions are satisfied
  subject_ref: article_6_1_high_risk_ai_system
  subject_category: other
  kind: permission
  qualifier_spans:
  - A002-P023
  - A002-P024
  conditions:
  - Union harmonisation legislation listed in Annex I Section A provides an equivalent or higher level of health, safety, or fundamental-rights protection for the requirement concerned
  - the limitation does not reduce the overall level of protection provided by the Regulation
  dependencies:
  - dependency_ref: Article 6(1), Articles 9 to 15 and 17 to 25, and Annex I Section A of this Regulation
    resolution: unresolved
    detail: These provisions define the affected systems, limitable requirements, and relevant harmonisation legislation and are not all semantically reviewed yet.
