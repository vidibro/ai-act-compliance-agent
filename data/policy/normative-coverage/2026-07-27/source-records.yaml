  source: A003-P006
  quote: ‘authorised representative’ means a natural or legal person located or established in the Union who has received
    and accepted a written mandate from a provider of an AI system or a general-purpose AI model to, respectively, perform
    and carry out on its behalf the obligations and procedures established by this Regulation
  action: define authorised representative for the purposes of the Regulation
  subject_ref: authorised_representative
  subject_category: other
  kind: definition
  qualifier_spans:
