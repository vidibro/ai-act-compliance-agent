- norm_id: AIA-NORM-A007-P2-CONSIDER-RISK-CRITERIA
  source: A007-P004
  quote: the Commission shall take into account the following criteria
  action: take every Article 7(2) criterion into account when assessing whether an Annex III amendment meets Article 7(1)(b)
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: obligation
  qualifier_spans:
  - A007-P005
  - A007-P006
  - A007-P007
  - A007-P008
  - A007-P009
  - A007-P010
  - A007-P011
  - A007-P012
  - A007-P013
  - A007-P014
  - A007-P015
  - A007-P016
  - A007-P017
  conditions:
  - consider the system's intended purpose
  - consider actual and likely extent of use
  - consider the nature and amount of processed data, especially special-category personal data
  - consider system autonomy and the possibility of human override
  - consider demonstrated harm, adverse impact, and significant documented concerns
  - consider potential harm intensity, scale, and disproportionate group effects
  - consider affected persons' dependency on outcomes and practical or legal ability to opt out
  - consider power imbalances and vulnerability relative to the deployer
  - consider whether outcomes are technically corrigible or reversible
  - consider the magnitude and likelihood of benefits, including product-safety improvements
  - consider effective non-damages redress and measures under Union law that prevent or substantially minimise risk
