  quote: the provider has drawn up the technical documentation in accordance with Article 11 and Annex IV
  action: verify that the provider drew up technical documentation compliant with Article 11 and Annex IV before the system is placed on the market
  subject_ref: importer
  subject_category: supported_operator
  conditions: *article_23_pre_market_condition
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
  qualifier_spans: *article_23_p1_qualifier
