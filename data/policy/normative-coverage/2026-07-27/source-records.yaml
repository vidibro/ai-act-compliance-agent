  source: A003-P003
  quote: ‘risk’ means the combination of the probability of an occurrence of harm and the severity of that harm
  action: define risk for the purposes of the Regulation
  subject_ref: risk
  subject_category: other
  kind: definition
  qualifier_spans:
  - A003-P001
  product_scope: dependency_only
