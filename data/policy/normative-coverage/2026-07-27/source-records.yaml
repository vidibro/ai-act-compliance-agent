- norm_id: AIA-NORM-A002-P4-INTERNATIONAL-COOPERATION-EXCLUSION
  source: A002-P013
  quote: This Regulation applies neither to public authorities in a third country nor to international organisations falling within the scope of this Regulation pursuant to paragraph 1, where those authorities or organisations use AI systems in the framework of international cooperation or agreements for law enforcement and judicial cooperation with the Union or with one or more Member States, provided that such a third country or international organisation provides adequate safeguards with respect to the protection of fundamental rights and freedoms of individuals.
  action: exclude qualifying third-country public authorities and international organisations using AI systems under law-enforcement or judicial-cooperation arrangements with adequate fundamental-rights safeguards
  subject_ref: third_country_public_authority_or_international_organisation
  subject_category: other
  kind: applicability
  conditions:
  - the public authority is in a third country or the subject is an international organisation otherwise falling within Article 2(1)
  - the AI system is used under international cooperation or an agreement for law-enforcement and judicial cooperation
  - the cooperation or agreement is with the Union or one or more Member States
  - the third country or international organisation provides adequate safeguards for individual fundamental rights and freedoms
