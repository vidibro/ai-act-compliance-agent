  source: A024-P002
  quote: where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor shall inform the provider or the importer of the system, as applicable, to that effect
  action: inform the provider or importer, as applicable, that the system presents an Article 79(1) risk
  subject_ref: distributor
  subject_category: supported_operator
