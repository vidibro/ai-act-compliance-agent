  source: A006-P016
  quote: together with a comprehensive list of practical examples of use cases of AI systems that are high-risk and not high-risk.
  action: provide a comprehensive list of practical high-risk and non-high-risk AI-system use cases with the Article 6 guidelines
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: obligation
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
