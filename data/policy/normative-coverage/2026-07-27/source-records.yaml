  source: A003-P007
  quote: ‘importer’ means a natural or legal person located or established in the Union that places on the market an AI system
    that bears the name or trademark of a natural or legal person established in a third country
  action: define importer for the purposes of the Regulation
  subject_ref: importer
  subject_category: other
