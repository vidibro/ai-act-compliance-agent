- norm_id: AIA-NORM-A023-P2-WITHHOLD-NONCONFORMING-SYSTEM
  source: A023-P006
  quote: Where an importer has sufficient reason to consider that a high-risk AI system is not in conformity with this Regulation, or is falsified, or accompanied by falsified documentation, it shall not place the system on the market until it has been brought into conformity.
  action: withhold a suspected non-conforming or falsified system from the market until it has been brought into conformity
  subject_ref: importer
  subject_category: supported_operator
  conditions:
  - the importer has sufficient reason to consider the system non-conforming or falsified, or its documentation falsified
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A023-P2-INFORM-RISK
  source: A023-P006
  quote: Where the high-risk AI system presents a risk within the meaning of Article 79(1), the importer shall inform the provider of the system, the authorised representative and the market surveillance authorities to that effect.
  action: inform the provider, authorised representative, and market-surveillance authorities that the system presents an Article 79(1) risk
  subject_ref: importer
  subject_category: supported_operator
  conditions:
  - the high-risk AI system presents a risk within the meaning of Article 79(1)
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
  mandatory_content:
  - provider notification
  - authorised-representative notification
  - market-surveillance-authority notification
  dependencies:
  - dependency_ref: Article 79(1) of this Regulation
    resolution: unresolved
    detail: Article 79(1) defines the referenced risk situation and has not yet been semantically reviewed.
- norm_id: AIA-NORM-A023-P3-IDENTIFY-IMPORTER
  source: A023-P007
  quote: Importers shall indicate their name, registered trade name or registered trade mark, and the address at which they can be contacted on the high-risk AI system and on its packaging or its accompanying documentation, where applicable.
  action: display the importer's required identity and contact address on the system and, where applicable, its packaging or accompanying documentation
  subject_ref: importer
  subject_category: supported_operator
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
  mandatory_content:
  - importer name and registered trade name or trade mark
  - importer contact address
- norm_id: AIA-NORM-A023-P4-PRESERVE-COMPLIANCE
  source: A023-P008
  quote: Importers shall ensure that, while a high-risk AI system is under their responsibility, storage or transport conditions, where applicable, do not jeopardise its compliance with the requirements set out in Section 2.
  action: ensure applicable storage and transport conditions do not jeopardise Section 2 compliance while the system is under the importer's responsibility
  subject_ref: importer
  subject_category: supported_operator
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A023-P5-KEEP-DOCUMENTS
  source: A023-P009
  quote: Importers shall keep, for a period of 10 years after the high-risk AI system has been placed on the market or put into service, a copy of the certificate issued by the notified body, where applicable, of the instructions for use, and of the EU declaration of conformity referred to in Article 47.
  action: keep the applicable certificate, instructions, and EU declaration for 10 years after market placement or putting into service
  subject_ref: importer
  subject_category: supported_operator
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
  mandatory_content:
  - notified-body certificate where applicable
  - instructions for use
  - EU declaration of conformity
- norm_id: AIA-NORM-A023-P6-PROVIDE-CONFORMITY-INFORMATION
  source: A023-P010
  quote: Importers shall provide the relevant competent authorities, upon a reasoned request, with all the necessary information and documentation, including that referred to in paragraph 5, to demonstrate the conformity of a high-risk AI system with the requirements set out in Section 2 in a language which can be easily understood by them.
  action: provide requesting competent authorities with all information and documentation necessary to demonstrate Section 2 conformity
  subject_ref: importer
  subject_category: supported_operator
  conditions: &article_23_reasoned_request
  - a relevant competent authority makes a reasoned request
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A023-P6-AUTHORITY-LANGUAGE
  source: A023-P010
  quote: Importers shall provide the relevant competent authorities, upon a reasoned request, with all the necessary information and documentation, including that referred to in paragraph 5, to demonstrate the conformity of a high-risk AI system with the requirements set out in Section 2 in a language which can be easily understood by them.
  action: provide the requested conformity material in a language easily understood by the relevant authorities
  subject_ref: importer
  subject_category: supported_operator
  conditions: *article_23_reasoned_request
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A023-P6-TECHNICAL-DOCUMENTATION-AVAILABLE
  source: A023-P010
  quote: For this purpose, they shall also ensure that the technical documentation can be made available to those authorities.
  action: ensure the technical documentation can be made available to the requesting authorities
  subject_ref: importer
  subject_category: supported_operator
  conditions: *article_23_reasoned_request
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A023-P7-COOPERATE
  source: A023-P011
  quote: Importers shall cooperate with the relevant competent authorities in any action those authorities take in relation to a high-risk AI system placed on the market by the importers, in particular to reduce and mitigate the risks posed by it.
  action: cooperate in competent-authority actions concerning systems the importer placed on the market, particularly risk reduction and mitigation
  subject_ref: importer
  subject_category: supported_operator
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A024-P1-VERIFY-CE-MARKING
  source: A024-P001
  quote: Before making a high-risk AI system available on the market, distributors shall verify that it bears the required CE marking
  action: verify the required CE marking before making a high-risk AI system available on the market
  subject_ref: distributor
  subject_category: supported_operator
  conditions: &article_24_pre_market_condition
  - before making the high-risk AI system available on the market
  implementation_refs: &article_24_implementation
  - AIA-DI-A24
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A024-P1-VERIFY-ACCOMPANYING-DOCUMENTS
  source: A024-P001
  quote: that it is accompanied by a copy of the EU declaration of conformity referred to in Article 47 and instructions for use
  action: verify that the system is accompanied by its EU declaration of conformity and instructions for use
  subject_ref: distributor
  subject_category: supported_operator
  conditions: *article_24_pre_market_condition
  implementation_refs: *article_24_implementation
  verification_mode: listed_for_confirmation
  mandatory_content:
  - EU declaration of conformity
  - instructions for use
- norm_id: AIA-NORM-A024-P1-VERIFY-OPERATOR-COMPLIANCE
  source: A024-P001
  quote: that the provider and the importer of that system, as applicable, have complied with their respective obligations as laid down in Article 16, points (b) and (c) and Article 23(3)
  action: verify applicable provider and importer compliance with the three specified identification and quality-management duties
  subject_ref: distributor
  subject_category: supported_operator
  conditions: *article_24_pre_market_condition
  implementation_refs: *article_24_implementation
  verification_mode: listed_for_confirmation
  mandatory_content:
  - provider identification under Article 16(b)
  - provider quality-management system under Article 16(c)
  - importer identification under Article 23(3)
  dependencies:
