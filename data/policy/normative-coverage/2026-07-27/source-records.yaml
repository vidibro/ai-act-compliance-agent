  source: A026-P10
  quote: excluding the disclosure of sensitive operational data related to law enforcement
  action: exclude sensitive law-enforcement operational data from the annual reports
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  kind: applicability
  implementation_refs: *article_26_p10_implementation
  verification_mode: reported_conditionally
- norm_id: AIA-NORM-A026-P10-AGGREGATE-REPORTS
  source: A026-P10
  quote: The reports may be aggregated to cover more than one deployment.
  action: aggregate annual reports across multiple deployments
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  kind: permission
  implementation_refs: *article_26_p10_implementation
  verification_mode: reported_conditionally
