- norm_id: AIA-NORM-A004-P1-AI-LITERACY-MEASURES
  source: A004-P001
  quote: Providers and deployers of AI systems shall take measures to support the development of AI literacy of their staff and other persons dealing with the operation and use of AI systems on their behalf, taking into account their technical knowledge, experience, education and training and the context the AI systems are to be used in, and considering the persons or groups of persons on whom the AI systems are to be used. This obligation does not require providers or deployers to guarantee any specific level of AI literacy of any individual.
  action: take context-sensitive measures supporting AI literacy among staff and other persons operating or using AI systems on the provider's or deployer's behalf
  subject_ref: provider_or_deployer
  subject_category: supported_operator
  kind: obligation
  conditions:
  - account for the covered persons' technical knowledge, experience, education, and training
  - account for the context in which the AI systems are to be used
  - consider the persons or groups on whom the AI systems are to be used
  exceptions:
  - the obligation does not require a guaranteed specific AI-literacy level for any particular individual among the covered staff or other persons
- norm_id: AIA-NORM-A004-P2-SUPPORT-PROVIDERS-DEPLOYERS
  source: A004-P002
  quote: The Commission and the Member States shall support and facilitate the efforts of providers and deployers of AI systems, in particular SMEs, in fulfilling their obligation under paragraph 1 of this Article.
  action: support and facilitate provider and deployer efforts, particularly those of SMEs, to fulfil the Article 4(1) AI-literacy obligation
  subject_ref: commission_and_member_states
  subject_category: other
  kind: obligation
  dependencies:
  - dependency_ref: AIA-NORM-A004-P1-AI-LITERACY-MEASURES
    resolution: internal_resolved
    detail: The supported efforts concern fulfilment of the Article 4(1) obligation.
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission or Member States.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A004-P2-PUBLISH-PRACTICAL-EXAMPLES
  source: A004-P002
  quote: the Commission shall publish practical examples of how to comply with that obligation on the single information platform referred to in Article 62(3), point (b)
  action: publish practical examples of compliance with the Article 4(1) obligation on the single information platform
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: obligation
  dependencies:
  - dependency_ref: AIA-NORM-A004-P1-AI-LITERACY-MEASURES
    resolution: internal_resolved
    detail: The examples concern compliance with the Article 4(1) obligation.
  - dependency_ref: Article 62(3), point (b), of this Regulation
    resolution: unresolved
    detail: The referenced single information platform provision has not yet been semantically reviewed.
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Commission.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A004-P3-BOARD-RECOMMENDATIONS
  source: A004-P003
  quote: The Board shall adopt recommendations, taking into account European competence frameworks, to support the Commission and Member States in the promotion of AI literacy required under paragraph 1, including by setting out common objectives.
  action: adopt recommendations supporting the Commission and Member States in promoting the AI literacy required by Article 4(1), including through common objectives
  subject_ref: board
  subject_category: union_institution_or_body
  kind: obligation
  conditions:
  - take European competence frameworks into account
  dependencies:
  - dependency_ref: AIA-NORM-A004-P1-AI-LITERACY-MEASURES
    resolution: internal_resolved
    detail: The recommendations support promotion of the AI literacy required by Article 4(1).
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for the Board.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A004A-P1-HIGH-RISK-BIAS-DATA-PROCESSING
  source: A004A-P001
  quote: To the extent strictly necessary to ensure bias detection and correction in relation to high-risk AI systems in accordance with Article 10(2), points (f) and (g), of this Regulation, providers of such systems may exceptionally process special categories of personal data, subject to appropriate safeguards for the fundamental rights and freedoms of natural persons.
  action: exceptionally process special categories of personal data where strictly necessary for bias detection and correction in high-risk AI systems
  subject_ref: high_risk_ai_system_provider
  subject_category: supported_operator
  kind: permission
  qualifier_spans:
  - A004A-P002
  - A004A-P003
  - A004A-P004
  - A004A-P005
  - A004A-P006
  - A004A-P007
  conditions:
  - the processing is strictly necessary for bias detection and correction under Article 10(2), points (f) and (g)
  - the processing is subject to appropriate safeguards for natural persons' fundamental rights and freedoms
  - processing other data, including synthetic or anonymised data, cannot effectively achieve the bias detection and correction
  - every safeguard and condition in Article 4a(1), points (b) to (f), is satisfied
  dependencies:
  - dependency_ref: Article 10(2), points (f) and (g), of this Regulation
    resolution: unresolved
    detail: The bias-detection and correction purpose depends on Article 10, which has not yet been semantically reviewed.
  - dependency_ref: AIA-NORM-A003-D037-SPECIAL-CATEGORIES-OF-PERSONAL-DATA
    resolution: internal_resolved
    detail: Article 3(37) defines the special categories of personal data covered by the permission.
  - dependency_ref: Regulation (EU) 2016/679; Regulation (EU) 2018/1725; Directive (EU) 2016/680
    resolution: external_recorded
    detail: The exceptional processing remains additional to the applicable external data-protection instruments.
- norm_id: AIA-NORM-A004A-P1-B-REUSE-SECURITY
  source: A004A-P003
  quote: the special categories of personal data are subject to technical limitations on the re-use of personal data, and state-of-the-art security and privacy-preserving measures, including pseudonymisation
  action: apply technical reuse limitations and state-of-the-art security and privacy-preserving measures, including pseudonymisation, to special-category personal data
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
- norm_id: AIA-NORM-A004A-P1-C-ACCESS-SAFEGUARDS
  source: A004A-P004
  quote: the special categories of personal data are subject to measures to ensure that the personal data processed are secured and protected, subject to suitable safeguards, including strict controls and documentation of the access, to avoid misuse and to ensure that only authorised persons have access to those personal data with appropriate confidentiality obligations
  action: secure and protect special-category personal data with suitable safeguards, documented strict access controls, authorised access, and appropriate confidentiality obligations
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
- norm_id: AIA-NORM-A004A-P1-D-NO-THIRD-PARTY-ACCESS
  source: A004A-P005
  quote: the special categories of personal data are not transmitted, transferred or otherwise accessed by other parties
  action: prevent special-category personal data from being transmitted, transferred, or otherwise accessed by other parties
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
- norm_id: AIA-NORM-A004A-P1-E-DELETE-DATA
  source: A004A-P006
  quote: the special categories of personal data are deleted once the bias has been corrected or the personal data has reached the end of its retention period, whichever comes first
  action: delete special-category personal data when the bias is corrected or the retention period ends, whichever occurs first
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
- norm_id: AIA-NORM-A004A-P1-F-RECORD-NECESSITY
  source: A004A-P007
  quote: the records of processing activities pursuant to Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680 include the reasons why the processing of special categories of personal data was strictly necessary to detect and correct biases, and why that objective could not be achieved by processing other data.
  action: record why special-category processing was strictly necessary for bias detection and correction and why other data could not achieve that objective
  subject_ref: article_4a_special_category_data_processor
  subject_category: supported_operator
  kind: obligation
  qualifier_spans:
  - A004A-P001
  - A004A-P010
  conditions:
  - special-category personal data is processed under the Article 4a(1) or Article 4a(2) exceptional permission
  dependencies:
  - dependency_ref: Regulation (EU) 2016/679; Regulation (EU) 2018/1725; Directive (EU) 2016/680
    resolution: external_recorded
    detail: The reasons must be included in processing records maintained under the applicable external instruments.
- norm_id: AIA-NORM-A004A-P2-OTHER-SYSTEM-BIAS-DATA-PROCESSING
  source: A004A-P008
  quote: Providers and deployers of other AI systems and models and deployers of high-risk AI systems may exceptionally process special categories of personal data to the extent that
  action: exceptionally process special categories of personal data for qualifying bias detection and correction involving other AI systems and models or deployment of high-risk AI systems
  subject_ref: other_ai_provider_or_deployer_or_high_risk_deployer
  subject_category: supported_operator
  kind: permission
  qualifier_spans:
  - A004A-P009
  - A004A-P010
  conditions:
  - the processing is strictly necessary for bias detection and correction concerning biases likely to affect health or safety, negatively affect fundamental rights, or cause discrimination prohibited by Union law
  - all Article 4a(1) conditions and safeguards are applied
  dependencies:
  - dependency_ref: AIA-NORM-A003-D037-SPECIAL-CATEGORIES-OF-PERSONAL-DATA
    resolution: internal_resolved
