  source: A003-P005
  quote: ‘deployer’ means a natural or legal person, public authority, agency or other body using an AI system under its authority
    except where the AI system is used in the course of a personal non-professional activity
  action: define deployer for the purposes of the Regulation
  subject_ref: deployer
  subject_category: other
