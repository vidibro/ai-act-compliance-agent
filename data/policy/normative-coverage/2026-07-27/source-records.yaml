  product_scope: dependency_only
  product_scope_reason: This clause constrains downstream rule interpretation but creates no independent compliance action.
  implementation_mode: none_required
  implementation_reason: The no-obligation consequence is represented as a dependency rather than a standalone product rule.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A005-P1-A-MANIPULATIVE-TECHNIQUES
  source: A005-P002
  quote: the placing on the market, the putting into service or the use of an AI system that deploys subliminal techniques beyond a person’s consciousness or purposefully manipulative or deceptive techniques, with the objective, or the effect of materially distorting the behaviour of a person or a group of persons by appreciably impairing their ability to make an informed decision, thereby causing them to take a decision that they would not have otherwise taken in a manner that causes or is reasonably likely to cause that person, another person or group of persons significant harm
  action: prohibit placing on the market, putting into service, or using AI systems employing subliminal, purposefully manipulative, or deceptive techniques that materially distort decisions and cause or are reasonably likely to cause significant harm
  subject_ref: operator
  subject_category: supported_operator
  kind: prohibition
  qualifier_spans:
  - A005-P001
  conditions:
  - the techniques have the objective or effect of materially distorting a person or group's behaviour by appreciably impairing informed decision-making
  - the distortion causes a decision that would not otherwise have been taken
  - the decision causes or is reasonably likely to cause significant harm to that person, another person, or a group
- norm_id: AIA-NORM-A005-P1-B-VULNERABILITY-EXPLOITATION
  source: A005-P003
  quote: the placing on the market, the putting into service or the use of an AI system that exploits any of the vulnerabilities of a natural person or a specific group of persons due to their age, disability or a specific social or economic situation, with the objective, or the effect, of materially distorting the behaviour of that person or a person belonging to that group in a manner that causes or is reasonably likely to cause that person or another person significant harm
  action: prohibit placing on the market, putting into service, or using AI systems that exploit vulnerabilities and materially distort behaviour in a significantly harmful or likely harmful manner
  subject_ref: operator
  subject_category: supported_operator
  kind: prohibition
  qualifier_spans:
  - A005-P001
  conditions:
  - the vulnerability arises from age, disability, or a specific social or economic situation
  - exploitation has the objective or effect of materially distorting the behaviour of the vulnerable person or group member
  - the distortion causes or is reasonably likely to cause significant harm to that person or another person
- norm_id: AIA-NORM-A005-P1-BA-NONCONSENSUAL-INTIMATE-MATERIAL
  source: A005-P004
  quote: the placing on the market, the putting into service or the use of an AI system that generates or manipulates realistic images, videos, audio or similar material of an identifiable natural person’s intimate parts, or of an identifiable natural person engaged in sexually explicit activities, without that person’s freely-given, specific, informed, unambiguous and explicit consent for that generation or manipulation
  action: prohibit qualifying placement, service, or use of AI systems generating or manipulating realistic intimate or sexually explicit material of an identifiable natural person without explicit consent
  subject_ref: operator
  subject_category: supported_operator
  kind: prohibition
  qualifier_spans:
  - A005-P001
  - A005-P018
  - A005-P019
  - A005-P020
  - A005-P021
  - A005-P022
  - A005-P023
  conditions:
  - the material realistically depicts an identifiable natural person's intimate parts or sexually explicit activities
  - the depicted person did not give freely-given, specific, informed, unambiguous, and explicit consent to the generation or manipulation
  - the relevant placing, service, or use condition in Article 5(1a) is satisfied
  exceptions:
  - manipulation that neither increases exposure of depicted intimate parts nor alters the nature of depicted sexually explicit activities does not constitute manipulation
- norm_id: AIA-NORM-A005-P1-BB-DIRECTIVE-MATERIAL
  source: A005-P005
  quote: the placing on the market, the putting into service or the use of an AI system that generates or manipulates material or performance within the meaning of Article 2, points (c) and (e), of Directive 2011/93/EU, except where a ‘without right’ defence applies under national law
  action: prohibit qualifying placement, service, or use of AI systems generating or manipulating material or performances covered by Directive 2011/93/EU
  subject_ref: operator
  subject_category: supported_operator
  kind: prohibition
  qualifier_spans:
  - A005-P001
  - A005-P018
  - A005-P019
  - A005-P020
  - A005-P021
  - A005-P022
  conditions:
  - the generated or manipulated material or performance falls within Article 2, points (c) or (e), of Directive 2011/93/EU
  - the relevant placing, service, or use condition in Article 5(1a) is satisfied
  exceptions:
  - a without-right defence applies under national law
  dependencies:
  - dependency_ref: Article 2, points (c) and (e), of Directive 2011/93/EU
    resolution: external_recorded
    detail: The prohibited material and performance are defined by the external directive.
  - dependency_ref: applicable national-law without-right defence
    resolution: national_or_factual
    detail: National law determines whether the express defence applies.
- norm_id: AIA-NORM-A005-P1-C-SOCIAL-SCORING
  source: A005-P006
  quote: 'the placing on the market, the putting into service or the use of AI systems for the evaluation or classification of natural persons or groups of persons over a certain period of time based on their social behaviour or known, inferred or predicted personal or personality characteristics, with the social score leading to either or both of the following:'
  action: prohibit placing on the market, putting into service, or using AI systems for social scoring that leads to either prohibited form of detrimental or unfavourable treatment
  subject_ref: operator
  subject_category: supported_operator
  kind: prohibition
  qualifier_spans:
  - A005-P001
  - A005-P007
  - A005-P008
  conditions:
  - persons or groups are evaluated or classified over time using social behaviour or known, inferred, or predicted personal or personality characteristics
  - the social score leads to treatment in an unrelated context or treatment that is unjustified or disproportionate to the social behaviour or its gravity
- norm_id: AIA-NORM-A005-P1-D-CRIMINAL-RISK-PROFILING
  source: A005-P009
  quote: the placing on the market, the putting into service for this specific purpose, or the use of an AI system for making risk assessments of natural persons in order to assess or predict the risk of a natural person committing a criminal offence, based solely on the profiling of a natural person or on assessing their personality traits and characteristics
  action: prohibit placing on the market, putting into service for the purpose, or using AI systems to assess or predict criminal-offence risk based solely on profiling or personality traits and characteristics
