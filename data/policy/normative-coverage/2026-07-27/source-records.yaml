- norm_id: AIA-NORM-A027-P1-PERFORM-FRIA
  source: A027-P001
  quote: 'Prior to deploying a high-risk AI system referred to in Article 6(2), with the exception of high-risk AI systems intended to be used in the area listed in point 2 of Annex III, deployers that are bodies governed by public law, or are private entities providing public services, and deployers of high-risk AI systems referred to in points 5 (b) and (c) of Annex III, shall perform an assessment of the impact on fundamental rights that the use of such system may produce. For that purpose, deployers shall perform an assessment consisting of:'
  action: perform a fundamental-rights impact assessment containing all six required elements before deploying the qualifying Annex III system
  subject_ref: qualifying_annex_iii_deployer
  subject_category: supported_operator
  conditions: &article_27_scope
  - the system is high-risk under Article 6(2) and is not intended for Annex III point 2
  - the deployer is governed by public law or provides public services, or the system falls within Annex III point 5(b) or 5(c)
  implementation_refs: &article_27_assessment_implementation
  - AIA-DP-A27
  verification_mode: listed_for_confirmation
  mandatory_content:
  - deployer processes and intended-purpose use
  - intended period and frequency of use
  - affected natural-person and group categories
  - specific harm risks informed by Article 13 provider information
  - implementation of human oversight according to instructions
  - measures for materialised risks, including internal governance and complaint mechanisms
  qualifier_spans:
  - A027-P002
  - A027-P003
  - A027-P004
  - A027-P005
  - A027-P006
  - A027-P007
