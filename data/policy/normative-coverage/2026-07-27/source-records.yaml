- norm_id: AIA-NORM-A002-P1-A-PROVIDER
  source: A002-P002
  quote: providers placing on the market or putting into service AI systems or placing on the market general-purpose AI models in the Union, irrespective of whether those providers are established or located within the Union or in a third country
  action: apply the Regulation to providers placing AI systems or general-purpose AI models on the Union market or putting AI systems into service in the Union, regardless of establishment
  subject_ref: provider
  subject_category: supported_operator
  kind: applicability
  qualifier_spans:
