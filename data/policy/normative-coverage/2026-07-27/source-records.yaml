  source: A026-P10
  quote: Deployers shall submit annual reports to the relevant market surveillance and national data protection authorities on their use of post-remote biometric identification systems
  action: submit annual post-remote biometric-identification use reports to both specified authorities
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
