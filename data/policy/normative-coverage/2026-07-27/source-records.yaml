- norm_id: AIA-NORM-A023-P1-C-VERIFY-MARKING-AND-DOCUMENTS
  source: A023-P004
  quote: the system bears the required CE marking and is accompanied by the EU declaration of conformity referred to in Article 47 and instructions for use
  action: verify that the system has the required CE marking and is accompanied by its EU declaration and instructions before market placement
  subject_ref: importer
  subject_category: supported_operator
  conditions: *article_23_pre_market_condition
  implementation_refs: *article_23_implementation
  verification_mode: listed_for_confirmation
