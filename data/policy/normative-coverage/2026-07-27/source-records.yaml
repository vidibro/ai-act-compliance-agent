- norm_id: AIA-NORM-A005-P1-G-SENSITIVE-BIOMETRIC-CATEGORISATION
  source: A005-P012
  quote: the placing on the market, the putting into service for this specific purpose, or the use of biometric categorisation systems that categorise individually natural persons based on their biometric data to deduce or infer their race, political opinions, trade union membership, religious or philosophical beliefs, sex life or sexual orientation
  action: prohibit placing on the market, putting into service for the purpose, or using biometric categorisation systems to infer the listed sensitive characteristics of individuals
  subject_ref: operator
  subject_category: supported_operator
  kind: prohibition
  qualifier_spans:
