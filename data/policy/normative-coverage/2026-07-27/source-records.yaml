- norm_id: AIA-NORM-A026-P10-REQUEST-AUTHORISATION
  source: A026-P10
  quote: the deployer of a high-risk AI system for post-remote biometric identification shall request an authorisation, ex ante, or without undue delay and no later than 48 hours, by a judicial authority or an administrative authority whose decision is binding and subject to judicial review, for the use of that system
  action: request qualifying judicial or binding reviewable administrative authorisation before use or without undue delay and within 48 hours
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: &article_26_targeted_investigation_condition
  - the system is used for post-remote biometric identification in an investigation targeting a person suspected or convicted of a criminal offence
  exceptions:
  - initial identification of a potential suspect based on objective and verifiable facts directly linked to the offence
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A026-P10-STRICT-NECESSITY
  source: A026-P10
  quote: Each use shall be limited to what is strictly necessary for the investigation of a specific criminal offence.
  action: limit each post-remote biometric-identification use to what is strictly necessary for investigating a specific offence
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: *article_26_targeted_investigation_condition
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A026-P10-STOP-ON-REJECTION
  source: A026-P10
  quote: If the authorisation requested pursuant to the first subparagraph is rejected, the use of the post-remote biometric identification system linked to that requested authorisation shall be stopped with immediate effect
  action: stop the authorised use immediately when the authorisation request is rejected
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: &article_26_authorisation_rejected
  - the requested authorisation is rejected
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A026-P10-DELETE-ON-REJECTION
  source: A026-P10
  quote: the personal data linked to the use of the high-risk AI system for which the authorisation was requested shall be deleted
  action: delete personal data linked to the use for which authorisation was rejected
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions: *article_26_authorisation_rejected
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A026-P10-PROHIBIT-UNTARGETED-USE
  source: A026-P10
  quote: In no case shall such high-risk AI system for post-remote biometric identification be used for law enforcement purposes in an untargeted way, without any link to a criminal offence, a criminal proceeding, a genuine and present or genuine and foreseeable threat of a criminal offence, or the search for a specific missing person.
  action: prohibit untargeted law-enforcement use lacking the specified offence, proceeding, threat, or missing-person link
  subject_ref: law_enforcement_deployer
  subject_category: supported_operator
  kind: prohibition
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A026-P10-NO-SOLE-OUTPUT-ADVERSE-DECISION
  source: A026-P10
  quote: It shall be ensured that no decision that produces an adverse legal effect on a person may be taken by the law enforcement authorities based solely on the output of such post-remote biometric identification systems.
  action: ensure law-enforcement authorities do not take an adverse legal decision based solely on the system's output
  subject_ref: law_enforcement_deployer
  subject_category: supported_operator
  kind: prohibition
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A026-P10-PRESERVE-BIOMETRIC-DATA-LAW
  source: A026-P10
  quote: This paragraph is without prejudice to Article 9 of Regulation (EU) 2016/679 and Article 10 of Directive (EU) 2016/680 for the processing of biometric data.
  action: preserve the referenced GDPR and law-enforcement Directive rules for biometric-data processing
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  kind: applicability
  implementation_refs: *article_26_p10_implementation
  verification_mode: reported_conditionally
  dependencies:
  - dependency_ref: Article 9 of Regulation (EU) 2016/679 and Article 10 of Directive (EU) 2016/680
    resolution: external_recorded
    detail: The external instruments continue to govern biometric-data processing.
- norm_id: AIA-NORM-A026-P10-DOCUMENT-EACH-USE
  source: A026-P10
  quote: Regardless of the purpose or deployer, each use of such high-risk AI systems shall be documented in the relevant police file
  action: document every post-remote biometric-identification use in the relevant police file regardless of purpose or deployer
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  implementation_refs: *article_26_p10_implementation
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A026-P10-MAKE-FILE-AVAILABLE
  source: A026-P10
  quote: shall be made available to the relevant market surveillance authority and the national data protection authority upon request
  action: make the police-file record available on request to the market-surveillance and national data-protection authorities
  subject_ref: post_remote_biometric_deployer
  subject_category: supported_operator
  conditions:
  - either specified authority requests the use record
