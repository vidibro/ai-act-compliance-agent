  quote: Where the high-risk AI system presents a risk within the meaning of Article 79(1), the distributor shall immediately inform the provider or importer of the system and the authorities competent for the high-risk AI system concerned, giving details, in particular, of the non-compliance and of any corrective actions taken.
  action: immediately notify the provider or importer and competent authorities of the risk, non-compliance, and corrective actions
  subject_ref: distributor
  subject_category: supported_operator
  conditions: *article_24_risk_condition
  implementation_refs: *article_24_implementation
  verification_mode: listed_for_confirmation
