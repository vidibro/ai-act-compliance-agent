  quote: shall be translated into a language that can be easily understood by the national competent authorities of the Member States in which the high-risk AI system is placed on the market or made available.
  action: translate the declaration into an easily understood language for authorities in every market state
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A47-2]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A047-P3-SINGLE-DECLARATION
  source: A047-P003
  quote: Where high-risk AI systems are subject to other Union harmonisation legislation which also requires an EU declaration of conformity, a single EU declaration of conformity shall be drawn up in respect of all Union law applicable to the high-risk AI system.
  action: draw up one declaration covering all applicable Union law when other harmonisation legislation also requires one
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A47-3]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A047-P3-IDENTIFY-LEGISLATION
  source: A047-P003
  quote: The declaration shall contain all the information required to identify the Union harmonisation legislation to which the declaration relates.
  action: include all information needed to identify every Union harmonisation law covered
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A47-3]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A047-P4-ASSUME-RESPONSIBILITY
  source: A047-P004
  quote: By drawing up the EU declaration of conformity, the provider shall assume responsibility for compliance with the requirements set out in Section 2.
  action: assume responsibility for Section 2 compliance by drawing up the declaration
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A47-4]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A047-P4-KEEP-CURRENT
  source: A047-P004
  quote: The provider shall keep the EU declaration of conformity up-to-date as appropriate.
  action: keep the declaration of conformity current as appropriate
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A47-4]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A047-P5-AMEND-ANNEX-V
  source: A047-P005
  quote: The Commission is empowered to adopt delegated acts in accordance with Article 97 in order to amend Annex V by updating the content of the EU declaration of conformity set out in that Annex, in order to introduce elements that become necessary in light of technical progress.
  action: amend Annex V declaration content to introduce elements required by technical progress
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A048-P1-GENERAL-CE-PRINCIPLES
  source: A048-P001
  quote: The CE marking shall be subject to the general principles set out in Article 30 of Regulation (EC) No 765/2008.
  action: apply the Regulation 765/2008 Article 30 general principles to the CE marking
  subject_ref: provider
  subject_category: supported_operator
  implementation_mode: missing
  verification_mode: unresolved
- norm_id: AIA-NORM-A048-P2-DIGITAL-CE-MARKING
  source: A048-P002
  quote: For high-risk AI systems provided digitally, a digital CE marking shall be used, only if it can easily be accessed via the interface from which that system is accessed or via an easily accessible machine-readable code or other electronic means.
  action: use an easily accessible digital CE marking for digitally provided high-risk systems
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A48-2]
  verification_mode: listed_for_confirmation
  conditions:
  - the marking is easily accessible through the system interface, a machine-readable code, or other electronic means
- norm_id: AIA-NORM-A048-P3-AFFIX-CE-MARKING
  source: A048-P003
  quote: The CE marking shall be affixed visibly, legibly and indelibly for high-risk AI systems. Where that is not possible or not warranted on account of the nature of the high-risk AI system, it shall be affixed to the packaging or to the accompanying documentation, as appropriate.
  action: affix the CE marking visibly, legibly, and indelibly, using packaging or accompanying documentation only where system affixing is impossible or unwarranted
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A48]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A048-P4-FOLLOW-WITH-BODY-NUMBER
  source: A048-P004
  quote: Where applicable, the CE marking shall be followed by the identification number of the notified body responsible for the conformity assessment procedures set out in Article 43.
  action: place the responsible notified body's identification number after the CE marking where applicable
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A48-4]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A048-P4-AFFIX-BODY-NUMBER
  source: A048-P004
  quote: The identification number of the notified body shall be affixed by the body itself or, under its instructions, by the provider or by the provider’s authorised representative.
  action: have the notified-body number affixed by the body or, under its instructions, by the provider or authorised representative
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A48-4]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A048-P4-PROMOTIONAL-BODY-NUMBER
  source: A048-P004
  quote: The identification number shall also be indicated in any promotional material which mentions that the high-risk AI system fulfils the requirements for CE marking.
  action: include the notified-body number in promotional material claiming CE-marking compliance
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs: [AIA-PO-A48-4]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A048-P5-OTHER-LAW-COMPLIANCE
  source: A048-P005
  quote: Where high-risk AI systems are subject to other Union law which also provides for the affixing of the CE marking, the CE marking shall indicate that the high-risk AI system also fulfil the requirements of that other law.
  action: make the CE marking indicate compliance with other applicable CE-marking Union law
  subject_ref: provider
  subject_category: supported_operator
  implementation_mode: missing
  verification_mode: unresolved
  conditions: [other applicable Union law also provides for affixing the CE marking]
- norm_id: AIA-NORM-A049-P1-PROVIDER-REGISTER
  source: A049-P001
  quote: Before placing on the market or putting into service a high-risk AI system listed in Annex III, with the exception of high-risk AI systems referred to in point 2 of Annex III, the provider or, where applicable, the authorised representative shall register themselves and their system in the EU database referred to in Article 71.
  action: register itself and the Annex III high-risk system in the Article 71 EU database before market placement or putting into service
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - the system is high-risk and listed in Annex III other than point 2
  - registration occurs before placing on the market or putting into service
  implementation_refs: [AIA-PO-A49]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A049-P1-REPRESENTATIVE-REGISTER
  source: A049-P001
  quote: Before placing on the market or putting into service a high-risk AI system listed in Annex III, with the exception of high-risk AI systems referred to in point 2 of Annex III, the provider or, where applicable, the authorised representative shall register themselves and their system in the EU database referred to in Article 71.
  action: register itself and the Annex III high-risk system in the Article 71 EU database where the registration falls to the representative
  subject_ref: authorised_representative
  subject_category: supported_operator
  conditions:
  - the system is high-risk and listed in Annex III other than point 2
  - the representative is applicable for the registration
  - registration occurs before placing on the market or putting into service
  implementation_refs: [AIA-AR-A22]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A049-P2-PROVIDER-REGISTER-NON-HIGH-RISK
  source: A049-P002
  quote: Before placing on the market or putting into service an AI system for which the provider has concluded that it is not high-risk according to Article 6(3), that provider or, where applicable, the authorised representative shall register themselves and that system in the EU database referred to in Article 71.
  action: register itself and the system concluded not high-risk under Article 6(3) in the Article 71 EU database
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - the provider concluded under Article 6(3) that the system is not high-risk
  - registration occurs before placing on the market or putting into service
  implementation_refs: [AIA-NHR-A06-4]
  implementation_reason: The Article 6(4) rule carries the provider limb of the Article 49(2) registration obligation.
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A049-P2-REPRESENTATIVE-REGISTER-NON-HIGH-RISK
  source: A049-P002
  quote: Before placing on the market or putting into service an AI system for which the provider has concluded that it is not high-risk according to Article 6(3), that provider or, where applicable, the authorised representative shall register themselves and that system in the EU database referred to in Article 71.
  action: register itself and the system concluded not high-risk under Article 6(3) in the Article 71 EU database where applicable
  subject_ref: authorised_representative
  subject_category: supported_operator
  conditions:
  - the provider concluded under Article 6(3) that the system is not high-risk
  - the representative is applicable for the registration
  - registration occurs before placing on the market or putting into service
  implementation_refs: [AIA-AR-A49-2]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A049-P3-DEPLOYER-REGISTER-USE
  source: A049-P003
  quote: Before putting into service or using a high-risk AI system listed in Annex III, with the exception of high-risk AI systems listed in point 2 of Annex III, deployers that are public authorities, Union institutions, bodies, offices or agencies or persons acting on their behalf shall register themselves, select the system and register its use in the EU database referred to in Article 71.
  action: register itself, select the system, and register its use in the Article 71 EU database before service or use
  subject_ref: public_authority_deployer
  subject_category: supported_operator
  conditions:
  - the deployer is a public authority, Union institution, body, office or agency, or acts on its behalf
  - the system is high-risk and listed in Annex III other than point 2
  - registration occurs before putting into service or use
  implementation_refs: [AIA-DP-A49-3]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A049-P4-SECURE-NON-PUBLIC-SECTION
  source: A049-P004
  quote: For high-risk AI systems referred to in points 1, 6 and 7 of Annex III, in the areas of law enforcement, migration, asylum and border control management, the registration referred to in paragraphs 1, 2 and 3 of this Article shall be in a secure non-public section of the EU database referred to in Article 71
  action: lodge the applicable registration in a secure non-public section of the Article 71 EU database
  subject_ref: registering_operator
  subject_category: supported_operator
  conditions:
  - the system falls within Annex III point 1, 6 or 7 in law enforcement, migration, asylum, or border-control management
  implementation_refs: [AIA-ALL-A49-4]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A049-P4-RESTRICTED-INFORMATION
  source: A049-P004
  quote: shall include only the following information, as applicable, referred to in
  action: limit the secure-section registration to the enacted Annex VIII and Annex IX information
  subject_ref: registering_operator
  subject_category: supported_operator
  conditions:
  - the secure non-public registration rule in Article 49(4) applies
  mandatory_content:
  - Annex VIII Section A points 1 to 10, except points 6, 8, and 9
  - Annex VIII Section B points 1 to 5 and points 8 and 9
  - Annex VIII Section C points 1 to 3
  - Annex IX points 1, 2, 3, and 5
  qualifier_spans: [A049-P005, A049-P006, A049-P007, A049-P008]
  implementation_refs: [AIA-ALL-A49-4]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A049-P4-COMMISSION-ACCESS
  source: A049-P009
  quote: Only the Commission and national authorities referred to in Article 74(8) shall have access to the respective restricted sections of the EU database listed in the first subparagraph of this paragraph.
  action: access the respective restricted sections of the EU database
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: entitlement
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A049-P4-NATIONAL-AUTHORITY-ACCESS
  source: A049-P009
  quote: Only the Commission and national authorities referred to in Article 74(8) shall have access to the respective restricted sections of the EU database listed in the first subparagraph of this paragraph.
  action: access the respective restricted sections of the EU database
  subject_ref: article_74_8_national_authority
  subject_category: public_authority
  kind: entitlement
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A049-P5-NATIONAL-REGISTRATION
  source: A049-P010
  quote: High-risk AI systems referred to in point 2 of Annex III shall be registered at national level.
  action: register Annex III point 2 high-risk systems at national level
  subject_ref: provider
  subject_category: supported_operator
  conditions: [the high-risk system is referred to in Annex III point 2]
  implementation_refs: [AIA-PO-A49-5]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A050-P1-DISCLOSE
  source: A050-P1
  quote: Providers shall ensure that AI systems intended to interact directly with natural persons are
    designed and developed in such a way that the natural persons concerned are informed that they are
    interacting with an AI system
  action: design direct-interaction systems to inform natural persons they are interacting with AI
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-1
  verification_mode: judged_from_document
  exceptions:
  - obvious interaction in context
  - qualifying law-enforcement authorisation
  qualifier_spans:
  - A050-P5
- norm_id: AIA-NORM-A050-P2-MARK-DETECT
  source: A050-P2
  quote: Providers of AI systems, including general-purpose AI systems, generating synthetic audio, image,
    video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable
    format and detectable as artificially generated or manipulated.
  action: make synthetic outputs both machine-readably marked and detectable
  subject_ref: provider
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-2
  verification_mode: judged_from_document
  mandatory_content:
  - machine-readable marking
  - detectability as artificial or manipulated
  - effective, interoperable, robust and reliable solution as technically feasible
  qualifier_spans:
  - A050-P5
- norm_id: AIA-NORM-A050-P3-INFORM
  source: A050-P3
  quote: shall inform the natural persons exposed thereto of the operation of the system
  action: inform people exposed to emotion recognition or biometric categorisation
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-3
  verification_mode: listed_for_confirmation
  qualifier_spans:
  - A050-P5
- norm_id: AIA-NORM-A050-P3-DATA
  source: A050-P3
  quote: shall process the personal data in accordance with Regulations (EU) 2016/679 and (EU) 2018/1725
    and Directive (EU) 2016/680
  action: process personal data under the referenced data-protection instruments
  subject_ref: deployer
  subject_category: supported_operator
  dependencies:
  - dependency_ref: Regulation (EU) 2016/679; Regulation (EU) 2018/1725; Directive (EU) 2016/680
    resolution: external_recorded
    detail: Referenced instruments are outside the enacted corpus.
- norm_id: AIA-NORM-A050-P4-DEEPFAKE
  source: A050-P4
  quote: shall disclose that the content has been artificially generated or manipulated
  action: disclose artificial generation or manipulation of deep-fake image, audio, or video
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-4
  verification_mode: listed_for_confirmation
  qualifier_spans:
  - A050-P5
- norm_id: AIA-NORM-A050-P4-TEXT
  source: A050-P4
  quote: shall disclose that the text has been artificially generated or manipulated
  action: disclose artificial generation or manipulation of public-interest text
  subject_ref: deployer
  subject_category: supported_operator
  implementation_refs:
  - AIA-TR-A50-4
  verification_mode: listed_for_confirmation
  qualifier_spans:
  - A050-P5
- norm_id: AIA-NORM-A050-P5-MANNER
  source: A050-P5
  quote: shall be provided to the natural persons concerned in a clear and distinguishable manner
  action: provide paragraphs 1 to 4 information clearly, distinguishably, on time, and accessibly
  subject_ref: provider_or_deployer
  subject_category: supported_operator
  implementation_mode: carried_by_other_norm
  implementation_reason: The four existing transparency rules carry this shared qualifier.
  verification_mode: reported_conditionally
  mandatory_content:
  - clear and distinguishable
  - no later than first interaction or exposure
  - applicable accessibility requirements
- norm_id: AIA-NORM-A050-P6-CUMULATIVE
  source: A050-P6
  quote: Paragraphs 1 to 4 shall not affect the requirements and obligations set out in Chapter III
  action: preserve Chapter III and other transparency duties alongside Article 50
  subject_ref: provider_or_deployer
  subject_category: supported_operator
  kind: applicability
  product_scope: dependency_only
  product_scope_reason: This proposition supplies applicability or content to operator norms.
  implementation_mode: none_required
  implementation_reason: Represented as a dependency rather than an independent finding.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A050-P7-CODES
  source: A050-P7
  quote: The Commission shall encourage and facilitate the drawing up of codes of practice
  action: encourage and facilitate Union-level codes of practice
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A050-P7-ASSESS
  source: A050-P7
  quote: The Commission, taking utmost account of the opinion of the Board, shall assess
  action: assess whether code adherence adequately ensures compliance
  subject_ref: commission
  subject_category: union_institution_or_body
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A050-P7-ACT
  source: A050-P7
  quote: the Commission may adopt an implementing act
  action: adopt common implementation rules if a code is inadequate
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A051-P1-A-HIGH-IMPACT-SYSTEMIC-RISK
  source: A051-P002
  quote: it has high impact capabilities evaluated on the basis of appropriate technical tools and methodologies, including indicators and benchmarks
  action: classify a general-purpose AI model with evaluated high-impact capabilities as a model with systemic risk
  subject_ref: general_purpose_ai_model
  subject_category: other
  kind: applicability
  qualifier_spans: [A051-P001]
  conditions:
  - appropriate technical tools and methodologies, including indicators and benchmarks, establish high-impact capabilities
  implementation_mode: missing
  verification_mode: unresolved
- norm_id: AIA-NORM-A051-P1-B-EQUIVALENT-SYSTEMIC-RISK
  source: A051-P003
  quote: based on a decision of the Commission, ex officio or following a qualified alert from the scientific panel, it has capabilities or an impact equivalent to those set out in point (a) having regard to the criteria set out in Annex XIII
  action: classify a general-purpose AI model with Commission-determined equivalent capabilities or impact as a model with systemic risk
  subject_ref: general_purpose_ai_model
  subject_category: other
  kind: applicability
  qualifier_spans: [A051-P001]
  conditions:
  - the Commission decides ex officio or following a qualified scientific-panel alert that the model has equivalent capabilities or impact
  - the Commission has regard to the Annex XIII criteria
  implementation_mode: missing
  verification_mode: unresolved
- norm_id: AIA-NORM-A051-P2-COMPUTE-PRESUMPTION
  source: A051-P004
  quote: A general-purpose AI model shall be presumed to have high impact capabilities pursuant to paragraph 1, point (a), when the cumulative amount of computation used for its training measured in floating point operations is greater than 10 25.
  action: presume a general-purpose AI model has high-impact capabilities when its training computation exceeds 10^25 floating-point operations
  subject_ref: general_purpose_ai_model
  subject_category: other
  kind: applicability
  conditions:
  - cumulative training computation measured in floating-point operations exceeds 10^25
  implementation_mode: missing
  verification_mode: unresolved
- norm_id: AIA-NORM-A051-P3-AMEND-THRESHOLDS
  source: A051-P005
  quote: The Commission shall adopt delegated acts in accordance with Article 97 to amend the thresholds listed in paragraphs 1 and 2 of this Article, as well as to supplement benchmarks and indicators in light of evolving technological developments, such as algorithmic improvements or increased hardware efficiency, when necessary, for these thresholds to reflect the state of the art.
  action: adopt Article 97 delegated acts amending Article 51 thresholds when necessary to reflect the state of the art
  subject_ref: commission
  subject_category: union_institution_or_body
  conditions:
  - amendment is necessary for the thresholds to reflect the state of the art in light of technological developments
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A051-P3-SUPPLEMENT-BENCHMARKS
  source: A051-P005
  quote: The Commission shall adopt delegated acts in accordance with Article 97 to amend the thresholds listed in paragraphs 1 and 2 of this Article, as well as to supplement benchmarks and indicators in light of evolving technological developments, such as algorithmic improvements or increased hardware efficiency, when necessary, for these thresholds to reflect the state of the art.
  action: adopt Article 97 delegated acts supplementing benchmarks and indicators when necessary to reflect the state of the art
  subject_ref: commission
  subject_category: union_institution_or_body
  conditions:
  - supplementation is necessary in light of technological developments such as algorithmic improvements or increased hardware efficiency
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A052-P1-NOTIFY-COMMISSION
  source: A052-P001
  quote: Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a), the relevant provider shall notify the Commission without delay and in any event within two weeks after that requirement is met or it becomes known that it will be met.
  action: notify the Commission without delay and within two weeks of meeting or anticipating the Article 51(1)(a) condition
  subject_ref: provider
  subject_category: supported_operator
  conditions:
  - the general-purpose AI model meets or is known will meet the Article 51(1)(a) condition
  implementation_refs: [AIA-GP-A52-1]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A052-P1-NOTIFICATION-CONTENT
  source: A052-P001
  quote: That notification shall include the information necessary to demonstrate that the relevant requirement has been met.
  action: include information demonstrating that the Article 51(1)(a) requirement is met in the notification
  subject_ref: provider
  subject_category: supported_operator
  conditions: [the provider submits the Article 52(1) notification]
  mandatory_content: [information necessary to demonstrate that the Article 51(1)(a) requirement has been met]
  implementation_refs: [AIA-GP-A52-1]
  verification_mode: listed_for_confirmation
- norm_id: AIA-NORM-A052-P1-DESIGNATE-UNNOTIFIED-MODEL
  source: A052-P001
  quote: If the Commission becomes aware of a general-purpose AI model presenting systemic risks of which it has not been notified, it may decide to designate it as a model with systemic risk.
  action: designate an unnotified general-purpose AI model presenting systemic risks as a model with systemic risk
  subject_ref: commission
  subject_category: union_institution_or_body
  kind: power
  conditions:
  - the Commission becomes aware that an unnotified general-purpose AI model presents systemic risks
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
  implementation_mode: none_required
  implementation_reason: Outside the supported operator reporting surface.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A052-P2-PRESENT-REBUTTAL
  source: A052-P002
  quote: The provider of a general-purpose AI model that meets the condition referred to in Article 51(1), point (a), may present, with its notification, sufficiently substantiated arguments to demonstrate that, exceptionally, although it meets that requirement, the general-purpose AI model does not present, due to its specific characteristics, systemic risks and therefore should not be classified as a general-purpose AI model with systemic risk.
  action: present substantiated model-specific arguments with the notification against systemic-risk classification
  subject_ref: provider
  subject_category: supported_operator
  kind: permission
  conditions:
  - the model meets the Article 51(1)(a) condition
  - the arguments are presented with the notification and are sufficiently substantiated
  product_scope: no_product_action
  product_scope_reason: Grants an optional rebuttal procedure rather than imposing a compliance action.
  implementation_mode: none_required
  implementation_reason: No independent product action is required.
  verification_mode: not_assessed
- norm_id: AIA-NORM-A052-P3-REJECT-UNSUBSTANTIATED-ARGUMENTS
  source: A052-P003
  quote: Where the Commission concludes that the arguments submitted pursuant to paragraph 2 are not sufficiently substantiated and the relevant provider was not able to demonstrate that the general-purpose AI model does not present, due to its specific characteristics, systemic risks, it shall reject those arguments
  action: reject insufficiently substantiated rebuttal arguments that fail to demonstrate absence of systemic risk
  subject_ref: commission
  subject_category: union_institution_or_body
  conditions:
  - paragraph 2 arguments are insufficiently substantiated
  - the provider did not demonstrate that the model lacks systemic risk due to its specific characteristics
  product_scope: outside_supported_actor
  product_scope_reason: The present product does not report compliance for this addressee.
