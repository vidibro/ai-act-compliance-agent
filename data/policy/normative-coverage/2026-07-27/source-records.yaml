  source: A024-P005
  quote: Upon a reasoned request from a relevant competent authority, distributors of a high-risk AI system shall provide that authority with all the information and documentation regarding their actions pursuant to paragraphs 1 to 4 necessary to demonstrate the conformity of that system with the requirements set out in Section 2.
  action: provide a requesting authority with information and documentation about paragraph 1 to 4 actions necessary to demonstrate Section 2 conformity
  subject_ref: distributor
  subject_category: supported_operator
  conditions:
  - a relevant competent authority makes a reasoned request
  implementation_refs: *article_24_implementation
