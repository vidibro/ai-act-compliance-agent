- norm_id: AIA-NORM-A024-P2-WITHHOLD-NONCONFORMING-SYSTEM
  source: A024-P002
  quote: Where a distributor considers or has reason to consider, on the basis of the information in its possession, that a high-risk AI system is not in conformity with the requirements set out in Section 2, it shall not make the high-risk AI system available on the market until the system has been brought into conformity with those requirements.
  action: withhold a suspected Section 2 non-conforming system from the market until it has been brought into conformity
  subject_ref: distributor
  subject_category: supported_operator
  conditions:
  - the distributor considers or has reason to consider from its information that the system is not Section 2 compliant
  implementation_refs: *article_24_implementation
  verification_mode: listed_for_confirmation
