  source: A006-P018
  quote: The Commission shall adopt delegated acts in accordance with Article 97 in order to amend paragraph 3, second subparagraph, of this Article by deleting any of the conditions laid down therein
  action: adopt Article 97 delegated acts deleting Article 6(3) exception conditions when necessary to maintain the required protection
  subject_ref: commission
