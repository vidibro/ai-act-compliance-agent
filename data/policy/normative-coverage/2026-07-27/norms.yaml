- norm_id: AIA-NORM-A007-P2-CONSIDER-RISK-CRITERIA
  act_version_date: '2026-07-27'
  kind: obligation
  subjects:
  - subject_ref: commission
    category: union_institution_or_body
  action: take every Article 7(2) criterion into account when assessing whether an Annex III amendment
    meets Article 7(1)(b)
  norm_text: the Commission shall take into account the following criteria
  detection_channels:
  - semantic_legal_effect
  - shall_token
  - cross_reference_structure
  primary_spans:
  - AIA-TEXT-A007-P004
  qualifier_spans:
  - AIA-TEXT-A007-P005
