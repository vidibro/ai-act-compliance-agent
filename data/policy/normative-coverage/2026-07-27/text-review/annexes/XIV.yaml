  text: '1.Introduction Conformity assessment of high-risk AI systems pursuant to this Regulation may
    require the involvement of conformity assessment bodies. Only conformity assessment bodies that have
    been designated in accordance with this Regulation may carry out conformity assessments and only for
    the activities related to the types of AI systems concerned. The list of codes, categories, and corresponding
    types of AI systems sets the scope of the designation of conformity assessment bodies notified under
    Article 30.

    '
