- segment_id: AIA-TEXT-ANNEX-IV-I1
  source:
    kind: annex
    document: IV
    act_version_date: '2026-07-27'
  start: 211
  end: 1360
  sha256: 976c99ca94d4e8934eeb547115c50fc5c56d629b1e8bf316e47958aa84d01967
  text: "1. A general description of the AI system including:\n        (a) its intended purpose, the name\
    \ of the provider and the version of the system reflecting its relation to previous versions;\n  \
    \      (b) how the AI system interacts with, or can be used to interact with, hardware or software,\
    \ including with other AI systems, that are not part of the AI system itself, where applicable;\n\
    \        (c) the versions of relevant software or firmware, and any requirements related to version\
    \ updates;\n        (d) the description of all the forms in which the AI system is placed on the market\
    \ or put into service, such as software packages embedded into hardware, downloads, or APIs;\n   \
    \     (e) the description of the hardware on which the AI system is intended to run;\n        (f)\
    \ where the AI system is a component of products, photographs or illustrations showing external features,\
    \ the marking and internal layout of those products;\n        (g) a basic description of the user-interface\
    \ provided to the deployer;\n        (h) instructions for use for the deployer, and a basic description\
    \ of the user-interface provided to the deployer, where applicable;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-ANNEX-IV-CONTENT
  review:
    status: proposed
    extracted_by: semantic-legal-effect-pass
    verified_by: ''
