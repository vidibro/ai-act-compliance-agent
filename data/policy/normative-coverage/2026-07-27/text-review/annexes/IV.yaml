    expected level of accuracy in relation to its intended purpose; the foreseeable unintended outcomes
    and sources of risks to health and safety, fundamental rights and discrimination in view of the intended
    purpose of the AI system; the human oversight measures needed in accordance with Article 14, including
    the technical measures put in place to facilitate the interpretation of the outputs of AI systems
    by the deployers; specifications on input data, as appropriate;

    '
