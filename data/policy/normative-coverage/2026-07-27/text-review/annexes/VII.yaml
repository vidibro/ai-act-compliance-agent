- segment_id: AIA-TEXT-ANNEX-VII-P025
  source:
    kind: annex
    document: VII
    act_version_date: '2026-07-27'
  start: 4673
  end: 6259
  sha256: 1a3248f551953197c6a29cfcd002c9d31c7098e681c2a6887cacf2754a912414
  text: '    4.6. The decision of the notified body shall be notified to the provider or its authorised
    representative. The notification shall contain the conclusions of the assessment of the technical
    documentation and the reasoned assessment decision. Where the AI system is in conformity with the
    requirements set out in Chapter III, Section 2, the notified body shall issue a Union technical documentation
    assessment certificate. The certificate shall indicate the name and address of the provider, the conclusions
    of the examination, the conditions (if any) for its validity and the data necessary for the identification
    of the AI system. The certificate and its annexes shall contain all relevant information to allow
    the conformity of the AI system to be evaluated, and to allow for control of the AI system while in
    use, where applicable. Where the AI system is not in conformity with the requirements set out in Chapter
    III, Section 2, the notified body shall refuse to issue a Union technical documentation assessment
    certificate and shall inform the applicant accordingly, giving detailed reasons for its refusal. Where
    the AI system does not meet the requirement relating to the data used to train it, re-training of
    the AI system will be needed prior to the application for a new conformity assessment. In this case,
    the reasoned assessment decision of the notified body refusing to issue the Union technical documentation
    assessment certificate shall contain specific considerations on the quality data used to train the
    AI system, in particular on the reasons for non-compliance.

    '
