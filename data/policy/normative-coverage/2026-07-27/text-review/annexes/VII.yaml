  source:
    kind: annex
    document: VII
    act_version_date: '2026-07-27'
  start: 4152
  end: 4673
  sha256: bc4224740e09306c4ad77803a14ddb939daf30bd0c091598dbdd169c0a1d7299
  text: '    4.5. Where necessary to assess the conformity of the high-risk AI system with the requirements
    set out in Chapter III, Section 2, after all other reasonable means to verify conformity have been
    exhausted and have proven to be insufficient, and upon a reasoned request, the notified body shall
    also be granted access to the training and trained models of the AI system, including its relevant
    parameters. Such access shall be subject to existing Union law on the protection of intellectual property
    and trade secrets.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-ANNEX-VII-MODEL-ACCESS
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
