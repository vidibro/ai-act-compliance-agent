    supply further evidence or carry out further tests so as to enable a proper assessment of the conformity
    of the AI system with the requirements set out in Chapter III, Section 2. Where the notified body
    is not satisfied with the tests carried out by the provider, the notified body shall itself directly
    carry out adequate tests, as appropriate.

    '
