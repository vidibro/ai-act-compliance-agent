  sha256: 7910e83076de6044c172ba492ed2d4024f476695e40d7d46fc03d50574ec9613
  text: "2. Overview\n    The approved quality management system for the design, development and testing\
    \ of AI systems pursuant to Article 17 shall be examined in accordance with point 3 and shall be subject\
    \ to surveillance as specified in point 5. The technical documentation of the AI system shall be examined\
    \ in accordance with point 4.\n"
