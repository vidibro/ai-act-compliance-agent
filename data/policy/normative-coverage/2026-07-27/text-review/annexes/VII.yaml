  end: 7205
  sha256: ca36c09c1e7a655efaebe0b916e69aa94e486c08869247a5fb699eb9a5b86914
  text: '    4.7. Any change to the AI system that could affect the compliance of the AI system with the
    requirements or its intended purpose shall be assessed by the notified body which issued the Union
    technical documentation assessment certificate. The provider shall inform such notified body of its
    intention to introduce any of the abovementioned changes, or if it otherwise becomes aware of the
    occurrence of such changes. The intended changes shall be assessed by the notified body, which shall
    decide whether those changes require a new conformity assessment in accordance with Article 43(4)
    or whether they could be addressed by means of a supplement to the Union technical documentation assessment
    certificate. In the latter case, the notified body shall assess the changes, notify the provider of
    its decision and, where the changes are approved, issue to the provider a supplement to the Union
    technical documentation assessment certificate.

    '
