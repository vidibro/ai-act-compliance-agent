- segment_id: AIA-TEXT-ANNEX-VII-I3
  source:
    kind: annex
    document: VII
    act_version_date: '2026-07-27'
  start: 656
  end: 2616
  sha256: 13d8323432fcec08603b056dd5c51a792a6979acbf70b65bac4650bcbef6d9d6
  text: "3. Quality management system\n    3.1. The application of the provider shall include:\n     \
    \       (a) the name and address of the provider and, if the application is lodged by an authorised\
    \ representative, also their name and address;\n            (b) the list of AI systems covered under\
    \ the same quality management system;\n            (c) the technical documentation for each AI system\
    \ covered under the same quality management system;\n            (d) the documentation concerning\
    \ the quality management system which shall cover all the aspects listed under Article 17;\n     \
    \       (e) a description of the procedures in place to ensure that the quality management system\
    \ remains adequate and effective;\n            (f) a written declaration that the same application\
    \ has not been lodged with any other notified body.\n    3.2. The quality management system shall\
    \ be assessed by the notified body, which shall determine whether it satisfies the requirements referred\
    \ to in Article 17. The decision shall be notified to the provider or its authorised representative.\
    \ The notification shall contain the conclusions of the assessment of the quality management system\
    \ and the reasoned assessment decision.\n    3.3. The quality management system as approved shall\
    \ continue to be implemented and maintained by the provider so that it remains adequate and efficient.\n\
    \    3.4. Any intended change to the approved quality management system or the list of AI systems\
    \ covered by the latter shall be brought to the attention of the notified body by the provider. The\
    \ proposed changes shall be examined by the notified body, which shall decide whether the modified\
    \ quality management system continues to satisfy the requirements referred to in point 3.2 or whether\
    \ a reassessment is necessary. The notified body shall notify the provider of its decision. The notification\
    \ shall contain the conclusions of the examination of the changes and the reasoned assessment decision.\n"
  disposition: normative
  disposition_reason: ''
