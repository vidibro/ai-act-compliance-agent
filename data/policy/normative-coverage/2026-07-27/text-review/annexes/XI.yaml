  sha256: e9e83fbaedcaa27411fc34a94259ae91e2111f9918af8d7a9b9bb2dc33dfee08
  text: 'Section 2Additional information to be provided by providers of general-purpose AI models with
    systemic risk 1.A detailed description of the evaluation strategies, including evaluation results,
    on the basis of available public evaluation protocols and tools or otherwise of other evaluation methodologies.
    Evaluation strategies shall include evaluation criteria, metrics and the methodology on the identification
    of limitations. 2.Where applicable, a detailed description of the measures put in place for the purpose
    of conducting internal and/or external adversarial testing (e.g. red teaming), model adaptations,
    including alignment and fine-tuning. 3.Where applicable, a detailed description of the system architecture
    explaining how software components build or feed into each other and integrate into the overall processing.

    '
  disposition: normative
  disposition_reason: ''
