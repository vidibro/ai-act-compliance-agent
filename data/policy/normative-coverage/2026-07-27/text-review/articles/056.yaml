  sha256: 169b12373c8fcbc8079b25b4265c00dda2f09d3500a3f36b1083a63236606fe7
  text: '    If, by 2 August 2025, a code of practice cannot be finalised, or if the AI Office deems it
    is not adequate following its assessment under paragraph 6 of this Article, the Commission may provide,
    by means of implementing acts, common rules for the implementation of the obligations provided for
    in Articles 53 and 55, including the issues set out in paragraph 2 of this Article. Those implementing
    acts shall be adopted in accordance with the examination procedure referred to in Article 98(2).

    '
