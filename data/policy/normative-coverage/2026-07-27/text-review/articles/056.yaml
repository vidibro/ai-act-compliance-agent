  start: 2386
  end: 2935
  sha256: 14c78fd41831b271ab096d3285af61a3babad0698095d127be4d0da315bcd044
  text: '6. The Commission and the Board shall regularly monitor and evaluate the achievement of the objectives
    of the codes of practice by the participants and their contribution to the proper application of this
    Regulation. The Commission, taking utmost account of the opinion of the Board, shall assess whether
    the codes of practice cover the obligations provided for in Articles 53 and 55, and shall regularly
    monitor and evaluate the achievement of their objectives. The Commission shall publish its assessment
    of the adequacy of the codes of practice.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A056-P6-JOINT-MONITOR-EVALUATE
  - AIA-NORM-A056-P6-ASSESS-COVERAGE
  - AIA-NORM-A056-P6-COMMISSION-MONITOR-EVALUATE
  - AIA-NORM-A056-P6-PUBLISH-ASSESSMENT
  qualifying_norm_ids: []
  review:
