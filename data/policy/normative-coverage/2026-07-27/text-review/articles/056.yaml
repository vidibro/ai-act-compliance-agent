  text: '7. The AI Office may invite all providers of general-purpose AI models to adhere to the codes
    of practice. For providers of general-purpose AI models not presenting systemic risks this adherence
    may be limited to the obligations provided for in Article 53, unless they declare explicitly their
    interest to join the full code.

    '
  disposition: normative
  disposition_reason: ''
