  sha256: 696dc03a98a5f579d7d704b5d39a8da256976a6681f1919de9ec2a51b6d19ce8
  text: '5. The AI Office shall aim to ensure that participants to the codes of practice report regularly
    to the AI Office on the implementation of the commitments and the measures taken and their outcomes,
    including as measured against the key performance indicators as appropriate. Key performance indicators
    and reporting commitments shall reflect differences in size and capacity between various participants.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
