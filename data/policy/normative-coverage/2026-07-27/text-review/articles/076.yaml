  start: 647
  end: 1151
  sha256: e47a7ff41c963c60e76dc358ea478a2a4bce04b6f86ca0d1adb9e630a215bbaf
  text: '2. Where testing in real world conditions is conducted for AI systems that are supervised within
    an AI regulatory sandbox under Article 58, the market surveillance authorities shall verify the compliance
    with Article 60 as part of their supervisory role for the AI regulatory sandbox. Those authorities
    may, as appropriate, allow the testing in real world conditions to be conducted by the provider or
    prospective provider, in derogation from the conditions set out in Article 60(4), points (f) and (g).

    '
  disposition: normative
  disposition_reason: ''
