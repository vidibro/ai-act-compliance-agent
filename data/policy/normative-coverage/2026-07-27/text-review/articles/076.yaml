  sha256: 0ee4f2df5a483a15b47d3772f6d835f93e3fcda93403593289e3a27feb1ed5ef
  text: '    Where testing in real world conditions is based on Article 60a, any reference to a market
    surveillance authority in this Article shall be construed as a reference to the national competent
    authority or appropriate authority under the Union harmonisation legislation listed in Section B of
    Annex I, and references to Article 60 shall be construed as references to Article 60a, as appropriate.

    '
