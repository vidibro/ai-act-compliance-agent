  text: '    The power of the AI Office to enforce decisions taken pursuant to this Article shall be subject
    to a limitation period of five years. The limitation period shall begin to run on the day on which
    the decision becomes final.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075C-P8-FIVE-YEAR-DECISION-LIMIT
