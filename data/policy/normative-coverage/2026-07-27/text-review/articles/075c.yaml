  end: 4387
  sha256: 36ab4fc934c74603abe6696ea2f0c5dd0d8e347b7029b0459aee13a582070faa
  text: '8. The powers conferred on the AI Office by this Article shall be subject to a limitation period
    of five years. The limitation period shall begin to run on the day on which the infringement is committed.
    However, in the case of continuing or repeated infringements, the limitation period shall begin to
    run on the day on which the infringement ceases.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075C-P8-FIVE-YEAR-INFRINGEMENT-LIMIT
  qualifying_norm_ids: []
