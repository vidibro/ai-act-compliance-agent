  text: '1. Prior to deploying a high-risk AI system referred to in Article 6(2), with the exception of
    high-risk AI systems intended to be used in the area listed in point 2 of Annex III, deployers that
    are bodies governed by public law, or are private entities providing public services, and deployers
    of high-risk AI systems referred to in points 5 (b) and (c) of Annex III, shall perform an assessment
    of the impact on fundamental rights that the use of such system may produce. For that purpose, deployers
    shall perform an assessment consisting of:

    '
