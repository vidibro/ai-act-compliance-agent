  sha256: 8167b057ba2435b2d840030cc54f7a97dca1939a65db212b289ea113b37165f5
  text: '4. If any of the obligations laid down in this Article is already met through the data protection
    impact assessment conducted pursuant to Article 35 of Regulation (EU) 2016/679 or Article 27 of Directive
