- segment_id: AIA-TEXT-A079-P002
  source:
    kind: article
    document: '79'
    act_version_date: '2026-07-27'
  start: 332
  end: 1142
  sha256: 735e35ef4bcb2d3e62a949d996914516b2b21d1ba87cda487edff86626ef10ac
  text: '2. Where the market surveillance authority of a Member State has sufficient reason to consider
    an AI system to present a risk as referred to in paragraph 1 of this Article, it shall carry out an
    evaluation of the AI system concerned in respect of its compliance with all the requirements and obligations
    laid down in this Regulation. Particular attention shall be given to AI systems presenting a risk
    to vulnerable groups. Where risks to fundamental rights are identified, the market surveillance authority
    shall also inform and fully cooperate with the relevant national public authorities or bodies referred
    to in Article 77(1). The relevant operators shall cooperate as necessary with the market surveillance
    authority and with the other national public authorities or bodies referred to in Article 77(1).

    '
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
  norm_ids: []
  review:
    status: needs_review
    extracted_by: semantic-legal-effect-pass
