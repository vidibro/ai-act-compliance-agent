  start: 4408
  end: 5106
  sha256: c5c572ad29cfa139433f356ab75258b9be995e866ef09bc7b6bdd5a8e2bff945
  text: '8. Where, within three months of receipt of the notification referred to in paragraph 5 of this
    Article, no objection has been raised by either a market surveillance authority of a Member State
    or by the Commission in respect of a provisional measure taken by a market surveillance authority
    of another Member State, that measure shall be deemed justified. This shall be without prejudice to
    the procedural rights of the concerned operator in accordance with Article 18 of Regulation (EU) 2019/1020.
    The three-month period referred to in this paragraph shall be reduced to 30 days in the event of non-compliance
    with the prohibition of the AI practices referred to in Article 5 of this Regulation.

    '
  disposition: needs_review
