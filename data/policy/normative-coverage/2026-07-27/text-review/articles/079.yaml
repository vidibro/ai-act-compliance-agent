  sha256: b5d0214915fd217d984f98b05bb53878112e6dfdbc629eeab13abbb0920a977f
  text: "1. AI systems presenting a risk shall be understood as a \u2018 product presenting a risk \u2019\
    \ as defined in Article 3, point 19 of Regulation (EU) 2019/1020, in so far as they present risks\
    \ to the health or safety, or to fundamental rights, of persons.\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
