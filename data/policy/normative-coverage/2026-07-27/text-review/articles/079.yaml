  text: '6. The notification referred to in paragraph 5 shall include all available details, in particular
    the information necessary for the identification of the non-compliant AI system, the origin of the
    AI system and the supply chain, the nature of the non-compliance alleged and the risk involved, the
    nature and duration of the national measures taken and the arguments put forward by the relevant operator.
    In particular, the market surveillance authorities shall indicate whether the non-compliance is due
    to one or more of the following:

    '
