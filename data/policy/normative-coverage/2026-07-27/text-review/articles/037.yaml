  sha256: 755018d13b4c55945f8b7dfc9f48ec32c3f3c7893df7f806a5442428f36eb112
  text: '4. Where the Commission ascertains that a notified body does not meet or no longer meets the
    requirements for its notification, it shall inform the notifying Member State accordingly and request
    it to take the necessary corrective measures, including the suspension or withdrawal of the notification
    if necessary. Where the Member State fails to take the necessary corrective measures, the Commission
    may, by means of an implementing act, suspend, restrict or withdraw the designation. That implementing
    act shall be adopted in accordance with the examination procedure referred to in Article 98(2).

    '
