  sha256: d1c7895393e3b075bb6f2bc22bf1d76ca040add13c88b3fc6e5125797cadfd15
  text: '6. Where a Member State considers that a common specification does not entirely meet the requirements
    set out in Section 2 or, as applicable, comply with obligations set out in Sections 2 and 3 of Chapter
    V, it shall inform the Commission thereof with a detailed explanation. The Commission shall assess
    that information and, if appropriate, amend the implementing act establishing the common specification
    concerned.

    '
