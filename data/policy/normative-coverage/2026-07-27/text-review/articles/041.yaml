  sha256: c14ffaac8a41129fbc687c03fc3ad109fc4944ecaf57bce7d668e264c32b42cc
  text: '3. High-risk AI systems or general-purpose AI models which are in conformity with the common
    specifications referred to in paragraph 1, or parts of those specifications, shall be presumed to
    be in conformity with the requirements set out in Section 2 of this Chapter or, as applicable, to
    comply with the obligations referred to in Sections 2 and 3 of Chapter V, to the extent those common
    specifications cover those requirements or those obligations.

    '
