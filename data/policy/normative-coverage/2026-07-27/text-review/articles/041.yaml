  end: 3547
  sha256: a8912afbddc6aed69bebe77b5c4c26fd52666febe7266f325fda235d5ca1cbb7
  text: '5. Where providers of high-risk AI systems or general-purpose AI models do not comply with the
    common specifications referred to in paragraph 1, they shall duly justify that they have adopted technical
    solutions that meet the requirements referred to in Section 2 of this Chapter or, as applicable, comply
    with the obligations set out in Sections 2 and 3 of Chapter V to a level at least equivalent thereto.

    '
  disposition: normative
  disposition_reason: ''
