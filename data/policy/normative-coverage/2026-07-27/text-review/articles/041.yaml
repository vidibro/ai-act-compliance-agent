    document: '41'
    act_version_date: '2026-07-27'
  start: 2490
  end: 3139
  sha256: a8b3538f4022ead72705f4e1bd339ce12818e0c1bf595a7524df70403fc115c2
  text: '4. Where a harmonised standard is adopted by a European standardisation organisation and proposed
    to the Commission for the publication of its reference in the Official Journal of the European Union,
    the Commission shall assess the harmonised standard in accordance with Regulation (EU) No 1025/2012.
    When reference to a harmonised standard is published in the Official Journal of the European Union,
    the Commission shall repeal the implementing acts referred to in paragraph 1, or parts thereof which
    cover the same requirements set out in Section 2 of this Chapter or, as applicable, the same obligations
    set out in Sections 2 and 3 of Chapter V.

    '
  disposition: normative
