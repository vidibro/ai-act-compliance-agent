  end: 533
  sha256: 24b5704cfff1b32093ab9bf28208da4a5b9093bc2bfb8b7b71a579cef00fbfd0
  text: '1. Where a market surveillance authority has sufficient reason to consider that an AI system
    classified by the provider as non-high-risk pursuant to Article 6(3) is indeed high-risk, the market
    surveillance authority shall carry out an evaluation of the AI system concerned in respect of its
    classification as a high-risk AI system based on the conditions set out in Article 6(3) and the Commission
    guidelines.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A080-P1-EVALUATE-CLASSIFICATION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: codex
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A080-P002
  source:
    kind: article
    document: '80'
    act_version_date: '2026-07-27'
  start: 533
  end: 967
  sha256: 4672c96ee7351f1414385fdf28564ac5e70da6e53e849eb04ff9082d6261a817
  text: '2. Where, in the course of that evaluation, the market surveillance authority finds that the
    AI system concerned is high-risk, it shall without undue delay require the relevant provider to take
    all necessary actions to bring the AI system into compliance with the requirements and obligations
    laid down in this Regulation, as well as take appropriate corrective action within a period the market
    surveillance authority may prescribe.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A080-P2-REQUIRE-COMPLIANCE-AND-CORRECTION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: codex
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
