  start: 967
  end: 1280
  sha256: 11877d76f9e85d5296f7905e2658d2e94aee55d294f634c479964284b59370af
  text: '3. Where the market surveillance authority considers that the use of the AI system concerned
    is not restricted to its national territory, it shall inform the Commission and the other Member States
    without undue delay of the results of the evaluation and of the actions which it has required the
    provider to take.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A080-P3-INFORM-CROSS-BORDER-USE
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: codex
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
