  sha256: b3e703bb801dffa30f2ad448a9015e4fb3d82c07bbc25e99684fd68139e2c0f3
  text: '3. The delegation of power referred to in Article 2(13), Article 6(6) and (7), Article 7(1) and
    (3), Article 11(3), Article 30(2), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4)
    and Article 53(5) and (6) may be revoked at any time by the European Parliament or by the Council.
    A decision of revocation shall put an end to the delegation of power specified in that decision. It
    shall take effect the day following that of its publication in the Official Journal of the European
    Union or at a later date specified therein. It shall not affect the validity of any delegated acts
    already in force.

    '
