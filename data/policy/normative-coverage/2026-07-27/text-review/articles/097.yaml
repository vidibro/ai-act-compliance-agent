  text: '2. The power to adopt delegated acts referred to in Article 6(6) and (7), Article 7(1) and (3),
    Article 11(3), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4) and Article 53(5)
    and (6) shall be conferred on the Commission for a period of five years from 1 August 2024. The power
    to adopt delegated acts referred to in Article 2(13) and Article 30(2) shall be conferred on the Commission
    for a period of five years from 27 July 2026. The Commission shall draw up a report in respect of
    the delegation of power not later than nine months before the end of the five-year period. The delegation
    of power shall be tacitly extended for periods of an identical duration, unless the European Parliament
    or the Council opposes such extension no later than three months before the end of each period.

    '
