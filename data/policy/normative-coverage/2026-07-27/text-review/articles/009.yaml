- segment_id: AIA-TEXT-A009-P017
  source:
    kind: article
    document: '9'
    act_version_date: '2026-07-27'
  start: 3251
  end: 3617
  sha256: 5cd76bcb7dd804e964724fc89bca8640bbf1b12f656fd3cad45017c79a6ab07c
  text: '8. The testing of high-risk AI systems shall be performed, as appropriate, at any time throughout
    the development process, and, in any event, prior to their being placed on the market or put into
    service. Testing shall be carried out against prior defined metrics and probabilistic thresholds that
    are appropriate to the intended purpose of the high-risk AI system.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P8-DEVELOPMENT-AND-PRE-MARKET-TESTING
  - AIA-NORM-A009-P8-METRICS-THRESHOLDS
