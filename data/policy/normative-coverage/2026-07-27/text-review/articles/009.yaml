- segment_id: AIA-TEXT-A009-P014
  source:
    kind: article
    document: '9'
    act_version_date: '2026-07-27'
  start: 2552
  end: 2848
  sha256: 27a651d2640afe5702a2c9febecb06c926dccdc2893db453d66abc88e893a053
  text: '    With a view to eliminating or reducing risks related to the use of the high-risk AI system,
    due consideration shall be given to the technical knowledge, experience, education, the training to
    be expected by the deployer, and the presumable context in which the system is intended to be used.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P5-CONSIDER-DEPLOYER-CONTEXT
  qualifying_norm_ids: []
