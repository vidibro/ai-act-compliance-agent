  sha256: 1ff316c80aef199b74a70b6531b9ad31cfe6bdf056e52de6ba55306f0fb8216a
  text: '        (d) the adoption of appropriate and targeted risk management measures designed to address
    the risks identified pursuant to point (a).

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P2-D-ADOPT-MEASURES
  qualifying_norm_ids: []
  review:
