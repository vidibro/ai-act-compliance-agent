- segment_id: AIA-TEXT-A009-P015
  source:
    kind: article
    document: '9'
    act_version_date: '2026-07-27'
  start: 2848
  end: 3153
  sha256: 431baf39f65f80aa35daf9a2f5e3278c38d6742ba17de0c2597bdfa7d18ce9ff
  text: '6. High-risk AI systems shall be tested for the purpose of identifying the most appropriate and
    targeted risk management measures. Testing shall ensure that high-risk AI systems perform consistently
    for their intended purpose and that they are in compliance with the requirements set out in this Section.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P6-TEST-FOR-MEASURES
  - AIA-NORM-A009-P6-TEST-PERFORMANCE-AND-COMPLIANCE
