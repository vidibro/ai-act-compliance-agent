  sha256: 8462030f9648d98a5b50e593fad9be8bff3833549d0e185b8e3b65cc4640fa31
  text: '        (b) where appropriate, implementation of adequate mitigation and control measures addressing
    risks that cannot be eliminated;

    '
  disposition: normative
