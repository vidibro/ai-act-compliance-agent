  end: 1396
  sha256: f5877be6294bf7b44bc7f93bc167d11ec92e758e5460476583d56613b966463d
  text: '3. The risks referred to in this Article shall concern only those which may be reasonably mitigated
    or eliminated through the development or design of the high-risk AI system, or the provision of adequate
    technical information.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P3-MITIGABLE-RISK-SCOPE
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
