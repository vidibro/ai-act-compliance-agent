- segment_id: AIA-TEXT-A009-P019
  source:
    kind: article
    document: '9'
    act_version_date: '2026-07-27'
  start: 3918
  end: 4225
  sha256: e6926e65319308cca43f28c07a9feebf311fde338696e8b4234ec47a53d8c0cd
  text: '10. For providers of high-risk AI systems that are subject to requirements regarding internal
    risk management processes under other relevant provisions of Union law, the aspects provided in paragraphs
    1 to 9 may be part of, or combined with, the risk management procedures established pursuant to that
    law.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P10-INTEGRATE-RISK-PROCESSES
