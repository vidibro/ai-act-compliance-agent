  text: '        (c) the evaluation of other risks possibly arising, based on the analysis of data gathered
    from the post-market monitoring system referred to in Article 72;

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P2-C-POST-MARKET-RISKS
