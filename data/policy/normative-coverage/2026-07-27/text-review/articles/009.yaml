  sha256: 3755ff0cd0ec85802a7270db5d17051fc92deddc40ea07ed9977ccd9ea01507f
  text: '        (a) the identification and analysis of the known and the reasonably foreseeable risks
    that the high-risk AI system can pose to health, safety or fundamental rights when the high-risk AI
    system is used in accordance with its intended purpose;

    '
