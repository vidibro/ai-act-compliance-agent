  end: 2302
  sha256: 4fdd083f2ced5658900259a287d48a833204447bdc7d698111711029a33718e3
  text: '        (a) elimination or reduction of risks identified and evaluated pursuant to paragraph
    2 in as far as technically feasible through adequate design and development of the high-risk AI system;

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P5-A-DESIGN-RISK-REDUCTION
