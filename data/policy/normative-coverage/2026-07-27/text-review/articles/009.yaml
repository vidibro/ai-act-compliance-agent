  sha256: 02cad3ca8da52a57b029cb1e8d463704bc602cb37558f4cabd1b0cd2c2d473c0
  text: '        (c) provision of information required pursuant to Article 13 and, where appropriate,
    training to deployers.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P5-C-PROVIDE-INFORMATION
