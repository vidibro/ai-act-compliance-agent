  text: '5. The risk management measures referred to in paragraph 2, point (d), shall be such that the
    relevant residual risk associated with each hazard, as well as the overall residual risk of the high-risk
    AI systems is judged to be acceptable.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P5-ACCEPTABLE-RESIDUAL-RISK
  qualifying_norm_ids: []
  review:
