  sha256: d985ab4168d87a308be710b58b8b02d806d36b2874a25e376cbee0c375f0df54
  text: '7. Testing procedures may include testing in real-world conditions in accordance with Article
    60.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P7-REAL-WORLD-TESTING
