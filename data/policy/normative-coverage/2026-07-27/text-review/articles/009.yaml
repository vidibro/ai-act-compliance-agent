- segment_id: AIA-TEXT-A009-P018
  source:
    kind: article
    document: '9'
    act_version_date: '2026-07-27'
  start: 3617
  end: 3918
  sha256: bd659a42050599b335e397fef434b83305827b01682d1a0d6a33078b970815be
  text: '9. When implementing the risk management system as provided for in paragraphs 1 to 7, providers
    shall give consideration to whether in view of its intended purpose the high-risk AI system is likely
    to have an adverse impact on persons under the age of 18 and, as appropriate, other vulnerable groups.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A009-P9-VULNERABLE-PERSON-IMPACTS
  qualifying_norm_ids: []
  review:
