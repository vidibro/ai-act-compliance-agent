  text: '3. Codes of conduct may be drawn up by individual providers or deployers of AI systems or by
    organisations representing them or by both, including with the involvement of any interested stakeholders
    and their representative organisations, including civil society organisations and academia. Codes
    of conduct may cover one or more AI systems taking into account the similarity of the intended purpose
    of the relevant systems.

    '
