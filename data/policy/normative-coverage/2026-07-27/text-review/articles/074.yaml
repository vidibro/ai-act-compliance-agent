- segment_id: AIA-TEXT-A074-P012
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 3750
  end: 4555
  sha256: 326b7a9649d0ac2f35fb770d28f6f267acb52f50a35fdcd6426fff1b22282ca9
  text: '8. For high-risk AI systems listed in point 1 of Annex III to this Regulation, in so far as the
    systems are used for law enforcement purposes, border management and justice and democracy, and for
    high-risk AI systems listed in points 6, 7 and 8 of Annex III to this Regulation, Member States shall
    designate as market surveillance authorities for the purposes of this Regulation either the competent
    data protection supervisory authorities under Regulation (EU) 2016/679 or Directive (EU) 2016/680,
    or any other authority designated pursuant to the same conditions laid down in Articles 41 to 44 of
    Directive (EU) 2016/680. Market surveillance activities shall in no way affect the independence of
    judicial authorities, or otherwise interfere with their activities when acting in their judicial capacity.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P8-SENSITIVE-SECTOR-AUTHORITIES
  - AIA-NORM-A074-P8-PRESERVE-JUDICIAL-INDEPENDENCE
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A074-P013
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 4555
  end: 4842
  sha256: abd5057c6437f1462c1ee157e2acf12c5c365c441b1a1dcbe87a3956f7814631
  text: '9. Where Union institutions, bodies, offices or agencies fall within the scope of this Regulation,
    the European Data Protection Supervisor shall act as their market surveillance authority, except in
    relation to the Court of Justice of the European Union acting in its judicial capacity.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P9-EDPS-SURVEILLANCE
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
