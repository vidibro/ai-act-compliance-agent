  sha256: 546bf2aade59e3de1ad2f816e2227fe71c574266d9d6e51a364b13727bcb4a78
  text: '        (a) any reference to an economic operator under Regulation (EU) 2019/1020 shall be understood
    as including all operators identified in Article 2(1) of this Regulation;

    '
  disposition: normative
