- segment_id: AIA-TEXT-A074-P016
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 5862
  end: 6408
  sha256: af1d902ba3a9d7f3bd6a8c32c19b6f03aebd1ffd0a5b2b3fd2ac93c7d4d6332c
  text: '12. Without prejudice to the powers provided for under Regulation (EU) 2019/1020, and where relevant
    and limited to what is necessary to fulfil their tasks, the market surveillance authorities shall
    be granted full access by providers to the documentation as well as the training, validation and testing
    data sets used for the development of high-risk AI systems, including, where appropriate and subject
    to security safeguards, through application programming interfaces (API) or other relevant technical
    means and tools enabling remote access.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P12-GRANT-DOCUMENTATION-AND-DATA-ACCESS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
