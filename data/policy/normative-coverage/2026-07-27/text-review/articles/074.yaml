    elapsed_seconds: null
- segment_id: AIA-TEXT-A074-P014
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 4842
  end: 5200
  sha256: 9104ff0d7a45fc217c45983cc7a3cc52bf46832af529132d75468f2e22ceb799
  text: '10. Member States shall facilitate coordination between market surveillance authorities designated
    under this Regulation and other relevant national authorities or bodies which supervise the application
    of Union harmonisation legislation listed in Annex I, or in other Union law, that might be relevant
    for the high-risk AI systems referred to in Annex III.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P10-FACILITATE-NATIONAL-COORDINATION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
