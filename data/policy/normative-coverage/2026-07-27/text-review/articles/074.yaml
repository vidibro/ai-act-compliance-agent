  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 567
  end: 1094
  sha256: 4ba4f6fa436f539dd1f6c86e6d33b81cc80f898cee2425bca5fd5d71a6523c5a
  text: '2. As part of their reporting obligations under Article 34(4) of Regulation (EU) 2019/1020, the
    market surveillance authorities shall report annually to the Commission and relevant national competition
    authorities any information identified in the course of market surveillance activities that may be
    of potential interest for the application of Union law on competition rules. They shall also annually
    report to the Commission about the use of prohibited practices that occurred during that year and
    about the measures taken.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P2-ANNUAL-SURVEILLANCE-REPORTING
  - AIA-NORM-A074-P2-ANNUAL-PROHIBITED-PRACTICE-REPORTING
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
