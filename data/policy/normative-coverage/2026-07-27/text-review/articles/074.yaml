  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 1094
  end: 1396
  sha256: 4da46d0b36683b9bdc3eb4b940c9605b6db9dbf5b1f52705b42e65705920c812
  text: '3. For high-risk AI systems related to products covered by the Union harmonisation legislation
    listed in Section A of Annex I, the market surveillance authority for the purposes of this Regulation
    shall be the authority responsible for market surveillance activities designated under those legal
    acts.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P3-SECTORAL-SURVEILLANCE-AUTHORITY
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
