- segment_id: AIA-TEXT-A074-P015
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 5200
  end: 5862
  sha256: d4e6c9a9d89aba1f597a396b255f7a9c2dc32f583cc377960c89a253f552a2c8
  text: '11. Market surveillance authorities and the Commission shall be able to propose joint activities,
    including joint investigations, to be conducted by either market surveillance authorities or market
    surveillance authorities jointly with the Commission, that have the aim of promoting compliance, identifying
    non-compliance, raising awareness or providing guidance in relation to this Regulation with respect
    to specific categories of high-risk AI systems that are found to present a serious risk across two
    or more Member States in accordance with Article 9 of Regulation (EU) 2019/1020. The AI Office shall
    provide coordination support for joint investigations.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P11-JOINT-ACTIVITIES
  - AIA-NORM-A074-P11-AI-OFFICE-COORDINATION-SUPPORT
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
