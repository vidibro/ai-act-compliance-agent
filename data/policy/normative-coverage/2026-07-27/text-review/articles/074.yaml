  end: 6758
  sha256: 14d84f00986d82ccb397497a61bde1ed545b723f91a75304adcaa6d9803e45e5
  text: '        (a) access to source code is necessary to assess the conformity of a high-risk AI system
    with the requirements set out in Chapter III, Section 2; and

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P13-GRANT-SOURCE-CODE-ACCESS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
