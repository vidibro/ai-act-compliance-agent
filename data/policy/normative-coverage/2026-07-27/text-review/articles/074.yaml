  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 1758
  end: 2153
  sha256: ab77c372eebbe13101e126c28fc9e351581bb81f4d71799f19a4b42babd829b3
  text: '4. The procedures referred to in Articles 79 to 83 of this Regulation shall not apply to AI systems
    related to products covered by the Union harmonisation legislation listed in section A of Annex I,
    where such legal acts already provide for procedures ensuring an equivalent level of protection and
    having the same objective. In such cases, the relevant sectoral procedures shall apply instead.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P4-USE-EQUIVALENT-SECTORAL-PROCEDURES
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
