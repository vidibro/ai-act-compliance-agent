  start: 6408
  end: 6600
  sha256: cb87e33aa453337ae2c5708648c02d52641cc00b73d496ed5128e112cb18b489
  text: '13. Market surveillance authorities shall be granted access to the source code of the high-risk
    AI system upon a reasoned request and only when both of the following conditions are fulfilled:

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P13-GRANT-SOURCE-CODE-ACCESS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
