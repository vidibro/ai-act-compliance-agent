    elapsed_seconds: null
- segment_id: AIA-TEXT-A074-P008
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 2153
  end: 2495
  sha256: 37db67d948aaa6979c5b27cd83c3b1b8ac9720337669da9c84e3427b5274cf66
  text: '5. Without prejudice to the powers of market surveillance authorities under Article 14 of Regulation
    (EU) 2019/1020, for the purpose of ensuring the effective enforcement of this Regulation, market surveillance
    authorities may exercise the powers referred to in Article 14(4), points (d) and (j), of that Regulation
    remotely, as appropriate.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P5-REMOTE-SURVEILLANCE-POWERS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A074-P009
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 2495
  end: 3000
  sha256: c2cc362f53a36a2b4ad4dc00e356211ef3b1a3577c9de68d231dfad51e1bb8fe
  text: '6. For high-risk AI systems placed on the market, put into service, or used by financial institutions
    regulated by Union financial services law, the market surveillance authority for the purposes of this
    Regulation shall be the relevant national authority responsible for the financial supervision of those
    institutions under that legislation in so far as the placing on the market, putting into service,
    or the use of the AI system is in direct connection with the provision of those financial services.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P6-FINANCIAL-SUPERVISOR-AUTHORITY
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A074-P010
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 3000
  end: 3250
  sha256: f066547a636152245a663018f2212451353f9322001002dd9b89c361edc8dae5
  text: '7. By way of derogation from paragraph 6, in appropriate circumstances, and provided that coordination
    is ensured, another relevant authority may be identified by the Member State as market surveillance
    authority for the purposes of this Regulation.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P7-COORDINATED-FINANCIAL-DEROGATION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A074-P011
  source:
    kind: article
    document: '74'
    act_version_date: '2026-07-27'
  start: 3250
  end: 3750
  sha256: b421226f27e48f43ad73908ae0b5157e053fdcff505161e74445cfc37bf78c9c
  text: '    National market surveillance authorities supervising regulated credit institutions regulated
    under Directive 2013/36/EU, which are participating in the Single Supervisory Mechanism established
    by Regulation (EU) No 1024/2013, should report, without delay, to the European Central Bank any information
    identified in the course of their market surveillance activities that may be of potential interest
    for the prudential supervisory tasks of the European Central Bank specified in that Regulation.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P7-COORDINATED-FINANCIAL-DEROGATION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
