  end: 1758
  sha256: 4c1c3e7e46383ba7e7a379dba6634ae4108a75db5f6c1a9cf6cdaf3657674494
  text: '    By derogation from the first subparagraph, and in appropriate circumstances, Member States
    may designate another relevant authority to act as a market surveillance authority, provided they
    ensure coordination with the relevant sectoral market surveillance authorities responsible for the
    enforcement of the Union harmonisation legislation listed in Annex I.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P3-SECTORAL-SURVEILLANCE-AUTHORITY
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
