  sha256: 6dd5f182b4cd6f543db58a8fb198ff15adadf3936029be57d5d9d5f786e557a7
  text: '        (b) any reference to a product under Regulation (EU) 2019/1020 shall be understood as
    including all AI systems falling within the scope of this Regulation.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A074-P1-APPLY-MARKET-SURVEILLANCE-REGULATION
