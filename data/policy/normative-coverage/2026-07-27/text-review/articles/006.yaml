    elapsed_seconds: null
- segment_id: AIA-TEXT-A006-P003
  source:
    kind: article
    document: '6'
    act_version_date: '2026-07-27'
  start: 500
  end: 837
  sha256: 5c175bee3e681a1f3aa341059ba5d0fca2e736e96c2b1489301630debf7e4f8a
  text: '        (b) the product whose safety component pursuant to point (a) is the AI system, or the
    AI system itself as a product, is required to undergo a third-party conformity assessment, with a
    view to the placing on the market or the putting into service of that product pursuant to the Union
    harmonisation legislation listed in Annex I.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P1-ANNEX-I-HIGH-RISK
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A006-P004
  source:
    kind: article
    document: '6'
    act_version_date: '2026-07-27'
  start: 837
  end: 1131
  sha256: 56e098d48b39b06969c69221507eb2d3ee5418bdf9ba026d721ff5f3d305ed98
  text: '1a. For the purposes of this Regulation, including paragraph 1 of this Article, AI systems that
    are solely used for non-safety related aspects of user assistance, performance optimisation, service
    efficiency, automation or convenience or quality control shall not qualify as safety components.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P1A-NON-SAFETY-ASSISTANCE
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A006-P005
  source:
    kind: article
    document: '6'
    act_version_date: '2026-07-27'
  start: 1131
  end: 1284
  sha256: 1b4e5d254f86fc007c98cdee65278cec4f17b8e0b3dfa9f5b144dc2a597c3ca4
  text: '1b. Notwithstanding paragraph 1a, AI systems the failure or malfunctioning of which would endanger
    health and safety shall qualify as safety components.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P1B-HEALTH-SAFETY-OVERRIDE
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
