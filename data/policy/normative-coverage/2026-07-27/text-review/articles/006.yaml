  sha256: c9cfb417e3cacdd6d8acae7896f7a0e928692c20ae5bda247e30b9c52c0ef134
  text: '        (c) the AI system is intended to detect decision-making patterns or deviations from prior
    decision-making patterns and is not meant to replace or influence the previously completed human assessment,
