  text: '    The first subparagraph shall apply where any of the following conditions is fulfilled:

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P3-INSIGNIFICANT-RISK-EXCEPTION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
