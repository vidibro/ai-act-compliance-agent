- segment_id: AIA-TEXT-A006-P002
  source:
    kind: article
    document: '6'
    act_version_date: '2026-07-27'
  start: 311
  end: 500
  sha256: d7d7f69b8418f79aa27e20408f10af33bd23e092cd15addbe87c3540a1d8d061
  text: '        (a) the AI system is intended to be used as a safety component of a product, or the AI
    system is itself a product, covered by the Union harmonisation legislation listed in Annex I;

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P1-ANNEX-I-HIGH-RISK
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
