  end: 2080
  sha256: a67836efad1cbd3f34e241292402d5f1edfc7a23ebc38cfb8729ac9bc4d7d969
  text: '3. By derogation from paragraph 2, an AI system referred to in Annex III shall not be considered
    to be high-risk where it does not pose a significant risk of harm to the health, safety or fundamental
    rights of natural persons, including by not materially influencing the outcome of decision making.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P3-INSIGNIFICANT-RISK-EXCEPTION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
