  end: 4112
  sha256: f5b03b345b9a6d0cf43c825a0209488ea243a1d16a0d03c3748d52fe18e49b7f
  text: '6. The Commission is empowered to adopt delegated acts in accordance with Article 97 in order
    to amend paragraph 3, second subparagraph, of this Article by adding new conditions to those laid
    down therein, or by modifying them, where there is concrete and reliable evidence of the existence
    of AI systems that fall under the scope of Annex III, but do not pose a significant risk of harm to
    the health, safety or fundamental rights of natural persons.

    '
  disposition: normative
  disposition_reason: ''
