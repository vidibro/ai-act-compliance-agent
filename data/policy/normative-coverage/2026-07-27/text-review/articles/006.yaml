  sha256: 32e3246c8b54c3e4ef9daa3a79d4f1433d7c390270b8d9342f20756ea710045c
  text: '7. The Commission shall adopt delegated acts in accordance with Article 97 in order to amend
    paragraph 3, second subparagraph, of this Article by deleting any of the conditions laid down therein,
    where there is concrete and reliable evidence that this is necessary to maintain the level of protection
    of health, safety and fundamental rights provided for by this Regulation.

    '
