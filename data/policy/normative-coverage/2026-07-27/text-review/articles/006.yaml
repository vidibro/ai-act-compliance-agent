  sha256: 63b9412c5c0d4f42018aa48d910bc201f54b48675c97693cf9622c5a2de257a3
  text: '1. Irrespective of whether an AI system is placed on the market or put into service independently
    of the products referred to in points (a) and (b), that AI system shall be considered to be high-risk
    where both of the following conditions are fulfilled:

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P1-ANNEX-I-HIGH-RISK
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
