  start: 1284
  end: 1637
  sha256: 8adfec6e3542e56615131dfa8cdd975d2973d807bc7fff718dbeffe7a0a93c79
  text: '1c. A product that is required to undergo a third-party conformity assessment solely due to risks
    other than risks to health and safety, in particular risks relating to the distribution of radio spectrum
    or electromagnetic interference that do not affect health and safety, shall not be considered as fulfilling
    the condition in paragraph 1, point (b).

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P1C-NON-SAFETY-ASSESSMENT
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
