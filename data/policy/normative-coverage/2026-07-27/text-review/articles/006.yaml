  end: 4901
  sha256: 48a03952bb8f368ef3cb9a5657fb9d0cf45ce7a3e0d35f78b3434b9bd1e9a8d3
  text: '8. Any amendment to the conditions laid down in paragraph 3, second subparagraph, adopted in
    accordance with paragraphs 6 and 7 of this Article shall not decrease the overall level of protection
    of health, safety and fundamental rights provided for by this Regulation and shall ensure consistency
    with the delegated acts adopted pursuant to Article 7(1), and take account of market and technological
    developments.

    '
  disposition: normative
