  text: "5. The Commission shall, after consulting the European Artificial Intelligence Board (the \u2018\
    \ Board \u2019), and no later than 2 February 2026, provide guidelines specifying the practical implementation\
    \ of this Article in line with Article 96 together with a comprehensive list of practical examples\
    \ of use cases of AI systems that are high-risk and not high-risk.\n"
  disposition: normative
