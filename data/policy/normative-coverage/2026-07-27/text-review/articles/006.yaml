  end: 2736
  sha256: d86224ce68dbe09bf76364af0ad5ed4d3f76709af89c13d8ffa9261fda504721
  text: '        (d) the AI system is intended to perform a preparatory task to an assessment relevant
    for the purposes of the use cases listed in Annex III.

    '
  disposition: normative
