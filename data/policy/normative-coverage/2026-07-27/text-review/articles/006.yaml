  start: 1637
  end: 1781
  sha256: e566cff062fdeadfc92d33ffae7fc249a31d80a8fd5236c35684d9e8069d101b
  text: '2. In addition to the high-risk AI systems referred to in paragraph 1, AI systems referred to
    in Annex III shall be considered to be high-risk.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P2-ANNEX-III-HIGH-RISK
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
