- segment_id: AIA-TEXT-A006-P015
  source:
    kind: article
    document: '6'
    act_version_date: '2026-07-27'
  start: 2920
  end: 3302
  sha256: 07490e97767006958e5c91402c8b191c6061adad05bd0bf74f0413577f1ca992
  text: '4. A provider who considers that an AI system referred to in Annex III is not high-risk shall
    document its assessment before that system is placed on the market or put into service. Such provider
    shall be subject to the registration obligation set out in Article 49(2). Upon request of national
    competent authorities, the provider shall provide the documentation of the assessment.

    '
  disposition: normative
  disposition_reason: ''
