  sha256: ab6501b9df58ccc5bea83da331d423b5db569ebffbb4fb184e02f87b62c3675d
  text: '    Notwithstanding the first subparagraph, an AI system referred to in Annex III shall always
    be considered to be high-risk where the AI system performs profiling of natural persons.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A006-P3-PROFILING-OVERRIDE
