  start: 615
  end: 828
  sha256: 3eba66c655698db421c2ab77c4ce878f31bb7159264892f7953e4ae9f9765888
  text: '3. The oversight measures shall be commensurate with the risks, level of autonomy and context
    of use of the high-risk AI system, and shall be ensured through either one or both of the following
    types of measures:

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A014-P3-COMMENSURATE-MEASURES
  - AIA-NORM-A014-P3-MEASURE-ROUTES
  review:
    status: approved
