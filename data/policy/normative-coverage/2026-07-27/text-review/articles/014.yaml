  start: 258
  end: 615
  sha256: 5676dc2afeb8d34f905bc97460baa17cccc7628fab6f8b088d69aea5abb8d67c
  text: '2. Human oversight shall aim to prevent or minimise the risks to health, safety or fundamental
    rights that may emerge when a high-risk AI system is used in accordance with its intended purpose
    or under conditions of reasonably foreseeable misuse, in particular where such risks persist despite
    the application of other requirements set out in this Section.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A014-P2-RISK-PREVENTION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
