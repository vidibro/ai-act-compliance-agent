  sha256: 0f27ede2bc2d1c69800ab512394cb78a33434f8196cf989a56fdc674f3abcb55
  text: '    The requirement for a separate verification by at least two natural persons shall not apply
    to high-risk AI systems used for the purposes of law enforcement, migration, border control or asylum,
    where Union or national law considers the application of this requirement to be disproportionate.

    '
  disposition: normative
  disposition_reason: ''
