  end: 2913
  sha256: 870b224fac5c0b2186d363d1a40a28769d5685a024ef4eddb803ddb7fac579ac
  text: '5. For high-risk AI systems referred to in point 1(a) of Annex III, the measures referred to
    in paragraph 3 of this Article shall be such as to ensure that, in addition, no action or decision
    is taken by the deployer on the basis of the identification resulting from the system unless that
    identification has been separately verified and confirmed by at least two natural persons with the
    necessary competence, training and authority.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A014-P5-TWO-PERSON-VERIFICATION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
