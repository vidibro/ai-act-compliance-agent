  end: 998
  sha256: 3b358f59f9e32e35c842ab992bb0d08690eec0fa921de27d796e9bdbeecdaaa9
  text: '        (a) measures identified and built, when technically feasible, into the high-risk AI system
    by the provider before it is placed on the market or put into service;

    '
