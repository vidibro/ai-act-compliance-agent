  sha256: 27ff5e000b72863d4431c19e25ce0e37f5d468a0371dc11ffcf1aef9e2fd7cfe
  text: '2. Providers of general-purpose AI models with systemic risk may rely on codes of practice within
    the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph 1 of
    this Article, until a harmonised standard is published. Compliance with European harmonised standards
    grants providers the presumption of conformity to the extent that those standards cover those obligations.
    Providers of general-purpose AI models with systemic risks who do not adhere to an approved code of
    practice or do not comply with a European harmonised standard shall demonstrate alternative adequate
    means of compliance for assessment by the Commission.

    '
  disposition: normative
