  sha256: 248ce97d7ba8af9043ac4eaf3f68945c5c510abf5f67e9d983c1692d86d71d39
  text: '        (f) that AI regulatory sandboxes facilitate the involvement of other relevant actors
    within the AI ecosystem, such as notified bodies and standardisation organisations, SMEs, including
    start-ups, enterprises, innovators, testing and experimentation facilities, research and experimentation
    labs and European Digital Innovation Hubs, centres of excellence, individual researchers, in order
    to allow and facilitate cooperation with the public and private sectors;

    '
