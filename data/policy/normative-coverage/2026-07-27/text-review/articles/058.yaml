  start: 3039
  end: 3656
  sha256: af833089fcdc4d47457128221c4722d033abbec8b6941578635dab86d5a54598
  text: '        (g) that procedures, processes and administrative requirements for application, selection,
    participation and exiting the AI regulatory sandbox are simple, easily intelligible, and clearly communicated
    in order to facilitate the participation of SMEs, including start-ups, with limited legal and administrative
    capacities and are streamlined across the Union, in order to avoid fragmentation and that participation
    in an AI regulatory sandbox established by a Member State, or by the European Data Protection Supervisor
    is mutually and uniformly recognised and carries the same legal effects across the Union;

    '
