    act_version_date: '2026-07-27'
  start: 4607
  end: 5150
  sha256: 85f8864b952e919a8ad53415149210c83cc8f24f92038e603c62023934023795
  text: '4. Where national competent authorities consider authorising testing in real world conditions
    supervised within the framework of an AI regulatory sandbox to be established under this Article,
    they shall specifically agree the terms and conditions of such testing and, in particular, the appropriate
    safeguards with the participants, with a view to protecting fundamental rights, health and safety.
    Where appropriate, they shall cooperate with other national competent authorities with a view to ensuring
    consistent practices across the Union.

    '
