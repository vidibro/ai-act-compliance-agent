  end: 666
  sha256: e794dbcb933c4d83f7ccb8bade2731f530a57009384bdd87e02b51acbccded22
  text: '3. The CE marking shall be affixed visibly, legibly and indelibly for high-risk AI systems. Where
    that is not possible or not warranted on account of the nature of the high-risk AI system, it shall
    be affixed to the packaging or to the accompanying documentation, as appropriate.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A048-P3-AFFIX-CE-MARKING
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
