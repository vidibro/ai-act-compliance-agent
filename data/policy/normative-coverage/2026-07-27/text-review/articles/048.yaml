    elapsed_seconds: null
- segment_id: AIA-TEXT-A048-P004
  source:
    kind: article
    document: '48'
    act_version_date: '2026-07-27'
  start: 666
  end: 1184
  sha256: 2b22c6debc46134ebeafd29977d889363d3f1dca507b6ede5f16eadc23c099d6
  text: "4. Where applicable, the CE marking shall be followed by the identification number of the notified\
    \ body responsible for the conformity assessment procedures set out in Article 43. The identification\
    \ number of the notified body shall be affixed by the body itself or, under its instructions, by the\
    \ provider or by the provider\u2019s authorised representative. The identification number shall also\
    \ be indicated in any promotional material which mentions that the high-risk AI system fulfils the\
    \ requirements for CE marking.\n"
  disposition: normative
