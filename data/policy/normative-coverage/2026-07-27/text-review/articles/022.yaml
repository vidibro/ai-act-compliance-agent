  end: 1076
  sha256: efec68a9a9fba93076d8be1ce4d58d0eb58da6a44a907c503ef9d124a0e62e01
  text: '3. The authorised representative shall perform the tasks specified in the mandate received from
    the provider. It shall provide a copy of the mandate to the market surveillance authorities upon request,
    in one of the official languages of the institutions of the Union, as indicated by the competent authority.
    For the purposes of this Regulation, the mandate shall empower the authorised representative to carry
    out the following tasks: The mandate shall empower the authorised representative to be addressed,
    in addition to or instead of the provider, by the competent authorities, on all issues related to
    ensuring compliance with this Regulation.

    '
  disposition: normative
