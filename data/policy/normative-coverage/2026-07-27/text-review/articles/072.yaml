  sha256: 6c4f50288305384135a8e17d296c8da6dd56bfc0d1d7eeba1d8d0b6c4254f725
  text: '3. The post-market monitoring system shall be based on a post-market monitoring plan. The post-market
    monitoring plan shall be part of the technical documentation referred to in Annex IV. The Commission,
    taking utmost account of the opinion of the Board, shall adopt guidance, including a template, on
    the post-market monitoring plan by 2 September 2027.

    '
