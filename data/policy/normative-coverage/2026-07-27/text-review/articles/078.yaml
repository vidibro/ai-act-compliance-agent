- segment_id: AIA-TEXT-A078-P009
  source:
    kind: article
    document: '78'
    act_version_date: '2026-07-27'
  start: 2561
  end: 3189
  sha256: 070749fc04725ad184642b9175a2bd2e3e7c5f1f476c46e6881ae08b10fbdf91
  text: '    When the law enforcement, immigration or asylum authorities are providers of high-risk AI
    systems referred to in point 1, 6 or 7 of Annex III, the technical documentation referred to in Annex
    IV shall remain within the premises of those authorities. Those authorities shall ensure that the
    market surveillance authorities referred to in Article 74(8) and (9), as applicable, can, upon request,
    immediately access the documentation or obtain a copy thereof. Only staff of the market surveillance
    authority holding the appropriate level of security clearance shall be allowed to access that documentation
    or any copy thereof.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A078-P3-KEEP-DOCUMENTATION-AND-ENABLE-ACCESS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: codex
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
