  sha256: dabf03a4e69f077154b0409ec300e95a769fa6c2cb113153d4dba2838662157a
  text: '2. The authorities involved in the application of this Regulation pursuant to paragraph 1 shall
    request only data that is strictly necessary for the assessment of the risk posed by AI systems and
    for the exercise of their powers in accordance with this Regulation and with Regulation (EU) 2019/1020.
    They shall put in place adequate and effective cybersecurity measures to protect the security and
    confidentiality of the information and data obtained, and shall delete the data collected as soon
    as it is no longer needed for the purpose for which it was obtained, in accordance with applicable
    Union or national law.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
