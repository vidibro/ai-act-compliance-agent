  end: 3618
  sha256: 7d415482179535fd83f9431801a854473c9e8c3e6090dd31dc0648a90bc2cd98
  text: '4. Paragraphs 1, 2 and 3 shall not affect the rights or obligations of the Commission, Member
    States and their relevant authorities, as well as those of notified bodies, with regard to the exchange
    of information and the dissemination of warnings, including in the context of cross-border cooperation,
    nor shall they affect the obligations of the parties concerned to provide information under criminal
    law of the Member States.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A078-P4-PRESERVE-EXCHANGE-AND-CRIMINAL-LAW-DUTIES
  review:
