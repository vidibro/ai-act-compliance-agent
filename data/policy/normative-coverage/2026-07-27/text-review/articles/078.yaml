  - AIA-NORM-A078-P2-PROTECT-OBTAINED-DATA
  - AIA-NORM-A078-P2-DELETE-UNNEEDED-DATA
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: codex
    review_run_id: normative-coverage-2026-08-28
