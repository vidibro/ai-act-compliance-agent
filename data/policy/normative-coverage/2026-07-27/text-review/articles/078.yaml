- segment_id: AIA-TEXT-A078-P008
  source:
    kind: article
    document: '78'
    act_version_date: '2026-07-27'
  start: 1848
  end: 2561
  sha256: e6b78004bec69a1aee62dfaafb76a50d8d85a414a9b97b75e388d08d08b78e3b
  text: '3. Without prejudice to paragraphs 1 and 2, information exchanged on a confidential basis between
    the national competent authorities or between national competent authorities and the Commission shall
    not be disclosed without prior consultation of the originating national competent authority and the
    deployer when high-risk AI systems referred to in point 1, 6 or 7 of Annex III are used by law enforcement,
    border control, immigration or asylum authorities and when such disclosure would jeopardise public
    and national security interests. This exchange of information shall not cover sensitive operational
    data in relation to the activities of law enforcement, border control, immigration or asylum authorities.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A078-P3-RESTRICT-CONFIDENTIAL-DISCLOSURE
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: codex
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
