- segment_id: AIA-TEXT-A046-P005
  source:
    kind: article
    document: '46'
    act_version_date: '2026-07-27'
  start: 2234
  end: 3045
  sha256: f1cdd12be430eacde348d6172c896338579ef9ac4e9de0821ef667982467b144
  text: '5. Where, within 15 calendar days of receipt of the notification referred to in paragraph 3,
    objections are raised by a Member State against an authorisation issued by a market surveillance authority
    of another Member State, or where the Commission considers the authorisation to be contrary to Union
    law, or the conclusion of the Member States regarding the compliance of the system as referred to
    in paragraph 3 to be unfounded, the Commission shall, without delay, enter into consultations with
    the relevant Member State. The operators concerned shall be consulted and have the possibility to
    present their views. Having regard thereto, the Commission shall decide whether the authorisation
    is justified. The Commission shall address its decision to the Member State concerned and to the relevant
    operators.

    '
  disposition: normative
  disposition_reason: ''
