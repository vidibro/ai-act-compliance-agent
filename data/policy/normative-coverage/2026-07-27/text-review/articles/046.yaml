  text: '4. Where, within 15 calendar days of receipt of the information referred to in paragraph 3, no
    objection has been raised by either a Member State or the Commission in respect of an authorisation
    issued by a market surveillance authority of a Member State in accordance with paragraph 1, that authorisation
    shall be deemed justified.

    '
