- segment_id: AIA-TEXT-A046-P002
  source:
    kind: article
    document: '46'
    act_version_date: '2026-07-27'
  start: 775
  end: 1440
  sha256: 6451dd3fcbabfd82a4e1ad7292b4b65379210b9e221aca3120806eb0d251e404
  text: '2. In a duly justified situation of urgency for exceptional reasons of public security or in
    the case of specific, substantial and imminent threat to the life or physical safety of natural persons,
    law-enforcement authorities or civil protection authorities may put a specific high-risk AI system
    into service without the authorisation referred to in paragraph 1, provided that such authorisation
    is requested during or after the use without undue delay. If the authorisation referred to in paragraph
    1 is refused, the use of the high-risk AI system shall be stopped with immediate effect and all the
    results and outputs of such use shall be immediately discarded.

    '
  disposition: normative
  disposition_reason: ''
