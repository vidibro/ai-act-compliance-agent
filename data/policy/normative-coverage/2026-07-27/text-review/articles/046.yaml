  sha256: dd8ac9c0491be89ca914aa0d908c48d647dd73f7dd9079d97f67e09043ac4708
  text: '1. By way of derogation from Article 43 and upon a duly justified request, any market surveillance
    authority may authorise the placing on the market or the putting into service of specific high-risk
    AI systems within the territory of the Member State concerned, for exceptional reasons of public security
    or the protection of life and health of persons, environmental protection or the protection of key
    industrial and infrastructural assets. That authorisation shall be for a limited period while the
    necessary conformity assessment procedures are being carried out, taking into account the exceptional
    reasons justifying the derogation. The completion of those procedures shall be undertaken without
    undue delay.

    '
  disposition: normative
  disposition_reason: ''
