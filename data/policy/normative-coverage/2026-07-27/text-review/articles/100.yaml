  sha256: 85e5cecedaae9cbdea8160de105e3d8d1b5e4fd5d910584bb50cbc4daf965deb
  text: '4. Before taking decisions pursuant to this Article, the European Data Protection Supervisor
    shall give the Union institution, body, office or agency which is the subject of the proceedings conducted
    by the European Data Protection Supervisor the opportunity of being heard on the matter regarding
    the possible infringement. The European Data Protection Supervisor shall base his or her decisions
    only on elements and circumstances on which the parties concerned have been able to comment. Complainants,
    if any, shall be associated closely with the proceedings.

    '
  disposition: normative
