- segment_id: AIA-TEXT-A075A-P014
  source:
    kind: article
    document: 75a
    act_version_date: '2026-07-27'
  start: 4854
  end: 6175
  sha256: fb4e68fc7b2ea2cc74b8274e4968ed95e5ce1de1f64b9ea2a3aca131b924c3d0
  text: '    Where an on-site inspection of business premises, land or property requires authorisation
    by a judicial authority in accordance with national law, the AI Office shall apply for such an authorisation.
    The AI Office may also apply for such authorisation as a precautionary measure. Where such an authorisation
    is applied for, the national judicial authority shall promptly verify that the coercive measures envisaged
    are neither arbitrary nor excessive having regard to the subject matter of the investigation or inspection
    and the documents provided by the AI Office with the decision. In its verification of the proportionality
    of coercive measures, the national judicial authority may ask the AI Office for detailed explanations,
    in particular relating to the grounds the AI Office has for suspecting that an infringement of this
    Regulation has taken place and the seriousness of the suspected infringement and, where relevant,
    the nature of the involvement of the person subject to the coercive measures. The national judicial
    authority shall not review the necessity of the investigation or inspection nor demand information
    from the case file of the AI Office. In accordance with the Treaties, the legality of the decision
    of the AI Office is subject to review only by the Court of Justice of the European Union.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075A-P4-APPLY-JUDICIAL-AUTHORISATION
  - AIA-NORM-A075A-P4-JUDICIAL-AUTHORISATION-REVIEW
  review:
