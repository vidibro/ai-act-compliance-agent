  sha256: 3007b2372ad75924157da0f82778e508b3b5d87c01326d2a129cb4ac0a06fdd3
  text: '5. At the request of the AI Office, the competent market surveillance authority of a Member State
    may in its own territory carry out any investigation, inspection or other fact-finding measure on
    behalf and for the account of the AI Office in order to establish whether there has been an infringement
    of this Regulation. The officials of the competent authorities of the Member States who are responsible
    for conducting such investigations, inspections, or fact-finding measures, as well as those authorised
    or appointed by them, shall exercise their powers in accordance with their national law.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075A-P5-MSA-FACT-FINDING
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
