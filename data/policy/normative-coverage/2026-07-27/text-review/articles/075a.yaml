  sha256: d6628ed8edbe536da23f0b70e738d29e9abb08adc52992abf6e70ae198e039d2
  text: '3. The AI Office may exercise the powers listed in Article 14(4), points (a), (b) and (c) of
    Regulation (EU) 2019/1020 and Article 74(12) and (13) of this Regulation by simple request or by decision.

    '
  disposition: normative
  disposition_reason: ''
