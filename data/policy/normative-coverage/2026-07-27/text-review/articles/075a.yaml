- segment_id: AIA-TEXT-A075A-P005
  source:
    kind: article
    document: 75a
    act_version_date: '2026-07-27'
  start: 1881
  end: 2916
  sha256: 9cc3c1f840ed4d84e224b54caf4956c242c5d59c96684f951429d259a1e68872
  text: '    When requesting information, the AI Office shall state the legal basis and the purpose of
    the request, specify what information is required, and set the period within which the information
    is to be provided. Where the request is a simple request, the AI Office shall additionally indicate
    that although there is no obligation to provide the information requested, in the case of a voluntary
    reply, the information must be correct and not misleading, and indicate the potential fines provided
    for in Article 99(5) for supplying incorrect or misleading information. Where the request is made
    by decision, the AI Office shall additionally indicate the fines provided for in Article 99(5) for
    supplying incorrect, incomplete or misleading information and indicate the right to have the decision
    reviewed by the Court of Justice of the European Union. The AI Office shall send a copy of the request
    to the market surveillance authority of the Member State in the territory of which the operator or
    its legal representative is situated.

    '
  disposition: normative
  disposition_reason: ''
