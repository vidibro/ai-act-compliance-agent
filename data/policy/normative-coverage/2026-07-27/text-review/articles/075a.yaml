  end: 7805
  sha256: 7fc7ec655fc421c15542192653fa3355b0f5b9be0993fc692327dec47aa54b52
  text: "7. To assist it in monitoring the effective implementation and compliance with the relevant provisions\
    \ of this Regulation and to provide it with specific expertise or knowledge in the exercise of its\
    \ competences under Article 75(1), the AI Office may appoint independent external experts and auditors,\
    \ as well as experts, investigative teams and auditors from the Member State\u2019s competent authorities\
    \ with the agreement of the authority concerned. Information obtained as a result of such monitoring\
    \ actions shall be shared with the relevant competent authorities of the Member States.\n"
