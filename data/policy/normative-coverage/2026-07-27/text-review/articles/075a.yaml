  sha256: 0f9853ba26227c6827dd72352c7fc246bdee816f6fcea5eb9124d6d5687f5fa9
  text: '4. In order to carry out the tasks assigned to it under this Section, the AI Office may conduct
    all necessary remote or on-site inspections pursuant to the powers laid down in Article 14(4), points
    (d) and (e) of Regulation (EU) 2019/1020 and Article 74(5) of this Regulation. When conducting an
    inspection, the AI Office shall inform the provider concerned of the subject matter and purpose of
    the investigation, the relevant fines referred to in Article 99(5) of this Regulation, and the right
    to have the decision reviewed by the Court of Justice of the European Union. Prior to conducting an
    inspection, the AI Office shall inform the market surveillance authority of the Member State in the
    territory of which the operator or its legal representative is situated.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075A-P4-CONDUCT-INSPECTIONS
  - AIA-NORM-A075A-P4-INSPECTION-NOTICES
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
