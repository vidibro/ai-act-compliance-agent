  sha256: ddd0810c128d3f438a838ba4037abcb510e5d92fbbc35968427ba3dc9a0cda37
  text: '1. When exercising its tasks of supervision and enforcement laid down in Article 75(1) of this
    Regulation, the AI Office shall have all the powers of a market surveillance authority provided for
    in this Section and in Article 14(4) and Article 16(3) of Regulation (EU) 2019/1020. The AI Office
    shall be authorised to fully reclaim from the relevant operator the totality of the costs of its supervision
    and enforcement activities with respect to instances of non-compliance, including costs for human
    and technical resources, in accordance with Article 15 of Regulation (EU) 2019/1020. Article 17 of
    Regulation (EU) 2019/1020 shall apply mutatis mutandis.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
