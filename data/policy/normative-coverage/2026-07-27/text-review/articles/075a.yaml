  sha256: 2847aae7d82478d57d0e987e5f8d7f88c7ce997db8f6b4fbe524954e1e057137
  text: '2. Where the AI Office has reasonable grounds to suspect non-compliance with this Regulation
    by a provider or a deployer of an AI system referred to in Article 75(1) of this Regulation, it may
    adopt a decision to start an investigation into that non-compliance in accordance with Article 14(4),
    point (f) of Regulation (EU) 2019/1020. Upon starting such an investigation, the AI Office shall notify
    the operator of the AI system concerned. The AI Office may exercise the powers referred to in paragraph
    1 of this Article on its own initiative or following a complaint received pursuant to Article 85 of
    this Regulation, even before starting an investigation pursuant to Article 14(4), point (f) of Regulation
    (EU) 2019/1020.

    '
  disposition: normative
  disposition_reason: ''
