  sha256: 737354a72be7028c678f14cb84899ab37a085f6abc38667d4fc5669bd05c2863
  text: '4. The conformity assessment body concerned may perform the activities of a notified body only
    where no objections are raised by the Commission or the other Member States within two weeks of a
    notification by a notifying authority where it includes an accreditation certificate referred to in
    Article 29(2), or within two months of a notification by the notifying authority where it includes
    documentary evidence referred to in Article 29(3).

    '
