  text: '3. The notification referred to in paragraph 2 of this Article shall include full details of
    the conformity assessment activities, the conformity assessment module or modules, the types of AI
    systems concerned, and the relevant attestation of competence. Where a notification is not based on
    an accreditation certificate as referred to in Article 29(2), the notifying authority shall provide
    the Commission and the other Member States with documentary evidence which attests to the competence
    of the conformity assessment body and to the arrangements in place to ensure that that body will be
    monitored regularly and will continue to satisfy the requirements laid down in Article 31.

    '
  disposition: normative
