- segment_id: AIA-TEXT-A036-P016
  source:
    kind: article
    document: '36'
    act_version_date: '2026-07-27'
  start: 4332
  end: 5291
  sha256: 9ff4fdd4add9edfb0f415720528c720b9e09777d09f82d7bb1a06055271fd0be
  text: '        (b) the notifying authority has confirmed that no certificates relevant to the suspension
    will be issued, amended or re-issued during the course of the suspension or restriction, and states
    whether the notified body has the capability of continuing to monitor and remain responsible for existing
    certificates issued for the period of the suspension or restriction; in the event that the notifying
    authority determines that the notified body does not have the capability to support existing certificates
    issued, the provider of the system covered by the certificate shall confirm in writing to the national
    competent authorities of the Member State in which it has its registered place of business, within
    three months of the suspension or restriction, that another qualified notified body is temporarily
    assuming the functions of the notified body to monitor and remain responsible for the certificates
    during the period of suspension or restriction.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A036-P8-B-PROVIDER-REPLACEMENT-CONFIRMATION
