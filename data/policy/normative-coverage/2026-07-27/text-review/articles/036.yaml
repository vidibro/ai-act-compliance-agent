  end: 2201
  sha256: 622c9e9140522c8a2dc73d31a57196eef17e055c48e8049f63b3797048485c71
  text: '4. Where a notifying authority has sufficient reason to consider that a notified body no longer
    meets the requirements laid down in Article 31, or that it is failing to fulfil its obligations, the
    notifying authority shall without delay investigate the matter with the utmost diligence. In that
    context, it shall inform the notified body concerned about the objections raised and give it the possibility
    to make its views known. If the notifying authority comes to the conclusion that the notified body
    no longer meets the requirements laid down in Article 31 or that it is failing to fulfil its obligations,
    it shall restrict, suspend or withdraw the designation as appropriate, depending on the seriousness
    of the failure to meet those requirements or fulfil those obligations. It shall immediately inform
    the Commission and the other Member States accordingly.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A036-P4-INVESTIGATE-FAILURE
