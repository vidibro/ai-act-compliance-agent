  end: 4332
  sha256: b501b11ac18e656eb17dec7682ccc0edb645e8932ecb4fe9bae304663d30ad55
  text: '        (a) the notifying authority has confirmed, within one month of the suspension or restriction,
    that there is no risk to health, safety or fundamental rights in relation to certificates affected
    by the suspension or restriction, and the notifying authority has outlined a timeline for actions
    to remedy the suspension or restriction; or

    '
  disposition: normative
  disposition_reason: ''
