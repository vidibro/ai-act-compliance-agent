- segment_id: AIA-TEXT-A017-P017
  source:
    kind: article
    document: '17'
    act_version_date: '2026-07-27'
  start: 3263
  end: 3828
  sha256: d41d3cac84501cac7b0999fbed08417d53d7e5772289a62c91b9fb6500ee0a54
  text: '4. For providers that are financial institutions subject to requirements regarding their internal
    governance, arrangements or processes under Union financial services law, the obligation to put in
    place a quality management system, with the exception of paragraph 1, points (g), (h) and (i) of this
    Article, shall be deemed to be fulfilled by complying with the rules on internal governance arrangements
    or processes pursuant to the relevant Union financial services law. To that end, any harmonised standards
    referred to in Article 40 shall be taken into account.

    '
  disposition: normative
  disposition_reason: ''
