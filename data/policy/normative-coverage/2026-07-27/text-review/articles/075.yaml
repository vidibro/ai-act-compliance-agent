  end: 4549
  sha256: fcc60b0568576d9ce251ab650abf4246b2eb3dfb9ec95722cfbf43251c57156d
  text: '    The fees for testing and assessment activities shall be levied on the provider of a high-risk
    AI system who has applied for a third-party conformity assessment to the Commission. The provider
    shall pay the costs related to the services entrusted by the Commission to the notified bodies in
    accordance with this Article directly to the notified body.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075-P1E-FEES
  - AIA-NORM-A075-P1E-PAY
  review:
    status: approved
