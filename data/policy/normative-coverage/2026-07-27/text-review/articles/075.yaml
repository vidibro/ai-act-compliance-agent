- segment_id: AIA-TEXT-A075-P021
  source:
    kind: article
    document: '75'
    act_version_date: '2026-07-27'
  start: 6218
  end: 6763
  sha256: 0199b1067134547b9d74c0bbec921577a2600a90f98e1e0d61273db5f510cc11
  text: '    The AI Office shall, without undue delay and in any event no later than four months following
    receipt of the request, inform the single point of contact of its intention to exercise its powers
    in accordance with Article 75a or of its reasons for not exercising its powers. If the AI Office decides
    to exercise its powers in accordance with Article 75a, it shall periodically inform that single point
    of contact about major developments in the proceedings and the outcome of such proceedings, without
    disclosing any confidential information.

    '
  disposition: normative
  disposition_reason: ''
