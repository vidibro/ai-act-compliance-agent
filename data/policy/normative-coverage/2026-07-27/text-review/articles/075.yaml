    elapsed_seconds: null
- segment_id: AIA-TEXT-A075-P013
  source:
    kind: article
    document: '75'
    act_version_date: '2026-07-27'
  start: 3267
  end: 4195
  sha256: 15810fa103e32545323efc061cbd1d0772f3ed3c3fd87f28b5b52f827e146390
  text: '1e. The AI Office shall be responsible for conformity assessments and tests of AI systems referred
    to in paragraph 1 of this Article that are classified as high-risk and subject to a third-party conformity
    assessment pursuant to Article 43 before such AI systems are placed on the market or put into service.
    Those tests and assessments shall verify that the systems comply with the relevant requirements of
    this Regulation and may be placed on the market or put into service in the Union in accordance with
    this Regulation. The Commission shall entrust the performance of those tests or assessments to notified
    bodies designated in accordance with this Regulation, in which case the notified body shall act on
    behalf of the Commission. If a notified body to which the Commission has delegated tasks under this
    paragraph does not perform those tasks adequately, the Commission may withdraw the delegation with
    immediate effect.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075-P1E-RESPONSIBLE
  - AIA-NORM-A075-P1E-VERIFY
  - AIA-NORM-A075-P1E-ENTRUST
  - AIA-NORM-A075-P1E-ACT
  - AIA-NORM-A075-P1E-WITHDRAW
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
