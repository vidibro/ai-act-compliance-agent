- segment_id: AIA-TEXT-A075-P012
  source:
    kind: article
    document: '75'
    act_version_date: '2026-07-27'
  start: 2696
  end: 3267
  sha256: 468148fb9a51d831c10e2e67edfce84d86595c5e0bcb9301b8a4cddd7de40349
  text: '1d. Before taking a decision that would have the effect of prohibiting or restricting the AI
    system being made available or put into service on a national market, or a decision to withdraw or
    recall the AI system from such market, the AI Office shall, without undue delay, notify the market
    surveillance authority competent for that market of its intention to take such a decision. The AI
    Office shall consult the authorities involved in the application of this Regulation, where appropriate,
    on any matter relating to the application and enforcement of this Regulation.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075-P1D-NOTIFY-MARKET-AUTHORITY
  - AIA-NORM-A075-P1D-CONSULT-AUTHORITIES
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
