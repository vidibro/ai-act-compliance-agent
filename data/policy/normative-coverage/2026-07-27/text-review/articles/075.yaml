  start: 3267
  end: 4549
  sha256: cd2bf60457dbab1643df08ca3a6759f5f735009e37e4ca6c51ef62856268ee99
  text: "1e. The AI Office shall be responsible for conformity assessments and tests of AI systems referred\
    \ to in paragraph 1 of this Article that are classified as high-risk and subject to a third-party\
    \ conformity assessment pursuant to Article 43 before such AI systems are placed on the market or\
    \ put into service. Those tests and assessments shall verify that the systems comply with the relevant\
    \ requirements of this Regulation and may be placed on the market or put into service in the Union\
    \ in accordance with this Regulation. The Commission shall entrust the performance of those tests\
    \ or assessments to notified bodies designated in accordance with this Regulation, in which case the\
    \ notified body shall act on behalf of the Commission. If a notified body to which the Commission\
    \ has delegated tasks under this paragraph does not perform those tasks adequately, the Commission\
    \ may withdraw the delegation with immediate effect.\n    The fees for testing and assessment activities\
    \ shall be levied on the provider of a high-risk AI system who has applied for a third-party conformity\
    \ assessment to the Commission. The provider shall pay the costs related to the services entrusted\
    \ by the Commission to the notified bodies in accordance with this Article directly to the notified\
    \ body.\n"
  disposition: normative
  disposition_reason: ''
