  start: 2466
  end: 2696
  sha256: 6fbb6def333882f29f8d1c5c0172c3c06a155d8165ee95dd714dbc7bbf3b0313
  text: "1c. When taking investigatory or enforcement action in the territory of a Member State that involves\
    \ access to a public authority\u2019s data or AI system, the AI Office shall be assisted by the relevant\
    \ market surveillance authority.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075-P1C-ASSIST-PUBLIC-DATA-ACTION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
