- segment_id: AIA-TEXT-A075-P022
  source:
    kind: article
    document: '75'
    act_version_date: '2026-07-27'
  start: 6763
  end: 7644
  sha256: ac08b5e713141f250a439d60778c95231f00a4aa4e511fbbbb23963ecfa3a243
  text: '3. Where a market surveillance authority is unable to conclude its investigation of the high-risk
    AI system because of its inability to access certain information related to the general-purpose AI
    model despite having made all appropriate efforts to obtain that information, it may submit a reasoned
    request to the AI Office, by which access to that information shall be enforced. In that case, the
    AI Office shall supply to the applicant authority without delay, and in any event within 30 days,
    any information that the AI Office considers to be relevant in order to establish whether a high-risk
    AI system is non-compliant. Market surveillance authorities shall safeguard the confidentiality of
    the information that they obtain in accordance with Article 78 of this Regulation. The procedure provided
    for in Chapter VI of Regulation (EU) 2019/1020 shall apply mutatis mutandis.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075-P3-REQUEST-INFORMATION-ACCESS
