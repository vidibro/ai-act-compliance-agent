  sha256: e390dd1d8674fba33a69787fb82e5b8dcdcb231b0a3fd3fabb3b0da0302516c6
  text: '    The exclusive competence referred to in the first subparagraph shall apply to the providers
    of those systems. It shall apply to the deployers of those systems only when they are also the provider
    or form part of the same undertaking as the provider.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A075-P1-COMPETENCE-ADDRESSEES
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
