- segment_id: AIA-TEXT-A075-P2A
  source:
    kind: article
    document: '75'
    act_version_date: '2026-07-27'
  start: 5020
  end: 6763
  sha256: dc0d6564fe22b5f148eb2c1e4ca6df825c7098675fbf8a7a311d5f690a5cb46a
  text: "2a. Where a market surveillance authority has well-founded and sufficient reasons to suspect\
    \ that a provider or a deployer of an AI system referred to in paragraph 1 of this Article has infringed\
    \ this Regulation, it may request, through the relevant single point of contact designated in accordance\
    \ with Article 70(2), the AI Office to assess the matter in order to take the necessary supervisory\
    \ and enforcement measures to ensure prompt compliance with this Regulation. Such a request shall\
    \ be duly reasoned and shall include at least:\n        (a) the name of the provider or the deployer\
    \ concerned;\n        (b) a description of the relevant facts, the provisions of this Regulation that\
    \ have allegedly been infringed, and any well-founded and sufficient reasons for suspecting an infringement,\
    \ including, where applicable, the description of the negative effects of the alleged infringement;\n\
    \        (c) the market surveillance authority making the request.\n    The AI Office shall take utmost\
    \ account of the request and the market surveillance authority shall cooperate actively and provide\
    \ the AI Office the necessary assistance for the exercise of its powers in accordance with paragraph\
    \ 1a.\n    The AI Office shall, without undue delay and in any event no later than four months following\
    \ receipt of the request, inform the single point of contact of its intention to exercise its powers\
    \ in accordance with Article 75a or of its reasons for not exercising its powers. If the AI Office\
    \ decides to exercise its powers in accordance with Article 75a, it shall periodically inform that\
    \ single point of contact about major developments in the proceedings and the outcome of such proceedings,\
    \ without disclosing any confidential information.\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
