  text: '1a. By way of derogation from Article 73, providers of high-risk AI systems subject to the competence
    of the AI Office pursuant to paragraph 1 of this Article shall report any serious incidents to the
    AI Office. Article 73 (2) to (9), shall apply mutatis mutandis. The AI Office shall promptly transmit
    the relevant information to the market surveillance authority of the Member State in the territory
    of which the provider or its legal representative is situated.

    '
