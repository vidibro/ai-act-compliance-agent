  sha256: 1ff2b26a41bba45cd82f257048ea6704d209800d328918bee598fe9bea83c698
  text: '    The AI Office shall take utmost account of the request and the market surveillance authority
    shall cooperate actively and provide the AI Office the necessary assistance for the exercise of its
    powers in accordance with paragraph 1a.

    '
  disposition: normative
  disposition_reason: ''
