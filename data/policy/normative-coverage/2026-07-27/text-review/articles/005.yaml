  end: 7490
  sha256: 9b212e45fedc2e54395c79c16f0156aebab98c8a7f3d18f6319c6f29822d399c
  text: "2. The use of \u2018real-time\u2019 remote biometric identification systems in publicly accessible\
    \ spaces for the purposes of law enforcement for any of the objectives referred to in paragraph 1,\
    \ first subparagraph, point (h), shall be deployed for the purposes set out in that point only to\
    \ confirm the identity of the specifically targeted individual, and it shall take into account the\
    \ following elements:\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P2-CONFIRM-TARGETED-IDENTITY
  - AIA-NORM-A005-P2-CONSIDER-IMPACTS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
