    elapsed_seconds: null
- segment_id: AIA-TEXT-A005-P025
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 7490
  end: 7678
  sha256: 0728f8c7252d57e80a755acd2524230b02a97fc4f1598bb7192f1d89c3dd7216
  text: '        (a) the nature of the situation giving rise to the possible use, in particular the seriousness,
    probability and scale of the harm that would be caused if the system were not used;

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
