  sha256: a836727deaf928e3e4bd99504fc1611082f789a551454b8f35b5cf7133d89b45
  text: '1b. For the purposes of paragraph 1, first subparagraph, point (ba), an AI system that manipulates
    material in a way that does not increase the exposure of any depicted intimate parts or alter the
    nature of any depicted sexually explicit activities shall not constitute manipulation.

    '
  disposition: normative
