- segment_id: AIA-TEXT-A005-P027
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 7862
  end: 8857
  sha256: 74e5ca943839bdc628ea5023d2df007148cc9889e78b138f22158f2fed65c2da
  text: "    In addition, the use of \u2018 real-time \u2019 remote biometric identification systems in\
    \ publicly accessible spaces for the purposes of law enforcement for any of the objectives referred\
    \ to in paragraph 1, first subparagraph, point (h), of this Article shall comply with necessary and\
    \ proportionate safeguards and conditions in relation to the use in accordance with the national law\
    \ authorising the use thereof, in particular as regards the temporal, geographic and personal limitations.\
    \ The use of the \u2018 real-time \u2019 remote biometric identification system in publicly accessible\
    \ spaces shall be authorised only if the law enforcement authority has completed a fundamental rights\
    \ impact assessment as provided for in Article 27 and has registered the system in the EU database\
    \ according to Article 49. However, in duly justified cases of urgency, the use of such systems may\
    \ be commenced without the registration in the EU database, provided that such registration is completed\
    \ without undue delay.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P2-NATIONAL-SAFEGUARDS
  - AIA-NORM-A005-P2-COMPLETE-FRIA
  - AIA-NORM-A005-P2-REGISTER-SYSTEM
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A005-P028
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 8857
  end: 9793
  sha256: 4bda6bfdd93dddf04aa2ece7ac5c7c91aae51a0ec32b60c3eb4bff0b2efc918f
  text: "3. For the purposes of paragraph 1, first subparagraph, point (h) and paragraph 2, each use for\
    \ the purposes of law enforcement of a \u2018 real-time \u2019 remote biometric identification system\
    \ in publicly accessible spaces shall be subject to a prior authorisation granted by a judicial authority\
    \ or an independent administrative authority whose decision is binding of the Member State in which\
    \ the use is to take place, issued upon a reasoned request and in accordance with the detailed rules\
    \ of national law referred to in paragraph 5. However, in a duly justified situation of urgency, the\
    \ use of such system may be commenced without an authorisation provided that such authorisation is\
    \ requested without undue delay, at the latest within 24 hours. If such authorisation is rejected,\
    \ the use shall be stopped with immediate effect and all the data, as well as the results and outputs\
    \ of that use shall be immediately discarded and deleted.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P3-PRIOR-AUTHORISATION
  - AIA-NORM-A005-P3-URGENT-USE
  - AIA-NORM-A005-P3-STOP-ON-REJECTION
  - AIA-NORM-A005-P3-DELETE-ON-REJECTION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A005-P029
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 9793
  end: 10684
  sha256: 82401f628a7504a3b890321f57b1e57136654d615c02f5c15729a7ddb244c216
  text: "    The competent judicial authority or an independent administrative authority whose decision\
    \ is binding shall grant the authorisation only where it is satisfied, on the basis of objective evidence\
    \ or clear indications presented to it, that the use of the \u2018 real-time \u2019 remote biometric\
    \ identification system concerned is necessary for, and proportionate to, achieving one of the objectives\
    \ specified in paragraph 1, first subparagraph, point (h), as identified in the request and, in particular,\
    \ remains limited to what is strictly necessary concerning the period of time as well as the geographic\
    \ and personal scope. In deciding on the request, that authority shall take into account the elements\
    \ referred to in paragraph 2. No decision that produces an adverse legal effect on a person may be\
    \ taken based solely on the output of the \u2018 real-time \u2019 remote biometric identification\
    \ system.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P3-RESTRICT-AUTHORISATION
  - AIA-NORM-A005-P3-CONSIDER-P2-ELEMENTS
  - AIA-NORM-A005-P3-NO-SOLE-OUTPUT-ADVERSE-DECISION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A005-P030
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 10684
  end: 11160
  sha256: 1dc7b193fbb93b6b79a21116da0f3992f55fa1d6669abbad51fe591a48c40eb6
  text: "4. Without prejudice to paragraph 3, each use of a \u2018 real-time \u2019 remote biometric identification\
    \ system in publicly accessible spaces for law enforcement purposes shall be notified to the relevant\
    \ market surveillance authority and the national data protection authority in accordance with the\
    \ national rules referred to in paragraph 5. The notification shall, as a minimum, contain the information\
    \ specified under paragraph 6 and shall not include sensitive operational data.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P4-NOTIFY-AUTHORITIES
  - AIA-NORM-A005-P4-NOTIFICATION-CONTENT
  - AIA-NORM-A005-P4-EXCLUDE-SENSITIVE-DATA
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A005-P031
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 11160
  end: 12286
  sha256: d75fa6b5c9a2f5998927ba914f9aeb853ea9bb5c0709276e2f7a7fa47130f0db
  text: "5. A Member State may decide to provide for the possibility to fully or partially authorise the\
    \ use of \u2018 real-time \u2019 remote biometric identification systems in publicly accessible spaces\
    \ for the purposes of law enforcement within the limits and under the conditions listed in paragraph\
    \ 1, first subparagraph, point (h), and paragraphs 2 and 3. Member States concerned shall lay down\
    \ in their national law the necessary detailed rules for the request, issuance and exercise of, as\
    \ well as supervision and reporting relating to, the authorisations referred to in paragraph 3. Those\
    \ rules shall also specify in respect of which of the objectives listed in paragraph 1, first subparagraph,\
    \ point (h), including which of the criminal offences referred to in point (h)(iii) thereof, the competent\
    \ authorities may be authorised to use those systems for the purposes of law enforcement. Member States\
    \ shall notify those rules to the Commission at the latest 30 days following the adoption thereof.\
    \ Member States may introduce, in accordance with Union law, more restrictive laws on the use of remote\
    \ biometric identification systems.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P5-AUTHORISE-USE
  - AIA-NORM-A005-P5-LAY-DOWN-RULES
  - AIA-NORM-A005-P5-SPECIFY-OBJECTIVES
  - AIA-NORM-A005-P5-NOTIFY-COMMISSION
  - AIA-NORM-A005-P5-MORE-RESTRICTIVE-LAWS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A005-P032
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 12286
  end: 13013
  sha256: 80008cd37ff5ccaef65b767e20c73a62ce41a4885dae4ccf66c57aa5001d0c07
  text: "6. National market surveillance authorities and the national data protection authorities of Member\
    \ States that have been notified of the use of \u2018 real-time \u2019 remote biometric identification\
    \ systems in publicly accessible spaces for law enforcement purposes pursuant to paragraph 4 shall\
    \ submit to the Commission annual reports on such use. For that purpose, the Commission shall provide\
    \ Member States and national market surveillance and data protection authorities with a template,\
    \ including information on the number of the decisions taken by competent judicial authorities or\
    \ an independent administrative authority whose decision is binding upon requests for authorisations\
    \ in accordance with paragraph 3 and their result.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P6-SUBMIT-ANNUAL-REPORTS
  - AIA-NORM-A005-P6-PROVIDE-TEMPLATE
  - AIA-NORM-A005-P6-TEMPLATE-CONTENT
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A005-P033
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 13013
  end: 13398
  sha256: 66d80330f3a0e33f7f397c51eab04a79d2481d575109bfa4121fbbcb83a59cbf
  text: '7. The Commission shall publish annual reports on the use of real-time remote biometric identification
    systems in publicly accessible spaces for law enforcement purposes, based on aggregated data in Member
    States on the basis of the annual reports referred to in paragraph 6. Those annual reports shall not
    include sensitive operational data of the related law enforcement activities.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P7-PUBLISH-ANNUAL-REPORTS
  - AIA-NORM-A005-P7-EXCLUDE-SENSITIVE-DATA
  review:
    status: approved
