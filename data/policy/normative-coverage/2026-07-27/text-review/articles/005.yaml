- segment_id: AIA-TEXT-A005-P026
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 7678
  end: 7862
  sha256: 51cb0061318f699dca4a3a75d1146da57aa88d62b0567d5696ed0848b85d0332
  text: '        (b) the consequences of the use of the system for the rights and freedoms of all persons
    concerned, in particular the seriousness, probability and scale of those consequences.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A005-P2-CONSIDER-IMPACTS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
