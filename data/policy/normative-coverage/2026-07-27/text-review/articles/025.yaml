  sha256: 050f00cb0057237356826e1735fd09c857ad819bb5f8e9534e27f013955ce604
  text: '        (a) the high-risk AI system is placed on the market together with the product under the
    name or trademark of the product manufacturer;

    '
  disposition: normative
  disposition_reason: ''
