  sha256: 40866d685a278d10637b0d0a592fd436133273a0bcaeab3763f02fadacd2ba35
  text: '    That initial provider shall closely cooperate with new providers and shall make available
    the necessary information and provide the reasonably expected technical access and other assistance
    that are required for the fulfilment of the obligations set out in this Regulation, in particular
    with regard to compliance with the conformity assessment of high-risk AI systems.

    '
  disposition: normative
  disposition_reason: ''
