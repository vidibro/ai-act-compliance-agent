- segment_id: AIA-TEXT-A025-P016
  source:
    kind: article
    document: '25'
    act_version_date: '2026-07-27'
  start: 3823
  end: 4358
  sha256: cc7e0e86f794f4ca2f135af0370b5bf8cabd5e81a32704a36fda56b56d515bcd
  text: '    The AI Office may develop and recommend voluntary model terms for contracts between providers
    of high-risk AI systems and third parties that supply tools, services, components or processes that
    are used for or integrated into high-risk AI systems. When developing those voluntary model terms,
    the AI Office shall take into account possible contractual requirements applicable in specific sectors
    or business cases. The voluntary model terms shall be published and be available free of charge in
    an easily usable electronic format.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A025-P4-AI-OFFICE-MODEL-TERMS
  - AIA-NORM-A025-P4-AI-OFFICE-SECTOR-REQUIREMENTS
  - AIA-NORM-A025-P4-AI-OFFICE-PUBLISH
  qualifying_norm_ids: []
