  sha256: 10d8e470cdc5a31897de69b85907aa383c812553409b9a852164c25108a9f692
  text: '2. Where the circumstances referred to in paragraph 1 occur, the provider that initially placed
    the AI system on the market or put it into service shall no longer be considered to be a provider
    of that specific AI system for the purposes of this Regulation.

    '
  disposition: normative
  disposition_reason: ''
