  sha256: 876628f0659b2338f99530fb9f9cbf930437a9e04973a50b9f4fa30ce1c0bdda
  text: '3. In the case of high-risk AI systems that are safety components of products covered by the
    Union harmonisation legislation listed in Section A of Annex I, the product manufacturer shall be
    considered to be the provider of the high-risk AI system, and shall be subject to the obligations
    under Article 16 under either of the following circumstances:

    '
  disposition: normative
  disposition_reason: ''
  norm_ids: []
  qualifying_norm_ids:
