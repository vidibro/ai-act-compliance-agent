- segment_id: AIA-TEXT-A025-P015
  source:
    kind: article
    document: '25'
    act_version_date: '2026-07-27'
  start: 3136
  end: 3823
  sha256: 770d98d1623c0be194ef47511de935df1e5d8eb79fe72e6be1b8620af73e1c65
  text: '4. The provider of a high-risk AI system and the third party that supplies an AI system, AI model,
    tools, services, components, or processes that are used or integrated in a high-risk AI system shall,
    by written agreement, specify the necessary information, capabilities, technical access and other
    assistance based on the generally acknowledged state of the art, in order to enable the provider of
    the high-risk AI system to fully comply with the obligations set out in this Regulation. This paragraph
    shall not apply to third parties making accessible to the public tools, services, processes, or components,
    other than general-purpose AI models, under a free and open-source licence.

    '
  disposition: normative
  disposition_reason: ''
