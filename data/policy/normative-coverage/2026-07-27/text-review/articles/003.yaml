  text: "    (4) \u2018deployer\u2019 means a natural or legal person, public authority, agency or other\
    \ body using an AI system under its authority except where the AI system is used in the course of\
    \ a personal non-professional activity;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
