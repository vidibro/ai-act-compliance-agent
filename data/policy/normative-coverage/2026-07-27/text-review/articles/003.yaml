  end: 14617
  sha256: 9705b8feb65ada8125764afd0394c6ad94b9dd3305d518d5a4ed368f401d1aba
  text: "    (58) \u2018subject\u2019, for the purpose of real-world testing, means a natural person who\
    \ participates in testing in real-world conditions;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D058-SUBJECT
  qualifying_norm_ids: []
