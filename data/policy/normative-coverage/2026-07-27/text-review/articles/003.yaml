  end: 16713
  sha256: cc633d3fd3ac9fe45c8392e6e7c6836a857710c2b4d6b9cbda31990b6efc4d2c
  text: "    (63) \u2018general-purpose AI model\u2019 means an AI model, including where such an AI model\
    \ is trained with a large amount of data using self-supervision at scale, that displays significant\
    \ generality and is capable of competently performing a wide range of distinct tasks regardless of\
    \ the way the model is placed on the market and that can be integrated into a variety of downstream\
    \ systems or applications, except AI models that are used for research, development or prototyping\
    \ activities before they are placed on the market;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D063-GENERAL-PURPOSE-AI-MODEL
  qualifying_norm_ids: []
  review:
