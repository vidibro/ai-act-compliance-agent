  text: "    (5) \u2018authorised representative\u2019 means a natural or legal person located or established\
    \ in the Union who has received and accepted a written mandate from a provider of an AI system or\
    \ a general-purpose AI model to, respectively, perform and carry out on its behalf the obligations\
    \ and procedures established by this Regulation;\n"
  disposition: normative
  disposition_reason: ''
