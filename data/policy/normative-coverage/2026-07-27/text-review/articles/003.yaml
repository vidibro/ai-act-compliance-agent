  sha256: 06b075f34c4f2eebe1b4b97f84e1ea5b06da716d8daf0c0d5dc73ee55bb390b5
  text: "    (3) \u2018provider\u2019 means a natural or legal person, public authority, agency or other\
    \ body that develops an AI system or a general-purpose AI model or that has an AI system or a general-purpose\
    \ AI model developed and places it on the market or puts the AI system into service under its own\
    \ name or trademark, whether for payment or free of charge;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D003-PROVIDER
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
