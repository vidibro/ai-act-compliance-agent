- segment_id: AIA-TEXT-A003-P065
  source:
    kind: article
    document: '3'
    act_version_date: '2026-07-27'
  start: 13564
  end: 13925
  sha256: 9909cfeaced91ae977607550581055ac261dcea30c14450f8d8563d892a54397
  text: "    (56) \u2018AI literacy\u2019 means skills, knowledge and understanding that allow providers,\
    \ deployers and affected persons, taking into account their respective rights and obligations in the\
    \ context of this Regulation, to make an informed deployment of AI systems, as well as to gain awareness\
    \ about the opportunities and risks of AI and possible harm it can cause;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D056-AI-LITERACY
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A003-P066
  source:
    kind: article
    document: '3'
    act_version_date: '2026-07-27'
  start: 13925
  end: 14481
  sha256: 3362cdc3580863cc30d70b03f6204ae1af3b33218675013bc1d3850aadea4874
  text: "    (57) \u2018testing in real-world conditions\u2019 means the temporary testing of an AI system\
    \ for its intended purpose in real-world conditions outside a laboratory or otherwise simulated environment,\
    \ with a view to gathering reliable and robust data and to assessing and verifying the conformity\
    \ of the AI system with the requirements of this Regulation and it does not qualify as placing the\
    \ AI system on the market or putting it into service within the meaning of this Regulation, provided\
    \ that all the conditions laid down in Article 57 or 60 are fulfilled;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D057-TESTING-IN-REAL-WORLD-CONDITIONS
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
