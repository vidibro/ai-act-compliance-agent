    document: '3'
    act_version_date: '2026-07-27'
  start: 13209
  end: 13564
  sha256: d0b105dd928690c17c6165de5d742dbd51b2442c814a9d64f2d18d2920aeea40
  text: "    (55) \u2018AI regulatory sandbox\u2019 means a controlled framework set up by a competent\
    \ authority which offers providers or prospective providers of AI systems the possibility to develop,\
    \ train, validate and test, where appropriate in real-world conditions, an innovative AI system, pursuant\
    \ to a sandbox plan for a limited time under regulatory supervision;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D055-AI-REGULATORY-SANDBOX
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
