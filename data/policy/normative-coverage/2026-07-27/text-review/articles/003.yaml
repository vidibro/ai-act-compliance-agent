    elapsed_seconds: null
- segment_id: AIA-TEXT-A003-P068
  source:
    kind: article
    document: '3'
    act_version_date: '2026-07-27'
  start: 14617
  end: 14932
  sha256: 2227dc661aac294fa8bbcac6278a2e94ae5edbce88298c87578446d643ff7f7a
  text: "    (59) \u2018informed consent\u2019 means a subject\u2019s freely given, specific, unambiguous\
    \ and voluntary expression of his or her willingness to participate in a particular testing in real-world\
    \ conditions, after having been informed of all aspects of the testing that are relevant to the subject\u2019\
    s decision to participate;\n"
  disposition: normative
  disposition_reason: ''
