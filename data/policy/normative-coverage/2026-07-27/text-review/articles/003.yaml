  end: 586
  sha256: 252fccda2d48df101aa7bae27bd6e52823bd4f5b62b92b23103565d0d3e2501b
  text: "    (2) \u2018risk\u2019 means the combination of the probability of an occurrence of harm and\
    \ the severity of that harm;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D002-RISK
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
