  end: 8283
  sha256: cd9dcfee00fe7d0fe5d90e561b99872687e53e32611065e2a99c7d30fd0390de
  text: "    (36) \u2018biometric verification\u2019 means the automated, one-to-one verification, including\
    \ authentication, of the identity of natural persons by comparing their biometric data to previously\
    \ provided biometric data;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
