  sha256: b03f31c73bd9518e50f4047bdaa9fe40037a2335866ed5f4cc88f61e25fff863
  text: "    (66) \u2018general-purpose AI system\u2019 means an AI system which is based on a general-purpose\
    \ AI model and which has the capability to serve a variety of purposes, both for direct use as well\
    \ as for integration in other AI systems;\n"
