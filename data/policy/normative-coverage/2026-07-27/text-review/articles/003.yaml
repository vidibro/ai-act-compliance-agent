  sha256: d6f940b969bf22515444c0c596afe514873195b5425a66be9c8ec76fa1af2ed5
  text: "    (1) \u2018AI system\u2019 means a machine-based system that is designed to operate with varying\
    \ levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or\
    \ implicit objectives, infers, from the input it receives, how to generate outputs such as predictions,\
    \ content, recommendations, or decisions that can influence physical or virtual environments;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D001-AI-SYSTEM
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
