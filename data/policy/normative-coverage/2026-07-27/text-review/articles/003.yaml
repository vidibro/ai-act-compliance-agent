- segment_id: AIA-TEXT-A003-P069
  source:
    kind: article
    document: '3'
    act_version_date: '2026-07-27'
  start: 14932
  end: 15152
  sha256: beeb13de7f0fd81ff29c902a352188e4b890f4154dca8b822c9da39854ecbb7b
  text: "    (60) \u2018deep fake\u2019 means AI-generated or manipulated image, audio or video content\
    \ that resembles existing persons, objects, places, entities or events and would falsely appear to\
    \ a person to be authentic or truthful;\n"
