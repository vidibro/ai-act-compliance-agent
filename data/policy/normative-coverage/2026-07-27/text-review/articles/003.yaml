  text: "    (39) \u2018emotion recognition system\u2019 means an AI system for the purpose of identifying\
    \ or inferring emotions or intentions of natural persons on the basis of their biometric data;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
