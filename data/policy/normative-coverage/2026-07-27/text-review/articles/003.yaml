  end: 8751
  sha256: adcec1a6753454d631c73e87a0721c9aa342ccfdd1142050b98732fb9c45ee21
  text: "    (38) \u2018sensitive operational data\u2019 means operational data related to activities\
    \ of prevention, detection, investigation or prosecution of criminal offences, the disclosure of which\
    \ could jeopardise the integrity of criminal proceedings;\n"
  disposition: normative
  disposition_reason: ''
