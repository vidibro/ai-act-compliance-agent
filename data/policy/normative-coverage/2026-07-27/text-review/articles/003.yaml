  end: 17254
  sha256: 0fc6b4053beba666e1de83bff63142b0107c3779759f5becd02daa5c941da40d
  text: "    (65) \u2018systemic risk\u2019 means a risk that is specific to the high-impact capabilities\
    \ of general-purpose AI models, having a significant impact on the Union market due to their reach,\
    \ or due to actual or reasonably foreseeable negative effects on public health, safety, public security,\
    \ fundamental rights, or the society as a whole, that can be propagated at scale across the value\
    \ chain;\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A003-D065-SYSTEMIC-RISK
  qualifying_norm_ids: []
