  sha256: d549c92be456be0e1086315f8507b2be39fc1ad94599394299af14d704c2bda3
  text: "    (14) \u2018safety component\u2019 means a component of a product or of an AI system which\
    \ fulfils a safety function for that product or AI system, or the failure or malfunctioning of which\
    \ endangers the health and safety of persons or property; for the purposes of this definition, a component\
    \ fulfils a safety function where its intended purpose is to prevent or mitigate risks to health and\
    \ safety of persons or property;\n"
  disposition: normative
  disposition_reason: ''
