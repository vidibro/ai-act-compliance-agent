  sha256: eb74eddb33750b3a0af24a61bce2c4ff509705f8fd54a0c8d9b3a5e9b8d81e92
  text: '4. The experts on the scientific panel shall perform their tasks with impartiality and objectivity,
    and shall ensure the confidentiality of information and data obtained in carrying out their tasks
    and activities. They shall neither seek nor take instructions from anyone when exercising their tasks
    under paragraph 3. Each expert shall draw up a declaration of interests, which shall be made publicly
    available. The AI Office shall establish systems and procedures to actively manage and prevent potential
    conflicts of interest.

    '
