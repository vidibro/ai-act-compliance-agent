    may submit an initial report that is incomplete, followed by a complete report.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P5-INITIAL-INCOMPLETE-REPORT
  qualifying_norm_ids: []
