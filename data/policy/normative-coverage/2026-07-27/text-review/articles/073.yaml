  end: 1057
  sha256: 69926133c96602cb72472cb340ffc080dd8a1ab41bd58dd14ba9722c7056bffd
  text: '3. Notwithstanding paragraph 2 of this Article, in the event of a widespread infringement or
    a serious incident as defined in Article 3, point (49)(b), the report referred to in paragraph 1 of
    this Article shall be provided immediately, and not later than two days after the provider or, where
    applicable, the deployer becomes aware of that incident.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P3-TWO-DAY-DEADLINE
  qualifying_norm_ids: []
  review:
