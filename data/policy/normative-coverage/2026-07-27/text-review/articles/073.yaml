  end: 1930
  sha256: 7e3e548f32b0f6f4bd051b63e52a0883d34a7de19380929ccf4d76819ef56022
  text: '6. Following the reporting of a serious incident pursuant to paragraph 1, the provider shall,
    without delay, perform the necessary investigations in relation to the serious incident and the AI
    system concerned. This shall include a risk assessment of the incident, and corrective action.

    '
  disposition: normative
  disposition_reason: ''
