  end: 575
  sha256: 4f878930f37385f2d7f045fcf935d6526fe28cb3f4a2cfea8cb50388bd2621d9
  text: '2. The report referred to in paragraph 1 shall be made immediately after the provider has established
    a causal link between the AI system and the serious incident or the reasonable likelihood of such
    a link, and, in any event, not later than 15 days after the provider or, where applicable, the deployer,
    becomes aware of the serious incident.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P2-DEFAULT-REPORTING-DEADLINE
  qualifying_norm_ids: []
  review:
