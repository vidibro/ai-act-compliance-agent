  sha256: 67c6aa26a6ab7ea07c9d8dd42a8790c55b837ccd981027967fbfea0c897becc5
  text: '    The period for the reporting referred to in the first subparagraph shall take account of
    the severity of the serious incident.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids: []
  qualifying_norm_ids:
  - AIA-NORM-A073-P2-DEFAULT-REPORTING-DEADLINE
