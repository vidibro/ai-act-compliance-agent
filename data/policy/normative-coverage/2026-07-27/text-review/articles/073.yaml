- segment_id: AIA-TEXT-A073-P011
  source:
    kind: article
    document: '73'
    act_version_date: '2026-07-27'
  start: 3104
  end: 3457
  sha256: 31e8a6ca0b983005fc1c6e13890206d20185f6f110d474cd52361f92661af4a9
  text: '9. For high-risk AI systems referred to in Annex III that are placed on the market or put into
    service by providers that are subject to Union legislative instruments laying down reporting obligations
    equivalent to those set out in this Regulation, the notification of serious incidents shall be limited
    to those referred to in Article 3, point (49)(c).

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P9-EQUIVALENT-REPORTING-LIMIT
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
