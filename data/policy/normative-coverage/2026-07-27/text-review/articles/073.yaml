  sha256: 7da0d323fc7b52aab9b839ad509c3587122fdb391cade42ea2723b6ae1c2edf4
  text: '1. Providers of high-risk AI systems placed on the Union market shall report any serious incident
    to the market surveillance authorities of the Member States where that incident occurred.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P1-REPORT-SERIOUS-INCIDENT
