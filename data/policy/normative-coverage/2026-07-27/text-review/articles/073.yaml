  start: 2792
  end: 3104
  sha256: cdb60bcb8d0bb3635344105f7145289c7bd59bd28141557949c83137eb85afcd
  text: '8. The market surveillance authority shall take appropriate measures, as provided for in Article
    19 of Regulation (EU) 2019/1020, within seven days from the date it received the notification referred
    to in paragraph 1 of this Article, and shall follow the notification procedures as provided in that
    Regulation.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P8-SEVEN-DAY-AUTHORITY-ACTION
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
