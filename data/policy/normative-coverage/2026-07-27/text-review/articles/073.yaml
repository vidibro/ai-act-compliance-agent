  end: 2345
  sha256: 9c8c52fc66a61469833abca7fd1209d0cd31b45f8fda7fc7c44449a253b1d988
  text: '    The provider shall cooperate with the competent authorities, and where relevant with the
    notified body concerned, during the investigations referred to in the first subparagraph, and shall
    not perform any investigation which involves altering the AI system concerned in a way which may affect
    any subsequent evaluation of the causes of the incident, prior to informing the competent authorities
    of such action.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P6-COOPERATE-AND-PRESERVE-SYSTEM
  - AIA-NORM-A073-P6-NO-EVIDENCE-AFFECTING-ALTERATION
