- segment_id: AIA-TEXT-A073-P009
  source:
    kind: article
    document: '73'
    act_version_date: '2026-07-27'
  start: 2345
  end: 2792
  sha256: bc7e309596ace1057961308421814213423aac01fdf861624dbb0f36d6f506f2
  text: '7. Upon receiving a notification related to a serious incident referred to in Article 3, point
    (49)(c), the relevant market surveillance authority shall inform the national public authorities or
    bodies referred to in Article 77(1). The Commission shall develop dedicated guidance to facilitate
    compliance with the obligations set out in paragraph 1 of this Article. That guidance shall be issued
    by 2 August 2025, and shall be assessed regularly.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P7-INFORM-FUNDAMENTAL-RIGHTS-AUTHORITIES
  - AIA-NORM-A073-P7-COMMISSION-REPORTING-GUIDANCE
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
