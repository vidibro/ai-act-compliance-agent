- segment_id: AIA-TEXT-A073-P012
  source:
    kind: article
    document: '73'
    act_version_date: '2026-07-27'
  start: 3457
  end: 3861
  sha256: 7c4341b2a953ed8298fd60cad3da4c85339ffffc0176c49f4c39f75b426500ff
  text: '10. For high-risk AI systems which are safety components of devices, or are themselves devices,
    covered by Regulations (EU) 2017/745 and (EU) 2017/746, the notification of serious incidents shall
    be limited to those referred to in Article 3, point (49)(c) of this Regulation, and shall be made
    to the national competent authority chosen for that purpose by the Member States where the incident
    occurred.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A073-P10-MEDICAL-DEVICE-REPORTING
  qualifying_norm_ids: []
  review:
