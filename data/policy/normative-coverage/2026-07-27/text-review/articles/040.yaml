  sha256: 33fb2eb18f30817c3b0aa4606fe2e3d8c3a96db8a10d29b52d24955b9acdcdcc
  text: "2. In accordance with Article 10 of Regulation (EU) No 1025/2012, the Commission shall issue,\
    \ without undue delay, standardisation requests covering all requirements set out in Section 2 of\
    \ this Chapter and, as applicable, standardisation requests covering obligations set out in Chapter\
    \ V, Sections 2 and 3, of this Regulation. The standardisation request shall also ask for deliverables\
    \ on reporting and documentation processes to improve AI systems\u2019 resource performance, such\
    \ as reducing the high-risk AI system\u2019s consumption of energy and of other resources during its\
    \ lifecycle, and on the energy-efficient development of general-purpose AI models. When preparing\
    \ a standardisation request, the Commission shall consult the Board and relevant stakeholders, including\
    \ the advisory forum.\n"
  disposition: normative
