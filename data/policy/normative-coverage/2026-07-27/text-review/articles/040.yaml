  sha256: 6108c5ee3d1721daa8b7bf1d2fbf5c3f42d8dd7a3a496896712b854c0e1829f4
  text: '    The Commission shall request, in accordance with Regulation (EU) No 1025/2012 of the European
    Parliament and of the Council Regulation (EU) No 1025/2012 of the European Parliament and of the Council
    of 25 October 2012 on European standardisation, amending Council Directives 89/686/EEC and 93/15/EEC
    and Directives 94/9/EC, 94/25/EC, 95/16/EC, 97/23/EC, 98/34/EC, 2004/22/EC, 2007/23/EC, 2009/23/EC
    and 2009/105/EC of the European Parliament and of the Council and repealing Council Decision 87/95/EEC
    and Decision No 1673/2006/EC of the European Parliament and of the Council (OJ L 316, 14.11.2012,
    p. 12, ELI: http://data.europa.eu/eli/reg/2012/1025/oj). and without undue delay, the European standardisation
    organisations to develop standardisation deliverables, including, as appropriate, harmonised standards,
    to facilitate the joint compliance and presumption of conformity with the requirements or obligations
    set out in Chapter III, Sections 2 and 3 of this Regulation, and the relevant requirements and obligations
    laid down in the Union harmonisation legislation listed in Annex I to this Regulation.

    '
  disposition: normative
