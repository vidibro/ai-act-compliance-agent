  sha256: 0294f6fabf874fec0e3418db4abecd8279b86398bdeaf603dacc9cff14129d81
  text: '3. The participants in the standardisation process shall seek to promote investment and innovation
    in AI, including through increasing legal certainty, as well as the competitiveness and growth of
    the Union market, to contribute to strengthening global cooperation on standardisation and taking
    into account existing international standards in the field of AI that are consistent with Union values,
    fundamental rights and interests, and to enhance multi-stakeholder governance ensuring a balanced
    representation of interests and the effective participation of all relevant stakeholders in accordance
    with Articles 5, 6, and 7 of Regulation (EU) No 1025/2012.

    '
