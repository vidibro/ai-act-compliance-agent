  sha256: d1ae772824c0c9a5da834394c79af77da390ee6be17817226cefdf10e5d3e207
  text: '    When issuing a standardisation request to European standardisation organisations, the Commission
    shall specify that standards have to be clear, consistent, including with the standards developed
    in the various sectors for products covered by the existing Union harmonisation legislation listed
    in Annex I, and aiming to ensure that high-risk AI systems or general-purpose AI models placed on
    the market or put into service in the Union meet the relevant requirements or obligations laid down
    in this Regulation.

    '
