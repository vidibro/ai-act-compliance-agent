  text: '1. High-risk AI systems or general-purpose AI models which are in conformity with harmonised
    standards or parts thereof the references of which have been published in the Official Journal of
    the European Union in accordance with Regulation (EU) No 1025/2012 shall be presumed to be in conformity
    with the requirements set out in Section 2 of this Chapter or, as applicable, with the obligations
    set out in of Chapter V, Sections 2 and 3, of this Regulation, to the extent that those standards
    cover those requirements or obligations.

    '
