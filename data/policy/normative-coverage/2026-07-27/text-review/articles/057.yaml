  start: 3860
  end: 4661
  sha256: a3113d7d6065d64b037a36bb6e8ce9b5a2d0ccfa6483601d788599f08210e1e4
  text: '    Upon request of the provider or prospective provider of the AI system, the competent authority
    shall provide a written proof of the activities successfully carried out in the sandbox. The competent
    authority shall also provide an exit report detailing the activities carried out in the sandbox and
    the related results and learning outcomes. Providers may use such documentation to demonstrate their
    compliance with this Regulation through the conformity assessment process or relevant market surveillance
    activities. In this regard, the exit reports and the written proof provided by the national competent
    authority shall be taken positively into account by market surveillance authorities and notified bodies,
    with a view to accelerating conformity assessment procedures to a reasonable extent.

    '
  disposition: normative
  disposition_reason: ''
