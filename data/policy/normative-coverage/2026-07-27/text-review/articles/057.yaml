  sha256: 6d384815b5238f7f43829594e1feadf06e649ca189a8ea38206a91d4366245d9
  text: '1. Member States shall ensure that their competent authorities establish at least one AI regulatory
    sandbox at national level, which shall be operational by 2 August 2027. That sandbox may also be established
    jointly with the competent authorities of other Member States. The Commission may provide technical
    support, advice and tools for the establishment and operation of AI regulatory sandboxes.

    '
