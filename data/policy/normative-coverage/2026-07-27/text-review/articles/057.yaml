  sha256: 77d84516312e125aa33262543d739bc2c319b067a1851b53efed64f595f89dd5
  text: '3. The European Data Protection Supervisor may establish an AI regulatory sandbox for Union institutions,
    bodies, offices and agencies. For this purpose, references to national competent authorities in this
    Chapter shall be construed as references to the European Data Protection Supervisor.

    '
  disposition: normative
  disposition_reason: ''
