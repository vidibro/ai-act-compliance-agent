  start: 1689
  end: 1921
  sha256: c5bc8cf753373a959e01d6b56dfa67d4eb7fabb57e617b0722af55294e353b63
  text: '    The establishment of a Union level AI regulatory sandbox by the AI Office shall be without
    prejudice to the competences of Member States to establish and supervise AI regulatory sandboxes for
    AI systems under their supervision.

    '
  disposition: normative
  disposition_reason: Qualifies the AI Office establishment power by preserving Member State sandbox competence.
  norm_ids:
  - AIA-NORM-A057-P3A-AI-OFFICE-SANDBOX
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
