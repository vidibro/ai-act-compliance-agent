    elapsed_seconds: null
- segment_id: AIA-TEXT-A057-P020
  source:
    kind: article
    document: '57'
    act_version_date: '2026-07-27'
  start: 6419
  end: 7304
  sha256: 8dfcc4a61c5a60547eca820855bd4336b449014c5f57ab9f27a8c04b990c60da
  text: '11. The AI regulatory sandboxes shall not affect the supervisory or corrective powers of the
    competent authorities supervising the sandboxes, including at regional or local level. Any significant
    risks to health and safety and fundamental rights identified during the development and testing of
    such AI systems shall result in an adequate mitigation. National competent authorities shall have
    the power to temporarily or permanently suspend the testing process, or the participation in the sandbox
    if no effective mitigation is possible, and shall inform the AI Office of such decision. National
    competent authorities shall exercise their supervisory powers within the limits of the relevant law,
    using their discretionary powers when implementing legal provisions in respect of a specific AI regulatory
    sandbox project, with the objective of supporting innovation in AI in the Union.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A057-P11-PRESERVE-SUPERVISORY-POWERS
  - AIA-NORM-A057-P11-SUPERVISORY-MITIGATION-WORKFLOW
