  start: 1921
  end: 2543
  sha256: 40caa55494cc16b77fd97032d77b9dfa3f255ff4c1d2aa0b6424ad2cdcaf4de6
  text: '4. Member States shall ensure that the competent authorities referred to in paragraphs 1 and
    2 allocate sufficient resources to comply with this Article effectively and in a timely manner. Where
    appropriate, national competent authorities shall cooperate with other relevant authorities, and may
    allow for the involvement of other actors within the AI ecosystem. This Article shall not affect other
    regulatory sandboxes established under Union or national law. Member States shall ensure an appropriate
    level of cooperation between the authorities supervising those other sandboxes and the national competent
    authorities.

    '
  disposition: normative
  disposition_reason: ''
