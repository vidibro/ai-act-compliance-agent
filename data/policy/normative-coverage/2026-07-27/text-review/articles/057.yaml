- segment_id: AIA-TEXT-A057-P021
  source:
    kind: article
    document: '57'
    act_version_date: '2026-07-27'
  start: 7304
  end: 8122
  sha256: b050a375159e9b0ec58d1436d394e35403ca0d9feed7cccfe2881e737d63a392
  text: '12. Providers and prospective providers participating in the AI regulatory sandbox shall remain
    liable under applicable Union and national liability law for any damage inflicted on third parties
    as a result of the experimentation taking place in the sandbox. However, provided that the prospective
    providers observe the specific plan and the terms and conditions for their participation and follow
    in good faith the guidance given by the national competent authority, no administrative fines shall
    be imposed by the authorities for infringements of this Regulation. Where other competent authorities
    responsible for other Union and national law were actively involved in the supervision of the AI system
    in the sandbox and provided guidance for compliance, no administrative fines shall be imposed regarding
    that law.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A057-P12-LIABILITY-AND-FINE-SAFE-HARBOUR
  - AIA-NORM-A057-P12-AI-ACT-NO-FINE-PROTECTION
  - AIA-NORM-A057-P12-OTHER-LAW-NO-FINE-PROTECTION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A057-P022
  source:
    kind: article
    document: '57'
    act_version_date: '2026-07-27'
  start: 8122
  end: 8305
  sha256: 6e391cd69d2323d5280effffb9744e288a9aeb7cd37ced44180f5c7844c4ba53
  text: '13. The AI regulatory sandboxes shall be designed and implemented in such a way that, where relevant,
    they facilitate cross-border cooperation between national competent authorities.

    '
