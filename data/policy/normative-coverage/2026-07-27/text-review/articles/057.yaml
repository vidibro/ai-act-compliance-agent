    elapsed_seconds: null
- segment_id: AIA-TEXT-A057-P008
  source:
    kind: article
    document: '57'
    act_version_date: '2026-07-27'
  start: 2543
  end: 3207
  sha256: ac68d95745e8a299a56974faca059e14f7344647de1b1cbb27077d6ad0ad6c2a
  text: '5. AI regulatory sandboxes established under this Article shall provide for a controlled environment
    that fosters innovation and facilitates the development, training, testing and validation of innovative
    AI systems for a limited time before their being placed on the market or put into service pursuant
    to a specific sandbox plan agreed between the providers or prospective providers and the competent
    authorities, ensuring that appropriate safeguards are in place. Such sandboxes may include testing
    in real world conditions supervised therein. Where applicable, the sandbox plan shall incorporate
    the real-world testing plan referred to in Articles 60 and 60a.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A057-P5-CONTROLLED-SANDBOX-LIFECYCLE
  - AIA-NORM-A057-P5-SUPERVISED-REAL-WORLD-TESTING
  - AIA-NORM-A057-P5-INCORPORATE-TESTING-PLAN
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A057-P009
  source:
    kind: article
    document: '57'
    act_version_date: '2026-07-27'
  start: 3207
  end: 3622
  sha256: beee6919caa270b4daa3032739d1e57ce66f57a35363bdae88cc10c6f7c41fad
  text: '6. Competent authorities shall provide, as appropriate, guidance, supervision and support within
    the AI regulatory sandbox with a view to identifying risks, in particular to fundamental rights, health
    and safety, testing, mitigation measures, and their effectiveness in relation to the obligations and
    requirements of this Regulation and, where relevant, other Union and national law supervised within
    the sandbox.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A057-P6-GUIDANCE-SUPERVISION-SUPPORT
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
