  sha256: 0c8303048cf090b188d74dccb388483e1a5b71d5c4504fb703f4f5c2732e4e62
  text: '7. Competent authorities shall provide providers and prospective providers participating in the
    AI regulatory sandbox with guidance on regulatory expectations and how to fulfil the requirements
    and obligations set out in this Regulation.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A057-P7-REGULATORY-EXPECTATIONS-GUIDANCE
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
