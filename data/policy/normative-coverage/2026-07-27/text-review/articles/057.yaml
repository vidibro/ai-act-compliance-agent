  - AIA-NORM-A057-P4-AUTHORITY-COOPERATION
  - AIA-NORM-A057-P4-INVOLVE-ECOSYSTEM-ACTORS
  - AIA-NORM-A057-P4-PRESERVE-OTHER-SANDBOXES
  - AIA-NORM-A057-P4-INTER-SANDBOX-COOPERATION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
