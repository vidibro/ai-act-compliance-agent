  - AIA-NORM-A057-P11-NOTIFY-SUSPENSION
  - AIA-NORM-A057-P11-LAWFUL-SUPERVISORY-DISCRETION
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
