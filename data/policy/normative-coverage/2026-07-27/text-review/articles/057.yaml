  end: 1689
  sha256: fedde66bf369a5e2ae69e00e62d12d79235f2ad3cc33cabb2f0b3abc4955c728
  text: '3a. The AI Office may establish an AI regulatory sandbox at Union level for AI systems covered
    by Article 75(1). For this purpose, references to national competent authorities in this Chapter shall
    be construed, where relevant, as references to the AI Office. That AI regulatory sandbox shall be
    implemented in close cooperation with relevant competent authorities, in particular where compliance
    with Union legislation other than this Regulation is supervised in the AI regulatory sandbox, and
    shall provide priority access to SMEs, including start-ups, and SMCs.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A057-P3A-AI-OFFICE-SANDBOX
  - AIA-NORM-A057-P3A-AI-OFFICE-AUTHORITY-REFERENCES
  - AIA-NORM-A057-P3A-COOPERATE-WITH-AUTHORITIES
  - AIA-NORM-A057-P3A-PRIORITY-ACCESS
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A057-P006
  source:
    kind: article
    document: '57'
