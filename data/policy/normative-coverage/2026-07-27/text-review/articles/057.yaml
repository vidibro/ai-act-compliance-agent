  sha256: 88f26ab5b449dde6b0a9e44c20b6ef85af888573154fad72ff1c099696437d56
  text: '14. National competent authorities, the European Data Protection Supervisor and the AI Office,
    shall, as appropriate and within their respective competences, coordinate their activities and cooperate
    within the framework of the Board. They may support the joint establishment and operation of AI regulatory
    sandboxes, including in different sectors, and exchange best practices on related matters.

    '
