- segment_id: AIA-TEXT-A057-P019
  source:
    kind: article
    document: '57'
    act_version_date: '2026-07-27'
  start: 5888
  end: 6419
  sha256: 018c36f65f37e21081da19362317630e24a899217cb3cbdb990026a19a69f8d6
  text: '10. National competent authorities shall ensure that, to the extent the innovative AI systems
    involve the processing of personal data or otherwise fall under the supervisory remit of other national
    authorities or competent authorities providing or supporting access to data, the competent data protection
    authorities and those other national or competent authorities are associated with the operation of
    the AI regulatory sandbox and involved in the supervision of those aspects to the extent of their
    respective tasks and powers.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A057-P10-ASSOCIATE-SPECIALIST-AUTHORITIES
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
