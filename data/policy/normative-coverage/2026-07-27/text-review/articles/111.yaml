  sha256: c3f96adf3326b0c241837671aafdb888d7f3ae38e0af529ffea4388346a0528a
  text: '2. Without prejudice to the application of Article 5 as referred to in Article 113, third paragraph,
    point (a), this Regulation shall apply to operators of high-risk AI systems, other than the systems
    referred to in paragraph 1 of this Article, that have been placed on the market or put into service
    before the date of application of Chapter III referred to in Article 113, only if, as from that date,
    those systems are subject to significant changes in their designs. In any case, the providers and
    deployers of high-risk AI systems intended to be used by public authorities shall take the necessary
    steps to comply with the requirements and obligations laid down in this Regulation by 2 August 2030.

    '
