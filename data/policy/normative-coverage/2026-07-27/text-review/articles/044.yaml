  sha256: 80a2970ef1ee0bec6b6ebb72953d091ed983d086b22775c4932d72d2a78da6e6
  text: '3. Where a notified body finds that an AI system no longer meets the requirements set out in
    Section 2, it shall, taking account of the principle of proportionality, suspend or withdraw the certificate
    issued or impose restrictions on it, unless compliance with those requirements is ensured by appropriate
    corrective action taken by the provider of the system within an appropriate deadline set by the notified
    body. The notified body shall give reasons for its decision.

    '
