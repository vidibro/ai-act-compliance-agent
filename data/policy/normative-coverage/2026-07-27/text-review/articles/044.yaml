  sha256: 417eee34f1dfddfc1f6d87285c4437b8e3124c99cfbb1ea5b700ad44ba88afc2
  text: '2. Certificates shall be valid for the period they indicate, which shall not exceed five years
    for AI systems covered by Annex I, and four years for AI systems covered by Annex III. At the request
    of the provider, the validity of a certificate may be extended for further periods, each not exceeding
    five years for AI systems covered by Annex I, and four years for AI systems covered by Annex III,
    based on a re-assessment in accordance with the applicable conformity assessment procedures. Any supplement
    to a certificate shall remain valid, provided that the certificate which it supplements is valid.

    '
