  sha256: 2c41847ffd695b460f9a34ce99036792c4bfb62f631b7572dfe730da9d04d240
  text: '4. This Regulation applies neither to public authorities in a third country nor to international
    organisations falling within the scope of this Regulation pursuant to paragraph 1, where those authorities
    or organisations use AI systems in the framework of international cooperation or agreements for law
    enforcement and judicial cooperation with the Union or with one or more Member States, provided that
    such a third country or international organisation provides adequate safeguards with respect to the
    protection of fundamental rights and freedoms of individuals.

    '
  disposition: normative
