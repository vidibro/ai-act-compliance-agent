  start: 1201
  end: 1821
  sha256: 21083ffede86cdabd777bdeaa45d4d3c8093adcc0ed0fe9c6cd3be378c807caa
  text: '1b. Market surveillance authorities and public authorities or bodies referred to in paragraph
    1 shall cooperate closely and provide each other with the mutual assistance necessary to fulfil their
    respective mandates, with a view to ensuring the coherent application of this Regulation and Union
    law protecting fundamental rights and streamlining procedures, while respecting their respective competences,
    tasks, powers and independence. This shall include, in particular, exchange of information where necessary
    for the effective supervision or enforcement of this Regulation and the respective other Union legislation.

    '
