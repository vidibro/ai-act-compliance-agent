  sha256: 36e3bac523c9fffe531343fa1227e649f0167e6a07098deaf373ff3e1d923ce5
  text: '3. Where the documentation referred to in paragraph 1 is insufficient to ascertain whether an
    infringement of obligations under Union law protecting fundamental rights has occurred, the public
    authority or body referred to in paragraph 1 may make a reasoned request to the market surveillance
    authority, to organise testing of the high-risk AI system through technical means. The market surveillance
    authority shall organise the testing with the close involvement of the requesting public authority
    or body within a reasonable time following the request.

    '
