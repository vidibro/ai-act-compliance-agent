  sha256: d599f22caa9966beca6c24260b7a2c95b9bcc66c291b14ddc17dbbc842f72bfb
  text: '8. The Board shall be chaired by one of the representatives of the Member States. The AI Office
    shall provide the secretariat for the Board, convene the meetings upon request of the Chair, and prepare
    the agenda in accordance with the tasks of the Board pursuant to this Regulation and its rules of
    procedure.

    '
