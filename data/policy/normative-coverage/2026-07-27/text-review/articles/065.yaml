  sha256: b67cd55b455aee5cd8cbffdd2cd4af1782d4ea84ebd9bf3d575b723dfb028fff
  text: "2. The Board shall be composed of one representative per Member State. The European Data Protection\
    \ Supervisor shall participate as observer. The AI Office shall also attend the Board\u2019s meetings,\
    \ without taking part in the votes. Other national and Union authorities, bodies or experts may be\
    \ invited to the meetings by the Board on a case by case basis, where the issues discussed are of\
    \ relevance for them.\n"
