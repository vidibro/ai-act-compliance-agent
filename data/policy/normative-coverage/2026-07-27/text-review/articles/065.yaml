  text: "5. The designated representatives of the Member States shall adopt the Board\u2019s rules of\
    \ procedure by a two-thirds majority. The rules of procedure shall, in particular, lay down procedures\
    \ for the selection process, the duration of the mandate of, and specifications of the tasks of, the\
    \ Chair, detailed arrangements for voting, and the organisation of the Board\u2019s activities and\
    \ those of its sub-groups.\n"
  disposition: normative
