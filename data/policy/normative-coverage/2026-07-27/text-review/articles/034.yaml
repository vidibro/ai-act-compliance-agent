  sha256: c1d68e38312422036459fa94bd1fe90036de294942d10d410c33d8194de64fab
  text: '2. Notified bodies shall avoid unnecessary burdens for providers when performing their activities,
    and take due account of the size of the provider, the sector in which it operates, its structure and
    the degree of complexity of the high-risk AI system concerned, in particular in view of minimising
    administrative burdens and compliance costs for micro- and small enterprises within the meaning of
    Recommendation 2003/361/EC. The notified body shall, nevertheless, respect the degree of rigour and
    the level of protection required for the compliance of the high-risk AI system with the requirements
    of this Regulation.

    '
