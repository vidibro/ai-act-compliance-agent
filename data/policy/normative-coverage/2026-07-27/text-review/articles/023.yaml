  sha256: 681be5f588c24c4b534ebde4305bbdc2803130e35777a6be5ff5e604c7484b73
  text: '5. Importers shall keep, for a period of 10 years after the high-risk AI system has been placed
    on the market or put into service, a copy of the certificate issued by the notified body, where applicable,
    of the instructions for use, and of the EU declaration of conformity referred to in Article 47.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A023-P5-KEEP-DOCUMENTS
