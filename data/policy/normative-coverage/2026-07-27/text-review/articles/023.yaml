  sha256: 994d69823adc8d7a4ab3c3d718df71695d099f650652795840acfd66c405a1ba
  text: '2. Where an importer has sufficient reason to consider that a high-risk AI system is not in conformity
    with this Regulation, or is falsified, or accompanied by falsified documentation, it shall not place
    the system on the market until it has been brought into conformity. Where the high-risk AI system
    presents a risk within the meaning of Article 79(1), the importer shall inform the provider of the
    system, the authorised representative and the market surveillance authorities to that effect.

    '
  disposition: normative
  disposition_reason: ''
