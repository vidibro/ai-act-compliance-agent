- segment_id: AIA-TEXT-A060-P4
  source:
    kind: article
    document: '60'
    act_version_date: '2026-07-27'
  start: 1538
  end: 6109
  sha256: 56992cc4a38a1a6f66fb42640fe413343c7a825e04842e9f9b8f3a805acde121
  text: "4. Providers or prospective providers may conduct the testing in real world conditions only where\
    \ all of the following conditions are met:\n        (a) the provider or prospective provider has drawn\
    \ up a real-world testing plan and submitted it to the market surveillance authority in the Member\
    \ State where the testing in real world conditions is to be conducted;\n        (b) the market surveillance\
    \ authority in the Member State where the testing in real world conditions is to be conducted has\
    \ approved the testing in real world conditions and the real-world testing plan; where the market\
    \ surveillance authority has not provided an answer within 30 days, the testing in real world conditions\
    \ and the real-world testing plan shall be understood to have been approved; where national law does\
    \ not provide for a tacit approval, the testing in real world conditions shall remain subject to an\
    \ authorisation;\n        (c) the provider or prospective provider, with the exception of providers\
    \ or prospective providers of high-risk AI systems referred to in points 1, 6 and 7 of Annex III in\
    \ the areas of law enforcement, migration, asylum and border control management, and high-risk AI\
    \ systems referred to in point 2 of Annex III has registered the testing in real world conditions\
    \ in accordance with Article 71(4) with a Union-wide unique single identification number and with\
    \ the information specified in Annex IX; the provider or prospective provider of high-risk AI systems\
    \ referred to in points 1, 6 and 7 of Annex III in the areas of law enforcement, migration, asylum\
    \ and border control management, has registered the testing in real-world conditions in the secure\
    \ non-public section of the EU database according to Article 49(4), point (d), with a Union-wide unique\
    \ single identification number and with the information specified therein; the provider or prospective\
    \ provider of high-risk AI systems referred to in point 2 of Annex III has registered the testing\
    \ in real-world conditions in accordance with Article 49(5);\n        (d) the provider or prospective\
    \ provider conducting the testing in real world conditions is established in the Union or has appointed\
    \ a legal representative who is established in the Union;\n        (e) data collected and processed\
    \ for the purpose of the testing in real world conditions shall be transferred to third countries\
    \ only provided that appropriate and applicable safeguards under Union law are implemented;\n    \
    \    (f) the testing in real world conditions does not last longer than necessary to achieve its objectives\
    \ and in any case not longer than six months, which may be extended for an additional period of six\
    \ months, subject to prior notification by the provider or prospective provider to the market surveillance\
    \ authority, accompanied by an explanation of the need for such an extension;\n        (g) the subjects\
    \ of the testing in real world conditions who are persons belonging to vulnerable groups due to their\
    \ age or disability, are appropriately protected;\n        (h) where a provider or prospective provider\
    \ organises the testing in real world conditions in cooperation with one or more deployers or prospective\
    \ deployers, the latter have been informed of all aspects of the testing that are relevant to their\
    \ decision to participate, and given the relevant instructions for use of the AI system referred to\
    \ in Article 13; the provider or prospective provider and the deployer or prospective deployer shall\
    \ conclude an agreement specifying their roles and responsibilities with a view to ensuring compliance\
    \ with the provisions for testing in real world conditions under this Regulation and under other applicable\
    \ Union and national law;\n        (i) the subjects of the testing in real world conditions have given\
    \ informed consent in accordance with Article 61, or in the case of law enforcement, where the seeking\
    \ of informed consent would prevent the AI system from being tested, the testing itself and the outcome\
    \ of the testing in the real world conditions shall not have any negative effect on the subjects,\
    \ and their personal data shall be deleted after the test is performed;\n        (j) the testing in\
    \ real world conditions is effectively overseen by the provider or prospective provider, as well as\
    \ by deployers or prospective deployers through persons who are suitably qualified in the relevant\
    \ field and have the necessary capacity, training and authority to perform their tasks;\n        (k)\
    \ the predictions, recommendations or decisions of the AI system can be effectively reversed and disregarded.\n"
