  sha256: c0c0f6241fffe3cede25fa6bea20c9c27e1ea92a4df9ba24f052272603739873
  text: '        (a) the provider or prospective provider has drawn up a real-world testing plan and submitted
    it to the market surveillance authority in the Member State where the testing in real world conditions
    is to be conducted;

    '
