  end: 5681
  sha256: effb80e1c675eb17774c1e285bfdf8ca99b4a850658277b8040134509e1689a9
  text: '        (i) the subjects of the testing in real world conditions have given informed consent
    in accordance with Article 61, or in the case of law enforcement, where the seeking of informed consent
    would prevent the AI system from being tested, the testing itself and the outcome of the testing in
    the real world conditions shall not have any negative effect on the subjects, and their personal data
    shall be deleted after the test is performed;

    '
  disposition: normative
