  text: '2. Providers or prospective providers may conduct testing of high-risk AI systems referred to
    in Annex III or covered by Union harmonisation legislation listed in Section A of Annex I in real
    world conditions at any time before the placing on the market or the putting into service of the high-risk
    AI system on their own or in partnership with one or more deployers or prospective deployers.

    '
  disposition: normative
  disposition_reason: ''
