  sha256: 2f696c58cda1a17899b416fc7379a879bdb437cd1de63854e567a40c72358d2e
  text: "1. Testing of high-risk AI systems in real world conditions outside AI regulatory sandboxes may\
    \ be conducted by providers or prospective providers of high-risk AI systems listed in Annex III or\
    \ covered by Union harmonisation legislation listed in Section A of Annex I, in accordance with this\
    \ Article and the real-world testing plan referred to in this Article, without prejudice to the prohibitions\
    \ under Article 5.\n    The Commission shall, by means of implementing acts, specify the detailed\
    \ elements of the real-world testing plan. Those implementing acts shall be adopted in accordance\
    \ with the examination procedure referred to in Article 98(2).\n    This paragraph shall be without\
    \ prejudice to Union or national law on the testing in real world conditions of high-risk AI systems\
    \ related to products covered by Union harmonisation legislation listed in Annex I.\n"
  disposition: needs_review
