  text: '6. In accordance with Article 75, Member States shall confer on their market surveillance authorities
    the powers of requiring providers and prospective providers to provide information, of carrying out
    unannounced remote or on-site inspections, and of performing checks on the conduct of the testing
    in real world conditions and the related high-risk AI systems. Market surveillance authorities shall
    use those powers to ensure the safe development of testing in real world conditions.

    '
