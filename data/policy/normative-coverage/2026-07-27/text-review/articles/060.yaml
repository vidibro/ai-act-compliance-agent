  end: 2445
  sha256: 76d3df09ef9f4815e886d3ca6dc15b86af6c295eb024db38ac33215b629081ea
  text: '        (b) the market surveillance authority in the Member State where the testing in real world
    conditions is to be conducted has approved the testing in real world conditions and the real-world
    testing plan; where the market surveillance authority has not provided an answer within 30 days, the
    testing in real world conditions and the real-world testing plan shall be understood to have been
    approved; where national law does not provide for a tacit approval, the testing in real world conditions
    shall remain subject to an authorisation;

    '
