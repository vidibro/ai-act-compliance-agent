- segment_id: AIA-TEXT-A060-P019
  source:
    kind: article
    document: '60'
    act_version_date: '2026-07-27'
  start: 6554
  end: 7040
  sha256: 1ea667a679ea6c1770ddd47cd1e1e1d1acc0b118cf07ef3a8463a896e161604b
  text: '6. In accordance with Article 75, Member States shall confer on their market surveillance authorities
    the powers of requiring providers and prospective providers to provide information, of carrying out
    unannounced remote or on-site inspections, and of performing checks on the conduct of the testing
    in real world conditions and the related high-risk AI systems. Market surveillance authorities shall
    use those powers to ensure the safe development of testing in real world conditions.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A060-P6-CONFER-AND-USE-SURVEILLANCE-POWERS
  - AIA-NORM-A060-P6-USE-SURVEILLANCE-POWERS
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A060-P020
  source:
    kind: article
    document: '60'
    act_version_date: '2026-07-27'
  start: 7040
  end: 7601
  sha256: 614090b3ead6afab1348f5892445a7fa88303c5eb7e65dd44a22a73fac400529
  text: '7. Any serious incident identified in the course of the testing in real world conditions shall
    be reported to the national market surveillance authority in accordance with Article 73. The provider
    or prospective provider shall adopt immediate mitigation measures or, failing that, shall suspend
    the testing in real world conditions until such mitigation takes place, or otherwise terminate it.
    The provider or prospective provider shall establish a procedure for the prompt recall of the AI system
    upon such termination of the testing in real world conditions.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A060-P7-INCIDENT-RESPONSE
