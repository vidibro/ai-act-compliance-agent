  sha256: 6407c704d76a3a1cbed327d3355dd5e9d0f663086a8e25a4c54ddf8ed4497890
  text: '        (g) the subjects of the testing in real world conditions who are persons belonging to
    vulnerable groups due to their age or disability, are appropriately protected;

    '
