- segment_id: AIA-TEXT-A060-P009
  source:
    kind: article
    document: '60'
    act_version_date: '2026-07-27'
  start: 2445
  end: 3565
  sha256: c918125cccc7a634d489f946b62400270e48028f392fdfdf6fd03813c00682e3
  text: '        (c) the provider or prospective provider, with the exception of providers or prospective
    providers of high-risk AI systems referred to in points 1, 6 and 7 of Annex III in the areas of law
    enforcement, migration, asylum and border control management, and high-risk AI systems referred to
    in point 2 of Annex III has registered the testing in real world conditions in accordance with Article
    71(4) with a Union-wide unique single identification number and with the information specified in
    Annex IX; the provider or prospective provider of high-risk AI systems referred to in points 1, 6
    and 7 of Annex III in the areas of law enforcement, migration, asylum and border control management,
    has registered the testing in real-world conditions in the secure non-public section of the EU database
    according to Article 49(4), point (d), with a Union-wide unique single identification number and with
    the information specified therein; the provider or prospective provider of high-risk AI systems referred
    to in point 2 of Annex III has registered the testing in real-world conditions in accordance with
    Article 49(5);

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A060-P4-C-REGISTER-TESTING
  qualifying_norm_ids:
