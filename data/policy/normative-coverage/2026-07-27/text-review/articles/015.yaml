  sha256: afe5f11a98a66d6ce9fb9ad1cf2c2081f05dd3f2dac35237ae9e9a7788771674
  text: '    High-risk AI systems that continue to learn after being placed on the market or put into
    service shall be developed in such a way as to eliminate or reduce as far as possible the risk of
    possibly biased outputs influencing input for future operations (feedback loops), and as to ensure
    that any such feedback loops are duly addressed with appropriate mitigation measures.

    '
