  end: 2426
  sha256: e0116a16909367bf6cd08fa25a324515584af4b9db2d3c84e904ff7ea287133e
  text: '    The technical solutions to address AI specific vulnerabilities shall include, where appropriate,
    measures to prevent, detect, respond to, resolve and control for attacks trying to manipulate the
    training data set (data poisoning), or pre-trained components used in training (model poisoning),
    inputs designed to cause the AI model to make a mistake (adversarial examples or model evasion), confidentiality
    attacks or model flaws.

    '
  disposition: normative
