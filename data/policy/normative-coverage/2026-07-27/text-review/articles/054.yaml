  sha256: c31205947dc9783f4af374a24700347cae83a59945ee85983628a7aa9866c5b5
  text: '3. The authorised representative shall perform the tasks specified in the mandate received from
    the provider. It shall provide a copy of the mandate to the AI Office upon request, in one of the
    official languages of the institutions of the Union. For the purposes of this Regulation, the mandate
    shall empower the authorised representative to carry out the following tasks:

    '
