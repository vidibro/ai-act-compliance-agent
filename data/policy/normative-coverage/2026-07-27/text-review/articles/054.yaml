  end: 2813
  sha256: ed2d5f1393a17ad80f1708936d31817903eb843a37aa2915beef9d013fb6d944
  text: '6. The obligation set out in this Article shall not apply to providers of general-purpose AI
    models that are released under a free and open-source licence that allows for the access, usage, modification,
    and distribution of the model, and whose parameters, including the weights, the information on the
    model architecture, and the information on model usage, are made publicly available, unless the general-purpose
    AI models present systemic risks.

    '
  disposition: normative
  disposition_reason: ''
