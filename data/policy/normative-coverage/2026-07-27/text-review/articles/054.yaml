  sha256: 51aa3117fd1dad174480463c6ea32bc4698f6998a2622636a976aa8f06868c6b
  text: '5. The authorised representative shall terminate the mandate if it considers or has reason to
    consider the provider to be acting contrary to its obligations pursuant to this Regulation. In such
    a case, it shall also immediately inform the AI Office about the termination of the mandate and the
    reasons therefor.

    '
