  sha256: 0de113063e951be158de26622d1436950d0c996c4ef011758818aa75b87b92a3
  text: '1. Where, within three months of receipt of the notification referred to in Article 79(5), or
    within 30 days in the case of non-compliance with the prohibition of the AI practices referred to
    in Article 5, objections are raised by the market surveillance authority of a Member State to a measure
    taken by another market surveillance authority, or where the Commission considers the measure to be
    contrary to Union law, the Commission shall without undue delay enter into consultation with the market
    surveillance authority of the relevant Member State and the operator or operators, and shall evaluate
    the national measure. On the basis of the results of that evaluation, the Commission shall, within
    six months, or within 60 days in the case of non-compliance with the prohibition of the AI practices
    referred to in Article 5, starting from the notification referred to in Article 79(5), decide whether
    the national measure is justified and shall notify its decision to the market surveillance authority
    of the Member State concerned. The Commission shall also inform all other market surveillance authorities
    of its decision.

    '
  disposition: normative
