  sha256: 95feaeccf1cd03628d3659d4b9f3bacb4b42783358c9655140ea5914f9f4a867
  text: '2. Where the Commission considers the measure taken by the relevant Member State to be justified,
    all Member States shall ensure that they take appropriate restrictive measures in respect of the AI
    system concerned, such as requiring the withdrawal of the AI system from their market without undue
    delay, and shall inform the Commission accordingly. Where the Commission considers the national measure
    to be unjustified, the Member State concerned shall withdraw the measure and shall inform the Commission
    accordingly.

    '
