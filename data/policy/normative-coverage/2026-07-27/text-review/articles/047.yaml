  sha256: f91cf2c6b465064c09e9b10b69eb6c2c02cd43e5a034f37fa21ae76dabb1409f
  text: '2. The EU declaration of conformity shall state that the high-risk AI system concerned meets
    the requirements set out in Section 2. The EU declaration of conformity shall contain the information
    set out in Annex V, and shall be translated into a language that can be easily understood by the national
    competent authorities of the Member States in which the high-risk AI system is placed on the market
    or made available.

    '
  disposition: normative
