  end: 1399
  sha256: feb3380d1df1b2322d48f5139309e528e78fd21cdbcef13cbc9c4f2315b7d6d6
  text: '3. Where high-risk AI systems are subject to other Union harmonisation legislation which also
    requires an EU declaration of conformity, a single EU declaration of conformity shall be drawn up
    in respect of all Union law applicable to the high-risk AI system. The declaration shall contain all
    the information required to identify the Union harmonisation legislation to which the declaration
    relates.

    '
