- segment_id: AIA-TEXT-A031-P005
  source:
    kind: article
    document: '31'
    act_version_date: '2026-07-27'
  start: 1142
  end: 1693
  sha256: 28b6608d6d3441906b1c8f50cf97741f83982efa3dbc2639c685e272546f3e60
  text: '5. Neither a conformity assessment body, its top-level management nor the personnel responsible
    for carrying out its conformity assessment tasks shall be directly involved in the design, development,
    marketing or use of high-risk AI systems, nor shall they represent the parties engaged in those activities.
    They shall not engage in any activity that might conflict with their independence of judgement or
    integrity in relation to conformity assessment activities for which they are notified. This shall,
    in particular, apply to consultancy services.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A031-P5-CONFLICTING-ACTIVITIES-PROHIBITED
  - AIA-NORM-A031-P5-DIRECT-INVOLVEMENT-PROHIBITED
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
