  sha256: 5e7d800f8578b654ca07bd9e7ed472f98376da41062a53f36c951eba9c9feb67
  text: '6. Notified bodies shall be organised and operated so as to safeguard the independence, objectivity
    and impartiality of their activities. Notified bodies shall document and implement a structure and
    procedures to safeguard impartiality and to promote and apply the principles of impartiality throughout
    their organisation, personnel and assessment activities.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A031-P6-IMPARTIALITY-SYSTEM
  - AIA-NORM-A031-P6-INDEPENDENT-OPERATION
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
