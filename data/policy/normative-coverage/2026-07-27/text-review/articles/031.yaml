- segment_id: AIA-TEXT-A031-P004
  source:
    kind: article
    document: '31'
    act_version_date: '2026-07-27'
  start: 619
  end: 1142
  sha256: 00a7934460e5027b51a3c39d77ce857038a2774f6800fdb5874f89f93c619334
  text: '4. Notified bodies shall be independent of the provider of a high-risk AI system in relation
    to which they perform conformity assessment activities. Notified bodies shall also be independent
    of any other operator having an economic interest in high-risk AI systems assessed, as well as of
    any competitors of the provider. This shall not preclude the use of assessed high-risk AI systems
    that are necessary for the operations of the conformity assessment body, or the use of such high-risk
    AI systems for personal purposes.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A031-P4-INDEPENDENCE
  - AIA-NORM-A031-P4-NECESSARY-USE-ALLOWED
  qualifying_norm_ids: []
  review:
    status: approved
    extracted_by: semantic-legal-effect-pass
    verified_by: vidibro
