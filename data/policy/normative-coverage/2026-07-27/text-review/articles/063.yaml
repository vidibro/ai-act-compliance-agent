  text: '1. SMEs, including start-ups, may comply with certain elements of the quality management system
    required by Article 17 in a simplified manner, provided that they do not have partner enterprises
    or linked enterprises within the meaning of Recommendation 2003/361/EC. For that purpose, the Commission
    shall develop guidelines on the elements of the quality management system which may be complied with
    in a simplified manner considering the needs of SMEs, without affecting the level of protection or
    the need for compliance with the requirements in respect of high-risk AI systems.

    '
