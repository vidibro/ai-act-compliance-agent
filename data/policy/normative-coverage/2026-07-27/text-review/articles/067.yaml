  sha256: b52c1f85cd2b93f11b6d7ef4c9cb78d5e982fed7c55654634417c39f66be0d81
  text: '2. The membership of the advisory forum shall represent a balanced selection of stakeholders,
    including industry, start-ups, SMEs, civil society and academia. The membership of the advisory forum
    shall be balanced with regard to commercial and non-commercial interests and, within the category
    of commercial interests, with regard to SMEs and other undertakings.

    '
