  sha256: 1b0445864d717ae341e1ca28ef63fdd0486468f9516435a6e7659acc47a3a1d3
  text: '3. The Member States shall immediately inform the Commission and the other Member States of a
    finding under paragraph 1. That information shall include all available details, in particular the
    data necessary for the identification of the AI system concerned, the origin and the supply chain
    of the AI system, the nature of the risk involved and the nature and duration of the national measures
    taken.

    '
