  end: 1717
  sha256: c7bd0c86797b3f82876c69c47344f092c8d38d7e2145f8c4e75baa53ef8c42e4
  text: '5. The provider of the general-purpose AI model concerned, or its representative shall supply
    the information requested. In the case of legal persons, companies or firms, or where the provider
    has no legal personality, the persons authorised to represent them by law or by their statutes, shall
    supply the information requested on behalf of the provider of the general-purpose AI model concerned.
    Lawyers duly authorised to act may supply information on behalf of their clients. The clients shall
    nevertheless remain fully responsible if the information supplied is incomplete, incorrect or misleading.

    '
