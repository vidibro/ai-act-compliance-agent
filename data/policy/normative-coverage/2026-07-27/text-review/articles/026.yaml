- segment_id: AIA-TEXT-A026-P5
  source:
    kind: article
    document: '26'
    act_version_date: '2026-07-27'
  start: 997
  end: 2364
  sha256: d3b489936bbcc3185c1893f6fe4dd7c2efa1cb051daeb1a4021af4368f8a1392
  text: "5. Deployers shall monitor the operation of the high-risk AI system on the basis of the instructions\
    \ for use and, where relevant, inform providers in accordance with Article 72. Where deployers have\
    \ reason to consider that the use of the high-risk AI system in accordance with the instructions may\
    \ result in that AI system presenting a risk within the meaning of Article 79(1), they shall, without\
    \ undue delay, inform the provider or distributor and the relevant market surveillance authority,\
    \ and shall suspend the use of that system. Where deployers have identified a serious incident, they\
    \ shall also immediately inform first the provider, and then the importer or distributor and the relevant\
    \ market surveillance authorities of that incident. If the deployer is not able to reach the provider,\
    \ Article 73 shall apply mutatis mutandis. This obligation shall not cover sensitive operational data\
    \ of deployers of AI systems which are law enforcement authorities.\n    For deployers that are financial\
    \ institutions subject to requirements regarding their internal governance, arrangements or processes\
    \ under Union financial services law, the monitoring obligation set out in the first subparagraph\
    \ shall be deemed to be fulfilled by complying with the rules on internal governance arrangements,\
    \ processes and mechanisms pursuant to the relevant financial service law.\n"
  disposition: normative
  disposition_reason: ''
