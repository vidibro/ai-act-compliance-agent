  sha256: f255e9e355d16de9ff26bcb5e93f30d0dede0be438f85d5e8617c4fc83e64c96
  text: '8. Deployers of high-risk AI systems that are public authorities, or Union institutions, bodies,
    offices or agencies shall comply with the registration obligations referred to in Article 49. When
    such deployers find that the high-risk AI system that they envisage using has not been registered
    in the EU database referred to in Article 71, they shall not use that system and shall inform the
    provider or the distributor.

    '
