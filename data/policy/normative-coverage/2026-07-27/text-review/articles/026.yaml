  sha256: b4d0bd649b7b9974a566b72eb79dc9f0714e2f3cae76dd98a63ca58e589218a9
  text: "7. Before putting into service or using a high-risk AI system at the workplace, deployers who\
    \ are employers shall inform workers\u2019 representatives and the affected workers that they will\
    \ be subject to the use of the high-risk AI system. This information shall be provided, where applicable,\
    \ in accordance with the rules and procedures laid down in Union and national law and practice on\
    \ information of workers and their representatives.\n"
  disposition: normative
