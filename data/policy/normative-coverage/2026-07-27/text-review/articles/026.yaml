  sha256: 30a551c18ab6f0e64946ce26d39011e3a5ab40f9ed09fc9806fe82d061279b7b
  text: "6. Deployers of high-risk AI systems shall keep the logs automatically generated by that high-risk\
    \ AI system to the extent such logs are under their control, for a period appropriate to the intended\
    \ purpose of the high-risk AI system, of at least six months, unless provided otherwise in applicable\
    \ Union or national law, in particular in Union law on the protection of personal data.\n    Deployers\
    \ that are financial institutions subject to requirements regarding their internal governance, arrangements\
    \ or processes under Union financial services law shall maintain the logs as part of the documentation\
    \ kept pursuant to the relevant Union financial service law.\n"
  disposition: normative
  disposition_reason: ''
