  sha256: 51ab9759c1dd05c561182ab141f1ba1f60a3c8cc43e419ffd37457dcb054da60
  text: '        (b) the special categories of personal data are subject to technical limitations on the
    re-use of personal data, and state-of-the-art security and privacy-preserving measures, including
