  end: 4536
  sha256: 657a43881f57666b2ae76b5e3e1f6639e3a95764c0076beabacee1221bf46bb8
  text: '3. Paragraph 1 is without prejudice to Union or national law which excludes processing of personal
    data for other purposes than those explicitly mentioned in that law, as well as to Union or national
    law laying down the basis for the processing of personal data which is necessary for the purpose of
    developing, testing or training of innovative AI systems or any other legal basis, in compliance with
    Union law on the protection of personal data.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
