  start: 3618
  end: 4088
  sha256: efd2bb334d72717d93f54f50b12d8a12bf63386bd77463095ffe4ac8485b15bd
  text: '2. For the purposes of the prevention, investigation, detection or prosecution of criminal offences
    or the execution of criminal penalties, including safeguarding against and preventing threats to public
    security, under the control and responsibility of law enforcement authorities, the processing of personal
    data in AI regulatory sandboxes shall be based on a specific Union or national law and subject to
    the same cumulative conditions as referred to in paragraph 1.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A059-P2-LAW-ENFORCEMENT-LEGAL-BASIS
