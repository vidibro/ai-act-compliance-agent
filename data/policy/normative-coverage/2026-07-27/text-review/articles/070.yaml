  sha256: 79ed087506078634d2414011dec331f25600e4937bb5102365582595b2e5dc45
  text: '3. Member States shall ensure that their national competent authorities are provided with adequate
    technical, financial and human resources, and with infrastructure to fulfil their tasks effectively
    under this Regulation. In particular, the national competent authorities shall have a sufficient number
    of personnel permanently available whose competences and expertise shall include an in-depth understanding
    of AI technologies, data and data computing, personal data protection, cybersecurity, fundamental
    rights, health and safety risks and knowledge of existing standards and legal requirements. Member
    States shall assess and, if necessary, update competence and resource requirements referred to in
    this paragraph on an annual basis.

    '
  disposition: normative
  disposition_reason: ''
