  sha256: a5eb00da08c2034cec0bb0f6f07bb0886c825c75197893289f1f1be4ea5ff123
  text: '4. Providers of general-purpose AI models may rely on codes of practice within the meaning of
    Article 56 to demonstrate compliance with the obligations set out in paragraph 1 of this Article,
    until a harmonised standard is published. Compliance with European harmonised standards grants providers
    the presumption of conformity to the extent that those standards cover those obligations. Providers
    of general-purpose AI models who do not adhere to an approved code of practice or do not comply with
    a European harmonised standard shall demonstrate alternative adequate means of compliance for assessment
    by the Commission.

    '
  disposition: normative
  disposition_reason: ''
