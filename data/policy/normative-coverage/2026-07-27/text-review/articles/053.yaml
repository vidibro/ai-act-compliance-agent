  sha256: 7df54b2de08d010e1f97488b6616e61fde33c32a3602d876fb672352d816bcb6
  text: '2. The obligations set out in paragraph 1, points (a) and (b), shall not apply to providers of
    AI models that are released under a free and open-source licence that allows for the access, usage,
    modification, and distribution of the model, and whose parameters, including the weights, the information
    on the model architecture, and the information on model usage, are made publicly available. This exception
    shall not apply to general-purpose AI models with systemic risks.

    '
  disposition: normative
  disposition_reason: ''
