  sha256: 0c953d7b6644f9ebd40bbdee6321eccbe3030d18e2a9195ad2bbde542d773e02
  text: "1. For high-risk AI systems listed in point 1 of Annex III, where, in demonstrating the compliance\
    \ of a high-risk AI system with the requirements set out in Section 2, the provider has applied harmonised\
    \ standards referred to in Article 40, or, where applicable, common specifications referred to in\
    \ Article 41, the provider shall opt for one of the following conformity assessment procedures based\
    \ on:\n        (a) the internal control referred to in Annex VI; or\n        (b) the assessment of\
    \ the quality management system and the assessment of the technical documentation, with the involvement\
    \ of a notified body, referred to in Annex VII.\n    In demonstrating the compliance of a high-risk\
    \ AI system with the requirements set out in Section 2, the provider shall follow the conformity assessment\
    \ procedure set out in Annex VII where:\n        (a) harmonised standards referred to in Article 40\
    \ do not exist, and common specifications referred to in Article 41 are not available;\n        (b)\
    \ the provider has not applied, or has applied only part of, the harmonised standard;\n        (c)\
    \ the common specifications referred to in point (a) exist, but the provider has not applied them;\n\
    \        (d) one or more of the harmonised standards referred to in point (a) has been published with\
    \ a restriction, and only on the part of the standard that was restricted.\n    For the purposes of\
    \ the conformity assessment procedure referred to in Annex VII, the provider may choose any of the\
    \ notified bodies. However, where the high-risk AI system is intended to be put into service by law\
    \ enforcement, immigration or asylum authorities or by Union institutions, bodies, offices or agencies,\
    \ the market surveillance authority referred to in Article 74(8) or (9), as applicable, shall act\
    \ as a notified body.\n"
  disposition: normative
  disposition_reason: ''
