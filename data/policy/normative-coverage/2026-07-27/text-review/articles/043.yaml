- segment_id: AIA-TEXT-A043-P3
  source:
    kind: article
    document: '43'
    act_version_date: '2026-07-27'
  start: 2078
  end: 5107
  sha256: 8f5aa200b05108bf00413eda15d366e87e542fd7b56a5f4cf7031714ca8cc44d
  text: "3. For high-risk AI systems covered by the Union harmonisation legislation listed in Section\
    \ A of Annex I, the provider of the system shall follow the relevant conformity assessment procedure\
    \ as required in accordance with the relevant Union harmonisation legislation. The requirements set\
    \ out in Section 2 of this Chapter shall apply to those high-risk AI systems and shall be part of\
    \ that assessment. Assessment of the quality management system set out in Article 17 shall also be\
    \ undertaken, and points 3, 4.3, 4.4. and 4.5, the fifth paragraph of point 4.6 and point 5 of Annex\
    \ VII shall apply.\n    For the purposes of that conformity assessment, notified bodies which have\
    \ been notified under the Union harmonisation legislation listed in Section A of Annex I shall have\
    \ the power to assess the conformity of high-risk AI systems with the requirements set out in Section\
    \ 2 of this Chapter, provided that the compliance of those notified bodies with the requirements laid\
    \ down in Article 31(4), (5), (10) and (11) has been assessed in the context of the notification procedure\
    \ in accordance with the relevant Union harmonisation legislation, which is evidenced through the\
    \ assessment as part of the existing notification. Without prejudice to Article 28, such notified\
    \ bodies which have been notified under the Union harmonisation legislation in Section A of Annex\
    \ I, shall apply for designation in accordance with Section 4 of this Chapter by 28 January 2028.\n\
    \    Where Union harmonisation legislation listed in Section A of Annex I provides the product manufacturer\
    \ with an option to rely on a conformity assessment that does not involve a third-party, provided\
    \ that that manufacturer has applied harmonised standards to ensure compliance with all the relevant\
    \ requirements, that manufacturer may use that option only if it has also applied harmonised standards\
    \ or, where applicable, common specifications referred to in Article 41, covering all requirements\
    \ set out in Section 2 of this Chapter. The classification of a product as a high-risk AI system in\
    \ accordance with Article 6(1) does not affect the choice of the conformity assessment procedure provided\
    \ to the manufacturers of products covered by Union harmonisation legislation listed in Section A\
    \ of Annex I, including, where applicable, an option to rely on harmonised standards. The manufacturers\
    \ of such products are not required to choose a conformity assessment procedure involving third-party\
    \ conformity assessment only because the product includes a high-risk AI system as a safety component,\
    \ if this is not required by the Union harmonisation legislation listed in Section A of Annex I.\n\
    \    Where a high-risk AI system is both covered by the Union harmonisation legislation listed in\
    \ Section A of Annex I and it falls within one of the categories listed in Annex III, the provider\
    \ of that system shall follow the relevant conformity assessment procedure as required pursuant to\
    \ the relevant Union harmonisation legislation listed in Section A of Annex I.\n"
  disposition: normative
