  end: 1371
  sha256: cca522c1216a7ebe084c3cc2328049d8a3fed3a9416c8b60883966f1039a3369
  text: '2. The rights of defence and of access to the file of operators falling within the scope of Article
    75(1) shall be fully respected in proceedings. In view of the possible adoption of decisions on the
    basis of Article 75c(1), those operators shall be entitled to have access to the AI Office file under
    the terms of a negotiated disclosure, subject to the legitimate interest of the operator or other
    person concerned in the protection of their business secrets. The AI Office shall have the power to
    adopt decisions setting out such terms of disclosure in the case of disagreement between the parties.
    The right of access to the file shall not extend to confidential information and internal documents
    of the AI Office, the Board, competent market surveillance authorities or other public authorities
    of the Member States. In particular, the right of access shall not extend to correspondence between
    the AI Office and those authorities. Nothing in this paragraph shall prevent the AI Office from disclosing
    and using information necessary to prove an infringement.

    '
  disposition: normative
  disposition_reason: ''
