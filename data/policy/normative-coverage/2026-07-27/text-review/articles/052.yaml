  sha256: 8122198f091eee8b1893f7aad5ce626076b42c13a93811c4013af69a8ab04891
  text: '2. The provider of a general-purpose AI model that meets the condition referred to in Article
    51(1), point (a), may present, with its notification, sufficiently substantiated arguments to demonstrate
    that, exceptionally, although it meets that requirement, the general-purpose AI model does not present,
    due to its specific characteristics, systemic risks and therefore should not be classified as a general-purpose
    AI model with systemic risk.

    '
  disposition: normative
