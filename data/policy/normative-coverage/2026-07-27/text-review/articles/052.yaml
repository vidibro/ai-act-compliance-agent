  sha256: a26d8710171723d37a7f12f6770fb706c5ab51f97f53dd357f1e929eb716e14a
  text: '1. Where a general-purpose AI model meets the condition referred to in Article 51(1), point (a),
    the relevant provider shall notify the Commission without delay and in any event within two weeks
    after that requirement is met or it becomes known that it will be met. That notification shall include
    the information necessary to demonstrate that the relevant requirement has been met. If the Commission
    becomes aware of a general-purpose AI model presenting systemic risks of which it has not been notified,
    it may decide to designate it as a model with systemic risk.

    '
  disposition: normative
  disposition_reason: ''
