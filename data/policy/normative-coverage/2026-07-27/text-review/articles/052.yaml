  end: 1454
  sha256: 4f2937bbd07a4993a900a6ac70864c5496a2b4679c0af027fef0b0134ea0c64f
  text: '3. Where the Commission concludes that the arguments submitted pursuant to paragraph 2 are not
    sufficiently substantiated and the relevant provider was not able to demonstrate that the general-purpose
    AI model does not present, due to its specific characteristics, systemic risks, it shall reject those
    arguments, and the general-purpose AI model shall be considered to be a general-purpose AI model with
    systemic risk.

    '
