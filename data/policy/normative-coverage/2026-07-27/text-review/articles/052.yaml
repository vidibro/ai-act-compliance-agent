  end: 2666
  sha256: 04b4a9f0fbaac1f794a351576c6df430d6051bda19792ee597befef4ef1fc776
  text: '5. Upon a reasoned request of a provider whose model has been designated as a general-purpose
    AI model with systemic risk pursuant to paragraph 4, the Commission shall take the request into account
    and may decide to reassess whether the general-purpose AI model can still be considered to present
    systemic risks on the basis of the criteria set out in Annex XIII. Such a request shall contain objective,
    detailed and new reasons that have arisen since the designation decision. Providers may request reassessment
    at the earliest six months after the designation decision. Where the Commission, following its reassessment,
    decides to maintain the designation as a general-purpose AI model with systemic risk, providers may
    request reassessment at the earliest six months after that decision.

    '
  disposition: normative
