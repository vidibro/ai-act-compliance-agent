- segment_id: AIA-TEXT-A099-P028
  source:
    kind: article
    document: '99'
    act_version_date: '2026-07-27'
  start: 5085
  end: 5406
  sha256: 1ad860cd516469c14ec6be296699ecb609b789882f47ccc09fbfb07039f9194b
  text: '9. Depending on the legal system of the Member States, the rules on administrative fines may
    be applied in such a manner that the fines are imposed by competent national courts or by other bodies,
    as applicable in those Member States. The application of such rules in those Member States shall have
    an equivalent effect.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A099-P9-EQUIVALENT-FINE-EFFECT
  qualifying_norm_ids: []
