  sha256: 8df55b08e30e4de1206d9f5e8d76997e471482def445b3da359030978c99951b
  text: '10. The exercise of powers under this Article shall be subject to appropriate procedural safeguards
    in accordance with Union and national law, including effective judicial remedies and due process.

    '
  disposition: normative
  disposition_reason: ''
