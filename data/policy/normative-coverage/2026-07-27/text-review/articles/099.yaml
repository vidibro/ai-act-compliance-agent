  sha256: d74406f32e110647f74f0cf042f868bfbd7bd65507ff112dfe0cc5fae96ef844
  text: '11. Member States shall, on an annual basis, report to the Commission about the administrative
    fines they have issued during that year, in accordance with this Article, and about any related litigation
    or judicial proceedings.

    '
