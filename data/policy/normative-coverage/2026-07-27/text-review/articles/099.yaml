  sha256: d56bd100fb369e767d370c8cd20cb24df5d59c5f97c0c1cf1e2078ebf0400c56
  text: '1. In accordance with the terms and conditions laid down in this Regulation, Member States shall
    lay down the rules on penalties and other enforcement measures, which may also include administrative
    fines, warnings and non-monetary measures, applicable to any infringement of this Regulation by operators,
    and shall take all measures necessary to ensure that they are properly and effectively implemented,
    thereby taking into account the guidelines issued by the Commission pursuant to Article 96. The penalties
    provided for shall be effective, proportionate and dissuasive. The Member States shall take into account
    the interests of SMEs, including start-ups, and SMCs, and their economic viability when imposing penalties.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
