  sha256: 7b6c9e27391751ec014dc3e2c711433acca847b0e6a282b493d2594ec6315002
  text: '4. With the exception of the section referred to in Article 49(4) and Article 60(4), point (c),
    the information contained in the EU database registered in accordance with Article 49 shall be accessible
    and publicly available in a user-friendly manner. The information should be easily navigable and machine-readable.
    The information registered in accordance with Article 60 shall be accessible only to market surveillance
    authorities and the Commission, unless the prospective provider or provider has given consent for
    also making the information accessible the public.

    '
