  sha256: 12d0d840a6fb134aa1453cd32b1865aa51bc671487b555a30ac5b79cc5fa5d46
  text: '1. The Commission shall, in collaboration with the Member States, set up and maintain an EU database
    containing information referred to in paragraphs 2 and 3 of this Article concerning high-risk AI systems
    referred to in Article 6(2) which are registered in accordance with Articles 49 and 60 and AI systems
    that are not considered as high-risk pursuant to Article 6(3) and which are registered in accordance
    with Article 6(4) and Article 49. When setting the functional specifications of such database, the
    Commission shall consult the relevant experts, and when updating the functional specifications of
    such database, the Commission shall consult the Board.

    '
