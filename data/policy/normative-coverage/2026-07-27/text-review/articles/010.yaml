  sha256: 6fc9584a03c1754b915ad7782b6a58bddc47532e0728605809d67f1832c9baaf
  text: '5. To the extent that it is strictly necessary for the purpose of ensuring bias detection and
    correction in relation to the high-risk AI systems in accordance with paragraph (2), points (f) and
    (g) of this Article, the providers of such systems may exceptionally process special categories of
    personal data, subject to appropriate safeguards for the fundamental rights and freedoms of natural
    persons. In addition to the provisions set out in Regulations (EU) 2016/679 and (EU) 2018/1725 and
    Directive (EU) 2016/680, all the following conditions must be met in order for such processing to
    occur:

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A010-P5-SPECIAL-CATEGORY-PROCESSING
  - AIA-NORM-A010-P5-B-REUSE-SECURITY
  - AIA-NORM-A010-P5-C-ACCESS-SAFEGUARDS
  - AIA-NORM-A010-P5-D-NO-THIRD-PARTY-ACCESS
