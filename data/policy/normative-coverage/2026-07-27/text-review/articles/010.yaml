  text: '1. High-risk AI systems which make use of techniques involving the training of AI models with
    data shall be developed on the basis of training, validation and testing data sets that meet the quality
    criteria referred to in paragraphs 2, 3 and 4 of this Article and in Article 4a(1) whenever such data
    sets are used.

    '
  disposition: normative
