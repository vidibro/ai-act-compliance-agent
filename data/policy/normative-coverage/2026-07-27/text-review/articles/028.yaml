  sha256: c0597e7f4313c95e8eb38ef7b70f42822c71452c9a44090ec52aa8113a83d6f0
  text: '7. Notifying authorities shall have an adequate number of competent personnel at their disposal
    for the proper performance of their tasks. Competent personnel shall have the necessary expertise,
