- segment_id: AIA-TEXT-A028-P008
  source:
    kind: article
    document: '28'
    act_version_date: '2026-07-27'
  start: 1736
  end: 2652
  sha256: 53080787e7f9bcedd936173dcd6bd63c17cd5e7275f786fafa1740a5294e4107
  text: '8. Notifying authorities designated pursuant to this Regulation that are responsible for AI systems
    covered by the Union harmonisation legislation listed in Section A of Annex I shall ensure that the
    conformity assessment body that applies for designation both pursuant to this Regulation and the Union
    harmonisation legislation listed in Section A of Annex I is provided with the possibility to submit
    a single application and undergoes a unified assessment procedure to be designated pursuant to this
    Regulation and Union harmonisation legislation listed in Section A of Annex I, where the relevant
    Union harmonisation legislation provides for such single application and unified assessment procedure.
    To that end, notifying authorities designated pursuant to this Regulation and those designated pursuant
    to the Union harmonisation legislation listed in Section A of Annex I shall cooperate in their assessments.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A028-P8-SINGLE-APPLICATION
  - AIA-NORM-A028-P8-COOPERATE-IN-ASSESSMENTS
  qualifying_norm_ids: []
