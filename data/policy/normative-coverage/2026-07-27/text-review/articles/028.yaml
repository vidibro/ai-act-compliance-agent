  sha256: 191d0d614b395dfed6fac9cd0ab50e46637eda6e53bb0fe5554c19327535f0dd
  text: '1. Each Member State shall designate or establish at least one notifying authority responsible
    for setting up and carrying out the necessary procedures for the assessment, designation and notification
    of conformity assessment bodies and for their monitoring. Those procedures shall be developed in cooperation
    between the notifying authorities of all Member States.

    '
