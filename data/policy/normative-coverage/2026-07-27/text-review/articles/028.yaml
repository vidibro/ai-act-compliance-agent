  sha256: 912ee14209b1384c116b4303937ae0e7397d6cc76a82da9e46778e12c4ee311c
  text: '    A conformity assessment body that is designated pursuant to more than one piece of Union
    harmonisation legislation listed in Section A of Annex I shall have to apply only once to be designated
    pursuant to this Regulation. A designation pursuant to this Regulation shall be applicable for all
    Union harmonisation legislation listed in Section A of Annex I for which the conformity assessment
    body is designated.

    '
  disposition: normative
  disposition_reason: ''
