  sha256: e6c80938deb34b831d7f839169e1dca8a2a40e237a8435c2fc2df786cf7249b0
  text: '    The single application and the unified assessment procedure referred to in this paragraph
    shall also be made available to notified bodies already designated pursuant to the Union harmonisation
    legislation listed in Section A of Annex I, when those notified bodies apply for designation pursuant
    to this Regulation, provided that the relevant Union harmonisation legislation provides for such a
    procedure.

    '
  disposition: normative
