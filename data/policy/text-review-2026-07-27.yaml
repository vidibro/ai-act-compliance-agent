- segment_id: AIA-TEXT-A010-FULL
  source:
    kind: article
    document: '10'
    act_version_date: '2026-07-27'
  start: 0
  end: 4680
  sha256: 1dbb1c812cb8b5fcc90b4e06844e8fa23a97c7a333a9181dcdc740caadd88ec2
  text: "Article 10\nData and data governance\n\n1. High-risk AI systems which make use of techniques\
    \ involving the training of AI models with data shall be developed on the basis of training, validation\
    \ and testing data sets that meet the quality criteria referred to in paragraphs 2, 3 and 4 of this\
    \ Article and in Article 4a(1) whenever such data sets are used.\n2. Training, validation and testing\
    \ data sets shall be subject to data governance and management practices appropriate for the intended\
    \ purpose of the high-risk AI system. Those practices shall concern in particular:\n        (a) the\
    \ relevant design choices;\n        (b) data collection processes and the origin of data, and in the\
    \ case of personal data, the original purpose of the data collection;\n        (c) relevant data-preparation\
    \ processing operations, such as annotation, labelling, cleaning, updating, enrichment and aggregation;\n\
    \        (d) the formulation of assumptions, in particular with respect to the information that the\
    \ data are supposed to measure and represent;\n        (e) an assessment of the availability, quantity\
    \ and suitability of the data sets that are needed;\n        (f) examination in view of possible biases\
    \ that are likely to affect the health and safety of persons, have a negative impact on fundamental\
    \ rights or lead to discrimination prohibited under Union law, especially where data outputs influence\
    \ inputs for future operations;\n        (g) appropriate measures to detect, prevent and mitigate\
    \ possible biases identified according to point (f);\n        (h) the identification of relevant data\
    \ gaps or shortcomings that prevent compliance with this Regulation, and how those gaps and shortcomings\
    \ can be addressed.\n3. Training, validation and testing data sets shall be relevant, sufficiently\
    \ representative, and to the best extent possible, free of errors and complete in view of the intended\
    \ purpose. They shall have the appropriate statistical properties, including, where applicable, as\
    \ regards the persons or groups of persons in relation to whom the high-risk AI system is intended\
    \ to be used. Those characteristics of the data sets may be met at the level of individual data sets\
    \ or at the level of a combination thereof.\n4. Data sets shall take into account, to the extent required\
    \ by the intended purpose, the characteristics or elements that are particular to the specific geographical,\
    \ contextual, behavioural or functional setting within which the high-risk AI system is intended to\
    \ be used.\n5. To the extent that it is strictly necessary for the purpose of ensuring bias detection\
    \ and correction in relation to the high-risk AI systems in accordance with paragraph (2), points\
    \ (f) and (g) of this Article, the providers of such systems may exceptionally process special categories\
    \ of personal data, subject to appropriate safeguards for the fundamental rights and freedoms of natural\
    \ persons. In addition to the provisions set out in Regulations (EU) 2016/679 and (EU) 2018/1725 and\
    \ Directive (EU) 2016/680, all the following conditions must be met in order for such processing to\
    \ occur:\n        (a) the bias detection and correction cannot be effectively fulfilled by processing\
    \ other data, including synthetic or anonymised data;\n        (b) the special categories of personal\
    \ data are subject to technical limitations on the re-use of the personal data, and state-of-the-art\
    \ security and privacy-preserving measures, including pseudonymisation;\n        (c) the special categories\
    \ of personal data are subject to measures to ensure that the personal data processed are secured,\
    \ protected, subject to suitable safeguards, including strict controls and documentation of the access,\
    \ to avoid misuse and ensure that only authorised persons have access to those personal data with\
    \ appropriate confidentiality obligations;\n        (d) the special categories of personal data are\
    \ not to be transmitted, transferred or otherwise accessed by other parties;\n        (e) the special\
    \ categories of personal data are deleted once the bias has been corrected or the personal data has\
    \ reached the end of its retention period, whichever comes first;\n        (f) the records of processing\
    \ activities pursuant to Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680\
    \ include the reasons why the processing of special categories of personal data was strictly necessary\
    \ to detect and correct biases, and why that objective could not be achieved by processing other data.\n\
    6. For the development of high-risk AI systems not using techniques involving the training of AI models,\
    \ paragraphs 2, 3 and 4 of this Article and Article 4a(1) shall apply only to the testing data sets.\n"
  disposition: needs_review
