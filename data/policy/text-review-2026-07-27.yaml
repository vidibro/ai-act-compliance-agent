- segment_id: AIA-TEXT-A011-P1
  source:
    kind: article
    document: '11'
    act_version_date: '2026-07-27'
  start: 36
  end: 1183
  sha256: c89f4290d74bfa343d0e7489e783876a545ef775b1535ae387d3ba308604cf95
  text: "1. The technical documentation of a high-risk AI system shall be drawn up before that system\
    \ is placed on the market or put into service and shall be kept up-to date.\n    That technical documentation\
    \ shall be drawn up in such a way as to demonstrate that the high-risk AI system complies with the\
    \ requirements set out in this Section and to provide national competent authorities and notified\
    \ bodies with the necessary information in a clear and comprehensive form to assess the compliance\
    \ of the AI system with those requirements. It shall contain, at a minimum, the elements set out in\
    \ Annex IV. SMEs, including start-ups, and SMCs, may provide the elements of the technical documentation\
    \ specified in Annex IV in a simplified manner. To that end, the Commission shall establish a simplified\
    \ technical documentation form targeted at the needs of SMEs, including start-ups, and SMCs. Where\
    \ an SME, including a start-up, or an SMC, opts to provide the information required in Annex IV in\
    \ a simplified manner, it shall use the form referred to in this paragraph. Notified bodies shall\
    \ accept the form for the purposes of the conformity assessment.\n"
  disposition: normative
  disposition_reason: ''
