  text: "Article 3\nDefinitions\n\nFor the purposes of this Regulation, the following definitions apply:\n\
    \    (1) \u2018AI system\u2019 means a machine-based system that is designed to operate with varying\
    \ levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or\
    \ implicit objectives, infers, from the input it receives, how to generate outputs such as predictions,\
    \ content, recommendations, or decisions that can influence physical or virtual environments;\n  \
    \  (2) \u2018risk\u2019 means the combination of the probability of an occurrence of harm and the\
    \ severity of that harm;\n    (3) \u2018provider\u2019 means a natural or legal person, public authority,\
    \ agency or other body that develops an AI system or a general-purpose AI model or that has an AI\
    \ system or a general-purpose AI model developed and places it on the market or puts the AI system\
    \ into service under its own name or trademark, whether for payment or free of charge;\n    (4) \u2018\
    deployer\u2019 means a natural or legal person, public authority, agency or other body using an AI\
    \ system under its authority except where the AI system is used in the course of a personal non-professional\
    \ activity;\n    (5) \u2018authorised representative\u2019 means a natural or legal person located\
    \ or established in the Union who has received and accepted a written mandate from a provider of an\
    \ AI system or a general-purpose AI model to, respectively, perform and carry out on its behalf the\
    \ obligations and procedures established by this Regulation;\n    (6) \u2018importer\u2019 means a\
    \ natural or legal person located or established in the Union that places on the market an AI system\
    \ that bears the name or trademark of a natural or legal person established in a third country;\n\
    \    (7) \u2018distributor\u2019 means a natural or legal person in the supply chain, other than the\
    \ provider or the importer, that makes an AI system available on the Union market;\n    (8) \u2018\
    operator\u2019 means a provider, product manufacturer, deployer, authorised representative, importer\
    \ or distributor;\n    (9) \u2018placing on the market\u2019 means the first making available of an\
    \ AI system or a general-purpose AI model on the Union market;\n    (10) \u2018making available on\
    \ the market\u2019 means the supply of an AI system or a general-purpose AI model for distribution\
    \ or use on the Union market in the course of a commercial activity, whether in return for payment\
    \ or free of charge;\n    (11) \u2018putting into service\u2019 means the supply of an AI system for\
    \ first use directly to the deployer or for own use in the Union for its intended purpose;\n    (12)\
    \ \u2018intended purpose\u2019 means the use for which an AI system is intended by the provider, including\
    \ the specific context and conditions of use, as specified in the information supplied by the provider\
    \ in the instructions for use, promotional or sales materials and statements, as well as in the technical\
    \ documentation;\n    (13) \u2018reasonably foreseeable misuse\u2019 means the use of an AI system\
    \ in a way that is not in accordance with its intended purpose, but which may result from reasonably\
    \ foreseeable human behaviour or interaction with other systems, including other AI systems;\n   \
    \ (14) \u2018safety component\u2019 means a component of a product or of an AI system which fulfils\
    \ a safety function for that product or AI system, or the failure or malfunctioning of which endangers\
    \ the health and safety of persons or property; for the purposes of this definition, a component fulfils\
    \ a safety function where its intended purpose is to prevent or mitigate risks to health and safety\
    \ of persons or property;\n    (14a) \u2018micro, small and medium-sized enterprise\u2019 or \u2018\
    SME\u2019 means a micro, small or medium-sized enterprise as defined in Article 2 of the Annex to\
    \ Recommendation 2003/361/EC;\n    (14b) \u2018small mid-cap enterprise\u2019 or \u2018SMC\u2019 means\
    \ a small mid-cap enterprise as defined in point (2) of the Annex to Recommendation (EU) 2025/1099;\n\
    \    (15) \u2018instructions for use\u2019 means the information provided by the provider to inform\
    \ the deployer of, in particular, an AI system\u2019s intended purpose and proper use;\n    (16) \u2018\
    recall of an AI system\u2019 means any measure aiming to achieve the return to the provider or taking\
    \ out of service or disabling the use of an AI system made available to deployers;\n    (17) \u2018\
    withdrawal of an AI system\u2019 means any measure aiming to prevent an AI system in the supply chain\
    \ being made available on the market;\n    (18) \u2018performance of an AI system\u2019 means the\
    \ ability of an AI system to achieve its intended purpose;\n    (19) \u2018notifying authority\u2019\
    \ means the national authority responsible for setting up and carrying out the necessary procedures\
    \ for the assessment, designation and notification of conformity assessment bodies and for their monitoring;\n\
    \    (20) \u2018conformity assessment\u2019 means the process of demonstrating whether the requirements\
    \ set out in Chapter III, Section 2 relating to a high-risk AI system have been fulfilled;\n    (21)\
    \ \u2018conformity assessment body\u2019 means a body that performs third-party conformity assessment\
    \ activities, including testing, certification and inspection;\n    (22) \u2018notified body\u2019\
    \ means a conformity assessment body notified in accordance with this Regulation and other relevant\
    \ Union harmonisation legislation;\n    (23) \u2018substantial modification\u2019 means a change to\
    \ an AI system after its placing on the market or putting into service which is not foreseen or planned\
    \ in the initial conformity assessment carried out by the provider and as a result of which the compliance\
    \ of the AI system with the requirements set out in Chapter III, Section 2 is affected or results\
    \ in a modification to the intended purpose for which the AI system has been assessed;\n    (24) \u2018\
    CE marking\u2019 means a marking by which a provider indicates that an AI system is in conformity\
    \ with the requirements set out in Chapter III, Section 2 and other applicable Union harmonisation\
    \ legislation providing for its affixing;\n    (25) \u2018post-market monitoring system\u2019 means\
    \ all activities carried out by providers of AI systems to collect and review experience gained from\
    \ the use of AI systems they place on the market or put into service for the purpose of identifying\
    \ any need to immediately apply any necessary corrective or preventive actions;\n    (26) \u2018market\
    \ surveillance authority\u2019 means the national authority carrying out the activities and taking\
    \ the measures pursuant to Regulation (EU) 2019/1020;\n    (27) \u2018harmonised standard\u2019 means\
    \ a harmonised standard as defined in Article 2(1), point (c), of Regulation (EU) No 1025/2012;\n\
    \    (28) \u2018common specification\u2019 means a set of technical specifications as defined in Article\
    \ 2, point (4) of Regulation (EU) No 1025/2012, providing means to comply with certain requirements\
    \ established under this Regulation;\n    (29) \u2018training data\u2019 means data used for training\
    \ an AI system through fitting its learnable parameters;\n    (30) \u2018validation data\u2019 means\
    \ data used for providing an evaluation of the trained AI system and for tuning its non-learnable\
    \ parameters and its learning process in order, inter alia, to prevent underfitting or overfitting;\n\
    \    (31) \u2018validation data set\u2019 means a separate data set or part of the training data set,\
    \ either as a fixed or variable split;\n    (32) \u2018testing data\u2019 means data used for providing\
    \ an independent evaluation of the AI system in order to confirm the expected performance of that\
    \ system before its placing on the market or putting into service;\n    (33) \u2018input data\u2019\
    \ means data provided to or directly acquired by an AI system on the basis of which the system produces\
    \ an output;\n    (34) \u2018biometric data\u2019 means personal data resulting from specific technical\
    \ processing relating to the physical, physiological or behavioural characteristics of a natural person,\
    \ such as facial images or dactyloscopic data;\n    (35) \u2018biometric identification\u2019 means\
    \ the automated recognition of physical, physiological, behavioural, or psychological human features\
    \ for the purpose of establishing the identity of a natural person by comparing biometric data of\
    \ that individual to biometric data of individuals stored in a database;\n    (36) \u2018biometric\
    \ verification\u2019 means the automated, one-to-one verification, including authentication, of the\
    \ identity of natural persons by comparing their biometric data to previously provided biometric data;\n\
    \    (37) \u2018special categories of personal data\u2019 means the categories of personal data referred\
    \ to in Article 9(1) of Regulation (EU) 2016/679, Article 10 of Directive (EU) 2016/680 and Article\
    \ 10(1) of Regulation (EU) 2018/1725;\n    (38) \u2018sensitive operational data\u2019 means operational\
    \ data related to activities of prevention, detection, investigation or prosecution of criminal offences,\
    \ the disclosure of which could jeopardise the integrity of criminal proceedings;\n    (39) \u2018\
    emotion recognition system\u2019 means an AI system for the purpose of identifying or inferring emotions\
    \ or intentions of natural persons on the basis of their biometric data;\n    (40) \u2018biometric\
    \ categorisation system\u2019 means an AI system for the purpose of assigning natural persons to specific\
    \ categories on the basis of their biometric data, unless it is ancillary to another commercial service\
    \ and strictly necessary for objective technical reasons;\n    (41) \u2018remote biometric identification\
    \ system\u2019 means an AI system for the purpose of identifying natural persons, without their active\
    \ involvement, typically at a distance through the comparison of a person\u2019s biometric data with\
    \ the biometric data contained in a reference database;\n    (42) \u2018real-time remote biometric\
    \ identification system\u2019 means a remote biometric identification system, whereby the capturing\
    \ of biometric data, the comparison and the identification all occur without a significant delay,\
    \ comprising not only instant identification, but also limited short delays in order to avoid circumvention;\n\
    \    (43) \u2018post-remote biometric identification system\u2019 means a remote biometric identification\
    \ system other than a real-time remote biometric identification system;\n    (44) \u2018publicly accessible\
    \ space\u2019 means any publicly or privately owned physical place accessible to an undetermined number\
    \ of natural persons, regardless of whether certain conditions for access may apply, and regardless\
    \ of the potential capacity restrictions;\n    (45) \u2018law enforcement authority\u2019 means:\n\
    \            (a) any public authority competent for the prevention, investigation, detection or prosecution\
    \ of criminal offences or the execution of criminal penalties, including the safeguarding against\
    \ and the prevention of threats to public security; or\n            (b) any other body or entity entrusted\
    \ by Member State law to exercise public authority and public powers for the purposes of the prevention,\
    \ investigation, detection or prosecution of criminal offences or the execution of criminal penalties,\
    \ including the safeguarding against and the prevention of threats to public security;\n    (46) \u2018\
    law enforcement\u2019 means activities carried out by law enforcement authorities or on their behalf\
    \ for the prevention, investigation, detection or prosecution of criminal offences or the execution\
    \ of criminal penalties, including safeguarding against and preventing threats to public security;\n\
    \    (47) \u2018AI Office\u2019 means the Commission\u2019s function of contributing to the implementation,\
    \ monitoring and supervision of AI systems and general-purpose AI models, and AI governance, provided\
    \ for in Commission Decision of 24 January 2024; references in this Regulation to the AI Office shall\
    \ be construed as references to the Commission;\n    (48) \u2018national competent authority\u2019\
    \ means a notifying authority or a market surveillance authority; as regards AI systems put into service\
    \ or used by Union institutions, agencies, offices and bodies, references to national competent authorities\
    \ or market surveillance authorities in this Regulation shall be construed as references to the European\
    \ Data Protection Supervisor;\n    (49) \u2018serious incident\u2019 means an incident or malfunctioning\
    \ of an AI system that directly or indirectly leads to any of the following:\n            (a) the\
    \ death of a person, or serious harm to a person\u2019s health;\n            (b) a serious and irreversible\
    \ disruption of the management or operation of critical infrastructure;\n            (c) the infringement\
    \ of obligations under Union law intended to protect fundamental rights;\n            (d) serious\
    \ harm to property or the environment;\n    (50) \u2018personal data\u2019 means personal data as\
    \ defined in Article 4, point (1), of Regulation (EU) 2016/679;\n    (51) \u2018non-personal data\u2019\
    \ means data other than personal data as defined in Article 4, point (1), of Regulation (EU) 2016/679;\n\
    \    (52) \u2018profiling\u2019 means profiling as defined in Article 4, point (4), of Regulation\
    \ (EU) 2016/679;\n    (53) \u2018real-world testing plan\u2019 means a document that describes the\
    \ objectives, methodology, geographical, population and temporal scope, monitoring, organisation and\
    \ conduct of testing in real-world conditions;\n    (54) \u2018sandbox plan\u2019 means a document\
    \ agreed between the participating provider and the competent authority describing the objectives,\
    \ conditions, timeframe, methodology and requirements for the activities carried out within the sandbox;\n\
    \    (55) \u2018AI regulatory sandbox\u2019 means a controlled framework set up by a competent authority\
    \ which offers providers or prospective providers of AI systems the possibility to develop, train,\
    \ validate and test, where appropriate in real-world conditions, an innovative AI system, pursuant\
    \ to a sandbox plan for a limited time under regulatory supervision;\n    (56) \u2018AI literacy\u2019\
    \ means skills, knowledge and understanding that allow providers, deployers and affected persons,\
    \ taking into account their respective rights and obligations in the context of this Regulation, to\
    \ make an informed deployment of AI systems, as well as to gain awareness about the opportunities\
    \ and risks of AI and possible harm it can cause;\n    (57) \u2018testing in real-world conditions\u2019\
    \ means the temporary testing of an AI system for its intended purpose in real-world conditions outside\
    \ a laboratory or otherwise simulated environment, with a view to gathering reliable and robust data\
    \ and to assessing and verifying the conformity of the AI system with the requirements of this Regulation\
    \ and it does not qualify as placing the AI system on the market or putting it into service within\
    \ the meaning of this Regulation, provided that all the conditions laid down in Article 57 or 60 are\
    \ fulfilled;\n    (58) \u2018subject\u2019, for the purpose of real-world testing, means a natural\
    \ person who participates in testing in real-world conditions;\n    (59) \u2018informed consent\u2019\
    \ means a subject\u2019s freely given, specific, unambiguous and voluntary expression of his or her\
    \ willingness to participate in a particular testing in real-world conditions, after having been informed\
    \ of all aspects of the testing that are relevant to the subject\u2019s decision to participate;\n\
    \    (60) \u2018deep fake\u2019 means AI-generated or manipulated image, audio or video content that\
    \ resembles existing persons, objects, places, entities or events and would falsely appear to a person\
    \ to be authentic or truthful;\n    (61) \u2018widespread infringement\u2019 means any act or omission\
    \ contrary to Union law protecting the interest of individuals, which:\n            (a) has harmed\
    \ or is likely to harm the collective interests of individuals residing in at least two Member States\
    \ other than the Member State in which:\n                    (i) the act or omission originated or\
    \ took place;\n                    (ii) the provider concerned, or, where applicable, its authorised\
    \ representative is located or established; or\n                    (iii) the deployer is established,\
    \ when the infringement is committed by the deployer;\n            (b) has caused, causes or is likely\
    \ to cause harm to the collective interests of individuals and has common features, including the\
    \ same unlawful practice or the same interest being infringed, and is occurring concurrently, committed\
    \ by the same operator, in at least three Member States;\n    (62) \u2018critical infrastructure\u2019\
    \ means critical infrastructure as defined in Article 2, point (4), of Directive (EU) 2022/2557;\n\
    \    (63) \u2018general-purpose AI model\u2019 means an AI model, including where such an AI model\
    \ is trained with a large amount of data using self-supervision at scale, that displays significant\
    \ generality and is capable of competently performing a wide range of distinct tasks regardless of\
    \ the way the model is placed on the market and that can be integrated into a variety of downstream\
    \ systems or applications, except AI models that are used for research, development or prototyping\
    \ activities before they are placed on the market;\n    (64) \u2018high-impact capabilities\u2019\
    \ means capabilities that match or exceed the capabilities recorded in the most advanced general-purpose\
    \ AI models;\n    (65) \u2018systemic risk\u2019 means a risk that is specific to the high-impact\
    \ capabilities of general-purpose AI models, having a significant impact on the Union market due to\
    \ their reach, or due to actual or reasonably foreseeable negative effects on public health, safety,\
    \ public security, fundamental rights, or the society as a whole, that can be propagated at scale\
    \ across the value chain;\n    (66) \u2018general-purpose AI system\u2019 means an AI system which\
    \ is based on a general-purpose AI model and which has the capability to serve a variety of purposes,\
    \ both for direct use as well as for integration in other AI systems;\n    (67) \u2018floating-point\
    \ operation\u2019 means any mathematical operation or assignment involving floating-point numbers,\
    \ which are a subset of the real numbers typically represented on computers by an integer of fixed\
    \ precision scaled by an integer exponent of a fixed base;\n    (68) \u2018downstream provider\u2019\
    \ means a provider of an AI system, including a general-purpose AI system, which integrates an AI\
    \ model, regardless of whether the AI model is provided by themselves and vertically integrated or\
    \ provided by another entity based on contractual relations.\n"
