- segment_id: AIA-TEXT-A051-FULL
  source:
    kind: article
    document: '51'
    act_version_date: '2026-07-27'
  start: 0
  end: 1273
  sha256: 077814d7e562da0f75c452e54787016d6acaee0899e72bb7202aa024ac5c1e6e
  text: "Article 51\nClassification of general-purpose AI models as general-purpose AI models with systemic\
    \ risk\n\n1. A general-purpose AI model shall be classified as a general-purpose AI model with systemic\
    \ risk if it meets any of the following conditions:\n        (a) it has high impact capabilities evaluated\
    \ on the basis of appropriate technical tools and methodologies, including indicators and benchmarks;\n\
    \        (b) based on a decision of the Commission, ex officio or following a qualified alert from\
    \ the scientific panel, it has capabilities or an impact equivalent to those set out in point (a)\
    \ having regard to the criteria set out in Annex XIII.\n2. A general-purpose AI model shall be presumed\
    \ to have high impact capabilities pursuant to paragraph 1, point (a), when the cumulative amount\
    \ of computation used for its training measured in floating point operations is greater than 10 25.\n\
    3. The Commission shall adopt delegated acts in accordance with Article 97 to amend the thresholds\
    \ listed in paragraphs 1 and 2 of this Article, as well as to supplement benchmarks and indicators\
    \ in light of evolving technological developments, such as algorithmic improvements or increased hardware\
    \ efficiency, when necessary, for these thresholds to reflect the state of the art.\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
