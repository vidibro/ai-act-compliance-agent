- segment_id: AIA-TEXT-A047-FULL
  source:
    kind: article
    document: '47'
    act_version_date: '2026-07-27'
  start: 0
  end: 1913
  sha256: fe6ee00e7230d939c53daec10661d32b6ba00dcd2ce6171bba75ba23d07f1552
  text: 'Article 47

    EU declaration of conformity


    1. The provider shall draw up a written machine readable, physical or electronically signed EU declaration
    of conformity for each high-risk AI system, and keep it at the disposal of the national competent
    authorities for 10 years after the high-risk AI system has been placed on the market or put into service.
    The EU declaration of conformity shall identify the high-risk AI system for which it has been drawn
    up. A copy of the EU declaration of conformity shall be submitted to the relevant national competent
    authorities upon request.

    2. The EU declaration of conformity shall state that the high-risk AI system concerned meets the requirements
    set out in Section 2. The EU declaration of conformity shall contain the information set out in Annex
    V, and shall be translated into a language that can be easily understood by the national competent
    authorities of the Member States in which the high-risk AI system is placed on the market or made
    available.

    3. Where high-risk AI systems are subject to other Union harmonisation legislation which also requires
    an EU declaration of conformity, a single EU declaration of conformity shall be drawn up in respect
    of all Union law applicable to the high-risk AI system. The declaration shall contain all the information
    required to identify the Union harmonisation legislation to which the declaration relates.

    4. By drawing up the EU declaration of conformity, the provider shall assume responsibility for compliance
    with the requirements set out in Section 2. The provider shall keep the EU declaration of conformity
    up-to-date as appropriate.

    5. The Commission is empowered to adopt delegated acts in accordance with Article 97 in order to amend
    Annex V by updating the content of the EU declaration of conformity set out in that Annex, in order
    to introduce elements that become necessary in light of technical progress.

    '
