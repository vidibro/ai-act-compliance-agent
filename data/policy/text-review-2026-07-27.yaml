- segment_id: AIA-TEXT-A075B-FULL
  source:
    kind: article
    document: 75b
    act_version_date: '2026-07-27'
  start: 0
  end: 953
  sha256: 1f38ae0f53d2b82bbc4bfc080b96091c9d5553270a29b8d531469f8586c3ff34
  text: "Article 75b\nCommitments\n\nIf, during proceedings under Article 75a(2), the operator concerned\
    \ offers commitments to ensure compliance with the relevant provisions of this Regulation, the AI\
    \ Office may, by decision, make those commitments binding on the operator concerned and declare that\
    \ there are no further grounds for action. The AI Office may, upon request or on its own initiative,\
    \ reopen the proceedings where:\n    (a) there has been a material change in any of the facts on which\
    \ the decision was based;\n    (b) the operator acts contrary to its commitments; or\n    (c) the\
    \ decision was based on incomplete, incorrect or misleading information provided by the operator concerned.\n\
    Where the AI Office considers that the commitments offered by the operator concerned are unable to\
    \ ensure effective compliance with the relevant provisions of this Regulation, it shall reject those\
    \ commitments in a reasoned decision when concluding the proceedings.\n"
  disposition: needs_review
