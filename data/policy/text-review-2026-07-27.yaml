  sha256: e4db150eb319f0be9fae8181086b2d1f292d16badebe836a6003fd7f6534de13
  text: "Article 62\nMeasures for providers and deployers, in particular SMEs, including start-ups\n\n\
    1. Member States shall undertake the following actions:\n        (a) provide SMEs, including start-ups,\
    \ having a registered office or a branch in the Union, with priority access to the AI regulatory sandboxes,\
    \ to the extent that they fulfil the eligibility conditions and selection criteria; the priority access\
    \ shall not preclude other SMEs, including start-ups, other than those referred to in this paragraph\
    \ from access to the AI regulatory sandbox, provided that they also fulfil the eligibility conditions\
    \ and selection criteria;\n        (b) organise specific awareness raising and training activities\
    \ on the application of this Regulation tailored to the needs of SMEs including start-ups, deployers\
    \ and, as appropriate, local public authorities;\n        (c) utilise existing dedicated channels\
    \ and where appropriate, establish new ones for communication with SMEs including start-ups, deployers,\
    \ other innovators and, as appropriate, local public authorities to provide advice and respond to\
    \ queries about the implementation of this Regulation, including as regards participation in AI regulatory\
    \ sandboxes;\n        (d) facilitate the participation of SMEs and other relevant stakeholders in\
    \ the standardisation development process.\n2. The specific interests and needs of the SME providers,\
    \ including start-ups, shall be taken into account when setting the fees for conformity assessment\
    \ under Article 43, reducing those fees proportionately to their size, market size and other relevant\
    \ indicators.\n3. The AI Office shall undertake the following actions:\n        (a) provide standardised\
    \ templates for areas covered by this Regulation, as specified by the Board in its request;\n    \
    \    (b) develop and maintain a single information platform providing easy to use information in relation\
    \ to this Regulation for all operators across the Union;\n        (c) organise appropriate communication\
    \ campaigns to raise awareness about the obligations arising from this Regulation;\n        (d) evaluate\
    \ and promote the convergence of best practices in public procurement procedures in relation to AI\
    \ systems.\n"
  disposition: needs_review
