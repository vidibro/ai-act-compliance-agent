  sha256: 7bd9202507eb70921a8d30cb24a501d11c813125c670a2791b825b90ccdad24f
  text: 'ANNEX IX

    Information to be submitted upon the registration of high-risk AI systems listed in Annex III in relation
    to testing in real world conditions in accordance with Article 60


    The following information shall be provided and thereafter kept up to date with regard to testing
    in real world conditions to be registered in accordance with Article 60:

    1. A Union-wide unique single identification number of the testing in real world conditions;

    2. The name and contact details of the provider or prospective provider and of the deployers involved
    in the testing in real world conditions;

    3. A brief description of the AI system, its intended purpose, and other information necessary for
    the identification of the system;

    4. A summary of the main characteristics of the plan for testing in real world conditions;

    5. Information on the suspension or termination of the testing in real world conditions.

    '
