- segment_id: AIA-TEXT-A055-FULL
  source:
    kind: article
    document: '55'
    act_version_date: '2026-07-27'
  start: 0
  end: 1933
  sha256: 43bd7db828daa9f131b0a295bf6cab550a7714b7777c24a692726673f43fe605
  text: "Article 55\nObligations of providers of general-purpose AI models with systemic risk\n\n1. In\
    \ addition to the obligations listed in Articles 53 and 54, providers of general-purpose AI models\
    \ with systemic risk shall:\n        (a) perform model evaluation in accordance with standardised\
    \ protocols and tools reflecting the state of the art, including conducting and documenting adversarial\
    \ testing of the model with a view to identifying and mitigating systemic risks;\n        (b) assess\
    \ and mitigate possible systemic risks at Union level, including their sources, that may stem from\
    \ the development, the placing on the market, or the use of general-purpose AI models with systemic\
    \ risk;\n        (c) keep track of, document, and report, without undue delay, to the AI Office and,\
    \ as appropriate, to national competent authorities, relevant information about serious incidents\
    \ and possible corrective measures to address them;\n        (d) ensure an adequate level of cybersecurity\
    \ protection for the general-purpose AI model with systemic risk and the physical infrastructure of\
    \ the model.\n2. Providers of general-purpose AI models with systemic risk may rely on codes of practice\
    \ within the meaning of Article 56 to demonstrate compliance with the obligations set out in paragraph\
    \ 1 of this Article, until a harmonised standard is published. Compliance with European harmonised\
    \ standards grants providers the presumption of conformity to the extent that those standards cover\
    \ those obligations. Providers of general-purpose AI models with systemic risks who do not adhere\
    \ to an approved code of practice or do not comply with a European harmonised standard shall demonstrate\
    \ alternative adequate means of compliance for assessment by the Commission.\n3. Any information or\
    \ documentation obtained pursuant to this Article, including trade secrets, shall be treated in accordance\
    \ with the confidentiality obligations set out in Article 78.\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
