  sha256: 951ef023a655f84f3d39323c1c97f3991178b8c842d01606373d211804d117c3
  text: "Article 18\nDocumentation keeping\n\n1. The provider shall, for a period ending 10 years after\
    \ the high-risk AI system has been placed on the market or put into service, keep at the disposal\
    \ of the national competent authorities:\n        (a) the technical documentation referred to in Article\
    \ 11;\n        (b) the documentation concerning the quality management system referred to in Article\
    \ 17;\n        (c) the documentation concerning the changes approved by notified bodies, where applicable;\n\
    \        (d) the decisions and other documents issued by the notified bodies, where applicable;\n\
    \        (e) the EU declaration of conformity referred to in Article 47.\n2. Each Member State shall\
    \ determine conditions under which the documentation referred to in paragraph 1 remains at the disposal\
    \ of the national competent authorities for the period indicated in that paragraph for the cases when\
    \ a provider or its authorised representative established on its territory goes bankrupt or ceases\
    \ its activity prior to the end of that period.\n3. Providers that are financial institutions subject\
    \ to requirements regarding their internal governance, arrangements or processes under Union financial\
    \ services law shall maintain the technical documentation as part of the documentation kept under\
    \ the relevant Union financial services law.\n"
  disposition: needs_review
