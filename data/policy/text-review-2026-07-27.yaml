  sha256: 5e9179d9ce03bffdc4e9681a8536cd1ce7a4257276bb8cec5302aa53d96e4d14
  text: 'Article 42

    Presumption of conformity with certain requirements


    1. High-risk AI systems that have been trained and tested on data reflecting the specific geographical,
    behavioural, contextual or functional setting within which they are intended to be used shall be presumed
    to comply with the relevant requirements laid down in Article 10(4).

    2. High-risk AI systems that have been certified or for which a statement of conformity has been issued
    under a cybersecurity scheme pursuant to Regulation (EU) 2019/881 and the references of which have
    been published in the Official Journal of the European Union shall be presumed to comply with the
    cybersecurity requirements set out in Article 15 of this Regulation in so far as the cybersecurity
    certificate or statement of conformity or parts thereof cover those requirements.

    3. Where high-risk AI systems fall within the scope of Regulation (EU) 2024/2847 and the conditions
    laid down in Article 12(1) of that Regulation are fulfilled, such systems shall be deemed to comply
    with the cybersecurity requirements set out in Article 15 of this Regulation.

    '
