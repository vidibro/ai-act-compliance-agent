- segment_id: AIA-TEXT-A021-FULL
  source:
    kind: article
    document: '21'
    act_version_date: '2026-07-27'
  start: 0
  end: 937
  sha256: d2147148702e317378e516d1cb4a860193d4dce1f666abe6f39f8dc3451b9f65
  text: 'Article 21

    Cooperation with competent authorities


    1. Providers of high-risk AI systems shall, upon a reasoned request by a competent authority, provide
    that authority all the information and documentation necessary to demonstrate the conformity of the
    high-risk AI system with the requirements set out in Section 2, in a language which can be easily
    understood by the authority in one of the official languages of the institutions of the Union as indicated
    by the Member State concerned.

    2. Upon a reasoned request by a competent authority, providers shall also give the requesting competent
    authority, as applicable, access to the automatically generated logs of the high-risk AI system referred
    to in Article 12(1), to the extent such logs are under their control.

    3. Any information obtained by a competent authority pursuant to this Article shall be treated in
    accordance with the confidentiality obligations set out in Article 78.

    '
  disposition: needs_review
