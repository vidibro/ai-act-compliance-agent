  end: 5843
  sha256: aa99df6143fd7bb76ec2d5e71508eb2ac8b9314e5ab322fae04b23648a14017f
  text: "4. High-risk AI systems that have already been subject to a conformity assessment procedure shall\
    \ undergo a new conformity assessment procedure in the event of a substantial modification, regardless\
    \ of whether the modified system is intended to be further distributed or continues to be used by\
    \ the current deployer.\n    For high-risk AI systems that continue to learn after being placed on\
    \ the market or put into service, changes to the high-risk AI system and its performance that have\
    \ been pre-determined by the provider at the moment of the initial conformity assessment and are part\
    \ of the information contained in the technical documentation referred to in point 2(f) of Annex IV,\
    \ shall not constitute a substantial modification.\n"
