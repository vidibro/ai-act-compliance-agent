  sha256: 7c742f462d788197083f501666d097ef114f88ca44d6eb84bf8dc27db7d96b96
  text: 'Article 4

    AI literacy


    1. Providers and deployers of AI systems shall take measures to support the development of AI literacy
    of their staff and other persons dealing with the operation and use of AI systems on their behalf,
    taking into account their technical knowledge, experience, education and training and the context
    the AI systems are to be used in, and considering the persons or groups of persons on whom the AI
    systems are to be used. This obligation does not require providers or deployers to guarantee any specific
    level of AI literacy of any individual.

    2. The Commission and the Member States shall support and facilitate the efforts of providers and
    deployers of AI systems, in particular SMEs, in fulfilling their obligation under paragraph 1 of this
    Article. For that purpose, the Commission shall publish practical examples of how to comply with that
    obligation on the single information platform referred to in Article 62(3), point (b).

    3. The Board shall adopt recommendations, taking into account European competence frameworks, to support
    the Commission and Member States in the promotion of AI literacy required under paragraph 1, including
    by setting out common objectives.

    '
