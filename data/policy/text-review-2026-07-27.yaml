  text: 'ANNEX XIV


    The list of codes, categories and corresponding types of AI systems for the purpose of the notification
    procedure referred to in Article 30 specifying the scope of the designation as notified bodies

    1.Introduction Conformity assessment of high-risk AI systems pursuant to this Regulation may require
    the involvement of conformity assessment bodies. Only conformity assessment bodies that have been
    designated in accordance with this Regulation may carry out conformity assessments and only for the
    activities related to the types of AI systems concerned. The list of codes, categories, and corresponding
    types of AI systems sets the scope of the designation of conformity assessment bodies notified under
    Article 30.

    2.List of Codes, categories, and corresponding AI systems a.AI systems subject to Annex IAIA CodeAIP
    0102AI systems subject to point 2 of Section A of Annex IAIP 0103AI systems subject to point 3 of
    Section A of Annex IAIP 0104AI systems subject to point 4 of Section A of Annex IAIP 0105AI systems
    subject to point 5 of Section A of Annex IAIP 0106AI systems subject to point 6 of Section A of Annex
    IAIP 0107AI systems subject to point 7 of Section A of Annex IAIP 0108AI systems subject to point
    8 of Section A of Annex IAIP 0109AI systems subject to point 9 of Section A of Annex IAIP 0110AI systems
    subject to point 10 of Section A of Annex IAIP 0111AI systems subject to point 11 of Section A of
    Annex IAIP 0112AI systems subject to point 12 of Section A of Annex I b.AI systems subject to point
    1 of Annex IIIAIA CodeAIB 0201Remote biometric identification systemsAIB 0202Biometric categorisation
    AI systemsAIB 0203Emotion recognition AI systems

    3.AI technology-specific codes a.Symbolic AI and expert systemsAIA CodeAIH 0101AI systems based on
    symbolic AI, expert and knowledge-based systems, and AI systems based on search and optimisation b.Machine
    learning, excluding generative AI and general-purpose AI systemsAIA CodeAIH 0201AI systems that process
    structured dataAIH 0202AI systems that process signal and audio dataAIH 0203AI systems that process
    text dataAIH 0204AI systems that process image and videoAIH 0205AI systems that learn from their environment,
    excluding AI systems covered under AIH 0401 c.AI systems based on general-purpose AI models or generative
    AIAIA CodeAIH 0301generative AI systems, including AI systems based on general-purpose AI models d.Emerging
    AI technologiesAIA CodeAIH 0401AI systems based on other emerging AI technologies not covered by other
    codes, including Agentic AI

    4.Application for designation Conformity assessment bodies shall use the lists of codes, categories
    and corresponding types of AI systems set out in this Annex when specifying the types of AI systems
    in the application for designation referred to in Article 29.

    '
