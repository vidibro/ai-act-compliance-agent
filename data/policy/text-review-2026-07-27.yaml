- segment_id: AIA-TEXT-A054-FULL
  source:
    kind: article
    document: '54'
    act_version_date: '2026-07-27'
  start: 0
  end: 2813
  sha256: 09a63e1cd9f91ccee61aab24126d8a9fee8d10d5213a62b91cafc10f7038ecda
  text: "Article 54\nAuthorised representatives of providers of general-purpose AI models\n\n1. Prior\
    \ to placing a general-purpose AI model on the Union market, providers established in third countries\
    \ shall, by written mandate, appoint an authorised representative which is established in the Union.\n\
    2. The provider shall enable its authorised representative to perform the tasks specified in the mandate\
    \ received from the provider.\n3. The authorised representative shall perform the tasks specified\
    \ in the mandate received from the provider. It shall provide a copy of the mandate to the AI Office\
    \ upon request, in one of the official languages of the institutions of the Union. For the purposes\
    \ of this Regulation, the mandate shall empower the authorised representative to carry out the following\
    \ tasks:\n        (a) verify that the technical documentation specified in Annex XI has been drawn\
    \ up and all obligations referred to in Article 53 and, where applicable, Article 55 have been fulfilled\
    \ by the provider;\n        (b) keep a copy of the technical documentation specified in Annex XI at\
    \ the disposal of the AI Office and national competent authorities, for a period of 10 years after\
    \ the general-purpose AI model has been placed on the market, and the contact details of the provider\
    \ that appointed the authorised representative;\n        (c) provide the AI Office, upon a reasoned\
    \ request, with all the information and documentation, including that referred to in point (b), necessary\
    \ to demonstrate compliance with the obligations in this Chapter;\n        (d) cooperate with the\
    \ AI Office and competent authorities, upon a reasoned request, in any action they take in relation\
    \ to the general-purpose AI model, including when the model is integrated into AI systems placed on\
    \ the market or put into service in the Union.\n4. The mandate shall empower the authorised representative\
    \ to be addressed, in addition to or instead of the provider, by the AI Office or the competent authorities,\
    \ on all issues related to ensuring compliance with this Regulation.\n5. The authorised representative\
    \ shall terminate the mandate if it considers or has reason to consider the provider to be acting\
    \ contrary to its obligations pursuant to this Regulation. In such a case, it shall also immediately\
    \ inform the AI Office about the termination of the mandate and the reasons therefor.\n6. The obligation\
    \ set out in this Article shall not apply to providers of general-purpose AI models that are released\
    \ under a free and open-source licence that allows for the access, usage, modification, and distribution\
    \ of the model, and whose parameters, including the weights, the information on the model architecture,\
    \ and the information on model usage, are made publicly available, unless the general-purpose AI models\
    \ present systemic risks.\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
