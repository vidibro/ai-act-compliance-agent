  sha256: 93457fba83c966dad63a021e618228d0ac2db44871f138c275d98c3d1e7f9ae3
  text: "Article 40\nHarmonised standards and standardisation deliverables\n\n1. High-risk AI systems\
    \ or general-purpose AI models which are in conformity with harmonised standards or parts thereof\
    \ the references of which have been published in the Official Journal of the European Union in accordance\
    \ with Regulation (EU) No 1025/2012 shall be presumed to be in conformity with the requirements set\
    \ out in Section 2 of this Chapter or, as applicable, with the obligations set out in of Chapter V,\
    \ Sections 2 and 3, of this Regulation, to the extent that those standards cover those requirements\
    \ or obligations.\n2. In accordance with Article 10 of Regulation (EU) No 1025/2012, the Commission\
    \ shall issue, without undue delay, standardisation requests covering all requirements set out in\
    \ Section 2 of this Chapter and, as applicable, standardisation requests covering obligations set\
    \ out in Chapter V, Sections 2 and 3, of this Regulation. The standardisation request shall also ask\
    \ for deliverables on reporting and documentation processes to improve AI systems\u2019 resource performance,\
    \ such as reducing the high-risk AI system\u2019s consumption of energy and of other resources during\
    \ its lifecycle, and on the energy-efficient development of general-purpose AI models. When preparing\
    \ a standardisation request, the Commission shall consult the Board and relevant stakeholders, including\
    \ the advisory forum.\n    When issuing a standardisation request to European standardisation organisations,\
    \ the Commission shall specify that standards have to be clear, consistent, including with the standards\
    \ developed in the various sectors for products covered by the existing Union harmonisation legislation\
    \ listed in Annex I, and aiming to ensure that high-risk AI systems or general-purpose AI models placed\
    \ on the market or put into service in the Union meet the relevant requirements or obligations laid\
    \ down in this Regulation.\n    The Commission shall request the European standardisation organisations\
    \ to provide evidence of their best efforts to fulfil the objectives referred to in the first and\
    \ the second subparagraph of this paragraph in accordance with Article 24 of Regulation (EU) No 1025/2012.\n\
    \    The Commission shall request, in accordance with Regulation (EU) No 1025/2012 of the European\
    \ Parliament and of the Council Regulation (EU) No 1025/2012 of the European Parliament and of the\
    \ Council of 25 October 2012 on European standardisation, amending Council Directives 89/686/EEC and\
    \ 93/15/EEC and Directives 94/9/EC, 94/25/EC, 95/16/EC, 97/23/EC, 98/34/EC, 2004/22/EC, 2007/23/EC,\
    \ 2009/23/EC and 2009/105/EC of the European Parliament and of the Council and repealing Council Decision\
    \ 87/95/EEC and Decision No 1673/2006/EC of the European Parliament and of the Council (OJ L 316,\
    \ 14.11.2012, p. 12, ELI: http://data.europa.eu/eli/reg/2012/1025/oj). and without undue delay, the\
    \ European standardisation organisations to develop standardisation deliverables, including, as appropriate,\
    \ harmonised standards, to facilitate the joint compliance and presumption of conformity with the\
    \ requirements or obligations set out in Chapter III, Sections 2 and 3 of this Regulation, and the\
    \ relevant requirements and obligations laid down in the Union harmonisation legislation listed in\
    \ Annex I to this Regulation.\n3. The participants in the standardisation process shall seek to promote\
    \ investment and innovation in AI, including through increasing legal certainty, as well as the competitiveness\
    \ and growth of the Union market, to contribute to strengthening global cooperation on standardisation\
    \ and taking into account existing international standards in the field of AI that are consistent\
    \ with Union values, fundamental rights and interests, and to enhance multi-stakeholder governance\
    \ ensuring a balanced representation of interests and the effective participation of all relevant\
    \ stakeholders in accordance with Articles 5, 6, and 7 of Regulation (EU) No 1025/2012.\n"
