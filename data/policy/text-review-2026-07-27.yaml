  sha256: 64e28c3624b1fc0c556afe016c33df4934548c6e6323fa2bae40f22ae56dc2d6
  text: "Article 92\nPower to conduct evaluations\n\n1. The AI Office, after consulting the Board, may\
    \ conduct evaluations of the general-purpose AI model concerned:\n        (a) to assess compliance\
    \ of the provider with obligations under this Regulation, where the information gathered pursuant\
    \ to Article 91 is insufficient; or\n        (b) to investigate systemic risks at Union level of general-purpose\
    \ AI models with systemic risk, in particular following a qualified alert from the scientific panel\
    \ in accordance with Article 90(1), point (a).\n2. The Commission may decide to appoint independent\
    \ experts to carry out evaluations on its behalf, including from the scientific panel established\
    \ pursuant to Article 68. Independent experts appointed for this task shall meet the criteria outlined\
    \ in Article 68(2).\n3. For the purposes of paragraph 1, the Commission may request access to the\
    \ general-purpose AI model concerned through APIs or further appropriate technical means and tools,\
    \ including source code.\n4. The request for access shall state the legal basis, the purpose and reasons\
    \ of the request and set the period within which the access is to be provided, and the fines provided\
    \ for in Article 101 for failure to provide access.\n5. The providers of the general-purpose AI model\
    \ concerned or its representative shall supply the information requested. In the case of legal persons,\
    \ companies or firms, or where the provider has no legal personality, the persons authorised to represent\
    \ them by law or by their statutes, shall provide the access requested on behalf of the provider of\
    \ the general-purpose AI model concerned.\n6. The Commission shall adopt implementing acts setting\
    \ out the detailed arrangements and the conditions for the evaluations, including the detailed arrangements\
    \ for involving independent experts, and the procedure for the selection thereof. Those implementing\
    \ acts shall be adopted in accordance with the examination procedure referred to in Article 98(2).\n\
    7. Prior to requesting access to the general-purpose AI model concerned, the AI Office may initiate\
    \ a structured dialogue with the provider of the general-purpose AI model to gather more information\
    \ on the internal testing of the model, internal safeguards for preventing systemic risks, and other\
    \ internal procedures and measures the provider has taken to mitigate such risks.\n"
  disposition: needs_review
