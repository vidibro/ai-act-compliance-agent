- segment_id: AIA-TEXT-A019-FULL
  source:
    kind: article
    document: '19'
    act_version_date: '2026-07-27'
  start: 0
  end: 863
  sha256: f88773d22c467b74177a1e3d89e2e0e90da711af704b74d4f282047baf7264fd
  text: 'Article 19

    Automatically generated logs


    1. Providers of high-risk AI systems shall keep the logs referred to in Article 12(1), automatically
    generated by their high-risk AI systems, to the extent such logs are under their control. Without
    prejudice to applicable Union or national law, the logs shall be kept for a period appropriate to
    the intended purpose of the high-risk AI system, of at least six months, unless provided otherwise
    in the applicable Union or national law, in particular in Union law on the protection of personal
    data.

    2. Providers that are financial institutions subject to requirements regarding their internal governance,
    arrangements or processes under Union financial services law shall maintain the logs automatically
    generated by their high-risk AI systems as part of the documentation kept under the relevant financial
    services law.

    '
  disposition: needs_review
