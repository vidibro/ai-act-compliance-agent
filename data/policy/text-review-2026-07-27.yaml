- segment_id: AIA-TEXT-ANNEX-VIII-A
  source:
    kind: annex
    document: VIII
    act_version_date: '2026-07-27'
  start: 116
  end: 1947
  sha256: 6df88a0c90a0866f0d9b9b6f2776d0daff16520563b8439660f4886e69e077d3
  text: "Section A \u2014 Information to be submitted by providers of high-risk AI systems in accordance\
    \ with Article 49(1) The following information shall be provided and thereafter kept up to date with\
    \ regard to high-risk AI systems to be registered in accordance with Article 49(1):\n    1. The name,\
    \ address and contact details of the provider;\n    2. Where submission of information is carried\
    \ out by another person on behalf of the provider, the name, address and contact details of that person;\n\
    \    3. The name, address and contact details of the authorised representative, where applicable;\n\
    \    4. The AI system trade name and any additional unambiguous reference allowing the identification\
    \ and traceability of the AI system;\n    5. A description of the intended purpose of the AI system\
    \ and of the components and functions supported through this AI system;\n    6. A basic and concise\
    \ description of the information used by the system (data, inputs) and its operating logic;\n    7.\
    \ The status of the AI system (on the market, or in service; no longer placed on the market/in service,\
    \ recalled);\n    8. The type, number and expiry date of the certificate issued by the notified body\
    \ and the name or identification number of that notified body, where applicable;\n    9. A scanned\
    \ copy of the certificate referred to in point 8, where applicable;\n    10. Any Member States in\
    \ which the AI system has been placed on the market, put into service or made available in the Union;\n\
    \    11. A copy of the EU declaration of conformity referred to in Article 47;\n    12. Electronic\
    \ instructions for use; this information shall not be provided for high-risk AI systems in the areas\
    \ of law enforcement or migration, asylum and border control management referred to in Annex III,\
    \ points 1, 6 and 7;\n    13. A URL for additional information (optional).\n"
