- segment_id: AIA-TEXT-A093-FULL
  source:
    kind: article
    document: '93'
    act_version_date: '2026-07-27'
  start: 0
  end: 976
  sha256: 8f2c35c3dcf1a4f4db7b161aadc6a4841ec63dd37028f9cdfbb01fe117a5297c
  text: "Article 93\nPower to request measures\n\n1. Where necessary and appropriate, the Commission may\
    \ request providers to:\n        (a) take appropriate measures to comply with the obligations set\
    \ out in Articles 53 and 54;\n        (b) implement mitigation measures, where the evaluation carried\
    \ out in accordance with Article 92 has given rise to serious and substantiated concern of a systemic\
    \ risk at Union level;\n        (c) restrict the making available on the market, withdraw or recall\
    \ the model.\n2. Before a measure is requested, the AI Office may initiate a structured dialogue with\
    \ the provider of the general-purpose AI model.\n3. If, during the structured dialogue referred to\
    \ in paragraph 2, the provider of the general-purpose AI model with systemic risk offers commitments\
    \ to implement mitigation measures to address a systemic risk at Union level, the Commission may,\
    \ by decision, make those commitments binding and declare that there are no further grounds for action.\n"
