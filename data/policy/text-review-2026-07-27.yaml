  sha256: d5c7aae5ad4f7dcefad875f7052be9872b66ffa2a78407fbfafcae7a9bce4e69
  text: 'Article 69

    Access to the pool of experts by the Member States


    1. Member States may call upon experts of the scientific panel to support their enforcement activities
    under this Regulation.

    2. The Member States may be required to pay fees for the advice and support provided by the experts
    at a rate equivalent to the remuneration fees applicable to the Commission pursuant to the implementing
    act referred to in Article 68(1).

    3. The Commission shall facilitate timely access to the experts by the Member States, as needed, and
    ensure that the combination of support activities carried out by Union AI testing support pursuant
    to Article 84 and experts pursuant to this Article is efficiently organised and provides the best
    possible added value.

    '
