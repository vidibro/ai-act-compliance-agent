  sha256: 026ba872c3f465960db85b26edd2048c15a037d17f69950d05dd1353db10653e
  text: 'Article 97

    Exercise of the delegation


    1. The power to adopt delegated acts is conferred on the Commission subject to the conditions laid
    down in this Article.

    2. The power to adopt delegated acts referred to in Article 6(6) and (7), Article 7(1) and (3), Article
    11(3), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4) and Article 53(5) and (6)
    shall be conferred on the Commission for a period of five years from 1 August 2024. The power to adopt
    delegated acts referred to in Article 2(13) and Article 30(2) shall be conferred on the Commission
    for a period of five years from 27 July 2026. The Commission shall draw up a report in respect of
    the delegation of power not later than nine months before the end of the five-year period. The delegation
    of power shall be tacitly extended for periods of an identical duration, unless the European Parliament
    or the Council opposes such extension no later than three months before the end of each period.

    3. The delegation of power referred to in Article 2(13), Article 6(6) and (7), Article 7(1) and (3),
    Article 11(3), Article 30(2), Article 43(5) and (6), Article 47(5), Article 51(3), Article 52(4) and
    Article 53(5) and (6) may be revoked at any time by the European Parliament or by the Council. A decision
    of revocation shall put an end to the delegation of power specified in that decision. It shall take
    effect the day following that of its publication in the Official Journal of the European Union or
    at a later date specified therein. It shall not affect the validity of any delegated acts already
    in force.

    4. Before adopting a delegated act, the Commission shall consult experts designated by each Member
    State in accordance with the principles laid down in the Interinstitutional Agreement of 13 April
    2016 on Better Law-Making.

    5. As soon as it adopts a delegated act, the Commission shall notify it simultaneously to the European
    Parliament and to the Council.

    6. Any delegated act adopted pursuant to Article 2(13), Article 6(6) or (7), Article 7(1) or (3),
    Article 11(3), Article 30(2), Article 43(5) or (6), Article 47(5), Article 51(3), Article 52(4) or
    Article 53(5) or (6) shall enter into force only if no objection has been expressed by either the
    European Parliament or the Council within a period of three months of notification of that act to
    the European Parliament and the Council or if, before the expiry of that period, the European Parliament
    and the Council have both informed the Commission that they will not object. That period shall be
    extended by three months at the initiative of the European Parliament or of the Council.

    '
