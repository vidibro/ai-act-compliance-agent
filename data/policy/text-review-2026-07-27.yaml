- segment_id: AIA-TEXT-A012-FULL
  source:
    kind: article
    document: '12'
    act_version_date: '2026-07-27'
  start: 0
  end: 1249
  sha256: c1213c7819972d23ba939f5464a403f4ec3c52120666e994b537e342ab16f6da
  text: "Article 12\nRecord-keeping\n\n1. High-risk AI systems shall technically allow for the automatic\
    \ recording of events (logs) over the lifetime of the system.\n2. In order to ensure a level of traceability\
    \ of the functioning of a high-risk AI system that is appropriate to the intended purpose of the system,\
    \ logging capabilities shall enable the recording of events relevant for:\n        (a) identifying\
    \ situations that may result in the high-risk AI system presenting a risk within the meaning of Article\
    \ 79(1) or in a substantial modification;\n        (b) facilitating the post-market monitoring referred\
    \ to in Article 72; and\n        (c) monitoring the operation of high-risk AI systems referred to\
    \ in Article 26(5).\n3. For high-risk AI systems referred to in point 1 (a), of Annex III, the logging\
    \ capabilities shall provide, at a minimum:\n        (a) recording of the period of each use of the\
    \ system (start date and time and end date and time of each use);\n        (b) the reference database\
    \ against which input data has been checked by the system;\n        (c) the input data for which the\
    \ search has led to a match;\n        (d) the identification of the natural persons involved in the\
    \ verification of the results, as referred to in Article 14(5).\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
