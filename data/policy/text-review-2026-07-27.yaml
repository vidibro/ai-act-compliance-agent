- segment_id: AIA-TEXT-A048-FULL
  source:
    kind: article
    document: '48'
    act_version_date: '2026-07-27'
  start: 0
  end: 1408
  sha256: d98237658f2919b24fd8ce2626df4f8f9923b15d496032c071e8eddb439c5efb
  text: "Article 48\nCE marking\n\n1. The CE marking shall be subject to the general principles set out\
    \ in Article 30 of Regulation (EC) No 765/2008.\n2. For high-risk AI systems provided digitally, a\
    \ digital CE marking shall be used, only if it can easily be accessed via the interface from which\
    \ that system is accessed or via an easily accessible machine-readable code or other electronic means.\n\
    3. The CE marking shall be affixed visibly, legibly and indelibly for high-risk AI systems. Where\
    \ that is not possible or not warranted on account of the nature of the high-risk AI system, it shall\
    \ be affixed to the packaging or to the accompanying documentation, as appropriate.\n4. Where applicable,\
    \ the CE marking shall be followed by the identification number of the notified body responsible for\
    \ the conformity assessment procedures set out in Article 43. The identification number of the notified\
    \ body shall be affixed by the body itself or, under its instructions, by the provider or by the provider\u2019\
    s authorised representative. The identification number shall also be indicated in any promotional\
    \ material which mentions that the high-risk AI system fulfils the requirements for CE marking.\n\
    5. Where high-risk AI systems are subject to other Union law which also provides for the affixing\
    \ of the CE marking, the CE marking shall indicate that the high-risk AI system also fulfil the requirements\
    \ of that other law.\n"
