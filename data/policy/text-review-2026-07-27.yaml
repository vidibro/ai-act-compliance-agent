  sha256: 7c2ca1b729a2cd1f982c905a02e1ce8799d863124a56846b6ed79ffe3a1356e7
  text: '4. Without prejudice to paragraphs 1 and 2, to the extent the deployer exercises control over
    the input data, that deployer shall ensure that input data is relevant and sufficiently representative
    in view of the intended purpose of the high-risk AI system.

    '
  disposition: needs_review
