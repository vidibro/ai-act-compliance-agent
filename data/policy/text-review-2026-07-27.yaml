- segment_id: AIA-TEXT-A029-FULL
  source:
    kind: article
    document: '29'
    act_version_date: '2026-07-27'
  start: 0
  end: 2037
  sha256: 4faabc50007b7297217d7136abcfdf75da3b112e84457b514406c797446ee1ce
  text: "Article 29\nApplication of a conformity assessment body for notification\n\n1. Conformity assessment\
    \ bodies shall submit an application for notification to the notifying authority of the Member State\
    \ in which they are established.\n2. The application for notification shall be accompanied by a description\
    \ of the conformity assessment activities, the conformity assessment module or modules and the types\
    \ of AI systems for which the conformity assessment body claims to be competent, as well as by an\
    \ accreditation certificate, where one exists, issued by a national accreditation body attesting that\
    \ the conformity assessment body fulfils the requirements laid down in Article 31.\n    Any valid\
    \ document related to existing designations of the applicant notified body under any other Union harmonisation\
    \ legislation shall be added.\n3. Where the conformity assessment body concerned cannot provide an\
    \ accreditation certificate, it shall provide the notifying authority with all the documentary evidence\
    \ necessary for the verification, recognition and regular monitoring of its compliance with the requirements\
    \ laid down in Article 31.\n4. For notified bodies which are designated pursuant to any other Union\
    \ harmonisation legislation, all documents and certificates linked to those designations may be used\
    \ to support and expedite their designation procedure under this Regulation, as appropriate.\n   \
    \ Notified bodies, which are designated pursuant to any of the Union harmonisation legislation listed\
    \ in Section A of Annex I and which undergo the unified assessment procedure referred to in Article\
    \ 28(8), shall submit the single application for assessment to the notifying authority designated\
    \ pursuant to that Union harmonisation legislation.\n    The notified body shall update the documentation\
    \ referred to in paragraphs 2 and 3 of this Article whenever relevant changes occur, in order to enable\
    \ the authority responsible for notified bodies to monitor and verify continuous compliance with all\
    \ the requirements laid down in Article 31.\n"
  disposition: needs_review
