- segment_id: AIA-TEXT-A030-FULL
  source:
    kind: article
    document: '30'
    act_version_date: '2026-07-27'
  start: 0
  end: 2465
  sha256: ea186aeb5a00b16bd24b6595df89a67a3cd5c42bd2d6f836fcf268fbed0d5c58
  text: "Article 30\nNotification procedure\n\n1. Notifying authorities may notify only conformity assessment\
    \ bodies which have satisfied the requirements laid down in Article 31.\n2. Notifying authorities\
    \ shall notify the Commission and the other Member States, based on the list of codes, categories,\
    \ and corresponding types of AI systems referred to in Annex XIV, and using the electronic notification\
    \ tool developed and managed by the Commission, of each conformity assessment body referred to in\
    \ paragraph 1.\n    The Commission is empowered to adopt delegated acts in accordance with Article\
    \ 97 in order to amend Annex XIV, in light of technical progress, advances in knowledge or new scientific\
    \ evidence by adding to the list of codes, categories, and corresponding types of AI systems a new\
    \ code, a category or a type of AI system, withdrawing an existing code, category or a type of AI\
    \ system from that list or moving a code or type of AI system from one category to another.\n3. The\
    \ notification referred to in paragraph 2 of this Article shall include full details of the conformity\
    \ assessment activities, the conformity assessment module or modules, the types of AI systems concerned,\
    \ and the relevant attestation of competence. Where a notification is not based on an accreditation\
    \ certificate as referred to in Article 29(2), the notifying authority shall provide the Commission\
    \ and the other Member States with documentary evidence which attests to the competence of the conformity\
    \ assessment body and to the arrangements in place to ensure that that body will be monitored regularly\
    \ and will continue to satisfy the requirements laid down in Article 31.\n4. The conformity assessment\
    \ body concerned may perform the activities of a notified body only where no objections are raised\
    \ by the Commission or the other Member States within two weeks of a notification by a notifying authority\
    \ where it includes an accreditation certificate referred to in Article 29(2), or within two months\
    \ of a notification by the notifying authority where it includes documentary evidence referred to\
    \ in Article 29(3).\n5. Where objections are raised, the Commission shall, without delay, enter into\
    \ consultations with the relevant Member States and the conformity assessment body. In view thereof,\
    \ the Commission shall decide whether the authorisation is justified. The Commission shall address\
    \ its decision to the Member State concerned and to the relevant conformity assessment body.\n"
  disposition: needs_review
