  sha256: 9e182f09f042765c8cc61808b255330b53feaf37ea9437365d316e336d25ba2a
  text: "Article 4a\nProcessing of special categories of personal data for bias detection and correction\n\
    \n1. To the extent strictly necessary to ensure bias detection and correction in relation to high-risk\
    \ AI systems in accordance with Article 10(2), points (f) and (g), of this Regulation, providers of\
    \ such systems may exceptionally process special categories of personal data, subject to appropriate\
    \ safeguards for the fundamental rights and freedoms of natural persons. In addition to the provisions\
    \ set out in Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680, as applicable,\
    \ all the following conditions shall be met in order for such processing to occur:\n        (a) the\
    \ bias detection and correction cannot be effectively fulfilled by processing other data, including\
    \ synthetic or anonymised data;\n        (b) the special categories of personal data are subject to\
    \ technical limitations on the re-use of personal data, and state-of-the-art security and privacy-preserving\
    \ measures, including pseudonymisation;\n        (c) the special categories of personal data are subject\
    \ to measures to ensure that the personal data processed are secured and protected, subject to suitable\
    \ safeguards, including strict controls and documentation of the access, to avoid misuse and to ensure\
    \ that only authorised persons have access to those personal data with appropriate confidentiality\
    \ obligations;\n        (d) the special categories of personal data are not transmitted, transferred\
    \ or otherwise accessed by other parties;\n        (e) the special categories of personal data are\
    \ deleted once the bias has been corrected or the personal data has reached the end of its retention\
    \ period, whichever comes first; and\n        (f) the records of processing activities pursuant to\
    \ Regulations (EU) 2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680 include the reasons why\
    \ the processing of special categories of personal data was strictly necessary to detect and correct\
    \ biases, and why that objective could not be achieved by processing other data.\n2. Providers and\
    \ deployers of other AI systems and models and deployers of high-risk AI systems may exceptionally\
    \ process special categories of personal data to the extent that:\n        (a) such processing is\
    \ strictly necessary to ensure bias detection and correction in view of possible biases that are likely\
    \ to affect the health and safety of persons, have a negative impact on fundamental rights or lead\
    \ to discrimination prohibited pursuant to Union law, especially where data outputs influence inputs\
    \ for future operations; and\n        (b) all of the conditions and safeguards set out in paragraph\
    \ 1 are applied.\n    This paragraph does not create any obligation to conduct such bias detection\
    \ and correction.\n"
