  sha256: ecb35c0c23e3309a97347b0b1047ab504f7c905f359d7c9ece3df421e6994ffb
  text: 'Article 85

    Right to lodge a complaint with a market surveillance authority


    Without prejudice to other administrative or judicial remedies, any natural or legal person having
    grounds to consider that there has been an infringement of the provisions of this Regulation may submit
    complaints to the relevant market surveillance authority.

    In accordance with Regulation (EU) 2019/1020, such complaints shall be taken into account for the
    purpose of conducting market surveillance activities, and shall be handled in line with the dedicated
    procedures established therefor by the market surveillance authorities.

    '
