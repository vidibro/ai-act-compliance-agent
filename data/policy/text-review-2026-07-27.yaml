- segment_id: AIA-TEXT-ANNEX-XIII-FULL
  source:
    kind: annex
    document: XIII
    act_version_date: '2026-07-27'
  start: 0
  end: 1533
  sha256: a2c0738fb496bfcdafebb106eef38a3e6285a3093dca64dc25c2accb5b6dc3a9
  text: "ANNEX XIII\nCriteria for the designation of general-purpose AI models with systemic risk referred\
    \ to in Article 51\n\nFor the purpose of determining that a general-purpose AI model has capabilities\
    \ or an impact equivalent to those set out in Article 51(1), point (a), the Commission shall take\
    \ into account the following criteria:\n    (a) the number of parameters of the model;\n    (b) the\
    \ quality or size of the data set, for example measured through tokens;\n    (c) the amount of computation\
    \ used for training the model, measured in floating point operations or indicated by a combination\
    \ of other variables such as estimated cost of training, estimated time required for the training,\
    \ or estimated energy consumption for the training;\n    (d) the input and output modalities of the\
    \ model, such as text to text (large language models), text to image, multi-modality, and the state\
    \ of the art thresholds for determining high-impact capabilities for each modality, and the specific\
    \ type of inputs and outputs (e.g. biological sequences);\n    (e) the benchmarks and evaluations\
    \ of capabilities of the model, including considering the number of tasks without additional training,\
    \ adaptability to learn new, distinct tasks, its level of autonomy and scalability, the tools it has\
    \ access to;\n    (f) whether it has a high impact on the internal market due to its reach, which\
    \ shall be presumed when it has been made available to at least 10000 registered business users established\
    \ in the Union;\n    (g) the number of registered end-users.\n"
