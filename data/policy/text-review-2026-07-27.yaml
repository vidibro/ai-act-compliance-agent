  end: 1006
  sha256: 921bbe53cb4e6f5c6fa28b2e9938c36e2309b1ae9241ae280960b53da2acdafd
  text: "Article 89\nMonitoring actions\n\n1. For the purpose of carrying out the tasks assigned to it\
    \ under this Section, the AI Office may take the necessary actions to monitor the effective implementation\
    \ and compliance with this Regulation by providers of general-purpose AI models, including their adherence\
    \ to approved codes of practice.\n2. Downstream providers shall have the right to lodge a complaint\
    \ alleging an infringement of this Regulation. A complaint shall be duly reasoned and indicate at\
    \ least:\n        (a) the point of contact of the provider of the general-purpose AI model concerned;\n\
    \        (b) a description of the relevant facts, the provisions of this Regulation concerned, and\
    \ the reason why the downstream provider considers that the provider of the general-purpose AI model\
    \ concerned infringed this Regulation;\n        (c) any other information that the downstream provider\
    \ that sent the request considers relevant, including, where appropriate, information gathered on\
    \ its own initiative.\n"
  disposition: needs_review
