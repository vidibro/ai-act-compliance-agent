  sha256: f99c48ea044db72eec2adfb34d3ed243ec1caccd19bf8750ea26b54801ae1a71
  text: "Article 96\nGuidelines from the Commission on the implementation of this Regulation\n\n1. The\
    \ Commission shall develop guidelines on the practical implementation of this Regulation, and in particular\
    \ on:\n        (a) the application of the requirements and obligations referred to in Articles 8 to\
    \ 15 and in Articles 25 and 26;\n        (b) the prohibited practices referred to in Article 5;\n\
    \        (c) the practical implementation of the provisions related to substantial modification;\n\
    \        (d) the practical implementation of transparency obligations laid down in Article 50;\n \
    \       (e) detailed information on the relationship of this Regulation with the Union harmonisation\
    \ legislation listed in Annex I, as well as with other relevant Union law, including as regards consistency\
    \ in their enforcement;\n        (f) the application of the definition of an AI system as set out\
    \ in Article 3, point (1);\n        (g) the practical implementation of Article 8(2), Article 9(10)\
    \ and Article 17(3) in accordance with the principle of complementarity and proportionality, with\
    \ a view to ensuring consistency, avoiding duplication and minimising additional burdens when complying\
    \ with the requirements of this Regulation and the requirements of the Union harmonisation legislation\
    \ listed in Section A of Annex I; such guidelines shall be published by 1 August 2027.\n    When issuing\
    \ such guidelines, the Commission shall involve the Board and pay particular attention to the needs\
    \ of SMEs, including start-ups, and SMCs, of local public authorities and of the sectors most likely\
    \ to be affected by this Regulation.\n    The guidelines referred to in the first subparagraph of\
    \ this paragraph shall take due account of the generally acknowledged state of the art on AI, as well\
    \ as of relevant harmonised standards and common specifications that are referred to in Articles 40\
    \ and 41, or of those harmonised standards or technical specifications that are set out pursuant to\
    \ Union harmonisation law.\n2. At the request of the Member States or the AI Office, or on its own\
    \ initiative, the Commission shall update guidelines previously adopted when deemed necessary.\n"
  disposition: needs_review
