    elapsed_seconds: null
- segment_id: AIA-TEXT-A050-P5
  source:
    kind: article
    document: '50'
    act_version_date: '2026-07-27'
  start: 3542
  end: 3823
  sha256: f602f41c5d3154ef2a063337d6fb3e0d89e2bc64f326c9b42fdb6459dd5d9492
  text: '5. The information referred to in paragraphs 1 to 4 shall be provided to the natural persons
    concerned in a clear and distinguishable manner at the latest at the time of the first interaction
    or exposure. The information shall conform to the applicable accessibility requirements.

    '
  disposition: normative
