- segment_id: AIA-TEXT-A100-FULL
  source:
    kind: article
    document: '100'
    act_version_date: '2026-07-27'
  start: 0
  end: 3545
  sha256: 270d3387f718c85b57cdcd217243506bae547482706a278a0a35b5e18bfbf1cc
  text: "Article 100\nAdministrative fines on Union institutions, bodies, offices and agencies\n\n1. The\
    \ European Data Protection Supervisor may impose administrative fines on Union institutions, bodies,\
    \ offices and agencies falling within the scope of this Regulation. When deciding whether to impose\
    \ an administrative fine and when deciding on the amount of the administrative fine in each individual\
    \ case, all relevant circumstances of the specific situation shall be taken into account and due regard\
    \ shall be given to the following:\n        (a) the nature, gravity and duration of the infringement\
    \ and of its consequences, taking into account the purpose of the AI system concerned, as well as,\
    \ where appropriate, the number of affected persons and the level of damage suffered by them;\n  \
    \      (b) the degree of responsibility of the Union institution, body, office or agency, taking into\
    \ account technical and organisational measures implemented by them;\n        (c) any action taken\
    \ by the Union institution, body, office or agency to mitigate the damage suffered by affected persons;\n\
    \        (d) the degree of cooperation with the European Data Protection Supervisor in order to remedy\
    \ the infringement and mitigate the possible adverse effects of the infringement, including compliance\
    \ with any of the measures previously ordered by the European Data Protection Supervisor against the\
    \ Union institution, body, office or agency concerned with regard to the same subject matter;\n  \
    \      (e) any similar previous infringements by the Union institution, body, office or agency;\n\
    \        (f) the manner in which the infringement became known to the European Data Protection Supervisor,\
    \ in particular whether, and if so to what extent, the Union institution, body, office or agency notified\
    \ the infringement;\n        (g) the annual budget of the Union institution, body, office or agency.\n\
    2. Non-compliance with the prohibition of the AI practices referred to in Article 5 shall be subject\
    \ to administrative fines of up to EUR 1500000.\n3. The non-compliance of the AI system with any requirements\
    \ or obligations under this Regulation, other than those laid down in Article 5, shall be subject\
    \ to administrative fines of up to EUR 750000.\n4. Before taking decisions pursuant to this Article,\
    \ the European Data Protection Supervisor shall give the Union institution, body, office or agency\
    \ which is the subject of the proceedings conducted by the European Data Protection Supervisor the\
    \ opportunity of being heard on the matter regarding the possible infringement. The European Data\
    \ Protection Supervisor shall base his or her decisions only on elements and circumstances on which\
    \ the parties concerned have been able to comment. Complainants, if any, shall be associated closely\
    \ with the proceedings.\n5. The rights of defence of the parties concerned shall be fully respected\
    \ in the proceedings. They shall be entitled to have access to the European Data Protection Supervisor\u2019\
    s file, subject to the legitimate interest of individuals or undertakings in the protection of their\
    \ personal data or business secrets.\n6. Funds collected by imposition of fines in this Article shall\
    \ contribute to the general budget of the Union. The fines shall not affect the effective operation\
    \ of the Union institution, body, office or agency fined.\n7. The European Data Protection Supervisor\
    \ shall, on an annual basis, notify the Commission of the administrative fines it has imposed pursuant\
    \ to this Article and of any litigation or judicial proceedings it has initiated.\n"
