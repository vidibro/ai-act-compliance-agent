- segment_id: AIA-TEXT-A005-FULL
  source:
    kind: article
    document: '5'
    act_version_date: '2026-07-27'
  start: 0
  end: 13507
  sha256: 972bb93759ebc67303ffdf5f3fe3315509b9acf332952e40c220d9ccd78c715b
  text: "Article 5\nProhibited AI practices\n\n1. The following AI practices shall be prohibited:\n  \
    \      (a) the placing on the market, the putting into service or the use of an AI system that deploys\
    \ subliminal techniques beyond a person\u2019s consciousness or purposefully manipulative or deceptive\
    \ techniques, with the objective, or the effect of materially distorting the behaviour of a person\
    \ or a group of persons by appreciably impairing their ability to make an informed decision, thereby\
    \ causing them to take a decision that they would not have otherwise taken in a manner that causes\
    \ or is reasonably likely to cause that person, another person or group of persons significant harm;\n\
    \        (b) the placing on the market, the putting into service or the use of an AI system that exploits\
    \ any of the vulnerabilities of a natural person or a specific group of persons due to their age,\
    \ disability or a specific social or economic situation, with the objective, or the effect, of materially\
    \ distorting the behaviour of that person or a person belonging to that group in a manner that causes\
    \ or is reasonably likely to cause that person or another person significant harm;\n        (ba) the\
    \ placing on the market, the putting into service or the use of an AI system that generates or manipulates\
    \ realistic images, videos, audio or similar material of an identifiable natural person\u2019s intimate\
    \ parts, or of an identifiable natural person engaged in sexually explicit activities, without that\
    \ person\u2019s freely-given, specific, informed, unambiguous and explicit consent for that generation\
    \ or manipulation;\n        (bb) the placing on the market, the putting into service or the use of\
    \ an AI system that generates or manipulates material or performance within the meaning of Article\
    \ 2, points (c) and (e), of Directive 2011/93/EU, except where a \u2018without right\u2019 defence\
    \ applies under national law;\n        (c) the placing on the market, the putting into service or\
    \ the use of AI systems for the evaluation or classification of natural persons or groups of persons\
    \ over a certain period of time based on their social behaviour or known, inferred or predicted personal\
    \ or personality characteristics, with the social score leading to either or both of the following:\n\
    \                (i) detrimental or unfavourable treatment of certain natural persons or groups of\
    \ persons in social contexts that are unrelated to the contexts in which the data was originally generated\
    \ or collected;\n                (ii) detrimental or unfavourable treatment of certain natural persons\
    \ or groups of persons that is unjustified or disproportionate to their social behaviour or its gravity;\n\
    \        (d) the placing on the market, the putting into service for this specific purpose, or the\
    \ use of an AI system for making risk assessments of natural persons in order to assess or predict\
    \ the risk of a natural person committing a criminal offence, based solely on the profiling of a natural\
    \ person or on assessing their personality traits and characteristics; this prohibition shall not\
    \ apply to AI systems used to support the human assessment of the involvement of a person in a criminal\
    \ activity, which is already based on objective and verifiable facts directly linked to a criminal\
    \ activity;\n        (e) the placing on the market, the putting into service for this specific purpose,\
    \ or the use of AI systems that create or expand facial recognition databases through the untargeted\
    \ scraping of facial images from the internet or CCTV footage;\n        (f) the placing on the market,\
    \ the putting into service for this specific purpose, or the use of AI systems to infer emotions of\
    \ a natural person in the areas of workplace and education institutions, except where the use of the\
    \ AI system is intended to be put in place or into the market for medical or safety reasons;\n   \
    \     (g) the placing on the market, the putting into service for this specific purpose, or the use\
    \ of biometric categorisation systems that categorise individually natural persons based on their\
    \ biometric data to deduce or infer their race, political opinions, trade union membership, religious\
    \ or philosophical beliefs, sex life or sexual orientation; this prohibition does not cover any labelling\
    \ or filtering of lawfully acquired biometric datasets, such as images, based on biometric data or\
    \ categorizing of biometric data in the area of law enforcement;\n        (h) the use of \u2018real-time\u2019\
    \ remote biometric identification systems in publicly accessible spaces for the purposes of law enforcement,\
    \ unless and in so far as such use is strictly necessary for one of the following objectives:\n  \
    \              (i) the targeted search for specific victims of abduction, trafficking in human beings\
    \ or sexual exploitation of human beings, as well as the search for missing persons;\n           \
    \     (ii) the prevention of a specific, substantial and imminent threat to the life or physical safety\
    \ of natural persons or a genuine and present or genuine and foreseeable threat of a terrorist attack;\n\
    \                (iii) the localisation or identification of a person suspected of having committed\
    \ a criminal offence, for the purpose of conducting a criminal investigation or prosecution or executing\
    \ a criminal penalty for offences referred to in Annex II and punishable in the Member State concerned\
    \ by a custodial sentence or a detention order for a maximum period of at least four years.\n    Point\
    \ (h) of the first subparagraph is without prejudice to Article 9 of Regulation (EU) 2016/679 for\
    \ the processing of biometric data for purposes other than law enforcement.\n1a. For the purposes\
    \ of paragraph 1, first subparagraph, points (ba) and (bb):\n        (a) the placing on the market\
    \ or putting into service of an AI system that generates or manipulates the material or performance\
    \ referred to in paragraph 1, first subparagraph, point (ba) or (bb) is only prohibited where:\n \
    \               (i) that generation or manipulation is the intended purpose of the AI system; or\n\
    \                (ii) the system\u2019s design, training, architecture, capabilities or user-facing\
    \ functionalities make that generation or manipulation a reasonably foreseeable and reproducible outcome,\
    \ without requiring significant technical modification, and the system does not have reasonable and\
    \ adequate technical safety measures and other safeguards to reliably prevent that generation or manipulation,\
    \ taking into account reasonably foreseeable misuse, and to correct observed or reported misuse;\n\
    \        (b) the use of an AI system that generates or manipulates the material or performance referred\
    \ to in paragraph 1, first subparagraph, points (ba) and (bb) is only prohibited where the deployer\
    \ uses the system for the purpose of generating or manipulating such material or performance.\n1b.\
    \ For the purposes of paragraph 1, first subparagraph, point (ba), an AI system that manipulates material\
    \ in a way that does not increase the exposure of any depicted intimate parts or alter the nature\
    \ of any depicted sexually explicit activities shall not constitute manipulation.\n2. The use of \u2018\
    real-time\u2019 remote biometric identification systems in publicly accessible spaces for the purposes\
    \ of law enforcement for any of the objectives referred to in paragraph 1, first subparagraph, point\
    \ (h), shall be deployed for the purposes set out in that point only to confirm the identity of the\
    \ specifically targeted individual, and it shall take into account the following elements:\n     \
    \   (a) the nature of the situation giving rise to the possible use, in particular the seriousness,\
    \ probability and scale of the harm that would be caused if the system were not used;\n        (b)\
    \ the consequences of the use of the system for the rights and freedoms of all persons concerned,\
    \ in particular the seriousness, probability and scale of those consequences.\n    In addition, the\
    \ use of \u2018 real-time \u2019 remote biometric identification systems in publicly accessible spaces\
    \ for the purposes of law enforcement for any of the objectives referred to in paragraph 1, first\
    \ subparagraph, point (h), of this Article shall comply with necessary and proportionate safeguards\
    \ and conditions in relation to the use in accordance with the national law authorising the use thereof,\
    \ in particular as regards the temporal, geographic and personal limitations. The use of the \u2018\
    \ real-time \u2019 remote biometric identification system in publicly accessible spaces shall be authorised\
    \ only if the law enforcement authority has completed a fundamental rights impact assessment as provided\
    \ for in Article 27 and has registered the system in the EU database according to Article 49. However,\
    \ in duly justified cases of urgency, the use of such systems may be commenced without the registration\
    \ in the EU database, provided that such registration is completed without undue delay.\n3. For the\
    \ purposes of paragraph 1, first subparagraph, point (h) and paragraph 2, each use for the purposes\
    \ of law enforcement of a \u2018 real-time \u2019 remote biometric identification system in publicly\
    \ accessible spaces shall be subject to a prior authorisation granted by a judicial authority or an\
    \ independent administrative authority whose decision is binding of the Member State in which the\
    \ use is to take place, issued upon a reasoned request and in accordance with the detailed rules of\
    \ national law referred to in paragraph 5. However, in a duly justified situation of urgency, the\
    \ use of such system may be commenced without an authorisation provided that such authorisation is\
    \ requested without undue delay, at the latest within 24 hours. If such authorisation is rejected,\
    \ the use shall be stopped with immediate effect and all the data, as well as the results and outputs\
    \ of that use shall be immediately discarded and deleted.\n    The competent judicial authority or\
    \ an independent administrative authority whose decision is binding shall grant the authorisation\
    \ only where it is satisfied, on the basis of objective evidence or clear indications presented to\
    \ it, that the use of the \u2018 real-time \u2019 remote biometric identification system concerned\
    \ is necessary for, and proportionate to, achieving one of the objectives specified in paragraph 1,\
    \ first subparagraph, point (h), as identified in the request and, in particular, remains limited\
    \ to what is strictly necessary concerning the period of time as well as the geographic and personal\
    \ scope. In deciding on the request, that authority shall take into account the elements referred\
    \ to in paragraph 2. No decision that produces an adverse legal effect on a person may be taken based\
    \ solely on the output of the \u2018 real-time \u2019 remote biometric identification system.\n4.\
    \ Without prejudice to paragraph 3, each use of a \u2018 real-time \u2019 remote biometric identification\
    \ system in publicly accessible spaces for law enforcement purposes shall be notified to the relevant\
    \ market surveillance authority and the national data protection authority in accordance with the\
    \ national rules referred to in paragraph 5. The notification shall, as a minimum, contain the information\
    \ specified under paragraph 6 and shall not include sensitive operational data.\n5. A Member State\
    \ may decide to provide for the possibility to fully or partially authorise the use of \u2018 real-time\
    \ \u2019 remote biometric identification systems in publicly accessible spaces for the purposes of\
    \ law enforcement within the limits and under the conditions listed in paragraph 1, first subparagraph,\
    \ point (h), and paragraphs 2 and 3. Member States concerned shall lay down in their national law\
    \ the necessary detailed rules for the request, issuance and exercise of, as well as supervision and\
    \ reporting relating to, the authorisations referred to in paragraph 3. Those rules shall also specify\
    \ in respect of which of the objectives listed in paragraph 1, first subparagraph, point (h), including\
    \ which of the criminal offences referred to in point (h)(iii) thereof, the competent authorities\
    \ may be authorised to use those systems for the purposes of law enforcement. Member States shall\
    \ notify those rules to the Commission at the latest 30 days following the adoption thereof. Member\
    \ States may introduce, in accordance with Union law, more restrictive laws on the use of remote biometric\
    \ identification systems.\n6. National market surveillance authorities and the national data protection\
    \ authorities of Member States that have been notified of the use of \u2018 real-time \u2019 remote\
    \ biometric identification systems in publicly accessible spaces for law enforcement purposes pursuant\
    \ to paragraph 4 shall submit to the Commission annual reports on such use. For that purpose, the\
    \ Commission shall provide Member States and national market surveillance and data protection authorities\
    \ with a template, including information on the number of the decisions taken by competent judicial\
    \ authorities or an independent administrative authority whose decision is binding upon requests for\
    \ authorisations in accordance with paragraph 3 and their result.\n7. The Commission shall publish\
    \ annual reports on the use of real-time remote biometric identification systems in publicly accessible\
    \ spaces for law enforcement purposes, based on aggregated data in Member States on the basis of the\
    \ annual reports referred to in paragraph 6. Those annual reports shall not include sensitive operational\
    \ data of the related law enforcement activities.\n8. This Article shall not affect the prohibitions\
    \ that apply where an AI practice infringes other Union law.\n"
