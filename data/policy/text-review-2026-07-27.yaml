- segment_id: AIA-TEXT-A016-FULL
  source:
    kind: article
    document: '16'
    act_version_date: '2026-07-27'
  start: 0
  end: 1701
  sha256: ab77e663dd583b9b831742c4de1dfd674ec11d58e2ffa8ff91d4561c743789c4
  text: "Article 16\nObligations of providers of high-risk AI systems\n\nProviders of high-risk AI systems\
    \ shall:\n    (a) ensure that their high-risk AI systems are compliant with the requirements set out\
    \ in Section 2;\n    (b) indicate on the high-risk AI system or, where that is not possible, on its\
    \ packaging or its accompanying documentation, as applicable, their name, registered trade name or\
    \ registered trade mark, the address at which they can be contacted;\n    (c) have a quality management\
    \ system in place which complies with Article 17;\n    (d) keep the documentation referred to in Article\
    \ 18;\n    (e) when under their control, keep the logs automatically generated by their high-risk\
    \ AI systems as referred to in Article 19;\n    (f) ensure that the high-risk AI system undergoes\
    \ the relevant conformity assessment procedure as referred to in Article 43, prior to its being placed\
    \ on the market or put into service;\n    (g) draw up an EU declaration of conformity in accordance\
    \ with Article 47;\n    (h) affix the CE marking to the high-risk AI system or, where that is not\
    \ possible, on its packaging or its accompanying documentation, to indicate conformity with this Regulation,\
    \ in accordance with Article 48;\n    (i) comply with the registration obligations referred to in\
    \ Article 49(1);\n    (j) take the necessary corrective actions and provide information as required\
    \ in Article 20;\n    (k) upon a reasoned request of a national competent authority, demonstrate the\
    \ conformity of the high-risk AI system with the requirements set out in Section 2;\n    (l) ensure\
    \ that the high-risk AI system complies with accessibility requirements in accordance with Directives\
    \ (EU) 2016/2102 and (EU) 2019/882.\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
