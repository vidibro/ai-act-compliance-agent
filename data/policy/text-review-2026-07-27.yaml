  sha256: 49df74db2b2f892ef172e6ed72a7f4bc76c7cfd9c35c7d549c909f7f21436245
  text: "Article 61\nInformed consent to participate in testing in real world conditions outside AI regulatory\
    \ sandboxes\n\n1. For the purpose of testing in real world conditions under Article 60, freely-given\
    \ informed consent shall be obtained from the subjects of testing prior to their participation in\
    \ such testing and after their having been duly informed with concise, clear, relevant, and understandable\
    \ information regarding:\n        (a) the nature and objectives of the testing in real world conditions\
    \ and the possible inconvenience that may be linked to their participation;\n        (b) the conditions\
    \ under which the testing in real world conditions is to be conducted, including the expected duration\
    \ of the subject or subjects\u2019 participation;\n        (c) their rights, and the guarantees regarding\
    \ their participation, in particular their right to refuse to participate in, and the right to withdraw\
    \ from, testing in real world conditions at any time without any resulting detriment and without having\
    \ to provide any justification;\n        (d) the arrangements for requesting the reversal or the disregarding\
    \ of the predictions, recommendations or decisions of the AI system;\n        (e) the Union-wide unique\
    \ single identification number of the testing in real world conditions in accordance with Article\
    \ 60(4) point (c), and the contact details of the provider or its legal representative from whom further\
    \ information can be obtained.\n2. The informed consent shall be dated and documented and a copy shall\
    \ be given to the subjects of testing or their legal representative.\n"
  disposition: needs_review
