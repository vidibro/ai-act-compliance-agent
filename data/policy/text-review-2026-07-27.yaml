  sha256: 14aa0f36970a506fd46d22a4278b630b1af7ad3125f95b893eaff518dfd37384
  text: "Article 45\nInformation obligations of notified bodies\n\n1. Notified bodies shall inform the\
    \ notifying authority of the following:\n        (a) any Union technical documentation assessment\
    \ certificates, any supplements to those certificates, and any quality management system approvals\
    \ issued in accordance with the requirements of Annex VII;\n        (b) any refusal, restriction,\
    \ suspension or withdrawal of a Union technical documentation assessment certificate or a quality\
    \ management system approval issued in accordance with the requirements of Annex VII;\n        (c)\
    \ any circumstances affecting the scope of or conditions for notification;\n        (d) any request\
    \ for information which they have received from market surveillance authorities regarding conformity\
    \ assessment activities;\n        (e) on request, conformity assessment activities performed within\
    \ the scope of their notification and any other activity performed, including cross-border activities\
    \ and subcontracting.\n2. Each notified body shall inform the other notified bodies of:\n        (a)\
    \ quality management system approvals which it has refused, suspended or withdrawn, and, upon request,\
    \ of quality system approvals which it has issued;\n        (b) Union technical documentation assessment\
    \ certificates or any supplements thereto which it has refused, withdrawn, suspended or otherwise\
    \ restricted, and, upon request, of the certificates and/or supplements thereto which it has issued.\n\
    3. Each notified body shall provide the other notified bodies carrying out similar conformity assessment\
    \ activities covering the same types of AI systems with relevant information on issues relating to\
    \ negative and, on request, positive conformity assessment results.\n4. Notified bodies shall safeguard\
    \ the confidentiality of the information that they obtain, in accordance with Article 78.\n"
  disposition: needs_review
