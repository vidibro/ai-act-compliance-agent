  text: "Article 1\nSubject matter'\n\n1. The purpose of this Regulation is to improve the functioning\
    \ of the internal market and promote the uptake of human-centric and trustworthy artificial intelligence\
    \ (AI), while ensuring a high level of protection of health, safety, fundamental rights enshrined\
    \ in the Charter, including democracy, the rule of law and environmental protection, against the harmful\
    \ effects of AI systems in the Union and supporting innovation.\n2. This Regulation lays down:\n \
    \       (a) harmonised rules for the placing on the market, the putting into service, and the use\
    \ of AI systems in the Union;\n        (b) prohibitions of certain AI practices;\n        (c) specific\
    \ requirements for high-risk AI systems and obligations for operators of such systems;\n        (d)\
    \ harmonised transparency rules for certain AI systems;\n        (e) harmonised rules for the placing\
    \ on the market of general-purpose AI models;\n        (f) rules on market monitoring, market surveillance,\
    \ governance and enforcement;\n        (g) measures to support innovation, with a particular focus\
    \ on small mid-cap enterprises (SMCs) and small and medium-sized enterprises (SMEs), including start-ups.\n"
