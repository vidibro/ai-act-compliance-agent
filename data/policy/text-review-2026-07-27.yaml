  sha256: b044a6b43f42786795bf000b132b1acc3d22ca3ddec8fa9b7ff017b27bd3f963
  text: 'Article 38

    Coordination of notified bodies


    1. The Commission shall ensure that, with regard to high-risk AI systems, appropriate coordination
    and cooperation between notified bodies active in the conformity assessment procedures pursuant to
    this Regulation are put in place and properly operated in the form of a sectoral group of notified
    bodies.

    2. Each notifying authority shall ensure that the bodies notified by it participate in the work of
    a group referred to in paragraph 1, directly or through designated representatives.

    3. The Commission shall provide for the exchange of knowledge and best practices between notifying
    authorities.

    '
