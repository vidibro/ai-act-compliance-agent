  sha256: a3aff9193f871b66b69edaff20a088ee4623e3b8d35842141352ffaa7057cf7b
  text: '11. Without prejudice to Article 50 of this Regulation, deployers of high-risk AI systems referred
    to in Annex III that make decisions or assist in making decisions related to natural persons shall
    inform the natural persons that they are subject to the use of the high-risk AI system. For high-risk
    AI systems used for law enforcement purposes Article 13 of Directive (EU) 2016/680 shall apply.

    '
