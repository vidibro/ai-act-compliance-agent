  end: 6698
  sha256: 2ddb8de0c90c192ef2fe2dce68530363b309d3f79a35ea09552953b9c919effa
  text: '6. The Commission is empowered to adopt delegated acts in accordance with Article 97 in order
    to amend paragraphs 1 and 2 of this Article in order to subject high-risk AI systems referred to in
    points 2 to 8 of Annex III to the conformity assessment procedure referred to in Annex VII or parts
    thereof. The Commission shall adopt such delegated acts taking into account the effectiveness of the
    conformity assessment procedure based on internal control referred to in Annex VI in preventing or
    minimising the risks to health and safety and protection of fundamental rights posed by such systems,
    as well as the availability of adequate capacities and resources among notified bodies.

    '
