  sha256: a69055d819493e5392a095d60106b807c477944b5098e92747550ac2d43265a6
  text: "Article 65\nEstablishment and structure of the European Artificial Intelligence Board\n\n1. A\
    \ European Artificial Intelligence Board (the \u2018 Board \u2019) is hereby established.\n2. The\
    \ Board shall be composed of one representative per Member State. The European Data Protection Supervisor\
    \ shall participate as observer. The AI Office shall also attend the Board\u2019s meetings, without\
    \ taking part in the votes. Other national and Union authorities, bodies or experts may be invited\
    \ to the meetings by the Board on a case by case basis, where the issues discussed are of relevance\
    \ for them.\n3. Each representative shall be designated by their Member State for a period of three\
    \ years, renewable once.\n4. Member States shall ensure that their representatives on the Board:\n\
    \        (a) have the relevant competences and powers in their Member State so as to contribute actively\
    \ to the achievement of the Board\u2019s tasks referred to in Article 66;\n        (b) are designated\
    \ as a single contact point vis-\xE0-vis the Board and, where appropriate, taking into account Member\
    \ States\u2019 needs, as a single contact point for stakeholders;\n        (c) are empowered to facilitate\
    \ consistency and coordination between national competent authorities in their Member State as regards\
    \ the implementation of this Regulation, including through the collection of relevant data and information\
    \ for the purpose of fulfilling their tasks on the Board.\n5. The designated representatives of the\
    \ Member States shall adopt the Board\u2019s rules of procedure by a two-thirds majority. The rules\
    \ of procedure shall, in particular, lay down procedures for the selection process, the duration of\
    \ the mandate of, and specifications of the tasks of, the Chair, detailed arrangements for voting,\
    \ and the organisation of the Board\u2019s activities and those of its sub-groups.\n6. The Board shall\
    \ establish two standing sub-groups to provide a platform for cooperation and exchange among market\
    \ surveillance authorities and notifying authorities about issues related to market surveillance and\
    \ notified bodies respectively.\n    The standing sub-group for market surveillance should act as\
    \ the administrative cooperation group (ADCO) for this Regulation within the meaning of Article 30\
    \ of Regulation (EU) 2019/1020.\n    The Board may establish other standing or temporary sub-groups\
    \ as appropriate for the purpose of examining specific issues. Where appropriate, representatives\
    \ of the advisory forum referred to in Article 67 may be invited to such sub-groups or to specific\
    \ meetings of those subgroups as observers.\n7. The Board shall be organised and operated so as to\
    \ safeguard the objectivity and impartiality of its activities.\n8. The Board shall be chaired by\
    \ one of the representatives of the Member States. The AI Office shall provide the secretariat for\
    \ the Board, convene the meetings upon request of the Chair, and prepare the agenda in accordance\
    \ with the tasks of the Board pursuant to this Regulation and its rules of procedure.\n"
  disposition: needs_review
