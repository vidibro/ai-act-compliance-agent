  sha256: 7b39a89fd64d936c1ba9a9f0251c8b68892a8dea3fd29ec915b5bcee9398b488
  text: "Article 111\nAI systems already placed on the market or put into service and general-purpose\
    \ AI models already placed on the marked\n\n1. Without prejudice to the application of Article 5 as\
    \ referred to in Article 113(3), point (a), AI systems which are components of the large-scale IT\
    \ systems established by the legal acts listed in Annex X that have been placed on the market or put\
    \ into service before 2 August 2027 shall be brought into compliance with this Regulation by 31 December\
    \ 2030.\n    The requirements laid down in this Regulation shall be taken into account in the evaluation\
    \ of each large-scale IT system established by the legal acts listed in Annex X to be undertaken as\
    \ provided for in those legal acts and where those legal acts are replaced or amended.\n2. Without\
    \ prejudice to the application of Article 5 as referred to in Article 113, third paragraph, point\
    \ (a), this Regulation shall apply to operators of high-risk AI systems, other than the systems referred\
    \ to in paragraph 1 of this Article, that have been placed on the market or put into service before\
    \ the date of application of Chapter III referred to in Article 113, only if, as from that date, those\
    \ systems are subject to significant changes in their designs. In any case, the providers and deployers\
    \ of high-risk AI systems intended to be used by public authorities shall take the necessary steps\
    \ to comply with the requirements and obligations laid down in this Regulation by 2 August 2030.\n\
    3. Providers of general-purpose AI models that have been placed on the market before 2 August 2025\
    \ shall take the necessary steps in order to comply with the obligations laid down in this Regulation\
    \ by 2 August 2027.\n4. Providers of AI systems, including general-purpose AI systems, generating\
    \ synthetic audio, image, video or text content, that have been placed on the market before 2 August\
    \ 2026 shall take the necessary steps in order to comply with Article 50(2) by 2 December 2026.\n"
  disposition: needs_review
