- segment_id: AIA-TEXT-A020-FULL
  source:
    kind: article
    document: '20'
    act_version_date: '2026-07-27'
  start: 0
  end: 1141
  sha256: f6d6128d16f6f7bd6574abe5b8fadd7b24d6f3c9622ba5209d944e6280d2afbc
  text: 'Article 20

    Corrective actions and duty of information


    1. Providers of high-risk AI systems which consider or have reason to consider that a high-risk AI
    system that they have placed on the market or put into service is not in conformity with this Regulation
    shall immediately take the necessary corrective actions to bring that system into conformity, to withdraw
    it, to disable it, or to recall it, as appropriate. They shall inform the distributors of the high-risk
    AI system concerned and, where applicable, the deployers, the authorised representative and importers
    accordingly.

    2. Where the high-risk AI system presents a risk within the meaning of Article 79(1) and the provider
    becomes aware of that risk, it shall immediately investigate the causes, in collaboration with the
    reporting deployer, where applicable, and inform the market surveillance authorities competent for
    the high-risk AI system concerned and, where applicable, the notified body that issued a certificate
    for that high-risk AI system in accordance with Article 44, in particular, of the nature of the non-compliance
    and of any relevant corrective action taken.

    '
