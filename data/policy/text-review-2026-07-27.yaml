- segment_id: AIA-TEXT-ANNEX-VII-I5
  source:
    kind: annex
    document: VII
    act_version_date: '2026-07-27'
  start: 7004
  end: 7893
  sha256: 6ad7698a7bcadeaedb22a1922a640149c21867a678ea1703b3500481786ba3cd
  text: '5.Surveillance of the approved quality management system. 5.1.The purpose of the surveillance
    carried out by the notified body referred to in Point 3 is to make sure that the provider duly complies
    with the terms and conditions of the approved quality management system. 5.2.For assessment purposes,
    the provider shall allow the notified body to access the premises where the design, development, testing
    of the AI systems is taking place. The provider shall further share with the notified body all necessary
    information. 5.3.The notified body shall carry out periodic audits to make sure that the provider
    maintains and applies the quality management system and shall provide the provider with an audit report.
    In the context of those audits, the notified body may carry out additional tests of the AI systems
    for which a Union technical documentation assessment certificate was issued.

    '
