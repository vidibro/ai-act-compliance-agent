  sha256: b15ee19b6d2f494096aaec44fda79b5d0d1ac168bb549b9edd203ede92cf4881
  text: "Article 76\nSupervision of testing in real world conditions by market surveillance authorities\n\
    \n1. Market surveillance authorities shall have competences and powers to ensure that testing in real\
    \ world conditions is in accordance with this Regulation.\n    Where testing in real world conditions\
    \ is based on Article 60a, any reference to a market surveillance authority in this Article shall\
    \ be construed as a reference to the national competent authority or appropriate authority under the\
    \ Union harmonisation legislation listed in Section B of Annex I, and references to Article 60 shall\
    \ be construed as references to Article 60a, as appropriate.\n2. Where testing in real world conditions\
    \ is conducted for AI systems that are supervised within an AI regulatory sandbox under Article 58,\
    \ the market surveillance authorities shall verify the compliance with Article 60 as part of their\
    \ supervisory role for the AI regulatory sandbox. Those authorities may, as appropriate, allow the\
    \ testing in real world conditions to be conducted by the provider or prospective provider, in derogation\
    \ from the conditions set out in Article 60(4), points (f) and (g).\n3. Where a market surveillance\
    \ authority has been informed by the prospective provider, the provider or any third party of a serious\
    \ incident or has other grounds for considering that the conditions set out in Articles 60 and 61\
    \ are not met, it may take either of the following decisions on its territory, as appropriate:\n \
    \       (a) to suspend or terminate the testing in real world conditions;\n        (b) to require\
    \ the provider or prospective provider and the deployer or prospective deployer to modify any aspect\
    \ of the testing in real world conditions.\n4. Where a market surveillance authority has taken a decision\
    \ referred to in paragraph 3 of this Article, or has issued an objection within the meaning of Article\
    \ 60(4), point (b), the decision or the objection shall indicate the grounds therefor and how the\
    \ provider or prospective provider can challenge the decision or objection.\n5. Where applicable,\
    \ where a market surveillance authority has taken a decision referred to in paragraph 3, it shall\
    \ communicate the grounds therefor to the market surveillance authorities of other Member States in\
    \ which the AI system has been tested in accordance with the testing plan.\n"
  disposition: needs_review
