- segment_id: AIA-TEXT-A060A-FULL
  source:
    kind: article
    document: 60a
    act_version_date: '2026-07-27'
  start: 0
  end: 2959
  sha256: 828bd664c9053a7f4aab3d28d1b3dca85e6d874cb723f0ee8775e64492b326f3
  text: "Article 60a\nTesting of high-risk AI systems covered by Union harmonisation legislation listed\
    \ in Section B of Annex I in real-world conditions outside AI regulatory sandboxes\n\n1. Member States\
    \ may allow, in accordance with this Article, the testing of high-risk AI systems in real world conditions\
    \ outside AI regulatory sandboxes by providers or prospective providers of AI enabled products covered\
    \ by the Union harmonisation legislation listed in Section B of Annex I, with a view to assessing\
    \ and verifying the conformity of those systems with the requirements laid down in Articles 8 to 15.\n\
    2. Member States that choose to allow testing as referred to in paragraph 1 shall, individually or\
    \ jointly, adopt frameworks for real-world testing.\n3. Each Member State shall notify the Commission\
    \ of any real-world testing framework it adopts before implementing it. This shall not affect the\
    \ competences of the Commission under the Union harmonisation legislation listed in Section B of Annex\
    \ I.\n4. Member States that have adopted real-world testing frameworks shall ensure that the relevant\
    \ national competent authorities, relevant authorities and public authorities responsible for the\
    \ management and operation of infrastructure and products covered by Union harmonisation legislation\
    \ listed in Section B of Annex I cooperate closely with each other in good faith and remove any practical\
    \ obstacles, including on procedural rules providing access to physical public infrastructure, where\
    \ this is necessary, to successfully implement those real-world testing frameworks and test AI-enabled\
    \ products covered by Union harmonisation legislation listed in Section B of Annex I.\n5. The frameworks\
    \ for real-world testing shall lay down the requirements under which testing in real-world conditions\
    \ shall occur. Those frameworks shall:\n        (a) include the provision of a mandatory real-world\
    \ testing plan to be agreed between the provider or prospective provider and the national competent\
    \ authority or relevant authority in accordance with the Union harmonisation legislation listed in\
    \ Section B of Annex I;\n        (b) ensure compliance with the requirements laid down in Article\
    \ 60(2), (3), (4)(d)-(j) and (5)-(9), where any reference to market surveillance authorities in those\
    \ provisions shall be read as a reference to the national competent authority or relevant authority,\
    \ as appropriate in accordance with the Union harmonisation legislation listed in Section B of Annex\
    \ I;\n        (c) include effective governance and accountability arrangements;\n        (d) ensure\
    \ a high level of protection of health safety and fundamental rights.\n6. The real-world testing shall\
    \ comply with the applicable provisions laid down in the Union harmonisation legislation listed in\
    \ Section B of Annex I. Any requirements laid down in those provisions shall not affect the application\
    \ of this Article to the extent necessary to enable the testing referred to in paragraph 1.\n"
  disposition: needs_review
