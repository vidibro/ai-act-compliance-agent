  end: 727
  sha256: 60f6ee7216cc718c8e862ce678cb4fcd004211cecbb48fec1bae869970c01be9
  text: 'Article 88

    Enforcement of the obligations of providers of general-purpose AI models


    1. The Commission shall have exclusive powers to supervise and enforce Chapter V, taking into account
    the procedural guarantees under Article 94. The Commission shall entrust the implementation of these
    tasks to the AI Office, without prejudice to the powers of organisation of the Commission and the
    division of competences between Member States and the Union based on the Treaties.

    2. Without prejudice to Article 75(3), market surveillance authorities may request the Commission
    to exercise the powers laid down in this Section, where that is necessary and proportionate to assist
    with the fulfilment of their tasks under this Regulation.

    '
