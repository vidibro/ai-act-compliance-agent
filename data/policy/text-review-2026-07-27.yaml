  sha256: e106f8606d2c7abee66d08305dff3a62e6a803d5c271b0e67f436f6aacceb7ec
  text: '1b. The authorities involved in the application of this Regulation shall cooperate actively with
    the AI Office and provide the AI Office the necessary assistance for the exercise of its powers, including,
    where necessary, in connection with inspections or other enforcement measures carried out in the territory
    of a Member State. To that end, those authorities shall enjoy the powers provided for pursuant to
    this Regulation and Regulation (EU) 2019/1020, and where relevant and limited to what is necessary
    to fulfil their tasks under this paragraph, in accordance with the applicable national procedures.

    '
