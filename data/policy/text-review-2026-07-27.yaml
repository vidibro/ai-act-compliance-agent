  sha256: 1a883c288a2eeb01e0cc8bbb04c54af0f5010db5622e6673245954d7eb7d685f
  text: 'Article 67

    Advisory forum


    1. An advisory forum shall be established to provide technical expertise and advise the Board and
    the Commission, and to contribute to their tasks under this Regulation.

    2. The membership of the advisory forum shall represent a balanced selection of stakeholders, including
    industry, start-ups, SMEs, civil society and academia. The membership of the advisory forum shall
    be balanced with regard to commercial and non-commercial interests and, within the category of commercial
    interests, with regard to SMEs and other undertakings.

    3. The Commission shall appoint the members of the advisory forum, in accordance with the criteria
    set out in paragraph 2, from amongst stakeholders with recognised expertise in the field of AI.

    4. The term of office of the members of the advisory forum shall be two years, which may be extended
    by up to no more than four years.

    5. The Fundamental Rights Agency, ENISA, the European Committee for Standardization (CEN), the European
    Committee for Electrotechnical Standardization (CENELEC), and the European Telecommunications Standards
    Institute (ETSI) shall be permanent members of the advisory forum.

    6. The advisory forum shall draw up its rules of procedure. It shall elect two co-chairs from among
    its members, in accordance with criteria set out in paragraph 2. The term of office of the co-chairs
    shall be two years, renewable once.

    7. The advisory forum shall hold meetings at least twice a year. The advisory forum may invite experts
    and other stakeholders to its meetings.

    8. The advisory forum may prepare opinions, recommendations and written contributions at the request
    of the Board or the Commission.

    9. The advisory forum may establish standing or temporary sub-groups as appropriate for the purpose
    of examining specific questions related to the objectives of this Regulation.

    10. The advisory forum shall prepare an annual report on its activities. That report shall be made
    publicly available.

    '
