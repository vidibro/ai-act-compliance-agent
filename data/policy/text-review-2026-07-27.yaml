  sha256: f955b63629aefa5cf8b62aa2cc2c1d571057c85ac48ca4a77d4a0c840483b94d
  text: 'Article 64

    AI Office


    1. The Commission shall develop Union expertise and capabilities in the field of AI through the AI
    Office.

    2. Member States shall facilitate the tasks entrusted to the AI Office, as reflected in this Regulation.

    3. Without prejudice to the budgetary procedure, the AI Office shall be allocated adequate resources
    to effectively perform its duties and exercise its powers in relation to the enforcement of this Regulation.

    '
