    elapsed_seconds: null
- segment_id: AIA-TEXT-A050-P4
  source:
    kind: article
    document: '50'
    act_version_date: '2026-07-27'
  start: 2316
  end: 3542
  sha256: 111a1648b0ef304bc138904b5007a64655ced330ca252f20f0dcf2385c27a271
  text: "4. Deployers of an AI system that generates or manipulates image, audio or video content constituting\
    \ a deep fake, shall disclose that the content has been artificially generated or manipulated. This\
    \ obligation shall not apply where the use is authorised by law to detect, prevent, investigate or\
    \ prosecute criminal offence. Where the content forms part of an evidently artistic, creative, satirical,\
    \ fictional or analogous work or programme, the transparency obligations set out in this paragraph\
    \ are limited to disclosure of the existence of such generated or manipulated content in an appropriate\
    \ manner that does not hamper the display or enjoyment of the work.\n    Deployers of an AI system\
    \ that generates or manipulates text which is published with the purpose of informing the public on\
    \ matters of public interest shall disclose that the text has been artificially generated or manipulated.\
    \ This obligation shall not apply where the use is authorised by law to detect, prevent, investigate\
    \ or prosecute criminal offences or where the AI-generated content has undergone a process of human\
    \ review or editorial control and where a natural or legal person holds editorial responsibility for\
    \ the publication of the content.\n"
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A050-P4-DEEPFAKE
  - AIA-NORM-A050-P4-TEXT
  review:
    status: proposed
    extracted_by: semantic-legal-effect-pass
