- segment_id: AIA-TEXT-A053-FULL
  source:
    kind: article
    document: '53'
    act_version_date: '2026-07-27'
  start: 0
  end: 3596
  sha256: 6f0c6c88711c2a83dd1b7a3046f15874e44d45ce8f4f0019a17f452f63eb346b
  text: "Article 53\nObligations for providers of general-purpose AI models\n\n1. Providers of general-purpose\
    \ AI models shall:\n        (a) draw up and keep up-to-date the technical documentation of the model,\
    \ including its training and testing process and the results of its evaluation, which shall contain,\
    \ at a minimum, the information set out in Annex XI for the purpose of providing it, upon request,\
    \ to the AI Office and the national competent authorities;\n        (b) draw up, keep up-to-date and\
    \ make available information and documentation to providers of AI systems who intend to integrate\
    \ the general-purpose AI model into their AI systems. Without prejudice to the need to observe and\
    \ protect intellectual property rights and confidential business information or trade secrets in accordance\
    \ with Union and national law, the information and documentation shall:\n                (i) enable\
    \ providers of AI systems to have a good understanding of the capabilities and limitations of the\
    \ general-purpose AI model and to comply with their obligations pursuant to this Regulation; and\n\
    \                (ii) contain, at a minimum, the elements set out in Annex XII;\n        (c) put in\
    \ place a policy to comply with Union law on copyright and related rights, and in particular to identify\
    \ and comply with, including through state-of-the-art technologies, a reservation of rights expressed\
    \ pursuant to Article 4(3) of Directive (EU) 2019/790;\n        (d) draw up and make publicly available\
    \ a sufficiently detailed summary about the content used for training of the general-purpose AI model,\
    \ according to a template provided by the AI Office.\n2. The obligations set out in paragraph 1, points\
    \ (a) and (b), shall not apply to providers of AI models that are released under a free and open-source\
    \ licence that allows for the access, usage, modification, and distribution of the model, and whose\
    \ parameters, including the weights, the information on the model architecture, and the information\
    \ on model usage, are made publicly available. This exception shall not apply to general-purpose AI\
    \ models with systemic risks.\n3. Providers of general-purpose AI models shall cooperate as necessary\
    \ with the Commission and the national competent authorities in the exercise of their competences\
    \ and powers pursuant to this Regulation.\n4. Providers of general-purpose AI models may rely on codes\
    \ of practice within the meaning of Article 56 to demonstrate compliance with the obligations set\
    \ out in paragraph 1 of this Article, until a harmonised standard is published. Compliance with European\
    \ harmonised standards grants providers the presumption of conformity to the extent that those standards\
    \ cover those obligations. Providers of general-purpose AI models who do not adhere to an approved\
    \ code of practice or do not comply with a European harmonised standard shall demonstrate alternative\
    \ adequate means of compliance for assessment by the Commission.\n5. For the purpose of facilitating\
    \ compliance with Annex XI, in particular points 2 (d) and (e) thereof, the Commission is empowered\
    \ to adopt delegated acts in accordance with Article 97 to detail measurement and calculation methodologies\
    \ with a view to allowing for comparable and verifiable documentation.\n6. The Commission is empowered\
    \ to adopt delegated acts in accordance with Article 97(2) to amend Annexes XI and XII in light of\
    \ evolving technological developments.\n7. Any information or documentation obtained pursuant to this\
    \ Article, including trade secrets, shall be treated in accordance with the confidentiality obligations\
    \ set out in Article 78.\n"
  disposition: needs_review
