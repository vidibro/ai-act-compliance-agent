- segment_id: AIA-TEXT-ANNEX-IV-I2
  source:
    kind: annex
    document: IV
    act_version_date: '2026-07-27'
  start: 1360
  end: 4165
  sha256: 488ebf083a931e51447337f8df7cb1ff0705895bc207755422f6ea450c7c963b
  text: "2. A detailed description of the elements of the AI system and of the process for its development,\
    \ including:\n        (a) the methods and steps performed for the development of the AI system, including,\
    \ where relevant, recourse to pre-trained systems or tools provided by third parties and how those\
    \ were used, integrated or modified by the provider;\n        (b) the design specifications of the\
    \ system, namely the general logic of the AI system and of the algorithms; the key design choices\
    \ including the rationale and assumptions made, including with regard to persons or groups of persons\
    \ in respect of who, the system is intended to be used; the main classification choices; what the\
    \ system is designed to optimise for, and the relevance of the different parameters; the description\
    \ of the expected output and output quality of the system; the decisions about any possible trade-off\
    \ made regarding the technical solutions adopted to comply with the requirements set out in Chapter\
    \ III, Section 2;\n        (c) the description of the system architecture explaining how software\
    \ components build on or feed into each other and integrate into the overall processing; the computational\
    \ resources used to develop, train, test and validate the AI system;\n        (d) where relevant,\
    \ the data requirements in terms of datasheets describing the training methodologies and techniques\
    \ and the training data sets used, including a general description of these data sets, information\
    \ about their provenance, scope and main characteristics; how the data was obtained and selected;\
    \ labelling procedures (e.g. for supervised learning), data cleaning methodologies (e.g. outliers\
    \ detection);\n        (e) assessment of the human oversight measures needed in accordance with Article\
    \ 14, including an assessment of the technical measures needed to facilitate the interpretation of\
    \ the outputs of AI systems by the deployers, in accordance with Article 13(3), point (d);\n     \
    \   (f) where applicable, a detailed description of pre-determined changes to the AI system and its\
    \ performance, together with all the relevant information related to the technical solutions adopted\
    \ to ensure continuous compliance of the AI system with the relevant requirements set out in Chapter\
    \ III, Section 2;\n        (g) the validation and testing procedures used, including information about\
    \ the validation and testing data used and their main characteristics; metrics used to measure accuracy,\
    \ robustness and compliance with other relevant requirements set out in Chapter III, Section 2, as\
    \ well as potentially discriminatory impacts; test logs and all test reports dated and signed by the\
    \ responsible persons, including with regard to pre-determined changes as referred to under point\
    \ (f);\n        (h) cybersecurity measures put in place;\n"
  disposition: normative
  disposition_reason: ''
