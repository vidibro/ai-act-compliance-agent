- segment_id: AIA-TEXT-A049-FULL
  source:
    kind: article
    document: '49'
    act_version_date: '2026-07-27'
  start: 0
  end: 2025
  sha256: 265c68f27a4da393f7191dd1ffa29e90831b71c9f5b36e826d5673ff7d1972f6
  text: "Article 49\nRegistration\n\n1. Before placing on the market or putting into service a high-risk\
    \ AI system listed in Annex III, with the exception of high-risk AI systems referred to in point 2\
    \ of Annex III, the provider or, where applicable, the authorised representative shall register themselves\
    \ and their system in the EU database referred to in Article 71.\n2. Before placing on the market\
    \ or putting into service an AI system for which the provider has concluded that it is not high-risk\
    \ according to Article 6(3), that provider or, where applicable, the authorised representative shall\
    \ register themselves and that system in the EU database referred to in Article 71.\n3. Before putting\
    \ into service or using a high-risk AI system listed in Annex III, with the exception of high-risk\
    \ AI systems listed in point 2 of Annex III, deployers that are public authorities, Union institutions,\
    \ bodies, offices or agencies or persons acting on their behalf shall register themselves, select\
    \ the system and register its use in the EU database referred to in Article 71.\n4. For high-risk\
    \ AI systems referred to in points 1, 6 and 7 of Annex III, in the areas of law enforcement, migration,\
    \ asylum and border control management, the registration referred to in paragraphs 1, 2 and 3 of this\
    \ Article shall be in a secure non-public section of the EU database referred to in Article 71 and\
    \ shall include only the following information, as applicable, referred to in:\n        (a) Section\
    \ A, points 1 to 10, of Annex VIII, with the exception of points 6, 8 and 9;\n        (b) Section\
    \ B, points 1 to 5, and points 8 and 9 of Annex VIII;\n        (c) Section C, points 1 to 3, of Annex\
    \ VIII;\n        (d) points 1, 2, 3 and 5, of Annex IX.\n    Only the Commission and national authorities\
    \ referred to in Article 74(8) shall have access to the respective restricted sections of the EU database\
    \ listed in the first subparagraph of this paragraph.\n5. High-risk AI systems referred to in point\
    \ 2 of Annex III shall be registered at national level.\n"
  disposition: needs_review
