- segment_id: AIA-TEXT-A013-FULL
  source:
    kind: article
    document: '13'
    act_version_date: '2026-07-27'
  start: 0
  end: 3285
  sha256: 824d754bbab6e6ab294aee1165262bfb26840d8165ee016172aee37104098162
  text: "Article 13\nTransparency and provision of information to deployers\n\n1. High-risk AI systems\
    \ shall be designed and developed in such a way as to ensure that their operation is sufficiently\
    \ transparent to enable deployers to interpret a system\u2019s output and use it appropriately. An\
    \ appropriate type and degree of transparency shall be ensured with a view to achieving compliance\
    \ with the relevant obligations of the provider and deployer set out in Section 3.\n2. High-risk AI\
    \ systems shall be accompanied by instructions for use in an appropriate digital format or otherwise\
    \ that include concise, complete, correct and clear information that is relevant, accessible and comprehensible\
    \ to deployers.\n3. The instructions for use shall contain at least the following information:\n \
    \       (a) the identity and the contact details of the provider and, where applicable, of its authorised\
    \ representative;\n        (b) the characteristics, capabilities and limitations of performance of\
    \ the high-risk AI system, including:\n                (i) its intended purpose;\n               \
    \ (ii) the level of accuracy, including its metrics, robustness and cybersecurity referred to in Article\
    \ 15 against which the high-risk AI system has been tested and validated and which can be expected,\
    \ and any known and foreseeable circumstances that may have an impact on that expected level of accuracy,\
    \ robustness and cybersecurity;\n                (iii) any known or foreseeable circumstance, related\
    \ to the use of the high-risk AI system in accordance with its intended purpose or under conditions\
    \ of reasonably foreseeable misuse, which may lead to risks to the health and safety or fundamental\
    \ rights referred to in Article 9(2);\n                (iv) where applicable, the technical capabilities\
    \ and characteristics of the high-risk AI system to provide information that is relevant to explain\
    \ its output;\n                (v) when appropriate, its performance regarding specific persons or\
    \ groups of persons on which the system is intended to be used;\n                (vi) when appropriate,\
    \ specifications for the input data, or any other relevant information in terms of the training, validation\
    \ and testing data sets used, taking into account the intended purpose of the high-risk AI system;\n\
    \                (vii) where applicable, information to enable deployers to interpret the output of\
    \ the high-risk AI system and use it appropriately;\n        (c) the changes to the high-risk AI system\
    \ and its performance which have been pre-determined by the provider at the moment of the initial\
    \ conformity assessment, if any;\n        (d) the human oversight measures referred to in Article\
    \ 14, including the technical measures put in place to facilitate the interpretation of the outputs\
    \ of the high-risk AI systems by the deployers;\n        (e) the computational and hardware resources\
    \ needed, the expected lifetime of the high-risk AI system and any necessary maintenance and care\
    \ measures, including their frequency, to ensure the proper functioning of that AI system, including\
    \ as regards software updates;\n        (f) where relevant, a description of the mechanisms included\
    \ within the high-risk AI system that allows deployers to properly collect, store and interpret the\
    \ logs in accordance with Article 12.\n"
  disposition: needs_review
  disposition_reason: Not yet semantically extracted; retained as explicit review debt.
