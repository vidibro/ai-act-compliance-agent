- segment_id: AIA-TEXT-A050-P7
  source:
    kind: article
    document: '50'
    act_version_date: '2026-07-27'
  start: 4047
  end: 4832
  sha256: 4e8b5db374f9fa3dcd525e215d90b354b7887c644f8bcce63bc076df7b279923
  text: '7. The Commission shall encourage and facilitate the drawing up of codes of practice at Union
    level to facilitate the effective implementation of the obligations regarding the detection, marking
    and labelling of artificially generated or manipulated content. The Commission, taking utmost account
    of the opinion of the Board, shall assess whether adherence to those codes of practice is adequate
    to ensure compliance with the obligations laid down in paragraphs 2 and 4 of this Article, in accordance
    with the procedure laid down in Article 56(6). If it deems the code of practice to be inadequate,
    the Commission may adopt an implementing act specifying common rules for the implementation of those
    obligations in accordance with the examination procedure laid down in Article 98(2).

    '
  disposition: normative
  disposition_reason: ''
