  sha256: a436d5189578248a58888ff0fa81f93157eacddcc05a64c241a07fde27baf50e
  text: "Article 72\nPost-market monitoring by providers and post-market monitoring plan for high-risk\
    \ AI systems\n\n1. Providers shall establish and document a post-market monitoring system in a manner\
    \ that is proportionate to the nature of the AI technologies and the risks of the high-risk AI system.\n\
    2. The post-market monitoring system shall actively and systematically collect, document and analyse\
    \ relevant data which may be provided by deployers or which may be collected through other sources\
    \ on the performance of high-risk AI systems throughout their lifetime, and which allow the provider\
    \ to evaluate the continuous compliance of AI systems with the requirements set out in Chapter III,\
    \ Section 2. Where relevant, post-market monitoring shall include an analysis of the interaction with\
    \ other AI systems. This obligation shall not cover sensitive operational data of deployers which\
    \ are law-enforcement authorities.\n3. The post-market monitoring system shall be based on a post-market\
    \ monitoring plan. The post-market monitoring plan shall be part of the technical documentation referred\
    \ to in Annex IV. The Commission, taking utmost account of the opinion of the Board, shall adopt guidance,\
    \ including a template, on the post-market monitoring plan by 2 September 2027.\n4. For high-risk\
    \ AI systems covered by the Union harmonisation legislation listed in Section A of Annex I, where\
    \ a post-market monitoring system and plan are already established under that legislation, in order\
    \ to ensure consistency, avoid duplications and minimise additional burdens, providers shall have\
    \ a choice of integrating, as appropriate, the necessary elements described in paragraphs 1, 2 and\
    \ 3 using the template referred in paragraph 3 into systems and plans already existing under that\
    \ legislation, provided that it achieves an equivalent level of protection.\n    The first subparagraph\
    \ of this paragraph shall also apply to high-risk AI systems referred to in point 5 of Annex III placed\
    \ on the market or put into service by financial institutions that are subject to requirements under\
    \ Union financial services law regarding their internal governance, arrangements or processes.\n"
