  sha256: 544a97aef2ce579c4232ff14e2ae6c2ee06371c3a07a60698f7100d98b5507ef
  text: 'Article 77

    Powers of authorities protecting fundamental rights and cooperation with market surveillance authorities


    1. National public authorities or bodies which supervise or enforce the respect of obligations under
    Union law protecting fundamental rights, including the right to non-discrimination, shall have the
    power to request and access any information or documentation created or maintained from the relevant
    market surveillance authority pursuant to this Regulation in accessible language and machine-readable
    format by electronic means where access to that information or documentation is necessary for effectively
    fulfilling their mandates within the limits of their jurisdiction. This Article is without prejudice
    to the competences, tasks, powers and independence of the relevant national public authorities or
    bodies under their mandates.

    1a. Subject to the conditions specified in this Article, the market surveillance authority shall grant
    the relevant public authority or body referred to in paragraph 1 access to such information or documentation,
    including by requesting such information or documentation from the provider or the deployer, where
    necessary and without undue delay.

    1b. Market surveillance authorities and public authorities or bodies referred to in paragraph 1 shall
    cooperate closely and provide each other with the mutual assistance necessary to fulfil their respective
    mandates, with a view to ensuring the coherent application of this Regulation and Union law protecting
    fundamental rights and streamlining procedures, while respecting their respective competences, tasks,
    powers and independence. This shall include, in particular, exchange of information where necessary
    for the effective supervision or enforcement of this Regulation and the respective other Union legislation.

    2. By 2 November 2024, each Member State shall identify the public authorities or bodies referred
    to in paragraph 1 and make a list of them publicly available. Member States shall notify the list
    to the Commission and to the other Member States, and shall keep the list up to date.

    3. Where the documentation referred to in paragraph 1 is insufficient to ascertain whether an infringement
    of obligations under Union law protecting fundamental rights has occurred, the public authority or
    body referred to in paragraph 1 may make a reasoned request to the market surveillance authority,
    to organise testing of the high-risk AI system through technical means. The market surveillance authority
    shall organise the testing with the close involvement of the requesting public authority or body within
    a reasonable time following the request.

    4. Any information or documentation obtained by the national public authorities or bodies referred
    to in paragraph 1 of this Article pursuant to this Article shall be treated in accordance with the
    confidentiality obligations set out in Article 78.

    '
