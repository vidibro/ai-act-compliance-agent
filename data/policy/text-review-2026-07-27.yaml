- segment_id: AIA-TEXT-A050-P1
  source:
    kind: article
    document: '50'
    act_version_date: '2026-07-27'
  start: 87
  end: 790
  sha256: 642dc430d584b1e191203c59341bf7fd6249dbef283a158d6855cc225741addd
  text: '1. Providers shall ensure that AI systems intended to interact directly with natural persons
    are designed and developed in such a way that the natural persons concerned are informed that they
    are interacting with an AI system, unless this is obvious from the point of view of a natural person
    who is reasonably well-informed, observant and circumspect, taking into account the circumstances
    and the context of use. This obligation shall not apply to AI systems authorised by law to detect,
    prevent, investigate or prosecute criminal offences, subject to appropriate safeguards for the rights
    and freedoms of third parties, unless those systems are available for the public to report a criminal
    offence.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A050-P1-DISCLOSE
  review:
    status: proposed
    extracted_by: semantic-legal-effect-pass
    verified_by: ''
    review_run_id: normative-coverage-2026-08-28
    presentation_mode: exact-source-slice
    display_chunks: 1
    fully_displayed: true
    elapsed_seconds: null
- segment_id: AIA-TEXT-A050-P2
  source:
    kind: article
    document: '50'
    act_version_date: '2026-07-27'
  start: 790
  end: 1709
  sha256: 817f8d0b24bc8882c3be1e7ba4efa5fffc2348276ecdae7a5c01329dfc6da7b0
  text: '2. Providers of AI systems, including general-purpose AI systems, generating synthetic audio,
    image, video or text content, shall ensure that the outputs of the AI system are marked in a machine-readable
    format and detectable as artificially generated or manipulated. Providers shall ensure their technical
    solutions are effective, interoperable, robust and reliable as far as this is technically feasible,
    taking into account the specificities and limitations of various types of content, the costs of implementation
    and the generally acknowledged state of the art, as may be reflected in relevant technical standards.
    This obligation shall not apply to the extent the AI systems perform an assistive function for standard
    editing or do not substantially alter the input data provided by the deployer or the semantics thereof,
    or where authorised by law to detect, prevent, investigate or prosecute criminal offences.

    '
  disposition: normative
  disposition_reason: ''
  norm_ids:
  - AIA-NORM-A050-P2-MARK-DETECT
  review:
    status: proposed
    extracted_by: semantic-legal-effect-pass
    verified_by: ''
    review_run_id: normative-coverage-2026-08-28
