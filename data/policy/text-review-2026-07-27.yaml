  sha256: 34978694567ee239988f06aef86f1147ffc1169b9e199ebcd773e6172068443a
  text: "Article 83\nFormal non-compliance\n\n1. Where the market surveillance authority of a Member State\
    \ makes one of the following findings, it shall require the relevant provider to put an end to the\
    \ non-compliance concerned, within a period it may prescribe:\n        (a) the CE marking has been\
    \ affixed in violation of Article 48;\n        (b) the CE marking has not been affixed;\n        (c)\
    \ the EU declaration of conformity referred to in Article 47 has not been drawn up;\n        (d) the\
    \ EU declaration of conformity referred to in Article 47 has not been drawn up correctly;\n      \
    \  (e) the registration in the EU database referred to in Article 71 has not been carried out;\n \
    \       (f) where applicable, no authorised representative has been appointed;\n        (g) technical\
    \ documentation is not available.\n2. Where the non-compliance referred to in paragraph 1 persists,\
    \ the market surveillance authority of the Member State concerned shall take appropriate and proportionate\
    \ measures to restrict or prohibit the high-risk AI system being made available on the market or to\
    \ ensure that it is recalled or withdrawn from the market without delay.\n"
