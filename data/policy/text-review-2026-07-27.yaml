  sha256: a2fb834f11c99991929e3f9e1f7130fc9fc4dae7dd414a1f0a11070e402fa156
  text: 'Article 63

    Derogations for specific operators


    1. SMEs, including start-ups, may comply with certain elements of the quality management system required
    by Article 17 in a simplified manner, provided that they do not have partner enterprises or linked
    enterprises within the meaning of Recommendation 2003/361/EC. For that purpose, the Commission shall
    develop guidelines on the elements of the quality management system which may be complied with in
    a simplified manner considering the needs of SMEs, without affecting the level of protection or the
    need for compliance with the requirements in respect of high-risk AI systems.

    2. Paragraph 1 of this Article shall not be interpreted as exempting those operators from fulfilling
    any other requirements or obligations laid down in this Regulation, including those established in
    Articles 9, 10, 11, 12, 13, 14, 15, 72 and 73.

    '
