  sha256: 2e9ef93ed5d38ce7dd7d3ae24e41c33ca17d1c62191ba915895b2a362ea21ad5
  text: "Article 90\nAlerts of systemic risks by the scientific panel\n\n1. The scientific panel may provide\
    \ a qualified alert to the AI Office where it has reason to suspect that:\n        (a) a general-purpose\
    \ AI model poses concrete identifiable risk at Union level; or\n        (b) a general-purpose AI model\
    \ meets the conditions referred to in Article 51.\n2. Upon such qualified alert, the Commission, through\
    \ the AI Office and after having informed the Board, may exercise the powers laid down in this Section\
    \ for the purpose of assessing the matter. The AI Office shall inform the Board of any measure according\
    \ to Articles 91 to 94.\n3. A qualified alert shall be duly reasoned and indicate at least:\n    \
    \    (a) the point of contact of the provider of the general-purpose AI model with systemic risk concerned;\n\
    \        (b) a description of the relevant facts and the reasons for the alert by the scientific panel;\n\
    \        (c) any other information that the scientific panel considers to be relevant, including,\
    \ where appropriate, information gathered on its own initiative.\n"
  disposition: needs_review
