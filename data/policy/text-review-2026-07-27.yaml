- segment_id: AIA-TEXT-A017-FULL
  source:
    kind: article
    document: '17'
    act_version_date: '2026-07-27'
  start: 0
  end: 3828
  sha256: 192f132ff59bdca84fea9899ff5611c5507bb814f6b81f3b8417ba84ccaa4c5a
  text: "Article 17\nQuality management system\n\n1. Providers of high-risk AI systems shall put a quality\
    \ management system in place that ensures compliance with this Regulation. That system shall be documented\
    \ in a systematic and orderly manner in the form of written policies, procedures and instructions,\
    \ and shall include at least the following aspects:\n        (a) a strategy for regulatory compliance,\
    \ including compliance with conformity assessment procedures and procedures for the management of\
    \ modifications to the high-risk AI system;\n        (b) techniques, procedures and systematic actions\
    \ to be used for the design, design control and design verification of the high-risk AI system;\n\
    \        (c) techniques, procedures and systematic actions to be used for the development, quality\
    \ control and quality assurance of the high-risk AI system;\n        (d) examination, test and validation\
    \ procedures to be carried out before, during and after the development of the high-risk AI system,\
    \ and the frequency with which they have to be carried out;\n        (e) technical specifications,\
    \ including standards, to be applied and, where the relevant harmonised standards are not applied\
    \ in full or do not cover all of the relevant requirements set out in Section 2, the means to be used\
    \ to ensure that the high-risk AI system complies with those requirements;\n        (f) systems and\
    \ procedures for data management, including data acquisition, data collection, data analysis, data\
    \ labelling, data storage, data filtration, data mining, data aggregation, data retention and any\
    \ other operation regarding the data that is performed before and for the purpose of the placing on\
    \ the market or the putting into service of high-risk AI systems;\n        (g) the risk management\
    \ system referred to in Article 9;\n        (h) the setting-up, implementation and maintenance of\
    \ a post-market monitoring system, in accordance with Article 72;\n        (i) procedures related\
    \ to the reporting of a serious incident in accordance with Article 73;\n        (j) the handling\
    \ of communication with national competent authorities, other relevant authorities, including those\
    \ providing or supporting the access to data, notified bodies, other operators, customers or other\
    \ interested parties;\n        (k) systems and procedures for record-keeping of all relevant documentation\
    \ and information;\n        (l) resource management, including security-of-supply related measures;\n\
    \        (m) an accountability framework setting out the responsibilities of the management and other\
    \ staff with regard to all the aspects listed in this paragraph.\n2. The implementation of the aspects\
    \ referred to in paragraph 1 shall be proportionate to the size of the provider\u2019s organisation,\
    \ in particular, if the provider is an SME, including a start-up, or an SMC. Providers shall, in any\
    \ event, respect the degree of rigour and the level of protection required to ensure the compliance\
    \ of their high-risk AI systems with this Regulation.\n3. Providers of high-risk AI systems that are\
    \ subject to obligations regarding quality management systems or an equivalent function under relevant\
    \ sectoral Union law may include the aspects listed in paragraph 1 as part of the quality management\
    \ systems pursuant to that law.\n4. For providers that are financial institutions subject to requirements\
    \ regarding their internal governance, arrangements or processes under Union financial services law,\
    \ the obligation to put in place a quality management system, with the exception of paragraph 1, points\
    \ (g), (h) and (i) of this Article, shall be deemed to be fulfilled by complying with the rules on\
    \ internal governance arrangements or processes pursuant to the relevant Union financial services\
    \ law. To that end, any harmonised standards referred to in Article 40 shall be taken into account.\n"
  disposition: needs_review
