  start: 4549
  end: 5020
  sha256: a5e55c48336cff64cc8360d14d309f5cd1cd7679b58edcea8fd96e592d70ecd0
  text: '2. Where the relevant market surveillance authorities have sufficient reason to consider general-purpose
    AI systems that can be used directly by deployers for at least one purpose that is classified as high-risk
    pursuant to this Regulation to be non-compliant with the requirements laid down in this Regulation,
    they shall cooperate with the AI Office to carry out compliance evaluations, and shall inform the
    Board and other market surveillance authorities accordingly.

    '
