  sha256: 3ee3f6e4d58435efb95450b84b5670eb7349b973ed3c839f7526751b0fa5e002
  text: "1. The AI Office shall be exclusively competent for the supervision and enforcement of the obligations\
    \ under this Regulation in relation to the following AI systems:\n        (a) AI systems based on\
    \ general-purpose AI models where the model and the system are developed by the same provider, or\
    \ by providers forming part of the same undertaking as that provider, with the exception of:\n   \
    \             (i) AI systems related to products covered by the Union harmonisation legislation listed\
    \ in Annex I;\n                (ii) AI systems referred to in point 2 of Annex III;\n            \
    \    (iii) AI systems provided by law enforcement authorities, border management authorities and financial\
    \ institutions, insofar as those AI systems fall under Article 74(6); and\n                (iv) AI\
    \ systems referred to in point 8 of Annex III as regards the administration of justice;\n        (b)\
    \ AI systems that constitute or that are integrated into a very large online platform or very large\
    \ online search engine designated in accordance with Regulation (EU) 2022/2065.\n    The exclusive\
    \ competence referred to in the first subparagraph shall apply to the providers of those systems.\
    \ It shall apply to the deployers of those systems only when they are also the provider or form part\
    \ of the same undertaking as the provider.\n"
