- segment_id: AIA-TEXT-A014-FULL
  source:
    kind: article
    document: '14'
    act_version_date: '2026-07-27'
  start: 0
  end: 3210
  sha256: 842a4443f5d46d39a75734e40628506c498d35f2c649699fff06ef699a1220b0
  text: "Article 14\nHuman oversight\n\n1. High-risk AI systems shall be designed and developed in such\
    \ a way, including with appropriate human-machine interface tools, that they can be effectively overseen\
    \ by natural persons during the period in which they are in use.\n2. Human oversight shall aim to\
    \ prevent or minimise the risks to health, safety or fundamental rights that may emerge when a high-risk\
    \ AI system is used in accordance with its intended purpose or under conditions of reasonably foreseeable\
    \ misuse, in particular where such risks persist despite the application of other requirements set\
    \ out in this Section.\n3. The oversight measures shall be commensurate with the risks, level of autonomy\
    \ and context of use of the high-risk AI system, and shall be ensured through either one or both of\
    \ the following types of measures:\n        (a) measures identified and built, when technically feasible,\
    \ into the high-risk AI system by the provider before it is placed on the market or put into service;\n\
    \        (b) measures identified by the provider before placing the high-risk AI system on the market\
    \ or putting it into service and that are appropriate to be implemented by the deployer.\n4. For the\
    \ purpose of implementing paragraphs 1, 2 and 3, the high-risk AI system shall be provided to the\
    \ deployer in such a way that natural persons to whom human oversight is assigned are enabled, as\
    \ appropriate and proportionate:\n        (a) to properly understand the relevant capacities and limitations\
    \ of the high-risk AI system and be able to duly monitor its operation, including in view of detecting\
    \ and addressing anomalies, dysfunctions and unexpected performance;\n        (b) to remain aware\
    \ of the possible tendency of automatically relying or over-relying on the output produced by a high-risk\
    \ AI system (automation bias), in particular for high-risk AI systems used to provide information\
    \ or recommendations for decisions to be taken by natural persons;\n        (c) to correctly interpret\
    \ the high-risk AI system\u2019s output, taking into account, for example, the interpretation tools\
    \ and methods available;\n        (d) to decide, in any particular situation, not to use the high-risk\
    \ AI system or to otherwise disregard, override or reverse the output of the high-risk AI system;\n\
    \        (e) to intervene in the operation of the high-risk AI system or interrupt the system through\
    \ a \u2018stop\u2019 button or a similar procedure that allows the system to come to a halt in a safe\
    \ state.\n5. For high-risk AI systems referred to in point 1(a) of Annex III, the measures referred\
    \ to in paragraph 3 of this Article shall be such as to ensure that, in addition, no action or decision\
    \ is taken by the deployer on the basis of the identification resulting from the system unless that\
    \ identification has been separately verified and confirmed by at least two natural persons with the\
    \ necessary competence, training and authority.\n    The requirement for a separate verification by\
    \ at least two natural persons shall not apply to high-risk AI systems used for the purposes of law\
    \ enforcement, migration, border control or asylum, where Union or national law considers the application\
    \ of this requirement to be disproportionate.\n"
  disposition: needs_review
