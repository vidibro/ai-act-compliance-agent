- segment_id: AIA-TEXT-A099-FULL
  source:
    kind: article
    document: '99'
    act_version_date: '2026-07-27'
  start: 0
  end: 5831
  sha256: 1e9a217a1e36e6aadadfa9e8657ccd47ba31576f2290e8c3359b7021523471eb
  text: "Article 99\nPenalties\n\n1. In accordance with the terms and conditions laid down in this Regulation,\
    \ Member States shall lay down the rules on penalties and other enforcement measures, which may also\
    \ include administrative fines, warnings and non-monetary measures, applicable to any infringement\
    \ of this Regulation by operators, and shall take all measures necessary to ensure that they are properly\
    \ and effectively implemented, thereby taking into account the guidelines issued by the Commission\
    \ pursuant to Article 96. The penalties provided for shall be effective, proportionate and dissuasive.\
    \ The Member States shall take into account the interests of SMEs, including start-ups, and SMCs,\
    \ and their economic viability when imposing penalties.\n2. The Member States shall, without delay\
    \ and at the latest by the date of entry into application, notify the Commission of the rules on penalties\
    \ and of other enforcement measures referred to in paragraph 1, and shall notify it, without delay,\
    \ of any subsequent amendment to them.\n3. Non-compliance with the prohibition of the AI practices\
    \ referred to in Article 5 shall be subject to administrative fines of up to EUR 35000000 or, if the\
    \ offender is an undertaking, up to 7 % of its total worldwide annual turnover for the preceding financial\
    \ year, whichever is higher.\n4. Non-compliance with any of the following provisions related to operators\
    \ or notified bodies, other than those laid down in Articles 5, shall be subject to administrative\
    \ fines of up to EUR 15000000 or, if the offender is an undertaking, up to 3 % of its total worldwide\
    \ annual turnover for the preceding financial year, whichever is higher:\n        (a) obligations\
    \ of providers pursuant to Article 16;\n        (b) obligations of authorised representatives pursuant\
    \ to Article 22;\n        (c) obligations of importers pursuant to Article 23;\n        (d) obligations\
    \ of distributors pursuant to Article 24;\n        (da) obligations of providers and operators pursuant\
    \ to Article 25(2) and (4);\n        (e) obligations of deployers pursuant to Article 26;\n      \
    \  (f) requirements and obligations of notified bodies pursuant to Article 31, Article 33(1), (3)\
    \ and (4) or Article 34;\n        (g) transparency obligations for providers and deployers pursuant\
    \ to Article 50.\n5. The supply of incorrect, incomplete or misleading information to notified bodies\
    \ or national competent authorities in reply to a request shall be subject to administrative fines\
    \ of up to EUR 7500000 or, if the offender is an undertaking, up to 1 % of its total worldwide annual\
    \ turnover for the preceding financial year, whichever is higher.\n6. In the case of SMEs, including\
    \ start-ups, each fine referred to in this Article shall be up to the percentages or amount referred\
    \ to in paragraphs 3, 4 and 5, whichever thereof is lower.\n6a. In the case of SMCs, each fine referred\
    \ to in paragraphs 4 and 5 shall be up to the percentages or amount referred therein, whichever is\
    \ lower.\n7. When deciding whether to impose an administrative fine and when deciding on the amount\
    \ of the administrative fine in each individual case, all relevant circumstances of the specific situation\
    \ shall be taken into account and, as appropriate, regard shall be given to the following:\n     \
    \   (a) the nature, gravity and duration of the infringement and of its consequences, taking into\
    \ account the purpose of the AI system, as well as, where appropriate, the number of affected persons\
    \ and the level of damage suffered by them;\n        (b) whether administrative fines have already\
    \ been applied by other market surveillance authorities to the same operator for the same infringement;\n\
    \        (c) whether administrative fines have already been applied by other authorities to the same\
    \ operator for infringements of other Union or national law, when such infringements result from the\
    \ same activity or omission constituting a relevant infringement of this Regulation;\n        (d)\
    \ the size, the annual turnover and market share of the operator committing the infringement;\n  \
    \      (e) any other aggravating or mitigating factor applicable to the circumstances of the case,\
    \ such as financial benefits gained, or losses avoided, directly or indirectly, from the infringement;\n\
    \        (f) the degree of cooperation with the national competent authorities, in order to remedy\
    \ the infringement and mitigate the possible adverse effects of the infringement;\n        (g) the\
    \ degree of responsibility of the operator taking into account the technical and organisational measures\
    \ implemented by it;\n        (h) the manner in which the infringement became known to the national\
    \ competent authorities, in particular whether, and if so to what extent, the operator notified the\
    \ infringement;\n        (i) the intentional or negligent character of the infringement;\n       \
    \ (j) any action taken by the operator to mitigate the harm suffered by the affected persons.\n8.\
    \ Each Member State shall lay down rules on to what extent administrative fines may be imposed on\
    \ public authorities and bodies established in that Member State.\n9. Depending on the legal system\
    \ of the Member States, the rules on administrative fines may be applied in such a manner that the\
    \ fines are imposed by competent national courts or by other bodies, as applicable in those Member\
    \ States. The application of such rules in those Member States shall have an equivalent effect.\n\
    10. The exercise of powers under this Article shall be subject to appropriate procedural safeguards\
    \ in accordance with Union and national law, including effective judicial remedies and due process.\n\
    11. Member States shall, on an annual basis, report to the Commission about the administrative fines\
    \ they have issued during that year, in accordance with this Article, and about any related litigation\
    \ or judicial proceedings.\n"
