  sha256: 8c8e258405b5f525f2aaff690d66f1651bf7e5084dfb85d36f1deaf859f63e62
  text: 'Article 84

    Union AI testing support structures


    1. The Commission shall designate one or more Union AI testing support structures to perform the tasks
    listed under Article 21(6) of Regulation (EU) 2019/1020 in the area of AI.

    2. Without prejudice to the tasks referred to in paragraph 1, Union AI testing support structures
    shall also provide independent technical or scientific advice at the request of the Board, the Commission,
    or of market surveillance authorities.

    '
