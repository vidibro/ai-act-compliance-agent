  sha256: 23c10fe906705cc8ed1f26666e03ebfc457dcedc639a80864a5a7bfba9660555
  text: "ANNEX XII\nTransparency information referred to in Article 53(1), point (b) \u2014 technical\
    \ documentation for providers of general-purpose AI models to downstream providers that integrate\
    \ the model into their AI system\n\nThe information referred to in Article 53(1), point (b) shall\
    \ contain at least the following:\n1. A general description of the general-purpose AI model including:\n\
    \        (a) the tasks that the model is intended to perform and the type and nature of AI systems\
    \ into which it can be integrated;\n        (b) the acceptable use policies applicable;\n        (c)\
    \ the date of release and methods of distribution;\n        (d) how the model interacts, or can be\
    \ used to interact, with hardware or software that is not part of the model itself, where applicable;\n\
    \        (e) the versions of relevant software related to the use of the general-purpose AI model,\
    \ where applicable;\n        (f) the architecture and number of parameters;\n        (g) the modality\
    \ (e.g. text, image) and format of inputs and outputs;\n        (h) the licence for the model.\n2.\
    \ A description of the elements of the model and of the process for its development, including:\n\
    \        (a) the technical means (e.g. instructions for use, infrastructure, tools) required for the\
    \ general-purpose AI model to be integrated into AI systems;\n        (b) the modality (e.g. text,\
    \ image, etc.) and format of the inputs and outputs and their maximum size (e.g. context window length,\
    \ etc.);\n        (c) information on the data used for training, testing and validation, where applicable,\
    \ including the type and provenance of data and curation methodologies.\n"
