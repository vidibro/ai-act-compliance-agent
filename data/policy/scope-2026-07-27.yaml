  # whole, so the judge reads this list. Ruled per item all the same, because a shared verdict on
  # "is there a technical file" says nothing about whether the file holds point 2(g)'s validation
  # metrics. Several items point at an Article a rule already checks in its own right; where they
  # do, the item says which, so a reader is not told the same thing twice.
  IV:
    1: RULE AIA-HR-A11 — general description of the system, points (a)-(h).
    2: >-
      RULE AIA-HR-A11 — detailed description of the system and its development, points (a)-(h):
      methods and steps, design specifications, architecture, data requirements, the Art. 14 human
      oversight assessment, pre-determined changes, validation and testing procedures, cybersecurity.
    3: RULE AIA-HR-A11 — monitoring, functioning and control, including accuracy and foreseeable risks.
    4: RULE AIA-HR-A11 — appropriateness of the performance metrics for this system.
    5: RULE AIA-HR-A11 — detailed description of the Art. 9 risk management system.
    6: RULE AIA-HR-A11 — relevant changes made through the system's lifecycle.
    7: RULE AIA-HR-A11 — harmonised standards applied, or the solutions adopted where none were.
    8: RULE AIA-HR-A11 — a copy of the Art. 47 EU declaration of conformity, which AIA-PO-A47 checks.
    9: >-
      RULE AIA-HR-A11 — the Art. 72 post-market monitoring system and plan. Art. 72(3) is what
      requires the plan to sit here, and AIA-PO-A72 carries it as a qualifier; this item is where
      the plan must live.
# ANNEXES A RULE SHOULD REACH AND DOES NOT. Same split, and for the same reason: an annex the tool
# ought to read is not an annex the tool has decided against. Both of these are consequences of a
# rule citing too narrowly, so each is emptied by fixing that rule rather than by writing an annex
# rule of its own.
  # ANNEX V IS THE DECLARATION OF CONFORMITY'S CONTENT, and AIA-PO-A47-2 is the rule for it —
  # Art. 47(2) requires the declaration to state conformity with Section 2 and to carry this
  # information. That rule is document_verifiable false, as the declaration is an administrative
  # artefact rather than part of the technical file, so no judge is shown these items; what the
  # rule does is tell the reader what has to be on the page and what is most often missing.
  # Every item is document-verifiable in itself: the declaration is a single page, and this is it.
  V:
    1: >-
      RULE AIA-PO-A47-2 — The system's name and type, and any reference allowing identification
      and traceability.
    2: >-
      RULE AIA-PO-A47-2 — The name and address of the provider or, where applicable, of the
      authorised representative.
    3: >-
      RULE AIA-PO-A47-2 — A statement that the declaration is issued under the SOLE RESPONSIBILITY
      of the provider.
    4: >-
      RULE AIA-PO-A47-2 — A statement that the system conforms with this Regulation and with any
      other Union law requiring a declaration of conformity. The operative sentence of the
      document.
    5: >-
      RULE AIA-PO-A47-2 — Where personal data is processed, a statement of compliance with
      Regulations (EU) 2016/679 and 2018/1725 and Directive (EU) 2016/680. Absent from most
      templates written for this Regulation alone, and required whenever the system touches
      personal data.
    6: >-
      RULE AIA-PO-A47-2 — References to the harmonised standards or common specifications
      conformity is declared against.
    7: >-
      RULE AIA-PO-A47-2 — Where applicable, the notified body's name and identification number,
      the procedure performed, and the certificate issued. Populated only on the Annex VII route.
    8: >-
      RULE AIA-PO-A47-2 — Place and date of issue, the signatory's name and function, on whose
      behalf they signed, and a SIGNATURE. An unsigned declaration does not satisfy Art. 47.

  # Annex VI is the internal-control conformity assessment route, cited by AIA-PO-A43-2. Its four
  # points are the procedure itself, performed by the provider without a notified body.
  VI:
    1: RULE AIA-PO-A43-2 — the procedure is points 2, 3 and 4. Definitional.
    2: RULE AIA-PO-A43-2 — verify the Art. 17 quality management system, which AIA-PO-A17 checks.
    3: RULE AIA-PO-A43-2 — examine the technical documentation against the Section 2 requirements.
    4: >-
      RULE AIA-PO-A43-2 — verify that design, development and Art. 72 post-market monitoring are
      consistent with the technical documentation.
  # ANNEX VII is the notified-body conformity assessment route Art. 43(1) offers for Annex III
  # point 1, and AIA-PO-A43-1B is the rule for it. AIA-PO-A43-1 carries the CHOICE between the
  # two branches and names neither annex, so the branches are ruled where they are written:
  # Annex VI under AIA-PO-A43-2 for the internal-control route, Annex VII here.
  #
  # Neither rule is document_verifiable, so no judge reads either annex — what they do is tell a
  # provider on each route what the route consists of. For Annex VII that is two applications, a
  # written declaration of exclusivity on each, two grants of access, and a duty to notify changes
  # that runs for as long as the certificate stands.
  VII:
    1: >-
      RULE AIA-PO-A43-1B — the procedure is points 2 to 5. Definitional, and it is what the rule
      cites.
    2: >-
      RULE AIA-PO-A43-1B — overview: the Art. 17 quality management system is examined under point
      3 and kept under surveillance under point 5; the technical documentation is examined under
      point 4.
    3: >-
      RULE AIA-PO-A43-1B — QUALITY MANAGEMENT SYSTEM. 3.1 lists what the provider's application
      must contain, points (a)-(f) — the systems covered, the technical documentation for each,
      the Art. 17 documentation, the procedures keeping the system adequate, and a written
      declaration that the same application is with no other notified body. 3.3 has the provider
      CONTINUE to implement and maintain the approved system, and 3.4 has any intended change
      brought to the notified body.
    4: >-
      RULE AIA-PO-A43-1B — CONTROL OF THE TECHNICAL DOCUMENTATION. 4.2's application must contain
      the provider's name, a written declaration of exclusivity, and the Annex IV documentation;
      4.3 has the notified body granted FULL ACCESS to the training, validation and testing data
      sets, through an API where appropriate; 4.5 adds access to the trained models and their
      parameters where other means are exhausted; and 4.7 has the provider notify any change that
      could affect compliance. The access duty is Art. 74(12) on the notified-body route.
    5: >-
      RULE AIA-PO-A43-1B — SURVEILLANCE. 5.2 has the provider allow the notified body onto the
      premises where design, development and testing happen and share all necessary information;
      5.3 has the body audit periodically. A continuing duty for as long as the certificate
      stands.

  # ANNEX VIII IS THE CONTENT OF THE ART. 49 REGISTRATIONS, and Arts. 71(2) and (3) are what put it
  # there: AIA-PO-A71-2 for the provider's Sections A and B, AIA-DP-A71-3 for the public-authority
  # deployer's Section C. AIA-PO-A49, AIA-NHR-A06-4 and AIA-DP-A49-3 carry the duty to register at
  # all — their subject is Art. 49(1), 6(4) and 49(3), and the Annex they cite is III, the area
  # gate — so the split between registering and what is entered runs along the Article boundary.
  #
  # NO JUDGE SEES ANY OF THE 27 ITEMS, and no rule here changes that. Every rule citing this Annex
  # is document_verifiable false, so the loader fills annex_context and no prompt is ever built;
  # AIA-ALL-A49-4, for Art. 49(4), is the same. Registration is an act against a registry, not a
  # property of a file, so what these rules give a reader is the list to check themselves.
  VIII:
    A/1: >-
      RULE AIA-PO-A71-2 — the provider's name, address and contact details. Registry
      identification.
    A/2: >-
      RULE AIA-PO-A71-2 — details of a person submitting on the provider's behalf. Registry
      identification.
    A/3: >-
      RULE AIA-PO-A71-2 — the authorised representative's details where applicable. The
      appointment itself is Art. 22, cited at 22(1) by AIA-PO-A22.
    A/4: >-
      RULE AIA-PO-A71-2 — trade name and any reference allowing identification and traceability.
    A/5: >-
      RULE AIA-PO-A71-2 — the intended purpose, components and functions. Also Annex IV(1)(a).
    A/6: >-
      RULE AIA-PO-A71-2 — a concise description of the data, inputs and operating logic.
    A/7: >-
      RULE AIA-PO-A71-2 — the system's status; on the market, withdrawn, or recalled. Registry
      state.
    A/8: >-
      RULE AIA-PO-A71-2 — type, number and expiry of the notified body certificate, where
      applicable. Exists only on the Annex VII route, which AIA-PO-A43-1 covers.
    A/9: >-
      RULE AIA-PO-A71-2 — a scanned copy of that certificate, where applicable.
    A/10: >-
      RULE AIA-PO-A71-2 — the Member States where the system has been placed on the market.
    A/11: >-
      RULE AIA-PO-A71-2 — a copy of the Art. 47 EU declaration of conformity, which AIA-PO-A47
      checks.
    A/12: >-
      RULE AIA-PO-A71-2 — electronic instructions for use, withheld for law enforcement,
      migration, asylum and border control systems. The instructions themselves are Art. 13,
      checked by AIA-HR-A13.
    A/13: >-
      RULE AIA-PO-A71-2 — a URL for additional information, expressly OPTIONAL. Not a duty at all.
    B/1: >-
      RULE AIA-PO-A71-2 — the provider's name, address and contact details.
    B/2: >-
      RULE AIA-PO-A71-2 — details of a person submitting on the provider's behalf.
    B/3: >-
      RULE AIA-PO-A71-2 — the authorised representative's details, where applicable.
    B/4: >-
      RULE AIA-PO-A71-2 — trade name and identification reference.
    B/5: >-
      RULE AIA-PO-A71-2 — a description of the intended purpose.
    B/6: >-
      RULE AIA-PO-A71-2 — WHICH Art. 6(3) condition the system relies on. The substance of the
      not-high-risk claim, and what Art. 80(1) puts an authority onto.
    B/7: >-
      RULE AIA-PO-A71-2 — a short summary of the grounds for the not-high-risk conclusion. The
      Art. 6(4) assessment, written down; misstating it attracts the Art. 80(7) fine.
    B/8: >-
      RULE AIA-PO-A71-2 — the system's status. Registry state.
    B/9: >-
      RULE AIA-PO-A71-2 — the Member States where it has been placed on the market.
    C/1: >-
      RULE AIA-DP-A71-3 — the deployer's name, address and contact details.
    C/2: >-
      RULE AIA-DP-A71-3 — details of the person submitting on the deployer's behalf.
    C/3: >-
      RULE AIA-DP-A71-3 — the URL of the provider's own entry for the system. Links the two
      entries.
    C/4: >-
      RULE AIA-DP-A71-3 — a summary of the Art. 27 FUNDAMENTAL RIGHTS IMPACT ASSESSMENT findings.
      The assessment is checked by AIA-DP-A27; this item is where its summary must be lodged, and
      Art. 27(3) — notifying the authority — is cited by AIA-DP-A27-3.
    C/5: >-
      RULE AIA-DP-A71-3 — a summary of the data protection impact assessment under Art. 35 GDPR or
      Art. 27 of Directive (EU) 2016/680, as Art. 26(9) specifies. Settled by data protection law
      this tool does not carry; the item is the registration of its summary.

  # Annex IX is what Art. 60(4)(c) has a provider register before real-world testing. Out of
  # scope with the Art. 60 route itself, and ruled per item so the scope limit names what it
  # costs.
  IX:
    1: The Union-wide unique single identification number of the testing. Art. 60 route, out of scope.
    2: >-
      Name and contact details of the provider or prospective provider and of the deployers taking
      part. Art. 60 route.
    3: A brief description of the system, its intended purpose and identifying information. Art. 60 route.
    4: >-
      A summary of the main characteristics of the REAL-WORLD TESTING PLAN — the document
      Art. 60(4)(a) has approved before testing begins. Art. 60 route.
    5: Information on suspension or termination of the testing, per Art. 60(8). Art. 60 route.
  # Annex X is a reference list of instruments, not a set of requirements. It is what Art. 111(1)
  # means by a large-scale IT system, and what Annex III(7)'s migration area points at.
  X:
    1: Schengen Information System — Regulations (EU) 2018/1860, 2018/1861 and 2018/1862. A reference.
    2: Visa Information System — Regulations (EU) 2021/1133 and 2021/1134. A reference.
    3: Eurodac — Regulation (EU) 2024/1358. A reference.
    4: Entry/Exit System — Regulation (EU) 2017/2226. A reference.
    5: ETIAS — Regulations (EU) 2018/1240 and 2018/1241. A reference.
    6: ECRIS-TCN — Regulation (EU) 2019/816. A reference.
    7: Interoperability — Regulations (EU) 2019/817 and 2019/818. A reference.
  # Annexes XI, XII and XIII are Chapter V content: the technical documentation Art. 53(1)(a)
  # requires, the downstream information Art. 53(1)(b) requires, and the criteria Art. 51(1)(b) has
  # the Commission weigh. Annexes XI and XII are now cited — AIA-GP-A53-1A carries XI and
  # AIA-GP-A53-1B carries XII, and AIA-GPAR-A54-3 carries XI again for the ten-year keeping duty.
  # No judge sees either, because those rules are document_verifiable false for the reason the
  # Chapter V header gives; what the rules do is state item by item what the documentation must
  # hold. Annex XIII is the Commission's designation criteria and binds no operator.
  XI:
    1/1: >-
      RULE AIA-GP-A53-1A — Section 1(1), general description of the model, points (a)-(f): tasks,
      acceptable use policies, release date and distribution, architecture and parameter count,
      modality, licence.
    1/2: >-
      RULE AIA-GP-A53-1A — Section 1(2), the model's elements and development, points (a)-(e):
      integration means, design specifications and training methodology, training data provenance
      and curation, COMPUTATIONAL RESOURCES in FLOP, and energy consumption. Point (d) is the one
      place a document could answer Art. 51(2)'s 10^25 threshold — the same figure Art. 52(1)
      turns on, and the reason a model card that states its training compute answers two questions
      at once.
    2/1: >-
      RULE AIA-GP-A53-1A — Section 2(1), for systemic-risk models: evaluation strategies and
      results, including adversarial testing. The documentary form of the Art. 55(1)(a) duty, which
      AIA-GP-A55-1A carries as an obligation in its own right.
    2/2: >-
      RULE AIA-GP-A53-1A — Section 2(2), measures to assess and mitigate systemic risks at Union
      level. The documentary form of Art. 55(1)(b), carried as a duty by AIA-GP-A55-1B.
    2/3: >-
      RULE AIA-GP-A53-1A — Section 2(3), a detailed description of the system architecture and how
      software components integrate. Part of the same systemic-risk documentation.
  XII:
    1: >-
      RULE AIA-GP-A53-1B — general description for downstream providers, points (a)-(h), and the
      information a provider building an Annex III system on someone else's model needs to meet
      Arts. 9 to 15 at all.
    2: >-
      RULE AIA-GP-A53-1B — elements of the model and its development, points (a)-(c): integration
      means, input and output modality and maximum size, and training data provenance.
  XIII:
    a: >-
      Number of parameters. One of the criteria the COMMISSION weighs under Art. 51(1)(b); not a
      duty of anyone, and no node asks it — the systemic-risk line is unasked, recorded at Art. 51(1).
    b: Quality or size of the data set, measured through tokens. A Commission criterion.
    c: Amount of computation used for training, in FLOP or proxies for it. A Commission criterion.
    d: Input and output modalities and state-of-the-art thresholds. A Commission criterion.
    e: Benchmarks and evaluations of capabilities, autonomy and scalability. A Commission criterion.
    f: >-
      High impact on the internal market, PRESUMED at 10 000 registered Union business users. A
      Commission criterion, and the one limb a business could count for itself.
    g: Number of registered end-users. A Commission criterion.
  # Annex XIV was ADDED by this consolidation, and it appeared in the store unnoticed — the reason
  # this section exists at all. It scopes a notified body's designation under Arts. 29 and 30.
  XIV:
    1: >-
      Introduction: only designated conformity assessment bodies may act, and the codes below scope
      what each is designated for. Addressed to notifying authorities and the bodies themselves.
    2: >-
      The codes and categories for AI systems subject to Annex I and Annex III. A taxonomy for
      designation, not a classification the cascade uses — the tier is decided by Arts. 6 and 5.
    3: >-
      AI technology-specific codes: symbolic AI, machine learning, and the rest. Describes what a
      body is competent to assess, not what a system owes.
    4: >-
      Conformity assessment bodies use these lists when applying for designation. The applicant
      body's duty, and conformity assessment bodies are out of scope by role.

# EMPTY, and the mechanism stays. An entry here means an annex item carries content a party owes
# and no report mentions it — a stronger claim than a dismissal, and the reason this section is
# separate from annex_rulings rather than folded into it.
annexes_awaiting_rules: {}
