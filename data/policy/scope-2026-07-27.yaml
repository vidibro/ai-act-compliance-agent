  # --- Chapter V — general-purpose AI models ---------------------------------------------------
  # Chapter V is a SEPARATE TRACK, not a lesser one, and it has applied since 2 August 2025 —
  # earlier than every rule in spec.yaml. The cascade detects a general-purpose AI model at
  # Art. 3(63) and `RiskClass.GPAI_MODEL` selects the AIA-GP-* ruleset, which carries every duty
  # this chapter puts on a provider or its authorised representative.
  #
  # Read per paragraph, the chapter separates into three things a single ruling cannot hold apart:
  # the operator duties, which are rules; the two GATES that decide who owes what — Art. 51's
  # systemic-risk line and the Art. 53(2)/54(6) open-source carve-out, each answered by a cascade
  # node; and the AI Office and Commission machinery of Arts. 52 and 56, which binds nobody this
  # tool reports for.
  #
  # THE GATES ARE ANSWERED AND NOTHING IS WITHHELD ON THEM. `systemic_risk` and
  # `open_source_release` read a STATED claim and answer `not_stated` rather than estimating, and
  # their answers reach the reader as `ComplianceReport.chapter_v_gate_note` — which side of each
  # line the document falls on. Every Chapter V rule is still selected for every model and still
  # carries its condition, because a model card mis-read on a compute figure or on one licence
  # limb would otherwise clear four obligations, and a clearance is the error direction this
  # ruleset does not accept.
  #
  # NOTHING IN THE CHAPTER IS JUDGED, and for Art. 53(1)(a), (b) and (d) that is not a statement
  # about the artefacts — those are documents. It is that the gates are read from the same
  # documentation a judge would read, so a GAP returned against a provider whose card simply did
  # not mention its licence would be manufactured by the tool rather than found. There is no golden
  # set for this chapter to measure that against.
  51:
    1: >-
      CASCADE systemic_risk — THE SYSTEMIC-RISK LINE, and the whole of Art. 55 rests on it. The
      node READS A STATED CLAIM and refuses to estimate: an Art. 51(1)(b) designation or an
      Art. 52(1) notification answers `designated`, a stated compute figure answers on the
      Art. 51(2) threshold, and anything else answers `not_stated`. It withholds no obligation —
      every Art. 55 rule is selected for every model and carries the condition — so what the answer
      decides is what the report tells the reader about their own document.
    2: >-
      CASCADE systemic_risk — presumption of high impact capabilities above 10^25 cumulative
      training FLOP. The one limb a document can answer, and only where the model card states the
      training compute at all; `SystemicRisk.BELOW_THRESHOLD` is what a stated figure under the
      threshold records, and it rules out this presumption and not Art. 51(1)(b).
    3: Commission delegated power to amend the thresholds and supplement the benchmarks. Institutional.
  52:
    1: >-
      RULE AIA-GP-A52-1 — NOTIFY THE COMMISSION WITHOUT DELAY and within two weeks of meeting the
      Art. 51(1)(a) condition, or of learning it will be met, with the information demonstrating
      it. The only hard deadline in Chapter V, and missing it does not avoid the designation: the
      Commission may designate an un-notified model itself.
    2: >-
      The provider MAY argue that its model, though over the threshold, presents no systemic risk.
      An option exercised with the 52(1) notification, not a duty owed independently of it.
    3: The Commission rejects insufficiently substantiated arguments. The Commission's decision.
    4: >-
      Commission power to designate a model as presenting systemic risk ex officio or on a scientific
      panel alert, plus the delegated power to amend Annex XIII. Institutional.
    5: >-
      A designated provider MAY request reassessment, at the earliest six months after the decision.
      A right with a waiting period, not a duty.
    6: >-
      THE COMMISSION PUBLISHES THE LIST of GPAI models with systemic risk. The Commission's duty, and
      the authoritative answer to 51(1) once it exists. Named in the GPAI handover text so a reader
      knows where the line is actually drawn rather than inferring it from a FLOP count.
  53:
    1: >-
      RULE AIA-GP-A53-1A AIA-GP-A53-1B AIA-GP-A53-1C AIA-GP-A53-1D — the four core duties of a
      general-purpose model provider, one rule each because they do not share a fate: (a) Annex XI
      technical documentation and (b) the Annex XII information for downstream providers are lifted
      by the 53(2) open-source carve-out, while (c) the copyright policy and (d) the public
      training-content summary are owed by every provider whatever its licence.
    2: >-
      CASCADE open_source_release — OPEN-SOURCE CARVE-OUT from 53(1)(a) and (b): a free and
      open-source licence allowing access, use, modification and distribution, AND public
      parameters, architecture information and usage information. A conjunction of four limbs, and
      DISAPPLIED for a systemic-risk model — so the node is read with `systemic_risk` and never
      alone. A limit on a duty rather than a duty, and it withholds nothing: AIA-GP-A53-1A and -1B
      are selected whatever it answers and carry the carve-out as an activation_condition, because
      a model card mis-read on any one limb would otherwise clear two obligations.
    3: >-
      Cooperate as necessary with the Commission and national competent authorities. Conduct during
      an authority's exercise of its powers, with no document that evidences it in advance — the same
      treatment Art. 21(3) and Art. 74 get on the high-risk track.
    4: >-
      RULE AIA-GP-A53-4 — a provider adhering to NEITHER an approved code of practice NOR a
      European harmonised standard shall demonstrate alternative adequate means of compliance for
      the Commission's assessment. The first two sentences are a permission and a presumption; the
      third is the duty, and it is the Chapter V twin of Art. 41(5).
    5: >-
      Commission delegated power to detail measurement and calculation methodologies for Annex XI
      points 2(d) and (e). Institutional.
    6: Commission delegated power to amend Annexes XI and XII. Institutional.
    7: Information obtained under this Article is treated under Art. 78. The receiving body's duty.
  54:
    1: >-
      RULE AIA-GP-A54-1 — a THIRD-COUNTRY provider appoints an authorised representative
      established in the Union, by written mandate, BEFORE placing the model on the Union market.
      The Chapter V twin of Art. 22(1), and mis-attributable the same way: the duty is the
