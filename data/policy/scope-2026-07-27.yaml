    B/15: CASCADE annex_i — Regulation (EU) No 167/2013, agricultural and forestry vehicles. Section B.
    B/16: CASCADE annex_i — Directive 2014/90/EU, marine equipment. Section B.
    B/17: CASCADE annex_i — Directive (EU) 2016/797, rail system interoperability. Section B.
    B/18: CASCADE annex_i — Regulation (EU) 2018/858, motor vehicle approval. Section B.
