      Where the non-compliance is attributed to a shortcoming in a harmonised standard or common
      specification, the Art. 41 procedure follows. Institutional.
  82:
    1: >-
      Authority procedure for a COMPLIANT high-risk system that nonetheless presents a risk to health,
