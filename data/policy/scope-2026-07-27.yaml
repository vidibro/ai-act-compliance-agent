  # same way as Annex I. The area also gates the rules the Act narrows — Art. 14(5) biometrics,
  # Art. 26(10) law enforcement, Art. 49's exception for point 2.
  III:
    1: CASCADE annex_iii — biometrics; remote identification, categorisation, emotion recognition.
    2: >-
      CASCADE annex_iii — critical infrastructure: safety components in digital infrastructure,
      traffic, and the supply of water, gas, heating and electricity. The point Art. 49(1) and (3)
      except from registration, and the one Art. 43(6) may move to the Annex VII route.
      THE ONE AREA THE NODE DECIDES ON A DIFFERENT TEST, and the node says so in terms. The other
      seven points each name natural persons, so the question turns on whether the purpose acts on
      a person or their application. Point 2's subject is a pipe, a road or a grid, so a signal
      controller satisfies that test's OUT limb word for word and would be reported `minimal` —
      one obligation in the whole report, for a system whose failure kills people. It is decided
      instead on Art. 3(14): a safety function, or a failure that endangers health and safety.
      The person test does reach every other area correctly, which is why this one is carved out
      rather than the test loosened.
    3: CASCADE annex_iii — education and vocational training; admission, evaluation, proctoring.
    4: >-
