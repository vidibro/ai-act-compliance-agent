# Coverage ledger — Regulation (EU) 2024/1689, act version 2026-07-27.
#
# THIS VERSION is the consolidated text as amended by Regulation (EU) 2026/1744 of 8 July 2026
# (the Digital Omnibus on AI), applicable from 27 July 2026. It inserts six articles — 4a, 60a and
# 75a to 75d — and rewrites Art. 2(2)'s Section B list.
#
# WHY THIS FILE EXISTS
# Every provision of the stored text must be accounted for, and `src/aiact/coverage.py` is what
# enforces it: each address resolves to a rule that checks it, a cascade node that asks it, a reason
# it is not owed, or a declared debt. Nothing may be merely unexamined.
#
# A newly legislated obligation would resolve to none of those — the partition fails, and CI blocks
# until a human rules on it. The guarantee is not "we detect new obligations automatically"; it is
# "an obligation cannot pass unnoticed". For a compliance tool a false PASS is the worst outcome.
#
# ENTRIES ARE PER PROVISION, not per article. A reason written about a whole article applies to
# every paragraph inside it and says nothing about any of them, and duties have been found sitting
# under exactly that — Art. 8(2), Art. 41(5), Art. 71(2). `test_the_blanket_only_shrinks` counts
# what is still dismissed that way, and the target is zero.
#
# SCOPE: obligations of every role the Act binds — provider, deployer, importer, distributor and
# authorised representative — for a HIGH-RISK AI system, plus Art. 4, which binds provider and
# deployer at every governed tier. The general-purpose AI model regime is deliberately excluded,
# and each exclusion is recorded below rather than assumed.
#
# The ruleset was authored against the EMPLOYMENT area (Annex III(4)) and most of it generalises
# untouched: Arts. 9-15 and 16-21 bind every high-risk system whatever the area. Where the law is
# area-specific the RULE says so — `applies_to_annex_iii_area` and `applies_to_route`. A reason in
# this file that rests on "employment does X" is suspect for the same reason.

act_version_date: 2026-07-27

# --- ROLES ----------------------------------------------------------------------------------
# Same partition as the articles below, over ActorRole: a role either has rules in spec.yaml or is
# listed here with a reason. A test enforces it, so a role added to the enum — or one that loses
# its last rule — fails CI instead of quietly disappearing from every report.
#
# Kept HERE rather than reported at runtime. Which roles this tool covers is a fact about the
# ruleset, settled before shipping; narrating it to a reader in every report would push a
# development-time gap into their output.
roles_out_of_scope:
  product_manufacturer: >-
    Art. 25(3) gives the product manufacturer no duty set of its own — where a high-risk AI system
    is placed on the market with their product under their name, it makes them THE PROVIDER, owing
    Art. 16 whole. So there is no ruleset to write, and writing one would be wrong: it would state
    as a separate obligation set the very thing the Article says is the provider's. The role is
    reached instead by the gap graph's `roles` node (src/aiact/gap/roles.py), which asks at high
    risk whether Art. 25(1)(a)-(c) or 25(3) has moved the provider's duties onto another party, and
    answers with the provider ruleset this spec already holds.

# --- ARTICLES ---------------------------------------------------------------------------------
# HOW EACH PROVISION IS ACCOUNTED FOR — not only the ones the tool ignores. An entry says which of
# the four it is, and `src/aiact/coverage.py` reads that back out:
#
#   RULE <rule_id>      CHECKED. The division sits inside an Article a rule cites WHOLE, so the
#                       judge reads it — under a verdict shared with the Article's other paragraphs,
#                       which is why it is written out per paragraph rather than left implied.
#   CASCADE <node_id>   ASKED. The classification graph decides it, at that node. The node must
#                       exist: "the cascade handles it" is only an answer if something reads it.
#   anything else       NOT OWED, for the reason given.
#
# A division a RULE cites precisely — Art. 43(2), Art. 16(b) — needs no entry at all: the citation
# in spec.yaml is the ruling, and the partition reads it from there.
#
# TWO ENTRY SHAPES, and the difference between them is the subject of this file:
#
#   47:  a string   — one reason covering the WHOLE Article, and therefore every paragraph in it
#   48:  a mapping  — a ruling per DIVISION, keyed by paragraph (1, 1a, 2 …), by numbered point for
#                     Art. 3's definitions, or by lettered point for a chapeau-plus-list Article
#
# A STRING IS A BLANKET. It answers "is this Article accounted for?" without anyone having read the
# paragraphs inside it, which is how Art. 16(b), (k) and (l) sat unmodelled under a reason that was
# true of the article's other nine points. Any Article may be itemised, cited or not; the string
# form is what remains to be worked through.
article_rulings:
  # --- Chapter I — General provisions ---------------------------------------------------------
  1:
    1: Statement of the Regulation's purpose. Declaratory; creates no obligation.
    2: A table of what the Regulation lays down, points (a)-(f). Declaratory.
  2:
    1: >-
      CASCADE territorial — who the Regulation reaches, points (a)-(g). The positive limb, answered
      into TerritorialLink; a system it does not reach exits at RiskClass.OUT_OF_SCOPE.
    2: >-
      Section B Annex I systems are governed by "Article 6(1), Article 60a and Articles 102 to 112"
      only. Not an exclusion but a LIMIT, consumed by AnnexIProduct.chapter_iii_applies and the
      Section B branch of gap.rules.select_rules. The list is EXHAUSTIVE and is quoted in the
      report's Section B note, so the two have to be checked against each other whenever either
      moves — a note naming the wrong articles tells a provider they owe the wrong thing.
    3: CASCADE scope — military, defence and national security. ScopeExclusion.MILITARY_DEFENCE_NATIONAL_SECURITY.
    4: CASCADE scope — third-country authorities in law enforcement cooperation. THIRD_COUNTRY_LAW_ENFORCEMENT_COOPERATION.
    5: Preserves the Digital Services Act's liability rules for intermediary providers. A saving clause.
    6: CASCADE scope — sole purpose of scientific research and development. SCIENTIFIC_RESEARCH.
    7: >-
      Union data protection law continues to apply. A saving clause, and expressly without prejudice
      to Arts. 4a and 59.
    8: CASCADE scope — research, testing or development prior to placing on the market. PRE_MARKET_DEVELOPMENT.
    9: Consumer protection and product safety law unaffected. A saving clause.
    10: CASCADE scope — a deployer using AI in a purely personal non-professional activity. PERSONAL_NON_PROFESSIONAL.
    11: >-
      Member States may keep or introduce law more favourable to workers. A power of the Member
      State; it can only add to what a deployer owes, never subtract, so no obligation is missed.
    12: CASCADE scope — free and open-source licences, unless high-risk or caught by Art. 5 or 50. FREE_OPEN_SOURCE.
    13: >-
      NEW in this version. Arts. 9-15 and 17-25 MAY BE LIMITED for an Art. 6(1) system where Section
      A Annex I law gives equivalent or higher protection. NOT OPERATIVE: it works only through
      delegated acts the Commission must adopt by 2 August 2027. When they land they will narrow
      obligations this ruleset raises, which makes this the entry to revisit first.
  3:
    1: CASCADE is_ai — the 'AI system' definition, Art. 3(1). The cascade's first question.
    2: "'risk'. Definitional; used inside Arts. 9 and 79, both handled where they are cited."
    3: "'provider'. ActorRole.PROVIDER, the duty-holder most rules name."
    4: "'deployer'. ActorRole.DEPLOYER, and its personal-use carve-out feeds Art. 2(10)."
    5: "'authorised representative'. ActorRole.AUTHORISED_REPRESENTATIVE, duties at Art. 22."
    6: "'importer'. ActorRole.IMPORTER, duties at Art. 23."
    7: "'distributor'. ActorRole.DISTRIBUTOR, duties at Art. 24."
    8: "'operator'. The collective term; this tool reports for each role separately instead."
    9: "'placing on the market'. Fixes when duties bite; read by the scope and territorial nodes."
    10: "'making available on the market'. Definitional, feeding Art. 3(9)."
    11: "'putting into service'. The other trigger, alongside placing on the market."
    12: "'intended purpose'. Why classification runs per use case rather than per product."
    13: "'reasonably foreseeable misuse'. Feeds Arts. 9 and 14, both cited whole."
    14: CASCADE annex_i — 'safety component', the term Art. 6(1)(a) turns on.
    15: "'instructions for use'. Feeds Art. 13(3), cited whole as AIA-HR-A13."
    16: "'recall of an AI system'. Feeds Art. 20, cited at 20(1)."
    17: "'withdrawal of an AI system'. Feeds Art. 20, cited at 20(1)."
    18: "'performance of an AI system'. Feeds Art. 15, cited whole."
    19: "'notifying authority'. Chapter III Section 4, out of scope whole."
    20: "'conformity assessment'. Feeds Art. 43, cited at 43(1)-(3)."
    21: "'conformity assessment body'. Section 4 actor, out of scope."
    22: "'notified body'. Section 4 actor, out of scope."
    23: "'substantial modification'. Feeds Art. 25(1)(b) and Art. 43(4); the second awaits a rule."
    24: "'CE marking'. Feeds Art. 48, cited at 48(3)."
    25: "'post-market monitoring system'. Feeds Art. 72, cited at 72(1)."
    26: "'market surveillance authority'. An authority this tool reports duties toward, never for."
    27: "'harmonised standard'. Feeds Art. 40, out of scope as an option."
    28: "'common specification'. Feeds Art. 41; 41(5) awaits a rule."
    29: "'training data'. Feeds Art. 10, cited whole."
    30: "'validation data'. Feeds Art. 10, cited whole."
    31: "'validation data set'. Feeds Art. 10, cited whole."
    32: "'testing data'. Feeds Art. 10, cited whole."
    33: "'input data'. Feeds Arts. 10 and 26(4), both cited whole."
    34: "'biometric data'. Feeds Annex III(1) and Art. 5(1)(g)."
    35: CASCADE annex_iii — 'biometric identification', the limb that stays inside Annex III(1)(a).
    36: CASCADE annex_iii — 'biometric verification', the carve-out the Annex writes into point 1(a).
    37: "'special categories of personal data'. Feeds Art. 4a, a permission."
    38: "'sensitive operational data'. Feeds law-enforcement carve-outs in Arts. 26(5) and 5(4)."
    39: CASCADE transparency — 'emotion recognition system', for Art. 50(3) and Art. 5(1)(f).
    40: CASCADE transparency — 'biometric categorisation system', for Art. 50(3) and Art. 5(1)(g).
    41: CASCADE prohibited — 'remote biometric identification system', the genus for Art. 5(1)(h).
    42: CASCADE prohibited — 'real-time' RBI, the species Art. 5(1)(h) bans.
    43: "'post-remote biometric identification system'. Feeds Art. 26(10), cited whole."
    44: CASCADE prohibited — 'publicly accessible space', a condition of the Art. 5(1)(h) ban.
    45: "'law enforcement authority'. Feeds the law-enforcement carve-outs throughout."
    46: "'law enforcement'. Feeds Annex III(6) and the Art. 50 carve-outs."
    47: "'AI Office'. An EU body; its powers are Arts. 75a-75d, out of scope."
    48: "'national competent authority'. An authority this tool reports duties toward."
    49: "'serious incident'. Feeds Art. 73, whose deadlines await a rule."
    50: "'personal data'. Borrowed from Regulation (EU) 2016/679."
    51: "'non-personal data'. Definitional; used in Art. 10."
    52: CASCADE profiling — 'profiling', the Art. 6(3) carve-back this tool asks directly.
    53: "'real-world testing plan'. Feeds Art. 60, an optional route out of scope."
    54: "'sandbox plan'. Feeds Arts. 57-58, out of scope."
    55: "'AI regulatory sandbox'. Feeds Arts. 57-58, out of scope."
    56: "'AI literacy'. The subject of Art. 4(1), cited as AIA-ALL-A04."
    57: "'testing in real-world conditions'. Read by the scope node: it is what stops Art. 2(8) covering a live pilot."
    58: "'subject' of testing. Feeds Arts. 60-61, out of scope."
    59: "'informed consent'. Feeds Art. 61, out of scope."
    60: CASCADE transparency — 'deep fake', the trigger for the Art. 50(4) disclosure.
    61: "'widespread infringement'. Feeds Art. 73(3), which awaits a rule."
    62: "'critical infrastructure'. Feeds Annex III(2), an area this ruleset gates on."
    63: CASCADE gpai_model — 'general-purpose AI model', the Chapter V handover test.
    64: "'high-impact capabilities'. Feeds Art. 51, Chapter V, deferred (M4d-8)."
    65: "'systemic risk'. Feeds Arts. 51 and 55, Chapter V, deferred (M4d-8)."
    66: >-
      CASCADE gpai_model — 'general-purpose AI system'. The guard that keeps a system BUILT ON a
      model an ordinary AI system rather than a Chapter V handover.
    67: "'floating-point operation'. Feeds the Art. 51(2) FLOP threshold, deferred (M4d-8)."
    68: "'downstream provider'. Feeds Chapter V and Art. 89, deferred (M4d-8)."
  4:
    2: Commission and Member State duty to support providers in meeting Art. 4(1). Not a provider duty.
    3: Board duty to adopt AI-literacy recommendations. Institutional.
  4a:
    1: >-
      A LEGAL BASIS, not an obligation: a provider of a high-risk system MAY exceptionally process
      special categories of personal data for bias detection and correction, subject to conditions
      (a)-(f). Failing a condition means the permission is unavailable, not that a duty was breached.
      DUPLICATED, not moved. Art. 10(5) states the same permission for providers of high-risk
      systems in near-identical words and is still in force in this version, so the two overlap
      almost entirely and 4a(2) is what this Article adds — the permission widened to deployers and
      to systems that are not high-risk. AIA-HR-A10 cites Art. 10 whole, so the 10(5) wording does
      reach the judge; nothing reaches it for 4a.
    2: >-
      The same permission widened — to providers and deployers of other systems and models, and to
      deployers of high-risk systems. A permission on the same terms, so the same ruling.
  # --- Chapter II — prohibited practices ------------------------------------------------------
  # Art. 5 is a risk-tier GATE, not a provider rule: the cascade answers it before high-risk and
  # after Art. 2, and a prohibited system never reaches an obligation check. Paragraphs 2 to 4 are
  # the exception worth reading twice — they are duties, owed by a law-enforcement deployer whose
  # use of real-time remote biometric identification a Member State has authorised under 5(5). This
  # tool never reaches them, because it reports the practice as prohibited and stops there. Stated
  # as a KNOWN LIMIT rather than an absence of duty, the same way Art. 60 is.
  5:
    1: >-
      CASCADE prohibited — the ten prohibited practices, points (a) to (h). Enumerated as
      ProhibitedPractice, and a test derives that list from this paragraph's points rather than
      restating it, so a practice added here cannot go unnamed.
    1a: >-
      CASCADE prohibited — narrows points (ba) and (bb): placing on the market is prohibited only
      where the generation is the intended purpose or a reasonably foreseeable and reproducible
      outcome without adequate safeguards, and USE only where the deployer uses the system for that
      purpose. The whole test, not a gloss on it, and the node's question carries it.
    1b: >-
      CASCADE prohibited — for point (ba) only: manipulation that does not increase exposure or
      alter the nature of the depicted activity is not manipulation.
    2: >-
      Conditions on a real-time remote biometric identification use permitted under 5(5) — confirm
      the identity of the specifically targeted individual, weigh the (a)-(b) elements, and complete
      an Art. 27 fundamental rights impact assessment and an Art. 49 registration first. Real duties
      on a law-enforcement deployer, and this tool reports none of them: it answers the practice as
      prohibited and never reaches the lawful branch. Over-inclusive, so the reader is told the
      strongest thing rather than cleared, but a known limit all the same.
    3: >-
      Prior authorisation by a judicial or independent administrative authority, or within 24 hours
      in urgency. Same limit as 5(2): a duty on the lawful-use branch this tool does not model.
    4: >-
      Each use notified to the market surveillance authority and the national data protection
      authority. Same limit as 5(2).
    5: >-
      A Member State MAY authorise the use, and must lay down the national rules for it. A power of
      the Member State; the deployer's duties under it are 5(2)-(4).
    6: National authorities' duty to report annual use to the Commission. Not a deployer duty.
    7: Commission duty to publish annual reports on that use. Institutional.
    8: >-
      This Article does not affect prohibitions arising under other Union law. A saving clause, and
      a reminder that a practice cleared here may still be banned elsewhere.
  6:
    1: CASCADE annex_i — Art. 6(1)(a), the safety-component limb, decided at the annex_i node.
    1a: >-
      CASCADE annex_i — what does NOT qualify as a safety component. The node's prompt DIVERGES from
      it: the prompt supplies a hand-written list (scheduling, billing, diagnostics reporting, fleet
      analytics) where 6(1a) enacts one (user assistance, performance optimisation, service
      efficiency, automation, convenience, quality control).
      Quality control is the divergence that bites. Consumed, but not yet read faithfully.
    1b: >-
      CASCADE annex_i — the counter-exception: failure or malfunctioning endangering health and
      safety makes it a safety component after all. Carried by the node's "failure endangers health
      or safety" wording.
    1c: >-
      CASCADE third_party_assessment — third-party assessment required SOLELY for non-health-safety
      risks (radio spectrum, electromagnetic interference) does not satisfy Art. 6(1)(b). The node
      asks only WHETHER a third party assesses the product, never for what risk, so this paragraph
      is supplied as context and applied by nothing. Radio equipment on the notified-body route is
      classified high-risk where 6(1c) says it is not.
    2: CASCADE annex_iii — Art. 6(2), the Annex III limb.
    3: >-
      CASCADE derogation — the Art. 6(3) exemptions, split across the significant_risk (first
      subparagraph), derogation ((a)-(d)) and profiling (the carve-back) nodes.
    5: Commission duty to publish Art. 6 guidelines. Institutional; the guidelines are still draft.
    6: Commission delegated power to add Art. 6(3) conditions. Institutional.
    7: Commission delegated power to delete Art. 6(3) conditions. Institutional.
    8: Limit on those delegated powers. Institutional.
  7:
    1: Commission delegated power to ADD or modify Annex III use-cases. Institutional.
    2: The criteria the Commission weighs when doing so. Institutional.
    3: Commission delegated power to REMOVE a use-case from Annex III. Institutional.
  8:
    1: >-
      Chapeau to Chapter III Section 2: high-risk systems shall comply with Arts. 9-15. Already
      modelled rule-by-rule as AIA-HR-A09..A15; a rule here would double-count every finding.
      That reasoning covers this paragraph and NOT 8(2), which is a duty of its own — see
      articles_awaiting_rules.

  # --- Chapter III Section 2 — the requirements themselves ------------------------------------
  # Arts. 9-15 are each cited WHOLE by one rule, so every paragraph below is inside the requirement
  # text the judge reads. "RULE <id>" records that, per paragraph, rather than leaving the article's
  # duties to one shared verdict nobody has looked behind. Where a paragraph inside a cited article
  # is NOT a duty of a role this tool reports for, it is ruled out here on its own terms.
  9:
    1: RULE AIA-HR-A09 — establish, implement, document and maintain a risk management system.
    2: RULE AIA-HR-A09 — the continuous iterative process and its (a)-(d) steps.
    3: RULE AIA-HR-A09 — limits the risks in scope to those design or information can mitigate.
    4: RULE AIA-HR-A09 — measures must account for the combined effect of the Section 2 requirements.
    5: >-
      RULE AIA-HR-A09 — residual risk must be judged acceptable, and the judgement is the provider's
      to document.
    6: RULE AIA-HR-A09 — testing to identify the most appropriate risk management measures.
    7: >-
      RULE AIA-HR-A09 — testing MAY include real-world testing under Art. 60. A permission inside a
      duty; Art. 60 itself is out of scope as an optional route.
    8: RULE AIA-HR-A09 — when testing happens, and against prior metrics and probabilistic thresholds.
    9: >-
      RULE AIA-HR-A09 — consider adverse impact on persons under 18 and other vulnerable groups. A
      distinct consideration inside the same system rather than a restatement of paragraph 2.
    10: >-
      Providers already subject to internal risk management under other Union law may combine the
      Art. 9 aspects with it. An accommodation, and the only paragraph of Art. 9 that adds nothing
      to what a provider must achieve.
  10:
    1: RULE AIA-HR-A10 — training, validation and testing data sets must meet paragraphs 2-5.
    2: RULE AIA-HR-A10 — the data governance practices, points (a)-(h).
    3: RULE AIA-HR-A10 — relevant, sufficiently representative, free of errors, complete.
    4: RULE AIA-HR-A10 — the geographical, contextual, behavioural and functional setting.
    5: >-
      RULE AIA-HR-A10 — the special-category permission for bias detection and correction, with its
      (a)-(f) conditions. STILL IN FORCE in this version and near-identical to Art. 4a(1); see the
      Art. 4a entry above for how the two sit together.
    6: >-
      RULE AIA-HR-A10 — for a system not trained on data, only the testing data sets are caught.
      Narrows which paragraphs apply rather than adding a duty.
  11:
    3: Commission delegated power to amend Annex IV. Institutional.
  13:
    1: RULE AIA-HR-A13 — the system must be transparent enough for a deployer to interpret its output.
    2: RULE AIA-HR-A13 — instructions for use, in an appropriate digital format.
    3: RULE AIA-HR-A13 — what the instructions must contain, points (a)-(f).
  14:
    1: RULE AIA-HR-A14 — designed so natural persons can effectively oversee it in use.
    2: RULE AIA-HR-A14 — what the oversight must aim at, including reasonably foreseeable misuse.
    3: RULE AIA-HR-A14 — measures built in by the provider, identified for the deployer, or both.
    4: RULE AIA-HR-A14 — the (a)-(e) capabilities the overseeing person must be given.
    5: >-
      RULE AIA-HR-A14 — for Annex III point 1(a) only: no action on a biometric identification
      unless two competent persons verify it. Area-specific, and the rule carries no area gate, so
      it is raised for every high-risk system.
  15:
    1: RULE AIA-HR-A15 — appropriate accuracy, robustness and cybersecurity across the lifecycle.
    2: >-
      Commission duty to encourage benchmarks and measurement methodologies with stakeholders.
      Institutional; inside the cited article, but nothing a provider's file can answer.
    3: RULE AIA-HR-A15 — declare the accuracy levels and metrics in the instructions for use.
    4: RULE AIA-HR-A15 — resilience to errors, faults and inconsistencies, including feedback loops.
    5: RULE AIA-HR-A15 — resilience against third parties exploiting vulnerabilities.

  # --- Chapter III Section 3 — obligations of providers and other actors -----------------------
  # Art. 16 is the chapeau, and it is the article this whole nesting exists for. Nine of its twelve
  # points cross-reference an article modelled on its own, so ruling them out here is what stops
  # every Art. 17-21/43/47-49 finding being reported a second time. The other three — (b), (k) and
  # (l) — cross-reference nothing and are carried by AIA-PO-A16-B, -K and -L.
  16:
    "a": Compliance with Section 2 — modelled rule-by-rule as AIA-HR-A09 to A15.
    "c": Quality management system — cross-references Art. 17, modelled as AIA-PO-A17.
    "d": Documentation keeping — cross-references Art. 18, modelled as AIA-PO-A18.
    "e": Automatically generated logs — cross-references Art. 19, modelled as AIA-PO-A19.
    "f": Conformity assessment — cross-references Art. 43, modelled as AIA-PO-A43-1/-2/-3.
    "g": EU declaration of conformity — cross-references Art. 47, modelled as AIA-PO-A47.
    "h": CE marking — cross-references Art. 48, modelled as AIA-PO-A48.
    "i": Registration — cross-references Art. 49(1), modelled as AIA-PO-A49.
    "j": Corrective actions — cross-references Art. 20, modelled as AIA-PO-A20.
  17:
    2: >-
