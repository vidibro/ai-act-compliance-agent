    3: Information obtained under this Article is treated under Art. 78. The receiving body's duty.
  # Art. 56 is AI OFFICE AND COMMISSION MACHINERY end to end, and the one duty it produces is owed by
  # signing rather than by the Regulation: 56(5) has participants report on their commitments, which
  # binds whoever joined a code and nobody else. Adherence itself is voluntary in both directions —
  # 56(3) and 56(7) are invitations. What a code IS matters to Chapter V, because 53(4) and 55(2) let
  # a provider discharge their duties through one; that is ruled on there, where the duty sits.
  56:
    1: The AI Office encourages and facilitates the drawing up of codes of practice. Institutional.
    2: >-
      The AI Office and the Board aim to ensure codes cover at least Arts. 53 and 55, including the
      issues in points (a)-(d). A target set for the Office, not a duty of a provider.
    3: The AI Office may invite providers and authorities to take part in drafting. An invitation.
    4: The Office and the Board aim to ensure codes set out objectives, commitments and KPIs. Institutional.
    5: >-
      Participants report regularly to the AI Office on implementation of their commitments. A duty,
      but one taken on by joining a code rather than imposed by the Regulation — it binds signatories,
      and only for as long as they are signatories.
    6: >-
      The Commission and the Board monitor and evaluate the codes, and the Commission publishes its
      adequacy assessment. Institutional.
    7: >-
      The AI Office may invite providers to adhere, and a non-systemic-risk provider may limit its
      adherence to Art. 53. Voluntary in both directions.
    8: The AI Office encourages review and adaptation of codes in light of emerging standards. Institutional.
    9: >-
      Codes were to be ready by 2 May 2025, failing which the Commission may set common rules by
      implementing act. A deadline on the Office and a reserve power for the Commission.
  # --- Chapter VI — measures in support of innovation ------------------------------------------
  # THE CHAPTER OF OPTIONAL ROUTES. Almost everything here binds a Member State, a competent
  # authority or the Commission; what binds a provider does so only once the provider has chosen to
  # enter a sandbox (Arts. 57-59) or to test in real-world conditions (Arts. 60, 60a, 61).
  #
  # That choice is A KNOWN SCOPE LIMIT, not an absence of duty. A provider who takes either route
  # owes real obligations under it — a testing plan filed and approved, informed consent, oversight,
  # serious-incident reporting, suspension and recall — and this tool reports none of them, because
  # it assesses a system being placed on the market rather than a testing programme. Art. 46(2) is
  # excluded on the same ground. Revisit the four together if documentation describing live testing
  # comes into scope; each paragraph below says what would then have to be checked.
  57:
    1: >-
      Member States shall ensure a national sandbox operational by 2 August 2027. The Member State's
      duty; the Commission MAY support it.
    2: Additional regional, local or joint sandboxes may be established. A permission for authorities.
    3: The EDPS may establish a sandbox for Union institutions. Institutional.
    3a: >-
      NEW in this version. The AI Office may establish a Union-level sandbox for Art. 75(1) systems,
      with priority access for SMEs and SMCs. Institutional.
    4: Member States allocate sufficient resources and cooperate with other authorities. Institutional.
    5: >-
      What a sandbox must provide: a controlled environment under a sandbox plan agreed between the
      provider and the authority, which incorporates the Art. 60 and 60a testing plan where relevant.
      A requirement on the sandbox, and the plan is agreed rather than owed.
    6: Competent authorities provide guidance, supervision and support in the sandbox. The authority's duty.
    7: >-
      The authority provides regulatory guidance and, on request, written proof and an exit report a
      provider may use as conformity evidence. The authority's duty; the request is the provider's
      option, and the resulting document is evidence rather than an obligation.
    8: >-
      Commission and Board access to exit reports with the provider's agreement, and publication if
      both agree. Institutional, and consent-gated in both limbs.
    9: The objectives sandboxes aim at, points (a)-(e). Aspirational, addressed to no one in particular.
    10: >-
      National authorities associate the data protection and other competent authorities with the
      sandbox's operation. The authority's duty.
    11: >-
      Sandboxes do not affect supervisory or corrective powers; the authority may suspend testing or
      participation and must inform the AI Office. The authority's power, and a saving clause.
    12: >-
      Participants remain liable under liability law, but NO ADMINISTRATIVE FINES for infringements
      of this Regulation where they observe the plan and follow the authority's guidance in good
      faith. A protection earned inside the sandbox, not a duty — and this tool reports the
      obligation, never the penalty, so the immunity changes nothing it says.
    13: Sandboxes shall facilitate cross-border cooperation. A design requirement on the authorities.
    14: National authorities, the EDPS and the AI Office coordinate within the Board. Institutional.
    15: >-
      Authorities inform the AI Office and Board of a sandbox; the Office publishes the list.
      Institutional.
    16: >-
      Annual and final reports from the authority to the AI Office and the Board, made public
      online. The authority's duty.
    17: >-
      The Commission develops a single interface for sandbox information and Art. 62(1)(c) non-binding
      guidance. Institutional.
  58:
    1: >-
      Commission implementing acts specifying the detailed arrangements for sandboxes, on the common
      principles in points (a)-(d). Institutional.
    2: >-
      What those implementing acts must ensure, points (a)-(i) — open and fair access, a three-month
      decision, free access for SMEs, mutual recognition across the Union. Requirements on the
      implementing act and on the authorities operating a sandbox; a provider's side of it is an
      application, which is optional.
    3: >-
      Prospective providers shall be DIRECTED to pre-deployment and value-adding services. The
      authority directs; the provider receives.
    4: >-
      Where an authority considers authorising real-world testing inside a sandbox it agrees the
      terms, conditions and safeguards with the participants. The authority's duty, and agreement is
      not a unilateral obligation.
  59:
    1: >-
      A CONDITIONAL PERMISSION to further process lawfully collected personal data in a sandbox, on
      the ten cumulative conditions in points (a)-(j) — a substantial public interest area, necessity,
      an isolated environment, deletion on exit, an Annex IV description of the process, a published
      project summary. Read as a duty it would be a heavy one; read as it is written it is the price
      of an option, and it is owed only by a provider who takes the sandbox route.
    2: >-
      The same conditions for law enforcement processing, plus a specific Union or national legal
      basis. A permission on stricter terms.
    3: Without prejudice to other Union or national law on processing personal data. A saving clause.
  60:
    1: >-
      Real-world testing outside a sandbox MAY be conducted by providers of Annex III or Section A
      Annex I systems, per a real-world testing plan the Commission specifies by implementing act.
      The permission that opens the route, and the reason the rest of the Article is conditional.
    2: The same permission, stated as to timing and as to partnering with deployers. A permission.
    3: Without prejudice to any ethical review required by other law. A saving clause.
    4: >-
      THE ELEVEN CONDITIONS (a)-(k) a provider must meet to test: a plan submitted to and approved by
      the market surveillance authority, registration under Art. 71(4) or Art. 49(4)(d)/(5), Union
      establishment or a legal representative, transfer safeguards, a six-month limit, protection of
      vulnerable subjects, a written agreement with any participating deployer, informed consent under
      Art. 61, qualified human oversight, and reversible outputs. Every one of them document-verifiable
      and none of them checked — the substance of the scope limit named above.
    5: >-
      The subject's right to withdraw consent at any time and demand deletion. A right of the subject;
      the provider's side of it is the 60(4)(i) and Art. 61 consent machinery.
    6: Member States confer inspection powers on market surveillance authorities. Institutional.
    7: >-
      Serious incidents in testing reported under Art. 73, immediate mitigation or suspension, and a
      prompt recall procedure. A real duty, owed only on this route.
    8: Notify the authority of suspension, termination and final outcomes. Same route, same limit.
    9: The provider is liable for damage caused during testing. Liability, not a compliance duty.
  60a:
    1: >-
      NEW in this version. Member States MAY allow real-world testing of Section B Annex I systems
      outside a sandbox. A permission granted to Member States, not to providers, and doubly outside
      what this tool reports: Art. 2(2) already withholds Chapter III from Section B systems.
    2: Member States choosing to allow it adopt real-world testing frameworks. The Member State's duty.
    3: Notify the Commission of any framework before implementing it. The Member State's duty.
    4: Authorities cooperate and remove practical obstacles to those frameworks. Institutional.
    5: >-
      What the frameworks must contain, points (a)-(d) — including (b), which carries Art. 60(2),
      (3), (4)(d)-(j) and (5)-(9) across to this route with the authority substituted for the market
      surveillance authority. A requirement on the framework; the provider duties it imports are
      excluded here for the same reason they are under Art. 60.
    6: >-
      Testing complies with the Section B instrument's own provisions, which do not displace this
      Article. A conflict rule between instruments.
  61:
    1: >-
      INFORMED CONSENT from testing subjects before participation, after being told the (a)-(e)
      information. A real provider duty, and the one Art. 60(4)(i) points at — owed only where the
      Art. 60 route is taken.
    2: The consent shall be dated, documented, and a copy given to the subject. Same route, same limit.
  62:
    1: Member State actions for SMEs, points (a)-(d) — sandbox priority, training, channels. Institutional.
    2: >-
      SME interests taken into account when setting Art. 43 conformity assessment FEES, reduced
      proportionately. Addressed to whoever sets the fees, and it lowers a cost rather than adding a
      duty.
    3: AI Office actions, points (a)-(d) — templates, information platform, campaigns. Institutional.
  63:
    1: >-
      SME RELIEF: an SME without partner or linked enterprises may comply with certain elements of
      the Art. 17 quality management system IN A SIMPLIFIED MANNER, on Commission guidelines. Relief,
      not a duty, and NOT APPLIED — the same treatment as the Art. 111(2) legacy window: applying a
      relief wrongly clears someone. Which elements may be simplified is settled by guidelines rather
      than by the Article, so there is nothing here to check documentation against.
    2: >-
      Paragraph 1 exempts nobody from any other requirement, Arts. 9-15, 72 and 73 named expressly.
      A saving clause, and it is why AIA-PO-A17 stays active for an SME.
  # --- Chapter VII — governance ----------------------------------------------------------------
  # THE ONLY CHAPTER THAT BINDS NO OPERATOR AT ALL. Read paragraph by paragraph, every provision
  # addresses the Commission, the AI Office, the Board, the advisory forum, the scientific panel, a
  # Member State or a national competent authority. Nothing here reaches a provider, deployer,
  # importer, distributor or authorised representative even indirectly — so "institutional" is the
  # right word for all seven articles, and it is written per paragraph because that is checkable.
  64:
    1: The Commission develops Union AI expertise through the AI Office. Institutional.
    2: Member States facilitate the tasks entrusted to the AI Office. The Member State's duty.
    3: The AI Office is allocated adequate resources. Budgetary.
  65:
    1: The Board is established. Constitutive.
    2: Composition — one representative per Member State, the EDPS as observer. Institutional.
    3: Representatives designated for three years, renewable once. Institutional.
    4: >-
      Member States ensure their representatives have the competences, act as single contact point,
      and can coordinate national authorities, points (a)-(c). The Member State's duty.
    5: The Board adopts its rules of procedure by two-thirds majority. Internal procedure.
    6: >-
      Two standing sub-groups for market surveillance and notifying authorities, the first acting as
      the ADCO under Reg (EU) 2019/1020. Internal structure.
    7: The Board is organised to safeguard objectivity and impartiality. Internal.
    8: The Chair, and the AI Office as secretariat. Internal.
  66:
    a: >-
      Coordination among national competent authorities and support for joint market surveillance
      activities under Art. 74(11). A Board task.
    b: Collect and share technical and regulatory expertise and best practices. A Board task.
    c: Advise on implementation, in particular enforcement of the general-purpose AI model rules. A Board task.
    d: >-
      Harmonise administrative practices, including on Art. 46 derogations, sandboxes and real-world
      testing. A Board task.
    e: >-
      Issue recommendations and written opinions, on the matters in points (i)-(vii) — codes,
      the Art. 112 review, technical specifications, harmonised standards, market trends, value-chain
      typology, and the potential need to amend Annex III or revise Art. 5. Advisory throughout: an
      opinion that Annex III should change is not a change to Annex III.
    f: Support the Commission in promoting AI literacy and public awareness. A Board task.
    g: Facilitate common criteria and shared understanding of the Regulation's concepts. A Board task.
    h: Cooperate with other Union bodies and expert networks. A Board task.
    i: Cooperate with third-country authorities and international organisations. A Board task.
    j: Assist authorities and the Commission in developing expertise and assessing training needs. A Board task.
    k: Assist the AI Office in supporting sandboxes and information-sharing among them. A Board task.
    l: Contribute to and advise on guidance documents. A Board task.
    m: Advise the Commission on international AI matters. A Board task.
    n: Provide opinions on qualified alerts regarding general-purpose AI models. A Board task.
    o: >-
      Receive Member State opinions on qualified alerts and on national monitoring and enforcement
      experience. A Board task.
  67:
    1: An advisory forum is established to advise the Board and the Commission. Constitutive.
    2: Balanced stakeholder membership across commercial and non-commercial interests. Institutional.
    3: The Commission appoints the members. Institutional.
    4: Two-year terms, extendable to no more than four. Institutional.
    5: FRA, ENISA, CEN, CENELEC and ETSI are permanent members. Institutional.
    6: The forum draws up its rules of procedure and elects two co-chairs. Internal procedure.
    7: The forum meets at least twice a year and may invite experts. Internal procedure.
    8: The forum may prepare opinions and written contributions on request. Advisory.
    9: The forum may establish sub-groups. Internal.
    10: The forum prepares a public annual report on its activities. The forum's duty.
  68:
    1: The Commission establishes the scientific panel by implementing act. Institutional.
    2: >-
      Selection of the experts, on the conditions in points (a)-(c) — expertise, INDEPENDENCE FROM ANY
      PROVIDER of AI systems or general-purpose AI models, and diligence. A condition on the expert,
      and the independence limb constrains who may be appointed rather than what a provider must do.
    3: >-
      What the panel advises on, points (a)-(d) — including (a)(i), the qualified alert to the AI
      Office about a general-purpose AI model's systemic risk that Art. 51(1)(b) and Art. 52(4) act
      on. The panel's task; the consequence for a provider is a designation under Art. 52, ruled on
      there.
    4: >-
      Experts act impartially, keep information confidential, and take instructions from no one. The
      expert's duty.
    5: The implementing act covers how alerts are issued and assistance requested. Institutional.
  69:
    1: Member States may call on the panel's experts to support enforcement. A Member State option.
    2: Member States may be charged fees for that support. Institutional.
    3: >-
      The Commission facilitates access and coordinates it with the Art. 84 Union AI testing support.
      Institutional.
  70:
    1: >-
      Each Member State establishes or designates at least one notifying authority and one market
      surveillance authority, exercising their powers independently and impartially. The Member
      State's duty, and it is the authority a provider deals with under Arts. 44-46 and 71-79.
    2: Communicate the authorities' identity and tasks to the Commission, and publish contact routes. Institutional.
    3: Adequate technical, financial and human resources and permanent competent staff. Institutional.
    4: National competent authorities ensure an adequate level of cybersecurity. The authority's duty.
    5: The authorities act under the Art. 78 confidentiality obligations. The authority's duty.
    6: Biennial Member State reporting on the authorities' resources. Institutional.
    7: The Commission facilitates exchange of experience between authorities. Institutional.
    8: >-
      Authorities MAY provide guidance and advice, in particular to SMEs and SMCs. A power to help,
      not an obligation on anyone helped.
    9: The EDPS is the competent authority for Union institutions within scope. Institutional.
  # --- Chapter VIII — EU database --------------------------------------------------------------
  71:
    1: Commission duty to set up and maintain the EU database. Institutional.
    2: >-
      RULE AIA-PO-A71-2 — the Annex VIII Section A and B data entered into the EU database by the
      provider or, where applicable, by the authorised representative. Section A for a high-risk
      system, Section B for one registered as not high-risk under Art. 6(3); AIA-PO-A49 and
      AIA-NHR-A06-4 carry the duty to register at all.
    3: >-
      RULE AIA-DP-A71-3 — the Annex VIII Section C data entered by a deployer that is, or acts on
      behalf of, a public authority. AIA-DP-A49-3 carries the duty to register the deployment.
    4: Which parts of the database are public. A property of the register, not a duty of any role.
    5: Limits the personal data the database may hold. Binds the Commission as controller.
    6: >-
      Commission is the controller, and provides support to providers and deployers. Institutional;
      the accessibility requirement lands on the database, not on a registrant.
  72:
    2: >-
      RULE AIA-PO-A72 — the system must actively and systematically collect, document and analyse
      performance data over the lifetime, so continuing Chapter III Section 2 compliance can be
      evaluated. Supplied to the judge through that rule's `qualified_by`: a system established and
      then left idle satisfies 72(1) and not this.
    3: >-
      RULE AIA-PO-A72 — the monitoring system must be BASED ON a written post-market monitoring
      plan, and that plan belongs inside the Annex IV technical documentation. Supplied to the
      judge through that rule's `qualified_by`. The documentation half is separately reachable:
      Annex IV point 9 names the plan by its Article, and AIA-HR-A11 carries Annex IV verbatim.
    4: >-
      Integration with post-market monitoring already established under Section A Annex I law or
      Union financial services law. An accommodation.
  73:
    1: RULE AIA-PO-A73 — report a serious incident to the market surveillance authority.
    2: RULE AIA-PO-A73 — immediately on establishing a causal link, and within 15 days regardless.
    3: RULE AIA-PO-A73 — two days for a widespread infringement or a critical-infrastructure incident.
    4: RULE AIA-PO-A73 — immediately, and within 10 days, where a person has died.
    5: >-
      RULE AIA-PO-A73 — an initial incomplete report followed by a complete one. A permission, and
      it is carried because a procedure that waits for certainty before reporting misreads the
      deadlines above.
    6: >-
      RULE AIA-PO-A73 — after reporting: investigate, risk-assess, cooperate with the authority and
      the notified body, and alter nothing before informing them.
    7: Market surveillance authority duty on receiving a notification. Not a provider duty.
    8: Market surveillance authority duty to act within seven days. Not a provider duty.
    9: >-
      Equivalence carve-out for Annex III systems whose providers report under other Union
      instruments. Narrows the Art. 73(1) duty rather than creating one.
    10: >-
      Limits notification for medical-device systems to Art. 3(49)(c) incidents. Narrows the duty.
    11: National authority duty to notify the Commission. Not a provider duty.
  # --- Chapter IX — post-market monitoring, market surveillance --------------------------------
  # NOTE: Art. 72 and 73 from this chapter ARE in scope (AIA-PO-A72, AIA-PO-A73).
  #
  # THE ENFORCEMENT CHAPTER, and the one where "not a provider duty" is easiest to say and hardest
  # to justify. Almost every Article here is written from the AUTHORITY's side, and a good number of
  # them put a real obligation on an operator in the same sentence — grant access, take corrective
  # action, put an end to the non-compliance. Read paragraph by paragraph they sort into three:
  #
  #   the authority's own procedure, which binds nobody this tool reports for;
  #   an operator duty ALREADY MODELLED at its standing source (Arts. 20, 21, 72, 73), restated here
  #     at the enforcement stage — recorded once, at the source, never twice;
  #   an operator duty that is genuinely new here, and this chapter carries several. Each is written
  #     out as its own rule at the paragraph it comes from: Art. 74(12), Art. 75(1a), Art. 75c(3),
  #     Art. 79(2) and (4), Art. 82(2). The count is not fixed by this header — read the rulings.
  74:
    1: >-
      Regulation (EU) 2019/1020 applies to AI systems, with every Art. 2(1) operator read as an
      economic operator and every AI system read as a product. A conflict-of-laws bridge; the duties
      it carries across belong to that Regulation, which this tool does not hold.
    2: Annual market surveillance reporting to the Commission and competition authorities. The authority's duty.
    3: >-
      For Section A Annex I systems the market surveillance authority is the one designated under the
      sectoral act. Allocation of competence.
    4: >-
      Arts. 79-83 do not apply where the sectoral act already provides equivalent procedures. A
      conflict rule between procedures, both of them the authority's.
    5: Authorities may exercise certain Reg (EU) 2019/1020 powers remotely. The authority's power.
    6: For financial institutions the financial supervisor is the market surveillance authority. Allocation.
    7: Member States may designate another authority, with ECB reporting for SSM credit institutions. Allocation.
    8: >-
      Designation for Annex III(1) law enforcement, border and justice uses and Annex III(6)-(8).
      Allocation.
    9: The EDPS supervises Union institutions, except the CJEU acting judicially. Allocation.
    10: Member States facilitate coordination between authorities. Institutional.
    11: Authorities and the Commission may propose joint activities and investigations. The authority's power.
    12: >-
      RULE AIA-PO-A74-12 — PROVIDERS SHALL GRANT FULL ACCESS to documentation and to the training,
      validation and testing data sets, through APIs or other technical means where appropriate.
      Not Art. 21 restated: Art. 21(1) is information demonstrating conformity and 21(2) is the
      Art. 12(1) logs, and neither reaches the data sets or names the access modality.
    13: >-
      Source code access on a reasoned request, and only where both (a) it is necessary to assess
      Chapter III Section 2 conformity and (b) testing on the data and documentation is exhausted or
      insufficient. Wider than Art. 21 in what it reaches, but there is no artefact to prepare in
      advance: the duty is to comply with a request that may never come, so no document evidences it.
    14: Information obtained is treated under Art. 78. The receiving authority's duty.
  75:
    1: >-
      The AI OFFICE IS EXCLUSIVELY COMPETENT for systems built on the provider's own general-purpose
      model, and for systems in a VLOP or VLOSE, subject to the (i)-(iv) exceptions. Allocation of
      competence, and the trigger for 75(1a) below — which is why this paragraph is worth reading
      even though it binds no operator.
    1a: >-
      RULE AIA-PO-A75-1a — by way of derogation from Art. 73, a provider Art. 75(1) puts under the
      AI Office's competence reports serious incidents to the AI OFFICE. Art. 73(2) to (9) apply
      mutatis mutandis, so only the addressee moves.
    1b: Authorities cooperate actively with and assist the AI Office. The authority's duty.
    1c: The market surveillance authority assists the AI Office where public authority data is accessed. Institutional.
    1d: The AI Office notifies the national authority before a prohibiting or recall decision. Institutional.
    1e: >-
      The AI Office is responsible for Art. 43 third-party conformity assessment of 75(1) systems, and
      THE PROVIDER PAYS the notified body costs. A fee owed to a body, not a compliance obligation —
      this tool reports what a file must contain, never what a procedure costs.
    2: >-
      Authority procedure where a general-purpose AI system usable directly for a high-risk purpose is
      suspected non-compliant. The authority's procedure.
    2a: >-
      A market surveillance authority may ask the AI Office to act on a suspected infringement by a
      75(1) operator, on the (a)-(c) contents, and the AI Office answers within four months.
      Inter-authority procedure.
    3: >-
      Reasoned request to the AI Office where an authority cannot obtain general-purpose model
      information. Inter-authority procedure.
  75a:
    1: >-
      NEW in this version. The AI Office holds all the powers of a market surveillance authority when
      supervising Art. 75(1) systems. A power of an EU body.
    2: The AI Office may decide to open an investigation into suspected non-compliance. The Office's power.
    3: >-
      Information requests by simple request or by decision, with the legal basis, purpose and period
      stated. Procedure; the operator's side is answering a request, penalised under 75c rather than
      owed as a standing duty.
    4: >-
      Remote and on-site inspections, and the (a)-(e) powers of the inspecting officials — enter
      premises, examine and copy records, take explanations, seal premises. The Office's powers; the
      operator's side is submission to them.
    5: A national authority may act on the AI Office's behalf. Inter-authority procedure.
    6: >-
      The AI Office may (a) order operators to provide access to and explanations of their AI systems
      and (b) IMPOSE A DATA AND DOCUMENT RETENTION OBLIGATION. A duty created by an order in an open
      proceeding, with content the order sets, so there is nothing here to check a file against.
    7: The AI Office may appoint independent external experts and auditors. The Office's power.
    8: Information collected is used only for the purposes of this Regulation. A purpose limitation on the Office.
  75b:
    a: >-
      NEW in this version. A ground for reopening commitments made binding: a material change in the
      facts. Part of a procedure between an operator and the enforcing body, opened at the Office's
      discretion; nothing a technical file evidences.
    b: The operator acting contrary to its commitments. Same procedure.
    c: The decision rested on incomplete, incorrect or misleading information. Same procedure.
  75c:
    1: NEW in this version. The AI Office adopts a non-compliance decision. The Office's decision.
    2: Preliminary findings communicated to the operator before the decision. A procedural right of the operator.
    3: >-
      RULE AIA-ALL-A75c-3 — the first sentence is the Office's power to order measures within a
      specified period. The second is the operator's own duty: it shall provide the AI Office with
      a description of the measures it has taken, upon their implementation. Not the shape of
      75a(6), where the order sets the content and there is nothing to check a file against — here
      the Act fixes both the artefact and its timing, and the order settles only what the measures
      are.
    4: >-
      Fines under Art. 99(3)-(7) applied mutatis mutandis, and what attracts them, points (a)-(c). A
      consequence of breach, not an obligation — the ground on which Art. 99 is excluded. This tool
      reports what is owed, never what non-compliance would cost.
    5: >-
      Periodic penalty payments to compel the (a)-(g) acts, capped at 5% of average daily income or
      worldwide annual turnover. A consequence, as 75c(4).
    6: The CJEU has unlimited jurisdiction to review a fine. Judicial review.
    7: Funds collected go to the Union budget. Budgetary.
    8: Five-year limitation periods for imposing and for enforcing. Procedural.
    9: A decision closing the proceeding where there are no grounds. The Office's decision.
  75d:
    1: >-
      NEW in this version. Art. 18 of Reg (EU) 2019/1020 applies mutatis mutandis to operators under
      the AI Office's competence. A procedural safeguard held against the enforcing body.
    2: Rights of defence and of access to the file. A right of the operator, not a duty.
    3: Commission implementing acts on access to the file and negotiated disclosure. Institutional.
    4: The AI Office publishes its Art. 75b and 75c decisions, naming the parties. The Office's duty.
  76:
    1: >-
      Authorities have the competences and powers to supervise real-world testing, with the Art. 60a
      substitution of authority. The authority's power over a route this tool does not cover.
    2: Verification of Art. 60 compliance for testing inside a sandbox. The authority's duty.
    3: >-
      On a serious incident or grounds to think Arts. 60 and 61 are not met, the authority may suspend
      or terminate the testing or require the operator to modify it, points (a)-(b). The operator's
      side is compliance with a decision on the testing route, excluded with Art. 60.
    4: The decision or objection states its grounds and how to contest it. A procedural right.
    5: Communication of the grounds to other Member States' authorities. Institutional.
  77:
    1: >-
      Fundamental-rights authorities may request and access documentation created or maintained under
      this Regulation, in an accessible language and format. The requesting body's power, and what it
      reaches is the Art. 11 and Art. 12 material a rule already checks exists.
    1a: The market surveillance authority grants that access, requesting the material where needed. Inter-authority.
    1b: Those authorities and market surveillance authorities cooperate and assist each other. Institutional.
    2: Member States identify and publish the list of such authorities by 2 November 2024. The Member State's duty.
    3: >-
      Where the documentation is insufficient, a reasoned request to the market surveillance authority
      to organise testing of the system. Inter-authority procedure.
    4: Information obtained is treated under Art. 78. The receiving body's duty.
  78:
    1: >-
      CONFIDENTIALITY OWED BY the Commission, market surveillance authorities, NOTIFIED BODIES and
      anyone else involved in applying the Regulation, respecting the (a)-(e) interests including
      source code and trade secrets. Not a duty of a provider, deployer, importer, distributor or
      authorised representative — it is the counterweight to what they must hand over.
    2: Authorities request only data strictly necessary, with proportionate security. The authority's duty.
    3: >-
      Confidential information is not disclosed without prior consultation, and Annex IV technical
      documentation of law enforcement, immigration and asylum providers stays on their premises. A
      restriction on the authority, and a protection for that provider.
    4: The confidentiality rules do not affect information exchange and dissemination duties. A saving clause.
    5: Exchange of confidential information with third-country regulators. Institutional.
  # Arts. 79, 80, 82 and 83 are authority-led procedures that DO put duties on the operator once the
  # authority acts — cooperate with the evaluation, ensure corrective action across every unit made
  # available, put an end to a formal non-compliance. Excluded not because those duties are unreal
  # but because each is a standing duty this ruleset already carries, restated at the enforcement
  # stage: Art. 20 for corrective action, Art. 21 for cooperation, Arts. 47, 48, 71 and 22 for the
  # formal defects Art. 83 lists. Reporting them again would double-count, the same ground on which
  # Art. 16's cross-referencing points are excluded. A reader is told what they owe, not told twice.
  79:
    1: An AI system presenting a risk is a "product presenting a risk" under Reg (EU) 2019/1020. A definition.
    2: >-
      RULE AIA-ALL-A79 — the paragraph is the authority's evaluation procedure, and its final
      sentence binds every operator: cooperate as necessary with the market surveillance authority
      and with the Art. 77(1) fundamental-rights bodies.
    3: Informing the Commission and other Member States where non-compliance is not national. Institutional.
    4: >-
      RULE AIA-ALL-A79 — the operator ensures corrective action across every unit it has made
