  23:
    1: RULE AIA-IM-A23 — verify conformity before placing on the market, points (a)-(d).
    2: RULE AIA-IM-A23 — do not place a non-conforming or falsified system, and inform the others.
    3: RULE AIA-IM-A23 — the importer's own name, trade mark and contact address on the system.
    4: RULE AIA-IM-A23 — storage and transport conditions must not jeopardise compliance.
