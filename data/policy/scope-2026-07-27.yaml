  77:
    1: >-
      Fundamental-rights authorities may request and access documentation created or maintained under
      this Regulation, in an accessible language and machine-readable format by electronic means.
      The requesting body's power. WHAT IT REACHES IS EVERYTHING THE REGULATION MAKES AN OPERATOR
      CREATE OR KEEP — the Art. 17 quality management documentation, the Art. 27 fundamental rights
      impact assessment, the Art. 47 declaration and the Art. 72 monitoring plan as much as the
      Art. 11 and Art. 12 material — and it attaches a FORMAT condition no rule checks. The duty to
      produce on request is still Arts. 21 and 26(12), which are ruled; what
      reaches is the Art. 11 and Art. 12 material a rule already checks exists.
    1a: The market surveillance authority grants that access, requesting the material where needed. Inter-authority.
    1b: Those authorities and market surveillance authorities cooperate and assist each other. Institutional.
    2: Member States identify and publish the list of such authorities by 2 November 2024. The Member State's duty.
    3: >-
      Where the documentation is insufficient, a reasoned request to the market surveillance authority
      to organise testing of the system. Inter-authority procedure.
    4: Information obtained is treated under Art. 78. The receiving body's duty.
  78:
    1: >-
      CONFIDENTIALITY OWED BY the Commission, market surveillance authorities, NOTIFIED BODIES and
      anyone else involved in applying the Regulation, respecting the (a)-(e) interests including
      source code and trade secrets. Not a duty of a provider, deployer, importer, distributor or
      authorised representative in the ordinary case — it is the counterweight to what they must
      hand over. THE ADDRESSEES ARE NOT CLOSED, though: "any other natural or legal person involved
      in the application of this Regulation" reaches an operator that has itself received another's
      material under this Regulation, which is why Art. 53(7) can point here and bind a downstream
      provider. Ruled at that address rather than this one, because that is the paragraph naming
      the receipt.
    2: Authorities request only data strictly necessary, with proportionate security. The authority's duty.
    3: >-
      RULE AIA-PO-A78-3 — the paragraph turns halfway through. Its first subparagraph restricts the
      AUTHORITIES: confidential information exchanged between national competent authorities, or
      with the Commission, is not disclosed without prior consultation of the originating authority
      and of the deployer where an Annex III point 1, 6 or 7 system is used by law enforcement,
      border control, immigration or asylum authorities and disclosure would jeopardise public or
      national security, and the exchange never covers their sensitive operational data. Its second
      subparagraph binds a PROVIDER: where those authorities are themselves the provider, the
      Annex IV documentation shall remain within their premises and they shall ensure the Art. 74(8)
      or (9) market surveillance authority can immediately access it or obtain a copy on request,
      confined to staff holding the appropriate security clearance. The rule carries that second
      subparagraph.
    4: The confidentiality rules do not affect information exchange and dissemination duties. A saving clause.
    5: Exchange of confidential information with third-country regulators. Institutional.
  # Arts. 79, 80, 82 and 83 are authority-led procedures that DO put duties on the operator once the
  # authority acts — cooperate with the evaluation, ensure corrective action across every unit made
  # available, put an end to a formal non-compliance. Excluded not because those duties are unreal
  # but because each is a standing duty this ruleset already carries, restated at the enforcement
  # stage: Art. 20 for corrective action, Art. 21 for cooperation, Arts. 47, 48, 71 and 22 for the
  # formal defects Art. 83 lists. Reporting them again would double-count, the same ground on which
  # Art. 16's cross-referencing points are excluded. A reader is told what they owe, not told twice.
  79:
    1: An AI system presenting a risk is a "product presenting a risk" under Reg (EU) 2019/1020. A definition.
    2: >-
      RULE AIA-ALL-A79 — the paragraph is the authority's evaluation procedure, and its final
      sentence binds every operator: cooperate as necessary with the market surveillance authority
      and with the Art. 77(1) fundamental-rights bodies.
    3: Informing the Commission and other Member States where non-compliance is not national. Institutional.
    4: >-
      RULE AIA-ALL-A79 — the operator ensures corrective action across every unit it has made
      available on the Union market, not only the one the authority examined.
    5: Provisional measures where the operator does not act in time. The authority's power.
    6: >-
      What the 79(5) notification must contain, and the (a)-(d) grounds of non-compliance it may
      rest on. The authority's duty.
    7: Other authorities inform the Commission of their own measures. Institutional.
    8: A provisional measure unopposed for three months is deemed justified. Institutional timing.
    9: Authorities ensure appropriate restrictive measures are taken without undue delay. The authority's duty.
  80:
    1: >-
      Authority evaluation where a system the provider classified as not-high-risk under Art. 6(3) is
      suspected to be high-risk. The provider-side duty it enforces is Art. 6(4), in scope as
      AIA-NHR-A06-4.
    2: The authority requires the provider to bring the system into compliance. The authority's procedure.
    3: Informing the Commission and other Member States. Institutional.
    4: The provider shall bring the system into compliance. Art. 20 once the authority has ruled.
    5: >-
      The provider ensures corrective action across all units made available. Art. 20 reaches this
      one, unlike Art. 82(2): the duty-holder is the provider alone, and an authority's Art. 80(2)
      ruling that the system is high-risk after all gives that provider "reason to consider" it
      non-conforming, which is Art. 20(1)'s trigger. The all-units limb is Art. 20(1)'s withdraw-or-
      recall. Reported by AIA-PO-A20, and by AIA-PO-A20-2 where the system also presents an
      Art. 79(1) risk.
    6: Art. 79(5)-(9) applies where the provider does not act. Procedural cross-reference.
    7: >-
      MISCLASSIFICATION TO CIRCUMVENT Chapter III attracts a fine. A penalty, and the duty behind it
      is the Art. 6(4) assessment AIA-NHR-A06-4 checks.
    8: Authorities may perform checks using EU database information. The authority's power.
  81:
    1: >-
      Commission consultation where objections are raised to a national measure, within three months
      or 30 days for an Art. 5 prohibition. Institutional.
