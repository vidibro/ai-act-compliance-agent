      TERMS of work-related relationships, promotion, termination, task allocation, and monitoring
      and evaluation of performance and behaviour (4(b)).
      THE OUT-OF-SCOPE EXAMPLES IN THE NODE'S TEST (ii) ARE A READING, NOT A QUOTATION. Points 1 and
      3 to 8 enact no exclusion at all — unlike Annex III(2), whose test the Act supplies through
