# --- ARTICLES AWAITING A RULE -----------------------------------------------------------------
# REAL DUTIES THAT GO UNREPORTED TODAY. Separate from `article_rulings` because it says something
# different: not "here is what accounts for this provision", but "a party owes this and nothing
# accounts for it". Filing one of these as a ruling would turn a known gap into apparent coverage,
# which is the single failure this ledger exists to prevent — so a test forbids an entry here from
# claiming the cascade handles it, and another forbids the same address appearing in both.
#
# Keyed by article and nested by division, the same shape as the section above. Every one sits
# inside an article that section counts as IN SCOPE, which is why they need naming here: nothing
# else in the repo would show them as missing.
#
# Emptying this bucket is the work. Editing it away is not.
# CHAPTER V AND NOTHING ELSE. Every high-risk debt is written as a rule; what is left is the
# general-purpose AI model regime, which is not a paragraph a rule cites too narrowly but a parallel
# regime the ruleset does not carry at all.
articles_awaiting_rules:
  # EMPTY, and the mechanism stays. Every duty this Regulation puts on a role this tool reports
  # for is now carried by a rule — the Art. 6 track in Chapters II and III, and Chapter V for a
  # general-purpose AI model. An entry here means a party owes something and no report mentions
  # it, which is a stronger claim than a dismissal and is why the section is separate from
  # article_rulings rather than folded into it.
  #
  # What is NOT recorded here, because it is not a duty: the Art. 51 systemic-risk line, which no
  # cascade node asks. Every Art. 55 rule states it as an activation_condition instead, so the
  # obligation reaches the reader with the question attached rather than being withheld. Same for
  # the Art. 53(2) and 54(6) open-source carve-out. Both are missing QUESTIONS, and the place
  # they are recorded is the Art. 51 ruling above.
  {}

# --- ANNEXES ---------------------------------------------------------------------------------
# The Annexes carry operative content the Articles only point at: Annex III IS the list of high-risk
# areas, Annex I IS the list of harmonisation instruments, Annex IV IS the technical documentation an
# Art. 11 file must contain. An amendment can land in an Annex without a single word of the Articles
# changing — this consolidation added Annex XIV and moved the Machinery Regulation into Annex I
# Section B, from which Art. 2(2) withholds Chapter III.
#
# An annex is IN SCOPE if a rule cites it (source.annex) or the classification cascade supplies it
# as context: Annexes I, III, IV, VI and VIII. That is a claim that some part of the tool reads the
# annex, NOT that its contents have been modelled — Annex IV is cited by AIA-HR-A11 and its element
# list is not itself checked.
annex_rulings:
  # Annex I: EVERY ITEM IS AN ANSWER THE CASCADE CAN GIVE. AnnexIProduct holds one member per
  # instrument and tests/test_vocabulary.py derives the list from this file, so an instrument added
  # by amendment fails CI rather than becoming a system the cascade cannot classify. The Section
  # decides what follows: Section A carries Chapter III, Section B has it withheld by Art. 2(2).
  I:
    A/1: >-
