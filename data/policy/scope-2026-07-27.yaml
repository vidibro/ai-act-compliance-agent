      DEFAULT ANSWER FOR A MACHINE: the Regulation at B/21 replaces this Directive only from
      20 January 2027, so anything on the market before then is governed here, and the node says so
      rather than leaving the model to choose on how modern the machine sounds.
      THAT DATE IS NOT IN THIS CORPUS. It is Art. 54 of Regulation (EU) 2023/1230; the Annex gives
      the OJ reference and the repeal, not the application date, so the node states a fact about
      external law that nothing here can check — the one such fact in any question. Two bounds make
      it tolerable: the default it supports is Section A, which is the OVER-inclusive side, and the
      instruction answers on the instrument the document names rather than on the date. It goes
      stale on 20 January 2027, when the default should become B/21, and nothing reads a clock.
