# Coverage ledger — Regulation (EU) 2024/1689, act version 2026-07-27.
#
# THIS VERSION is the consolidated text as amended by Regulation (EU) 2026/1744 of 8 July 2026
# (the Digital Omnibus on AI), applicable from 27 July 2026. It is derived from the 2024-07-12
# ledger: 36 articles changed, 6 were inserted (4a, 60a, 75a-75d), and every exclusion reason
# carried over was re-read against the amended text rather than copied on trust. The entries that
# actually moved are Art. 2 (its Section B carve-out was rewritten and it gained a paragraph 13)
# and the six new articles at the end of their chapters.
#
# WHY THIS FILE EXISTS
# Every article in data/policy/articles/2026-07-27/ must be accounted for: either it is CITED by a
# rule in spec.yaml (in scope), or it is listed here with a reason (out of scope). A test enforces
# the partition. Nothing may be merely unexamined.
#
# The point is what happens on a NEW ACT VERSION. A newly added article would be neither cited nor
# listed here — the coverage test fails, and CI blocks until a human rules on it. The guarantee is
# not "we automatically detect new obligations"; it is "a new obligation cannot pass unnoticed".
# For a compliance tool a false PASS is the worst outcome, and silently ignoring an article the
# legislator added is exactly how one happens.
#
# SCOPE: obligations of every role the Act binds — provider, deployer, importer, distributor and
# authorised representative — for a HIGH-RISK AI system, plus Art. 4, which binds provider and
# deployer at every governed tier. The general-purpose AI model regime is deliberately excluded,
# and each exclusion is recorded below rather than assumed.
#
# The ruleset was authored against the EMPLOYMENT area (Annex III(4)) and most of it generalises
# untouched: Arts. 9-15 and 16-21 bind every high-risk system whatever the area. Where the law is
# area-specific it is now SAID so — `applies_to_annex_iii_area` and `applies_to_route` on the rule
# — rather than assumed. Art. 43 is the case that forced it: conformity assessment is 43(1) for
# Annex III point 1, 43(2) for points 2 to 8, and 43(3) for an Annex I product. A reason in this
# file that rests on "employment does X" is therefore suspect, and two of them were wrong until the
# split landed.
#
# Authoring this ledger already paid for itself: it surfaced Art. 72 and Art. 73 as genuine
# provider obligations for high-risk systems that the initial ruleset had simply missed.

act_version_date: 2026-07-27

# --- ROLES ----------------------------------------------------------------------------------
# Same partition as the articles below, over ActorRole: a role either has rules in spec.yaml or is
# listed here with a reason. A test enforces it, so a role added to the enum — or one that loses
# its last rule — fails CI instead of quietly disappearing from every report.
#
# Kept HERE rather than reported at runtime. Which roles this tool covers is a fact about the
# ruleset, settled before shipping; narrating it to a reader in every report would push a
# development-time gap into their output.
roles_out_of_scope:
  product_manufacturer: >-
    Art. 25(3) gives the product manufacturer no duty set of its own — where a high-risk AI system
    is placed on the market with their product under their name, it makes them THE PROVIDER, owing
    Art. 16 whole. So there is no ruleset to write, and writing one would be wrong: it would state
    as a separate obligation set the very thing the Article says is the provider's. The role is
    reached instead by the gap graph's `roles` node (src/aiact/gap/roles.py), which asks at high
    risk whether Art. 25(1)(a)-(c) or 25(3) has moved the provider's duties onto another party, and
    answers with the provider ruleset this spec already holds.

# --- ARTICLES ---------------------------------------------------------------------------------
# ONE ENTRY PER ARTICLE, in Article order, and the shape of the entry says how much of it is ruled
# out:
#
#   47:  a string   — the whole Article is out of scope, for the reason given
#   48:  a mapping  — the Article IS cited by a rule, and these DIVISIONS of it are out of scope,
#                     keyed by paragraph (1, 1a, 2 …) or, for a chapeau-plus-list Article with no
#                     numbered paragraphs, by point (a, b, c …)
#
# THE SECOND SHAPE IS THE POINT. An article-level partition answers "is Article N accounted for?"
# as soon as any one rule cites any one paragraph of it, so most of an article's duties can go
# unmodelled inside an article the ledger records as covered — and it then reads as coverage, which
# is worse than an absence. Art. 16 is the worked example: excluded whole as an "umbrella list that
# cross-references other articles", true of nine of its twelve points and false of (b), (k), (l).
#
# Divisions are enumerated only for CITED articles. An article ruled out whole needs no breakdown,
# and the two the cascade reads instead of a rule — Art. 2 and Art. 5 — have their own enumeration
# guarantee in ScopeExclusion and ProhibitedPractice, each pinned by a test. Art. 6 has neither,
# which is why its paragraphs are ruled on one by one.
#
# "CASCADE <node_id>" hands a division to the classification graph rather than to a rule, and a test
# checks the node exists. That is the point of the convention: nothing in the tool reads Art. 6(1c),
# so no entry claiming a node reads it can pass.
articles_out_of_scope:
  # --- Chapter I — General provisions ---------------------------------------------------------
  1: Declaratory statement of the Regulation's subject matter. Creates no obligation.
  2: >-
    Scope. Determines whether the Regulation applies at all, so it is a gate rather than a provider
    obligation checkable against documentation. Consumed by the classification cascade's `scope`
    node, which answers it into ScopeExclusion and RiskClass.OUT_OF_SCOPE; Art. 2(2) is consumed
    separately, by AnnexIProduct.chapter_iii_applies and the Section B branch of
    gap.rules.select_rules.
    AMENDED HERE, in two ways that matter. Art. 2(2)'s list was rewritten: a Section B system is now
    governed by "Article 6(1), Article 60a and Articles 102 to 112", where it was "Article 6(1),
    Articles 102 to 109 and Article 112". The exhaustive-list reasoning behind the Section B branch
    is unchanged; the LIST is not, and any report text quoting it has to be re-read.
    And a NEW Art. 2(13) creates a limitation mechanism that does not exist in the 2024-07-12 text:
    for Art. 6(1) systems the requirements of Arts. 9-15 and 17-25 MAY BE LIMITED where Section A
    harmonisation legislation gives equivalent or higher protection. It is not operative yet — it
    works through delegated acts the Commission must adopt by 2 August 2027 — so no rule changes on
    it today. When those acts land they narrow obligations this ruleset raises, which makes this the
    entry to revisit first.
  3: >-
    Definitions. Feeds classification (Art. 3(1) is_ai_system, Art. 3(3) actor_role). Definitional,
    creates no standalone duty.
  4:
    2: Commission and Member State duty to support providers in meeting Art. 4(1). Not a provider duty.
    3: Board duty to adopt AI-literacy recommendations. Institutional.
  4a: >-
    NEW in this version. A LEGAL BASIS, not an obligation: it permits providers and deployers to
    process special categories of personal data where strictly necessary for bias detection and
    correction, subject to safeguards. Nothing here is a duty a technical file could satisfy —
    failing its conditions means the permission is unavailable, not that a duty was breached.
    Worth recording where it came from: Art. 10(5) held this basis in the 2024-07-12 text and was
    DELETED, its substance moved here and widened to deployers and to systems that are not
    high-risk. So AIA-HR-A10's requirement text legitimately loses it — the provision moved out of
    the article that rule cites, it was not repealed.
  5: >-
    Prohibited AI practices. Evaluated by the classification cascade's `prohibited` node, before
    high-risk and after Art. 2; a prohibited system never reaches an obligation check, so this is a
    risk-tier gate rather than a provider rule.
  6:
    1: CASCADE annex_i — Art. 6(1)(a), the safety-component limb, decided at the annex_i node.
    1a: >-
      CASCADE annex_i — what does NOT qualify as a safety component. The node's prompt DIVERGES from
      it: the prompt supplies a hand-written list (scheduling, billing, diagnostics reporting, fleet
      analytics) where 6(1a) enacts one (user assistance, performance optimisation, service
      efficiency, automation, convenience, quality control).
      Quality control is the divergence that bites. Consumed, but not yet read faithfully.
    1b: >-
      CASCADE annex_i — the counter-exception: failure or malfunctioning endangering health and
      safety makes it a safety component after all. Carried by the node's "failure endangers health
      or safety" wording.
    1c: >-
      CASCADE third_party_assessment — third-party assessment required SOLELY for non-health-safety
      risks (radio spectrum, electromagnetic interference) does not satisfy Art. 6(1)(b). The node
      asks only WHETHER a third party assesses the product, never for what risk, so this paragraph
      is supplied as context and applied by nothing. Radio equipment on the notified-body route is
      classified high-risk where 6(1c) says it is not.
    2: CASCADE annex_iii — Art. 6(2), the Annex III limb.
    3: >-
      CASCADE derogation — the Art. 6(3) exemptions, split across the significant_risk (first
      subparagraph), derogation ((a)-(d)) and profiling (the carve-back) nodes.
    5: Commission duty to publish Art. 6 guidelines. Institutional; the guidelines are still draft.
    6: Commission delegated power to add Art. 6(3) conditions. Institutional.
    7: Commission delegated power to delete Art. 6(3) conditions. Institutional.
    8: Limit on those delegated powers. Institutional.
  7: Empowers the Commission to amend Annex III. Institutional, no provider duty.
  8: >-
    Chapeau to Chapter III Section 2: high-risk systems shall comply with Art. 9-15. Already
    modelled rule-by-rule as AIA-HR-A09..A15; a rule here would double-count every finding.
  11:
    3: Commission delegated power to amend Annex IV. Institutional.

  # --- Chapter III Section 3 — obligations of providers and other actors -----------------------
  # Art. 16 is the chapeau, and it is the article this whole nesting exists for. Nine of its twelve
  # points cross-reference an article modelled on its own, so ruling them out here is what stops
  # every Art. 17-21/43/47-49 finding being reported a second time. The other three — (b), (k) and
  # (l) — cross-reference nothing and are carried by AIA-PO-A16-B, -K and -L.
  16:
    "a": Compliance with Section 2 — modelled rule-by-rule as AIA-HR-A09 to A15.
    "c": Quality management system — cross-references Art. 17, modelled as AIA-PO-A17.
    "d": Documentation keeping — cross-references Art. 18, modelled as AIA-PO-A18.
    "e": Automatically generated logs — cross-references Art. 19, modelled as AIA-PO-A19.
    "f": Conformity assessment — cross-references Art. 43, modelled as AIA-PO-A43-1/-2/-3.
    "g": EU declaration of conformity — cross-references Art. 47, modelled as AIA-PO-A47.
    "h": CE marking — cross-references Art. 48, modelled as AIA-PO-A48.
    "i": Registration — cross-references Art. 49(1), modelled as AIA-PO-A49.
    "j": Corrective actions — cross-references Art. 20, modelled as AIA-PO-A20.
  17:
    2: >-
      Proportionality of the QMS to the provider's size. Modifies how Art. 17(1) is met rather than
      adding a duty, and expressly holds the required rigour constant.
    3: Permission to fold the Art. 17(1) aspects into a sectoral QMS. An accommodation, not a duty.
    4: >-
      Financial institutions may satisfy the QMS duty through internal-governance rules under Union
      financial services law. An accommodation.
  18:
    2: Member State duty to keep documentation available where a provider goes insolvent. Not a provider duty.
    3: Financial institutions keep the technical documentation under financial services law. An accommodation.
  19:
    2: Financial institutions keep logs under financial services law. An accommodation.
  21:
    3: Confidentiality duty of the receiving competent authority (Art. 78). Not a provider duty.
  25:
    1: >-
      CASCADE provider_reallocation — the Art. 25(1)(a)-(c) triggers that move the provider role.
      Asked by the gap graph's roles node, which answers with the provider ruleset.
    3: >-
      CASCADE provider_reallocation — the product manufacturer becomes THE PROVIDER, owing Art. 16
      whole. Also recorded in roles_out_of_scope above: there is no separate duty set to write.
    5: Without prejudice to intellectual property and trade secrets. A saving clause, not a duty.
  27:
    2: >-
      First-use rule and the permission to reuse an earlier assessment. Qualifies WHEN the Art.
      27(1) duty is discharged; the duty itself is AIA-DP-A27.
    4: Permission to cross-reference a GDPR data protection impact assessment. An accommodation.
    5: AI Office duty to publish a FRIA template. Institutional.

  # --- Chapter III Section 4 — notifying authorities and notified bodies -----------------------
  # Duties of MEMBER STATES, notifying authorities and notified bodies — none of the roles this
  # tool reports for. That holds whatever the area, which is the point: the reason used to be
  # "employment self-assesses, so no notified body is ever involved", and Art. 43(1) makes that
  # false for Annex III point 1. A provider whose biometric system goes the Annex VII route deals
  # with a notified body; the duties in this section are still the body's, not theirs.
  28: Duty of Member States to designate notifying authorities.
  29: Duty of conformity assessment bodies seeking notification.
  30: Notification procedure — Member State and Commission duties.
  31: Requirements on notified bodies.
  32: Presumption of conformity for notified bodies. Declaratory.
  33: Duty of notified bodies regarding subsidiaries and subcontracting.
  34: Operational duties of notified bodies.
  35: Commission duty to assign identification numbers and publish lists.
  36: Member State duty regarding changes to notifications.
  37: Commission procedure to challenge a notified body's competence.
  38: Commission duty to coordinate notified bodies.
  39: Rules for conformity assessment bodies of third countries.

  # --- Chapter III Section 5 — standards, conformity, certificates, registration ---------------
  40: >-
    Harmonised standards. Confers a presumption of conformity if applied; an option, not a duty.
  41: Commission power to adopt common specifications. Institutional.
  42: Presumption of conformity for certain requirements. Declaratory, no duty.
  43:
    5: Commission delegated power to amend Annexes VI and VII. Institutional.
    6: Commission delegated power to move Annex III points 2-8 to the Annex VII route. Institutional.
  44: >-
    Certificates issued by notified bodies — their contents, validity, renewal, suspension and
    withdrawal. Duties of the BODY that issues them, not of the provider that holds one. A provider
    on the Annex VII route (Art. 43(1)) will hold such a certificate, and this article still says
    nothing about what they must do with it.
  45: Information duties of notified bodies.
  46: >-
    Derogation from the conformity assessment procedure — an exceptional authorisation by a market
    surveillance authority, not a standing provider duty.
  47:
    3: >-
      A single EU declaration of conformity where other Union harmonisation legislation also requires
      one. Consolidates declarations owed under instruments this tool does not carry, so a gap
      against it could not be stated meaningfully.
    5: Commission delegated power to amend Annex V. Institutional.
  48:
    1: The CE marking is subject to Art. 30 of Regulation (EC) No 765/2008 — an external instrument.
    5: >-
      States what the CE marking MEANS where other Union law also requires it. Declaratory about the
      marking's effect rather than a separate act the provider performs.
  49:
    2: >-
      Registration of a system the provider concluded is not high-risk. Carried by AIA-NHR-A06-4,
      whose Art. 6(4) text imposes it by cross-reference.

  # --- Chapter IV — transparency ---------------------------------------------------------------
  # Art. 50(1) to (4) are CITED, by AIA-TR-A50-1 to -4: the cascade answers which duty attached and
  # those rules check the documentation against it. Only the two paragraphs below are ruled out.
  50:
    6: >-
      Art. 50(1)-(4) do not affect Chapter III. LOAD-BEARING and already modelled structurally: it
      is why applies_to_transparency_duty adds a rule to a tier's obligations instead of replacing
      them, so a high-risk system owes Chapter III and its Art. 50 duty together.
    7: Commission duty to facilitate codes of practice on marking and labelling. Institutional.

  # --- Chapter V — general-purpose AI models ---------------------------------------------------
  # Chapter V is a SEPARATE TRACK, not a lesser one, and it has applied since 2 August 2025 —
  # earlier than every rule in spec.yaml. The classification cascade DETECTS a general-purpose AI
  # model (Art. 3(63)) and hands over to these articles by name; what is missing is the ruleset to
  # check documentation against them. Tracked as M4d-8, deliberately deferred: see the roadmap for
  # why the systemic-risk step should wait for the Art. 52(6) list to be published.
  51: >-
    Classification of GPAI models as carrying systemic risk. Answered against the Art. 52(6) list
    once the Commission publishes it; the 10(^25) FLOP presumption is not derivable from a model
    card. Handed over, not checked (M4d-8).
  52: >-
    Notification procedure, and the Commission's duty under 52(6) to publish a list of GPAI models
    with systemic risk. Cited in the GPAI handover text so a reader knows the list is authoritative
    and, at the time of writing, not published.
  53: >-
    Obligations of GPAI model providers — Annex XI documentation, information to downstream
    providers, copyright policy, training-content summary. Named in the handover; no rules yet
    (M4d-8).
  54: Authorised representatives of GPAI model providers. Chapter V ruleset not built (M4d-8).
  55: >-
    Obligations for GPAI models with systemic risk. Named in the handover; no rules yet (M4d-8).
  56: Codes of practice for GPAI. Voluntary instrument; a signature is evidence, not a duty.

  # --- Chapter VI — measures in support of innovation ------------------------------------------
  57: Member State duty to establish AI regulatory sandboxes.
  58: Commission/Member State arrangements for sandboxes.
  59: Conditional permission to further process personal data in a sandbox. A permission, not a duty.
  60: >-
    Testing in real-world conditions — an optional route with its own conditions, not a standing
    duty for a system placed on the market.
  60a: >-
    NEW in this version. Real-world testing of Section B Annex I systems outside a sandbox — the
    same shape as Art. 60 and excluded for the same reason: an optional route with its own
    conditions, not a standing duty of a system placed on the market. Doubly so here, because its
    subjects are Section B systems, which Art. 2(2) already withholds Chapter III from.
  61: Informed consent — applies only where real-world testing is undertaken.
  62: Member State and Commission support duties toward SMEs.
  63: >-
    Derogations for microenterprises — modifies how other obligations are met rather than creating
    one.

  # --- Chapter VII — governance ----------------------------------------------------------------
  64: Establishes the AI Office. Institutional.
  65: Establishes the European Artificial Intelligence Board. Institutional.
  66: Tasks of the Board. Institutional.
  67: Advisory forum. Institutional.
  68: Scientific panel of independent experts. Institutional.
  69: Member State access to the pool of experts. Institutional.
  70: Member State duty to designate national competent authorities. Institutional.

