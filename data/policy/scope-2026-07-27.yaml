# --- ARTICLES AWAITING A RULE -----------------------------------------------------------------
# REAL DUTIES THAT GO UNREPORTED TODAY. This bucket means the opposite of articles_out_of_scope:
# not "the tool considered this and correctly says nothing", but "a party owes this and no report
# mentions it". Filing any of these as an exclusion would turn a known gap into apparent coverage,
# which is the single failure this ledger exists to prevent — so the two are kept apart and a test
# forbids an entry here from claiming the cascade handles it.
#
# Keyed by article and nested by division, the same shape as the section above. Every one sits
# inside an article that section counts as IN SCOPE, which is why they need naming here: nothing
# else in the repo would show them as missing.
#
# Emptying this bucket is the work. Editing it away is not.
articles_awaiting_rules:
  11:
    2: >-
      A SINGLE set of technical documentation where the system relates to a Section A Annex I
      product, containing both this Regulation's information and the sectoral instrument's.
      AIA-HR-A11 cites 11(1) only, so an Annex I provider is told to draw up documentation and never
      told it must be one document. Narrow: applies_to_route annex_i.
  12:
    2: >-
      WHAT the logging must enable — events identifying an Art. 79(1) risk or a substantial
      modification, events supporting Art. 72 post-market monitoring, and events supporting the
      deployer's Art. 26(5) monitoring. AIA-HR-A12 cites 12(1), the bare capability, so a system
      that logs anything at all satisfies the rule while recording none of the three.
    3: >-
      Minimum logging for Annex III point 1(a) systems: period of each use, the reference database,
      the input data that matched, and the persons who verified the result. Document-verifiable and
      area-specific — applies_to_annex_iii_area biometrics.
  20:
    2: >-
      Where the system presents an Art. 79(1) risk, the provider must investigate the causes with
      the reporting deployer and inform the market surveillance authorities. AIA-PO-A20 cites 20(1),
      the corrective-action duty, which is a different obligation with a different trigger.
  21:
    2: >-
      Give a competent authority access to the automatically generated logs on reasoned request.
      AIA-PO-A21 cites 21(1), which covers information and documentation but not log access.
  25:
    4: >-
      A WRITTEN AGREEMENT between the provider and any third party supplying an AI system, model,
      tools, services, components or processes integrated into the high-risk system, specifying the
      information, capabilities and technical access needed for the provider to comply. Carve-out
      for free and open-source suppliers other than GPAI models. AIA-IP-A25-2 covers 25(2), which
      only fires once the provider role has already moved, so a provider building on a third-party
      model is told nothing.
      Belongs in this bucket rather than the one above. The standing argument for leaving it
      unmodelled — it is discharged in a contract with a component supplier, not in the technical
      file — argues for document_verifiable false, which is what the entire AIA-PO-* family carries.
      A duty invisible in the file is reported as confirm-separately, never dropped.
  27:
    3: >-
      Notify the market surveillance authority of the FRIA result, submitting the Art. 27(5)
      template. AIA-DP-A27 cites 27(1), so the judge sees the assessment's required contents and
      never the duty to file it. A complete FRIA that is never sent passes.
  43:
    4: >-
      A NEW conformity assessment on substantial modification, and the rule that pre-determined
      changes to a continuously learning system are not substantial modifications. A standing duty
      for the life of the system; all three Art. 43 rules cite only the initial assessment.
  47:
    2: >-
      The declaration must state conformity with Section 2, contain the Annex V information, and be
      translated for the Member States where the system is placed. AIA-PO-A47 cites 47(1) — drawing
      it up and keeping it ten years — so its CONTENTS are checked by nothing. Brings Annex V into
      scope.
    4: >-
      By drawing up the declaration the provider assumes responsibility for Section 2 compliance and
      must keep the declaration up to date. The maintenance duty is continuous and uncited.
  48:
    2: >-
      A DIGITAL CE marking for systems provided digitally, accessible via the interface or a
      machine-readable code. AIA-PO-A48 cites 48(3), the affixing duty written for physical goods,
      which is the wrong half for most systems this tool will review.
    4: >-
      Where a notified body was involved, the CE marking must be followed by its identification
      number. Applies on the Annex VII route that Art. 43(1) opens for Annex III point 1.
  49:
    5: >-
      Annex III point 2 systems "shall be registered at NATIONAL level". AIA-PO-A49 excludes
      critical infrastructure from EU-database registration and its comment states that critical
      infrastructure "owes no registration" — which is wrong on the text. It owes no EU-database
      registration; this duty is real and carried by nothing.
  50:
    5: >-
      The Art. 50(1)-(4) information must be given clearly and distinguishably, at the latest at the
      first interaction or exposure, and must meet applicable accessibility requirements. All four
      Art. 50 rules cite only their own paragraph, so a disclosure buried in a footer passes
      AIA-TR-A50-1. This qualifies all four duties rather than adding a fifth.
  72:
    2: >-
      The monitoring system must actively and systematically collect, document and analyse
      performance data over the system's lifetime. AIA-PO-A72 cites 72(1), which requires only that
      a system be established and documented.
    3: >-
      The post-market monitoring PLAN shall be part of the Annex IV technical documentation. This is
      the document-verifiable half of Art. 72 — it is in the file under review — while AIA-PO-A72
      carries document_verifiable false on the strength of 72(1) alone.
  73:
    2: >-
      The reporting deadline: immediately on establishing a causal link, and in any event within 15
      days. AIA-PO-A73 tells a provider they must report a serious incident and not by when.
    3: Two days for a widespread infringement or an Art. 3(49)(b) incident. Same gap as 73(2).
    4: Immediately on death, on suspicion of a causal link. Same gap as 73(2).
    5: Permission to file an incomplete initial report followed by a complete one. Same gap as 73(2).
    6: >-
      After reporting, the provider must investigate, risk-assess the incident, cooperate with
      authorities and the notified body, and NOT alter the system before informing them. A distinct
      post-report duty that AIA-PO-A73's citation of 73(1) does not reach.

# --- ANNEXES ---------------------------------------------------------------------------------
# The Annexes carry operative content the Articles only point at: Annex III IS the list of high-risk
# areas, Annex I IS the list of harmonisation instruments, Annex IV IS the technical documentation an
# Art. 11 file must contain. An amendment can land in an Annex without a single word of the Articles
# changing — this consolidation added Annex XIV and moved the Machinery Regulation into Annex I
# Section B, from which Art. 2(2) withholds Chapter III.
#
# An annex is IN SCOPE if a rule cites it (source.annex) or the classification cascade supplies it
# as context: Annexes I, III, IV, VI and VIII. That is a claim that some part of the tool reads the
# annex, NOT that its contents have been modelled — Annex IV is cited by AIA-HR-A11 and its element
# list is not itself checked.
annexes_out_of_scope:
  II: >-
    List of criminal offences for the Art. 5(1)(h)(iii) exception to the real-time remote biometric
    identification ban. The cascade reports the practice as prohibited and hands the
    national-authorisation question over rather than adjudicating the exception, so the offence list
    is never applied. Over-inclusive in the safe direction: a use a Member State has authorised is
    reported as prohibited rather than cleared.
  IX: >-
    Registration information for real-world testing under Art. 60, which is out of scope as an
    optional route rather than a standing duty.
  X: >-
    Union legislative acts on large-scale IT systems in Freedom, Security and Justice. A reference
    list for the Annex III(7) migration area; creates no duty of its own.
  XI: Technical documentation for GPAI model providers (Art. 53(1)(a)). Chapter V, deferred (M4d-8).
  XII: Transparency information for GPAI providers to downstream providers. Chapter V (M4d-8).
  XIII: Criteria for designating GPAI models with systemic risk (Art. 51). Chapter V (M4d-8).
  XIV: >-
    NEW in this version. Codes, categories and types of AI system used to scope a notified body's
    designation under Arts. 29 and 30. Duties of conformity assessment bodies and notifying
    authorities, both already out of scope. Recorded because it appeared in the store unnoticed —
    the whole reason this section now exists.

# ANNEXES A RULE SHOULD REACH AND DOES NOT. Same split, and for the same reason: an annex the tool
# ought to read is not an annex the tool has decided against. Both of these are consequences of a
# rule citing too narrowly, so each is emptied by fixing that rule rather than by writing an annex
# rule of its own.
annexes_awaiting_rules:
  V: >-
    Contents of the EU declaration of conformity. Art. 47(2) requires the declaration to contain the
    Annex V information, and AIA-PO-A47 cites 47(1) — drawing the declaration up and keeping it ten
    years — so nothing checks what is in it. Reached when 47(2) leaves articles_awaiting_rules.
  VII: >-
    Conformity based on an assessment of the quality management system and of the technical
    documentation — the notified-body route Art. 43(1)(b) offers for Annex III point 1. AIA-PO-A43-1
    carries that duty and cites NEITHER Annex VI nor Annex VII, though it is the one rule in the
    spec where a notified body can be involved. Annex VI is in scope only because AIA-PO-A43-2
    happens to cite it for the internal-control route; Annex VII is reached by no rule at all.

