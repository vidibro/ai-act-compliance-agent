      financial services law. An accommodation, AND NOT A COMPLETE ONE: the deeming runs "with the
      exception of paragraph 1, points (g), (h) and (i)", so the risk management system, the
      post-market monitoring system and the serious-incident reporting procedures are still owed
      under Art. 17(1) by a financial institution that complies with its sectoral governance rules
      in full. AIA-PO-A17-4 renders the financial-institution route, while AIA-PO-A17 keeps the
      three excepted Article 17(1) duties visible.
