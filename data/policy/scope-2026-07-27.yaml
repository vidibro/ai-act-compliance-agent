    6: Art. 58 — delegated acts on ATM/ANS. Binds the Commission.
  109: Amendment to Regulation (EU) 2019/2144 — amends another instrument.
  110: Amendment to Directive (EU) 2020/1828 — amends another instrument.
  # Art. 111 is the TRANSITIONAL REGIME, and it is REPORTED, NEVER APPLIED — never by a rule,
  # because every limb turns on the date the system or model was placed on the market, which no
  # system card states. A condition to read, never to derive, like Art. 6(1)(b) and Art. 2(4).
  # Every limb is RELIEF of one kind or another, and applying a relief wrongly clears a reader,
  # which is the one error this tool must not make — so each is named and none is acted on.
  #
  # ComplianceReport.legacy_system_note carries three of the four, one limb each: 111(2) for the
  # high-risk track, 111(3) for a general-purpose model, 111(4) for the Art. 50(2) marking duty.
  # 111(1) is out of scope by subject rather than reported.
  111:
    1: >-
      Annex X large-scale IT system components placed before 2 August 2027 comply by 31 December
      2030, and the requirements are taken into account when those legal acts are evaluated. A
      TRANSITIONAL DEFERRAL, and its subject is the AI SYSTEM that is a component — whose provider
      is an ordinary provider this tool does assess — rather than the Annex X system it sits in. It
      is out because the paragraph only POSTPONES: this tool applies the Regulation to such a
      component now, which is over-inclusive against a provider entitled to wait until 31 December
      2030, and over-inclusive is the direction it accepts.
    2: >-
      RELIEF, and the widest thing in this Article. A high-risk system placed on the market before
      Chapter III applies to it — 2 December 2027 by the Annex III route, 2 August 2028 by Annex I,
      per Art. 113(c) — is reached only once SIGNIFICANTLY REDESIGNED. Not the Art. 5 prohibitions,
      and not a system intended for public authorities, which comply by 2 August 2030 regardless.
      Worth a practitioner's eye: the original Act fixed this window at "before 2 August 2026", and
      this version replaced the fixed date with a cross-reference to Chapter III's own application
      date, which then moved sixteen months later. The window widened as a consequence, and on a
      literal reading it now covers most high-risk systems on the market today. Whether that was
      intended is not a question this tool can answer, which is why it is named and never acted on.
    3: >-
      Legacy general-purpose AI models placed before 2 August 2025 comply by 2 August 2027 — a
      DEFERRAL of the Chapter V duties the AIA-GP-* rules carry, and the one date in this ruleset
      that runs later than the obligation it defers. Not gated on: whether a model was placed
      before 2 August 2025 is not a fact the cascade asks, so nothing is withheld on it and the
      limb is reported instead, by ComplianceReport._article_111_3_note.
    4: >-
      RELIEF at a shorter range: a synthetic-content generator placed before 2 August 2026 has until
      2 December 2026 for Art. 50(2) — LATER than the date AIA-TR-A50-2 carries. Reported in the
      legacy note; the rule's own date is corrected as part of M4d-5, when dates become live.
  112:
    1: Annual Commission assessment of the need to amend Annex III and Art. 5. Institutional.
    2: Four-yearly evaluation and report on the (a)-(c) subjects. Institutional.
    3: Four-yearly report on the evaluation and review of the Regulation. Institutional.
    4: What those reports pay attention to, points (a)-(d). Institutional.
    5: Evaluation of the AI Office's powers and competences by 2 August 2028. Institutional.
    6: Report on energy-efficient development of general-purpose models. Institutional.
    7: Three-yearly evaluation of the Art. 95 voluntary codes of conduct. Institutional.
    8: The Board, Member States and authorities supply information on request. Institutional.
    9: The Commission takes account of the Board's and the institutions' positions. Institutional.
    10: The Commission may propose amendments to the Regulation. Institutional.
    11: >-
      The AI Office develops a methodology for evaluating risk levels and for including new systems in
      the (a)-(c) lists — Annex III, the Art. 5 prohibitions, and the Art. 50 transparency list. The
      machinery by which this tool's three classification vocabularies would change; a reason to
      derive them from the stored text rather than to type them out, not a duty of anyone.
    12: Amendments touching Section B Annex I legislation respect each sector's specificities. Institutional.
    13: Assessment of enforcement by 2 August 2031. Institutional.
  # Art. 113 is what every rule's effective_date is read from, and the amended dates are here rather
  # than in Chapter III: the Chapter III Sections 1-3 obligations now apply from 2 December 2027 by
  # the Annex III route and 2 August 2028 by the Annex I route. Point (a)'s carve-out is the other
  # half of the same picture — two Art. 5 prohibitions do not bite until 2 December 2026.
  113:
    chapeau: >-
      Entry into force on the twentieth day after publication, and — the sentence that matters —
      "IT SHALL APPLY FROM 2 AUGUST 2026". That is the general application date every rule's
      `effective_date` is read from, and points (a) to (d) below are the exceptions to it. Not a
      duty on any role, and the most load-bearing text in this Article: a rule dated from anything
      else is dated from nothing.
    a: >-
      Chapters I and II from 2 February 2025, except Art. 5(1) points (ba) and (bb) and Art. 5(1a)
      and (1b), which apply from 2 December 2026. Two prohibitions not yet in force, and the reason a
      report must distinguish a duty owed now from one owed later.
    b: >-
      Chapter III Section 4, Chapter V, Chapter VII, Chapter XII and Art. 78 from 2 August 2025,
      except Art. 101. A date, not a duty. Chapter V is modelled — nineteen AIA-GP-* rules for
      Arts. 52 to 55 — and this is the paragraph that makes them live: they have applied since
      2 August 2025, ahead of everything on the Art. 6 track.
    c: >-
      Chapter III Sections 1, 2 and 3, except Art. 6(5), from 2 DECEMBER 2027 for Art. 6(2)/Annex III
      systems and 2 AUGUST 2028 for Art. 6(1)/Annex I systems. The dates almost every rule in
      spec.yaml turns on, and what Art. 111(2)'s relief window is measured against.
    d: Arts. 102 to 110 from 27 July 2026. The sectoral amendments, now in force.

# --- ARTICLES AWAITING A RULE -----------------------------------------------------------------
# REAL DUTIES THAT GO UNREPORTED TODAY. Separate from `article_rulings` because it says something
# different: not "here is what accounts for this provision", but "a party owes this and nothing
# accounts for it". Filing one of these as a ruling would turn a known gap into apparent coverage,
# which is the single failure this ledger exists to prevent — so a test forbids an entry here from
# claiming the cascade handles it, and another forbids the same address appearing in both.
#
# Keyed by article and nested by division, the same shape as the section above. Every one sits
# inside an article that section counts as IN SCOPE, which is why they need naming here: nothing
# else in the repo would show them as missing.
#
# Emptying this bucket is the work. Editing it away is not.
articles_awaiting_rules:
  # EMPTY, and the mechanism stays. Every duty this Regulation puts on a role this tool reports
  # for is now carried by a rule — the Art. 6 track in Chapters II and III, and Chapter V for a
  # general-purpose AI model. An entry here means a party owes something and no report mentions
  # it, which is a stronger claim than a dismissal and is why the section is separate from
  # article_rulings rather than folded into it.
  #
  # What is NOT recorded here, because it is not a duty: the Art. 51 systemic-risk line, which no
  # cascade node asks. Every Art. 55 rule states it as an activation_condition instead, so the
  # obligation reaches the reader with the question attached rather than being withheld. Same for
  # the Art. 53(2) and 54(6) open-source carve-out. Both are missing QUESTIONS, and the place
  # they are recorded is the Art. 51 ruling above.
  {}

# --- ANNEXES ---------------------------------------------------------------------------------
# The Annexes carry operative content the Articles only point at: Annex III IS the list of high-risk
# areas, Annex I IS the list of harmonisation instruments, Annex IV IS the technical documentation an
# Art. 11 file must contain. An amendment can land in an Annex without a single word of the Articles
# changing — this consolidation added Annex XIV and moved the Machinery Regulation into Annex I
# Section B, from which Art. 2(2) withholds Chapter III.
#
# An annex is IN SCOPE if a rule cites it (source.annex) or the classification cascade supplies it
# as context: Annexes I, III, IV, VI and VIII. That is a claim that some part of the tool reads the
# annex, NOT that its contents have been modelled — Annex IV is cited by AIA-HR-A11 and its element
# list is not itself checked.
annex_rulings:
  # Annex I: EVERY ITEM IS AN ANSWER THE CASCADE CAN GIVE. AnnexIProduct holds one member per
  # instrument and tests/test_vocabulary.py derives the list from this file, so an instrument added
  # by amendment fails CI rather than becoming a system the cascade cannot classify. The Section
  # decides what follows: Section A carries Chapter III, Section B has it withheld by Art. 2(2).
  I:
    A/chapeau: >-
      A Section heading, not enacted content: it names what the list below it is — Union
      harmonisation legislation based on the New Legislative Framework. What turns on the Section
      is decided elsewhere, in Art. 6(1)'s reference to Section A and Art. 2(2)'s withholding of
      Chapter III from Section B.
    B/chapeau: >-
      A Section heading, as A/chapeau. It names the list as other Union harmonisation legislation
      — the instruments Art. 2(2) reaches, from which Chapter III is withheld.
    A/1: >-
      CASCADE annex_i — Directive 2006/42/EC, machinery. Section A, Chapter III applies. THE
      DEFAULT ANSWER FOR A MACHINE: the Regulation at B/21 replaces this Directive only from
      20 January 2027, so anything on the market before then is governed here, and the node says so
      rather than leaving the model to choose on how modern the machine sounds.
      THAT DATE IS NOT IN THIS CORPUS. It is Art. 54 of Regulation (EU) 2023/1230; the Annex gives
      the OJ reference and the repeal, not the application date, so the node states a fact about
      external law that nothing here can check — the one such fact in any question. Two bounds make
      it tolerable: the default it supports is Section A, which is the OVER-inclusive side, and the
      instruction answers on the instrument the document names rather than on the date. It goes
      stale on 20 January 2027, when the default should become B/21, and nothing reads a clock.
    A/2: CASCADE annex_i — Directive 2009/48/EC, toy safety. Section A.
    A/3: CASCADE annex_i — Directive 2013/53/EU, recreational craft and personal watercraft. Section A.
    A/4: CASCADE annex_i — Directive 2014/33/EU, lifts and safety components. Section A.
    A/5: CASCADE annex_i — Directive 2014/34/EU, equipment for explosive atmospheres. Section A.
    A/6: CASCADE annex_i — Directive 2014/53/EU, radio equipment. Section A.
    A/7: CASCADE annex_i — Directive 2014/68/EU, pressure equipment. Section A.
    A/8: CASCADE annex_i — Regulation (EU) 2016/424, cableway installations. Section A.
    A/9: CASCADE annex_i — Regulation (EU) 2016/425, personal protective equipment. Section A.
    A/10: CASCADE annex_i — Regulation (EU) 2016/426, gas-burning appliances. Section A.
    A/11: CASCADE annex_i — Regulation (EU) 2017/745, medical devices. Section A.
    A/12: CASCADE annex_i — Regulation (EU) 2017/746, in vitro diagnostic medical devices. Section A.
    B/13: CASCADE annex_i — Regulation (EC) No 300/2008, civil aviation security. Section B.
    B/14: CASCADE annex_i — Regulation (EU) No 168/2013, two- and three-wheel vehicles and
      quadricycles. Section B.
    B/15: CASCADE annex_i — Regulation (EU) No 167/2013, agricultural and forestry vehicles. Section B.
    B/16: CASCADE annex_i — Directive 2014/90/EU, marine equipment. Section B.
    B/17: CASCADE annex_i — Directive (EU) 2016/797, rail system interoperability. Section B.
    B/18: CASCADE annex_i — Regulation (EU) 2018/858, motor vehicle approval. Section B.
    B/19: CASCADE annex_i — Regulation (EU) 2019/2144, vehicle general safety. Section B.
    B/20: CASCADE annex_i — Regulation (EU) 2018/1139, civil aviation and unmanned aircraft. Section B.
    B/21: >-
      CASCADE annex_i — Regulation (EU) 2023/1230, the MACHINERY REGULATION. Section B, and kept
      apart from A/1 for that reason: the Directive it replaces sits in Section A and carries
      Chapter III, while this one does not. The Directive is repealed on 20 January 2027.
      THE COSTLIEST ANSWER IN THIS ANNEX. Art. 2(2) withholds Chapter III from Section B, so this
      item returns an empty obligation set for every role — a report with no findings at all. The
      node offers each option with its instrument attached rather than as a bare identifier,
      because `machinery` and `machinery_regulation` are synonyms as words and opposites as law,
      and it answers this one only where the document names Regulation (EU) 2023/1230 itself.
  II: >-
    List of criminal offences for the Art. 5(1)(h)(iii) exception to the real-time remote biometric
    identification ban. The cascade reports the practice as prohibited and hands the
    national-authorisation question over rather than adjudicating the exception, so the offence list
    is never applied. Over-inclusive in the safe direction: a use a Member State has authorised is
    reported as prohibited rather than cleared.
  # Annex III: the eight high-risk areas, one AnnexIIIArea member each, derived and enforced the
  # same way as Annex I. The area also gates the rules the Act narrows — Art. 14(5) biometrics,
  # Art. 26(10) law enforcement, Art. 49's exception for point 2.
  III:
    chapeau: >-
      CASCADE annex_iii — the operative sentence of Annex III: a system in any of the eight areas
      below is high-risk PURSUANT TO ART. 6(2). The cascade supplies this annex whole to the area
      question, which is where the sentence is applied; the items below say which area.
    1: CASCADE annex_iii — biometrics; remote identification, categorisation, emotion recognition.
    2: >-
      CASCADE annex_iii — critical infrastructure: safety components in digital infrastructure,
      traffic, and the supply of water, gas, heating and electricity. The point Art. 49(1) and (3)
      except from registration, and the one Art. 43(6) may move to the Annex VII route.
      THE ONE AREA THE NODE DECIDES ON A DIFFERENT TEST, and the node says so in terms. The other
      seven points each name natural persons, so the question turns on whether the purpose acts on
      a person or their application. Point 2's subject is a pipe, a road or a grid, so a signal
      controller satisfies that test's OUT limb word for word and would be reported `minimal` —
      one obligation in the whole report, for a system whose failure kills people. It is decided
      instead on Art. 3(14): a safety function, or a failure that endangers health and safety.
      The person test does reach every other area correctly, which is why this one is carved out
      rather than the test loosened.
    3: CASCADE annex_iii — education and vocational training; admission, evaluation, proctoring.
    4: >-
      CASCADE annex_iii — employment: recruitment and selection (4(a)); and decisions AFFECTING THE
      TERMS of work-related relationships, promotion, termination, task allocation, and monitoring
      and evaluation of performance and behaviour (4(b)).
      THE OUT-OF-SCOPE EXAMPLES IN THE NODE'S TEST (ii) ARE A READING, NOT A QUOTATION. Points 1 and
      3 to 8 enact no exclusion at all — unlike Annex III(2), whose test the Act supplies through
      Art. 6(1a) and (1b) — so every item in that list is the tool's own and none of it is derived
      from a document. "Payroll" is the item that bites: payroll PROCESSING disburses pay already
      agreed and is genuinely outside, while anything setting or adjusting pay, bonus, grade or
      benefits is a decision affecting the terms of a work-related relationship and is squarely
      inside 4(b). The node now says which way that cuts and states that the listed function wins
      over its own examples; nothing mechanical checks the rest of the list.
    5: >-
      CASCADE annex_iii — essential private and public services: benefits eligibility,
      creditworthiness, life and health insurance pricing, emergency call triage.
    6: CASCADE annex_iii — law enforcement; victim risk, polygraphs, evidence reliability, profiling.
    7: CASCADE annex_iii — migration, asylum and border control; polygraphs, risk assessment, applications.
    8: CASCADE annex_iii — administration of justice and democratic processes.
  # Annex IV is the CONTENT of the Art. 11 technical documentation and AIA-HR-A11 cites Art. 11
  # whole, so the judge reads this list. Ruled per item all the same, because a shared verdict on
  # "is there a technical file" says nothing about whether the file holds point 2(g)'s validation
  # metrics. Several items point at an Article a rule already checks in its own right; where they
  # do, the item says which, so a reader is not told the same thing twice.
  IV:
    chapeau: >-
      RULE AIA-HR-A11 — the qualifier governing all nine elements: the technical documentation
      shall contain AT LEAST the information below, AS APPLICABLE TO THE RELEVANT AI SYSTEM. Both
      limbs bind — the list is a floor, and an element that does not apply to the system is not
      owed.
    1: RULE AIA-HR-A11 — general description of the system, points (a)-(h).
    2: >-
      RULE AIA-HR-A11 — detailed description of the system and its development, points (a)-(h):
      methods and steps, design specifications, architecture, data requirements, the Art. 14 human
      oversight assessment, pre-determined changes, validation and testing procedures, cybersecurity.
    3: RULE AIA-HR-A11 — monitoring, functioning and control, including accuracy and foreseeable risks.
    4: RULE AIA-HR-A11 — appropriateness of the performance metrics for this system.
    5: RULE AIA-HR-A11 — detailed description of the Art. 9 risk management system.
    6: RULE AIA-HR-A11 — relevant changes made through the system's lifecycle.
    7: RULE AIA-HR-A11 — harmonised standards applied, or the solutions adopted where none were.
    8: RULE AIA-HR-A11 — a copy of the Art. 47 EU declaration of conformity, which AIA-PO-A47 checks.
    9: >-
      RULE AIA-HR-A11 — the Art. 72 post-market monitoring system and plan. Art. 72(3) is what
      requires the plan to sit here, and AIA-PO-A72 carries it as a qualifier; this item is where
      the plan must live.
# ANNEXES A RULE SHOULD REACH AND DOES NOT. Same split, and for the same reason: an annex the tool
# ought to read is not an annex the tool has decided against. Both of these are consequences of a
# rule citing too narrowly, so each is emptied by fixing that rule rather than by writing an annex
# rule of its own.
  # ANNEX V IS THE DECLARATION OF CONFORMITY'S CONTENT, and AIA-PO-A47-2 is the rule for it —
  # Art. 47(2) requires the declaration to state conformity with Section 2 and to carry this
  # information. That rule is document_verifiable false, as the declaration is an administrative
  # artefact rather than part of the technical file, so no judge is shown these items; what the
  # rule does is tell the reader what has to be on the page and what is most often missing.
  # Every item is document-verifiable in itself: the declaration is a single page, and this is it.
  V:
    chapeau: >-
      RULE AIA-PO-A47-2 — the declaration shall contain ALL of the information below, which is a
      stricter chapeau than Annex IV's: no element of Annex V falls away as inapplicable.
    1: >-
      RULE AIA-PO-A47-2 — The system's name and type, and any reference allowing identification
      and traceability.
    2: >-
      RULE AIA-PO-A47-2 — The name and address of the provider or, where applicable, of the
      authorised representative.
    3: >-
      RULE AIA-PO-A47-2 — A statement that the declaration is issued under the SOLE RESPONSIBILITY
      of the provider.
    4: >-
      RULE AIA-PO-A47-2 — A statement that the system conforms with this Regulation and with any
      other Union law requiring a declaration of conformity. The operative sentence of the
      document.
    5: >-
      RULE AIA-PO-A47-2 — Where personal data is processed, a statement of compliance with
      Regulations (EU) 2016/679 and 2018/1725 and Directive (EU) 2016/680. Absent from most
      templates written for this Regulation alone, and required whenever the system touches
      personal data.
    6: >-
      RULE AIA-PO-A47-2 — References to the harmonised standards or common specifications
      conformity is declared against.
    7: >-
      RULE AIA-PO-A47-2 — Where applicable, the notified body's name and identification number,
      the procedure performed, and the certificate issued. Populated only on the Annex VII route.
    8: >-
      RULE AIA-PO-A47-2 — Place and date of issue, the signatory's name and function, on whose
      behalf they signed, and a SIGNATURE. An unsigned declaration does not satisfy Art. 47.

  # Annex VI is the internal-control conformity assessment route, and TWO RULES REACH IT because
  # two paragraphs of Art. 43 do. Art. 43(2) makes it compulsory for Annex III points 2 to 8, which
  # is AIA-PO-A43-2; Art. 43(1)(a) lets a point 1 provider that applied harmonised standards ELECT
  # it, which is AIA-PO-A43-1. Naming only the first would rule the Annex covered by a rule gated
  # away from biometrics, so a provider that elected this route would be told it took a route and
  # never told what the route consists of. Its four points are the procedure itself, performed by
  # the provider without a notified body.
  VI:
    1: >-
      RULE AIA-PO-A43-2 AIA-PO-A43-1A — the procedure is points 2, 3 and 4. Definitional.
    2: >-
      RULE AIA-PO-A43-2 AIA-PO-A43-1A — verify the Art. 17 quality management system, which
      AIA-PO-A17 checks.
    3: >-
      RULE AIA-PO-A43-2 AIA-PO-A43-1A — examine the technical documentation against the Section 2
      requirements.
    4: >-
      RULE AIA-PO-A43-2 AIA-PO-A43-1A — verify that design, development and Art. 72 post-market
      monitoring are consistent with the technical documentation.
  # ANNEX VII is the notified-body conformity assessment route Art. 43(1) offers for Annex III
  # point 1, and AIA-PO-A43-1B is the rule for it. AIA-PO-A43-1 carries the CHOICE between the
  # two branches and names neither annex, so the branches are ruled where they are written:
  # Annex VI under AIA-PO-A43-2 and AIA-PO-A43-1, Annex VII here.
  #
  # A SECOND ROUTE REACHES SIX OF THESE POINTS, and it is not an Annex III route at all. Art. 43(3)
  # applies "points 3, 4.3, 4.4. and 4.5, the fifth paragraph of point 4.6 and point 5 of Annex
  # VII" to an ANNEX I SECTION A provider, on top of that product's own sectoral assessment.
  # AIA-PO-A43-1B is gated to biometrics and never fires for such a provider, so those points are
  # ruled to AIA-PO-A43-3 as well and that rule states each of them.
  #
  # No rule here is document_verifiable, so no judge reads either annex — what they do is tell a
  # provider on each route what the route consists of. For Annex VII that is two applications, a
  # written declaration of exclusivity on each, two grants of access, and a duty to notify changes
  # that runs for as long as the certificate stands.
  VII:
    1: >-
      RULE AIA-PO-A43-1B — the procedure is points 2 to 5. Definitional, and it is what the rule
      cites.
    2: >-
      RULE AIA-PO-A43-1B — overview: the Art. 17 quality management system is examined under point
      3 and kept under surveillance under point 5; the technical documentation is examined under
      point 4.
    3: >-
      RULE AIA-PO-A43-1B AIA-PO-A43-3 — QUALITY MANAGEMENT SYSTEM. 3.1 lists what the provider's
      application must contain, points (a)-(f) — the systems covered, the technical documentation for each,
      the Art. 17 documentation, the procedures keeping the system adequate, and a written
      declaration that the same application is with no other notified body. 3.3 has the provider
      CONTINUE to implement and maintain the approved system, and 3.4 has any intended change
      brought to the notified body.
    4: >-
      RULE AIA-PO-A43-1B AIA-PO-A43-3 — CONTROL OF THE TECHNICAL DOCUMENTATION. 4.2's
      application must contain the provider's name, a written declaration of exclusivity, and the Annex IV documentation;
      4.3 has the notified body granted FULL ACCESS to the training, validation and testing data
      sets, where relevant and limited to what is necessary, through an API where appropriate; 4.4
      lets the body require further evidence or further tests, and carry out its own where it is
      not satisfied with the provider's; 4.5 adds access to the training and trained models and
      their parameters where other means are exhausted; the fifth paragraph of 4.6 requires
      RE-TRAINING before a new application where the system fails the training-data requirement;
      and 4.7 has the provider notify any change that could affect compliance. The access duty is
      Art. 74(12) on the notified-body route. RULE AIA-PO-A43-3 carries 4.3, 4.4, 4.5 and the fifth
      paragraph of 4.6 for the Annex I Section A route, which Art. 43(3) applies them to; 4.1, 4.2
      and 4.7 it does not name, and they stay with AIA-PO-A43-1B alone.
    5: >-
      RULE AIA-PO-A43-1B AIA-PO-A43-3 — SURVEILLANCE. 5.2 has the provider allow the notified
      body onto the premises where design, development and testing happen and share all necessary
      information; 5.3 has the body audit periodically. A continuing duty for as long as the certificate
      stands.

  # ANNEX VIII IS THE CONTENT OF THE ART. 49 REGISTRATIONS, and Arts. 71(2) and (3) are what put it
  # there: AIA-PO-A71-2 for the high-risk provider's Section A, AIA-NHR-A71-2 for the Section B a
  # provider derogating under Art. 6(3) enters, AIA-DP-A71-3 for the public-authority
  # deployer's Section C. AIA-PO-A49, AIA-NHR-A06-4 and AIA-DP-A49-3 carry the duty to register at
  # all — their subject is Art. 49(1), 6(4) and 49(3), and the Annex they cite is III, the area
  # gate — so the split between registering and what is entered runs along the Article boundary.
  #
  # NO JUDGE SEES ANY OF THE 27 ITEMS, and no rule here changes that. Every rule citing this Annex
  # is document_verifiable false, so the loader fills annex_context and no prompt is ever built;
  # AIA-ALL-A49-4, for Art. 49(4), is the same. Registration is an act against a registry, not a
  # property of a file, so what these rules give a reader is the list to check themselves.
  VIII:
    A/chapeau: >-
      RULE AIA-PO-A71-2 — information submitted BY PROVIDERS under Art. 49(1), provided and
      THEREAFTER KEPT UP TO DATE. The upkeep duty is in the chapeau and in none of the thirteen
      items.
    B/chapeau: >-
      RULE AIA-NHR-A71-2 — the same, for a system the provider concluded is not high-risk and
      registers under Art. 49(2). THE HEADING AND THE PARAGRAPH IT CITES DISAGREE, and this is the
      one place a ruling here reads a heading against its own words: the OJ writes "by providers of
      HIGH-RISK AI systems in accordance with Article 49(2)", while Art. 49(2) is the registration
      of a system the provider concluded under Art. 6(3) is NOT high-risk. The paragraph governs —
      Section B point 6 asks WHICH Art. 6(3) condition the system relies on, which only a
      not-high-risk claim has — so the duty-holder is read from Art. 49(2). Sections A and C need
      no such reading and get none; C/chapeau below takes its heading at face value.
    C/chapeau: >-
      RULE AIA-DP-A71-3 — the same, for information submitted BY DEPLOYERS under Art. 49(3). The
      section heading is the only place the Act says which party owes this block.
    A/1: >-
      RULE AIA-PO-A71-2 — the provider's name, address and contact details. Registry
      identification.
    A/2: >-
      RULE AIA-PO-A71-2 — details of a person submitting on the provider's behalf. Registry
      identification.
    A/3: >-
      RULE AIA-PO-A71-2 — the authorised representative's details where applicable. The
      appointment itself is Art. 22, cited at 22(1) by AIA-PO-A22.
    A/4: >-
      RULE AIA-PO-A71-2 — trade name and any reference allowing identification and traceability.
    A/5: >-
      RULE AIA-PO-A71-2 — the intended purpose, components and functions. Also Annex IV(1)(a).
    A/6: >-
      RULE AIA-PO-A71-2 — a concise description of the data, inputs and operating logic.
    A/7: >-
      RULE AIA-PO-A71-2 — the system's status; on the market, withdrawn, or recalled. Registry
      state.
    A/8: >-
      RULE AIA-PO-A71-2 — type, number and expiry of the notified body certificate, where
      applicable. Exists only on the Annex VII route, which AIA-PO-A43-1 covers.
    A/9: >-
      RULE AIA-PO-A71-2 — a scanned copy of that certificate, where applicable.
    A/10: >-
      RULE AIA-PO-A71-2 — the Member States where the system has been placed on the market.
    A/11: >-
      RULE AIA-PO-A71-2 — a copy of the Art. 47 EU declaration of conformity, which AIA-PO-A47
      checks.
    A/12: >-
      RULE AIA-PO-A71-2 — electronic instructions for use, withheld for law enforcement,
      migration, asylum and border control systems. The instructions themselves are Art. 13,
      checked by AIA-HR-A13 and AIA-HR-A13-3.
    A/13: >-
      RULE AIA-PO-A71-2 — a URL for additional information, expressly OPTIONAL. Not a duty at all.
    B/1: >-
      RULE AIA-NHR-A71-2 — the provider's name, address and contact details.
    B/2: >-
      RULE AIA-NHR-A71-2 — details of a person submitting on the provider's behalf.
    B/3: >-
      RULE AIA-NHR-A71-2 — the authorised representative's details, where applicable.
    B/4: >-
      RULE AIA-NHR-A71-2 — trade name and identification reference.
    B/5: >-
      RULE AIA-NHR-A71-2 — a description of the intended purpose.
    B/6: >-
      RULE AIA-NHR-A71-2 — WHICH Art. 6(3) condition the system relies on. The substance of the
      not-high-risk claim, and what Art. 80(1) puts an authority onto.
    B/7: >-
      RULE AIA-NHR-A71-2 — a short summary of the grounds for the not-high-risk conclusion. The
      Art. 6(4) assessment, written down; misstating it attracts the Art. 80(7) fine.
    B/8: >-
      RULE AIA-NHR-A71-2 — the system's status. Registry state.
    B/9: >-
      RULE AIA-NHR-A71-2 — the Member States where it has been placed on the market.
    C/1: >-
      RULE AIA-DP-A71-3 — the deployer's name, address and contact details.
    C/2: >-
      RULE AIA-DP-A71-3 — details of the person submitting on the deployer's behalf.
    C/3: >-
      RULE AIA-DP-A71-3 — the URL of the provider's own entry for the system. Links the two
      entries.
    C/4: >-
      RULE AIA-DP-A71-3 — a summary of the Art. 27 FUNDAMENTAL RIGHTS IMPACT ASSESSMENT findings.
      The assessment is checked by AIA-DP-A27; this item is where its summary must be lodged, and
      Art. 27(3) — notifying the authority — is cited by AIA-DP-A27-3.
    C/5: >-
      RULE AIA-DP-A71-3 — a summary of the data protection impact assessment under Art. 35 GDPR or
      Art. 27 of Directive (EU) 2016/680, as Art. 26(9) specifies. Settled by data protection law
      this tool does not carry; the item is the registration of its summary.

  # Annex IX is what Art. 60(4)(c) has a provider register before real-world testing, and it is
  # ruled per item because the items are not alike: two of them are the register's own keys, and
  # two are the trial's substance — the approved testing plan, and how it ended.
  IX:
    chapeau: >-
      RULE AIA-PO-A60-4 — the information registered for TESTING IN REAL WORLD CONDITIONS under
      Art. 60, provided and THEREAFTER KEPT UP TO DATE. Art. 60(4)(c) is what requires the
      registration and names this Annex as its contents, so the rule that carries the eleven
      conditions carries the list they point at.
    1: >-
      RULE AIA-PO-A60-4 — the Union-wide UNIQUE SINGLE IDENTIFICATION NUMBER of the testing. Not
      only a registry key: Art. 61(1)(e) requires it to be given to every subject of the testing,
      so a registration that never produced one leaves the consent short as well.
    2: >-
      RULE AIA-PO-A60-4 — name and contact details of the provider or prospective provider AND of
      the deployers taking part. The deployers named here are the ones Art. 60(4)(h) puts under a
      written agreement.
    3: >-
      RULE AIA-PO-A60-4 — a brief description of the system, its intended purpose and the
      information identifying it.
    4: >-
      RULE AIA-PO-A60-4 — a summary of the main characteristics of the REAL-WORLD TESTING PLAN,
      the document Art. 60(4)(a) has the authority approve before testing begins.
    5: >-
      RULE AIA-PO-A60-4 — information on the suspension or termination of the testing. The entry
      that Art. 60(8)'s notification to the authority puts on the register, so AIA-PO-A60-8 is
      where the duty to report it lives and this is where it lands.
  X:
    1: Schengen Information System — Regulations (EU) 2018/1860, 2018/1861 and 2018/1862. A reference.
    2: Visa Information System — Regulations (EU) 2021/1133 and 2021/1134. A reference.
    3: Eurodac — Regulation (EU) 2024/1358. A reference.
    4: Entry/Exit System — Regulation (EU) 2017/2226. A reference.
    5: ETIAS — Regulations (EU) 2018/1240 and 2018/1241. A reference.
    6: ECRIS-TCN — Regulation (EU) 2019/816. A reference.
    7: Interoperability — Regulations (EU) 2019/817 and 2019/818. A reference.
  # Annexes XI, XII and XIII are Chapter V content: the technical documentation Art. 53(1)(a)
  # requires, the downstream information Art. 53(1)(b) requires, and the criteria Art. 51(1)(b) has
  # the Commission weigh. Annexes XI and XII are now cited — AIA-GP-A53-1A carries XI and
  # AIA-GP-A53-1B carries XII, and AIA-GPAR-A54-3 carries XI again for the ten-year keeping duty.
  # No judge sees either, because those rules are document_verifiable false for the reason the
  # Chapter V header gives; what the rules do is state item by item what the documentation must
  # hold. Annex XIII is the Commission's designation criteria and binds no operator.
  XI:
    1/chapeau: >-
      RULE AIA-GP-A53-1A — the qualifier on Section 1: the Art. 53(1)(a) technical documentation
      shall contain AT LEAST the information below, AS APPROPRIATE TO THE SIZE AND RISK PROFILE OF
      THE MODEL. A floor and a proportionality limb, neither of them in any item.
    2/chapeau: >-
      A Section heading naming the additional information owed by providers of models WITH
      SYSTEMIC RISK. What it adds is in the items; the heading states who they bind.
    1/1: >-
      RULE AIA-GP-A53-1A — Section 1(1), general description of the model, points (a)-(f): tasks,
      acceptable use policies, release date and distribution, architecture and parameter count,
      modality, licence.
    1/2: >-
      RULE AIA-GP-A53-1A — Section 1(2), the model's elements and development, points (a)-(e):
      integration means, design specifications and training methodology, training data provenance
      and curation, COMPUTATIONAL RESOURCES in FLOP, and energy consumption. Point (d) is the one
      place a document could answer Art. 51(2)'s 10^25 threshold — the same figure Art. 52(1)
      turns on, and the reason a model card that states its training compute answers two questions
      at once.
    2/1: >-
      RULE AIA-GP-A53-1A — Section 2(1), for systemic-risk models: a detailed description of the
      EVALUATION STRATEGIES, including evaluation results, on public evaluation protocols and
      tools or other methodologies, and including the evaluation criteria, the metrics and the
      methodology for identifying limitations. The documentary form of the evaluation half of
      Art. 55(1)(a), which AIA-GP-A55-1A carries as an obligation in its own right.
    2/2: >-
      RULE AIA-GP-A53-1A — Section 2(2), where applicable: the measures put in place for INTERNAL
      AND/OR EXTERNAL ADVERSARIAL TESTING, such as red teaming, and for model adaptations including
      alignment and fine-tuning. The documentary form of the adversarial-testing half of
      Art. 55(1)(a), NOT of Art. 55(1)(b) — Annex XI enacts no item for the Union-level risk
      assessment and mitigation Art. 55(1)(b) requires, which is why AIA-GP-A55-1B points at no
      Annex item and says so.
    2/3: >-
      RULE AIA-GP-A53-1A — Section 2(3), a detailed description of the system architecture and how
      software components integrate. Part of the same systemic-risk documentation.
  XII:
    chapeau: >-
      RULE AIA-GP-A53-1B — the qualifier on the whole Section: the Art. 53(1)(b) information for
      downstream providers shall contain AT LEAST the following.
    1: >-
      RULE AIA-GP-A53-1B — general description for downstream providers, points (a)-(h), and the
      information a provider building an Annex III system on someone else's model needs to meet
      Arts. 9 to 15 at all.
    2: >-
      RULE AIA-GP-A53-1B — elements of the model and its development, points (a)-(c): integration
      means, input and output modality and maximum size, and training data provenance.
  XIII:
    chapeau: >-
      Criteria the COMMISSION takes into account when designating a model under Art. 51(1)(a). A
      power of the Commission exercised on its own assessment, not a duty this tool reports — see
      the Art. 51 rulings.
    a: >-
      Number of parameters. One of the criteria the COMMISSION weighs under Art. 51(1)(b); not a
      duty of anyone. The systemic_risk node asks what a document states about Art. 51(1); these
      criteria are the Commission's own and no cascade answer turns on them.
    b: Quality or size of the data set, measured through tokens. A Commission criterion.
    c: Amount of computation used for training, in FLOP or proxies for it. A Commission criterion.
    d: Input and output modalities and state-of-the-art thresholds. A Commission criterion.
    e: Benchmarks and evaluations of capabilities, autonomy and scalability. A Commission criterion.
    f: >-
      High impact on the internal market, PRESUMED at 10 000 registered Union business users. A
      Commission criterion, and the one limb a business could count for itself.
    g: Number of registered end-users. A Commission criterion.
  # Annex XIV was ADDED by this consolidation, and it appeared in the store unnoticed — the reason
  # this section exists at all. It scopes a notified body's designation under Arts. 29 and 30.
  XIV:
    chapeau: >-
      The list of codes and categories for the Art. 30 notification procedure, specifying the
      scope of a designation as a notified body. An instrument of the notifying authorities;
      conformity assessment bodies are outside the roles this tool reports on.
    1: >-
      Introduction: only designated conformity assessment bodies may act, and the codes below scope
      what each is designated for. Addressed to notifying authorities and the bodies themselves.
    2: >-
      The codes and categories for AI systems subject to Annex I and Annex III. A taxonomy for
      designation, not a classification the cascade uses — the tier is decided by Arts. 6 and 5.
    3: >-
      AI technology-specific codes: symbolic AI, machine learning, and the rest. Describes what a
      body is competent to assess, not what a system owes.
    4: >-
      Conformity assessment bodies use these lists when applying for designation. The applicant
      body's duty, and conformity assessment bodies are out of scope by role.

# EMPTY, and the mechanism stays. An entry here means an annex item carries content a party owes
# and no report mentions it — a stronger claim than a dismissal, and the reason this section is
# separate from annex_rulings rather than folded into it.
annexes_awaiting_rules: {}

# WHICH OF ART. 6'S TWO DOORS AN ANNEX'S HIGH-RISK POPULATION COMES THROUGH, for the annexes where
# it is not both. A reading of the Act that no rule records: a rule states the routes IT fires on,
# and nothing else states the routes an annex has to be complete over. Without that, an annex ruled
# only to rules gated at Annex III is indistinguishable from one that leaves the Annex I provider
# out — Annex VII is reached from both doors, and Annexes VI and VIII from one.
#
# An annex absent from this list is owed to both routes. Read by the coverage tests, not by any
# rule: it constrains what a ruling has to name, not what a report says.
#
# AN ENTRY MAY BE ITEMISED, because the Act reaches parts of one annex from different doors.
# Art. 43(3) applies six named pieces of Annex VII to the Annex I Section A route and does not
# apply the rest, so the routes Annex VII's items are owed to differ item by item and one answer
# for the whole annex is wrong whichever way it is written. Where an entry is a mapping, an item
# absent from it is owed to both routes; where it is a line, that line answers for every item.
annex_route_population:
  VII:
    # The two items Art. 43(3) leaves out. Point 1 says the procedure IS points 2 to 5 and point 2
    # is its overview; the paragraph applies point 3, points 4.3, 4.4 and 4.5, the fifth paragraph
    # of point 4.6, and point 5 — so an Annex I Section A provider is never sent to either of
    # these, and a rule reaching it here would be reporting an obligation the Act does not impose.
    "1": >-
      annex_iii — the definitional item. Art. 43(1)(b) sends an Annex III point 1 provider to the
      whole of Annex VII; Art. 43(3) sends an Annex I Section A provider to six pieces of it by
      name, and this is not among them.
    "2": >-
      annex_iii — the overview of the procedure, on the same ground as point 1: named by neither
      limb of Art. 43(3).
  VI: >-
    annex_iii — Art. 43(1) and (2) put the internal-control procedure on Annex III systems. An
    Annex I Section A provider follows the conformity procedure of its own sectoral act under
    Art. 43(3) and never reaches Annex VI.
  VIII: >-
    annex_iii — Art. 49(1) registers "a high-risk AI system listed in Annex III", and Art. 49(2)
    a system the provider concluded is not high-risk under Art. 6(3). Both are Annex III questions;
    an Annex I safety component is registered under its own legislation, not in the EU database.

# EVERY PLACE THE ACT NAMES AN OPERATOR, AND WHAT THAT MENTION IS.
#
# The partition asks whether every address has a ruling. It does not ask whether a ruling accounts
# for every party the address names, and that is a different question with its own failure: a rule
# cites Art. 25(2) and carries the provider's duty while the paragraph also names the party that
# has stopped being the provider; a ruling summarises Art. 78(3) from its first subparagraph while
# its second binds a provider. Both leave `unaccounted` at zero.
#
# So the population swept here is derived, not sampled: EVERY address whose enacted text names a
# provider, deployer, importer, distributor or authorised representative that no rule citing that
# address binds. `test_every_role_mention_is_accounted_for` recomputes it from the stored text on
# every run and holds it to the entries below, so an address entering the population — new text, a
# rule narrowed, a role dropped from `applies_to_role` — fails the suite until someone reads it.
#
# A MENTION IS NOT A DUTY, and most of these are not. The Act names the party a duty is owed TO
# (Art. 13(3)'s instructions are written for deployers), the party an authority must inform, the
# party a definition classifies, and the party a permission allows something to. Each entry says
# which of those it is, in the same terms a ruling does: what the words do for that role, and why
# no rule carries them. An entry that cannot say it is a rule waiting to be written.
role_mentions:
  # --- Art. 3 — the definitions. Every one of these names a party in order to SAY WHAT IT IS, and
  # a definition binds nobody: the duty it feeds lives in the article that uses the term. Ruled
  # here rather than exempted in code, because "Art. 3 is definitions" is a reading of the Act and
  # the day a definition carries an operative limb it should have to be argued out of this list.
  # --- Art. 2 — who the Regulation reaches. Scope, answered by the cascade, and scope is not duty.
  "2(1)": >-
    CASCADE territorial. Lists the parties the Regulation applies TO — providers, deployers,
    importers and distributors, product manufacturers, authorised representatives — and applying
    to a party is the precondition of every duty rather than one of them. The cascade answers it
    at the `territorial` node; a system it does not reach exits as OUT_OF_SCOPE and owes nothing.
  "2(5)": >-
    A saving clause about a different instrument: the liability rules for providers of intermediary
    services in the Digital Services Act are unaffected. Those providers are not this Regulation's
    provider, and nothing here binds them under it.
  "2(10)": >-
    CASCADE scope. Withholds the Regulation from a deployer who is a natural person using a system
    in a purely personal non-professional activity. An exclusion — it removes duties rather than
    creating one, and the cascade answers it as PERSONAL_NON_PROFESSIONAL.
  # --- Art. 4 and 4a — support, and a permission that is a condition in one place and not the other.
  "4(2)": >-
    A duty on the COMMISSION AND THE MEMBER STATES to support providers and deployers in meeting
    Art. 4(1), and to publish practical examples. Both parties are named as the beneficiaries of
    that support; what they owe is Art. 4(1) itself, carried by AIA-ALL-A04.
  "4a(1)": >-
    A permission the provider may use, not a duty it owes: special categories of personal data may
    exceptionally be processed for bias detection and correction. It reaches this ruleset anyway,
    because Art. 10(1) makes the conditions of Art. 4a(1) quality criteria of the data sets, and
    AIA-HR-A10 supplies the paragraph as a qualifier and judges against it.
  "4a(2)": >-
    The same permission widened to providers and deployers of systems that are not high-risk, and
    to deployers of high-risk systems. It creates nothing for either party and says so in its own
    last sentence — "This paragraph does not create any obligation to conduct such bias detection
    and correction." A permission that disclaims itself is the clearest case in this list.
  "5(1a)": >-
    CASCADE prohibited. Narrows points (ba) and (bb), and names the deployer to say when USE is
    caught: only where the deployer uses the system for the purpose of generating the material.
    A limit on a prohibition, which the cascade answers; a prohibition binds by forbidding, and
    the report carries it as a risk class rather than as an obligation to evidence.
  "7(2)": >-
    The criteria the COMMISSION weighs when adding an area to Annex III. The deployer is named in
    point (h), as the party a potentially harmed person may stand in an imbalance of power toward.
    A factor in the Commission's assessment, and no duty of the deployer's.
  "9(5)": >-
    RULE AIA-HR-A09 binds the provider. The deployer is named twice as the party the provider acts
    TOWARD: point (c) requires the provider to supply Art. 13 information and, where appropriate,
    training to deployers, and the closing subparagraph makes the deployer's expected knowledge and
    training a factor the provider must weigh. Both are the provider's obligations.
  "13(1)": >-
    RULE AIA-HR-A13 binds the provider. The deployer is named as the party the system's operation
    must be transparent ENOUGH FOR — the beneficiary of the design duty, and the measure of it.
    The deployer's own duties are Arts. 26 and 27.
  "13(2)": >-
    The same relation: the instructions must be relevant, accessible and comprehensible TO
    DEPLOYERS. AIA-HR-A13 supplies this paragraph as the qualifier on 13(1); the deployer is the
    audience the quality is measured against, not a party that owes anything here.
  "13(3)": >-
    RULE AIA-HR-A13-3 binds the provider. The deployer is named throughout as the reader the
    instructions are written for, and the authorised representative in point (a) as a party whose
    identity and contact details the provider must state. Neither owes anything under this
    paragraph: the representative's own duties are Art. 22(3), and stating its details is the
    provider's obligation, carried by the rule.
  "14(3)": >-
    RULE AIA-HR-A14 binds the provider. Both parties are named to divide the work of oversight:
    measures the provider builds into the system under (a), and measures the provider identifies
    for the DEPLOYER to implement under (b). Point (b) is still the provider's duty — to identify
    them and pass them on — and Art. 26(1) is what makes the deployer act on what it receives.
  "14(4)": >-
    RULE AIA-HR-A14 binds the provider. The deployer is named as the party the system must be
    PROVIDED TO in a state where its overseers are enabled to do the five things listed. The
    capability is the provider's to ship; assigning a competent person to use it is Art. 26(2).
  "14(5)": >-
    RULE AIA-HR-A14 binds the provider. The deployer is named as the party that may take no action
    on a biometric identification unless two persons have separately verified it — a constraint the
    PROVIDER must build the measures to ensure, which is what "the measures referred to in
    paragraph 3 shall be such as to ensure" makes it. Art. 26(2) and Art. 26(10) carry the
    deployer's side.
  # --- Arts. 17-19 — the accommodations. Each says a duty already modelled may be discharged
  # through a process the provider runs under other Union law, so each narrows a rule rather than
  # adding one, and none of them changes what the provider must achieve.
  "17(2)": >-
    Proportionality: the Art. 17(1) aspects are implemented in proportion to the size of the
    provider's organisation, an SME or SMC included. It expressly holds the required rigour and
    level of protection constant, so it scales the effort and not the outcome. AIA-PO-A17 carries
    the duty.
  "17(3)": >-
    A relief: a provider already subject to quality management obligations under sectoral Union law
    may include the Art. 17(1) aspects in that system. One quality system, not two. AIA-PO-A17
    carries the duty and this narrows how it may be met.
  "18(2)": >-
    A duty on each MEMBER STATE to set the conditions under which the documentation stays available
    to authorities where the provider or its authorised representative goes bankrupt or ceases
    activity. Both are named as the party whose failure triggers the arrangement; neither owes
    anything under this paragraph, and AIA-PO-A18 carries the provider's own keeping duty.
  "19(2)": >-
    The same relief on Art. 19: a provider that is a financial institution keeps the automatically
    generated logs within the documentation held under Union financial services law. AIA-PO-A19
    carries the duty to keep them.
  "20(1)": >-
    RULE AIA-PO-A20 binds the provider. The distributor, deployer, authorised representative and
    importer are named as the parties the provider must INFORM once it takes corrective action —
    recipients of a notification, not holders of a duty. What each of them owes on learning of a
    non-conformity is Art. 23(6), Art. 24(5) and Art. 26(5).
  "20(2)": >-
    RULE AIA-PO-A20-2 binds the provider. The deployer is named as the party the provider
    investigates the risk IN COLLABORATION WITH, where one has reported it. The reporting itself
    is the deployer's duty under Art. 26(5), which AIA-DP-A26 carries.
  # --- Arts. 22-24 — the supply chain. Each article is one rule per party, and the mentions here
  # are almost all the OTHER parties: whom to verify, whom to inform, whose mandate it is.
  "22(2)": >-
    RULE AIA-PO-A22 binds the provider to ENABLE its authorised representative to perform the
    mandate. Carried on the appointment rule because the two fail together, and the representative
    is named as the party that must be enabled rather than one that owes anything here.
  "22(3)": >-
    RULE AIA-AR-A22 binds the authorised representative — hold the mandate, produce it on request,
    and perform tasks (a) to (e). The provider is named as the party that grants the mandate and
    whose conformity work the representative verifies; its own duty is Art. 22(1) and 22(2).
  "22(4)": >-
    RULE AIA-AR-A22 binds the authorised representative to terminate the mandate and tell the
    authority why. The provider is named as the party whose conduct triggers termination — the
    subject of the representative's judgement, not a duty-holder under this paragraph.
  "23(1)": >-
    RULE AIA-IM-A23 binds the importer to verify four things before placing the system. The
    provider is named as the party whose conformity assessment, technical documentation and
    appointment the importer checks, and the authorised representative as the appointment that
    must exist. Neither owes anything here; the duties verified are Arts. 11, 22(1) and 43.
  "23(2)": >-
    RULE AIA-IM-A23 binds the importer not to place a non-conforming or falsified system. The
    provider and the authorised representative are named as parties the importer must INFORM where
    the system presents an Art. 79(1) risk — recipients of a notification.
  "24(1)": >-
    RULE AIA-DI-A24 binds the distributor to verify the CE marking, declaration and instructions
    before making the system available. The provider and the importer are named as the parties
    whose own obligations — Art. 16(b) and (c), and Art. 23(3) — the distributor checks have been
    complied with. Those duties are theirs and are carried elsewhere.
  "24(2)": >-
    RULE AIA-DI-A24 binds the distributor not to make a non-conforming system available. The
    provider and the importer are named as the parties it must inform where the system presents an
    Art. 79(1) risk.
  "24(4)": >-
    RULE AIA-DI-A24 binds the distributor to take corrective action, withdraw or recall — or to
    ensure the provider, the importer or another operator does — and to inform the authorities. The
    provider and importer are named as parties the distributor may require to act and must inform;
    their own corrective duties are Art. 20 and Art. 23(2).
  # --- Art. 25 — the role change. Answered by the cascade, not by a rule, because who the provider
  # IS has to be settled before any obligation set can be selected.
  "25(1)": >-
    CASCADE provider_reallocation. Names the distributor, importer and deployer as the parties who
    BECOME the provider on any of the (a)-(c) triggers, and the provider as the role they take on.
    It reallocates a duty set rather than adding one: the gap graph asks it, and a party it moves
    is reported against the whole provider ruleset.
  "25(2)": >-
    RULE AIA-IP-A25-2 binds the initial provider — the party that has STOPPED being the provider —
    to cooperate with the new one. The word "provider" also appears as the NEW provider, the party
    that cooperation is owed to and whose Art. 16 obligations the assistance serves; that party
    owes the whole provider ruleset through the cascade's reallocation answer, not through this
    paragraph.
  "25(3)": >-
    CASCADE provider_reallocation. The product manufacturer becomes the provider of a safety
    component placed under its own name, owing Art. 16 whole. Names the provider as the role
    assumed; `roles_out_of_scope` records why the manufacturer needs no duty set of its own.
  # --- Art. 26 — the deployer's obligations. AIA-DP-A26 carries six paragraphs and four more sit
  # on rules of their own; the mentions below are the parties the deployer acts toward.
  "26(3)": >-
    A saving clause: paragraphs 1 and 2 are without prejudice to the deployer's other obligations
    under Union or national law and to its freedom to organise its own resources. The provider is
    named as the party whose indicated oversight measures the deployer implements in its own way.
    It preserves duties rather than creating one, for either party.
  "26(5)": >-
    RULE AIA-DP-A26 binds the deployer to monitor operation, suspend use, and report. The provider,
    importer and distributor are named as the parties it must INFORM — the provider of an
    Art. 79(1) risk and first of a serious incident, then the importer or distributor. What each
    does on being told is Art. 20, Art. 23(2) and Art. 24(4).
  "26(8)": >-
    RULE AIA-DP-A26-8 binds the public-authority deployer: register under Art. 49, and do not use a
    system found unregistered. The provider and the distributor are named as the parties the
    deployer informs on finding it unregistered — recipients, and the registration itself is the
    provider's own duty under Art. 49(1).
  # --- Art. 27 — the fundamental rights impact assessment. AIA-DP-A27 binds the deployer.
  "27(1)": >-
    RULE AIA-DP-A27 binds the deployer to carry the assessment out. The provider is named in point
    (d) through the reference to information the provider gives under Art. 13; the assessment is
    the deployer's own work and nothing here binds the provider.
  "27(2)": >-
    RULE AIA-DP-A27 binds the deployer to keep the assessment current. The provider is named as a
    party whose existing impact assessment the deployer MAY rely on in similar cases — a permission
    to reuse someone else's document, not an obligation to produce one.
  "27(4)": >-
    A relief for the deployer: where an obligation of this Article is already met by a data
    protection impact assessment under Art. 35 GDPR or Art. 27 of Directive (EU) 2016/680, the
    fundamental rights assessment may cross-reference or incorporate it. AIA-DP-A27 carries the
    duty and this narrows what discharging it costs.
  "27(5)": >-
    A duty on the AI OFFICE to publish a questionnaire template that helps deployers comply in a
    simplified manner. The deployer is named as the beneficiary of the template.
  # --- Arts. 31-36 and 44 — the notified bodies. The provider appears throughout as the party a
  # body must be independent of, must not burden, must inform, or must ask before subcontracting.
  # Every duty in this stretch is the body's or the notifying authority's.
  "31(4)": >-
    A requirement on the notified body to be independent OF the provider, of any operator with an
    economic interest, and of the provider's competitors. The provider is the party independence is
    measured against.
  "31(8)": >-
    A requirement on the notified body to have procedures taking due account of the size of a
    provider and the complexity of the system. Owed toward the provider, not by it.
  "33(3)": >-
    Subcontracting or use of a subsidiary requires THE PROVIDER'S AGREEMENT. That is a consent
    right the provider holds, and a condition on the body; a right is not an obligation, and
    nothing in a technical file evidences or breaches it.
  "34(2)": >-
    A requirement on the notified body to avoid unnecessary burdens for providers and to weigh the
    provider's size and structure, while holding the required rigour constant. Owed toward the
    provider.
  "34(3)": >-
    A duty on the notified body to submit all relevant documentation, INCLUDING THE PROVIDERS'
    DOCUMENTATION, to its notifying authority on request. The provider is named as the author of
    documents the body already holds; supplying them to the body is Art. 43 and Annex VII.
  "36(3)": >-
    A notified body ceasing activity informs its notifying authority and the providers concerned at
    least a year ahead. The provider is the recipient of that notice.
  "36(5)": >-
    A notified body whose designation is suspended, restricted or withdrawn informs the providers
    concerned within ten days. Again the provider is the recipient.
  "36(7)": >-
    What the NOTIFYING AUTHORITY must do on a restriction, suspension or withdrawal, points (a) to
    (e). The provider is named in (e) only to locate the national competent authority of the Member
    State where it has its registered place of business.
  "36(9)": >-
    Certificate validity for nine months after a withdrawal, on confirmations made by the national
    competent authority and by another notified body. The provider is named only to identify which
    Member State's authority acts; unlike Art. 36(8) it puts nothing on the provider.
  "44(2)": >-
    Certificate validity periods, and extension AT THE REQUEST OF THE PROVIDER. The request is the
    provider's option and the decision is the body's; an option is not a duty, and a provider that
    lets a certificate lapse breaches Art. 43, not this paragraph.
  "44(3)": >-
    A duty on the notified body to suspend, withdraw or restrict a certificate where the system no
    longer conforms, unless the provider takes corrective action within the deadline the body sets.
    The provider is named as the party whose corrective action can avert that; the duty to take it
    is Art. 20, carried by AIA-PO-A20.
  # --- Arts. 43 and 48 — the conformity assessment and the marking.
  "43(4)": >-
    RULE AIA-PO-A43-4 binds the provider to a new conformity assessment on a substantial
    modification. The deployer is named to say that the duty arises REGARDLESS of whether the
    modified system is distributed further or stays with the current deployer — a limit on an
    exception, and nothing the deployer owes.
  "48(4)": >-
    RULE AIA-PO-A48-4 binds the provider. The authorised representative is named as one of the
    parties who may physically affix the notified body's identification number on that body's
    instructions — a permitted actor, and the obligation that the number be affixed at all is the
    provider's.
  # --- Arts. 49-50 — registration and transparency.
  "49(1)": >-
    RULE AIA-PO-A49 binds the provider to register itself and the system before placing it on the
    market. The authorised representative is named as the party that registers WHERE APPLICABLE —
    that is, where one has been appointed under Art. 22(1) and the mandate covers it, which
    Art. 22(3)(e) makes explicit. AIA-AR-A22 carries the representative's side.
  "49(2)": >-
    RULE AIA-NHR-A06-4 carries this through Art. 6(4)'s cross-reference: a provider that concluded
    under Art. 6(3) its system is not high-risk registers it anyway. The authorised representative
    is named on the same terms as in 49(1) — the party that may register where one is appointed.
  "50(2)": >-
    RULE AIA-TR-A50-2 binds the provider to mark synthetic output machine-readably. The deployer is
    named inside the exception: the duty does not apply where the system performs an assistive
    editing function or does not substantially alter the input data the DEPLOYER provided. A limit
    on the provider's duty, defined by reference to whose data it is.
  "50(6)": >-
    A saving clause: Art. 50(1) to (4) do not affect Chapter III, and are without prejudice to
    other transparency obligations on deployers under Union or national law. Already modelled
    structurally — `applies_to_transparency_duty` ADDS a rule to a tier's obligations rather than
    replacing them — and it preserves other duties rather than creating one.
  # --- Arts. 52-56 — the Chapter V gates and the codes of practice. Almost every mention here is a
  # provider exercising an OPTION or receiving an invitation.
  "52(2)": >-
    An option: a provider whose model meets the Art. 51(1)(a) threshold MAY present substantiated
    arguments, with its Art. 52(1) notification, that the model nonetheless carries no systemic
    risk. Exercised with a notification the provider already owes; not owed on its own.
  "52(3)": >-
    The COMMISSION's decision to reject insufficiently substantiated arguments, with the
    consequence that the model is treated as carrying systemic risk. The provider is named as the
    party whose arguments failed.
  "52(5)": >-
    A right with a waiting period: a provider whose model has been designated may request
    reassessment, at the earliest six months after the decision and again six months after any
    decision maintaining it. A right the provider holds, not a duty.
  "53(2)": >-
    CASCADE open_source_release. Lifts Art. 53(1)(a) and (b) from a provider releasing under a free
    and open-source licence with public parameters, architecture and usage information — and not
    where the model carries systemic risk. An exemption, answered by the cascade so the report can
    tell the provider which side of the line its own release falls on.
  "54(1)": >-
    RULE AIA-GP-A54-1 binds the third-country model provider to appoint an authorised
    representative. The representative is the party appointed; AIA-GPAR-A54-3 carries what it owes.
  "54(2)": >-
    RULE AIA-GP-A54-2 binds the model provider to ENABLE its authorised representative to perform
    the mandate. The representative is the party that must be enabled.
  "54(3)": >-
    RULE AIA-GPAR-A54-3 binds the authorised representative to perform the mandate and produce a
    copy to the AI Office. The provider is named as the party that grants the mandate and whose
    Annex XI documentation and Art. 53 and 55 compliance the representative verifies; those duties
    are the provider's and are carried by the Chapter V rules.
  "54(5)": >-
    RULE AIA-GPAR-A54-5 binds the authorised representative to terminate the mandate and tell the
    AI Office. The provider is named as the party whose conduct triggers termination.
  "54(6)": >-
    CASCADE open_source_release. Lifts the whole of Art. 54 from a provider releasing under a free
    and open-source licence on the same four limbs as 53(2), and not where the model carries
    systemic risk. An exemption, not a duty.
  "56(3)": >-
    The AI Office MAY INVITE providers of general-purpose AI models to take part in drawing up
    codes of practice. An invitation to a voluntary process.
  "56(7)": >-
    The AI Office may invite providers to adhere to the codes, and a provider without systemic risk
    may limit its adherence to Art. 53. Voluntary in both directions; adherence is a means of
    demonstrating compliance, and the obligations themselves are Arts. 53 and 55.
  "56(9)": >-
    A deadline on the AI OFFICE to have codes ready, and a reserve power for the Commission to set
    common rules by implementing act if they are not. The provider is named as the party the Office
    invites under paragraph 7.
  # --- Arts. 57-59 — the regulatory sandboxes. The authority runs them; a provider participates.
  "57(5)": >-
    What a sandbox must provide — a controlled environment under a plan AGREED BETWEEN the
    providers and the competent authority, incorporating the Art. 60 and 60a testing plan where
    relevant. A requirement on the sandbox, and agreement to a plan is a condition of taking part
    rather than an obligation of the Regulation.
  "57(7)": >-
    A duty on the COMPETENT AUTHORITY to give participating providers regulatory guidance and, on
    request, written proof and an exit report. The provider is named as the party that receives
    them and MAY use them as evidence of compliance; the request is its option.
  "57(8)": >-
    Commission and Board access to exit reports WITH THE AGREEMENT OF THE PROVIDER, and publication
    only if the provider and the authority both explicitly agree. Consent-gated in both limbs, so
    the provider is named as the party whose agreement is required.
  "57(12)": >-
    A protection rather than a duty: a participating provider stays liable under liability law, and
    no administrative fines are imposed for infringements of this Regulation where it observes the
    sandbox plan and follows the authority's guidance in good faith.
  "58(2)": >-
    What the Commission's implementing acts on sandboxes must ensure, points (a) to (i). The
    provider is named as the applicant sandboxes must be open to, and the deployer in point (b) as
    a party a provider may apply in partnership with. Requirements on the act and the authorities.
  "58(3)": >-
    Prospective providers, in particular SMEs and start-ups, SHALL BE DIRECTED to pre-deployment
    and value-adding services. The authority directs; the provider receives, and owes nothing.
  # --- Arts. 60, 60a and 61 — testing in real world conditions. AN OPEN SCOPE LIMIT, and these
  # entries do not close it: the duties in 60(4), 60(7), 60(8) and 61 are real and owed by a
  # provider that takes this route, and no rule carries them. The entries say what the words do and
  # name the gap rather than dressing it as an answer.
  "60(1)": >-
    A permission: a provider or prospective provider of an Annex III or Annex I Section A system
    MAY test in real world conditions outside a sandbox, under a plan the Commission specifies.
    Nothing here is owed. It is the question the gap layer puts — CASCADE real_world_testing — and
    what a provider that elects the route then owes is Arts. 60(4), (7), (8) and 61.
  "60(2)": >-
    The same permission as to timing and partnering: a provider may test at any time before placing
    on the market, alone or in partnership with one or more deployers. The deployer is named as an
    optional partner. Still a permission.
  "60(4)": >-
    RULE AIA-PO-A60-4 binds the provider to the eleven conditions. THE DEPLOYER LIMBS ARE READ AS
    CONDITIONS ON THE PROVIDER, and the reading is arguable rather than plain. Two of them name the
    deployer as a subject: point (h) says the provider "and the deployer or prospective deployer
    SHALL CONCLUDE AN AGREEMENT" specifying their roles, and point (j) requires the testing to be
    overseen by the provider "AS WELL AS BY" deployers through suitably qualified persons. Read on
    their own those are bilateral, the shape this ledger recognises at Art. 25(4). What decides it
    the other way is the chapeau: paragraph 4 opens on providers who "may conduct the testing only
    where all of the following conditions are met", so the list states what the PROVIDER must have
    in place before it is permitted to start, and a deployer that never signs simply leaves the
    provider without its permission. The cost of the reading is real and named here rather than
    hidden: a deployer partnering in a trial reads no report of the agreement it must sign or the
    qualified oversight staff it must find. AIA-PO-A60-4 names both limbs as two-party instruments
    so the provider at least knows what it has to obtain and from whom.
  "60(6)": >-
    A duty on MEMBER STATES to confer inspection powers on their market surveillance authorities.
    The provider is named as the party those powers are exercised against.
  "60(9)": >-
    Liability, not compliance: the provider or prospective provider is liable under Union and
    national liability law for damage caused during testing. This tool reports what a file must
    contain and never what an act costs in damages.
  "60a(1)": >-
    A permission granted to MEMBER STATES to allow real-world testing of Annex I Section B systems.
    The provider is named as the party that may then test. NOT WITHHELD BY THE CHAPTER, because
    Arts. 60 and 60a sit in Chapter VI and Art. 2(2) withholds Chapter III. What puts it outside
    this report is that Art. 2(2)'s list of what DOES apply to a Section B system is exhaustive
    and names Art. 60a itself: the Article applies, and it applies as a permission addressed to
    Member States. The duties that follow reach the provider through a national framework, which
    is law this tool does not carry.
  "60a(5)": >-
    What a Member State's testing framework must contain, points (a) to (d), including a plan
    agreed with the provider and compliance with named parts of Art. 60. A requirement on the
    FRAMEWORK and not on the provider. What the framework carries across is substantial — point
    (b) requires it to ensure compliance with Art. 60(2), (3), (4)(d) to (j) and (5) to (9), so a
    Section B provider running a real-world trial owes most of what AIA-PO-A60-4 states. It owes
    it under the national measure that implements this paragraph, which is where a reader has to
    go for the terms, and not under a provision of this Regulation a rule could cite.
  # --- Arts. 62, 68, 71 and 72 — support, the scientific panel, the database, monitoring.
  "62(1)": >-
    Actions MEMBER STATES must undertake for SMEs, points (a) to (d). The deployer is named in (b)
    as an audience for awareness-raising and training activities.
  "62(2)": >-
    SME providers' interests are taken into account when setting Art. 43 conformity assessment
    fees, which are reduced proportionately. Addressed to whoever sets the fees; it lowers a cost
    rather than adding a duty.
  "68(2)": >-
    Conditions the COMMISSION selects scientific panel experts against, including INDEPENDENCE FROM
    ANY PROVIDER of AI systems or general-purpose AI models. The provider is the party
    independence is measured against; it constrains who may be appointed.
  "71(4)": >-
    Which parts of the EU database are public, and that Art. 60 testing information is visible only
    to authorities unless the provider consents. A property of the register and a consent the
    provider holds; the duty to register is Art. 49.
  "71(5)": >-
    A limit on the personal data the database may hold, naming the persons authorised to represent
    the provider or the deployer for registration. Binds the Commission as controller; the entries
    themselves are Art. 71(2) and (3), carried by AIA-PO-A71-2 and AIA-DP-A71-3.
  "71(6)": >-
    The Commission is the controller of the database and provides technical and administrative
    support to providers, prospective providers and deployers. Both are named as recipients of that
    support, and the accessibility requirement lands on the database.
  "72(2)": >-
    RULE AIA-PO-A72 binds the provider. The deployer is named as one source of the performance data
    the monitoring system collects, and again to exclude the sensitive operational data of a
    law-enforcement deployer. Supplying that data is the deployer's Art. 26(5) duty.
  "72(4)": >-
    A relief: where a post-market monitoring system already exists under Annex I Section A
    legislation or Union financial services law, the provider may integrate the Art. 72 elements
    into it rather than run a second one. AIA-PO-A72 carries the duty.
  # --- Arts. 75-83 — enforcement. The operator appears as the party investigated, informed,
  # inspected or ordered; the duties are the AI Office's and the market surveillance authorities'.
  # Where an order lands on the provider, the compliance duty behind it is already modelled.
  "75(1)": >-
    Allocation of competence: the AI Office is exclusively competent for systems built on the same
    provider's own general-purpose model and for systems inside a VLOP or VLOSE, subject to four
    exceptions. The provider is named to define the class of system; the deployer appears in the
    exceptions. Which authority supervises is not a duty of either.
  "75(2)": >-
    An inter-authority procedure where a general-purpose AI system usable directly for a high-risk
    purpose is suspected non-compliant. The deployer is named to describe such a system — one that
    deployers can use directly for a high-risk purpose.
  "75(2a)": >-
    A market surveillance authority may ask the AI Office to act on a suspected infringement, and
    the request names the provider or deployer concerned. Both are named as the subject of a
    request between authorities.
  "75a(2)": >-
    The AI Office may decide to open an investigation into suspected non-compliance by a provider or
    a deployer, and must notify the operator. Both are named as the party investigated and
    notified; the Office's power, and their side is being told.
  "75a(4)": >-
    Remote and on-site inspections and the (a) to (e) powers of the inspecting officials. The
    provider is named as the party informed of the subject matter, the fines and the right of
    review. Submitting to an inspection is not an obligation this report can evidence.
  "76(2)": >-
    The market surveillance authority verifies Art. 60 compliance for testing inside a sandbox, and
    may allow the provider to test in derogation from two of the Art. 60(4) conditions. The
    authority's supervisory duty, and a derogation it may grant.
  "76(3)": >-
    On a serious incident or grounds to think Arts. 60 and 61 are unmet, the authority may suspend
    or terminate the testing, or require the provider and the deployer to modify it. Both are named
    as parties a decision may be addressed to; complying with a decision is not a standing duty.
  "76(4)": >-
    A decision or objection must state its grounds and how the provider can challenge it. A
    procedural right of the provider, not an obligation of it.
  "77(1a)": >-
    The market surveillance authority grants a fundamental-rights body access to information,
    requesting it from the provider or the deployer where necessary. Both are named as the source
    the authority may request from; the duty to answer a reasoned request is Art. 21 and Art. 26(12).
  "78(3)": >-
    RULE AIA-PO-A78-3 binds the authority that is itself the provider. The deployer is named in the
    first subparagraph as a party that must be consulted before confidential information is
    disclosed — a protection for the deployer, and a restriction on the authorities.
  "80(1)": >-
    An authority evaluation where a system the provider classified as not-high-risk under Art. 6(3)
    is suspected to be high-risk. The provider is named as the party that made the classification;
    the duty to document it is Art. 6(4), carried by AIA-NHR-A06-4.
  "80(2)": >-
    The authority requires the provider to bring the system into compliance within a prescribed
    period. An order; what the provider must then do is Art. 20 and the Section 2 requirements.
  "80(3)": >-
    The authority informs the Commission and other Member States of the evaluation and of what it
    required the provider to do. Institutional, and the provider is named as the subject.
  "80(4)": >-
    The provider ensures the necessary action is taken, on pain of Art. 99 fines. Its content is
    Art. 20 and the Section 2 requirements once an authority has ruled, and AIA-PO-A20 and
    AIA-ALL-A79 carry the corrective duty; this paragraph adds the penalty rather than a new duty.
  "80(5)": >-
    The provider ensures corrective action across every unit it has made available on the Union
    market. The same duty as Art. 20 and Art. 79(4), which AIA-PO-A20 and AIA-ALL-A79 carry.
  "80(6)": >-
    A procedural cross-reference: Art. 79(5) to (9) applies where the provider does not act in
    time. It routes the authority's next step and imposes nothing new.
  "80(7)": >-
    A penalty: a provider that misclassified its system as not-high-risk IN ORDER TO CIRCUMVENT
    Chapter III attracts an Art. 99 fine. The duty behind it is the Art. 6(4) assessment, carried
    by AIA-NHR-A06-4; this paragraph prices the breach rather than creating one.
  "83(1)": >-
    Formal non-compliance, points (a) to (g) — the authority requires the provider to end it. Each
    finding names a duty modelled elsewhere: CE marking (Art. 48), the declaration of conformity
    (Art. 47), EU database registration (Art. 49), and point (f), NO AUTHORISED REPRESENTATIVE
    APPOINTED where Art. 22(1) requires one. The representative is named as the appointment that
    must exist; AIA-PO-A22 carries the duty to make it.
  # --- Arts. 89-101 — the Chapter V enforcement powers. The model provider appears as the party
  # asked, evaluated or fined; the duties behind every one of them are Arts. 53, 54 and 55.
  "89(1)": >-
    The AI Office may take monitoring actions over providers of general-purpose AI models,
    including their adherence to approved codes of practice. The Office's power; the provider is
    the party monitored.
  "89(2)": >-
    A RIGHT held by a downstream provider to lodge a reasoned complaint against the provider of a
    model it integrates. The complainant is a provider, and a right to complain is not a duty; the
    duties it alleges a breach of are Arts. 53 and 55.
  "90(3)": >-
    What a qualified alert from the scientific panel must contain, points (a) to (c). The panel's
    duty; the provider is named only as the point of contact the alert must identify.
  "91(1)": >-
    The COMMISSION may request the Art. 53 and 55 documentation from a model provider, or further
    information. The power that makes holding that documentation matter; the provider's duty to
    hold it is Art. 53(1)(a), and its duty to answer such a request is Art. 91(5), carried by
    AIA-GP-A91-5.
  "91(2)": >-
    The AI Office may open a structured dialogue with the provider before sending the request.
    Procedural, and optional for the Office.
  "91(3)": >-
    The Commission may issue a request for information to a model provider on the scientific
    panel's substantiated request. Procedural; the provider is the addressee.
  "92(1)": >-
    The AI Office may evaluate a model on the (a) and (b) grounds. The Office's power, and the
    provider is named as the party whose compliance is assessed; answering an evaluation is
    Art. 92(5), carried by AIA-GP-A92-5.
  "92(7)": >-
    The AI Office may open a structured dialogue with the provider before requesting access to the
    model, to gather information on internal testing and safeguards. Optional and procedural.
  "93(1)": >-
    The Commission may request providers to take compliance measures, implement mitigation
    measures, or restrict, withdraw or recall the model. An enforcement power; the underlying
    duties are Arts. 53, 54 and 55, and complying with a decision is not a standing obligation this
    report can evidence.
  "93(2)": >-
    The AI Office may open a structured dialogue with the provider before a measure is requested.
    Optional and procedural.
  "93(3)": >-
    Commitments a model provider OFFERS during that dialogue may be made binding by decision. The
    offer is voluntary and the decision is the Commission's; the Art. 75b twin for models.
  "95(2)": >-
    Codes of conduct for the VOLUNTARY application of specific requirements to all AI systems,
    including by deployers, on the (a) to (e) issues. Voluntary by its own words, and facilitated
    by the AI Office and the Member States.
  "95(3)": >-
    Codes of conduct MAY be drawn up by individual providers or deployers, or by organisations
    representing them. Permissive for both parties.
  "99(4)": >-
    Administrative fines for non-compliance with the operator duties in points (a) to (g) — the
    provider's under Art. 16, the authorised representative's under Art. 22, the importer's under
    Art. 23, the distributor's under Art. 24, the deployer's under Art. 26, and Art. 50. A penalty
    schedule, and a useful cross-check on the shape of this ruleset: every article it names carries
    rules here. It creates no duty of its own.
  "101(1)": >-
    Commission fines on providers of general-purpose AI models, on the (a) to (d) grounds. A
    penalty; the duties behind it are Arts. 53 and 55 and the Art. 91 and 93 responses.
  "101(2)": >-
    Preliminary findings are communicated to the model provider and it is given an opportunity to
    be heard. A procedural right of the provider.
  # --- Art. 111 — the legacy systems. Each of these is a RELIEF that moves a date, and each is
  # reported through the legacy note rather than by changing a rule's own effective date.
  "111(2)": >-
    A relief for operators of high-risk systems placed before Chapter III applies: they are reached
    only if the system undergoes significant changes in design after that date. It then closes off
    that relief for the providers and deployers of systems INTENDED TO BE USED BY PUBLIC
    AUTHORITIES, who must comply by 2 August 2030 regardless. A date, not a duty.
  "111(3)": >-
    A deferral for providers of general-purpose AI models placed before 2 August 2025: comply by
    2 August 2027. It moves when the Chapter V duties the AIA-GP-* rules carry bite, and adds none.
  "111(4)": >-
    A deferral for providers of synthetic-content generators placed before 2 August 2026: comply
    with Art. 50(2) by 2 December 2026. Later than the date AIA-TR-A50-2 carries, and reported in
    the legacy note so the rule's own date stays the one the Act sets for a new system.
  "3(3)": >-
    Defines 'provider'. Who the party IS, not what it owes: develops or has developed a system or
    model and places it on the market or into service under its own name, paid or free. The whole
    of the provider's obligations hang off this term and none of them is here.
  "3(4)": >-
    Defines 'deployer'. Who the party IS: uses a system under its own authority, except in a
    personal non-professional activity. The deployer's duties are Arts. 26 and 27.
  "3(5)": >-
    Defines 'authorised representative', and names the provider only to say who mandates one. What
    the representative owes is Art. 22(3); what the provider owes is the appointment, Art. 22(1).
  "3(6)": >-
    Defines 'importer'. Who the party IS: established in the Union and places on the market a
    system bearing a third-country party's name. What an importer owes is Art. 23.
  "3(7)": >-
    Defines 'distributor', naming the provider and importer only to exclude them from it — a
    distributor is a supply-chain party that is neither. What a distributor owes is Art. 24.
  "3(8)": >-
    Defines 'operator' as the union of the five: provider, product manufacturer, deployer,
    authorised representative, importer or distributor. A collective noun used by the enforcement
    articles; every duty it carries is written against the term in those articles, not here.
  "3(11)": >-
    Defines 'putting into service', naming the deployer only as the party a system is supplied to
    for first use. It fixes WHEN an obligation attaches; it creates none for the deployer.
  "3(12)": >-
    Defines 'intended purpose' by reference to what the provider specifies. It makes the provider
    the author of the purpose the rest of the Act tests against, and imposes nothing itself; the
    duty to state it is Art. 13(3)(b)(i), carried by AIA-HR-A13-3.
  "3(15)": >-
    Defines 'instructions for use' as information the provider gives the deployer. Both parties are
    named to say what the document IS; what it must contain is Art. 13(3).
  "3(16)": >-
    Defines 'recall' as return to the provider, or taking out of service, of a system made
    available to deployers. Both named descriptively; the duty to recall is Art. 20(1).
  "3(23)": >-
    Defines 'substantial modification', naming the provider only as the party whose initial
    conformity assessment did not foresee the change. The consequence is Art. 43(4).
  "3(24)": >-
    Defines 'CE marking' as a marking by which a provider indicates conformity. Descriptive; the
    duty to affix it is Art. 48, carried by AIA-PO-A48-2 and AIA-PO-A48-4.
  "3(25)": >-
    Defines 'post-market monitoring system' as activities carried out by providers. Descriptive;
    the duty to have one is Art. 72, carried by AIA-PO-A72.
  "3(54)": >-
    Defines 'sandbox plan' as a document agreed between the participating provider and the
    authority. Part of the sandbox regime, which is the authority's to run.
  "3(55)": >-
    Defines 'AI regulatory sandbox' as a framework a competent authority sets up for providers.
    Names the provider as the party offered a possibility; a possibility is not an obligation.
  "3(56)": >-
    Defines 'AI literacy' by reference to what providers, deployers and affected persons
    understand. The duty on the provider and the deployer is Art. 4, carried by AIA-ALL-A04.
  "3(61)": >-
    Defines 'widespread infringement' by where harm falls and where the party acted. It names the
    provider, the deployer and the authorised representative through 'operator'; the term is used
    by the enforcement chapter against authorities, and creates no duty for any of them.
  "3(68)": >-
    Defines 'downstream provider' as a provider integrating a model into a system. A relation
    between two providers, used by Art. 53(1)(b); the duty is on the model provider, not defined
    here.
