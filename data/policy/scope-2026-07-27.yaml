    A/10: CASCADE annex_i — Regulation (EU) 2016/426, gas-burning appliances. Section A.
    A/11: CASCADE annex_i — Regulation (EU) 2017/745, medical devices. Section A.
    A/12: CASCADE annex_i — Regulation (EU) 2017/746, in vitro diagnostic medical devices. Section A.
    B/13: CASCADE annex_i — Regulation (EC) No 300/2008, civil aviation security. Section B.
    B/14: CASCADE annex_i — Regulation (EU) No 168/2013, two- and three-wheel vehicles and
