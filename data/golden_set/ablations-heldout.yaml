# Ablation plan — HELD-OUT (`test`) split, generated from the SECOND reference document.
#
# Companion to ablations.yaml (the `dev` split, generated from hr-candidate-scoring.md). Same
# recipe, different document: PathFinder internal mobility, Annex III point 4(b).
#
# WHY THIS EXISTS AS A SEPARATE FILE AND A SEPARATE OUTPUT
# --------------------------------------------------------
# What a gap checker overfits is not the answer key — that is exact by construction, we know what
# was deleted — but the PROSE of the document it was tuned against: heading style, vocabulary,
# section order, register. So the held-out unit is the DOCUMENT, and more ablations of
# hr-candidate-scoring.md would not be held out in any meaningful sense.
#
# Physical separation is deliberate: separate manifest, separate cases directory, separate
# golden_set_heldout.json. Loading the dev set cannot pull these cases in by accident.
#
# THE DISCIPLINE
# --------------
#   - Authored BEFORE any M4 code existed. No retrieval behaviour had been observed, so none of it
#     could have shaped these cases. That is what makes them genuinely held out.
#   - Do not tune prompts, chunking, thresholds or judge criteria against these numbers. Not once.
#   - Run at reporting time and record the date and the git sha alongside the score.
#   - If you do tune against it, it is dev now — permanently. Say so and author a new one.
#
# DISTRIBUTION MATCHES DEV EXACTLY: same 19 cases, same ablation type per rule, same difficulty
# labels, same deliberate `expect: pass` probe on Art. 12. A held-out set is meant to estimate
# performance on unseen cases from the SAME population — making it harder would produce a
# pessimistic number that measures nothing, making it easier would flatter.
#
# ablation types (see schemas/enums.py AblationType):
#   removed               -> section deleted outright                      -> expect GAP
#   present_but_inadequate-> section reduced to an empty assertion         -> expect INADEQUATE
#   distractor            -> plausible but non-responsive marketing text   -> expect GAP
#   untouched             -> nothing degraded (the pristine document)      -> expect PASS

reference: internal-mobility.md
system_id: internal-mobility
# Which Annex III area the document's system falls in. Read, not assumed: the rules a case is
# scored on are SELECTED for this area, so a document describing something else would be judged
# against obligations it does not owe.
annex_iii_area: employment
default_split: test  # every case here is HELD OUT — the reportable split

cases:
  # --- Art. 9 — risk management ---------------------------------------------------------------
  - rule_id: AIA-HR-A09
    ablation: removed
    difficulty: obvious

  - rule_id: AIA-HR-A09
    ablation: present_but_inadequate
    difficulty: buried
    replacement: |
      ## Part C — Risk management

      Meridian maintains a risk management system for PathFinder covering the full product
      lifecycle. Risks are identified, evaluated and mitigated on a continuous basis, and the
      Product Risk Council reviews the process regularly. Our approach follows recognised
      industry frameworks for trustworthy AI.

  - rule_id: AIA-HR-A09
    ablation: distractor
    difficulty: buried
    replacement: |
      ## Part C — Our people-first philosophy

      Meridian was founded on the belief that every employee deserves a fair shot at their next
      role. Careers are not spreadsheets, and no algorithm should ever tell someone what they are
      worth. That conviction shapes how we build. Our founders came from HR, not from adtech, and
      we have turned down business that would have used our technology to rank people out of
      opportunities. We publish an annual Workforce Fairness Report and sit on two European
      advisory boards on the future of work.

