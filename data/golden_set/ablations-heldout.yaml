    ablation: removed
    difficulty: obvious

  - rule_id: AIA-HR-A10
    ablation: present_but_inadequate
    difficulty: buried
    replacement: |
      ## Part B — Data foundation

      PathFinder is trained on a large and carefully curated set of internal mobility records from
      our client base. We apply appropriate data governance throughout, and our training data is
      relevant, representative and suitable for the intended purpose. Data quality is reviewed by
      our data engineering team on an ongoing basis.

  - rule_id: AIA-HR-A10
    ablation: distractor
    difficulty: buried
    replacement: |
      ## Part B — Data protection and residency

      All employee data is encrypted in transit with TLS 1.3 and at rest with AES-256. Meridian is
      ISO 27001 and ISO 27701 certified and holds a SOC 2 Type II report. Data is processed
      exclusively in EU regions (Frankfurt, Amsterdam) and never leaves the EEA. We execute a
      DPA with every client, maintain records of processing under Article 30 GDPR, and support
      data subject access, rectification and erasure requests through a self-service portal.
      Retention is configurable per tenant, and sub-processors are listed publicly.

