# Layer 1 — classification golden set.
#
# Each case is a use-case DESCRIPTION (the only input a classifier sees) plus its known RISK CLASS
# and the decisive sub-answers. Ground truth is fixed by the author naming the single fact that
# forces the class — not by any judgement the classifier is trusted to make. The schema
# (ClassificationCase) re-enforces the Regulation's own invariants (Art. 5 prohibition, Art. 6(3)
# profiling carve-back, derogation => not_high_risk), so this answer key cannot contradict the law.
#
# Descriptions are ANONYMISED function descriptions — no vendor names sit next to a legal verdict.
#
# split: all current cases are `dev`; the held-out `test` split is intentionally EMPTY, to be
# authored later as fresh, never-inspected descriptions (mirrors the Layer 2 decision).

act_version_date: 2024-07-12
default_split: dev

cases:
  # --- THE FLIP (the project's headline) ------------------------------------------------------
  # Two descriptions that differ by ONE sentence, and the legal class flips. A keyword matcher
  # cannot separate them — both are about CVs and candidates — so this is the case that shows the
  # tool reads meaning, not words.
  - case_id: cv_parsing_fields
    description: >-
      An applicant-tracking feature that reads uploaded CVs and application forms and extracts
      structured fields — candidate name, contact details, employment history, education and
      skills — into the recruiter's database. It parses documents in several formats and
      normalises dates and job titles. It does not score, rank, or otherwise evaluate candidates;
      recruiters review the extracted fields themselves.
    expected_risk_class: not_high_risk
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: narrow_procedural_task
    expected_transparency_obligation: false
    transparency_basis: >-
      None of Art. 50's four paragraphs attach. It reads uploaded documents and writes fields to a
      database — it does not interact directly with candidates (50(1); the recruiter consumes the
      output), generates no synthetic content (50(2)), is not an emotion recognition or biometric
      categorisation system (50(3)), and produces no deep fake or public-interest text (50(4)).
    decisive_fact: >-
      Extraction of fields only, with no evaluation of the person — a narrow procedural task under
      Art. 6(3)(a). Falls within Annex III(4) employment but the derogation applies.
    difficulty: obvious

  - case_id: cv_parsing_plus_scoring
    flips_from: cv_parsing_fields
    description: >-
      An applicant-tracking feature that reads uploaded CVs and application forms and extracts
      structured fields — candidate name, contact details, employment history, education and
      skills — into the recruiter's database. It parses documents in several formats and
      normalises dates and job titles. It also computes a fit score from 0 to 100 for each
      candidate against the role and ranks applicants by that score for the recruiter's shortlist.
    expected_risk_class: high_risk
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_transparency_obligation: false
    transparency_basis: >-
      Unchanged from cv_parsing_fields — scoring and ranking are neither direct interaction (50(1))
      nor content generation (50(2)). Deliberate: the added sentence flips the RISK TIER and must
      leave Art. 50 alone, which is the point of keeping the two axes separate.
    decisive_fact: >-
      The added scoring/ranking sentence makes the system evaluate natural persons — profiling
      under Art. 6(3). Notwithstanding any procedural-task derogation, profiling forces high_risk.
    difficulty: buried
    notes: >-
      Differs from cv_parsing_fields by a single sentence. The decisive fact is buried in an
      otherwise identical parsing description — a keyword checker sees the same words in both.

  # --- PROHIBITED (Art. 5) — the clean, defensible case ---------------------------------------
  - case_id: emotion_monitoring_employees
    description: >-
      A workplace analytics module that processes webcam and microphone feeds of employees during
      their working day to infer emotional states — stress, engagement, frustration — and reports
      per-employee 'engagement' scores to managers.
    expected_risk_class: prohibited
    expected_prohibited: true
    expected_transparency_obligation: true  # CORRECTED 2026-07-22 (was false) — see basis
    transparency_basis: >-
      Art. 50(3): "Deployers of an emotion recognition system ... shall inform the natural persons
      exposed thereto of the operation of the system." This IS an emotion recognition system, so
      50(3) attaches by its own terms. The Art. 5 prohibition does not disapply it: Art. 50(3)'s
      only carve-out is for law-enforcement use, and Art. 5(1)(f) itself excepts medical and safety
      purposes — under which such a system may be lawfully deployed and 50(3) squarely bites.
    decisive_fact: >-
      Inference of emotions of natural persons in the workplace — an Art. 5(1)(f) prohibited
      practice. Evaluated BEFORE high-risk classification; it never reaches Art. 6.
    difficulty: obvious
    notes: >-
      Deliberately an EMPLOYEE-monitoring case (unambiguously 'workplace'), kept distinct from the
      recruitment-stage reading in emotion_screening_candidates (both now prohibited, but that one
      relies on Commission guidance to reach the hiring stage; this one does not).

  # --- PROHIBITED (was ambiguous; resolved by Commission guidance C(2025) 5052, para 254) --------
  - case_id: emotion_screening_candidates
    description: >-
      A recruitment tool that analyses facial expressions and vocal tone in candidates' recorded
      video interviews to infer emotional signals such as 'enthusiasm' and 'confidence', surfacing
      them to recruiters alongside the application.
    expected_risk_class: prohibited
    expected_prohibited: true
    expected_transparency_obligation: true  # CORRECTED 2026-07-22 (was false) — see basis
    transparency_basis: >-
      Art. 50(3), as for emotion_monitoring_employees — it is an emotion recognition system and the
      paragraph attaches to that system type regardless of the Art. 5 verdict. Arguably Art. 50(1)
      as well, since candidates respond to the system in a recorded interview; 50(3) alone is
      enough and is the cleaner basis.
    guidance_refs:
      - C-2025-5052/workplace-covers-recruitment
    decisive_fact: >-
      Art. 5(1)(f) prohibits emotion inference 'in the areas of workplace and education
      institutions'. The Commission Guidelines on prohibited practices (C(2025) 5052 final, para
      254) read 'workplace' broadly to cover the selection/hiring stage, and give emotion
      recognition during recruitment as a prohibited example — so this is PROHIBITED, not
      needs_review. NOTE: this label rests on the Commission's NON-BINDING interpretation (see
      guidance_refs); the CJEU is the ultimate authority. Was 'ambiguous' before the guidance
      resolved the hiring-context question.
    difficulty: obvious
    notes: >-
      RESOLVED (was the roadmap's 'is hiring a workplace?' open question). Commission guidance
      C(2025) 5052 final para 254 settles it: 'workplace' covers the selection/hiring stage, so this
      is prohibited. Kept as a case precisely because the resolution rests on NON-BINDING guidance,
      not the bare Article 5 text — the label carries a guidance_ref to make that dependence
      explicit and auditable.

  # --- TRANSPARENCY (Art. 50 applies even to a minimal-risk use) ------------------------------
  - case_id: job_ad_generation
    description: >-
      A drafting assistant that generates job-advertisement text from a short role brief. A
      recruiter reviews and edits the draft before it is published. The tool does not read, score,
      or evaluate any candidate.
    expected_risk_class: minimal
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_performs_profiling: false
    expected_transparency_obligation: true
    transparency_basis: >-
      Art. 50(2): providers of AI systems generating synthetic text must mark the output in a
      machine-readable format as artificially generated. The 50(2) carve-out for systems performing
      "an assistive function for standard editing" does not apply — it drafts the advert, it does
      not merely edit the user's text. The recruiter's review before publication is relevant to the
      editorial-control exception in 50(4), which concerns public-interest text and is not in play.
    decisive_fact: >-
      Content generation that evaluates no natural person — outside Annex III, so minimal risk. But
      Art. 50 transparency (AI-generated content) applies INDEPENDENTLY of the risk tier.
    difficulty: obvious
    notes: >-
      Shows an obligation attaching to a minimal-risk use: risk tier and transparency are separate
      questions.

  # --- MINIMAL (false-positive anchor: not everything in HR is high-risk) ---------------------
  - case_id: interview_scheduler
    description: >-
      A scheduling tool that proposes interview time slots by matching recruiters' and candidates'
      stated calendar availability, and sends the confirmed invitations. It does not assess,
      rank, or make any recommendation about candidates.
    expected_risk_class: minimal
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50(1) does not attach: the tool matches STATED availability and emits invitations: it is
      not intended to interact directly with candidates as an interlocutor, and 50(1) excepts what
      is obvious to a reasonably observant person in any event. Nothing is generated (50(2)), no
      emotions inferred (50(3)), no deep fake (50(4)). NOTE THE CONTRAST with the real-world
      scheduling page in data/golden_set/smoke/interview-coordination.md, which converses with
      candidates over SMS and WhatsApp — there Art. 50(1) is a much stronger fit. The label is for
      THIS description, and the difference between the two is exactly a fact a card must state.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_performs_profiling: false
    decisive_fact: >-
      Purely logistical calendar matching with no evaluation of persons — outside Annex III(4).
      A classifier that flags anything HR-adjacent as high-risk fails here.
    difficulty: obvious

  # --- NEEDS_REVIEW (insufficient input — the description never supplies the decisive fact) -----
  # Restores the needs_review coverage lost when emotion_screening_candidates resolved to
  # prohibited, and does it WITHOUT needing a contested legal question. The law here is not
  # unclear; the document is silent. Compare interview_scheduler, which reads similarly but
  # explicitly states "does not assess, rank, or make any recommendation" — that sentence is the
  # entire difference between a decidable case and this one.
  - case_id: ats_workflow_unspecified
    description: >-
      A recruitment operations platform used by hiring teams to manage open roles and applications
      end to end. It ingests applications from job boards and the company careers site, keeps
      candidate records current across the hiring pipeline, and routes each application to the
      responsible hiring team. A machine-learning component determines the order in which
      applications appear in each reviewer's queue; the objective for that component is configured
      per customer, and this documentation does not state which signals it uses. The platform also
      tracks stage transitions, sends templated status emails drafted by the recruiter, and
      produces weekly funnel reports for HR leadership. It integrates with the customer's HRIS,
      calendar and job-board accounts.
    expected_risk_class: needs_review
    expected_annex_iii_area: employment
    expected_performs_profiling: null   # NOT "no" — genuinely unknowable from this text
    expected_derogation: null           # cannot be established, so cannot be claimed
    expected_transparency_obligation: false
    transparency_basis: >-
      Determinable even though the tier is not, which is deliberate — the case should turn on ONE
      missing fact, not on everything being vague. Status emails are drafted by the recruiter, not
      generated by the system, so Art. 50(2) does not attach; no direct interaction as an
      interlocutor (50(1)), no emotion inference (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      THE DECISIVE FACT IS ABSENT — and exactly one fact is. It is unambiguously an AI system (a
      machine-learning component) unambiguously used in recruitment, so Art. 3(1) and Annex III(4)
      are both settled. What is never stated is WHAT THE MODEL ORDERS ON. Ordering by submission
      time or reviewer workload evaluates nobody and is a narrow procedural task under
      Art. 6(3)(a) -> not_high_risk. Ordering by predicted fit evaluates natural persons -> profiling,
      and the Art. 6(3) carve-back forces high_risk notwithstanding any derogation. The text
      chooses neither, so the correct answer is NEEDS_REVIEW — ask the provider — and a confident
      verdict is wrong whichever of the two it lands on.
    difficulty: insufficient
    notes: >-
      SILENCE IS NOT EVIDENCE OF ABSENCE. The failure this case exists to catch is reading "the
      text never mentions ranking" as "the system does not rank", and awarding a derogation on
      that basis. Art. 6(3) puts the burden on ESTABLISHING the condition and Art. 6(4) requires
      the assessment be documented, so a derogation inferred from silence is unsupported — it
      hands the provider an exemption they never claimed. Expected to FAIL against the cascade as
      built — no node can distinguish "asserted absent" from "not mentioned"; the fix is the next
      step. Note `expected_performs_profiling: null` here means GENUINELY UNKNOWABLE, not merely
      unpinned — the only case in the set where that is so.
      DRAFTING NOTE: an earlier version left the AI-ness unstated too, and the cascade exited at
      the very first node (`is_ai` = false, HIGH confidence, "executes explicit instructions").
      Right disease, wrong node — and it made the case test two unknowns at once. The
      machine-learning sentence was added so exactly one fact is missing. Keep it that way: a case
      that is vague about everything measures nothing in particular.

  # --- THE ANNEX III BOUNDARY: recruitment/named-decision phase vs adjacent admin -------------
  # Added 2026-07-22 after the held-out run showed the annex_iii node cannot reliably tell a
  # recruitment-phase tool from post-hire administrative tooling. These teach the distinction on
  # the DEV side; the held-out cases that exposed it are left untouched. The line is the Act's own:
  # Annex III(4)(a) is recruitment/selection, (4)(b) is named workforce DECISIONS (promotion,
  # termination, task allocation, performance) — admin around already-hired staff that makes none
  # of those is outside Annex III entirely.
  - case_id: leave_balance_tracker
    description: >-
      A tool for HR teams that tracks employees' paid-leave and holiday balances, records leave
      requests, and routes each request to the employee's manager for approval. It calculates
      accruals and remaining balances and sends reminders about unused leave. It makes no decision
      itself and does not assess, score or rank anyone.
    expected_risk_class: minimal
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_performs_profiling: false
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: it tracks balances and routes requests — no direct interaction as an
      interlocutor (50(1)), no synthetic content (50(2)), no emotion or biometric inference (50(3)),
      no deep fake (50(4)).
    decisive_fact: >-
      Post-hire leave administration for already-employed staff. Not recruitment or selection
      (Annex III(4)(a)), and it makes none of the (4)(b) decisions — the manager approves, not the
      tool, and leave is not a term/promotion/termination/task/performance decision. Outside
      Annex III entirely, so minimal — being used inside an HR department does not put it in scope.
    difficulty: buried
    notes: >-
      Teaches: administrative tooling around employed staff is OUTSIDE Annex III, even though it is
      unmistakably 'HR'. The trap is broad-sector matching ('it's about employees') over the
      specific listed uses.

  - case_id: candidate_dedupe_prep
    description: >-
      A recruitment tool that gathers job applications arriving from several job boards and the
      careers site, detects when the same candidate has applied more than once, and merges the
      duplicate application records into one before a recruiter reviews the pile. It performs no
      scoring, ranking or evaluation of candidates.
    expected_risk_class: not_high_risk
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: narrow_procedural_task
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: de-duplicating and merging application records is not direct
      interaction (50(1)), generates no synthetic content (50(2)), infers no emotion (50(3)) and
      produces no deep fake (50(4)).
    decisive_fact: >-
      Processes job applications DURING recruitment, so it is within Annex III(4)(a) — but it only
      de-duplicates and merges records, a narrow procedural task under Art. 6(3)(a) with no
      evaluation of the person, so not_high_risk (Art. 6(4) documentation still owed). Contrast
      leave_balance_tracker: same 'HR' setting, but this one is in the recruitment phase and so IS
      in scope before the derogation carves it back.
    difficulty: buried
    notes: >-
      Teaches: a recruitment-phase preparatory tool is INSIDE Annex III (then exempt), NOT minimal.
      The not_high_risk/minimal line matters — not_high_risk still owes Art. 6(4).

  # --- Art. 6(1): the OTHER door into high-risk (Annex I) ----------------------------------------
  # None of these are in any Annex III area. Before the annex_i node existed the cascade answered
  # "no area" and exited to minimal — telling a surgical robot it owed nothing. Every case here
  # would have scored WRONG then, which is the point of adding them.
  - case_id: surgical_robot_dose_control
    description: >-
      An AI dose-control module embedded in a robotic surgical system. It computes and limits the
      energy delivered by the cutting instrument in real time, and halts the actuator when tissue
      impedance leaves the safe envelope. It ships as part of the robot, which is a class IIb
      medical device CE-marked under Regulation (EU) 2017/745 following notified-body assessment.
    expected_risk_class: high_risk
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: true
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: the module drives an actuator inside a surgical robot. It does not
      interact directly with a natural person (50(1)), generates no synthetic content (50(2)),
      infers no emotion and categorises nobody biometrically (50(3)), and produces no deep fake
      or public-interest text (50(4)).
    decisive_fact: >-
      A safety component of a class IIb medical device, which requires notified-body conformity
      assessment — both limbs of Art. 6(1) are met, so high_risk. It appears in NO Annex III area:
      an Annex III-only cascade answers "no area" and exits to minimal, which is a false clearance.
    difficulty: obvious
    split: dev
    notes: >-
      Teaches: Art. 6 has TWO doors. Annex III asks what the AI is used FOR; Annex I asks what it
      is PART OF. A classifier that only knows the second door clears this system entirely.

  - case_id: vehicle_emergency_braking
    description: >-
      An AI perception component in an automatic emergency braking system for passenger cars. It
      detects pedestrians and cyclists in the vehicle's path and triggers braking without driver
      input. It is type-approved as part of the vehicle under Regulation (EU) 2018/858.
    expected_risk_class: high_risk
    expected_annex_i_product: motor_vehicles
    expected_third_party_assessment: true
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: it actuates brakes from sensor input. No direct interaction with a
      person (50(1)), no synthetic content (50(2)), no emotion inference or biometric
      categorisation (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      High-risk under Art. 6(1) via Annex I SECTION B. The class is the same as the surgical robot,
      but what follows is not: Art. 2(2) means only Art. 6(1), 102-109 and 112 apply, so Chapter III
      does NOT. Classifying it high_risk and then raising Art. 9-15 would be a false accusation.
    difficulty: obvious
    split: dev
    notes: >-
      Teaches the Section A / Section B split. The risk CLASS is not sufficient to decide what is
      owed — see AnnexIProduct.chapter_iii_applies and the Art. 2(2) branch in gap/rules.select.

  - case_id: drill_press_wear_monitor
    description: >-
      An AI vibration-monitoring feature in a benchtop drill press. It models bearing wear from
      spindle vibration and shows the operator a maintenance reminder when a service is due. The
      drill press is standard machinery under Directive 2006/42/EC; it is not listed in Annex IV of
      that Directive, so the manufacturer self-certifies with an internal-control assessment.
    expected_risk_class: minimal
    expected_annex_i_product: machinery
    expected_third_party_assessment: false
    expected_annex_iii_area: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: a maintenance reminder is not direct interaction of the kind
      50(1) addresses, and none of 50(2)-(4) apply.
    decisive_fact: >-
      Limb (a) of Art. 6(1) is met and limb (b) is NOT — the machinery self-certifies, with no
      notified body. Art. 6(1) is a conjunction, so it is not high-risk by that door; and it falls
      within no Annex III area either, so minimal.
    difficulty: buried
    split: dev
    flips_from: drill_press_in_annex_iv
    notes: >-
      The negative case for condition (b). A classifier that treats "is it an Annex I product?" as
      sufficient marks this high_risk and demands Chapter III of a bench drill.

  - case_id: drill_press_in_annex_iv
    description: >-
      An AI vibration-monitoring feature in an industrial woodworking saw. It models blade and
      bearing wear from spindle vibration and shows the operator a maintenance reminder when a
      service is due. The saw is a portable hand-fed circular saw listed in Annex IV of Directive
      2006/42/EC, so its conformity is assessed by a notified body before it may be placed on the
      market.
    expected_risk_class: high_risk
    expected_annex_i_product: machinery
    expected_third_party_assessment: true
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: a maintenance reminder shown to the machine operator is not the
      direct interaction 50(1) addresses, it generates no synthetic content (50(2)), infers no
      emotion and categorises nobody biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      Same AI feature, same product family, opposite class — because THIS machine is listed in
      Annex IV of the Machinery Directive and so requires notified-body assessment, satisfying
      Art. 6(1)(b). The flip is one fact about the PRODUCT, not about the AI.
    difficulty: buried
    split: dev
    flips_from: drill_press_wear_monitor
    notes: >-
      The Annex I flip, and the mirror of cv_parsing_plus_scoring. There the flip is a sentence
      about what the AI does; here the AI is identical and the flip is the host product's
      conformity route. Both are one-fact flips a keyword classifier cannot see.

  - case_id: theatre_and_shift_scheduler
    description: >-
      An AI tool used by a hospital to schedule operating-theatre slots and allocate staff shifts.
      It optimises room utilisation against expected procedure durations, proposes rotas, and sends
      calendar reminders to clinical teams. It does not connect to, control, or exchange data with
      any medical device.
    expected_risk_class: minimal
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: proposing rotas and sending reminders is not direct interaction of
      the kind 50(1) addresses, and 50(2)-(4) do not apply.
    decisive_fact: >-
      Medical SETTING, but not a safety component of any product — it touches no device, and its
      failure delays a list rather than endangering a patient mid-procedure. Outside Annex I, and
      no Annex III area either, so minimal.
    difficulty: buried
    split: dev
    notes: >-
      The Annex I distractor. Dense medical vocabulary next to a purely administrative function —
      the false-positive control for the annex_i node, matching the role leave_balance_tracker
      plays for annex_iii. Note it is deliberately NOT the Annex III(4) workforce-management case:
      shift allocation is scheduling logistics, not a decision about a person.

  - case_id: defence_drone_swarm_coordination
    description: >-
      An AI system procured by a national ministry of defence to coordinate formations of
      reconnaissance drones on military operations. It assigns search patterns across the formation,
      re-tasks aircraft when one is lost, and relays imagery to a command post. It is fielded only by
      the armed forces and is not offered on any civil market.
    expected_risk_class: out_of_scope
    expected_scope_exclusion: military_defence_national_security
    scope_exclusion_basis: >-
      Art. 2(3), second subparagraph. The system is put into service exclusively for military and
      defence purposes, and the subparagraph applies regardless of the type of entity carrying out
      those activities.
    expected_annex_iii_area: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Not reached: a system the Regulation does not govern owes nothing under Art. 50. On the facts
      none of it attaches either — coordinating aircraft is no direct interaction with a natural
      person (50(1)), generates no synthetic content (50(2)), infers no emotion and categorises
      nobody biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      The purpose of use is military, so Art. 2 withholds the Regulation entirely and no risk tier
      is ever reached. The word carrying the weight is "exclusively" — nothing here points at a
      civil use of this system.
    difficulty: obvious
    split: dev
    notes: >-
      The clean dev anchor for out_of_scope, and the tuning counterpart to the held-out Art. 2
      batch. Deliberately unambiguous: a classifier that cannot exclude this one is not reading
      Art. 2 at all. Pairs with border_surveillance_drone_analytics.

  - case_id: border_surveillance_drone_analytics
    description: >-
      An AI system procured by a national border police force to analyse the video feed from
      surveillance drones patrolling a land border. It detects groups of people crossing outside
      authorised points and alerts officers, who decide whether to intercept. The contract is awarded
      under the national law implementing the EU directive on procurement in the fields of defence
      and security, and the ministry describes the deployment as protecting national frontiers.
    expected_risk_class: high_risk
    expected_annex_i_product: null
    expected_annex_iii_area: migration
    expected_performs_profiling: false
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: detecting crossings and alerting officers is no direct interaction
      with the people observed (50(1)), generates no synthetic content (50(2)), produces no deep fake
      (50(4)), and detecting that people are present assigns nobody to a category on the basis of
      biometric data (50(3)).
    decisive_fact: >-
      Border policing is law enforcement, not defence. Art. 2(3) turns on the purpose of USE, so
      buying under defence-and-security procurement law settles which tendering rules apply and
      nothing about scope; "protecting national frontiers" is border control, which Annex III(7)
      lists in its own right. In scope, and high-risk by the Annex III door.
    difficulty: buried
    split: dev
    flips_from: defence_drone_swarm_coordination
    notes: >-
      The near neighbour for Art. 2(3), and the more useful half of the pair: same aircraft, same
      ministry-adjacent buyer, same defence-flavoured vocabulary, opposite side of the exclusion.
      A classifier that grants the exclusion on the words "defence" or "national" fails here, and
      fails silently — it clears a system the Regulation makes high-risk.

  - case_id: third_country_mla_lead_ranking_with_safeguards
    description: >-
      A national police agency of a non-EU country runs an AI tool that ranks incoming case referrals
      by how likely each is to yield a prosecutable lead. It draws on records shared with it by
      several EU Member States under a judicial cooperation agreement between that country and the
      Union, and its rankings are sent back to the requesting Member State's investigators. The
      agreement's published text records that the Commission has assessed the country's data
      protection regime and found that it provides adequate safeguards for the fundamental rights and
      freedoms of the individuals whose data is exchanged, and it binds the agency to those
      safeguards for every system processing data received under it.
    expected_risk_class: out_of_scope
    expected_scope_exclusion: third_country_law_enforcement_cooperation
    scope_exclusion_basis: >-
      Art. 2(4). A third-country public authority that would otherwise be caught by Art. 2(1)(c) —
      its output is used in the Union — is outside the Regulation where it uses AI systems in the
      framework of an agreement for law enforcement and judicial cooperation with the Union, provided
      that country affords adequate safeguards for fundamental rights and freedoms. The document
      supplies both halves: the cooperation framework, and the safeguards finding.
    expected_annex_iii_area: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Not reached: a body the Regulation does not govern owes nothing under Art. 50. On the facts
      none of it attaches either — ranking case referrals for investigators is no direct interaction
      with the people concerned (50(1)), generates no synthetic content (50(2)), infers no emotion and
      categorises nobody biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      The SAFEGUARDS FINDING is stated. Art. 2(4) is the only exclusion in the Article whose
      condition is about a country rather than about the system, and it is written as a proviso — so
      the exclusion stands or falls on whether that finding is established. Here the agreement records
      it, so the exclusion applies and no risk tier is reached, even though ranking prosecutable leads
      would otherwise sit squarely in the Annex III(6) law-enforcement area.
    difficulty: obvious
    split: dev
    notes: >-
      The only case in either file keyed to Art. 2(4), and it is dev rather than held out on purpose:
      no real system description states a safeguards finding, so a held-out case would mean inventing
      the decisive fact — which the held-out brief forbids. Recorded in the roadmap so the gap stays
      visible.
      Pairs with third_country_mla_lead_ranking_unstated, which is the half that actually matters.

  - case_id: third_country_mla_lead_ranking_unstated
    description: >-
      A national police agency of a non-EU country runs an AI tool that ranks incoming case referrals
      by how likely each is to yield a prosecutable lead. It draws on records shared with it by
      several EU Member States under a judicial cooperation agreement between that country and the
      Union, and its rankings are sent back to the requesting Member State's investigators. The
      agency's own service description sets out the ranking model, its training data and its review
      cycle, and states that the tool is used only for referrals arriving through the cooperation
      channel. It says nothing about the data protection regime of the country it operates in.
    expected_risk_class: needs_review
    expected_annex_iii_area: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Undeterminable along with the tier, and recorded as false only because nothing in the
      description supports an obligation: ranking referrals for investigators is no direct interaction
      with the people concerned (50(1)), generates no synthetic content (50(2)), infers no emotion and
      categorises nobody biometrically (50(3)), and produces no deep fake (50(4)). Silence, not a
      finding.
    difficulty: insufficient
    split: dev
    flips_from: third_country_mla_lead_ranking_with_safeguards
    decisive_fact: >-
      The safeguards finding is ABSENT. Art. 2(4) excludes a third-country authority only "provided
      that" the country affords adequate safeguards for fundamental rights and freedoms, and no
      document describing a SYSTEM establishes that — it is settled in the cooperation agreement and
      in the Commission's assessment, not in a service description. Silence is not evidence that the
      condition is met, so the exclusion cannot be granted; nor can it be refused, because nothing
      says the safeguards are missing either. Scope is undecided, so the tier is never reached.
    notes: >-
      The load-bearing half of the pair, and the reason 2(4) is treated the way it is. Art. 2(4)
      shares its shape with Art. 6(1)(b): a condition the tool must READ and must never DERIVE, since
      deriving it means ruling on a country's data protection regime from a description of a piece of
      software. The same discipline the roadmap records under M4d-1 for sectoral conformity routes.
      The failure this case measures is granting the exclusion on the words "cooperation agreement" —
      which would clear an Annex III(6) law-enforcement system outright, the worst direction to be
      wrong in. Answering high_risk instead is the safe error and still wrong: scope comes first.
