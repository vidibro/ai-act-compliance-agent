# Layer 1 — classification golden set.
#
# Each case is a use-case DESCRIPTION (the only input a classifier sees) plus its known RISK CLASS
# and the decisive sub-answers. Ground truth is fixed by the author naming the single fact that
# forces the class — not by any judgement the classifier is trusted to make. The schema
# (ClassificationCase) re-enforces the Regulation's own invariants (Art. 5 prohibition, Art. 6(3)
# profiling carve-back, derogation => not_high_risk), so this answer key cannot contradict the law.
#
# Descriptions are ANONYMISED function descriptions — no vendor names sit next to a legal verdict.
#
# EVERY case here is `dev` — tunable, and never a reportable score. The held-out split is currently
# EMPTY: its 24 cases were measured once and then moved here, because a set whose failures have all
# been read is no longer blind (see the batch header further down). A fresh one has to be authored.
#
# PINS DESCRIBE THE ROUTE, not just the answers. Writing a field means "this question is expected
# to be asked, and this is the expected answer"; omitting it means "the cascade is not expected to
# reach this question". The loader enforces both halves against the graph's own routing, so a case
# cannot state a verdict for a question nobody puts, nor leave a question the run WILL ask
# unchecked. NEEDS_REVIEW cases are exempt — see `_check_pins_match_the_route`.

act_version_date: 2024-07-12
default_split: dev

cases:
  # --- THE FLIP (the project's headline) ------------------------------------------------------
  # Two descriptions that differ by ONE sentence, and the legal class flips. A keyword matcher
  # cannot separate them — both are about CVs and candidates — so this is the case that shows the
  # tool reads meaning, not words.
  - case_id: cv_parsing_fields
    description: >-
      An applicant-tracking feature that reads uploaded CVs and application forms and extracts
      structured fields — candidate name, contact details, employment history, education and
      skills — into the recruiter's database. It parses documents in several formats and
      normalises dates and job titles. It does not score, rank, or otherwise evaluate candidates;
      recruiters review the extracted fields themselves.
    expected_risk_class: not_high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers structured fields from unstructured documents: the mapping from free-text CVs
      in many layouts to name, dates, employer and skill is learned, not a rule anyone wrote out.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: narrow_procedural_task
    expected_poses_significant_risk: false
    expected_transparency_duties: []
    transparency_basis: >-
      None of Art. 50's four paragraphs attach. It reads uploaded documents and writes fields to a
      database — it does not interact directly with candidates (50(1); the recruiter consumes the
      output), generates no synthetic content (50(2)), is not an emotion recognition or biometric
      categorisation system (50(3)), and produces no deep fake or public-interest text (50(4)).
    decisive_fact: >-
      Extraction of fields only, with no evaluation of the person — a narrow procedural task under
      Art. 6(3)(a). Falls within Annex III(4) employment but the derogation applies.
    difficulty: obvious

  - case_id: cv_parsing_plus_scoring
    flips_from: cv_parsing_fields
    description: >-
      An applicant-tracking feature that reads uploaded CVs and application forms and extracts
      structured fields — candidate name, contact details, employment history, education and
      skills — into the recruiter's database. It parses documents in several formats and
      normalises dates and job titles. It also computes a fit score from 0 to 100 for each
      candidate against the role and ranks applicants by that score for the recruiter's shortlist.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers twice over — the same field extraction from free text, plus a fit score
      predicted from the extracted profile against the vacancy.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_deployer_type: not_stated
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Unchanged from cv_parsing_fields — scoring and ranking are neither direct interaction (50(1))
      nor content generation (50(2)). Deliberate: the added sentence flips the RISK TIER and must
      leave Art. 50 alone, which is the point of keeping the two axes separate.
    decisive_fact: >-
      The added scoring/ranking sentence makes the system evaluate natural persons — profiling
      under Art. 6(3). Notwithstanding any procedural-task derogation, profiling forces high_risk.
    difficulty: buried
    notes: >-
      Differs from cv_parsing_fields by a single sentence. The decisive fact is buried in an
      otherwise identical parsing description — a keyword checker sees the same words in both.

  # --- PROHIBITED (Art. 5) — the clean, defensible case ---------------------------------------
  - case_id: emotion_monitoring_employees
    description: >-
      A workplace analytics module that processes webcam and microphone feeds of employees during
      their working day to infer emotional states — stress, engagement, frustration — and reports
      per-employee 'engagement' scores to managers.
    expected_risk_class: prohibited
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers emotional state — stress, engagement, frustration — from webcam and microphone
      signal. Nothing in the input states an emotion; the system derives it.
    expected_prohibited_practice: emotion_inference_workplace_education
    expected_transparency_duties: [emotion_or_biometric_categorisation]
    transparency_basis: >-
      Art. 50(3): "Deployers of an emotion recognition system ... shall inform the natural persons
      exposed thereto of the operation of the system." This IS an emotion recognition system, so
      50(3) attaches by its own terms. The Art. 5 prohibition does not disapply it: Art. 50(3)'s
      only carve-out is for law-enforcement use, and Art. 5(1)(f) itself excepts medical and safety
      purposes — under which such a system may be lawfully deployed and 50(3) squarely bites.
    decisive_fact: >-
      Inference of emotions of natural persons in the workplace — an Art. 5(1)(f) prohibited
      practice. Evaluated BEFORE high-risk classification; it never reaches Art. 6.
    difficulty: obvious
    notes: >-
      Deliberately an EMPLOYEE-monitoring case (unambiguously 'workplace'), kept distinct from the
      recruitment-stage reading in emotion_screening_candidates (both now prohibited, but that one
      relies on Commission guidance to reach the hiring stage; this one does not).

  # --- PROHIBITED (was ambiguous; resolved by Commission guidance C(2025) 5052, para 254) --------
  - case_id: emotion_screening_candidates
    description: >-
      A recruitment tool that analyses facial expressions and vocal tone in candidates' recorded
      video interviews to infer emotional signals such as 'enthusiasm' and 'confidence', surfacing
      them to recruiters alongside the application.
    expected_risk_class: prohibited
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers emotional signals such as enthusiasm and confidence from facial expression and
      vocal tone in recorded video. The signal is derived, never stated by the candidate.
    expected_prohibited_practice: emotion_inference_workplace_education
    expected_transparency_duties: [emotion_or_biometric_categorisation]
    transparency_basis: >-
      Art. 50(3), as for emotion_monitoring_employees — it is an emotion recognition system and the
      paragraph attaches to that system type regardless of the Art. 5 verdict. Arguably Art. 50(1)
      as well, since candidates respond to the system in a recorded interview; 50(3) alone is
      enough and is the cleaner basis.
    guidance_refs:
      - C-2025-5052/workplace-covers-recruitment
    decisive_fact: >-
      Art. 5(1)(f) prohibits emotion inference 'in the areas of workplace and education
      institutions'. The Commission Guidelines on prohibited practices (C(2025) 5052 final, para
      254) read 'workplace' broadly to cover the selection/hiring stage, and give emotion
      recognition during recruitment as a prohibited example — so this is PROHIBITED, not
      needs_review. NOTE: this label rests on the Commission's NON-BINDING interpretation (see
      guidance_refs); the CJEU is the ultimate authority. Was 'ambiguous' before the guidance
      resolved the hiring-context question.
    difficulty: obvious
    notes: >-
      RESOLVED (was the roadmap's 'is hiring a workplace?' open question). Commission guidance
      C(2025) 5052 final para 254 settles it: 'workplace' covers the selection/hiring stage, so this
      is prohibited. Kept as a case precisely because the resolution rests on NON-BINDING guidance,
      not the bare Article 5 text — the label carries a guidance_ref to make that dependence
      explicit and auditable.

  # --- TRANSPARENCY (Art. 50 applies even to a minimal-risk use) ------------------------------
  - case_id: job_ad_generation
    description: >-
      A drafting assistant that generates job-advertisement text from a short role brief. A
      recruiter reviews and edits the draft before it is published. The tool does not read, score,
      or evaluate any candidate.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Generates advertisement text from a short role brief: the output is inferred from the
      input, not assembled from a template a person filled in.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: [synthetic_content_marking]
    transparency_basis: >-
      Art. 50(2): providers of AI systems generating synthetic text must mark the output in a
      machine-readable format as artificially generated. The 50(2) carve-out for systems performing
      "an assistive function for standard editing" does not apply — it drafts the advert, it does
      not merely edit the user's text. The recruiter's review before publication is relevant to the
      editorial-control exception in 50(4), which concerns public-interest text and is not in play.
    decisive_fact: >-
      Content generation that evaluates no natural person — outside Annex III, so minimal risk. But
      Art. 50 transparency (AI-generated content) applies INDEPENDENTLY of the risk tier.
    difficulty: obvious
    notes: >-
      Shows an obligation attaching to a minimal-risk use: risk tier and transparency are separate
      questions.

  # --- MINIMAL (false-positive anchor: not everything in HR is high-risk) ---------------------
  - case_id: interview_scheduler
    description: >-
      A scheduling tool that proposes interview time slots by matching recruiters' and candidates'
      stated calendar availability, and sends the confirmed invitations. It does not assess,
      rank, or make any recommendation about candidates.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      CONTESTABLE, and the basis says so rather than asserting the label. Matching two stated
      calendars and sending an invitation is set intersection — a rule a person wrote — so on the
      text as written this arguably infers nothing and Art. 3(1) is not met. Kept `true` pending a
      deliberate ruling; if it is settled as `false` the case tests `is_ai` rather than the Annex
      III scheduling carve-out it was authored for.
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50(1) does not attach: the tool matches STATED availability and emits invitations: it is
      not intended to interact directly with candidates as an interlocutor, and 50(1) excepts what
      is obvious to a reasonably observant person in any event. Nothing is generated (50(2)), no
      emotions inferred (50(3)), no deep fake (50(4)). NOTE THE CONTRAST with the real-world
      scheduling page in data/golden_set/smoke/interview-coordination.md, which converses with
      candidates over SMS and WhatsApp — there Art. 50(1) is a much stronger fit. The label is for
      THIS description, and the difference between the two is exactly a fact a card must state.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    decisive_fact: >-
      Purely logistical calendar matching with no evaluation of persons — outside Annex III(4).
      A classifier that flags anything HR-adjacent as high-risk fails here.
    difficulty: obvious

  # --- NEEDS_REVIEW (insufficient input — the description never supplies the decisive fact) -----
  # Restores the needs_review coverage lost when emotion_screening_candidates resolved to
  # prohibited, and does it WITHOUT needing a contested legal question. The law here is not
  # unclear; the document is silent. Compare interview_scheduler, which reads similarly but
  # explicitly states "does not assess, rank, or make any recommendation" — that sentence is the
  # entire difference between a decidable case and this one.
  - case_id: ats_workflow_unspecified
    description: >-
      A recruitment operations platform used by hiring teams to manage open roles and applications
      end to end. It ingests applications from job boards and the company careers site, keeps
      candidate records current across the hiring pipeline, and routes each application to the
      responsible hiring team. A machine-learning component determines the order in which
      applications appear in each reviewer's queue; the objective for that component is configured
      per customer, and this documentation does not state which signals it uses. The platform also
      tracks stage transitions, sends templated status emails drafted by the recruiter, and
      produces weekly funnel reports for HR leadership. It integrates with the customer's HRIS,
      calendar and job-board accounts.
    expected_risk_class: needs_review
    expected_abstains_at: profiling
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers: the platform ranks applications with a model whose objective the text never
      states. That the ranking is learned is stated; what it optimises is the missing fact.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: null   # NOT "no" — genuinely unknowable from this text
    expected_transparency_duties: []
    transparency_basis: >-
      Determinable even though the tier is not, which is deliberate — the case should turn on ONE
      missing fact, not on everything being vague. Status emails are drafted by the recruiter, not
      generated by the system, so Art. 50(2) does not attach; no direct interaction as an
      interlocutor (50(1)), no emotion inference (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      THE DECISIVE FACT IS ABSENT — and exactly one fact is. It is unambiguously an AI system (a
      machine-learning component) unambiguously used in recruitment, so Art. 3(1) and Annex III(4)
      are both settled. What is never stated is WHAT THE MODEL ORDERS ON. Ordering by submission
      time or reviewer workload evaluates nobody and is a narrow procedural task under
      Art. 6(3)(a) -> not_high_risk. Ordering by predicted fit evaluates natural persons -> profiling,
      and the Art. 6(3) carve-back forces high_risk notwithstanding any derogation. The text
      chooses neither, so the correct answer is NEEDS_REVIEW — ask the provider — and a confident
      verdict is wrong whichever of the two it lands on.
    difficulty: insufficient
    notes: >-
      SILENCE IS NOT EVIDENCE OF ABSENCE. The failure this case exists to catch is reading "the
      text never mentions ranking" as "the system does not rank", and awarding a derogation on
      that basis. Art. 6(3) puts the burden on ESTABLISHING the condition and Art. 6(4) requires
      the assessment be documented, so a derogation inferred from silence is unsupported — it
      hands the provider an exemption they never claimed. Expected to FAIL against the cascade as
      built — no node can distinguish "asserted absent" from "not mentioned"; the fix is the next
      step. Note `expected_performs_profiling: null` here means GENUINELY UNKNOWABLE, not merely
      unpinned — the only case in the set where that is so.
      DRAFTING NOTE: an earlier version left the AI-ness unstated too, and the cascade exited at
      the very first node (`is_ai` = false, HIGH confidence, "executes explicit instructions").
      Right disease, wrong node — and it made the case test two unknowns at once. The
      machine-learning sentence was added so exactly one fact is missing. Keep it that way: a case
      that is vague about everything measures nothing in particular.

  # --- THE ANNEX III BOUNDARY: recruitment/named-decision phase vs adjacent admin -------------
  # Added 2026-07-22 after the held-out run showed the annex_iii node cannot reliably tell a
  # recruitment-phase tool from post-hire administrative tooling. These teach the distinction on
  # the DEV side; the held-out cases that exposed it are left untouched. The line is the Act's own:
  # Annex III(4)(a) is recruitment/selection, (4)(b) is named workforce DECISIONS (promotion,
  # termination, task allocation, performance) — admin around already-hired staff that makes none
  # of those is outside Annex III entirely.
  - case_id: leave_balance_tracker
    description: >-
      A tool for HR teams that tracks employees' paid-leave and holiday balances, records leave
      requests, and routes each request to the employee's manager for approval. It calculates
      accruals and remaining balances and sends reminders about unused leave. It makes no decision
      itself and does not assess, score or rank anyone.
    expected_risk_class: minimal
    expected_is_ai_system: false
    is_ai_basis: >-
      Infers NOTHING. Accruing a balance, recording a request and routing it to a named
      manager are arithmetic and workflow — rules a person wrote, executed as written.
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: it tracks balances and routes requests — no direct interaction as an
      interlocutor (50(1)), no synthetic content (50(2)), no emotion or biometric inference (50(3)),
      no deep fake (50(4)). Asked on every path, including this one, since Art. 50 is independent of
      the tier and of Art. 3(1).
    decisive_fact: >-
      It INFERS NOTHING. Accruing a balance, recording a request and routing it to a named manager
      are arithmetic and workflow — rules a person wrote, executed as written. Art. 3(1) reaches a
      machine-based system that INFERS from its input how to generate its outputs, so this is not an
      AI system and no risk tier is reached; the cascade stops at the first question.
    difficulty: buried
    notes: >-
      Teaches the FIRST question, not the Annex III one. Relabelled 2026-08-18 after a dev run:
      the key said `true` and the model said `false`, and the model had the better reading of
      Art. 3(1) — the text describes no inference anywhere. The old label was never argued, it was
      the default every case carried. Its sibling traps (HR setting but outside Annex III) are
      carried by h_meeting_room_optimizer and theatre_and_shift_scheduler, which do infer.

  - case_id: candidate_dedupe_prep
    description: >-
      A recruitment tool that gathers job applications arriving from several job boards and the
      careers site, detects when the same candidate has applied more than once, and merges the
      duplicate application records into one before a recruiter reviews the pile. It performs no
      scoring, ranking or evaluation of candidates.
    expected_risk_class: not_high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers identity across records: deciding that two applications with differing
      spellings, addresses and dates are the same person is probabilistic matching, not a lookup.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: narrow_procedural_task
    expected_poses_significant_risk: false
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: de-duplicating and merging application records is not direct
      interaction (50(1)), generates no synthetic content (50(2)), infers no emotion (50(3)) and
      produces no deep fake (50(4)).
    decisive_fact: >-
      Processes job applications DURING recruitment, so it is within Annex III(4)(a) — but it only
      de-duplicates and merges records, a narrow procedural task under Art. 6(3)(a) with no
      evaluation of the person, so not_high_risk (Art. 6(4) documentation still owed). Contrast
      leave_balance_tracker: same 'HR' setting, but this one is in the recruitment phase and so IS
      in scope before the derogation carves it back.
    difficulty: buried
    notes: >-
      Teaches: a recruitment-phase preparatory tool is INSIDE Annex III (then exempt), NOT minimal.
      The not_high_risk/minimal line matters — not_high_risk still owes Art. 6(4).

  # --- Chapter V: a general-purpose AI model is not on the Art. 6 track at all ------------------
  # A pair, because the danger is symmetric. Miss the model and a foundation-model provider is told
  # `minimal` while owing Art. 53 today; route out too eagerly and every product running on a large
  # model escapes the tier logic that correctly applies to it.
  - case_id: open_weight_frontier_model_card
    description: >-
      A model card for an open-weight large language model published by a research lab. It gives the
      parameter count, the training corpus and token budget, the context window, benchmark results
      across reasoning, coding, mathematics, summarisation, translation and question answering, the
      licence terms, and instructions for running inference and for fine-tuning on a downstream
      task. The lab describes it as a base model intended to be adapted and embedded into whatever
      applications others wish to build, and states that it is released for general use rather than
      for any particular purpose.
    expected_risk_class: gpai_model
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers its outputs from the input it receives — that is what a language model does. Art. 3(1)
      is met, which is why the cascade reaches the Art. 3(63) question rather than exiting earlier.
    expected_gpai_status: general_purpose_model
    expected_systemic_risk: not_stated
    systemic_risk_basis: >-
      The card gives a parameter count and a token budget and no CUMULATIVE TRAINING COMPUTE in
      floating point operations, and mentions no Commission designation or Art. 52(1) notification.
      Art. 51(1) turns on one or the other, so the honest answer is that the description does not
      say. A run answering high_impact_capabilities here has estimated FLOP from a parameter count,
      which is the guess this node exists to refuse.
    expected_open_source_release: not_stated
    open_source_release_basis: >-
      "Open-weight" and "the licence terms" are not the four limbs Art. 53(2) requires. The card
      states that terms exist without stating that they permit access, use, modification AND
      distribution, and says nothing about the architecture and usage information being publicly
      available. The carve-out has to be earned on every limb, so silence on any of them leaves
      Arts. 53(1)(a) and (b) and the whole of Art. 54 standing.
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 is not answered for the MODEL. Its paragraphs bind providers and deployers of AI
      SYSTEMS — 50(1) direct interaction, 50(2) marking synthetic output, 50(3) emotion or biometric
      systems, 50(4) deep fakes — and a base model has no interaction, no deployer and no output in
      use until someone builds a system on it. The Art. 50(2) marking duty will fall on whoever
      does.
    decisive_fact: >-
      Significant generality across distinct tasks, integrable into a variety of downstream
      applications, described as a base model with no intended purpose of its own — Art. 3(63). Art.
      6 does not classify it and it has no risk tier; Chapter V governs, and Art. 53 is owed already
      (Chapter V has applied since 2 August 2025). The old cascade answered `minimal` here, which
      told the provider it owed almost nothing.
    difficulty: obvious
    notes: >-
      The reason RiskClass.GPAI_MODEL exists. This tool does not assess Chapter V; the verdict is a
      handover naming Arts. 53 and 55 and the Art. 52(6) list.

  - case_id: notified_systemic_risk_model_card
    description: >-
      A model card for a large language model offered through a commercial API. It reports a
      cumulative training compute of 6.2e25 floating point operations, states that the provider
      notified the European Commission under Article 52(1) before release, and describes the model
      as general-purpose and adaptable to a wide range of downstream tasks. The weights are not
      distributed: access is through the provider's API under commercial terms of service that
      forbid redistribution and reverse engineering. The card summarises adversarial testing and
      red-teaming carried out before launch.
    expected_risk_class: gpai_model
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers its outputs from the input it receives — Art. 3(1) is met, so the cascade reaches the
      Art. 3(63) question rather than exiting earlier.
    expected_gpai_status: general_purpose_model
    expected_systemic_risk: designated
    systemic_risk_basis: >-
      The card states an Art. 52(1) notification was made, which is the designated limb and settles
      Art. 51(1) on its own. The 6.2e25 FLOP figure would independently engage the Art. 51(2)
      presumption, so the two limbs agree here — which is the point of the case: `designated` is the
      stronger answer and a run that returns high_impact_capabilities has read the compute and
      missed the notification.
    expected_open_source_release: not_open
    open_source_release_basis: >-
      Every limb fails and the card says so: the weights are not distributed at all, access is
      through an API, and the terms forbid redistribution and reverse engineering. Art. 53(2) needs
      a licence permitting access, use, modification AND distribution together with public
      parameters, so this is the clean negative.
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 binds providers and deployers of AI SYSTEMS. A model offered through an API has no
      deployer and no output in use until someone builds a system on it; the Art. 50(2) marking
      duty falls on whoever does.
    decisive_fact: >-
      THE POSITIVE BRANCH OF BOTH CHAPTER V GATES, which the other two model cases only exercise
      as `not_stated`. Art. 55's four obligations are owed on a stated notification, and neither
      carve-out is available on a closed release — so this is the model whose report should read
      "systemic risk is established" rather than "unanswered".
    difficulty: obvious
    notes: >-
      Both gates are read from STATED facts and neither is estimated: the notification and the FLOP
      figure are quoted in the card. A run that infers systemic risk from the model sounding capable
      is wrong here for the same reason it is wrong on open_weight_frontier_model_card, where the
      card gives a parameter count and no compute.

  - case_id: pre_market_frontier_model_in_training
    description: >-
      An internal research write-up from an AI lab on a large language model still in training. It
      records the architecture, the corpus, the compute budget and the evaluation harness, and
      reports interim benchmark results across reasoning, coding, translation and summarisation. The
      lab states that the model is a research artefact, that it has not been released, licensed or
      made available to anyone outside the team, and that a decision on whether to publish weights
      or offer it through an API has not yet been taken.
    expected_risk_class: gpai_model
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers its outputs from its input — a language model does nothing else. Art. 3(1) is met.
    expected_gpai_status: general_purpose_model_pre_market
    expected_systemic_risk: not_stated
    systemic_risk_basis: >-
      The write-up records that a compute budget exists and never gives the figure, and no
      designation could have been made for a model nobody outside the team has seen.
    expected_open_source_release: not_open
    open_source_release_basis: >-
      Positively established rather than merely unstated: the lab says the model has not been
      released, licensed or made available to anyone outside the team, and that the decision on
      publishing weights has not been taken. Parameters that are not public fail Art. 53(2) on its
      own terms, so the carve-out is unavailable — which matters precisely because these duties
      attach on the day it ships.
    expected_scope_exclusion: pre_market_development
    scope_exclusion_basis: >-
      Art. 2(8): research and development activity prior to being placed on the market or put into
      service. It has not been released, licensed or made available to anyone outside the team. The
      paragraph's own limit does not bite either — there is no testing in real-world conditions
      (Art. 3(57)).
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 is not reached: its paragraphs bind providers and deployers of AI SYSTEMS placed on
      the market — 50(1) direct interaction, 50(2) marking synthetic output, 50(3) emotion or
      biometric systems, 50(4) deep fakes — and this model has no deployer and no output in use.
    decisive_fact: >-
      TWO temporary exclusions at once, and neither is a clearance. Art. 3(63) puts a model in
      research or prototyping outside the definition until it is placed on the market, and Art. 2(8)
      excludes the development activity itself. So nothing is owed today — but both end on the day
      it ships, and Chapter V has been in application since 2 August 2025, so Arts. 53 and 55 attach
      immediately with no transition to prepare in. Reporting only "out of scope" would be true this
      morning and misleading by the time anyone acted on it.
    difficulty: buried
    notes: >-
      The case that forced Art. 2(8) to fall through instead of concluding. Before this, a
      pre-market frontier model exited at `scope` and was told it owed nothing, with no mention that
      it was a general-purpose model or that Chapter V was waiting. The exclusion is a DEADLINE.

  - case_id: llm_backed_cv_screener
    description: >-
      A recruitment product that screens applications for a vacancy. It sends each CV and the job
      description to a large general-purpose language model through an API, prompts it to judge how
      well the candidate fits, and turns the reply into a fit score that orders the shortlist the
      recruiter works from. The vendor's documentation is largely about which foundation model is
      used, its context window and its benchmark scores.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a fit judgement for each candidate from their CV and the vacancy text. That the
      inference happens inside a third party's model changes who trained it, not whether this
      system infers.
    expected_gpai_status: ai_system
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_deployer_type: not_stated
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: the candidate never converses with it (50(1)), the fit score is not
      synthetic content published as such (50(2)), it infers no emotion or biometric category
      (50(3)) and produces no deep fake (50(4)).
    decisive_fact: >-
      It RUNS ON a general-purpose model but is not one: it has an intended purpose, users and a
      decision it feeds, so Art. 3(66) makes it an ordinary AI system. It evaluates candidates
      during recruitment — Annex III(4)(a) — and scores persons, so the Art. 6(3) carve-back makes
      it high_risk. Documentation written mostly about the underlying model must not move it onto
      the Chapter V track.
    difficulty: buried
    flips_from: open_weight_frontier_model_card
    notes: >-
      The guard on the GPAI node. Routing out everything that talks about a foundation model would
      exempt exactly the products the tier logic exists for — and this document talks about little
      else. The pair differs on one thing: whether there is an intended purpose and a person it is
      used on.

  # --- Art. 2(1): the POSITIVE limb of scope, prior to every exclusion -------------------------
  # Paragraphs (3)-(12) carve OUT of a Regulation assumed to apply; (1) is what makes it apply.
  # Without a case on each side, the node is answered `not_addressed` on every case and measures
  # nothing — while a system the Act never reaches comes back with a full tier and a duty list.
  - case_id: us_only_tenant_screening
    description: >-
      A tenant-screening service operated by a company incorporated in Delaware and hosted entirely
      in United States regions. It scores rental applicants for a landlord's letting decision. The
      terms of service state that the service is offered solely to landlords holding property in the
      United States, that applications may be submitted only for properties located there, and that
      the company neither markets nor makes the service available in the European Union or the
      European Economic Area and blocks sign-ups from those territories. No output is returned to,
      or acted on by, anyone outside the United States.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a suitability score for each applicant from their application and credit history — a
      prediction about a person, not a lookup.
    expected_territorial_link: outside_union
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 is not reached at all: it binds providers and deployers the Regulation applies to,
      and Art. 2(1) does not extend to this one. Were it reached, none of its paragraphs would
      attach — the applicant never converses with it (50(1)), it generates no synthetic content
      (50(2)), infers no emotion or biometric category (50(3)) and produces no deep fake (50(4)).
    decisive_fact: >-
      Art. 2(1) does not reach it. The text positively rules out every limb: not placed on the
      market or put into service in the Union (a), no deployer here (b), no output used here (c),
      no Union supply chain (d)-(f), and the applicants are not in the Union (g). It is NOT an
      Art. 2 exclusion — nothing is carved out of a Regulation that never extended there — and it
      would otherwise be high-risk under Annex III(5)(b), which is exactly why the question must be
      asked before the tier is computed.
    difficulty: obvious
    notes: >-
      Teaches that scope has a positive limb. Every exclusion case in this set answers "the
      Regulation applies, but paragraph N withholds it"; this one answers "it was never engaged".
      The tier it would otherwise carry is deliberately a serious one.

  - case_id: us_built_screening_used_in_ireland
    description: >-
      The same tenant-screening service, operated by the same Delaware company from the same United
      States infrastructure, with no European office, staff or subsidiary. A letting agency in
      Dublin subscribes to it and submits applications for apartments in Ireland; the score comes
      back and the agency uses it to decide which applicants to offer a viewing.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a suitability score for each applicant, as its sibling does — the computation is
      identical and only the territory differs.
    expected_territorial_link: third_country_output_used_in_union
    expected_annex_i_product: null
    expected_annex_iii_area: essential_services
    expected_performs_profiling: true
    expected_deployer_type: neither
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: the applicant never interacts with the system (50(1)), it generates
      no synthetic content (50(2)), infers no emotion or biometric category (50(3)) and produces no
      deep fake (50(4)). The agency, not the system, speaks to the applicant.
    decisive_fact: >-
      Art. 2(1)(c) reaches it: provider and deployer are outside the Union on the provider's side,
      but the OUTPUT is used in the Union by the Dublin agency. Having no European presence settles
      nothing. It then classifies normally — evaluating applicants for access to housing is
      Annex III(5), and scoring persons is profiling, so the Art. 6(3) carve-back makes it
      high-risk.
    difficulty: obvious
    flips_from: us_only_tenant_screening
    notes: >-
      The flip for Art. 2(1), and it flips on territory alone: the same company, the same code, the
      same score. out_of_scope becomes high_risk because a customer in Dublin uses the output. The
      trap is "we are a US company" read as an answer.

  # --- Art. 3(1): the FIRST question, and the one a set of all-`true` cases never asks -----------
  # Three cases straddling the inference line. Without them `is_ai` is answered the same way on
  # every case, so a model replying "yes, an AI system" unconditionally scores full marks on the
  # node where a wrong answer costs most: `false` routes straight to minimal and skips Art. 2,
  # Art. 5 and both Art. 6 doors at once.
  - case_id: panel_conflict_rule_checker
    description: >-
      A recruitment compliance step that runs before every interview panel is confirmed. For each
      proposed panel member it looks up the candidate's declared former employers, current
      department and declared relatives in the applicant-tracking record, compares them field by
      field against the panel member's HR record, and removes the panel member where any field
      matches. The matching rules were written by the compliance team and are listed in the
      administrator's manual, which also states that changing them requires a configuration change
      and a new release.
    expected_risk_class: minimal
    expected_is_ai_system: false
    is_ai_basis: >-
      Infers NOTHING. Every comparison is a field-by-field equality check against declared records,
      and the rules are written down by the compliance team and changed only by configuration. That
      is software executing rules a person wrote, which Art. 3(1) does not reach however
      consequential the output — and this output does decide who sits on a panel.
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: it compares stored records and edits a panel list — no direct
      interaction as an interlocutor (50(1)), no synthetic content (50(2)), no emotion or biometric
      inference (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      It sits INSIDE the recruitment process, which is Annex III(4)(a) territory, and it removes
      people from panels — so a classifier reading for setting and consequence lands on high-risk.
      But it infers nothing at all, so Art. 3(1) is not met and the cascade stops at the first
      question. Consequence does not make a rule engine an AI system.
    difficulty: buried
    notes: >-
      The trap is the inverse of the usual one: everything about the CONTEXT says high-risk, and the
      only thing that matters is that no output is inferred. Contrast licence_knockout_filter, which
      is also a knockout inside recruitment and IS an AI system because it reads free text.

  - case_id: statutory_payroll_calculator
    description: >-
      A payroll engine that computes each employee's net pay from their gross salary by applying the
      published statutory income-tax bands, social-insurance rates and pension-contribution formulas
      for the country of employment, together with the deductions recorded in the employee's file.
      The vendor updates the rate tables each time the legislature changes them and publishes a
      changelog naming the instrument behind every change.
    expected_risk_class: minimal
    expected_is_ai_system: false
    is_ai_basis: >-
      Infers NOTHING. Statutory bands and contribution formulas are rules written by a legislature
      and transcribed by the vendor; the engine evaluates them. That an update follows a change in
      the law, rather than a change in data, is the tell — the system has no model to retrain.
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: it computes a figure from published rates — no direct interaction
      (50(1)), no synthetic content (50(2)), no emotion or biometric inference (50(3)), no deep
      fake (50(4)).
    decisive_fact: >-
      Deterministic evaluation of published statutory formulas. Art. 3(1) reaches a system that
      INFERS from its input how to generate its outputs; this derives every output from rules a
      legislature wrote, so it is not an AI system and no tier is reached.
    difficulty: obvious
    notes: >-
      The clean, uncontested `false`. Deliberately dull: the set needs at least one case where the
      answer turns on nothing but Art. 3(1)'s own words.

  - case_id: absence_pattern_spreadsheet_addin
    description: >-
      A spreadsheet add-in sold to HR teams as "just a formula pack". Installed into the workforce
      workbook, it adds a column that fits a model to each employee's historical absence, shift and
      overtime records and returns a figure for how likely that employee is to leave within twelve
      months. Managers are told to use the column when deciding whom to put forward for retention
      bonuses and whom to move off critical projects.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a departure likelihood per employee by fitting a model to their absence, shift and
      overtime history. The packaging as a spreadsheet formula pack describes the delivery, not the
      computation — a fitted model returning a predicted probability is inference whatever it ships
      inside.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_deployer_type: not_stated
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: it writes a number into a spreadsheet column — no direct interaction
      with the employee (50(1)), no synthetic content (50(2)), no emotion or biometric inference
      (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      Presented as a formula pack, it fits a model and predicts a per-person outcome, so Art. 3(1)
      is met. It evaluates natural persons on personal aspects and the output steers retention and
      task-allocation decisions — Annex III(4)(b), and the Art. 6(3) profiling carve-back makes it
      high-risk regardless of any derogation.
    difficulty: buried
    notes: >-
      The mirror of panel_conflict_rule_checker: everything about the PACKAGING says spreadsheet
      and the computation is a fitted model. A set whose `false` cases all look humble teaches the
      wrong rule — that plain-looking software is not AI — so this one looks plainest of all.

  # --- Art. 6(3) is a CONJUNCTION: a condition under (a)-(d) is not enough on its own ------------
  - case_id: licence_knockout_filter
    description: >-
      A recruitment screening step that reads each application's free-text CV and cover letter with
      a trained extraction model, inferring from the wording whether the candidate holds the
      professional licence the role requires — a claim applicants state in many different ways and
      often only in passing. Where the model finds no such licence the application is rejected
      automatically and the standard rejection letter is sent. It extracts one fact and produces no
      score, ranking or assessment of the person. Only the applications it passes are placed in the
      recruiter's review queue.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a licence claim from free-text CVs and cover letters, where applicants state it
      in many different ways and often only in passing. Reading a declared field would not be this.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: narrow_procedural_task
    expected_poses_significant_risk: true
    expected_deployer_type: not_stated
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: reading one field and issuing a form letter is not direct
      interaction with the candidate in the 50(1) sense, generates no synthetic content (50(2)),
      infers no emotion (50(3)) and produces no deep fake (50(4)).
    decisive_fact: >-
      An AI system under Art. 3(1) — it INFERS a fact from unstructured text rather than reading a
      declared field. The Art. 6(3)(a) condition IS met: extracting one fact is a narrow procedural
      task and it evaluates nobody. But the first subparagraph is not: rejected candidates never
      reach a recruiter, so the system materially influences the outcome of decision making and
      poses a significant risk to their fundamental rights. Both limbs are required, so high_risk.
    difficulty: obvious
    notes: >-
      The reason Art. 6(3) is split across two nodes. Answering only "is its role narrow?" clears
      this system; the paragraph's own opening words are what keep it high-risk. Contrast
      cv_parsing_fields and candidate_dedupe_prep, where a recruiter still sees every candidate.
      Rewritten 2026-08-18: as first authored it said "applies a single fixed rule", which made it
      narrow enough for Art. 6(3)(a) and, in the same words, not an AI system at all — so the run
      exited at `is_ai` and never reached the node the case exists to exercise. The inference is now
      explicit and the narrowness is carried by what the system does with it, not by how it works.

  # --- Art. 6(1): the OTHER door into high-risk (Annex I) ----------------------------------------
  # NONE OF THESE IS IN ANY ANNEX III AREA, so the Annex I door is the only one open to them and a
  # cascade that asks about areas alone answers "no area" and exits to minimal — telling a surgical
  # robot it owes nothing. That is the false clearance this section measures.
  #
  # It measures the door in BOTH directions, and the amended text is why the negative half carries
  # as many cases as the positive one. Art. 6(1) is a conjunction of two conditions, and each has
  # its own way of failing: limb (b) fails where the host product self-certifies, and limb (a) now
  # fails wherever Art. 6(1a) applies — an AI solely used for non-safety related user assistance,
  # performance optimisation, service efficiency, automation, convenience or quality control is not
  # a safety component at all. Art. 6(1b) is the limb that pulls it back: a system whose failure
  # would endanger health and safety qualifies whatever it is marketed as doing. So a case reaching
  # `minimal` here is not a weak case — it is the half of the test that stops a maintenance
  # reminder being handed Chapter III.
  - case_id: surgical_robot_dose_control
    description: >-
      An AI dose-control module embedded in a robotic surgical system. It computes and limits the
      energy delivered by the cutting instrument in real time, and halts the actuator when tissue
      impedance leaves the safe envelope. It ships as part of the robot, which is a class IIb
      medical device CE-marked under Regulation (EU) 2017/745 following notified-body assessment.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers tissue state from impedance signal and derives the energy limit from it, rather
      than applying a fixed cut-off a person set.
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: true
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: the module drives an actuator inside a surgical robot. It does not
      interact directly with a natural person (50(1)), generates no synthetic content (50(2)),
      infers no emotion and categorises nobody biometrically (50(3)), and produces no deep fake
      or public-interest text (50(4)).
    decisive_fact: >-
      A safety component of a class IIb medical device, which requires notified-body conformity
      assessment — both limbs of Art. 6(1) are met, so high_risk. It appears in NO Annex III area:
      an Annex III-only cascade answers "no area" and exits to minimal, which is a false clearance.
    difficulty: obvious
    split: dev
    notes: >-
      Teaches: Art. 6 has TWO doors. Annex III asks what the AI is used FOR; Annex I asks what it
      is PART OF. A classifier that only knows the second door clears this system entirely.

  - case_id: vehicle_emergency_braking
    description: >-
      An AI perception component in an automatic emergency braking system for passenger cars. It
      detects pedestrians and cyclists in the vehicle's path and triggers braking without driver
      input. It is type-approved as part of the vehicle under Regulation (EU) 2018/858.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers the presence and path of pedestrians and cyclists from sensor input — perception
      is inference by definition; no rule enumerates what a pedestrian looks like.
    expected_annex_i_product: motor_vehicles
    expected_third_party_assessment: true
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: it actuates brakes from sensor input. No direct interaction with a
      person (50(1)), no synthetic content (50(2)), no emotion inference or biometric
      categorisation (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      High-risk under Art. 6(1) via Annex I SECTION B, and the AI qualifies as a safety component
      on the Art. 6(1b) limb: braking without driver input is the prevention of a risk to health
      and safety, which is what Art. 3(14) now requires of a safety function. The class is the same
      as the surgical robot, but what follows is not: Art. 2(2) means only Art. 6(1), Art. 60a and
      Arts. 102 to 112 apply, so Chapter III does NOT. Classifying it high_risk and then raising
      Art. 9-15 would be a false accusation.
    difficulty: obvious
    split: dev
    notes: >-
      Teaches the Section A / Section B split. The risk CLASS is not sufficient to decide what is
      owed — see AnnexIProduct.chapter_iii_applies and the Art. 2(2) branch in gap/rules.select.

  - case_id: drill_press_wear_monitor
    description: >-
      An AI vibration-monitoring feature in a benchtop drill press. It models bearing wear from
      spindle vibration and shows the operator a maintenance reminder when a service is due. The
      drill press is standard machinery under Directive 2006/42/EC; it is not listed in Annex IV of
      that Directive, so the manufacturer self-certifies with an internal-control assessment.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers bearing wear from spindle vibration: a model of degradation derived from signal,
      not a service interval counted off a calendar.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: a maintenance reminder is not direct interaction of the kind
      50(1) addresses, and none of 50(2)-(4) apply.
    decisive_fact: >-
      NEITHER LIMB OF ART. 6(1) IS MET, and the first is the one that decides it. Art. 6(1a)
      excludes from "safety component" any AI system solely used for non-safety related aspects of
      performance optimisation or quality control, and predicting when a bearing needs servicing is
      exactly that; Art. 3(14) requires of a safety function that its intended purpose be to prevent
      or mitigate risks to health and safety, and this one's purpose is uptime. Art. 6(1b) does not
      pull it back: what the reminder's failure costs is an unplanned stoppage, while the guarding
      that keeps the operator safe is the machine's own and does not depend on it. So limb (a)
      fails, and limb (b) fails independently because the drill press self-certifies with no
      notified body. No Annex III area reaches it either, so minimal.
    difficulty: buried
    split: dev
    notes: >-
      The case for Art. 6(1a), and it is OVER-DETERMINED — two independent reasons the door does
      not open, which is why it is the gentler of the pair. drill_press_in_annex_iv is the same AI
      in a machine that does require a notified body, so limb (b) is met there and Art. 6(1a) is
      the only thing standing between it and high_risk. A classifier that treats "is it an Annex I
      product?" as sufficient marks this high_risk and demands Chapter III of a bench drill.

  - case_id: drill_press_in_annex_iv
    description: >-
      An AI vibration-monitoring feature in an industrial woodworking saw. It models blade and
      bearing wear from spindle vibration and shows the operator a maintenance reminder when a
      service is due. The saw is a portable hand-fed circular saw listed in Annex IV of Directive
      2006/42/EC, so its conformity is assessed by a notified body before it may be placed on the
      market.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers blade and bearing wear from spindle vibration, as its benchtop sibling does.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: a maintenance reminder shown to the machine operator is not the
      direct interaction 50(1) addresses, it generates no synthetic content (50(2)), infers no
      emotion and categorises nobody biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      ART. 6(1a) ON ITS OWN, with nothing else to fall back on. Limb (b) IS met — a portable
      hand-fed circular saw is listed in Annex IV, so a notified body assesses the machine before
      it may be placed on the market — and the system is still not high-risk, because limb (a)
      fails: an AI solely used for non-safety related performance optimisation or quality control
      does not qualify as a safety component, whatever the host product's conformity route.
      Art. 6(1b) is the limb to test against, and it does not reach a maintenance reminder: the
      saw's guarding and its two-hand controls are what keep the operator safe, and a reminder that
      never fires costs a stoppage rather than a hand. No Annex III area covers woodworking, so
      minimal.
    difficulty: buried
    split: dev
    notes: >-
      THE PRODUCT'S CONFORMITY ROUTE IS NOT DECISIVE, which is the opposite of what the Annex I
      door looks like from outside. This case and drill_press_wear_monitor differ by exactly one
      sentence — whether the host machine needs a notified body — and reach the same tier, because
      Art. 6(1a) closes limb (a) for both. A classifier that reads "Annex IV, notified body" and
      stops marks this high_risk and demands Chapter III of a saw's maintenance reminder.

  - case_id: mewp_stability_cutout_machinery_regulation
    description: >-
      A mobile elevating work platform used to lift workers to height on construction sites. An AI
      model estimates the machine's stability margin from boom geometry, load-cell readings and
      chassis inclination, progressively limits boom movement as the margin narrows, and halts it
      before the platform would tip. The MEWP is machinery for lifting persons, listed in Annex I
      Part A of Regulation (EU) 2023/1230, so a notified body assesses its conformity before it may
      be placed on the market.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a stability margin the machine cannot measure directly, from geometry, load and
      inclination together — a model of when the platform would go over, not a fixed angle limit.
    expected_annex_i_product: machinery_regulation
    expected_third_party_assessment: true
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: the system limits a hydraulic actuator. It does not interact
      directly with a natural person (50(1)), generates no synthetic content (50(2)), infers no
      emotion and categorises nobody biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      BOTH LIMBS OF ART. 6(1) ARE MET AND THAT IS THE EASY HALF. Halting the boom before a tip-over
      is the prevention of a risk to health and safety, so the AI is a safety component within
      Art. 3(14) and Art. 6(1b) confirms it against any argument that stability control is
      performance optimisation; and Annex I Part A of Regulation (EU) 2023/1230 requires
      notified-body assessment, which is condition (b). So high_risk. WHAT FOLLOWS IS WHERE THE
      CASE BITES: the Machinery Regulation is listed at Annex I SECTION B, so Art. 2(2) applies and
      Chapter III does NOT — only Art. 6(1), Art. 60a and Arts. 102 to 112. The identical AI in a
      machine still certified under Directive 2006/42/EC sits at Section A and owes Chapter III in
      full.
    difficulty: obvious
    split: dev
    notes: >-
      The Section A / Section B line drawn through ONE product family. Directive 2006/42/EC is
      Annex I(A)(1) and Regulation (EU) 2023/1230, which replaces it from 20 January 2027, is
      Annex I(B)(21) — so the instrument a machine is certified under decides whether its provider
      owes Arts. 9 to 15 or nothing of them, on facts that are otherwise identical. See
      AnnexIProduct.MACHINERY_REGULATION and the Art. 2(2) branch in gap/rules.select_rules. The
      failure this measures is a classifier that reads "machinery" and answers with the Section the
      Directive is in.

  - case_id: wireless_gas_detector_spectrum_only
    description: >-
      A domestic wireless gas-leak detector. An AI model classifies the sensor's response pattern
      over time to tell a real methane leak from cooking vapour, aerosols and humidity, and on a
      leak sounds the alarm and closes the linked shut-off valve. The unit reports to a hub over a
      sub-GHz radio link, which makes it radio equipment under Directive 2014/53/EU. The
      manufacturer applied the harmonised standards for health and safety and for electromagnetic
      compatibility and assessed conformity against them itself. A notified body was involved for
      one reason: the manufacturer did not apply the harmonised standard for efficient use of the
      radio spectrum, so the spectrum aspects went through the notified-body module.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers whether a sensor response is a real leak from the shape of that response over time —
      a learned discrimination between gases, not a fixed parts-per-million threshold.
    expected_annex_i_product: radio_equipment
    expected_third_party_assessment: false
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: an audible alarm is not the direct interaction 50(1) addresses, the
      system generates no synthetic content (50(2)), infers no emotion and categorises nobody
      biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      LIMB (a) IS MET AND LIMB (b) IS NOT, and only Art. 6(1c) explains why. The AI decides when
      the alarm sounds and when the gas is shut off, so its intended purpose is to prevent or
      mitigate a risk to health and safety within Art. 3(14) — a safety component beyond argument,
      and Art. 6(1b) would supply it even if Art. 6(1a) were pressed. Condition (b) is where it
      stops: the product IS required to undergo third-party conformity assessment, but solely for
      risks relating to the distribution of radio spectrum, which do not affect health and safety,
      and Art. 6(1c) says such an assessment does not fulfil condition (b). The health and safety
      aspects were self-assessed against harmonised standards, with no notified body. Art. 6(1) is
      a conjunction, no Annex III area covers a domestic gas alarm, so minimal.
    difficulty: buried
    split: dev
    notes: >-
      The case for Art. 6(1c), and it reads high-risk on every keyword: a genuine safety component,
      a listed Annex I product, a notified body named in the text. What decides it is WHY that body
      was involved, which is one clause in a sentence about which harmonised standards were
      applied. A classifier that stops at "a notified body was involved" marks this high_risk and
      demands Chapter III of a gas alarm. Contrast drill_press_in_annex_iv, where the notified body
      is genuinely there for safety and limb (a) is what fails instead.

  - case_id: theatre_and_shift_scheduler
    description: >-
      An AI tool used by a hospital to schedule operating-theatre slots and allocate staff shifts.
      It optimises room utilisation against expected procedure durations, proposes rotas, and sends
      calendar reminders to clinical teams. It does not connect to, control, or exchange data with
      any medical device.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers expected procedure durations and optimises against them. The prediction is the
      inference; the rota that follows would be arithmetic on its own.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: proposing rotas and sending reminders is not direct interaction of
      the kind 50(1) addresses, and 50(2)-(4) do not apply.
    decisive_fact: >-
      Medical SETTING, but not a safety component of any product — it touches no device, and its
      failure delays a list rather than endangering a patient mid-procedure. Outside Annex I, and
      no Annex III area either, so minimal.
    difficulty: buried
    split: dev
    notes: >-
      The Annex I distractor. Dense medical vocabulary next to a purely administrative function —
      the false-positive control for the annex_i node, matching the role leave_balance_tracker
      plays for annex_iii. Note it is deliberately NOT the Annex III(4) workforce-management case:
      shift allocation is scheduling logistics, not a decision about a person.

  - case_id: defence_drone_swarm_coordination
    description: >-
      An AI system procured by a national ministry of defence to coordinate formations of
      reconnaissance drones on military operations. It assigns search patterns across the formation,
      re-tasks aircraft when one is lost, and relays imagery to a command post. It is fielded only by
      the armed forces and is not offered on any civil market.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers search patterns and re-tasking decisions from what the formation observes,
      rather than flying a route a person laid out in advance.
    expected_scope_exclusion: military_defence_national_security
    scope_exclusion_basis: >-
      Art. 2(3), second subparagraph. The system is put into service exclusively for military and
      defence purposes, and the subparagraph applies regardless of the type of entity carrying out
      those activities.
    expected_transparency_duties: []
    transparency_basis: >-
      Not reached: a system the Regulation does not govern owes nothing under Art. 50. On the facts
      none of it attaches either — coordinating aircraft is no direct interaction with a natural
      person (50(1)), generates no synthetic content (50(2)), infers no emotion and categorises
      nobody biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      The purpose of use is military, so Art. 2 withholds the Regulation entirely and no risk tier
      is ever reached. The word carrying the weight is "exclusively" — nothing here points at a
      civil use of this system.
    difficulty: obvious
    split: dev
    notes: >-
      The clean dev anchor for out_of_scope, and the tuning counterpart to the held-out Art. 2
      batch. Deliberately unambiguous: a classifier that cannot exclude this one is not reading
      Art. 2 at all. Pairs with border_surveillance_drone_analytics.

  - case_id: border_surveillance_drone_analytics
    description: >-
      An AI system procured by a national border police force to analyse the video feed from
      surveillance drones patrolling a land border. It detects groups of people crossing outside
      authorised points and alerts officers, who decide whether to intercept. The contract is awarded
      under the national law implementing the EU directive on procurement in the fields of defence
      and security, and the ministry describes the deployment as protecting national frontiers.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers from video that a group of people is crossing outside an authorised point —
      detection and classification from raw pixels, which no written rule performs.
    expected_annex_i_product: null
    expected_annex_iii_area: migration
    expected_performs_profiling: false
    expected_derogation: null
    expected_deployer_type: public_body
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: detecting crossings and alerting officers is no direct interaction
      with the people observed (50(1)), generates no synthetic content (50(2)), produces no deep fake
      (50(4)), and detecting that people are present assigns nobody to a category on the basis of
      biometric data (50(3)).
    decisive_fact: >-
      Border policing is law enforcement, not defence. Art. 2(3) turns on the purpose of USE, so
      buying under defence-and-security procurement law settles which tendering rules apply and
      nothing about scope; "protecting national frontiers" is border control, which Annex III(7)
      lists in its own right. In scope, and high-risk by the Annex III door.
    difficulty: buried
    split: dev
    flips_from: defence_drone_swarm_coordination
    notes: >-
      The near neighbour for Art. 2(3), and the more useful half of the pair: same aircraft, same
      ministry-adjacent buyer, same defence-flavoured vocabulary, opposite side of the exclusion.
      A classifier that grants the exclusion on the words "defence" or "national" fails here, and
      fails silently — it clears a system the Regulation makes high-risk.

  - case_id: third_country_mla_lead_ranking_with_safeguards
    description: >-
      A national police agency of a non-EU country runs an AI tool that ranks incoming case referrals
      by how likely each is to yield a prosecutable lead. It draws on records shared with it by
      several EU Member States under a judicial cooperation agreement between that country and the
      Union, and its rankings are sent back to the requesting Member State's investigators. The
      agreement's published text records that the Commission has assessed the country's data
      protection regime and found that it provides adequate safeguards for the fundamental rights and
      freedoms of the individuals whose data is exchanged, and it binds the agency to those
      safeguards for every system processing data received under it.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers how likely each referral is to yield a prosecutable lead, and orders the queue
      by that prediction.
    expected_scope_exclusion: third_country_law_enforcement_cooperation
    scope_exclusion_basis: >-
      Art. 2(4). A third-country public authority that would otherwise be caught by Art. 2(1)(c) —
      its output is used in the Union — is outside the Regulation where it uses AI systems in the
      framework of an agreement for law enforcement and judicial cooperation with the Union, provided
      that country affords adequate safeguards for fundamental rights and freedoms. The document
      supplies both halves: the cooperation framework, and the safeguards finding.
    expected_transparency_duties: []
    transparency_basis: >-
      Not reached: a body the Regulation does not govern owes nothing under Art. 50. On the facts
      none of it attaches either — ranking case referrals for investigators is no direct interaction
      with the people concerned (50(1)), generates no synthetic content (50(2)), infers no emotion and
      categorises nobody biometrically (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      The SAFEGUARDS FINDING is stated. Art. 2(4) is the only exclusion in the Article whose
      condition is about a country rather than about the system, and it is written as a proviso — so
      the exclusion stands or falls on whether that finding is established. Here the agreement records
      it, so the exclusion applies and no risk tier is reached, even though ranking prosecutable leads
      would otherwise sit squarely in the Annex III(6) law-enforcement area.
    difficulty: obvious
    split: dev
    notes: >-
      The only case in either file keyed to Art. 2(4), and it is dev rather than held out on purpose:
      no real system description states a safeguards finding, so a held-out case would mean inventing
      the decisive fact — which the held-out brief forbids. Recorded in the roadmap so the gap stays
      visible.
      Pairs with third_country_mla_lead_ranking_unstated, which is the half that actually matters.

  - case_id: third_country_mla_lead_ranking_unstated
    description: >-
      A national police agency of a non-EU country runs an AI tool that ranks incoming case referrals
      by how likely each is to yield a prosecutable lead. It draws on records shared with it by
      several EU Member States under a judicial cooperation agreement between that country and the
      Union, and its rankings are sent back to the requesting Member State's investigators. The
      agency's own service description sets out the ranking model, its training data and its review
      cycle, and states that the tool is used only for referrals arriving through the cooperation
      channel. It says nothing about the data protection regime of the country it operates in.
    expected_risk_class: needs_review
    expected_abstains_at: scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a prosecutable-lead likelihood per referral, exactly as its sibling does. What
      the description withholds is the safeguards finding, never whether this is an AI system.
    expected_transparency_duties: []
    transparency_basis: >-
      Undeterminable along with the tier, and recorded as false only because nothing in the
      description supports an obligation: ranking referrals for investigators is no direct interaction
      with the people concerned (50(1)), generates no synthetic content (50(2)), infers no emotion and
      categorises nobody biometrically (50(3)), and produces no deep fake (50(4)). Silence, not a
      finding.
    difficulty: insufficient
    split: dev
    flips_from: third_country_mla_lead_ranking_with_safeguards
    decisive_fact: >-
      The safeguards finding is ABSENT. Art. 2(4) excludes a third-country authority only "provided
      that" the country affords adequate safeguards for fundamental rights and freedoms, and no
      document describing a SYSTEM establishes that — it is settled in the cooperation agreement and
      in the Commission's assessment, not in a service description. Silence is not evidence that the
      condition is met, so the exclusion cannot be granted; nor can it be refused, because nothing
      says the safeguards are missing either. Scope is undecided, so the tier is never reached.
    notes: >-
      The load-bearing half of the pair, and the reason 2(4) is treated the way it is. Art. 2(4)
      shares its shape with Art. 6(1)(b): a condition the tool must READ and must never DERIVE, since
      deriving it means ruling on a country's data protection regime from a description of a piece of
      software. The same discipline the roadmap records under M4d-1 for sectoral conformity routes.
      The failure this case measures is granting the exclusion on the words "cooperation agreement" —
      which would clear an Annex III(6) law-enforcement system outright, the worst direction to be
      wrong in. Answering high_risk instead is the safe error and still wrong: scope comes first.

  # ================================================================================================
  # BATCHES 1-3 — AUTHORED BLIND, THEN SPENT. Moved here from the held-out split on 2026-08-15.
  #
  # These 24 cases were written by sessions that could not read this repo's roadmap, dev cases or
  # tests — enforced by a PreToolUse hook, not a promise — and were measured once, at commit
  # 6608c5b: 15/24 overall (Art. 2 batch 8/9, Annex I batch 2/6, batch 1 5/9). See THE HELD-OUT
  # RESULT in docs/ROADMAP.md.
  #
  # A set whose every failure has been read and diagnosed is no longer held out, whatever it is
  # labelled. Keeping the label would invite someone to quote a number from it as blind, so they
  # live here, where tuning against them is legitimate. Their blind ORIGIN is still what makes them
  # good cases: the labels were reached from the enacted text by someone who could not see how the
  # classifier behaves, and they stay as written. Tunable is not the same as rewritable — a label
  # is revised only by an argument from the Act, never because a model disagreed with it.
  #
  # Provenance for the 15 cases written from real documents: data/golden_set/heldout_sources.yaml.
  # ================================================================================================
  # --- HIGH_RISK, with the human-oversight distractor (smoke-check trap #1) --------------------
  - case_id: h_scoring_with_oversight_theatre
    description: >-
      A talent-acquisition module that assigns every applicant a suitability score against the
      vacancy and orders the candidate list by that score for recruiters. The product literature
      states repeatedly that a human recruiter always makes the final decision, that the tool is
      "decision-support only", and that "the human stays in control at every step".
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a suitability score per applicant against the vacancy. The oversight language
      around it changes who acts on the score, not whether it was inferred.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_deployer_type: not_stated
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      None of Art. 50's paragraphs attach: scoring and ranking applicants is neither direct
      interaction (50(1)) nor content generation (50(2)); it is not emotion recognition or
      biometric categorisation (50(3)); it produces no deep fake (50(4)).
    decisive_fact: >-
      Assigns suitability scores and ranks applicants — evaluation of natural persons, i.e.
      profiling under Art. 6(3). The carve-back forces high_risk notwithstanding any derogation.
      The repeated human-oversight assurance is LEGALLY IRRELEVANT to the tier: Annex III(4)(a)
      applies whether or not a human signs off. It is a distractor, and must not lower the class.
    difficulty: obvious
    notes: >-
      Smoke-check trap #1. The real vendor page in data/golden_set/smoke/ carries this exact
      reassurance; the dev set does not, so this is the first case to test that the classifier does
      not treat 'a human decides' as a downgrade.

  # --- MINIMAL, with adjacent-product cross-sell noise (smoke-check trap #2) -------------------
  - case_id: h_onboarding_logistics_crosssell
    description: >-
      A new-hire onboarding tool that collects signed documents, schedules orientation sessions,
      tracks completion of mandatory training, and sends reminders with a per-employee checklist.
      The vendor's site also advertises, in a "you may also like" panel, a separate AI screening
      product that scores and ranks job applicants.
    expected_risk_class: minimal
    expected_is_ai_system: false
    is_ai_basis: >-
      Infers NOTHING. Collecting signed documents, scheduling sessions, tracking completion
      and sending reminders are workflow steps executed as written. The AI screening product in the
      cross-sell panel is a different system and is not what is being classified.
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: it collects documents and sends reminders — no direct interaction as
      an interlocutor (50(1)), a checklist is not synthetic content (50(2)), no emotion or biometric
      inference (50(3)), no deep fake (50(4)). The advertised screening product is a DIFFERENT
      system and is not the subject of this classification.
    decisive_fact: >-
      The DESCRIBED system infers nothing: collecting signed documents, scheduling sessions,
      tracking completion and sending reminders are workflow steps, executed as written. Art. 3(1)
      is not met, so the cascade stops at the first question. The cross-sell mention of a separate
      scoring product belongs to another system and must not raise this one — and it must not make
      this one an AI system either, which is the trap the case now sets at `is_ai` rather than at
      `annex_iii`.
    difficulty: buried
    notes: >-
      Smoke-check trap #2 (false-positive). A genuinely minimal system whose page contains
      high-risk-sounding text belonging to a different product.

  # --- NOT_HIGH_RISK via derogation (b) — improves a completed human activity ------------------
  - case_id: h_interview_note_polisher
    description: >-
      A writing assistant that takes the free-text interview notes a hiring manager has already
      written and improves their grammar, clarity and structure before they are filed. It adds no
      assessment, score or recommendation of its own; it only rewrites what the manager wrote.
    expected_risk_class: not_high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers fluent phrasing from the manager's own draft: rewriting for grammar, clarity and
      structure generates its output from the input rather than applying a style checklist.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: improves_completed_human_activity
    expected_poses_significant_risk: false
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50(2) does not attach despite the rewriting: its carve-out covers systems performing "an
      assistive function for standard editing" that do not substantially alter the input or its
      semantics — grammar and clarity polishing of the manager's own text is exactly that. No
      interaction (50(1)), no emotion (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      Improves the write-up of a completed human assessment without adding judgement of its own —
      Art. 6(3)(b) derogation. Within Annex III(4) but exempt, so not_high_risk (Art. 6(4)
      documentation still owed).
    difficulty: obvious
    notes: >-
      Deliberate contrast with dev job_ad_generation: that GENERATES text (Art. 50(2) applies);
      this only EDITS a person's text (Art. 50(2) carve-out), so transparency is false here.

  # --- NOT_HIGH_RISK via derogation (d) — preparatory task ------------------------------------
  - case_id: h_application_file_indexer
    description: >-
      A tool that receives incoming job applications and converts attachments to PDF, then uses a
      trained optical-character-recognition model to read the text out of scanned and photographed
      documents, and indexes what it recovers by requisition so a recruiter can search it. It
      performs no scoring, ranking or evaluation of candidates; it prepares the files for the
      recruiter's own review.
    expected_risk_class: not_high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers text from images — optical character recognition on scanned and photographed
      documents is a trained model reading pixels, whatever the file plumbing around it looks like.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: preparatory_task
    expected_poses_significant_risk: false
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: file conversion, OCR and indexing is not direct interaction (50(1)),
      generates no synthetic content (50(2)), infers no emotion (50(3)), produces no deep fake
      (50(4)).
    decisive_fact: >-
      Converts, OCRs and indexes applications to prepare them for the recruiter's own assessment —
      a preparatory task under Art. 6(3)(d), with no evaluation of the person. Within Annex III(4)
      but exempt, so not_high_risk.
    difficulty: obvious

  # --- PROHIBITED — Art. 5(1)(g) biometric categorisation (a DIFFERENT ground from the emotion cases)
  - case_id: h_photo_ethnicity_sorting
    description: >-
      A recruitment screening system that analyses the photographs submitted with applications to
      sort candidates into groups by inferred ethnicity and gender, which recruiters are told they
      can use to "balance the shortlist".
    expected_risk_class: prohibited
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers ethnicity and gender from photographs. The inference is the whole product, and
      is precisely what makes it an Art. 5 biometric categorisation practice.
    expected_prohibited_practice: biometric_categorisation_sensitive
    expected_transparency_duties: [emotion_or_biometric_categorisation]
    transparency_basis: >-
      Art. 50(3): it is a biometric categorisation system, so deployers must inform the persons
      exposed. As with the emotion cases, 50(3) attaches to the system type and its only carve-out
      is law-enforcement use — the Art. 5 prohibition does not disapply it.
    decisive_fact: >-
      Infers ethnicity — a protected characteristic — from photographs by biometric categorisation.
      Prohibited under Art. 5(1)(g). Evaluated before high-risk classification; it never reaches
      Art. 6.
    difficulty: obvious
    notes: >-
      A second prohibited GROUND, distinct from the dev emotion cases (Art. 5(1)(f)). Tests that the
      prohibited node is not narrowly keyed to emotion recognition.

  # --- NEEDS_REVIEW via INSUFFICIENT INPUT — the missing fact is the DOMAIN (annex_iii node) ---
  - case_id: h_people_analytics_unstated_domain
    description: >-
      A people-analytics platform that builds a predictive score for each individual in a client's
      database and ranks them by it. The documentation describes the modelling in detail but never
      states who the individuals are or what decision the score supports — it is sold to "HR, sales
      and customer-success teams alike".
    expected_risk_class: needs_review
    expected_abstains_at: annex_iii
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a predictive score per individual, described in modelling detail. What the
      documentation withholds is the DOMAIN the score is used in, never whether it is inferred.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Determinable even though the tier is not: it scores records with no direct interaction (50(1)),
      no content generation (50(2)), no stated emotion inference (50(3)) and no deep fake (50(4)),
      so Art. 50 does not attach regardless of who the individuals are.
    decisive_fact: >-
      THE DECISIVE FACT IS ABSENT, and it is the DOMAIN. The platform plainly evaluates individuals,
      but whether they are employees or candidates (Annex III(4) → high_risk via the profiling
      carve-back) or customers and sales leads (outside Annex III → minimal) is never stated, and
      the vendor sells it for both. Opposite tiers with nothing to choose between them, so
      needs_review.
    difficulty: insufficient
    notes: >-
      Second insufficient case. The missing fact sits at the annex_iii node (what the scored people
      are), whereas ats_workflow_unspecified in the dev set is silent at the profiling node (what
      the model ranks on). expected_performs_profiling is null because the tier is undecidable — the
      schema would otherwise force high_risk from a true here.

  # --- MINIMAL — clean out-of-scope anchor (a workplace tool that is not about employment) -----
  - case_id: h_meeting_room_optimizer
    description: >-
      An AI tool that optimises the allocation of meeting rooms and desks across an office,
      predicting demand per time-slot and suggesting bookings to facilities staff. It concerns
      rooms and equipment, not any decision about people's employment.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers demand per time-slot and allocates against the prediction. Booking a room from a
      calendar would not be this; forecasting how many will be wanted is.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: it allocates rooms, does not interact with any affected person
      (50(1)), generates no content (50(2)), infers no emotion (50(3)), produces no deep fake
      (50(4)).
    decisive_fact: >-
      Allocates rooms and desks, not people — no evaluation of natural persons and outside every
      Annex III area, so minimal. Being deployed inside a workplace does not make a facilities tool
      an employment high-risk system.
    difficulty: obvious
    notes: >-
      False-positive anchor: "in an office" is HR-adjacent noise; the function is facilities, not
      employment decisions.

  # --- MINIMAL but Art. 50(1) transparency applies — direct interaction ------------------------
  - case_id: h_candidate_faq_chatbot
    description: >-
      A chatbot on a careers site that answers applicants' questions about roles, benefits and the
      hiring timeline in natural-language conversation. It does not assess, score or rank
      applicants, and it neither makes nor influences any hiring decision.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a natural-language answer from a free-text question. A menu of canned replies
      would be rules; open conversation is not.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: [direct_interaction]
    transparency_basis: >-
      Art. 50(1): the system interacts directly with natural persons (applicants) in conversation,
      so they must be informed they are dealing with an AI system unless that is obvious. Applies
      independently of the minimal risk tier.
    decisive_fact: >-
      Converses with applicants but performs no evaluation and informs no hiring decision — outside
      Annex III(4), so minimal. BUT Art. 50(1) transparency applies because it interacts directly
      with people, independent of the tier.
    difficulty: obvious
    notes: >-
      Mirrors dev job_ad_generation (minimal + Art. 50) but via a DIFFERENT paragraph — 50(1) direct
      interaction rather than 50(2) content generation.

  # --- HIGH_RISK with the decisive fact BURIED in a benign analytics description ---------------
  - case_id: h_attrition_scoring_buried
    description: >-
      A workforce-analytics dashboard that visualises headcount, turnover trends and team
      composition for HR leadership. Deep in the feature list, among charts and exports, it notes
      that the platform also computes an individual "attrition-risk score" for each employee and
      flags those judged most likely to leave.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers an attrition risk score per employee. The dashboards around it are presentation;
      the buried scoring feature is the inference.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_deployer_type: not_stated
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: dashboards and per-employee scores are not direct interaction
      (50(1)), generate no synthetic content (50(2)), infer no emotion (50(3)) and produce no deep
      fake (50(4)).
    decisive_fact: >-
      Buried among dashboard features, it scores individual employees for attrition risk —
      evaluation of natural persons, i.e. profiling under Art. 6(3) → high_risk notwithstanding any
      derogation. The analytics framing is the distractor; the scoring sentence is decisive.
    difficulty: buried
    notes: >-
      The flip pattern applied to employee monitoring (Annex III(4)(b)) rather than recruitment —
      one decisive sentence inside a mostly-benign dashboard description.

  # ================================================================================================
  # BATCH 2 — Art. 6(1) / Annex I. Authored from six FDA 510(k) summaries for AI-enabled medical
  # devices, paraphrased. Same blind discipline as batch 1; the classifier was never run on them.
  #
  # WHY THIS BATCH EXISTS. Batch 1 and the dev set are all Annex III (employment). Nothing exercised
  # Art. 6(1) — the OTHER door to high_risk, and a conjunction, which is a different shape of
  # question: not "which listed area is this?" but "is this AI a safety component of, or itself, a
  # product under Annex I, AND does that product need a notified body?".
  #
  # THE STRUCTURAL FACT ABOUT THE SOURCES. A 510(k) is a US filing. It never states an EU conformity
  # route, so Art. 6(1)(b) is systematically absent from every one of these documents. Where (a) is
  # met, that leaves the tier undecidable and needs_review is the only honest key — four of the six
  # land there. This is not a quirk of authoring; it is what real provider documentation for a
  # third-country medical device looks like, and it is worth measuring. The alternative — reading
  # "Class II" on an FDA form as an MDR risk class, or supplying the MDR classification rules from
  # memory — would invent the missing fact and hand a provider a conclusion it never claimed.
  #
  # WHAT IS PINNED. Where condition (a) IS established, the case sets expected_annex_i_product and
  # leaves expected_third_party_assessment null. That is deliberate: per the schema it pins only
  # half the test, which is exactly the half these documents support.
  # ================================================================================================

  # --- NEEDS_REVIEW — Art. 6(1)(b) absent AND the Annex III(5)(d) reading contested -------------
  - case_id: h_lvo_triage_notification
    description: >-
      A radiology workflow tool that runs on head CT-angiography studies as they arrive, using a
      deep-learning model to flag series it suspects contain a large vessel occlusion and to push a
      pop-up notification to the radiologist's worklist desktop. The notification carries the patient
      name, accession number and the pathology, plus a small compressed black-and-white preview
      labelled not for diagnostic use. The vendor states the tool does not alter the original image,
      adds no markings to it, does not remove cases from the standard first-in-first-out reading
      queue, and runs in parallel with routine interpretation, which remains the default for every
      case; users may switch notifications off for particular pathologies or imaging centres, and
      doing so does not change the order in which notifications appear. Notified clinicians remain
      responsible for reviewing the full study to the usual standard, and results are meant to be
      weighed together with other patient information and the reader's own professional judgement to
      assist triage and prioritisation of images. Scope is adult head CTA at 0.5 to 1.0 mm slices
      from 64-slice or better scanners, excluding technically inadequate scans. In a retrospective
      blinded study of 383 cases across three US sites, sensitivity was 88.8% and specificity 87.2%,
      and mean time from a study arriving to a notification going out was 3.8 minutes. The
      radiologist who receives a notification then contacts a neurologist, neuro-interventionalist or
      other clinician able to treat stroke patients. Cleared as a Class II radiological
      computer-aided triage and notification software device.
    expected_risk_class: needs_review
    expected_abstains_at: third_party_assessment
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers from a CT-angiography series that it may contain a large vessel occlusion — a
      deep-learning model reading images, stated plainly in the description.
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_transparency_duties: []
    transparency_basis: >-
      Determinable even though the tier is not. Art. 50(1) does not attach: a worklist pop-up is not
      a system intended to interact directly with a natural person as an interlocutor, and in any
      event that it is software is obvious to the radiologist using it. Art. 50(2) does not attach:
      the preview is a compressed copy of the captured scan, not synthetic content, and the
      description says the original image is not altered. No emotion inference or biometric
      categorisation (50(3)) — the model detects a vascular occlusion, it assigns no person to a
      category on the basis of biometric data. No deep fake (50(4)).
    decisive_fact: >-
      The tier cannot be fixed from this description, on two independent grounds. Condition (a) is
      plausibly met — software with a medical purpose, so a product covered by Regulation (EU)
      2017/745 at Annex I(A)(11) — but Art. 6(1) is a CONJUNCTION and the description never says
      whether that product must undergo third-party conformity assessment, so (b) is unresolved.
      Separately, whether flagging suspected stroke studies for earlier reading is an "emergency
      healthcare patient triage system" within Annex III(5)(d) is genuinely arguable: it establishes
      reading priority in an acute setting, yet the description states it does not reorder the
      standard queue and runs alongside routine interpretation. Two open doors, neither closable from
      the text, so needs_review.
    difficulty: ambiguous
    notes: >-
      Both honest options from the brief are in play here and the case takes NEITHER cleanly: the
      Art. 6(1)(b) gap is a missing-input problem (insufficient), the Annex III(5)(d) question is a
      contested-law problem (ambiguous). Banded as `ambiguous` because the contested reading is the
      distinctive thing to measure — a classifier that silently resolves Annex III(5)(d) either way
      is asserting more than the text supports. The heavy "human stays responsible" language is a
      distractor: it bears on Art. 6(3), which derogates from Art. 6(2) only and cannot reach a
      system whose Art. 6(1) status is the open question.

  # --- NEEDS_REVIEW — Art. 6(1)(a) met on the "itself a product" limb, (b) absent ---------------
  - case_id: h_autonomous_retinopathy_screening
    description: >-
      An autonomous screening system that analyses colour fundus photographs to decide whether a
      patient has more than mild diabetic retinopathy, indicated for use by healthcare providers on
      adults with diagnosed diabetes who have not previously been diagnosed with retinopathy. Two
      images per eye are captured on one specified fundus camera by an operator whom on-screen
      prompts walk through acquisition one image at a time; the images travel to the vendor's
      servers, where an analysis component judges exam quality and the presence or absence of the
      condition and returns one of three results to the client software: refer to an eye care
      professional, rescreen in twelve months, or image quality insufficient. Nothing beyond the
      fundus images is needed to perform the analysis. This submission is a version update that
      replaces the image-quality classifier and makes the analysis faster, and it adds a green tick
      or red cross on the submission feedback screen plus clearer wording when repeated attempts
      still fail on quality. A retrospective study on data from 850 evaluable participants gave
      sensitivity of about 88% and specificity of about 90% on final-submission images, with about
      95% of participants receiving a result at all. The filing also describes hazard analysis,
      cybersecurity controls covering confidentiality, integrity, availability, denial of service and
      malware, and a protocol governing which future algorithm changes would require a fresh
      submission. Regulated as a Class II retinal diagnostic software device.
    expected_risk_class: needs_review
    expected_abstains_at: third_party_assessment
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a diagnosis from colour fundus photographs, autonomously and without a
      clinician reading the image first.
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50(1) does not attach: the stated user is a healthcare provider operating a GUI, not a
      natural person interacting with the system as an interlocutor, and the description says nothing
      about the patient being addressed by the system at all. No synthetic content is generated
      (50(2)) and no deep fake (50(4)). Art. 50(3) is the arguable one and the answer is no: the
      system's purpose is to detect a disease from an eye image, not to assign natural persons to
      categories on the basis of biometric data within Art. 3(40) — see notes, this is the most
      contestable label in the batch.
    decisive_fact: >-
      The AI system is ITSELF the product — autonomous software whose output is a referral decision
      about a patient — so Art. 6(1)(a) is met on its second limb, via Regulation (EU) 2017/745 at
      Annex I(A)(11). What the description never states is Art. 6(1)(b): whether that product is
      required to undergo third-party conformity assessment under that legislation. Art. 6(1) is a
      conjunction, and the system falls outside every Annex III area, so with (b) absent there is no
      other route to a tier. needs_review.
    difficulty: insufficient
    notes: >-
      Recorded as insufficient rather than reasoned to a class: the second option in the brief. The
      absent fact is Art. 6(1)(b) and it is structurally absent — a 510(k) cannot contain it.
      Deliberate contrast with h_cardiac_mapping_autocontour, which is missing the SAME fact but
      meets (a) on the OTHER limb (safety component, not itself a product); a classifier that
      collapses the two limbs will look identical on both and should not.
      CONTESTABLE, recorded rather than hidden: Art. 3(34) defines biometric data without the GDPR's
      unique-identification qualifier, and Art. 3(40) defines a biometric categorisation system as
      one assigning persons to categories on the basis of biometric data, with no sensitivity
      qualifier. A retinal image sorted into "referable disease / not" is not obviously outside that
      wording. The label here reads Art. 50(3) purpose-bound and in the light of Annex III(1), which
      frames biometrics as identification, categorisation by protected attribute, and emotion — none
      of which is what a disease detector does. A reviewer could disagree.

  # --- MINIMAL — an AI component of an Annex I product that is NOT a safety component -----------
  - case_id: h_fundus_camera_onh_montage
    description: >-
      A high-resolution ophthalmic camera for in-vivo imaging of the eye, indicated to capture,
      display, annotate and store images that aid clinicians in diagnosing and monitoring conditions
      of the retina, ocular surface and visible adnexa, and to help visualise retinal and choroidal
      vascular structures in angiography. Imaging modes include true colour, fundus autofluorescence
      with green or blue excitation, fluorescein angiography, indocyanine green angiography and
      simultaneous FA plus ICGA, in stereo, widefield, ultra-widefield and montage fields of view; a
      single capture yields a 90-degree image and two are merged automatically into a 135-degree
      ultra-widefield view. The instrument uses slit-scanning broad-line fundus imaging with red,
      green and blue LEDs plus a near-infrared laser diode for live preview, 12-megapixel monochrome
      sensors, a chin and forehead rest, a joystick, and a 22-inch external display, and it exports
      through DICOM, PACS, network drives and USB. Intended users are listed as opticians, ophthalmic
      photographers, optometrists, ophthalmologists, medical assistants and clinical researchers. A
      deep-learning algorithm detects the optic nerve head so that the ultra-widefield montage no
      longer depends on the patient fixating accurately: the software locates the optic nerve and
      works out from the captured images where the patient was gazing at the moment of capture. Other
      additions in this version are simultaneous FA and ICGA capture, an angiography movie mode,
      manual placement of ETDRS grids over the pictures to help identify a grading level, an ICGA
      boost mode, and an eight-picture side-by-side view. A live infrared preview lets the technician
      confirm image quality and check for lid and lash obstructions before imaging, so fewer
      recaptures are needed. The filing reports biocompatibility testing on patient-contacting
      accessories, laser, electrical and electromagnetic compatibility results against a list of
      standards, bench testing, software verification and validation, and a clinical assessment in
      which three independent graders found the angiography image quality clinically acceptable.
      Regulated as a Class II ophthalmic camera.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers image content in producing its montage and annotations, going beyond capture and
      storage. What the description leaves open is the conformity route, not Art. 3(1).
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: a camera operated by a technician is not a system interacting directly
      with a natural person as an interlocutor (50(1)); merging captured photographs generates no
      synthetic audio, image, video or text content (50(2)); locating an anatomical landmark to align
      an image infers no emotion and assigns no person to a category (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      The only AI in a long optics-and-safety filing is an optic-nerve-head detector whose job is to
      work out where the patient was looking so the montage can be assembled without accurate
      fixation. That is an image-assembly function: it fulfils no safety function for the camera, and
      the description gives no basis for saying its malfunction endangers health or safety
      (Art. 3(14)) — the clinician still diagnoses from the images, and the technician checks quality
      on live preview before capture. So Art. 6(1)(a) fails on the safety-component limb, the AI is
      not itself the product, and no Annex III area covers ophthalmic imaging: minimal.
    difficulty: buried
    notes: >-
      Reasoned to a class the document supports — the first option in the brief — rather than parked
      at needs_review, because here condition (a) fails and Art. 6(1)(b) never has to be reached.
      That is the point of the case: the systematically-absent (b) only matters once (a) is met, and
      a classifier should not raise it here.
      Buried by construction: one AI sentence inside pages of LEDs, filters, humidity ranges and
      sterilisation standards. Two ways to get it wrong — miss the AI entirely, or treat "Class II
      medical device with a deep-learning algorithm" as sufficient for Art. 6(1) without asking
      whether the component is a SAFETY component.
      CONTESTABLE: a mis-assembled ultra-widefield montage could in principle conceal pathology,
      which is a route to arguing the second limb of Art. 3(14). The description does not support it
      — no hazard of that kind is stated — but a reviewer could reach for it.

  # --- NEEDS_REVIEW — Art. 6(1)(a) met on the SAFETY-COMPONENT limb, (b) absent -----------------
  - case_id: h_cardiac_mapping_autocontour
    description: >-
      A catheter-based cardiac mapping system used during electrophysiology procedures, which
      acquires a navigation catheter's location together with intracardiac ECG signals and renders
      three-dimensional anatomical and electro-anatomical maps of the heart; it gives the operator
      information about the heart's electrical activity and about where the catheter is during the
      procedure. Any patient eligible for a conventional electrophysiology procedure may be treated
      with it. Location comes from magnetic sensor technology and an advanced catheter location
      technology, and the system ships as a patient interface unit, a workstation with a graphical
      interface, wide-screen monitors, intracardiac in and out ports, a power supply, a patch
      connection box and cables, a pedal, a location pad and a signal-processing unit; the hardware
      is unchanged from the previous version. This version retires the legacy fast-anatomical-mapping
      module, replacing it with one that maps the left atrium, the left ventricle and their
      substructures automatically from ultrasound, to cut manual contouring: its locked AI algorithms
      automatically identify cardiac structures overlaid on the intracardiac echo images, create
      two-dimensional contours of those structures, and build a three-dimensional shell used as the
      baseline for reconstructing the two chambers. A second new module uses a locked AI algorithm to
      generate a left-atrial shell when mapping with one particular catheter, and the acquired volume
      can be refined further with the platform's existing mapping tools. Training and validation data
      covered a representative range of chamber volumes, geographical locations, ultrasound scanners,
      scanner settings and catheters, and were drawn from CT scans and from prior cases on the same
      platform. Post-market user feedback and complaints will be monitored routinely under the
      manufacturer's quality system, and an authorised change-control plan permits retraining the
      models on additional datasets, model optimisation, more anatomical structures, further input
      devices, extra map colouring and display of information imported from an external device,
      without a new submission. Unit, design, functional and retrospective validation testing on
      recorded historical procedures all passed, and animal testing under simulated clinical
      conditions met its protocol. Regulated as a Class II programmable diagnostic computer.
    expected_risk_class: needs_review
    expected_abstains_at: third_party_assessment
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers anatomical contours from catheter location and intracardiac ECG signal to render
      three-dimensional maps. The reconstruction is derived, not measured directly.
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: an operator reading a map during a procedure is not interacting with
      the system as an interlocutor and knows it is software (50(1)); maps reconstructed from measured
      ultrasound and electrical signals are not synthetic content (50(2)); no emotion inference or
      biometric categorisation (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      The AI builds the anatomical map the operator navigates a catheter by inside a beating heart —
      it identifies the cardiac structures on the echo images and creates the 3D shell used as the
      baseline for chamber reconstruction — so it is a safety component of a product covered by
      Regulation (EU) 2017/745 (Annex I(A)(11)): its failure or malfunctioning endangers the health
      and safety of persons within Art. 3(14), which is condition (a). Art. 6(1)(b) is the missing
      half — the description never says whether that product requires third-party conformity
      assessment — and no Annex III area covers cardiac procedures, so there is no second route.
      needs_review.
    difficulty: insufficient
    notes: >-
      Recorded as insufficient, per the brief's second option. Pairs with
      h_autonomous_retinopathy_screening: same absent fact, other limb of condition (a). Also carries
      a live Art. 43(4) / Art. 3(23) hook that this batch does not key — an authorised plan to retrain
      the models post-market — deliberately left in the description as realistic noise for a
      classification-only case.

  # --- MINIMAL — the description itself rules out the safety function (clean negative) ----------
  - case_id: h_pap_comfort_setting_recommender
    description: >-
      An optional machine-learning software accessory for positive airway pressure therapy devices
      that recommends comfort settings — ramp, expiratory pressure relief and its level, and an
      automatic response setting — to help patients settle in during onboarding and early therapy
      adaptation. It is indicated for healthcare professionals and patients, in a home or clinical
      environment. From patient-specific input data it produces a short list of predefined
      configuration options, all within the connected device's already-cleared configuration limits,
      which the patient or the healthcare provider can review, accept, disregard or adjust further
      according to personal preference or clinical guidance. It does not adjust device settings by
      itself, does not modify prescribed therapy parameters, does not create new settings, does not
      alter configuration limits, and does not deliver or control therapy; it is reached through an
      application programming interface and has no user interface or end-user access of its own. The
      manufacturer states that it identified no hazard and no critical task that would plausibly
      injure or otherwise harm a patient, so usability and human-factors testing were not
      required, and that no clinical study was needed because model performance was characterised on
      retrospective de-identified data representative of the intended population. Retrospective
      comparison against default configurations showed more nightly usage and more days of use while
      residual apnoea-hypopnoea index and mask leak stayed comparable. An authorised change-control
      plan allows performance and data-drift updates and infrastructure updates, evaluated against
      predefined metrics; it permits no continuously learning algorithms, and every model change is
      trained, tuned and locked before release. It is filed under the same Class II noncontinuous
      ventilator product code as the companion patient app it is compared against.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers recommended comfort settings from the patient's therapy data — stated in the
      description as machine-learning software.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50(1) does not attach and the description says why in terms: the software has no user
      interface or end-user access and is reached only through an API, so it is not a system intended
      to interact directly with natural persons. A list of predefined configuration options is not
      synthetic audio, image, video or text content (50(2)); no emotion inference or biometric
      categorisation (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      The recommendations are optional and non-therapeutic, stay inside the connected device's
      already-cleared configuration limits, change no setting and no prescribed parameter, and the
      description states that no hazard or critical task reasonably likely to cause injury was
      identified. On those facts the software fulfils no safety function for the therapy device and
      its malfunction does not endanger health or safety, so it is not a safety component within
      Art. 3(14) and Art. 6(1)(a) is not met. It is outside every Annex III area. Minimal.
    difficulty: obvious
    notes: >-
      Reasoned to a supported class (the brief's first option). The batch's clean false-positive
      anchor, and the only one whose negative is stated rather than inferred.
      The distractor is the product code: this thing is filed as a "noncontinuous ventilator", which
      names the host device family, not a safety role for the accessory. A classifier that reads
      "ventilator" and reaches for Annex I(A)(11) is keyword-matching. expected_performs_profiling is
      null, not false: individualised recommendations from patient-specific data are arguably
      profiling, but the question decides nothing here — the Art. 6(3) carve-back derogates from
      Art. 6(2) and cannot reach a system outside Annex III.

  # --- NEEDS_REVIEW — safety component BURIED in a table, and (b) absent ------------------------
  - case_id: h_prostate_resection_plan_landmarks
    description: >-
      A robotic system indicated for resecting and removing prostatic tissue from men who have lower
      urinary tract symptoms caused by benign prostatic hyperplasia. It comprises a tower with
      touchscreen surgeon and support-staff monitors, system software and an embedded operating
      system, a motorpack, handpiece and probe arms and a foot pedal; a reusable biplane transrectal
      ultrasound probe that supplies the imaging for the procedure; and a single-use sterile handpiece
      with an integrated digital scope, passed endoscopically through the urethra to visualise, resect
      and remove prostatic tissue with a waterjet. The intended user is a urologist supported by
      operating-room staff, trained and familiar with endoscopic BPH surgery such as TURP and with
      recognising and managing its complications, and also trained in transrectal ultrasound imaging.
      During the planning step an optional AI feature can be toggled on: in the transverse view at the
      angle-and-depth step it supplies the handpiece nozzle position and the prostate capsule
      boundary, and at the profile-landmark step in the sagittal view it places the four landmarks —
      treatment start, bladder neck, mid-prostate and treatment end — which the surgeon may then
      adjust as needed. This version carries an updated model for that same landmark identification.
      Physician authorisation can now be enabled either on the surgeon monitor or by pressing a button
      on the motorpack, where previously it was only on the surgeon monitor. The default orientation
      of the verumontanum protection zone cannot be modified in the transverse plane, while its length
      can be modified in the sagittal plane. The tower is provided non-sterile and does not contact
      the patient; the probe is now validated for 71 reprocessing cycles rather than 25 and two
      further reprocessing methods are documented; the handpiece shelf life goes from six to
      twenty-four months. Software allows the Wi-Fi cloud connection to be enabled or disabled and
      users may choose a disconnected system. Design validation used simulated-use and cadaver
      testing, and the filing tabulates passing results against standards for robotically assisted
      surgical equipment basic safety, endoscopic equipment, usability and human factors,
      electromagnetic compatibility, sterilisation, biocompatibility, packaging and transit,
      cybersecurity, and good machine learning practice. Regulated as a Class II fluid jet system for
      prostate tissue removal.
    expected_risk_class: needs_review
    expected_abstains_at: third_party_assessment
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers anatomical landmarks from imaging to build the resection plan, rather than
      applying dimensions a surgeon typed in.
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: a surgeon operating a touchscreen during a procedure is not
      interacting with the system as an interlocutor (50(1)); placing landmarks on captured
      ultrasound images generates no synthetic content (50(2)); no emotion inference or biometric
      categorisation (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      In one row of a comparison table, the optional AI places the prostate capsule boundary and the
      four profile landmarks — treatment start, bladder neck, mid-prostate, treatment end — that
      define where a waterjet resects tissue inside the prostate. That is a safety component of a
      product covered by Regulation (EU) 2017/745 (Annex I(A)(11)): malfunctioning landmark placement
      endangers health and safety within Art. 3(14), and the surgeon's ability to adjust the
      landmarks does not change the tier any more than human sign-off does under Art. 6. Art. 6(1)(b)
      — whether the product requires third-party conformity assessment — is never stated, and no
      Annex III area covers surgical resection. needs_review.
    difficulty: insufficient
    notes: >-
      Recorded as insufficient, per the brief's second option, but it doubles as the batch's hardest
      LOCATE problem: the AI appears once, inside a table row, in a filing otherwise about
      sterilisation cycles, shelf life and packaging. Banded `insufficient` because that is the band
      the expected answer belongs to — needs_review is the only correct answer where the decisive
      fact is absent — and a classifier that never finds the AI at all will also say needs_review,
      for the wrong reason. Read this one's decisive_fact, not just its label, when scoring.
      Contrast with h_pap_comfort_setting_recommender: both are optional AI features a human can
      override inside a medical device, and they land differently, because one places the resection
      plan and the other suggests a comfort setting.

  # ================================================================================================
  # BATCH 3 — Art. 2 (scope). Authored from nine public documents — two TED procurement notices,
  # three CORDIS project records, two Hugging Face model cards, one consumer user manual and one
  # manufacturer press release — paraphrased. Same blind discipline; the classifier was never run
  # on them, and no code consulting Art. 2 existed when they were written.
  #
  # WHY THIS BATCH EXISTS. Every earlier case asks which tier a system falls in. None asks the prior
  # question: does the Regulation govern it at all? Art. 2 answers that, and it answers it in two
  # directions — paragraph 1 says who is bound, and several later paragraphs withhold the Regulation
  # from particular systems and particular uses.
  #
  # THE SHAPE OF THE BATCH. Five exclusions get a case each — 2(3) military/defence/national
  # security, 2(6) sole purpose of scientific R&D, 2(8) pre-market research and development, 2(10)
  # purely personal non-professional use, 2(12) free and open-source release — and each is paired
  # with a NEAR NEIGHBOUR that reads like it and is not it. Every exclusion is qualified
  # ("exclusively", "sole purpose", "purely", "prior to", and 2(12)'s Art. 5/50 carve-back), so the
  # pairs are where the measurement is: a classifier that grants an exclusion on a keyword —
  # "defence", "research project", "open source", "consumer" — is worse than one that never grants
  # any. Five out_of_scope, four in scope.
  #
  # ONE EXCLUSION IS NOT COVERED. Art. 2(4) — third-country public authorities and international
  # organisations acting under law-enforcement or judicial cooperation agreements with the Union —
  # has no case, because no source document was found that describes such a system without the
  # author supplying the cooperation framework himself. Recorded rather than faked.
  #
  # ROLES, NOT ORGANISATIONS. h_household_oven_bake_predictor and h_consumer_drone_subject_tracking
  # are the same product shape answered for different actors, which is what Art. 2(1) is built on:
  # 2(10) lifts obligations from a natural-person DEPLOYER and leaves the provider's untouched.
  # ================================================================================================

  # --- OUT_OF_SCOPE — Art. 2(3), exclusively military purposes ---------------------------------
  - case_id: h_mil_uas_gnss_denied_navigation
    description: >-
      A tender issued by the European Defence Agency, classified under military research and
      technology, for a project to raise the precision-navigation capability of European-made
      low-cost tactical unmanned aircraft. The work has two strands: making the aircraft resilient
      where satellite positioning is limited, denied or being jammed, and combining recent EU
      space-based services with onboard sensor fusion driven by artificial intelligence so that
      navigation stays accurate whatever the spectrum situation, to be proven out in real-world
      proof-of-concept and demonstration phases. The buyer frames the whole exercise as equipping
      European armed forces for secure access to airspace, and the resulting autonomy is expected to
      help keep these aircraft apart from manned traffic in shared European skies. The same tender
      carries three other lots: an online tool automating risk assessment for military unmanned
      aircraft operations, with a selectable accepted risk level covering operations in peacetime,
      crisis and war; a study of the civil-military aspects of higher-altitude operations, including
      avoiding adverse effects on national security and defence capabilities; and a consultancy lot
      on end-user needs, market research and the state of the art, which speaks of taking advantage
      of dual-use technology for safe airspace integration. Bidders sought include large defence
      contractors, SMEs in unmanned aircraft technology, sensors and AI, research institutions and
      flight test centres. Estimated value of the cluster is EUR 2.9 million.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers position without satellite fix, from onboard sensing — precision navigation in a
      GNSS-denied environment is estimation, not dead reckoning from a written formula.
    expected_scope_exclusion: military_defence_national_security
    scope_exclusion_basis: >-
      Art. 2(3), second subparagraph. The system is put into service exclusively for military and
      defence purposes: it is navigation for military tactical unmanned aircraft, procured by a
      defence agency under military research and technology, to give armed forces assured airspace
      access. The subparagraph is unconditional as to the entity carrying out the activity, so the
      buyer being an EU body changes nothing.
    expected_transparency_duties: []
    transparency_basis: >-
      Not reached. Art. 50 is a provision of this Regulation, and a system excluded by Art. 2 owes
      nothing under it. On the facts it would not attach anyway: navigating an aircraft is not direct
      interaction with a natural person (50(1)), generates no synthetic content (50(2)), infers no
      emotion and categorises no person (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      The purpose of use is military. Art. 2(3) withholds the Regulation from AI systems placed on
      the market, put into service or used exclusively for military, defence or national security
      purposes, and this is AI navigation for military tactical unmanned aircraft bought by a defence
      agency for armed forces. The word that decides it is "exclusively", and nothing here points at
      a civil use of THIS system: the safe-airspace-integration framing is about where military
      aircraft are allowed to fly, and the single mention of dual-use technology belongs to a
      different lot of the same tender, about market research.
    difficulty: buried
    notes: >-
      Near neighbour is h_customs_osint_analysis_tools, which is bought under defence-and-security
      procurement law and is NOT excluded, because the exclusion turns on the purpose of use rather
      than on the procurement regime.
      Art. 2(8) would independently reach this project — it is a research and development activity
      prior to any placing on the market — so a classifier naming 2(8) instead of 2(3) has reached
      the right class by a defensible route. 2(3) is keyed because it is the unconditional one: it
      survives the system being fielded, whereas 2(8) stops the day the system is put into service.
      The mention of real-world proof-of-concept phases is a live 2(8) hook and is left in for that
      reason.

  # --- IN SCOPE — near neighbour to 2(3): defence PROCUREMENT is not a defence PURPOSE -----------
  - case_id: h_customs_osint_analysis_tools
    description: >-
      A joint purchase by a national customs administration and the same country's border guard,
      both central government authorities whose stated field of activity is public order and safety,
      of software licences in three packages: digital forensics tools for collecting and analysing
      data, open-source-intelligence data-analysis software, and open-source-intelligence
      cryptoanalysis software. The buyers state that the purchase is run as a security procurement
      under the national act on public procurement in the fields of defence and security, by a
      restricted two-phase procedure, and the notice cites Directive 2009/81/EC as its legal basis.
      Licences must be usable from the start of the following year; the place of performance is
      anywhere in the European Economic Area; the initial contract runs two years and may continue
      until further notice up to a maximum of seven; award is on price alone; the estimated value is
      about EUR 4.88 million across the three packages, and the buyers reserve the right to buy
      further licences in the same field. Beyond those product labels the notice says nothing about
      what the software does — what it takes as input, what it infers, about whom, or what it puts
      out.
    expected_risk_class: needs_review
    expected_abstains_at: annex_iii
    expected_is_ai_system: true
    is_ai_basis: >-
      CONTESTABLE, and the notice is why: it lists licences for analysis software without
      saying whether the tools infer anything or merely search and report. Kept `true` because the
      case abstains downstream, but a run declining at `is_ai` is defensible on this text.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Undeterminable along with the tier, and recorded as false only because nothing in the notice
      supports an obligation: it describes licences for analysis software, with no statement that
      anything interacts with a person (50(1)), generates content (50(2)), infers emotion or
      categorises anyone biometrically (50(3)) or produces a deep fake (50(4)). Silence, not a
      finding.
    decisive_fact: >-
      SCOPE IS DECIDED AND THE TIER IS NOT. Art. 2(3) is not available: it excludes systems used
      exclusively for military, defence or national security purposes, and the users here are a
      customs administration and a border guard acting in public order and safety — law enforcement,
      not defence. That the purchase runs under defence-and-security procurement law fixes which
      tendering rules apply, not what the software is for; the exclusion is written about purpose of
      use. So the Regulation applies. But the notice never says what the software does, and the
      Annex III(6) law-enforcement entries are all function-specific — victim risk, polygraph,
      evidence reliability, offending risk, profiling — none of which is established here. It does
      not even establish that these are AI systems within Art. 3(1) rather than search and reporting
      tools that infer nothing. needs_review.
    difficulty: insufficient
    notes: >-
      The absent fact is what the system DOES; the present fact is that Art. 2(3) does not reach it.
      Banded `insufficient` because needs_review is the right answer where the decisive fact is
      missing, but the point being measured is the scope half — read the decisive_fact, not the
      label. A classifier that answers needs_review after reasoning "defence procurement, might be
      excluded" has failed this case while appearing to pass it.
      Pairs with h_mil_uas_gnss_denied_navigation: the two documents look alike in register and land
      on opposite sides of 2(3).

  # --- OUT_OF_SCOPE — Art. 2(6), sole purpose of scientific research and development -------------
  - case_id: h_star_formation_ml_classifier
    description: >-
      A publicly funded astrophysics project that sets out to revise how young stellar objects are
      classified and how long each phase of star formation is thought to last. The current scheme
      dates from the first space-based infrared sky surveys of thirty years ago and, while good
      enough for global properties, carries large uncertainties, which makes the timescales derived
      from population statistics across classes doubtful. The project will assemble the largest
      panchromatic dataset of young stellar objects in nearby star-forming regions, drawing on data
      from space missions, and then reprocess and analyse it with supervised and unsupervised
      machine-learning algorithms and with deep neural networks doing object detection, clustering
      and regression over images, in order to push the analysis past the current state of the art.
      The stated aim is to bring big-data techniques and hybrid machine-learning methods to bear on
      long-standing questions about how stars and their planets form, and to open a path towards
      data-intensive science in modern astrophysics.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a classification of young stellar objects from observational data, replacing a
      hand-built scheme with a learned one — the project's stated purpose.
    expected_scope_exclusion: scientific_research
    scope_exclusion_basis: >-
      Art. 2(6). The machine-learning system is specifically developed and put into service for the
      sole purpose of scientific research and development — analysing astronomical survey data to
      settle a question about star formation. Science is the end here, not a stage before something
      else, which is what makes 2(6) the fitting paragraph rather than 2(8).
    expected_transparency_duties: []
    transparency_basis: >-
      Not reached, the Regulation not applying. On the facts none of Art. 50 attaches: the system
      classifies images of stellar objects, so there is no natural person to interact with (50(1)),
      no synthetic content (50(2)), no emotion or biometric categorisation (50(3)) and no deep fake
      (50(4)).
    decisive_fact: >-
      The system exists to answer a scientific question and nothing else — Art. 2(6) excludes AI
      systems and models, including their output, specifically developed and put into service for
      the sole purpose of scientific research and development. "Sole purpose" is satisfied here in a
      way it usually is not: the subject matter is infrared images of star-forming regions, there is
      no product, no customer and no natural person anywhere in the pipeline.
    difficulty: obvious
    notes: >-
      The clean anchor for 2(6). Deliberately unambitious: if a classifier cannot exclude an
      astronomy pipeline, the harder pairs below tell you nothing.
      Art. 2(8) would also reach it, and a classifier naming 2(8) has the right class. 2(6) is keyed
      because 2(8) is defined by what comes AFTER the activity — placing on the market — and nothing
      here is heading there.

  # --- OUT_OF_SCOPE — Art. 2(8), development prior to placing on the market ----------------------
  - case_id: h_grid_operator_assistant_research
    description: >-
      A four-year publicly funded project, running to 2027 with about EUR 4 million of EU
      contribution, on AI-based solutions for critical systems that are modelled as networks and
      have traditionally been run by human operators: electricity grids, railways and air traffic
      management. It has two strategic goals. The first is to develop the next generation of
      decision-making methods built on supervised and reinforcement learning, aimed at
      trustworthiness in AI-assisted human control, with augmented cognition, hybrid human-AI
      co-learning and autonomous AI, and with the resilience, safety and security of critical
      infrastructures named as core requirements. The second is to speed up the development and
      validation of new AI algorithms, by the consortium and by the wider AI community, through
      existing open-source digital environments capable of emulating realistic scenarios of physical
      system operation and human decision-making. The core elements listed are the learning
      algorithms themselves, unifying existing heuristics with physical models of these complex
      systems; complementary techniques for transparency, safety, explainability and human
      acceptance; and human-in-the-loop decision making for co-learning between AI and people, taking
      account of model uncertainty, operator cognitive load and trust.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers operating recommendations for network-modelled critical systems. The research
      framing is about scope under Art. 2, not about whether it infers.
    expected_scope_exclusion: pre_market_development
    scope_exclusion_basis: >-
      Art. 2(8). This is a research, testing and development activity regarding AI systems prior to
      their being placed on the market or put into service: algorithms are developed and validated in
      open-source digital environments that emulate the physical systems. The last sentence of 2(8)
      does not bite, because simulated environments are the opposite of testing in real-world
      conditions as Art. 3(57) defines it.
    expected_transparency_duties: []
    transparency_basis: >-
      Not reached. On the facts nothing in Art. 50 attaches either: an operator decision-support
      algorithm is not a system intended to interact with a natural person as an interlocutor
      (50(1)), it generates no synthetic content (50(2)), infers no emotion and categorises no
      person (50(3)), and produces no deep fake (50(4)).
    decisive_fact: >-
      Nothing is placed on the market or put into service. Art. 2(8) withholds the Regulation from
      research, testing or development activity regarding AI systems prior to that point, and the
      only validation described happens inside open-source digital environments that emulate grid,
      rail and air-traffic operation. The critical-infrastructure vocabulary is the trap: were a
      system of this kind actually put into service as a safety component in the management and
      operation of electricity supply or road traffic, Annex III(2) would make it high-risk — which
      is precisely the thing Art. 2(8) says has not happened yet.
    difficulty: buried
    notes: >-
      The decisive fact is the project stage, and it is spread thinly across a description that
      shouts "safety and security of critical infrastructures". Two ways to fail: read Annex III(2)
      and answer high_risk, or read "human-in-the-loop" and reach for an Art. 6(3) derogation —
      which cannot be reached at all, since Art. 6 classifies systems the Regulation governs.
      Art. 2(6) is arguable on the same facts and would give the same class. 2(8) is keyed because
      the stated goal is deployable operator support, not knowledge for its own sake, so "sole
      purpose of scientific research" is the weaker fit. Contrast h_star_formation_ml_classifier.
      The open-source digital environments are simulators the project USES, not a licence under which
      this project's own systems are released, so Art. 2(12) is not in play.

  # --- IN SCOPE — near neighbour to 2(8) and 2(6): already sold, and provider in a third country --
  - case_id: h_pool_drowning_detection_rollout
    description: >-
      A company based in Haifa, Israel, building a swimmer-safety and analytics platform for
      swimming pools, to be extended later to harder settings such as beaches and rivers where the
      water is less still and less clear. Several pool cameras are fused into continuous
      three-hundred-and-sixty-degree coverage and computer vision with deep learning is applied to
      pick out early signs of a swimmer in distress, unusual swimmer behaviour, and a range of pool
      analytics, so that lifeguarding can be proactive and staffing can be planned; facility managers
      are promised visibility and real-time insight they do not otherwise have. The system is
      designed to be cheap and simple enough to install and run that it can become commonplace in any
      kind of venue, in the way technology has spread through other traditionally non-technological
      industries. A pilot study is already under way in the company's home country, the company has
      its first paying customers, and it projects more than a thousand installed systems and about
      EUR 5 million of revenue within two years, starting with public pools. The work described here
      received a small EU innovation grant for small enterprises, ran for six months, and had a total
      cost of about EUR 71 000.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers distress and submersion from pool video — detecting a drowning from moving
      images is perception, which no written rule performs.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach. A pool camera analysing swimmers is not a system intended to interact
      directly with natural persons as an interlocutor (50(1)); it generates no synthetic audio,
      image, video or text (50(2)); and it produces no deep fake (50(4)). Art. 50(3) is the arguable
      one and the answer is no — see notes.
    decisive_fact: >-
      Two exclusions are within reach and neither closes. Art. 2(8) fails on "prior to": the platform
      already has paying customers and an installation programme, so it is placed on the market, and
      the pilot is not pre-market development but a product in use. Art. 2(6) fails on "sole
      purpose": the EU grant makes it look like a research project, but the purpose described is a
      commercial safety product with a revenue plan. The provider sitting in a third country is not a
      third route out — Art. 2(1)(a) binds providers placing AI systems on the Union market
      irrespective of whether they are established in the Union or outside it. In scope, therefore,
      and on the tier no Annex III area reaches a leisure pool — Annex III(2) covers critical digital
      infrastructure, road traffic and the supply of water, gas, heating or electricity, not a place
      people swim — and the platform is not a safety component of any Annex I product. Minimal.
    difficulty: buried
    notes: >-
      Carries the whole of Art. 2(1)(a) as well as the 2(6) and 2(8) near-neighbour work: a
      research-grant record, a non-EU provider and a pre-market-sounding pilot, none of which
      excludes anything.
      "Safety" is the false-positive bait — drowning detection sounds like it must be high-risk, and
      Annex III has no entry it fits.
      CONTESTABLE, recorded rather than hidden: classifying swimmers as in distress or not, from
      video of how their bodies move, sits close to Art. 3(40) biometric categorisation, since
      Art. 3(34) counts behavioural characteristics as biometric data and Art. 3(40) carries no
      sensitivity qualifier. Art. 50(3) is read purpose-bound here, in the light of Annex III(1),
      which frames biometrics as identification, categorisation by protected attribute, and emotion —
      the same reading taken in h_autonomous_retinopathy_screening, and consistent for the same
      reason. A reviewer could disagree, and if they do, transparency flips to true on 50(3).

  # --- OUT_OF_SCOPE — Art. 2(12), free and open-source licence ----------------------------------
  - case_id: h_open_licence_demand_forecaster
    description: >-
      A family of compact pre-trained models for multivariate time-series forecasting, published by a
      corporate research lab under the Apache 2.0 licence together with an open-source Python toolkit,
      example notebooks and a helper that picks the right variant for a given history and forecast
      length. Sizes start around a million parameters; the publisher stresses that training,
      fine-tuning and inference all fit on a single GPU or a laptop CPU. The models produce point
      forecasts at resolutions from minutes to weeks, can be used with no training at all on a new
      series or fine-tuned on a small fraction of the target data, and support several variables at
      once, external driver variables and static categorical features. Pre-training used roughly 700
      million to a billion samples of publicly available time series: Australian electricity demand
      and weather, London smart-meter readings, solar and wind power production, river flow, sunspots,
      births, bitcoin, air-quality competition data, road-sensor loop counts and travel times,
      encyclopaedia and website traffic, vehicle trips, retail sales hierarchies, and public disease
      surveillance counts. The card sets the models against other forecasting foundation models on
      published benchmarks and notes they beat far larger ones while costing much less to run. The
      publisher adds that everything in the repository is supplied under the open-source licence,
      that it was produced as an open-source project rather than as a company product, and that it
      makes no assertion about quality or security and will not maintain the code going forward.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers future values from multivariate time series. A pre-trained forecasting model is
      inference in its purest form.
    expected_scope_exclusion: free_open_source
    scope_exclusion_basis: >-
      Art. 2(12). Released under a free and open-source licence, and none of the three carve-backs
      applies: it is not put into service as a high-risk system, it is no Art. 5 practice, and no
      Art. 50 paragraph reaches a numeric point forecast.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Decided on the merits, because Art. 2(12) depends on the answer rather than the other way
      round. No paragraph attaches: a forecasting model exposed through a Python library is not
      intended to interact directly with natural persons (50(1)); a series of predicted numbers is
      not synthetic audio, image, video or text content (50(2)); nothing infers emotion or assigns
      persons to categories from biometric data (50(3)); and there is no deep fake (50(4)).
    decisive_fact: >-
      An Apache 2.0 release is a free and open-source licence, so Art. 2(12) excludes it UNLESS it is
      placed on the market or put into service as a high-risk system or as one falling under Art. 5
      or Art. 50 — and here none of those holds. The trap is the training data: electricity demand,
      smart meters, road-sensor counts and disease surveillance make it look like critical
      infrastructure and public health, but that is what the models LEARNED FROM, not a purpose they
      are put into service for, and Art. 6(1)/6(2) both turn on intended purpose.
    difficulty: buried
    notes: >-
      Flip partner of h_open_licence_tts_voices: same licence family, same kind of publication, and
      the one difference that matters is whether the system generates content Art. 50(2) requires to
      be marked.
      CONTESTABLE, recorded rather than hidden: Art. 2(12) is written about AI SYSTEMS, and what is
      published here is model weights plus a library. Art. 3(1) systems and Art. 3(63) models are
      distinct in the Regulation, and a reviewer could say the exclusion is aimed at released systems
      and that bare weights are governed, if at all, by the general-purpose-model chapter. The label
      reads the released package — weights, inference library and model-selection helper — as an AI
      system, which is what someone downloading it runs. It is not a general-purpose AI model within
      Art. 3(63): forecasting one kind of object is not significant generality across a wide range of
      distinct tasks.

  # --- IN SCOPE — near neighbour to 2(12): the Art. 50 carve-back closes the exclusion -----------
  - case_id: h_open_licence_tts_voices
    description: >-
      An open-weight text-to-speech model of eighty-two million parameters, published under the
      Apache 2.0 licence with fifty-four voices across eight languages and a small Python package
      that turns a passage of text into an audio waveform. The publisher's pitch is that it matches
      much larger models for quality while being far faster and cheaper, and that the permissive
      licence means it can be run anywhere from production systems to personal projects. The card
      records that the model has been taken up in many projects and commercial APIs, quotes the going
      rate for serving it at under one dollar per million characters of input or six cents per hour of
      audio produced, and says explicitly that deployment in real use cases is welcome. Training used
      a few hundred hours of permissive or non-copyrighted audio with phoneme labels — public domain
      recordings, audio under permissive licences, and synthetic audio generated by large providers'
      closed text-to-speech models, but no synthetic audio from open models and no custom voice
      clones — at a total compute cost of about a thousand dollars. Sample audio, per-voice quality
      grades and arena evaluations are linked from the card, along with a warning that several
      lookalike websites carrying the model's name are unaffiliated and probably scams.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers an audio waveform from a passage of text: eighty-two million learned parameters
      map graphemes to speech.
    expected_scope_exclusion: free_open_source
    scope_exclusion_basis: >-
      Art. 2(12): released under Apache 2.0, a free and open-source licence, so the scope node
      answers that paragraph. It is the ONE exclusion that does not conclude — its carve-back names
      high-risk, Art. 5 and Art. 50, which the rest of the cascade decides — so the answer falls
      through and is resolved at the end. Here Art. 50(2) attaches, the carve-back bites, and the
      Regulation governs the release. The paragraph was correctly identified and correctly lifted;
      those are two findings, not one.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: [synthetic_content_marking]
    transparency_basis: >-
      Art. 50(2): the provider of an AI system generating synthetic audio content must ensure the
      outputs are marked in a machine-readable format and detectable as artificially generated. Every
      output of this system is synthetic speech, and none of the paragraph's carve-outs fits — it is
      not an assistive function for standard editing, it does not leave input data or its semantics
      substantially unaltered, and it is not authorised by law for criminal-offence purposes.
    decisive_fact: >-
      The free and open-source licence would exclude it, and Art. 2(12) takes that back for systems
      placed on the market as ones falling under Art. 5 or Art. 50. This system generates synthetic
      audio, so Art. 50(2) attaches to its provider, the exclusion is lifted, and the Regulation
      governs it. The tier then follows the ordinary route: no Annex III area, no Annex I safety
      component, so minimal — with Art. 50(2) owed regardless of tier.
    difficulty: obvious
    flips_from: h_open_licence_demand_forecaster
    notes: >-
      The flip for this batch, and it flips on scope rather than on tier: two permissively licensed
      releases, one excluded outright and one governed, separated by whether the output is synthetic
      content. A classifier that treats "open source" as an answer will get both wrong in the same
      direction, and one of them silently.
      "Placed on the market" is satisfied on the card's own terms — Art. 3(10) covers supply for
      distribution or use in the course of a commercial activity whether or not for payment, and the
      card records commercial API serving and invites real deployments.
      The model-versus-system point noted on h_open_licence_demand_forecaster applies here too, and
      cuts the same way for both.

  # --- OUT_OF_SCOPE — Art. 2(10), purely personal non-professional activity ---------------------
  - case_id: h_household_oven_bake_predictor
    description: >-
      A household member baking at home, for their own family and for no business purpose, using a
      built-in domestic oven that the manufacturer sells to households as its first appliance with
      artificial intelligence in it. While the food cooks, readings from the oven's moisture sensor
      are sent over the manufacturer's home-connectivity service to a cloud system, where a
      forecasting model built by machine learning from anonymised data collected across a large
      number of earlier baking and roasting sessions in the same food category is applied every
      thirty seconds and returns to the oven a prediction of when the item will be done. The
      manufacturer says the prediction gets sharper as more households use such ovens and use them
      more often, that a cook will be able to get a reliable finish time even for a recipe adjusted to
      personal taste — a wetter topping, a different dough — and that the point is convenience and
      being able to plan time at home. The existing moisture sensor and meat probe already adjust
      baking and measure core temperature to within a degree, and the release stresses that they keep
      working with no digital services at all, and that the oven itself runs only on the settings the
      individual user has chosen and the dish selected. Much of the material is promotional, quoting a
      managing director on customer-centred technology and a new era for home appliances.
    expected_risk_class: out_of_scope
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers what is being baked and how far along it is from oven sensing, which is what the
      manufacturer means by selling it as their first appliance with artificial intelligence.
    expected_scope_exclusion: personal_non_professional
    scope_exclusion_basis: >-
      Art. 2(10). The Regulation does not apply to the obligations of deployers who are natural
      persons using AI systems in the course of a purely personal non-professional activity, and
      baking for one's own household in one's own kitchen is that activity. The paragraph is narrow
      on its face: it lifts the DEPLOYER's obligations, and only where the deployer is a natural
      person and the activity is purely personal.
    expected_transparency_duties: []
    transparency_basis: >-
      Not owed by this deployer, the Regulation not applying to them. The deployer-facing paragraphs
      are the ones that could have: 50(3) needs emotion recognition or biometric categorisation, and a
      humidity curve is neither; 50(4) needs a deep fake, and there is none.
    decisive_fact: >-
      Who is deploying it. Art. 2(10) withholds the Regulation from the obligations of natural-person
      deployers acting in a purely personal non-professional activity, and the person here is baking
      at home for their family. Note what this does NOT decide: the exclusion attaches to a deployer,
      not to a system, so the manufacturer placing this oven on the market is a provider under
      Art. 2(1)(a) and keeps every obligation it has — see h_consumer_drone_subject_tracking, the
      same shape of product answered for that other actor.
    difficulty: obvious
    notes: >-
      The only case in the file where the answer depends on WHOSE obligations are being classified,
      which is what Art. 2(1) is organised around and what the ActorRole docstring says: obligations
      attach to a role, and one organisation may hold several. A classifier that reads the appliance
      instead of the deployer will answer minimal, and it will be answering a different question.
      Marketing noise is heavy and left in — this is a press release, and a real one.

  # --- IN SCOPE — near neighbour to 2(10): a consumer product is not an excluded system ----------
  - case_id: h_consumer_drone_subject_tracking
    description: >-
      A small camera drone sold to consumers to film themselves without holding anything. It can take
      off from and land on the palm of a hand, and is driven either by a button on the aircraft
      itself or from a phone app over Wi-Fi. Its automatic filming modes follow the subject from
      behind while recording and fly forward as they move away; circle the subject; fly backwards and
      then forwards with the camera held on the subject's starting position; climb and descend;
      spiral upwards around the subject; and loop around an oval path. A further mode works out which
      way the subject is moving, confirms a tracking direction from that, and then follows from that
      direction, switching to following from behind when the subject turns too fast for it and
      switching back once it re-establishes the direction; the subject exits the mode by facing the
      aircraft and standing still. In one mode the subject can make it take a photo by holding a pose
      for three seconds. Palm take-off requires subject confirmation — the aircraft has to recognise
      the person before it will fly — and if the subject leaves the camera's field of view, behind an
      obstacle or through a sharp turn, the aircraft loses them and hovers until they come back into
      frame. The manual states plainly that the aircraft does not support obstacle sensing, advises
      keeping it in visual line of sight in an open, well-lit place, and tells users to observe local
      privacy law when using the automatic filming modes. Ceiling is thirty metres and range fifty
      metres under palm control, and top horizontal speed in follow mode is eight metres a second.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers where the subject is in each video frame and steers the aircraft to keep them
      framed. Visual tracking is inference; holding a compass heading would not be.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach. The aircraft is not a system intended to interact directly with a
      natural person as an interlocutor, and in any event that a drone hovering in front of someone
      is a machine is obvious to a reasonably observant person, which is 50(1)'s own limit. Recorded
      video of a real scene is captured, not generated, so 50(2) and 50(4) are out. Subject
      confirmation locks onto the person in frame; it identifies no one against a reference database
      and assigns no one to a category on the basis of biometric data, so 50(3) is out.
    decisive_fact: >-
      A consumer product is not thereby outside the Regulation. Art. 2(10) withholds only the
      obligations of natural-person deployers in a purely personal non-professional activity; on the
      provider side Art. 2(1)(a) applies to whoever places the system on the Union market, expressly
      irrespective of whether they are established in the Union or in a third country. On the tier,
      an unmanned aircraft IS a product covered by Regulation (EU) 2018/1139 as listed at Annex
      I(B)(20) — but the AI here tracks a subject for filming, the manual states the aircraft has no
      obstacle sensing at all, and losing the subject makes it hover. It fulfils no safety function
      and is not itself the aircraft, so Art. 6(1)(a) is not met on either limb, and no Annex III area
      covers hobby filming. Minimal.
    difficulty: buried
    notes: >-
      Mirror of h_household_oven_bake_predictor: same everyday-consumer framing, opposite answer,
      because the actor is different.
      Two traps. The Art. 2(10) one — "it's a toy, someone flies it for fun, so it must be out" —
      and the Annex I one, where "unmanned aircraft" is genuinely listed and the tempting move is to
      set expected_annex_i_product to civil_aviation_uas and park at needs_review for want of
      Art. 6(1)(b). That would be wrong here for the reason batch 2's h_fundus_camera_onh_montage
      gives: (b) is only reached once (a) is met, and (a) fails when the AI is not a safety
      component. The manual's own statement that there is no obstacle sensing is what closes it, and
      it is the rare case where the negative is written down rather than inferred.
      The drone is also radio equipment under Directive 2014/53/EU at Annex I(A)(6); the same
      safety-component answer disposes of that route.

  # --- ART. 25 — the role changes hands ---------------------------------------------------------
  # Four cases for the one question in this cascade that is about WHO rather than WHAT. Each is
  # high-risk by a route the set already covers, so nothing here tests the tier: what they test is
  # whether the run notices that the organisation writing the document did not build the system.
  # That failure is silent — a reallocation missed costs nothing until a deployer reads Art. 16 as
  # somebody else's problem — so the positive labels are the whole point of the column. Every other
  # high-risk case in this set answers null, and a node measured only against those measures the
  # base rate.
  - case_id: rebadged_screening_platform
    description: >-
      A staffing agency's own-brand candidate screening service. The agency licenses a screening
      platform from a software vendor that already sells it to other recruiters, applies its own
      logo, product name and terms of service, and offers it to client companies as the agency's
      product. Client recruiters upload vacancies and applications; the platform scores each
      applicant's fit against the vacancy and returns a ranked shortlist. The agency changes
      nothing in how the scoring works and does not retrain it.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a fit score for each applicant from their application against the vacancy — the score
      is predicted, not read off a rule the agency wrote.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach. Scoring and ranking applicants is neither direct interaction with a
      natural person (50(1)) nor generation of synthetic content (50(2)); no emotion is inferred and
      nobody is categorised biometrically (50(3)); and there is no deep fake or published
      public-interest text (50(4)).
    expected_deployer_type: neither
    expected_provider_reallocation: name_or_trademark
    provider_reallocation_basis: >-
      Art. 25(1)(a) squarely: the vendor placed the platform on the market, and the agency puts its
      own name and trademark on it. The Article says so "without prejudice to contractual
      arrangements stipulating that the obligations are otherwise allocated", so the licence terms
      between them do not change the classification — the agency is the provider and owes Art. 16.
    decisive_fact: >-
      Someone else placed the system on the market and the agency sells it under its own brand.
      That is Art. 25(1)(a), and it moves the whole provider obligation set onto the agency.
    difficulty: obvious
    notes: >-
      The clean anchor for the node. Deliberately says the agency changes NOTHING about the
      scoring — limb (a) needs no modification at all, and a reading that looks for one would miss
      the commonest way a company becomes a provider without noticing.

  - case_id: retrained_promotion_ranker
    description: >-
      An internal promotion-ranking tool at a logistics company. The company bought a workforce
      analytics product from a vendor, who supplies it with a documented intended purpose and a
      conformity assessment covering the model as shipped. The company's data team then retrained
      the ranking model on ten years of its own promotion records and added new input features the
      vendor's product never used — shift-swap frequency and internal message volume — so that the
      tool now ranks employees for promotion on a different basis from the one the vendor assessed.
      It continues to rank named employees for promotion decisions.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a promotion ranking for each employee from their work history and the added
      behavioural features; the retraining is what fixes the weights, not a person.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: ranking employees is not direct interaction (50(1)), generates no
      synthetic content (50(2)), infers no emotion and categorises nobody biometrically (50(3)),
      and produces no deep fake or public-interest text (50(4)). Message VOLUME is a count, not
      content, so nothing here reads what employees wrote.
    expected_deployer_type: neither
    expected_provider_reallocation: substantial_modification
    provider_reallocation_basis: >-
      Art. 25(1)(b) on the Art. 3(23) definition, which is what makes this a substantial
      modification rather than a configuration: the retraining and the new input features were not
      foreseen or planned in the vendor's initial conformity assessment, and they change the basis
      on which the assessed intended purpose is carried out. The tool remains high-risk under
      Art. 6 — still ranking employees for promotion, Annex III(4)(b) — which is limb (b)'s own
      condition.
    decisive_fact: >-
      The company retrained the model on its own data and added features the vendor never assessed.
      Art. 3(23) makes that a substantial modification, and Art. 25(1)(b) makes the company the
      provider of the modified system.
    difficulty: obvious
    notes: >-
      Tests the limb most easily over-fired. The description states the two things Art. 3(23)
      actually requires — outside the initial conformity assessment, and affecting the assessed
      purpose — rather than relying on the word "customised", which is what a keyword reading would
      latch onto and which describes ordinary permitted configuration.

  - case_id: summariser_pointed_at_applications
    description: >-
      An HR team's use of a general-purpose document assistant. The team subscribes to a commercial
      SaaS tool sold for summarising and comparing business documents of any kind — contracts,
      reports, meeting notes — and not sold or assessed for any hiring purpose. The team has
      configured it with their own prompt templates so that it now reads each job application,
      rates the candidate against the role on a five-point scale, and orders the applications by
      that rating for the hiring manager's review. Nothing in the vendor's product was changed;
      the team supplies the instructions.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers a rating for each candidate from the application text against the role. The team wrote
      the instructions, not the mapping from application to rating — that is the model's.
    expected_annex_i_product: null
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach on this use. The tool is not held out as an interlocutor to the
      candidates, who never see it (50(1)); the ratings and ordering it produces go to the hiring
      manager as an internal assessment rather than as synthetic content put out into the world
      (50(2)); no emotion is inferred and nobody is categorised biometrically (50(3)); and there is
      no deep fake or text published to inform the public (50(4)).
    expected_deployer_type: not_stated
    expected_provider_reallocation: intended_purpose_change
    provider_reallocation_basis: >-
      Art. 25(1)(c): the vendor's tool was placed on the market for general document work and was
      not classified as high-risk, and the HR team has changed its intended purpose so that it now
      falls within Annex III(4)(a) and is high-risk under Art. 6. The limb names this case in terms
      — it reaches a system "which has not been classified as high-risk and has already been placed
      on the market". That no code was changed is beside the point; limb (c) is about purpose.
    decisive_fact: >-
      Aiming a general document tool at job applications is a change of intended purpose that makes
      it high-risk, so Art. 25(1)(c) makes the HR team its provider — of a system they only
      subscribed to.
    difficulty: buried
    notes: >-
      Two traps, and they pull opposite ways. The GPAI one: a general-purpose SaaS assistant is
      still an AI SYSTEM under Art. 3(66), and routing it to Chapter V would exempt the exact
      product Annex III(4) exists for. The Art. 25 one: "we only wrote prompts" reads as
      configuration, which is right for limb (b) and wrong here — (c) turns on the purpose, not on
      the code.

  - case_id: pump_maker_bundles_dosing_module
    description: >-
      An infusion pump manufacturer's dose-limiting module. The manufacturer licenses an AI dose
      control component from a specialist supplier and integrates it into its own infusion pump.
      The component predicts the patient's response to the infusion rate from sensor readings and
      caps delivery when a hazardous rate is predicted. The pump is placed on the market as a
      class IIb medical device under Regulation (EU) 2017/745, CE-marked following notified-body
      conformity assessment, and carries the pump manufacturer's name and trademark. The AI
      supplier is not named on the product.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers the patient's predicted response to the infusion rate from sensor readings and derives
      the delivery cap from that prediction, rather than applying a fixed limit a clinician set.
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: true
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach: the module caps a pump's delivery rate. It does not interact directly
      with a natural person (50(1)), generates no synthetic content (50(2)), infers no emotion and
      categorises nobody biometrically (50(3)), and produces no deep fake or public-interest text
      (50(4)).
    expected_provider_reallocation: product_manufacturer
    provider_reallocation_basis: >-
      Art. 25(3)(a): the AI system is a safety component of a product covered by Annex I Section A
      — Regulation (EU) 2017/745 — and it is placed on the market together with that product under
      the pump manufacturer's own name and trademark. The manufacturer is therefore the provider of
      the AI system and owes Art. 16, and the component supplier is not.
    difficulty: obvious
    decisive_fact: >-
      The AI is bought in, but the pump ships under the manufacturer's name. Art. 25(3) makes the
      product manufacturer the provider of the AI system itself — the role ActorRole lists as
      having no rules of its own precisely because this Article hands it the provider's.
    notes: >-
      The only case that reaches Art. 25 by the Annex I door rather than Annex III, and the one that
      justifies leaving product_manufacturer out of the ruleset: it needs no rules because 25(3)
      gives it the provider's whole.

  # --- THE ANNEX III(1) CARVE-OUT -------------------------------------------------------------
  # Point 1(a) lists remote biometric identification and then excludes verification "the sole
  # purpose of which is to confirm that a specific natural person is the person he or she claims to
  # be". Same venue, same faces, same cameras in both cases below — what flips the tier is the
  # DIRECTION of the match: one face against that person's own stored template, or one face against
  # a gallery of many. A classifier reading "facial recognition at a stadium" answers both alike.
  - case_id: stadium_ticket_face_verification
    description: >-
      A gate system at a sports venue that confirms a season-ticket holder at entry. The holder
      looks at a camera and the system compares the live image with the photograph stored on that
      same ticket record, returning a match or no-match for the one person presenting it. It holds
      no gallery of other faces, searches nothing, and infers nothing about the holder beyond
      whether the face is theirs. Non-matching holders are directed to a staffed desk.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers from a live camera image whether it depicts the same person as a stored photograph —
      a learned face-matching model, not a rule anyone wrote out.
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach. The gate holds no conversation with the holder (50(1)), generates no
      synthetic content (50(2)) and produces no deep fake (50(4)). Nor is it a biometric
      categorisation system under 50(3): it assigns the holder to no category, it decides only
      whether the face is the one on their own ticket.
    decisive_fact: >-
      One-to-one biometric verification whose sole purpose is confirming that the holder is who
      they claim to be — the exclusion written into Annex III(1)(a) itself. Outside point 1, and no
      other listed function is served, so the system is minimal risk. Note what does the work: the
      description says there is no gallery and no search. Face recognition at a turnstile is not
      by itself outside the area.
    difficulty: buried
    split: dev
    notes: >-
      The dev anchor for the Annex III(1)(a) carve-out, and the half a classifier gets wrong by
      over-inclusion. Pairs with stadium_banned_person_face_identification.

  - case_id: stadium_banned_person_face_identification
    description: >-
      A system at the same sports venue that reviews recorded entrance footage after each fixture
      and searches every face captured against the operator's gallery of individuals subject to a
      banning order, to establish whether any of them attended. Matches are reported to the venue's
      safety team, which decides whether to refer the incident. The venue is privately operated and
      the reviews are not carried out for or on behalf of any law enforcement authority.
    expected_risk_class: high_risk
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers from recorded video which captured faces correspond to a person in the gallery —
      a learned face-matching model applied to images no rule could resolve.
    expected_annex_i_product: null
    expected_annex_iii_area: biometrics
    expected_performs_profiling: false
    expected_derogation: null
    expected_deployer_type: neither
    expected_provider_reallocation: null
    expected_transparency_duties: []
    transparency_basis: >-
      Art. 50 does not attach. There is no direct interaction with the people filmed (50(1)), no
      synthetic content (50(2)) and no deep fake (50(4)). And 50(3) reaches emotion recognition and
      biometric CATEGORISATION — sorting people by an attribute — whereas this establishes which
      individual a face belongs to, which is identification.
    decisive_fact: >-
      Searching each captured face against a gallery of many is remote biometric IDENTIFICATION,
      Annex III(1)(a), and the point 1(a) verification exclusion does not reach it: the purpose is
      not to confirm a claim of identity made by the person in front of the camera. Not prohibited
      under Art. 5(1)(h), which reaches 'real-time' identification in publicly accessible spaces
      for law-enforcement purposes — this is post-event review by a private operator on its own
      behalf. It performs no profiling: it establishes who a face belongs to and evaluates nothing
      about them, and with no Art. 6(3)(a)-(d) condition available the derogation cannot open.
    difficulty: buried
    split: dev
    flips_from: stadium_ticket_face_verification
    notes: >-
      The identification half of the carve-out pair, and the one that keeps the exclusion honest:
      an area a classifier can be talked out of is worse than one it never had. Also the golden
      set's first biometrics case, so the first to select AIA-PO-A43-1 rather than -A43-2.

  # --- ART. 5(1)(ba) — THE SAFEGUARD BOUNDARY -------------------------------------------------
  # The two points Reg (EU) 2026/1744 inserted are the easiest in the Article to over-apply, and a
  # false `prohibited` is the most damaging verdict this tool produces: it tells an organisation to
  # withdraw a lawful product and skips the obligation check entirely. Art. 5(1a) is what separates
  # these two cases, and it turns on SAFEGUARDS, not on capability.
  - case_id: image_generator_with_safeguards
    description: >-
      A general-purpose text-to-image service for marketing teams, generating illustrations and
      product imagery from written prompts. It can render people. Nudity and sexual content are
      refused at the prompt and blocked at the output by a classifier; the model was trained to
      refuse such requests; uploading a photograph of a real person to edit is not supported.
      Reported misuse is investigated and the filters updated. Outputs carry an embedded C2PA
      provenance manifest marking them as AI-generated.
    expected_risk_class: minimal
    expected_is_ai_system: true
    is_ai_basis: >-
      Generates images inferred from a text prompt — the mapping from words to pixels is learned,
      not written down by anyone.
    expected_prohibited_practice: null
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_transparency_duties: [synthetic_content_marking]
    transparency_basis: >-
      Art. 50(2): a provider of a system generating synthetic image content must mark the output as
      artificially generated in a machine-readable format, which the C2PA manifest is. Not 50(1) —
      it takes a prompt and returns an image rather than conversing; not 50(3), which reaches
      emotion recognition and biometric categorisation; 50(4) binds the DEPLOYER who publishes a
      deep fake, not this provider.
    decisive_fact: >-
      Capability is not the test. Art. 5(1a)(a) catches a provider only where such generation is the
      INTENDED PURPOSE, or where it is a reasonably foreseeable and reproducible output AND the
      system lacks reasonable safeguards. The purpose here is marketing imagery and the description
      names refusal training, prompt refusal, output classification and misuse correction — so
      neither limb is met and the system is outside Art. 5 entirely.
    difficulty: buried
    split: dev
    notes: >-
      The FALSE-POSITIVE anchor for the two inserted points, and the more important half. A
      classifier that bans this bans every image generator on the market. Pairs with
      nudify_app_no_consent.

  - case_id: nudify_app_no_consent
    flips_from: image_generator_with_safeguards
    description: >-
      A consumer app whose advertised function is to take an uploaded photograph of a real person
      and return an altered version of that photograph with the clothing removed. It is marketed
      for use on photographs of people known to the user. The app asks for no confirmation that the
      depicted person agreed, and has no filter preventing use on any given photograph.
    expected_risk_class: prohibited
    expected_is_ai_system: true
    is_ai_basis: >-
      Infers an altered image from an input photograph — a generative model, not a rule-based
      edit.
    expected_prohibited_practice: non_consensual_intimate_imagery
    expected_transparency_duties: [synthetic_content_marking, deep_fake_disclosure]
    transparency_basis: >-
      Art. 50 attaches on its own axis and is answered even here. 50(2) binds the provider: the
      system generates synthetic image content, which must be marked machine-readably. 50(4) binds
      the deployer: manipulated imagery of a real person that would appear authentic is a deep fake,
      and its use must be disclosed. Neither 50(1) nor 50(3) applies — it holds no conversation and
      assigns nobody to a biometric category. That these duties are owed by a system Art. 5 bans is
      not a contradiction: the transparency duty attaches to what the system DOES, and the ban is
      what makes the whole practice unlawful. The obligation layer never reaches them, because the
      pipeline stops at a prohibited verdict rather than issuing a compliance checklist for a
      practice that must be withdrawn.
    decisive_fact: >-
      Art. 5(1)(ba): generating realistic imagery of an identifiable natural person's intimate parts
      without that person's explicit consent. Art. 5(1a)(a)(i) is satisfied on the plainest limb —
      producing that material is the system's INTENDED PURPOSE, so the safeguards question never
      arises. Art. 5(1b) does not save it either: removing clothing increases the exposure of
      intimate parts, which is exactly what that paragraph declines to exclude. The prohibition
      applies from 2 December 2026, so a report must give the date rather than say "withdraw now".
    difficulty: obvious
    split: dev
    notes: >-
      The first golden case for a prohibition that is enacted but NOT YET IN FORCE, which is what
      makes it worth having beyond the label: it exercises the report's two-date branch as well as
      the classifier's.
