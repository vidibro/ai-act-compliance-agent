# Layer 1 — classification golden set.
#
# Each case is a use-case DESCRIPTION (the only input a classifier sees) plus its known RISK CLASS
# and the decisive sub-answers. Ground truth is fixed by the author naming the single fact that
# forces the class — not by any judgement the classifier is trusted to make. The schema
# (ClassificationCase) re-enforces the Regulation's own invariants (Art. 5 prohibition, Art. 6(3)
# profiling carve-back, derogation => not_high_risk), so this answer key cannot contradict the law.
#
# Descriptions are ANONYMISED function descriptions — no vendor names sit next to a legal verdict.
#
# split: all current cases are `dev`; the held-out `test` split is intentionally EMPTY, to be
# authored later as fresh, never-inspected descriptions (mirrors the Layer 2 decision).

act_version_date: 2024-07-12
default_split: dev

cases:
  # --- THE FLIP (the project's headline) ------------------------------------------------------
  # Two descriptions that differ by ONE sentence, and the legal class flips. A keyword matcher
  # cannot separate them — both are about CVs and candidates — so this is the case that shows the
  # tool reads meaning, not words.
  - case_id: cv_parsing_fields
    description: >-
      An applicant-tracking feature that reads uploaded CVs and application forms and extracts
      structured fields — candidate name, contact details, employment history, education and
      skills — into the recruiter's database. It parses documents in several formats and
      normalises dates and job titles. It does not score, rank, or otherwise evaluate candidates;
      recruiters review the extracted fields themselves.
    expected_risk_class: not_high_risk
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: narrow_procedural_task
    expected_transparency_obligation: false
    transparency_basis: >-
      None of Art. 50's four paragraphs attach. It reads uploaded documents and writes fields to a
      database — it does not interact directly with candidates (50(1); the recruiter consumes the
      output), generates no synthetic content (50(2)), is not an emotion recognition or biometric
      categorisation system (50(3)), and produces no deep fake or public-interest text (50(4)).
    decisive_fact: >-
      Extraction of fields only, with no evaluation of the person — a narrow procedural task under
      Art. 6(3)(a). Falls within Annex III(4) employment but the derogation applies.
    difficulty: obvious

  - case_id: cv_parsing_plus_scoring
    flips_from: cv_parsing_fields
    description: >-
      An applicant-tracking feature that reads uploaded CVs and application forms and extracts
      structured fields — candidate name, contact details, employment history, education and
      skills — into the recruiter's database. It parses documents in several formats and
      normalises dates and job titles. It also computes a fit score from 0 to 100 for each
      candidate against the role and ranks applicants by that score for the recruiter's shortlist.
    expected_risk_class: high_risk
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_transparency_obligation: false
    transparency_basis: >-
      Unchanged from cv_parsing_fields — scoring and ranking are neither direct interaction (50(1))
      nor content generation (50(2)). Deliberate: the added sentence flips the RISK TIER and must
      leave Art. 50 alone, which is the point of keeping the two axes separate.
    decisive_fact: >-
      The added scoring/ranking sentence makes the system evaluate natural persons — profiling
      under Art. 6(3). Notwithstanding any procedural-task derogation, profiling forces high_risk.
    difficulty: buried
    notes: >-
      Differs from cv_parsing_fields by a single sentence. The decisive fact is buried in an
      otherwise identical parsing description — a keyword checker sees the same words in both.

  # --- PROHIBITED (Art. 5) — the clean, defensible case ---------------------------------------
  - case_id: emotion_monitoring_employees
    description: >-
      A workplace analytics module that processes webcam and microphone feeds of employees during
      their working day to infer emotional states — stress, engagement, frustration — and reports
      per-employee 'engagement' scores to managers.
    expected_risk_class: prohibited
    expected_prohibited: true
    expected_transparency_obligation: true  # CORRECTED 2026-07-22 (was false) — see basis
    transparency_basis: >-
      Art. 50(3): "Deployers of an emotion recognition system ... shall inform the natural persons
      exposed thereto of the operation of the system." This IS an emotion recognition system, so
      50(3) attaches by its own terms. The Art. 5 prohibition does not disapply it: Art. 50(3)'s
      only carve-out is for law-enforcement use, and Art. 5(1)(f) itself excepts medical and safety
      purposes — under which such a system may be lawfully deployed and 50(3) squarely bites.
    decisive_fact: >-
      Inference of emotions of natural persons in the workplace — an Art. 5(1)(f) prohibited
      practice. Evaluated BEFORE high-risk classification; it never reaches Art. 6.
    difficulty: obvious
    notes: >-
      Deliberately an EMPLOYEE-monitoring case (unambiguously 'workplace'), kept distinct from the
      recruitment-stage reading in emotion_screening_candidates (both now prohibited, but that one
      relies on Commission guidance to reach the hiring stage; this one does not).

  # --- PROHIBITED (was ambiguous; resolved by Commission guidance C(2025) 5052, para 254) --------
  - case_id: emotion_screening_candidates
    description: >-
      A recruitment tool that analyses facial expressions and vocal tone in candidates' recorded
      video interviews to infer emotional signals such as 'enthusiasm' and 'confidence', surfacing
      them to recruiters alongside the application.
    expected_risk_class: prohibited
    expected_prohibited: true
    expected_transparency_obligation: true  # CORRECTED 2026-07-22 (was false) — see basis
    transparency_basis: >-
      Art. 50(3), as for emotion_monitoring_employees — it is an emotion recognition system and the
      paragraph attaches to that system type regardless of the Art. 5 verdict. Arguably Art. 50(1)
      as well, since candidates respond to the system in a recorded interview; 50(3) alone is
      enough and is the cleaner basis.
    guidance_refs:
      - C-2025-5052/workplace-covers-recruitment
    decisive_fact: >-
      Art. 5(1)(f) prohibits emotion inference 'in the areas of workplace and education
      institutions'. The Commission Guidelines on prohibited practices (C(2025) 5052 final, para
      254) read 'workplace' broadly to cover the selection/hiring stage, and give emotion
      recognition during recruitment as a prohibited example — so this is PROHIBITED, not
      needs_review. NOTE: this label rests on the Commission's NON-BINDING interpretation (see
      guidance_refs); the CJEU is the ultimate authority. Was 'ambiguous' before the guidance
      resolved the hiring-context question.
    difficulty: obvious
    notes: >-
      RESOLVED (was the roadmap's 'is hiring a workplace?' open question). Commission guidance
      C(2025) 5052 final para 254 settles it: 'workplace' covers the selection/hiring stage, so this
      is prohibited. Kept as a case precisely because the resolution rests on NON-BINDING guidance,
      not the bare Article 5 text — the label carries a guidance_ref to make that dependence
      explicit and auditable.

  # --- TRANSPARENCY (Art. 50 applies even to a minimal-risk use) ------------------------------
  - case_id: job_ad_generation
    description: >-
      A drafting assistant that generates job-advertisement text from a short role brief. A
      recruiter reviews and edits the draft before it is published. The tool does not read, score,
      or evaluate any candidate.
    expected_risk_class: minimal
    expected_annex_iii_area: null
    expected_performs_profiling: false
    expected_transparency_obligation: true
    transparency_basis: >-
      Art. 50(2): providers of AI systems generating synthetic text must mark the output in a
      machine-readable format as artificially generated. The 50(2) carve-out for systems performing
      "an assistive function for standard editing" does not apply — it drafts the advert, it does
      not merely edit the user's text. The recruiter's review before publication is relevant to the
      editorial-control exception in 50(4), which concerns public-interest text and is not in play.
    decisive_fact: >-
      Content generation that evaluates no natural person — outside Annex III, so minimal risk. But
      Art. 50 transparency (AI-generated content) applies INDEPENDENTLY of the risk tier.
    difficulty: obvious
    notes: >-
      Shows an obligation attaching to a minimal-risk use: risk tier and transparency are separate
      questions.

  # --- MINIMAL (false-positive anchor: not everything in HR is high-risk) ---------------------
  - case_id: interview_scheduler
    description: >-
      A scheduling tool that proposes interview time slots by matching recruiters' and candidates'
      stated calendar availability, and sends the confirmed invitations. It does not assess,
      rank, or make any recommendation about candidates.
    expected_risk_class: minimal
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50(1) does not attach: the tool matches STATED availability and emits invitations: it is
      not intended to interact directly with candidates as an interlocutor, and 50(1) excepts what
      is obvious to a reasonably observant person in any event. Nothing is generated (50(2)), no
      emotions inferred (50(3)), no deep fake (50(4)). NOTE THE CONTRAST with the real-world
      scheduling page in data/golden_set/smoke/interview-coordination.md, which converses with
      candidates over SMS and WhatsApp — there Art. 50(1) is a much stronger fit. The label is for
      THIS description, and the difference between the two is exactly a fact a card must state.
    expected_annex_iii_area: null
    expected_performs_profiling: false
    decisive_fact: >-
      Purely logistical calendar matching with no evaluation of persons — outside Annex III(4).
      A classifier that flags anything HR-adjacent as high-risk fails here.
    difficulty: obvious
