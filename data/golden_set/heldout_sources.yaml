# Provenance for the Annex I held-out cases (batch 2 of classification_cases_heldout.yaml).
#
# WHY THE DOCUMENTS ARE NOT HERE
# These are FDA 510(k) summaries: manufacturer-authored text that a regulator publishes. Public to
# read is not public to redistribute, so the repo keeps the HASH rather than the bytes — the same
# bargain data/policy/articles/ strikes with EUR-Lex, minus the part we are not entitled to store.
# Anyone can fetch the original from `url` and verify it is byte-identical to what the cases were
# written from. That is the property that matters; carrying 8.9 MB of third-party PDFs is not.
#
# The case DESCRIPTIONS are paraphrases, not extracts. No sentence is copied across.
#
# TO VERIFY
#   curl -o K192383.pdf <url>        # browser may be required: FDA blocks automated fetching
#   shasum -a 256 K192383.pdf        # must equal `sha256` below
#
# NOTE ON THE SOURCES, which shaped four of the six answer keys: a 510(k) is a US filing and never
# states an EU conformity assessment route. Art. 6(1)(b) is therefore structurally absent from
# every document here, which is why those cases expect `needs_review` — see the DECIDED note in
# docs/ROADMAP.md under M4d-1.

retrieved_at: 2026-07-30
url_pattern: https://www.accessdata.fda.gov/cdrh_docs/pdf{YY}/{SUBMISSION}.pdf

