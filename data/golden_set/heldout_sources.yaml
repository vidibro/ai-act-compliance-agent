# Provenance for the held-out classification cases that were written from real documents
# (batches 2 and 3 of classification_cases_heldout.yaml).
#
# WHY THE DOCUMENTS ARE NOT HERE
# They are third-party material: manufacturer-authored regulatory filings, tender notices, project
# records, model cards, a user manual and a press release. Public to read is not public to
# redistribute, so the repo keeps the HASH rather than the bytes — the same bargain
# data/policy/articles/ strikes with EUR-Lex, minus the part we are not entitled to store. Anyone
# can fetch the original from `url` and verify it is byte-identical to what the case was written
# from. That is the property that matters; carrying the megabytes is not.
#
# The case DESCRIPTIONS are paraphrases, not extracts. No sentence is copied across.
#
# TO VERIFY
#   curl -L -o doc <url>       # some hosts block automated fetching; a browser may be required
#   shasum -a 256 doc          # must equal `sha256` below
#   wc -c doc                  # must equal `bytes` below
#
# `source_id` IS A GENERAL IDENTIFIER, not a filing number. It was one until batch 3, whose sources
# are not filings and have no such number. The property kept is the one that earns its place: every
# part of the identifier appears in the URL, so the citation and the fetchable document cannot drift
# apart. Scheme prefixes name the register — TED, CORDIS, HF (repo@revision), BSH, DJI — and an
# unprefixed value is an FDA 510(k) number, as batch 2 wrote them.
#
# BATCH 2 (Annex I) — a 510(k) is a US filing and never states an EU conformity assessment route.
# Art. 6(1)(b) is therefore structurally absent from every document there, which is why four of
# those cases expect `needs_review` — see the DECIDED note in docs/ROADMAP.md under M4d-1.
#
# BATCH 3 (Art. 2 scope) — these were chosen for describing a real system in enough detail, before
# reading the law on them. TED notice PDFs and the CORDIS `?format=json` records were both checked
# for byte-stability across repeated fetches; Hugging Face URLs are pinned to a commit revision, so
# `main` moving does not invalidate the hash.

