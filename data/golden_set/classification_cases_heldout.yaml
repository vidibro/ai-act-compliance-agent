# Layer 1 — classification golden set, HELD-OUT (`test`) split.
#
# Companion to classification_cases.yaml (the `dev` split). Same schema, same invariants; the only
# difference is discipline: these were authored BLIND — labelled from the enacted text, never by
# running the classifier on them. That is the whole value. The dev set was iterated against three
# times while tuning the prompt; a number from it measures fit to seven known descriptions. These
# exist to produce the first number that measures the classifier instead.
#
# THE RULES (mirror the Layer 2 held-out discipline):
#   - Do not tune prompts, thresholds or wording against these. Not once.
#   - Run at reporting time, record the date and git sha with the number.
#   - Expect a LOWER score than dev's 7/7. That is not a regression — it is the honest number
#     appearing for the first time. If it matches dev exactly, be suspicious.
#   - If ever tuned against, they are dev permanently. Say so and author fresh ones.
#
# DISTRIBUTION mirrors dev (all five risk classes) and deliberately bakes in the two traps the
# real-world smoke check found that the dev set does not exercise:
#   - h_scoring_with_oversight_theatre — a high-risk system that loudly promises human oversight
#     (legally irrelevant to the tier; a DISTRACTOR that must not pull it down).
#   - h_onboarding_logistics_crosssell — a minimal system carrying cross-sell noise for a separate
#     high-risk product (must not pull it UP — a false-positive trap).
#
# Prose is deliberately unlike the dev cases: different systems, vendors, vocabulary and structure.

act_version_date: 2024-07-12
default_split: test

cases:
  # --- HIGH_RISK, with the human-oversight distractor (smoke-check trap #1) --------------------
  - case_id: h_scoring_with_oversight_theatre
    description: >-
      A talent-acquisition module that assigns every applicant a suitability score against the
      vacancy and orders the candidate list by that score for recruiters. The product literature
      states repeatedly that a human recruiter always makes the final decision, that the tool is
      "decision-support only", and that "the human stays in control at every step".
    expected_risk_class: high_risk
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_transparency_obligation: false
    transparency_basis: >-
      None of Art. 50's paragraphs attach: scoring and ranking applicants is neither direct
      interaction (50(1)) nor content generation (50(2)); it is not emotion recognition or
      biometric categorisation (50(3)); it produces no deep fake (50(4)).
    decisive_fact: >-
      Assigns suitability scores and ranks applicants — evaluation of natural persons, i.e.
      profiling under Art. 6(3). The carve-back forces high_risk notwithstanding any derogation.
      The repeated human-oversight assurance is LEGALLY IRRELEVANT to the tier: Annex III(4)(a)
      applies whether or not a human signs off. It is a distractor, and must not lower the class.
    difficulty: obvious
    notes: >-
      Smoke-check trap #1. The real vendor page in data/golden_set/smoke/ carries this exact
      reassurance; the dev set does not, so this is the first case to test that the classifier does
      not treat 'a human decides' as a downgrade.

  # --- MINIMAL, with adjacent-product cross-sell noise (smoke-check trap #2) -------------------
  - case_id: h_onboarding_logistics_crosssell
    description: >-
      A new-hire onboarding tool that collects signed documents, schedules orientation sessions,
      tracks completion of mandatory training, and sends reminders with a per-employee checklist.
      The vendor's site also advertises, in a "you may also like" panel, a separate AI screening
      product that scores and ranks job applicants.
    expected_risk_class: minimal
    expected_annex_iii_area: null
    expected_performs_profiling: false
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: it collects documents and sends reminders — no direct interaction as
      an interlocutor (50(1)), a checklist is not synthetic content (50(2)), no emotion or biometric
      inference (50(3)), no deep fake (50(4)). The advertised screening product is a DIFFERENT
      system and is not the subject of this classification.
    decisive_fact: >-
      Purely administrative onboarding logistics — collecting documents, scheduling, tracking
      completion. No evaluation of natural persons and no Annex III(4) function, so minimal. The
      cross-sell mention of a separate scoring product belongs to another system and must not raise
      this one.
    difficulty: buried
    notes: >-
      Smoke-check trap #2 (false-positive). A genuinely minimal system whose page contains
      high-risk-sounding text belonging to a different product.

  # --- NOT_HIGH_RISK via derogation (b) — improves a completed human activity ------------------
  - case_id: h_interview_note_polisher
    description: >-
      A writing assistant that takes the free-text interview notes a hiring manager has already
      written and improves their grammar, clarity and structure before they are filed. It adds no
      assessment, score or recommendation of its own; it only rewrites what the manager wrote.
    expected_risk_class: not_high_risk
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: improves_completed_human_activity
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50(2) does not attach despite the rewriting: its carve-out covers systems performing "an
      assistive function for standard editing" that do not substantially alter the input or its
      semantics — grammar and clarity polishing of the manager's own text is exactly that. No
      interaction (50(1)), no emotion (50(3)), no deep fake (50(4)).
    decisive_fact: >-
      Improves the write-up of a completed human assessment without adding judgement of its own —
      Art. 6(3)(b) derogation. Within Annex III(4) but exempt, so not_high_risk (Art. 6(4)
      documentation still owed).
    difficulty: obvious
    notes: >-
      Deliberate contrast with dev job_ad_generation: that GENERATES text (Art. 50(2) applies);
      this only EDITS a person's text (Art. 50(2) carve-out), so transparency is false here.

  # --- NOT_HIGH_RISK via derogation (d) — preparatory task ------------------------------------
  - case_id: h_application_file_indexer
    description: >-
      A tool that receives incoming job applications, converts attachments to PDF, runs OCR, and
      indexes them by requisition so a recruiter can search them. It performs no scoring, ranking
      or evaluation of candidates; it prepares the files for the recruiter's own review.
    expected_risk_class: not_high_risk
    expected_annex_iii_area: employment
    expected_performs_profiling: false
    expected_derogation: preparatory_task
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: file conversion, OCR and indexing is not direct interaction (50(1)),
      generates no synthetic content (50(2)), infers no emotion (50(3)), produces no deep fake
      (50(4)).
    decisive_fact: >-
      Converts, OCRs and indexes applications to prepare them for the recruiter's own assessment —
      a preparatory task under Art. 6(3)(d), with no evaluation of the person. Within Annex III(4)
      but exempt, so not_high_risk.
    difficulty: obvious

  # --- PROHIBITED — Art. 5(1)(g) biometric categorisation (a DIFFERENT ground from the emotion cases)
  - case_id: h_photo_ethnicity_sorting
    description: >-
      A recruitment screening system that analyses the photographs submitted with applications to
      sort candidates into groups by inferred ethnicity and gender, which recruiters are told they
      can use to "balance the shortlist".
    expected_risk_class: prohibited
    expected_prohibited: true
    expected_transparency_obligation: true
    transparency_basis: >-
      Art. 50(3): it is a biometric categorisation system, so deployers must inform the persons
      exposed. As with the emotion cases, 50(3) attaches to the system type and its only carve-out
      is law-enforcement use — the Art. 5 prohibition does not disapply it.
    decisive_fact: >-
      Infers ethnicity — a protected characteristic — from photographs by biometric categorisation.
      Prohibited under Art. 5(1)(g). Evaluated before high-risk classification; it never reaches
      Art. 6.
    difficulty: obvious
    notes: >-
      A second prohibited GROUND, distinct from the dev emotion cases (Art. 5(1)(f)). Tests that the
      prohibited node is not narrowly keyed to emotion recognition.

  # --- NEEDS_REVIEW via INSUFFICIENT INPUT — the missing fact is the DOMAIN (annex_iii node) ---
  - case_id: h_people_analytics_unstated_domain
    description: >-
      A people-analytics platform that builds a predictive score for each individual in a client's
      database and ranks them by it. The documentation describes the modelling in detail but never
      states who the individuals are or what decision the score supports — it is sold to "HR, sales
      and customer-success teams alike".
    expected_risk_class: needs_review
    expected_annex_iii_area: null
    expected_performs_profiling: null
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Determinable even though the tier is not: it scores records with no direct interaction (50(1)),
      no content generation (50(2)), no stated emotion inference (50(3)) and no deep fake (50(4)),
      so Art. 50 does not attach regardless of who the individuals are.
    decisive_fact: >-
      THE DECISIVE FACT IS ABSENT, and it is the DOMAIN. The platform plainly evaluates individuals,
      but whether they are employees or candidates (Annex III(4) → high_risk via the profiling
      carve-back) or customers and sales leads (outside Annex III → minimal) is never stated, and
      the vendor sells it for both. Opposite tiers with nothing to choose between them, so
      needs_review.
    difficulty: insufficient
    notes: >-
      Second insufficient case. The missing fact sits at the annex_iii node (what the scored people
      are), whereas ats_workflow_unspecified in the dev set is silent at the profiling node (what
      the model ranks on). expected_performs_profiling is null because the tier is undecidable — the
      schema would otherwise force high_risk from a true here.

  # --- MINIMAL — clean out-of-scope anchor (a workplace tool that is not about employment) -----
  - case_id: h_meeting_room_optimizer
    description: >-
      An AI tool that optimises the allocation of meeting rooms and desks across an office,
      predicting demand per time-slot and suggesting bookings to facilities staff. It concerns
      rooms and equipment, not any decision about people's employment.
    expected_risk_class: minimal
    expected_annex_iii_area: null
    expected_performs_profiling: false
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: it allocates rooms, does not interact with any affected person
      (50(1)), generates no content (50(2)), infers no emotion (50(3)), produces no deep fake
      (50(4)).
    decisive_fact: >-
      Allocates rooms and desks, not people — no evaluation of natural persons and outside every
      Annex III area, so minimal. Being deployed inside a workplace does not make a facilities tool
      an employment high-risk system.
    difficulty: obvious
    notes: >-
      False-positive anchor: "in an office" is HR-adjacent noise; the function is facilities, not
      employment decisions.

  # --- MINIMAL but Art. 50(1) transparency applies — direct interaction ------------------------
  - case_id: h_candidate_faq_chatbot
    description: >-
      A chatbot on a careers site that answers applicants' questions about roles, benefits and the
      hiring timeline in natural-language conversation. It does not assess, score or rank
      applicants, and it neither makes nor influences any hiring decision.
    expected_risk_class: minimal
    expected_annex_iii_area: null
    expected_performs_profiling: false
    expected_transparency_obligation: true
    transparency_basis: >-
      Art. 50(1): the system interacts directly with natural persons (applicants) in conversation,
      so they must be informed they are dealing with an AI system unless that is obvious. Applies
      independently of the minimal risk tier.
    decisive_fact: >-
      Converses with applicants but performs no evaluation and informs no hiring decision — outside
      Annex III(4), so minimal. BUT Art. 50(1) transparency applies because it interacts directly
      with people, independent of the tier.
    difficulty: obvious
    notes: >-
      Mirrors dev job_ad_generation (minimal + Art. 50) but via a DIFFERENT paragraph — 50(1) direct
      interaction rather than 50(2) content generation.

  # --- HIGH_RISK with the decisive fact BURIED in a benign analytics description ---------------
  - case_id: h_attrition_scoring_buried
    description: >-
      A workforce-analytics dashboard that visualises headcount, turnover trends and team
      composition for HR leadership. Deep in the feature list, among charts and exports, it notes
      that the platform also computes an individual "attrition-risk score" for each employee and
      flags those judged most likely to leave.
    expected_risk_class: high_risk
    expected_annex_iii_area: employment
    expected_performs_profiling: true
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: dashboards and per-employee scores are not direct interaction
      (50(1)), generate no synthetic content (50(2)), infer no emotion (50(3)) and produce no deep
      fake (50(4)).
    decisive_fact: >-
      Buried among dashboard features, it scores individual employees for attrition risk —
      evaluation of natural persons, i.e. profiling under Art. 6(3) → high_risk notwithstanding any
      derogation. The analytics framing is the distractor; the scoring sentence is decisive.
    difficulty: buried
    notes: >-
      The flip pattern applied to employee monitoring (Annex III(4)(b)) rather than recruitment —
      one decisive sentence inside a mostly-benign dashboard description.

  # ================================================================================================
  # BATCH 2 — Art. 6(1) / Annex I. Authored from six FDA 510(k) summaries for AI-enabled medical
  # devices, paraphrased. Same blind discipline as batch 1; the classifier was never run on them.
  #
  # WHY THIS BATCH EXISTS. Batch 1 and the dev set are all Annex III (employment). Nothing exercised
  # Art. 6(1) — the OTHER door to high_risk, and a conjunction, which is a different shape of
  # question: not "which listed area is this?" but "is this AI a safety component of, or itself, a
  # product under Annex I, AND does that product need a notified body?".
  #
  # THE STRUCTURAL FACT ABOUT THE SOURCES. A 510(k) is a US filing. It never states an EU conformity
  # route, so Art. 6(1)(b) is systematically absent from every one of these documents. Where (a) is
  # met, that leaves the tier undecidable and needs_review is the only honest key — four of the six
  # land there. This is not a quirk of authoring; it is what real provider documentation for a
  # third-country medical device looks like, and it is worth measuring. The alternative — reading
  # "Class II" on an FDA form as an MDR risk class, or supplying the MDR classification rules from
  # memory — would invent the missing fact and hand a provider a conclusion it never claimed.
  #
  # WHAT IS PINNED. Where condition (a) IS established, the case sets expected_annex_i_product and
  # leaves expected_third_party_assessment null. That is deliberate: per the schema it pins only
  # half the test, which is exactly the half these documents support.
  # ================================================================================================

  # --- NEEDS_REVIEW — Art. 6(1)(b) absent AND the Annex III(5)(d) reading contested -------------
  - case_id: h_lvo_triage_notification
    description: >-
      A radiology workflow tool that runs on head CT-angiography studies as they arrive, using a
      deep-learning model to flag series it suspects contain a large vessel occlusion and to push a
      pop-up notification to the radiologist's worklist desktop. The notification carries the patient
      name, accession number and the pathology, plus a small compressed black-and-white preview
      labelled not for diagnostic use. The vendor states the tool does not alter the original image,
      adds no markings to it, does not remove cases from the standard first-in-first-out reading
      queue, and runs in parallel with routine interpretation, which remains the default for every
      case; users may switch notifications off for particular pathologies or imaging centres, and
      doing so does not change the order in which notifications appear. Notified clinicians remain
      responsible for reviewing the full study to the usual standard, and results are meant to be
      weighed together with other patient information and the reader's own professional judgement to
      assist triage and prioritisation of images. Scope is adult head CTA at 0.5 to 1.0 mm slices
      from 64-slice or better scanners, excluding technically inadequate scans. In a retrospective
      blinded study of 383 cases across three US sites, sensitivity was 88.8% and specificity 87.2%,
      and mean time from a study arriving to a notification going out was 3.8 minutes. The
      radiologist who receives a notification then contacts a neurologist, neuro-interventionalist or
      other clinician able to treat stroke patients. Cleared as a Class II radiological
      computer-aided triage and notification software device.
    expected_risk_class: needs_review
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_annex_iii_area: null
    expected_performs_profiling: null
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Determinable even though the tier is not. Art. 50(1) does not attach: a worklist pop-up is not
      a system intended to interact directly with a natural person as an interlocutor, and in any
      event that it is software is obvious to the radiologist using it. Art. 50(2) does not attach:
      the preview is a compressed copy of the captured scan, not synthetic content, and the
      description says the original image is not altered. No emotion inference or biometric
      categorisation (50(3)) — the model detects a vascular occlusion, it assigns no person to a
      category on the basis of biometric data. No deep fake (50(4)).
    decisive_fact: >-
      The tier cannot be fixed from this description, on two independent grounds. Condition (a) is
      plausibly met — software with a medical purpose, so a product covered by Regulation (EU)
      2017/745 at Annex I(A)(11) — but Art. 6(1) is a CONJUNCTION and the description never says
      whether that product must undergo third-party conformity assessment, so (b) is unresolved.
      Separately, whether flagging suspected stroke studies for earlier reading is an "emergency
      healthcare patient triage system" within Annex III(5)(d) is genuinely arguable: it establishes
      reading priority in an acute setting, yet the description states it does not reorder the
      standard queue and runs alongside routine interpretation. Two open doors, neither closable from
      the text, so needs_review.
    difficulty: ambiguous
    split: test
    notes: >-
      Both honest options from the brief are in play here and the case takes NEITHER cleanly: the
      Art. 6(1)(b) gap is a missing-input problem (insufficient), the Annex III(5)(d) question is a
      contested-law problem (ambiguous). Banded as `ambiguous` because the contested reading is the
      distinctive thing to measure — a classifier that silently resolves Annex III(5)(d) either way
      is asserting more than the text supports. The heavy "human stays responsible" language is a
      distractor: it bears on Art. 6(3), which derogates from Art. 6(2) only and cannot reach a
      system whose Art. 6(1) status is the open question.

  # --- NEEDS_REVIEW — Art. 6(1)(a) met on the "itself a product" limb, (b) absent ---------------
  - case_id: h_autonomous_retinopathy_screening
    description: >-
      An autonomous screening system that analyses colour fundus photographs to decide whether a
      patient has more than mild diabetic retinopathy, indicated for use by healthcare providers on
      adults with diagnosed diabetes who have not previously been diagnosed with retinopathy. Two
      images per eye are captured on one specified fundus camera by an operator whom on-screen
      prompts walk through acquisition one image at a time; the images travel to the vendor's
      servers, where an analysis component judges exam quality and the presence or absence of the
      condition and returns one of three results to the client software: refer to an eye care
      professional, rescreen in twelve months, or image quality insufficient. Nothing beyond the
      fundus images is needed to perform the analysis. This submission is a version update that
      replaces the image-quality classifier and makes the analysis faster, and it adds a green tick
      or red cross on the submission feedback screen plus clearer wording when repeated attempts
      still fail on quality. A retrospective study on data from 850 evaluable participants gave
      sensitivity of about 88% and specificity of about 90% on final-submission images, with about
      95% of participants receiving a result at all. The filing also describes hazard analysis,
      cybersecurity controls covering confidentiality, integrity, availability, denial of service and
      malware, and a protocol governing which future algorithm changes would require a fresh
      submission. Regulated as a Class II retinal diagnostic software device.
    expected_risk_class: needs_review
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_annex_iii_area: null
    expected_performs_profiling: null
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50(1) does not attach: the stated user is a healthcare provider operating a GUI, not a
      natural person interacting with the system as an interlocutor, and the description says nothing
      about the patient being addressed by the system at all. No synthetic content is generated
      (50(2)) and no deep fake (50(4)). Art. 50(3) is the arguable one and the answer is no: the
      system's purpose is to detect a disease from an eye image, not to assign natural persons to
      categories on the basis of biometric data within Art. 3(40) — see notes, this is the most
      contestable label in the batch.
    decisive_fact: >-
      The AI system is ITSELF the product — autonomous software whose output is a referral decision
      about a patient — so Art. 6(1)(a) is met on its second limb, via Regulation (EU) 2017/745 at
      Annex I(A)(11). What the description never states is Art. 6(1)(b): whether that product is
      required to undergo third-party conformity assessment under that legislation. Art. 6(1) is a
      conjunction, and the system falls outside every Annex III area, so with (b) absent there is no
      other route to a tier. needs_review.
    difficulty: insufficient
    split: test
    notes: >-
      Recorded as insufficient rather than reasoned to a class: the second option in the brief. The
      absent fact is Art. 6(1)(b) and it is structurally absent — a 510(k) cannot contain it.
      Deliberate contrast with h_cardiac_mapping_autocontour, which is missing the SAME fact but
      meets (a) on the OTHER limb (safety component, not itself a product); a classifier that
      collapses the two limbs will look identical on both and should not.
      CONTESTABLE, recorded rather than hidden: Art. 3(34) defines biometric data without the GDPR's
      unique-identification qualifier, and Art. 3(40) defines a biometric categorisation system as
      one assigning persons to categories on the basis of biometric data, with no sensitivity
      qualifier. A retinal image sorted into "referable disease / not" is not obviously outside that
      wording. The label here reads Art. 50(3) purpose-bound and in the light of Annex III(1), which
      frames biometrics as identification, categorisation by protected attribute, and emotion — none
      of which is what a disease detector does. A reviewer could disagree.

  # --- MINIMAL — an AI component of an Annex I product that is NOT a safety component -----------
  - case_id: h_fundus_camera_onh_montage
    description: >-
      A high-resolution ophthalmic camera for in-vivo imaging of the eye, indicated to capture,
      display, annotate and store images that aid clinicians in diagnosing and monitoring conditions
      of the retina, ocular surface and visible adnexa, and to help visualise retinal and choroidal
      vascular structures in angiography. Imaging modes include true colour, fundus autofluorescence
      with green or blue excitation, fluorescein angiography, indocyanine green angiography and
      simultaneous FA plus ICGA, in stereo, widefield, ultra-widefield and montage fields of view; a
      single capture yields a 90-degree image and two are merged automatically into a 135-degree
      ultra-widefield view. The instrument uses slit-scanning broad-line fundus imaging with red,
      green and blue LEDs plus a near-infrared laser diode for live preview, 12-megapixel monochrome
      sensors, a chin and forehead rest, a joystick, and a 22-inch external display, and it exports
      through DICOM, PACS, network drives and USB. Intended users are listed as opticians, ophthalmic
      photographers, optometrists, ophthalmologists, medical assistants and clinical researchers. A
      deep-learning algorithm detects the optic nerve head so that the ultra-widefield montage no
      longer depends on the patient fixating accurately: the software locates the optic nerve and
      works out from the captured images where the patient was gazing at the moment of capture. Other
      additions in this version are simultaneous FA and ICGA capture, an angiography movie mode,
      manual placement of ETDRS grids over the pictures to help identify a grading level, an ICGA
      boost mode, and an eight-picture side-by-side view. A live infrared preview lets the technician
      confirm image quality and check for lid and lash obstructions before imaging, so fewer
      recaptures are needed. The filing reports biocompatibility testing on patient-contacting
      accessories, laser, electrical and electromagnetic compatibility results against a list of
      standards, bench testing, software verification and validation, and a clinical assessment in
      which three independent graders found the angiography image quality clinically acceptable.
      Regulated as a Class II ophthalmic camera.
    expected_risk_class: minimal
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_performs_profiling: false
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: a camera operated by a technician is not a system interacting directly
      with a natural person as an interlocutor (50(1)); merging captured photographs generates no
      synthetic audio, image, video or text content (50(2)); locating an anatomical landmark to align
      an image infers no emotion and assigns no person to a category (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      The only AI in a long optics-and-safety filing is an optic-nerve-head detector whose job is to
      work out where the patient was looking so the montage can be assembled without accurate
      fixation. That is an image-assembly function: it fulfils no safety function for the camera, and
      the description gives no basis for saying its malfunction endangers health or safety
      (Art. 3(14)) — the clinician still diagnoses from the images, and the technician checks quality
      on live preview before capture. So Art. 6(1)(a) fails on the safety-component limb, the AI is
      not itself the product, and no Annex III area covers ophthalmic imaging: minimal.
    difficulty: buried
    split: test
    notes: >-
      Reasoned to a class the document supports — the first option in the brief — rather than parked
      at needs_review, because here condition (a) fails and Art. 6(1)(b) never has to be reached.
      That is the point of the case: the systematically-absent (b) only matters once (a) is met, and
      a classifier should not raise it here.
      Buried by construction: one AI sentence inside pages of LEDs, filters, humidity ranges and
      sterilisation standards. Two ways to get it wrong — miss the AI entirely, or treat "Class II
      medical device with a deep-learning algorithm" as sufficient for Art. 6(1) without asking
      whether the component is a SAFETY component.
      CONTESTABLE: a mis-assembled ultra-widefield montage could in principle conceal pathology,
      which is a route to arguing the second limb of Art. 3(14). The description does not support it
      — no hazard of that kind is stated — but a reviewer could reach for it.

  # --- NEEDS_REVIEW — Art. 6(1)(a) met on the SAFETY-COMPONENT limb, (b) absent -----------------
  - case_id: h_cardiac_mapping_autocontour
    description: >-
      A catheter-based cardiac mapping system used during electrophysiology procedures, which
      acquires a navigation catheter's location together with intracardiac ECG signals and renders
      three-dimensional anatomical and electro-anatomical maps of the heart; it gives the operator
      information about the heart's electrical activity and about where the catheter is during the
      procedure. Any patient eligible for a conventional electrophysiology procedure may be treated
      with it. Location comes from magnetic sensor technology and an advanced catheter location
      technology, and the system ships as a patient interface unit, a workstation with a graphical
      interface, wide-screen monitors, intracardiac in and out ports, a power supply, a patch
      connection box and cables, a pedal, a location pad and a signal-processing unit; the hardware
      is unchanged from the previous version. This version retires the legacy fast-anatomical-mapping
      module, replacing it with one that maps the left atrium, the left ventricle and their
      substructures automatically from ultrasound, to cut manual contouring: its locked AI algorithms
      automatically identify cardiac structures overlaid on the intracardiac echo images, create
      two-dimensional contours of those structures, and build a three-dimensional shell used as the
      baseline for reconstructing the two chambers. A second new module uses a locked AI algorithm to
      generate a left-atrial shell when mapping with one particular catheter, and the acquired volume
      can be refined further with the platform's existing mapping tools. Training and validation data
      covered a representative range of chamber volumes, geographical locations, ultrasound scanners,
      scanner settings and catheters, and were drawn from CT scans and from prior cases on the same
      platform. Post-market user feedback and complaints will be monitored routinely under the
      manufacturer's quality system, and an authorised change-control plan permits retraining the
      models on additional datasets, model optimisation, more anatomical structures, further input
      devices, extra map colouring and display of information imported from an external device,
      without a new submission. Unit, design, functional and retrospective validation testing on
      recorded historical procedures all passed, and animal testing under simulated clinical
      conditions met its protocol. Regulated as a Class II programmable diagnostic computer.
    expected_risk_class: needs_review
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_annex_iii_area: null
    expected_performs_profiling: null
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: an operator reading a map during a procedure is not interacting with
      the system as an interlocutor and knows it is software (50(1)); maps reconstructed from measured
      ultrasound and electrical signals are not synthetic content (50(2)); no emotion inference or
      biometric categorisation (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      The AI builds the anatomical map the operator navigates a catheter by inside a beating heart —
      it identifies the cardiac structures on the echo images and creates the 3D shell used as the
      baseline for chamber reconstruction — so it is a safety component of a product covered by
      Regulation (EU) 2017/745 (Annex I(A)(11)): its failure or malfunctioning endangers the health
      and safety of persons within Art. 3(14), which is condition (a). Art. 6(1)(b) is the missing
      half — the description never says whether that product requires third-party conformity
      assessment — and no Annex III area covers cardiac procedures, so there is no second route.
      needs_review.
    difficulty: insufficient
    split: test
    notes: >-
      Recorded as insufficient, per the brief's second option. Pairs with
      h_autonomous_retinopathy_screening: same absent fact, other limb of condition (a). Also carries
      a live Art. 43(4) / Art. 3(23) hook that this batch does not key — an authorised plan to retrain
      the models post-market — deliberately left in the description as realistic noise for a
      classification-only case.

  # --- MINIMAL — the description itself rules out the safety function (clean negative) ----------
  - case_id: h_pap_comfort_setting_recommender
    description: >-
      An optional machine-learning software accessory for positive airway pressure therapy devices
      that recommends comfort settings — ramp, expiratory pressure relief and its level, and an
      automatic response setting — to help patients settle in during onboarding and early therapy
      adaptation. It is indicated for healthcare professionals and patients, in a home or clinical
      environment. From patient-specific input data it produces a short list of predefined
      configuration options, all within the connected device's already-cleared configuration limits,
      which the patient or the healthcare provider can review, accept, disregard or adjust further
      according to personal preference or clinical guidance. It does not adjust device settings by
      itself, does not modify prescribed therapy parameters, does not create new settings, does not
      alter configuration limits, and does not deliver or control therapy; it is reached through an
      application programming interface and has no user interface or end-user access of its own. The
      manufacturer states that it identified no hazard and no critical task that would plausibly
      injure or otherwise harm a patient, so usability and human-factors testing were not
      required, and that no clinical study was needed because model performance was characterised on
      retrospective de-identified data representative of the intended population. Retrospective
      comparison against default configurations showed more nightly usage and more days of use while
      residual apnoea-hypopnoea index and mask leak stayed comparable. An authorised change-control
      plan allows performance and data-drift updates and infrastructure updates, evaluated against
      predefined metrics; it permits no continuously learning algorithms, and every model change is
      trained, tuned and locked before release. It is filed under the same Class II noncontinuous
      ventilator product code as the companion patient app it is compared against.
    expected_risk_class: minimal
    expected_annex_i_product: null
    expected_annex_iii_area: null
    expected_performs_profiling: null
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50(1) does not attach and the description says why in terms: the software has no user
      interface or end-user access and is reached only through an API, so it is not a system intended
      to interact directly with natural persons. A list of predefined configuration options is not
      synthetic audio, image, video or text content (50(2)); no emotion inference or biometric
      categorisation (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      The recommendations are optional and non-therapeutic, stay inside the connected device's
      already-cleared configuration limits, change no setting and no prescribed parameter, and the
      description states that no hazard or critical task reasonably likely to cause injury was
      identified. On those facts the software fulfils no safety function for the therapy device and
      its malfunction does not endanger health or safety, so it is not a safety component within
      Art. 3(14) and Art. 6(1)(a) is not met. It is outside every Annex III area. Minimal.
    difficulty: obvious
    split: test
    notes: >-
      Reasoned to a supported class (the brief's first option). The batch's clean false-positive
      anchor, and the only one whose negative is stated rather than inferred.
      The distractor is the product code: this thing is filed as a "noncontinuous ventilator", which
      names the host device family, not a safety role for the accessory. A classifier that reads
      "ventilator" and reaches for Annex I(A)(11) is keyword-matching. expected_performs_profiling is
      null, not false: individualised recommendations from patient-specific data are arguably
      profiling, but the question decides nothing here — the Art. 6(3) carve-back derogates from
      Art. 6(2) and cannot reach a system outside Annex III.

  # --- NEEDS_REVIEW — safety component BURIED in a table, and (b) absent ------------------------
  - case_id: h_prostate_resection_plan_landmarks
    description: >-
      A robotic system indicated for resecting and removing prostatic tissue from men who have lower
      urinary tract symptoms caused by benign prostatic hyperplasia. It comprises a tower with
      touchscreen surgeon and support-staff monitors, system software and an embedded operating
      system, a motorpack, handpiece and probe arms and a foot pedal; a reusable biplane transrectal
      ultrasound probe that supplies the imaging for the procedure; and a single-use sterile handpiece
      with an integrated digital scope, passed endoscopically through the urethra to visualise, resect
      and remove prostatic tissue with a waterjet. The intended user is a urologist supported by
      operating-room staff, trained and familiar with endoscopic BPH surgery such as TURP and with
      recognising and managing its complications, and also trained in transrectal ultrasound imaging.
      During the planning step an optional AI feature can be toggled on: in the transverse view at the
      angle-and-depth step it supplies the handpiece nozzle position and the prostate capsule
      boundary, and at the profile-landmark step in the sagittal view it places the four landmarks —
      treatment start, bladder neck, mid-prostate and treatment end — which the surgeon may then
      adjust as needed. This version carries an updated model for that same landmark identification.
      Physician authorisation can now be enabled either on the surgeon monitor or by pressing a button
      on the motorpack, where previously it was only on the surgeon monitor. The default orientation
      of the verumontanum protection zone cannot be modified in the transverse plane, while its length
      can be modified in the sagittal plane. The tower is provided non-sterile and does not contact
      the patient; the probe is now validated for 71 reprocessing cycles rather than 25 and two
      further reprocessing methods are documented; the handpiece shelf life goes from six to
      twenty-four months. Software allows the Wi-Fi cloud connection to be enabled or disabled and
      users may choose a disconnected system. Design validation used simulated-use and cadaver
      testing, and the filing tabulates passing results against standards for robotically assisted
      surgical equipment basic safety, endoscopic equipment, usability and human factors,
      electromagnetic compatibility, sterilisation, biocompatibility, packaging and transit,
      cybersecurity, and good machine learning practice. Regulated as a Class II fluid jet system for
      prostate tissue removal.
    expected_risk_class: needs_review
    expected_annex_i_product: medical_devices
    expected_third_party_assessment: null
    expected_annex_iii_area: null
    expected_performs_profiling: null
    expected_derogation: null
    expected_transparency_obligation: false
    transparency_basis: >-
      Art. 50 does not attach: a surgeon operating a touchscreen during a procedure is not
      interacting with the system as an interlocutor (50(1)); placing landmarks on captured
      ultrasound images generates no synthetic content (50(2)); no emotion inference or biometric
      categorisation (50(3)); no deep fake (50(4)).
    decisive_fact: >-
      In one row of a comparison table, the optional AI places the prostate capsule boundary and the
      four profile landmarks — treatment start, bladder neck, mid-prostate, treatment end — that
      define where a waterjet resects tissue inside the prostate. That is a safety component of a
      product covered by Regulation (EU) 2017/745 (Annex I(A)(11)): malfunctioning landmark placement
      endangers health and safety within Art. 3(14), and the surgeon's ability to adjust the
      landmarks does not change the tier any more than human sign-off does under Art. 6. Art. 6(1)(b)
      — whether the product requires third-party conformity assessment — is never stated, and no
      Annex III area covers surgical resection. needs_review.
    difficulty: insufficient
    split: test
    notes: >-
      Recorded as insufficient, per the brief's second option, but it doubles as the batch's hardest
      LOCATE problem: the AI appears once, inside a table row, in a filing otherwise about
      sterilisation cycles, shelf life and packaging. Banded `insufficient` because that is the band
      the expected answer belongs to — needs_review is the only correct answer where the decisive
      fact is absent — and a classifier that never finds the AI at all will also say needs_review,
      for the wrong reason. Read this one's decisive_fact, not just its label, when scoring.
      Contrast with h_pap_comfort_setting_recommender: both are optional AI features a human can
      override inside a medical device, and they land differently, because one places the resection
      plan and the other suggests a comfort setting.
