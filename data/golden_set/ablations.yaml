    ablation: present_but_inadequate
    difficulty: ambiguous
    # A SUBSTANCE CHECK, so the bare assertion below is INADEQUATE and the default expectation
    # stands. Art. 12(1) requires the logging capability and Art. 12(2) fixes the three purposes it
    # must serve, which AIA-HR-A12 carries as a qualifier — its `evidence_expected` ends by saying
