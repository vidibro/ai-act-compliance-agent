# Ablation plan — how the reference document is degraded to produce test cases.
#
# Ground truth here is EXACT, not judged: we know precisely what was removed, hollowed out, or
# swapped for marketing text, so the expected verdict follows by construction.
#
# One case = one rule degraded, everything else left intact. That gives every case two signals at
# once:
#   - does the checker CATCH the degraded rule?          (expected verdict below)
#   - does it leave every other applicable rule alone?   (expected PASS — the false-positive test)
# A checker that flags everything is useless, so untouched rules matter as much as ablated ones.
#
# ablation types (see schemas/enums.py AblationType):
#   removed               -> section deleted outright                      -> expect GAP
#   present_but_inadequate-> section reduced to an empty assertion         -> expect INADEQUATE
#   distractor            -> plausible but non-responsive marketing text   -> expect GAP
#   untouched             -> nothing degraded (the pristine document)      -> expect PASS
#
# split: `dev` cases may be tuned against (judge prompts, thresholds); `test` cases are HELD OUT
# and are the only ones whose score may be reported. A case's split defaults to `default_split`
# below, or `test` if unset (a case is never tuned-against by accident).
#
# FOR NOW: every case is `dev`. The held-out `test` set is intentionally EMPTY — it will be authored
# later as fresh, never-inspected documents, so the reported number stays honest. This commit is the
# structure only.

reference: hr-candidate-scoring.md
system_id: hr-candidate-scoring
# Which Annex III area the document's system falls in. Read, not assumed: the rules a case is
# scored on are SELECTED for this area, so a document describing something else would be judged
# against obligations it does not owe.
annex_iii_area: employment
default_split: dev  # all current cases are dev; test set to be authored later (held out)

