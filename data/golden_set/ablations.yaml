# Ablation plan — how the reference document is degraded to produce test cases.
#
# Ground truth here is EXACT, not judged: we know precisely what was removed, hollowed out, or
# swapped for marketing text, so the expected verdict follows by construction.
#
# One case = one rule degraded, everything else left intact. That gives every case two signals at
# once:
#   - does the checker CATCH the degraded rule?          (expected verdict below)
#   - does it leave the other 6 rules alone?             (expected PASS — the false-positive test)
# A checker that flags everything is useless, so untouched rules matter as much as ablated ones.
#
# ablation types (see schemas/enums.py AblationType):
#   removed               -> section deleted outright                      -> expect GAP
#   present_but_inadequate-> section reduced to an empty assertion         -> expect INADEQUATE
#   distractor            -> plausible but non-responsive marketing text   -> expect GAP
#   untouched             -> nothing degraded (the pristine document)      -> expect PASS

reference: hr-candidate-scoring.md
system_id: hr-candidate-scoring

