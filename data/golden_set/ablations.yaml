    # the rule. Marked `ambiguous` because the replacement asserts the capability accurately and
    # only the content is missing: what it probes is whether the judge reads past the assertion to
    # what Art. 12(2) requires the log to contain.
    replacement: |
      ## 6. Record-keeping and logging

      The system automatically records events (logs) over its lifetime. Logging is enabled by
      default and cannot be disabled by the deployer.

