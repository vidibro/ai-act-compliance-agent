[project]
name = "ai-act-compliance-agent"
version = "0.1.0"
description = "Agent that classifies AI systems under Regulation (EU) 2024/1689 and audits documentation against provider obligations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "litellm>=1.40",
    # Pinned to the v2 line: LiteLLM's built-in "langfuse" success-callback targets the v2 SDK
    # shape (langfuse.version.__version__), which the v3/v4 rewrite removed — with 4.x installed the
    # callback raises `module 'langfuse' has no attribute 'version'` on the first traced call.
    "langfuse>=2.60,<3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
    # Reads the PDFs readers upload to the report app (aiact.report_app.uploads), and the
    # Commission guidance PDFs in the data pipeline (aiact.guidance_text).
    "pdfplumber>=0.11.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-xdist>=3.8.0",
    # The second, independent engine behind the guidance extraction's two-engine check
    # (aiact.guidance_text.pdfium_body_text) — development only, like the check itself.
    "pypdfium2>=5.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiact"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Parallel across all cores; pass `-n0` to run in one process, e.g. under a debugger.
addopts = "-n auto"

[tool.mypy]
# Type-checks our code — including Protocol conformance (that e.g. ScriptedBrain and LLMBrain
# actually satisfy NodeBrain, signatures and all). This is the PHP-`implements`-style guarantee,
# enforced at check time rather than at runtime.
python_version = "3.12"
files = ["src", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
# Third-party libs without type stubs — don't fail on their internals.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Heavy third-party libs: don't follow into them (some ship stubs using newer syntax,
# e.g. numpy's PEP 695 `type` statements). We only want to type-check OUR code, treating these as
# opaque. This is scope control, not laziness — their internals aren't our contract.
module = [
    "langgraph.*",
    "litellm.*",
    "langfuse.*",
    "chromadb.*",
    "numpy.*",
]
follow_imports = "skip"
ignore_missing_imports = true
